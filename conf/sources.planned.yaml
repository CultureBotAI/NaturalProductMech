# Sources this repository PLANS to read, staged for M2.
#
# Deliberately NOT conf/sources.yaml. That file lists what the pipeline
# actually reads, and scripts/check_source_queue.py enforces the pair of
# invariants that makes it meaningful: every source in it needs an ADOPTED
# queue row, and every ADOPTED row needs a section in it. At M1 the pipeline
# reads nothing, so putting these blocks there would make both claims false on
# the first commit.
#
# Adopting a source is one pull request that moves its block from here to
# conf/sources.yaml, moves its queue row to ADOPTED with verified terms, adds
# the extractor and the committed inventory with its manifest entry, and names
# it in ATTRIBUTION.md. See CLAUDE.md, "Adopting a data source".

# NOTHING IS ADOPTED YET. This file declares the Phase A intent that M2 will
# implement; `curation/source_queue.tsv` is the ranked candidate list and
# `scripts/check_source_queue.py` refuses a queue row claiming ADOPTED that
# this file does not read.



lotus:
  name: LOTUS
  description: >-
    Referenced structure-organism occurrence triples. Fills `occurrences` and
    never `producer_organisms`: an occurrence may reflect biosynthesis,
    symbiosis, diet, uptake or contamination, and does not say which.
  homepage: https://lotus.nprod.net/
  # CC0 via the Wikidata route (main-namespace structured data). The Zenodo
  # frozen export is tagged CC BY 4.0 instead, so the route decides the terms
  # and data/raw/MANIFEST.yaml must record which one was fetched.
  route: wikidata
  license: CC0
  fills: occurrences

pubchem:
  name: PubChem
  description: >-
    Structures for concepts an adopted source names without one. PubChem is an
    aggregator whose reuse conditions are set per depositor, so this is narrow
    by design: only CIDs an adopted source already cross-references.
  homepage: https://pubchem.ncbi.nlm.nih.gov/
  license: public domain (per-source conditions respected)


