# Targets for scripts/validate_id_label_correspondence.py (vendored from claw).
#
# Which surfaces of this corpus carry an (id, label) pair claiming that an
# ontology term denotes the thing the label names, and how strictly the label
# must correspond to the ontology's own.
#
# A CURIE prefix is handled three ways: in `adapters` it is looked up through
# that OAK ontology; in `ignored_prefixes` it is a legitimate non-OAK id and
# the pair is SKIPPED_NO_ADAPTER; neither, and it is UNKNOWN_PREFIX (ERROR),
# a typo or an unexpected new prefix that has to be triaged.
#
# What is checked, and against what:
#   identifier / label                       the record's own identity, when
#                                            grounded to ChEBI; minted
#                                            `naturalproductmech:` ids skip
#   taxon_id / taxon_label                   producers, occurrences, molecular
#                                            targets (NCBITaxon)
#   organism_taxon_id / organism_label       gene clusters (NCBITaxon)
#   target_organism_id / target_organism_label   bioactivity assays (NCBITaxon)
#   target_id / target_label                 molecular targets (UniProtKB, skip)
#   enzyme_id / enzyme_label                 pathway steps (empty until M6)
#   identifier / label on causal-graph nodes (empty until M6)
#
# NCBITaxon is listed and skipped, deliberately. The taxon pairs are the
# largest surface in the corpus and the only adapter OAK offers is a 13.5 GB
# semantic-sql database, above what a CI cache can hold. The pairs stay in
# `pairs` so the drift report counts them as SKIPPED_NO_ADAPTER instead of
# omitting them; `tests/test_corpus.py::test_taxon_labels_stay_consistent_for_an_id`
# guards the one shape of the defect the corpus can check on its own. The fix
# is a corpus-scoped adapter derived from NCBI's names.dmp, not a bigger cache
# (#64).
#
# `source_concepts` is excluded: `source_label` is what the source called the
# concept, quoted as provenance, so a difference from ChEBI's label is the data,
# not drift. `related_records` is excluded: a sibling-corpus id with no
# ontology behind it and no label beside it, which the walker would otherwise
# report as EMPTY_LABEL. Nothing else is excluded, so a new (id, label) pair
# anywhere in a record is checked by default.

adapters:
  CHEBI: sqlite:obo:chebi
  # A corpus-scoped adapter, not OAK's NCBITaxon build. That one is a 13.5 GB
  # semantic-sql database, far above what CI can cache, which is why this
  # surface — the corpus's largest, about 13,700 pairs — went unchecked (#64).
  # data/raw/corpus_taxa.obo carries the same names from the same taxdump the
  # corpus resolves against, for the taxa the adopted sources can supply.
  NCBITaxon: simpleobo:data/raw/corpus_taxa.obo

ignored_prefixes:
  - naturalproductmech   # minted, content-hashed ids for ungrounded structures
  - UniProtKB            # protein accessions; the label is the protein name

# A label matching an exact or related synonym is accepted: the corpus prefers
# the name the literature uses over ChEBI's systematic primary label.
synonym_scope: exact_related

targets:
  # The record's own identity and its non-taxon groundings. Blocking: 362
  # grounded records, and the 21 residuals below are each an exact pair with a
  # reason.
  - name: record_identity
    kind: yaml
    glob: "data/natural_products/**/*.yaml"
    required: true
    policy: canonical_or_synonym
    pairs:
      - [identifier, label]
      - [target_id, target_label]
      - [enzyme_id, enzyme_label]
    exclude_keys: [source_concepts, related_records]
    # Accepted, not fixed. Eighteen are the same name in the corpus's own
    # typography — Greek letters and a Unicode minus, which docs/HARMONIZATION.md
    # prefers and which the validator's normaliser does not fold to ChEBI's
    # spelled-out `alpha`/`beta`/`(-)`. Three are name variants on a structure
    # ChEBI grounds by InChIKey: a curator confirms or relabels, and the entry
    # stops applying the moment the label changes. Each entry is an exact
    # (id, label) pair.
    exceptions:
      - { id: "CHEBI:338412", label: "(−)-anisomycin", reason: "typography: Unicode minus" }
      - { id: "CHEBI:79391", label: "(−)-chuangxinmycin", reason: "typography: Unicode minus" }
      - { id: "CHEBI:66678", label: "(−)-marinopyrrole A", reason: "typography: Unicode minus" }
      - { id: "CHEBI:66679", label: "(−)-marinopyrrole B", reason: "typography: Unicode minus" }
      - { id: "CHEBI:73237", label: "(−)-noscapine", reason: "typography: Unicode minus" }
      - { id: "CHEBI:64974", label: "(−)-microperfuranone", reason: "typography: Unicode minus" }
      - { id: "CHEBI:46702", label: "(−)-geosmin", reason: "typography: Unicode minus" }
      - { id: "CHEBI:63703", label: "(−)-δ-cadinene", reason: "typography: Unicode minus, Greek letter" }
      - { id: "CHEBI:10276", label: "α-ergocryptine", reason: "typography: Greek letter" }
      - { id: "CHEBI:83206", label: "albomycin δ1", reason: "typography: Greek letter" }
      - { id: "CHEBI:27826", label: "(S)-4-hydroxymandelonitrile β-D-glucoside", reason: "typography: Greek letter" }
      - { id: "CHEBI:42639", label: "γ-butyrolactone", reason: "typography: Greek letter" }
      - { id: "CHEBI:30939", label: "5α,9α,10β-labda-8(20),13-dien-15-yl diphosphate", reason: "typography: Greek letters" }
      - { id: "CHEBI:17579", label: "β-carotene", reason: "typography: Greek letter" }
      - { id: "CHEBI:63704", label: "(+)-Τ-muurolol", reason: "typography: Greek letter" }
      - { id: "CHEBI:48741", label: "β-phellandrene", reason: "typography: Greek letter" }
      - { id: "CHEBI:63468", label: "tirucalla-7,24-dien-3β-ol", reason: "typography: Greek letter" }
      - { id: "CHEBI:17734", label: "α-cyclopiazonic acid", reason: "typography: Greek letter" }
      - { id: "CHEBI:140442", label: "12-epi-fischerindole U isonitrile", reason: "name variant: ChEBI says 12-epi-fischerindole U; same InChIKey; curator to confirm" }
      - { id: "CHEBI:85129", label: "Ristocetin A", reason: "name variant: ChEBI says ristocetin; same InChIKey; curator to confirm" }
      - { id: "CHEBI:72590", label: "rhizoxin A", reason: "name variant: ChEBI says rhizoxin; same InChIKey; curator to confirm" }

  # Every organism the corpus names: producers, occurrences, gene-cluster
  # hosts, assay organisms. About 13,700 pairs, and until #64 none of them were
  # checked at all.
  #
  # `severity: warn` is the fleet's report-then-enforce onboarding for a new
  # target over pre-existing data, and this backlog is real rather than
  # theoretical: 13,550 pairs agree with NCBI and 499 do not, in 125 distinct
  # (id, label) pairs. They are not one problem. Roughly two thirds are source
  # granularity — MIBiG names a strain and assigns the species taxid
  # (`Streptomyces albidoflavus J1074` under NCBITaxon:1886), or the reverse —
  # which is a weaker claim than a wrong id and needs a policy decision this
  # config cannot express. About a quarter are typos and gender agreement in
  # the source (`Paecilomyces variotti` for `variotii`). The remaining 34 name
  # a different genus, and those are where a wrong id would hide: NCBITaxon:213754
  # is labelled `Tolypothrix byssoidea`, a cyanobacterium, and NCBI calls it
  # `Rhodococcus sp. T3H5`, an actinobacterium (#83).
  #
  # Flip to `error` once #83 is worked through. Until then every run still
  # proves that all 13,700 ids EXIST — ID_NOT_FOUND is fatal at any severity —
  # and the drift report is uploaded from CI on every run.
  - name: taxon_labels
    kind: yaml
    glob: "data/natural_products/**/*.yaml"
    required: true
    policy: canonical_or_synonym
    severity: warn
    pairs:
      - [taxon_id, taxon_label]
      - [organism_taxon_id, organism_label]
      - [target_organism_id, target_organism_label]
    exclude_keys: [source_concepts, related_records]
