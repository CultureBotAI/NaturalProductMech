# Pipeline configuration for NaturalProductMech.
#
# SOURCES: this file lists the sources the pipeline actually reads, and
# scripts/check_source_queue.py requires each to have an ADOPTED row in
# curation/source_queue.tsv. At M1 the pipeline reads none, so there are none
# here. The Phase A intent is staged in conf/sources.planned.yaml; adopting a
# source moves its block into this file in the same PR that adds its extractor,
# its committed inventory and its ATTRIBUTION.md paragraph.


# ---------------------------------------------------------------------------
# Adopted sources — what the pipeline actually reads
# ---------------------------------------------------------------------------

mibig:
  name: MIBiG
  description: >-
    Minimum Information about a Biosynthetic Gene cluster. Producer organisms
    with NCBI taxonomy identifiers, gene clusters with GenBank loci and an
    experimental-evidence vocabulary, cluster class, compound structures and
    primary references.
  homepage: https://mibig.secondarymetabolites.org/
  archive_url: https://dl.secondarymetabolites.org/mibig/mibig_json_4.0.tar.gz
  archive_name: mibig_json_4.0.tar.gz
  version: "4.0"
  license: CC BY 4.0
  # Only active entries are read. The release dump also ships retired and
  # pending entries.
  status_allowed: [active]
  # DO NOT gate on `quality`: it reads `questionable` for 2,710 of 3,013 entries
  # and marks legacy-format entries awaiting re-curation, not doubtful science.
  # DO NOT gate on the changelog reviewer id: it is the AAAA... placeholder in
  # 2,988 of 3,013 entries, so a reviewer gate admits 25 entries.
  # The producer grade comes from conf/producer_evidence.tsv instead.
  producer_evidence_map: conf/producer_evidence.tsv

npclassifier:
  name: NPClassifier
  description: >-
    The computed filing classification. Runs at EXTRACTION time into a
    committed, manifest-pinned inventory keyed by Standard InChIKey — never at
    seed time, which would put a network call inside the offline pipeline.
  homepage: https://github.com/mwang87/NP-Classifier
  license: CC0
  # Pinned per release; recorded on every record in `np_classification`.
  model_version: null

# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------

# Phase A: microbial producers. Filters `producer_organisms`, NOT `occurrences`
# — the phases are defined by producer, and dropping a cited isolation report
# because its host is out of phase would discard evidence about a compound the
# corpus already holds. Phase A therefore contains non-microbial taxa in
# `occurrences`, which is correct. See PLAN.md 2.4.
producer_scope:
  phase: A
  include_lineages:
    - NCBITaxon:2        # Bacteria
    - NCBITaxon:2157     # Archaea
    - NCBITaxon:4751     # Fungi
    - NCBITaxon:1117     # Cyanobacteriota
    - NCBITaxon:2836     # Bacillariophyta
    - NCBITaxon:3041     # Chlorophyta
  applies_to: producer_organisms

# A size budget, so widening scope is a recorded decision rather than the side
# effect of a refresh. `just seed` refuses to exceed it without an explicit flag.
record_budget: 12000
