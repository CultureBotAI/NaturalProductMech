# Pipeline configuration for NaturalProductMech.
#
# SOURCES: this file lists the sources the pipeline actually reads, and
# scripts/check_source_queue.py requires each to have an ADOPTED row in
# curation/source_queue.tsv. At M1 the pipeline reads none, so there are none
# here. The Phase A intent is staged in conf/sources.planned.yaml; adopting a
# source moves its block into this file in the same PR that adds its extractor,
# its committed inventory and its ATTRIBUTION.md paragraph.


# ---------------------------------------------------------------------------
# Adopted sources — what the pipeline actually reads
# ---------------------------------------------------------------------------

mibig:
  name: MIBiG
  description: >-
    Minimum Information about a Biosynthetic Gene cluster. Producer organisms
    with NCBI taxonomy identifiers, gene clusters with GenBank loci and an
    experimental-evidence vocabulary, cluster class, compound structures and
    primary references.
  homepage: https://mibig.secondarymetabolites.org/
  archive_url: https://dl.secondarymetabolites.org/mibig/mibig_json_4.0.tar.gz
  archive_name: mibig_json_4.0.tar.gz
  version: "4.0"
  license: CC BY 4.0
  # Only active entries are read. The release dump also ships retired and
  # pending entries.
  status_allowed: [active]
  # DO NOT gate on `quality`: it reads `questionable` for 2,710 of 3,013 entries
  # and marks legacy-format entries awaiting re-curation, not doubtful science.
  # DO NOT gate on the changelog reviewer id: it is the AAAA... placeholder in
  # 2,988 of 3,013 entries, so a reviewer gate admits 25 entries.
  # The producer grade comes from conf/producer_evidence.tsv instead.
  producer_evidence_map: conf/producer_evidence.tsv

npclassifier:
  name: NPClassifier
  description: >-
    The computed filing classification. Runs at EXTRACTION time into a
    committed, manifest-pinned inventory keyed by Standard InChIKey — never at
    seed time, which would put a network call inside the offline pipeline.
  homepage: https://github.com/mwang87/NP-Classifier
  license: CC0
  # Pinned per release; recorded on every record in `np_classification`.
  model_version: null

chebi:
  name: ChEBI
  description: >-
    Chemical Entities of Biological Interest. Identity, structures, definitions,
    synonyms, and the specialized-metabolite roles that admit a compound.
  flat_files_base: https://ftp.ebi.ac.uk/pub/databases/chebi/flat_files/
  homepage: https://www.ebi.ac.uk/chebi/
  license: CC BY 4.0
  # 3-star entries are manually curated; 2-star entries are automatically
  # imported and are NOT seeded, because an automatic import is exactly where an
  # unreviewed role assertion enters.
  min_stars: 3
  # WHAT THIS SOURCE DOES TODAY: grounding and occurrences, not admission.
  # A compound enters the corpus from MIBiG; ChEBI then supplies its identity
  # where a structure matches, and its cited compound_origins as occurrences.
  #
  # Role-based ADMISSION — PLAN.md 2.2's third route, where an allow-listed
  # specialized-metabolite role admits a compound MIBiG never saw — is not
  # implemented. It needs the role edges from relation.tsv, which this
  # extractor does not read. `conf/np_roles.tsv` holds the reviewed decisions
  # for that route and is deliberately NOT named here: naming a file the
  # pipeline ignores is how a config starts lying (#23).
  fills: [identity, occurrences]

antibioticmech:
  name: AntibioticMech
  description: >-
    The sibling Mech corpus, pinned at a commit. Supplies the InChIKey
    inventory that computes cross-corpus links, so a compound present in both
    keeps its antimicrobial mechanism there and is linked from here rather than
    duplicated.
  homepage: https://github.com/CultureBotAI/AntibioticMech
  license: CC BY 4.0
  fills: related_records

lotus:
  name: LOTUS
  description: >-
    Referenced structure-organism occurrence triples. Fills `occurrences` and
    never `producer_organisms`: an occurrence may reflect biosynthesis,
    symbiosis, diet, uptake or contamination, and does not say which.
  homepage: https://lotus.nprod.net/
  # THE ROUTE DECIDES THE TERMS. Wikidata's main-namespace structured data is
  # CC0; the Zenodo frozen export is tagged CC BY 4.0. This pipeline reads the
  # Zenodo export, because a committed inventory needs a release identity to
  # record in MANIFEST.yaml and a SPARQL query has none. So CC BY 4.0 is what
  # applies, and ATTRIBUTION.md says so rather than claiming the CC0 route.
  route: zenodo
  zenodo_record: "19360665"
  license: CC BY 4.0
  fills: occurrences

bindingdb:
  name: BindingDB
  description: >-
    Measured binding affinities with UniProt targets, pH and temperature per
    measurement, and a primary citation. ONLY BindingDB's own curation is read:
    its terms put staff-curated data under CC BY 3.0 while ChEMBL-derived rows
    keep ChEMBL's share-alike terms, and the two ship in the same file.
  homepage: https://www.bindingdb.org/
  release: "202609"
  license: CC BY 3.0 (own-curated subset only)
  # The filter is the Curation/DataSource column, not the filename: 429 rows
  # inside the "BindingDB Articles" file are ChEMBL's.
  curation_source: Curated from the literature by BindingDB
  fills: molecular_targets

cyanometdb:
  name: CyanoMetDB
  description: >-
    Manually curated cyanobacterial secondary metabolites, from the primary
    isolation literature, with genus, species, strain and a reference. Fills
    OCCURRENCES: an isolation report says where a compound was found, and a
    strain designation is not a demonstration that the strain makes it.
  homepage: https://www.eawag.ch/en/department/uchem/projects/cyanometdb/
  zenodo_record: "13854577"
  version: "v03 (2024-09-28)"
  license: CC BY 4.0
  # No NCBI taxonomy identifiers upstream, and Occurrence.taxon_id is required.
  # Names are resolved against taxa the corpus already resolved through MIBiG
  # and LOTUS, SPECIES-LEVEL ONLY: a genus fallback would put a genus id under
  # a species label.
  taxon_resolution: species-level, from committed inventories
  fills: occurrences

ncbi_taxonomy:
  name: NCBI Taxonomy
  description: >-
    Resolves the organism names other sources leave unresolved. Occurrence.taxon_id
    is required, so ~2,000 cited occurrences were being dropped over a missing
    identifier rather than missing evidence. Emits taxon_names.tsv, restricted to
    the names the adopted sources actually use — the full names.dmp is ~250 MB of
    organisms this corpus will never mention.
  homepage: https://www.ncbi.nlm.nih.gov/taxonomy
  archive_url: https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz
  license: public domain (US government work)
  # Only name classes that ASSERT the name denotes the taxon. `includes`,
  # `in-part` and `blast name` group or approximate, so a match on one would
  # resolve a name to a taxon nobody claimed it was.
  name_classes: [scientific name, synonym, equivalent name, genbank synonym,
                 genbank anamorph, anamorph]
  # No genus fallback, at any tier. Adopting a taxonomy source raises how many
  # names resolve; it does not lower the bar for what counts as resolved.
  genus_fallback: false
  fills: taxon resolution for chebi, lotus and cyanometdb

# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------

# Phase A: microbial producers. Filters `producer_organisms`, NOT `occurrences`
# — the phases are defined by producer, and dropping a cited isolation report
# because its host is out of phase would discard evidence about a compound the
# corpus already holds. Phase A therefore contains non-microbial taxa in
# `occurrences`, which is correct. See PLAN.md 2.4.
producer_scope:
  phase: A
  include_lineages:
    - NCBITaxon:2        # Bacteria
    - NCBITaxon:2157     # Archaea
    - NCBITaxon:4751     # Fungi
    - NCBITaxon:1117     # Cyanobacteriota
    - NCBITaxon:2836     # Bacillariophyta
    - NCBITaxon:3041     # Chlorophyta
  applies_to: producer_organisms

# A size budget, so widening scope is a recorded decision rather than the side
# effect of a refresh. `just seed` refuses to exceed it without an explicit flag.
record_budget: 12000
