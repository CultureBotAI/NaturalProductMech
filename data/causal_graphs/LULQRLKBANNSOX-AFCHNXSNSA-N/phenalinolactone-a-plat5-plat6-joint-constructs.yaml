graph:
  graph_id: phenalinolactone-a-plat5-plat6-joint-constructs
  scope: BIOSYNTHESIS
  description: Schnell 2007 joint plaT5/plaT6 construct experiments in native Tu6071.
    Native PlaT5/PlaT6 identities are distinct from engineered plasmids. Some integrative-vector
    clones increased phenalinolactone output, but the source-described empty vector
    also increased it and integration sites were not mapped. The episomal construct
    changed the A/D profile without a reported total increase. Neither an individual
    protein effect nor rate-limiting pathway control is demonstrated. HMBPP/DXP synthase
    roles are homology-based proposals, not purified activity or measured protein
    overexpression. The pSET-OE map-label discrepancy is retained.
