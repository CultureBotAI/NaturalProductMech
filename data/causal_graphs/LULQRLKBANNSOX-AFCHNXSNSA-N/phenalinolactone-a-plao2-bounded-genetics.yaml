graph:
  graph_id: phenalinolactone-a-plao2-bounded-genetics
  scope: BIOSYNTHESIS
  description: Partial native Tu6071 PlaO2 genetics from Schnell 2007. The internal
    deletion retained the observed wild-type phenalinolactone profile under the tested
    culture/analytical conditions. No reaction, universal dispensability, complete
    absence of protein activity, or purified catalysis is established. A described
    complementation construct was not a completed rescue experiment. Native parent
    identity is separate from the single-crossover and deletion alleles.
  nodes:
  - node_id: plao2
    label: Native PlaO2 parent (putative cytochrome P450)
    node_type: PROTEIN
    grounding_status: GROUNDED
    identifier: NCBIProtein:ABB69746.1
  - node_id: single_crossover
    label: Tu6071-scO2 single-crossover clone 1
    node_type: PROCESS
    grounding_status: UNGROUNDED
  - node_id: lesion
    label: Tu6071-XO2 internal plaO2 deletion (clone 49)
    node_type: PROCESS
    grounding_status: UNGROUNDED
  - node_id: production
    label: Detectable PL-A/PL-D profile under tested conditions
    node_type: PHENOTYPE
    grounding_status: UNGROUNDED
  edges:
  - subject: single_crossover
    predicate: contains_recombined_alleles_of
    object: plao2
    notes: 'pKC-O2del was made from a cosmid 3-1O12 genomic PCR fragment, with an
      internal NcoI deletion. All 12 tested exconjugants showed both approximately
      1.23-kb intact and 0.93-kb deleted O2co-F/R amplicons; clone 1 became scO2.
      Its PstI Southern had both wild-type and deleted bands. This is not a clean
      knockout: an intact copy is retained.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.2.4-3.2.4.3, pp. 55-59, Figures 3.14-3.17; methods 5.9.4 and
        5.14.7, pp. 152, 161-162.
  - subject: lesion
    predicate: disrupts_encoding_gene_of
    object: plao2
    notes: 'After four passages, 5 of 128 colonies were apramycin-sensitive: 49/119
      had the shorter PCR product; 60/63/75 were wild-type revertants. Clone 49 became
      XO2. The reported 300-bp in-frame NcoI deletion agrees with native coding-oriented
      cuts 363/663. PstI Southern gives about 0.9 kb in XO2 versus 1.2 kb in wild
      type (expected 891/1191 bp). O2blot probe is reported as 565 bp; curator native
      alignment instead spans 566 bp and finds a printed O2blot-F C versus native
      T at genomic 21398. These qualifications do not negate the PCR/Southern result
      or establish an independently sequenced mutant junction. Native 397-aa GenPept,
      GenBank and MIBiG translations agree; no mutant protein sequence is assigned.
      Official UniProt gene/taxon and exact EMBL-xref queries returned no rows; no
      homolog substituted.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.2.4.1-3.2.4.3, pp. 55-59; Figures 3.14-3.17; methods 5.9.4/5.14.7,
        pp. 152, 161-162.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ABB69746.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-04'
      notes: Native PlaO2, 397 aa; complement(DQ230532.1:21436..22629); Streptomyces
        sp. Tu6071, taxon 355249.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/DQ230532.1
      evidence_type: CURATOR_INFERENCE
      notes: 'Curator comparison: GenPept/native GenBank/MIBiG BGC0000654.4 translations
        identical. NcoI deletion is 300 bp; PstI cuts 21390/22581 give 1191 bp. O2blot-F
        maps to 21392..21408 with one mismatch; exact reverse primer maps to 21943..21957,
        giving a 566-bp span rather than reported 565 bp.'
  - subject: single_crossover
    predicate: retains_detectable_profile_of
    object: production
    notes: HPLC/ESI-MS of scO2 culture extract detected the wild-type major metabolites
      PL A and D without new derivatives reported. An intact gene copy remains in
      this strain; this observation cannot show loss-of-function dispensability or
      exclude all polar effects.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.2.4.2, p. 56; culture/analysis methods 5.5.2 and 5.7, pp. 133,
        140-141.
  - subject: lesion
    predicate: retains_detectable_profile_of
    object: production
    notes: XO2 culture-extract HPLC/ESI-MS was reported indistinguishable from wild
      type. Standard analytical cultures used 25 mL NL111, 28 C and 180 rpm, with
      roughly 168-h sampling and ethyl-acetate extraction. No detection limit, equivalence
      test, or exclusion of minor products, residual activity or compensation is given.
      Results 3.2.4.4 explicitly state that complementation was omitted because the
      phenotype was unchanged; methods describing pS-O2co preparation are not evidence
      of performed rescue.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.2.4.2/3.2.4.4, pp. 56, 59; methods 5.5.2, 5.7, 5.12.1, 5.14.7.2,
        pp. 133, 140-141, 155, 162.
      snippet: wurde auf eine Komplementierung des Gens plaO2 verzichtet.
