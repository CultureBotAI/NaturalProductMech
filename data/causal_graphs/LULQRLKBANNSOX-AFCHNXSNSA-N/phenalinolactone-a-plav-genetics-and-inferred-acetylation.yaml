graph:
  graph_id: phenalinolactone-a-plav-genetics-and-inferred-acetylation
  scope: BIOSYNTHESIS
  description: Daum 2009 native Tu6071 PlaV genetics. NL111 cultures harvested after
    7-8 days; ethyl-acetate supernatant extracts analyzed by HPLC/ESI-MS (plaESI).
    Production phenotypes and genomic-fragment rescue support inferred 3-O-acetylation,
    not purified-protein catalysis.
