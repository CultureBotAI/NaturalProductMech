graph:
  graph_id: phenalinolactone-a-plao3-genetics-and-inferred-function
  scope: BIOSYNTHESIS
  description: Native Tu6071 PlaO3 internal-deletion, untagged and His6-tagged complementation
    evidence from Schnell 2007. XO3 accumulated the NMR-characterized PL HS6/HS7 pair
    in place of the wild-type major product profile. C-20 hydroxylation of HS6 is
    inferred from genetics and metabolite structures; the proposed immediate product
    was not isolated here. Recombinant expression, partial peptide identification
    and whole-cell tagged rescue do not establish purified turnover, unchanged kinetics,
    or native electron-transfer partners. HS6/HS7 are distinct mutant products, not
    phenalinolactone A identifiers.
