graph:
  graph_id: phenalinolactone-a-plar-genetics-and-promoter-reporters
  scope: BIOSYNTHESIS
  description: Myronovskyi et al. 2011 regulator genetics in the phenalinolactone-producing
    Tu6071 locus. Marker-free internal disruptions and integrated promoter-GusA reporters
    are separate from exact native PlaR1/PlaR2/PlaR3 proteins. Reporter changes are
    not direct DNA binding, native RNA measurements or native protein abundance. Production
    results are reported as phenalinolactone without a congener-resolved titer here;
    do not generalize them to every congener. Results report trace production for
    deltaR2, despite cessation wording in Discussion. The plaM1/plaM2 text discrepancy
    and construct limitations remain explicit. Quantities below come from paper text;
    Figure 6 bars/error bars were not independently digitized or visually verified.
