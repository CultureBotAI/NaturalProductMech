  edges:
  - subject: delta_r1
    predicate: targets_gene_encoding
    object: plar1
    notes: 'Native parent ABB69733.1: 265 aa, DQ230532.1:complement(6556..7353), Tu6071
      taxon 355249. Native GenBank, MIBiG and GenPept translations match. The study
      used pKGLP2-based replacement with a loxP-flanked apramycin marker, followed
      by Cre-mediated marker excision; marker-free is not a claim of scarless editing.
      PCR verified R1/R3 replacements and Southern hybridization R2. Curator alignment
      of Table 2 inner homology arms places an internal native interval between them
      at 6615..7201 (587 bp); residual coding sequence remains. These are native-coordinate
      reconstructions, not sequenced mutant alleles or measured residual protein products.
      Q2I751 is deleted as redundant; UniParc UPI000068F38F retains the exact sequence
      but no active UniProtKB cross-reference in the inspected entry. The exact 265-aa
      native parent is grounded, not an inferred mutant protein.'
    evidence:
    - reference: DOI:10.1128/AEM.00434-11
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gene-inactivation construction, Table 2 and results, pp. 5371-5374.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ABB69733.1
      evidence_type: DATABASE_ASSERTION
      notes: Native parent, 265 aa, complement(6556..7353); Streptomyces sp. Tu6071,
        taxon 355249.
      retrieved_on: '2026-10-04'
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/DQ230532.1
