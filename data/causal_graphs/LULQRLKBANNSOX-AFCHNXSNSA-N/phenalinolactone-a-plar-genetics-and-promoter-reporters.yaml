  - subject: delta_r1
    predicate: has_reported_production_phenotype
    object: r1_output
    notes: LC-MS analysis reports abolished phenalinolactone production in the marker-free
      deltaR1 strain. Production cultures used NL111. This is the reported detection
      phenotype, not a numerical zero titer, quantified detection limit, purified
      PlaR1 reaction or direct promoter binding. The assayed congener breakdown is
      not given in this account; no complementation-based exclusion of polar effects
      is asserted.
    evidence:
    - reference: DOI:10.1128/AEM.00434-11
      evidence_type: PRIMARY_EXPERIMENT
      notes: Culture/LC-MS methods p. 5371; gene-inactivation results pp. 5374-5375.
  - subject: delta_r2
    predicate: has_reported_production_phenotype
    object: r2_output
    notes: Results report trace phenalinolactone production in deltaR2, whereas Discussion
      calls it cessation. Preserve this disagreement and the trace result; do not
      encode complete abolition. NL111 production cultures and LC-MS are distinct
      from TSB-grown promoter-reporter assays. No exact residual titer, congener ratio
      or universal PlaR2 requirement is assigned.
    evidence:
    - reference: DOI:10.1128/AEM.00434-11
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results pp. 5374-5375 versus Discussion p. 5381; methods p. 5371.
      snippet: phenalinolactone in trace amounts.
  - subject: delta_r3
    predicate: has_reported_production_phenotype
    object: r3_output
    notes: The LC-MS account describes deltaR3 phenalinolactone production as the
      same as wild type under the tested conditions. This is bounded negative evidence,
      not statistical equivalence, all-condition dispensability or absence of regulatory
      effects. The same mutant changes reporter outputs.
    evidence:
    - reference: DOI:10.1128/AEM.00434-11
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gene-inactivation results pp. 5374-5375; Discussion p. 5381.
  - subject: delta_r1
    predicate: has_reported_promoter_reporter_effect
    object: p_r1
    notes: Reported activity is 168% of the corresponding wild-type reporter; wild
      type is the relative 100% reference. The pGUS promoter-GusA fusion was integrated
      in Tu6071 and assayed in TSB-grown cultures by p-nitrophenyl-glucuronide hydrolysis
      (OD415, 20 min at 37 C). The study states means with standard errors from three
      independent experiments. No significance test or exact reporter-culture harvest
      time is inferred here. Upstream aadA/T4 terminators were designed to block readthrough.
      The native homology span of the cloned promoter fragment is 7365..7864 (-) by
      curator primer alignment, not an exact minimal promoter or regulator-binding
      site. This assay supports a regulatory effect in an engineered reporter context,
      not direct binding or native protein abundance.
    evidence:
    - reference: DOI:10.1128/AEM.00434-11
      evidence_type: PRIMARY_EXPERIMENT
      notes: Promoter-vector methods pp. 5372-5373; Results pp. 5375-5376 and Figure
        6 caption p. 5377. Percentages/no-change statements taken from text, not digitized
        bars.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/DQ230532.1
      evidence_type: CURATOR_INFERENCE
      notes: Table 2 primer suffixes aligned to native DQ230532.1; genomic strand
        and homologous fragment span, not a sequenced full reporter construct.
