  - subject: delta_r3
    predicate: targets_gene_encoding
    object: plar3
    notes: 'Native parent ABB69766.1: 119 aa, DQ230532.1:complement(47334..47693),
      Tu6071 taxon 355249. Native GenBank, MIBiG and GenPept translations match. The
      study used pKGLP2-based replacement with a loxP-flanked apramycin marker, followed
      by Cre-mediated marker excision; marker-free is not a claim of scarless editing.
      PCR verified R1/R3 replacements and Southern hybridization R2. Curator alignment
      of Table 2 inner homology arms places an internal native interval between them
      at 47381..47678 (298 bp); residual coding sequence remains. These are native-coordinate
      reconstructions, not sequenced mutant alleles or measured residual protein products.
      The legacy GenPept protein name says putative TetR regulator, whereas the paper
      and the GenPept domain annotation support an HxlR-related interpretation. Neither
      demonstrates a formaldehyde response. Methods describe R3.2 cloning with XbaI/BamHI,
      while Table 2 primers carry BamHI/EcoRV tails; the exact engineered junction
      is not asserted. A bounded official gene/taxon and EMBL cross-reference query
      found no active exact UniProtKB entry.'
    evidence:
    - reference: DOI:10.1128/AEM.00434-11
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gene-inactivation construction, Table 2 and results, pp. 5371-5374.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ABB69766.1
      evidence_type: DATABASE_ASSERTION
