graph:
  graph_id: phenalinolactone-a-plam2-translational-reporter
  scope: BIOSYNTHESIS
  description: Myronovskyi et al. 2011 PlaM2-HL4-GusA reporter in native Tu6071. The
    exact native PlaM2 parent is not the engineered fusion. GusA signal tracks a translational-reporter
    construct, not native methyltransferase turnover or an absolute protein concentration.
    Reporter and six-day phenalinolactone productivity rank media differently. Congener-specific
    titers and native methylation chemistry are not assigned. Numerical values are
    reported text values; Figure 8 was not independently digitized or visually verified.
