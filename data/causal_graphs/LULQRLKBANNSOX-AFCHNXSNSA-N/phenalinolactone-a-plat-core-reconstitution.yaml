  - subject: full
    predicate: produces_detectable
    object: cyclic
    notes: 'S. albus produced 1/2; S. venezuelae only 1. Isolated S. albus products
      have HRMS/NMR support: C-3 ketone in 1, hydroxyl in 2. Both bear amino-acid
      tails without the CD6/CD7 C-15/C-16 olefin; neither is CD6/CD7 or mature A.
      C-17 absolute configuration, host amination and 2-to-1 oxidation remain unresolved.'
    evidence:
    - reference: DOI:10.1039/D4CB00138A
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 2; SI pages 4-6, Tables S4-S5 and Figures S3-S15.
      snippet: only 1 was produced
