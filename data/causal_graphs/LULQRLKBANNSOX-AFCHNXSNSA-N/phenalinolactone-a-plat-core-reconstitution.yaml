graph:
  graph_id: phenalinolactone-a-plat-core-reconstitution
  scope: BIOSYNTHESIS
  description: Alsup et al. 2024 heterologous backbone reconstitution with native
    Tu6071 genes. Hosts were S. albus J1074 and S. venezuelae ATCC 10712; HA cultures
    were screened after 7 days at 28 C by LC-MS against empty-vector controls. The
    four-gene cassette makes scaffold analogs, not phenalinolactone A. Enzyme roles
    and order below are inferences from gene combinations, not purified-protein turnover.
    All four full-cassette genes were amplified from genomic DNA and TEDA-assembled
    under sp44 promoter/sr40 RBS. Authors report sequence-confirming plasmids; curator
    primer mapping supports native CDS boundaries, not independent full-plasmid sequencing.
    UniProt mapping was unverified after service failures; exact native GenPept accessions
    are used.
