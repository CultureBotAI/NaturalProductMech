  edges:
  - subject: mutant_plat1
    predicate: inactivates_encoding_gene_of
    object: plat1
    notes: BamHI fill-in frameshift, not deletion; plasmid sequence-checked. Apramycin
      sensitivity and PCR/BamHI identified double crossovers 7/8, not complete mutant-genome
      sequencing.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.2.1.1 and 5.9.1; pages 44-47 and 151; Figures 3.8-3.9.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ABB69742.1
      evidence_type: DATABASE_ASSERTION
      notes: 449 aa; complement(16422..17771) in DQ230532.1; Streptomyces sp. Tu6071,
        taxon 355249. GenPept identifies the named native protein.
      retrieved_on: '2026-10-03'
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/DQ230532.1
      evidence_type: CURATOR_INFERENCE
      notes: 'Curator comparison, not database assertion: GenBank/MIBiG BGC0000654.4
        CDS translations match GenPept.'
  - subject: mutant_plat1
    predicate: abolishes_detectable
    object: production
    notes: Both double crossovers lacked detectable A/D or recognizable intermediates;
      parallel wild type produced A/D. Sampling at 96, 120 and 144 h and chloroform
      extraction also found no intermediates.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.2.1.2, page 47.
  - subject: rescue_plat1
    predicate: supplies_wild_type_encoding_gene_for
    object: plat1
    notes: 'ermE*-driven/pSET152-derived pS-25co rescue. Curator Co25-F/R alignment:
      DQ230532.1:16385..17855; primer changes outside PlaT1, partial plaO1/plaT2 included.
      Not isolated CDS.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 5.12-5.14; pages 154-160; Table 5.14, page 131.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/DQ230532.1
      evidence_type: DATABASE_ASSERTION
      notes: Native CDS and flanking gene coordinates.
      retrieved_on: '2026-10-03'
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: CURATOR_INFERENCE
      notes: Curator primer alignment, not a separately deposited rescue-plasmid sequence.
  - subject: rescue_plat1
    predicate: restores_detectable
    object: production
    notes: All three complemented cultures recovered A/D; PCR/restriction supported
      the construct. Neither all off-target changes nor purified-enzyme sufficiency
      is resolved.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
