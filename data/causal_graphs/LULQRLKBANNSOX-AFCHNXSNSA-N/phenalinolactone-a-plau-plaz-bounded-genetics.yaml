graph:
  graph_id: phenalinolactone-a-plau-plaz-bounded-genetics
  scope: BIOSYNTHESIS
  description: 'Partial native Tu6071 genetics from Daum 2009: disruption of the putative
    SDR genes plaU and plaZ did not abolish detectable PL-A/PL-D under the tested
    conditions. Native protein parents are distinct from mutant alleles. The PlaU
    deletion-junction discrepancy is unresolved; the combined mutant has a PlaZ single-crossover
    insertion, not two clean deletions. No purified PlaU/PlaZ catalysis, measured
    cofactor preference, or universal biosynthetic dispensability is demonstrated.
    PlaU C-3 oxidation, minor/shunt product roles, extracluster compensation and silence
    remain hypotheses.'
  nodes:
