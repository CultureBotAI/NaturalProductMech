  scope: BIOSYNTHESIS
  description: PlaO5 C-1 hydroxylation evidence from Schnell 2007. Native Tu6071 production
    phenotypes are separate from complementation with untagged or His6-tagged constructs
    and the purified-protein assay. Spinach electron-transfer proteins are assay substitutes,
    not identified native pathway partners.
