  edges:
  - subject: lesion
    predicate: inactivates_encoding_gene_of
    object: plao5
    notes: 'XO5 double-crossover clone 83: apramycin-sensitive with shorter colony
      PCR. Internal 363-bp in-frame deletion, not whole-gene removal. Curator PCR/PstI-junction
      reconstruction predicts the same net lesion; no independently sequenced mutant
      genome/junction is asserted.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.2.6.1 and 5.9.6; pages 65-66, 153, 164-165; Figures 3.21-3.22.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ABB69764.1
      evidence_type: DATABASE_ASSERTION
      notes: 'Native plaO5: 409 aa; DQ230532.1:44294..45523; Streptomyces sp. Tu6071,
        taxon 355249.'
      retrieved_on: '2026-10-03'
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: CURATOR_INFERENCE
      notes: Curator alignment of O5-A2/O5-B primers and reconstruction of their PstI
        ligation against DQ230532.1.
  - subject: lesion
    predicate: abolishes_detectable
    object: production
    notes: 'XO5 lacked the parallel wild-type A signal; preceding single crossover
      retained it. NL111, 28 C, harvest near 168 h, HPLC/UV/MS: detection-limited
      A loss, not all phenalinolactones.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.2.6.2, 5.5.2 and 5.7; pages 66-68, 133, 140-141; Figure 3.24.
  - subject: lesion
    predicate: changes_production_profile_to
    object: congeners
    notes: D/X1 and other congeners remained. NMR identifies HS2 as D-related pyrrole-tail
      methoxy derivative; other HS proposals do not all have complete NMR. No quantified
      fold increase or direct PlaO5 synthesis of these congeners inferred.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.2.6.2 and 3.2.6.4; pages 67-77; Table 3.3 and Figures 3.24-3.32.
  - subject: rescue
    predicate: supplies_wild_type_encoding_gene_for
    object: plao5
    notes: 'ermE*-driven/pSET152-derived pS-O5co rescue. Curator O5co2-F/O5co-R mapping:
      1312 bp, 44241..45552; changes outside plaO5, noncoding flanks but no neighboring
      CDS. Not a separate rescue-plasmid deposit.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 5.12.1 and 5.14.10.2; pages 154-155 and 165.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/DQ230532.1
      evidence_type: DATABASE_ASSERTION
      notes: Native target and flanking CDS coordinates.
      retrieved_on: '2026-10-03'
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: CURATOR_INFERENCE
      notes: Curator primer/native-locus comparison, including neighboring plaA8 and
        plaM3 boundaries.
  - subject: rescue
    predicate: restores_detectable
    object: production
    notes: 'All three complemented cultures recovered detectable A/D: supports genetics,
      not exclusion of every off-target effect or measured turnover.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.2.6.3; page 75.
  - subject: his_plao5
    predicate: is_engineered_derivative_of
    object: plao5
    notes: 'pRSET-O5 in E. coli BL21(DE3)pLysS; Ni-NTA purification. Thesis reports
      446-aa N-terminal His6 fusion, sequence-checked insert, 43% MALDI peptide-mass
      fingerprint coverage, not complete protein sequencing. Native accession is not
      tagged construct. Curator comparison: printed 409-aa parent matches GenPept/GenBank/MIBiG;
      expression-primer changes outside CDS. UniProt mapping unverified after service
      error.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.3.4.1-3.3.4.2, 5.13.7 and 5.14.10.5; pages 96-98, 156, 166;
        Table 3.6; Figure 3.47.
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: CURATOR_INFERENCE
      notes: Curator comparison of the printed page-98 sequence and Ox5-F/R primers
        to DQ230532.1 and matching GenPept/MIBiG translations; the complete fusion
        sequence was not independently reconstructed.
  - subject: tag_rescue
    predicate: expresses
    object: his_plao5
    notes: Tagged pRSET-O5 insert transferred to ermE*-driven integrating vector;
      authors report sequence checking. Co-XO5his primers target engineered template,
      not just native DNA.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.3.4.3, 5.12.2 and 5.14.10.3; pages 99, 155 and 165.
  - subject: tag_rescue
    predicate: restores_detectable
    object: production
    notes: 'Tagged rescue restored A/D profile: retained function, not identical kinetics
      or complete tag neutrality.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.3.4.3; page 99; Figure 3.48.
  - subject: his_plao5
    predicate: catalyzes
    object: hydroxylation
    notes: Purified tagged PlaO5 supports D-to-A conversion at pH 7.5, 37 C, 120 min
      with recombinant His-tagged spinach ferredoxin, commercial spinach ferredoxin
      reductase, NADPH/NADP+ and glucose-6-phosphate/dehydrogenase regeneration. No
      native redox partner, separate cofactor-necessity test, kinetic constant or
      conversion yield established. The 2010 abstract is not counted as independent
      replication.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.4-3.4.2 and 5.15.7; pages 100-103 and 172; Figures 3.50-3.51.
    - reference: DOI:10.1002/cbic.201000117
      evidence_type: PRIMARY_EXPERIMENT
      notes: The inspected publication abstract also states the PlaO5 C-1 hydroxylation
        assignment; it is not counted as an independent experimental replication.
        Assay details come from the primary thesis, not an uninspected article full
        text.
      snippet: catalyses the 1-C-hydroxylation of phenalinolactone D
  - subject: hydroxylation
    predicate: has_substrate
    object: pl_d
    notes: 'D supplied, but Figure 3.51 also shows D2/reported A2: not claimed homogeneous
      or proof of broad substrate scope.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.4.2 and 5.15.7; pages 102-103 and 172; Figure 3.51.
  - subject: hydroxylation
    predicate: produces
    object: pl_a
    notes: 'Product assigned A: retention 21.4 min under reported gradient, UV maxima
      near 276/244 nm, m/z 714 [M-H]-. Not fresh NMR, co-injection or complete absolute
      stereochemistry.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.4.2; pages 102-103; Figure 3.51.
  - subject: no_enzyme
    predicate: fails_to_form_detectable
    object: pl_a
    notes: 'Matched no-His6-PlaO5 control lacked new A peak: supports PlaO5-dependent
      conversion, not separate omission tests for every redox component.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/3799
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.4.2; pages 102-103; Figure 3.51.
