graph:
  graph_id: fellutamide-b-yeast-proteasome-reference-assembly
  scope: BIOACTIVITY
  description: Partial structural association and target-complex composition view,
    not a temporal assembly pathway. All14 core-subunit types are represented as reference
    proteins; only beta1/PRE3, beta2/PUP1 and beta5/PRE2 have deposited drug-contact
    edges. S288c accessions are deliberately selected reference examples, not proof
    that the baker's-yeast preparation was S288c. Thirteen UniProt accessions stored
    in the mmCIF are now deleted; they are not adopted as live identifiers. Matching
    deposited polymer spans do not prove physical truncation of the purified proteins
    or complete assay-construct identity. In particular, the deposited PUP1 span ends
    at251 while the annotated mature chain ends at261; absence from the polymer sequence
    does not establish engineered deletion. PRE4 initiation remains uncertain. The
    primary2008 full text was not obtained; independent deposition and reference datasets
    support these claims. No quantitative inhibition, NGF mechanism, all-subunit binding
    or complete donor-strain reconstruction is asserted.
