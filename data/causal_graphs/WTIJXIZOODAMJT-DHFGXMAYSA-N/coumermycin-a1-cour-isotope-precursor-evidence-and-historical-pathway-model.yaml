  edges:
  - subject: strain
    predicate: accumulated_reported_product
    object: mono
    notes: 'CDM, seven-day HPLC-UV/MS: 12 mg/L; monoamide quantified against novobiocin,
      not an identical-compound response calibration. Construct replaced the couM-N7
      region with pIJ773 cassette, then XbaI-only excision left 49 bp and changed
      the CouN7 stop region. Reported 7097-bp deletion differs from the unversioned
      Table II.9 coordinate span 10985-19284; full allele sequence unresolved.'
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49601/pdf/Dissertation_Siebenberg_Online.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Siebenberg 2011 primary thesis, PDF pages 40,49,54,66-68 (printed Arabic
        page offset +18). Selected text and relevant page images inspected; not all
        appendix spectra.
      retrieved_on: '2026-10-05'
  - subject: strain
    predicate: accumulated_reported_product
    object: diamide
    notes: 'Same experiment: 4 mg/L using authentic coumermycin A1 calibration. Joint
      deletion retaining these products supports no obligatory CouM/N1-N7 requirement
      for CPM in this host/context; not universal dispensability.'
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49601/pdf/Dissertation_Siebenberg_Online.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Siebenberg 2011 primary thesis, PDF pages 54,66-68 (printed Arabic page
        offset +18). Selected text and relevant page images inspected; not all appendix
        spectra.
      retrieved_on: '2026-10-05'
  - subject: feed
    predicate: was_supplied_to
    object: strain
    notes: Large-scale 360 mL in five deepwell plates; 96 mg label, final 2.15 mmol/L,
      five equal feeds at 72/84/96/108/120 h; harvest at 144 h. Isolated monoamide
      yield 2.1 mg. Separate preliminary small-scale experiment used 6 mL.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49601/pdf/Dissertation_Siebenberg_Online.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Siebenberg 2011 primary thesis, PDF pages 51,71-72 (printed Arabic page
        offset +18). Selected text and relevant page images inspected; not all appendix
        spectra.
      retrieved_on: '2026-10-05'
  - subject: mono
    predicate: was_analyzed_by
    object: isotope
    notes: Preliminary unlabeled 8.3-mg material assigned by 2D NMR to the pure 4-carboxyl-amide
      regioisomer. Small-scale feeding shifted [M-H]- from 357 to 362; MS/MS 206 represents
      unlabeled aminocoumarin, and 232 supports the reported regioisomer. These are
      source assignments, not independently reprocessed raw spectra or NMR of final
      coumermycin A1.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49601/pdf/Dissertation_Siebenberg_Online.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Siebenberg 2011 primary thesis, PDF pages 71-73 (printed Arabic page
        offset +18). Selected text and relevant page images inspected; not all appendix
        spectra.
      retrieved_on: '2026-10-05'
  - subject: isotope
    predicate: supports_intact_precursor_origin
    object: origin
    notes: NMR C2/C3/C6/C7 enrichment 20/19/19/20%, mean 19.5%; C-C and C-N couplings
      support incorporation of threonine four-carbon skeleton and nitrogen into CPM.
      Table III.3 also reports C11-prime enrichment 1.8%; label was not exclusively
      in the pyrrole.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49601/pdf/Dissertation_Siebenberg_Online.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Siebenberg 2011 primary thesis, PDF pages 72-74 (printed Arabic page
        offset +18). Selected text and relevant page images inspected; not all appendix
        spectra.
      retrieved_on: '2026-10-05'
