  graph_id: coumermycin-a1-couo-sah-structure-dimer-and-model-limits
  scope: BIOSYNTHESIS
  description: 'CouO-SAH coordinates, chain-B terminal omission, Glu4/Glu6 disagreement
    and bounded SEC/PISA dimer evidence, distinct from docking and catalytic interpretations.
    Author-agent review #556. Native identity, engineered preparations and measured
    or inferred outcomes remain distinct; these precursor/surrogate studies do not
    demonstrate synthesis of mature coumermycin A1.'
