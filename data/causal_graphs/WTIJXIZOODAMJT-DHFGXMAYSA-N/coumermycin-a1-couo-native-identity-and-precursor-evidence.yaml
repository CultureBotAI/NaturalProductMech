  - subject: gene
    predicate: encodes_native_protein
    object: native
    notes: CDS-aware table-11 translation matches AAG29793.1 and all 230 residues
      of Q9F8T9. AF235050.3 has the same CDS/protein at 20888..21580(+); the coordinate
      shift is not a protein substitution. Native sequence identity does not identify
      a full mutant plasmid or experimental aliquot.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: DATABASE_ASSERTION
      notes: Current native CDS.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.3
      evidence_type: DATABASE_ASSERTION
      notes: Historical native CDS.
    - reference: https://www.uniprot.org/uniprotkb/Q9F8T9
      evidence_type: DATABASE_ASSERTION
      notes: Reviewed entry 60, sequence 1; annotation 2026-06-10, retrieved 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: CURATOR_INFERENCE
      notes: Independent comparison of both CDS translations and UniProt.
  - subject: native
    predicate: is_database_reference_for_studied_enzyme
    object: prep2005
    notes: UniProt links the function to Pacholec 2005. The primary abstract reports
      expression and purification from E. coli, but the full paper and exact construct
      sequence were not obtained. Neither the 2017 lysate protocol nor the structural
      preparation is substituted for it.
    evidence:
    - reference: https://www.uniprot.org/uniprotkb/Q9F8T9
      evidence_type: DATABASE_ASSERTION
      notes: Function annotation and PubMed 16274243.
    - reference: DOI:10.1021/bi051599o
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
  - subject: prep2005
    predicate: catalyzes_reported_methylation
    object: reaction
    notes: The abstract reports SAM-dependent methylation adjacent to the phenolic
      hydroxyl on the aminocoumarin scaffold. It does not provide assay loading, full
      constructs or numerical kinetic conditions here.
    evidence:
    - reference: DOI:10.1021/bi051599o
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
  - subject: monoamide
    predicate: is_reported_acceptor_for
    object: reaction
    notes: The abstract identifies the monoamide made during CouL ligation as a CouO
      acceptor. This is not free aminocoumarin, the 2017 benzamide surrogate or mature
      glycosylated coumermycin A1.
    evidence:
    - reference: DOI:10.1021/bi051599o
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
  - subject: bisamide
    predicate: is_reported_acceptor_for
    object: reaction
    notes: CouO also accepts the CouL bis-amide formed from two aminocoumarins and
      a dicarboxypyrrole. The abstract does not establish a unique microscopic methylation
      sequence or the kinetic equivalence of both sites.
    evidence:
    - reference: DOI:10.1021/bi051599o
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
  - subject: reaction
    predicate: forms_reported_precursors
    object: products
    notes: Mono- and di-C-methylation are reported before glycosylation. This does
      not establish a mature-antibiotic titer or resolve the positional limits already
      recorded for the separate CouL experiments.
    evidence:
    - reference: DOI:10.1021/bi051599o
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
      snippet: mono- and di-C-methylation
  - subject: prep2005
    predicate: has_reported_negative_substrate_results
    object: earlier
    notes: Neither CouO nor NovO is reported to act on NovH-tethered tyrosyl-derived
      S-pantetheinyl intermediates or subsequently released free aminocoumarin. No
      detection limit or quantitative absence is supplied in the abstract.
    evidence:
    - reference: DOI:10.1021/bi051599o
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
  - subject: reaction
    predicate: precedes_reported_glycosylation
    object: order
    notes: The source places CouO C-methylation before CouM O-glycosylation. This
      is the reported pathway interpretation, not directly measured native-cell flux
      or a universal order for every accepted analogue.
    evidence:
    - reference: DOI:10.1021/bi051599o
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
