  edges:
  - subject: five
    predicate: was_tested_in
    object: analysis
    notes: 3-mL cultures in 24-deepwell plates, CDM, 30 C/300 rpm, eight-day harvest;
      three individual wells analyzed separately. Medium included thiamine 10 ug/mL,
      pyridoxine 8 ug/mL, Q2-5247 0.6% w/v and CoCl2 0.2 ug/mL; the Fig.3 experiment
      omitted Q2-5247/CoCl2.
    evidence:
    - reference: DOI:10.1007/s10295-013-1266-6
      evidence_type: PRIMARY_EXPERIMENT
      notes: Novotna et al. 2013, culture and analysis methods. Primary indexed text
        inspected; journal PDF unavailable and journal figures not visually inspected.
      retrieved_on: '2026-10-05'
  - subject: analysis
    predicate: identified_reported_product
    object: cpm
    notes: CPM matched authentic standard by HPLC and positive-mode LC-MS/MS, precursor
      m/z170.1 and fragmentation. HPLC at 259 nm, 0.6 mL/min, 5-100% methanol/0.1%
      formic acid over20min; LC-MS used a separate chromatographic method. The retention
      times from different methods must not be interchanged.
    evidence:
    - reference: DOI:10.1007/s10295-013-1266-6
      evidence_type: PRIMARY_EXPERIMENT
      notes: Novotna et al. 2013, abstract, analysis methods and Fig.4 caption. Primary
        indexed text inspected; journal PDF unavailable and journal figures not visually
        inspected.
      retrieved_on: '2026-10-05'
  - subject: host
    predicate: was_negative_control_in
    object: analysis
    notes: No CPM-matching peak reported; authentic CPM added to host culture immediately
      before extraction was an analytical recovery control, not biosynthetic rescue.
      No empty-vector control was identified in the inspected text.
    evidence:
    - reference: DOI:10.1007/s10295-013-1266-6
      evidence_type: PRIMARY_EXPERIMENT
      notes: Novotna et al. 2013, CPM identification results. Primary indexed text
        inspected; journal PDF unavailable and journal figures not visually inspected.
      retrieved_on: '2026-10-05'
  - subject: cpm
    predicate: was_extracted_for
    object: analysis
    notes: 'For free CPM: 1 mL culture treated with lysozyme1.9mg/mL for60min at30C,
      acidified pH2, extracted three times with equal-volume EtOAc, dissolved in100uL
      ethanol. Mono/diamide analysis omitted lysozyme and used345nm/acetonitrile with
      novobiocin/coumermycin standards.'
    evidence:
    - reference: DOI:10.1007/s10295-013-1266-6
      evidence_type: PRIMARY_EXPERIMENT
      notes: Novotna et al. 2013, analysis methods. Primary indexed text inspected;
        journal PDF unavailable and journal figures not visually inspected.
      retrieved_on: '2026-10-05'
  - subject: deletions
    predicate: accumulated_reported_products
    object: amides
    notes: Both deltaS-parY and deltaR5-parY strains yielded HPLC peaks matching CPM
      monoamide/diamide; couSS01 was positive and host alone negative control.
    evidence:
    - reference: DOI:10.1007/s10295-013-1266-6
      evidence_type: PRIMARY_EXPERIMENT
      notes: Novotna et al. 2013, Table2 and deletion results. Primary indexed text
        inspected; journal PDF unavailable and journal figures not visually inspected.
      retrieved_on: '2026-10-05'
  - subject: amides
    predicate: have_unresolved_absolute_titer_units
    object: units
    notes: 'Indexed Table2 headings literally use mg ml^-1. Values monoamide+/-SD
      / diamide+/-SD: couSS-01 5.69+/-0.98 / 5.60+/-0.49; deltaS-parY4.13+/-0.71 /
