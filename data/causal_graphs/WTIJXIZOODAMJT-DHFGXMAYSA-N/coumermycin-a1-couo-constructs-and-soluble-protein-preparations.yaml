  edges:
  - subject: native
    predicate: is_core_sequence_reference_for
    object: template
    notes: The paper names pET26b-CouO as the PCR template and cites Stecher 2009.
      Its literal terminal primers match the deposited native CDS, but the complete
      template plasmid was not independently sequenced. The historical Strep-tag preparation
      is not silently assigned to the 2017 assay or crystallization sample.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Cloning and mutagenesis, PDF p.4; reference 3.
    - reference: DOI:10.1002/anie.200905095
      evidence_type: PRIMARY_EXPERIMENT
      notes: Main paper p.9547; Strep-tag purification, distinct from crude-lysate
        transformations. Supplement not obtained.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: CURATOR_INFERENCE
      notes: Native CDS used only as a reconstruction template.
  - subject: template
    predicate: was_PCR_template_for
    object: wt_dna
    notes: The outer primers are 5-prime AATAATTTTGTTTAACTTTAAGAAGGAGATATACATATGAAGATTGAACCGATTACGGG
      and 5-prime TGAAAATCTTCTCTCATCCGCCAAAACAGCCAAGCTTTCAGGCAGCGGCCC. Gibson assembly
      used pMS470delta8 linearized with NdeI/HindIII. Literal native-template reconstruction
      gives a 766-nt amplicon retaining the 693-nt CDS, native start/stop and 230-aa
      core; it is a model, not a sequenced experimental plasmid. The additionally
      listed CouO(NdeI)_for AATCACATATGAAGATTGAACCGATTACGGG and CouO(HindIII)_rev
      AATCAAAGCTTTCAGGCAGCGGC give a separate 712-nt literal amplicon model and are
      not substituted for the pMS outer pair.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Cloning and mutagenesis, PDF p.4.
    - reference: DOI:10.1371/journal.pone.0171056.s009
      evidence_type: PRIMARY_EXPERIMENT
      notes: S1 Table; all four terminal primers.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: CURATOR_INFERENCE
      notes: Independent literal-primer reconstruction.
  - subject: wt_dna
    predicate: encodes_engineered_preparation
    object: wt
    notes: WT denotes the recombinant expression comparator. The outer primer model
      retains the native stop and predicts no encoded terminal extension; it does
      not justify assigning native Q9F8T9 as the unique identity of the full assayed
      aliquot. The authors report sequencing all constructs.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Cloning/mutagenesis and protein expression, PDF pp.4-5.
    - reference: DOI:10.1371/journal.pone.0171056.s009
      evidence_type: PRIMARY_EXPERIMENT
      notes: S1 Table; terminal-primer model.
  - subject: host
    predicate: expressed
    object: wt
    notes: TOP10F' cells carrying pMS470 constructs were grown in 2xTY with 100 mg/L
      ampicillin, induced near OD600 0.8 with 0.1 mM IPTG, then cultivated 20 h at
      25 C and 130 rpm. Pellets were resuspended in 50 mM sodium phosphate pH 7.5,
      sonicated and cleared at 48000 g for one hour at 4 C. These are protein preparations,
      not demonstrated whole-cell coumermycin A1 production.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Protein expression, PDF pp.4-5.
  - subject: wt
    predicate: has_reported_expression_readout
    object: gel
    notes: S7 lane 11 is WT and lane 12 is empty pMS470d8, in both soluble and insoluble
      panels; lanes 1-10 follow the mutant list. The arrow marks the expected roughly
      26-kDa protein. Bands do not establish complete sequence, folding or equal active
      fraction.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056.s007
      evidence_type: PRIMARY_EXPERIMENT
      notes: S7 Figure and caption.
  - subject: template
    predicate: was_mutagenesis_template_for
    object: h15a_dna
    notes: Overlap-extension PCR used literal forward 5-prime CGAAGCCTTTGCCCGGATGGG
      and reverse 5-prime CCCATCCGGGCAAAGGCTTCG, followed by the pMS outer primers
      and Gibson assembly. The mutagenic pair is reverse-complementary and a native-template
      reconstruction gives only H15A in the 230-aa core. The reported sequencing confirmation
      is not an independently obtained full experimental construct sequence.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Cloning and mutagenesis, PDF p.4.
    - reference: DOI:10.1371/journal.pone.0171056.s009
      evidence_type: PRIMARY_EXPERIMENT
      notes: S1 Table; CouO-H15A forward/reverse primers.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: CURATOR_INFERENCE
      notes: Independent literal-primer core reconstruction.
  - subject: h15a_dna
    predicate: encodes_engineered_variant
    object: h15a
    notes: The source names the H15A substitution in the CouO construct panel. DNA
      and protein are distinct nodes; the native UniProt accession is not assigned
      to this engineered variant.
    evidence:
