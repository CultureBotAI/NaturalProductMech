graph:
  graph_id: coumermycin-a1-couo-constructs-and-soluble-protein-preparations
  scope: BIOSYNTHESIS
  description: 'Ten CouO mutant constructs, their separate protein products and the
    WT expression comparator, with literal-primer and solubility limits. Author-agent
    review #556. Native identity, engineered preparations and measured or inferred
    outcomes remain distinct; these precursor/surrogate studies do not demonstrate
    synthesis of mature coumermycin A1.'
