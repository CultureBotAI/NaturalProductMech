    object: limits
    notes: 'Four literal 40-nt Table 1 homology arms match AF235050.4: R5rightend_F27593..27632(+),
      Srightend_F30132..30171(+), leftendR1_F1476..1515(+), leftendR1_R22911..22950(-).
      Published coordinates refer to couMW16, not AF235050.4; these four hits differ
      by +1255. R5rightend_R has no exact match in AF235050.1-.4. Extending that offset
      would place it beyond the 40210-bp current deposit; absence is not proof of
      a faulty primer, and the distal cosmid junction is not reconstructed.'
    evidence:
    - reference: DOI:10.1007/s10295-013-1266-6
