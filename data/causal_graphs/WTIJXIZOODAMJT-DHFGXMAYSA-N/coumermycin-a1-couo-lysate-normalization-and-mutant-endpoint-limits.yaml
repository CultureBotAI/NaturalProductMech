  edges:
  - subject: substrate
    predicate: is_acceptor_in
    object: assay
    notes: The 0.1-mL reactions used 0.5 mM synthetic benzamide substrate (10 mM stock
      in DMSO), 50 mM sodium phosphate pH 7, 0.1 mg/mL BSA, 30 C and 1000 rpm for
      24 h. Reactions were stopped at 80 C for 15 min, clarified and passed through
      a 3-kDa filter. This substrate is not the native CouL mono-/bis-amide or mature
      antibiotic.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Activity assay, PDF p.5.
    - reference: DOI:10.1371/journal.pone.0171056.s006
      evidence_type: PRIMARY_EXPERIMENT
      notes: S6 Figure; substrate and assay conditions.
  - subject: sam
    predicate: is_donor_in
    object: assay
    notes: SAM dihydrochloride was directly supplied at 2 mM. No auxiliary SAM-regeneration
      enzyme or nonnatural donor is reported in this assay.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Activity assay, PDF p.5.
  - subject: normalization
    predicate: sets_calculated_target_loading_for
    object: assay
    notes: The authors calculate 28.6 ug CouO per reaction, chosen to match the least-soluble
      H120A preparation. Figure 7 is normalized to apparent expressed-protein content;
      S2 values are target abundance within cleared lysates, not purified sample concentrations.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Activity assay and Figure 7 discussion, PDF pp.5,10.
      snippet: normalized to the apparent expressed protein content
    - reference: DOI:10.1371/journal.pone.0171056.s010
      evidence_type: PRIMARY_EXPERIMENT
      notes: S2 Table; eleven target-content and total-protein rows.
  - subject: normalization
    predicate: does_not_equalize
    object: background
    notes: The target-content fractions range from 5.5% to 33.5%; therefore equal
      estimated target mass does not equalize total lysate protein or host background.
      Densitometry also does not measure the folded active fraction. Differences can
      constrain but do not uniquely isolate residue-specific catalytic chemistry.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056.s010
      evidence_type: PRIMARY_EXPERIMENT
      notes: S2 Table.
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: CURATOR_INFERENCE
      notes: Pavkov-Keller 2017; Interpretation of the reported normalization, PDF
        p.5.
  - subject: empty_vector
    predicate: was_reported_negative_control_for
    object: assay
    notes: The authors report no CouO activity with empty pMS470d8. Because of that
      observation they used buffer-only blanks; no numerical empty-vector readout
      or detection limit is supplied.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Activity assay, PDF p.5.
  - subject: blank
    predicate: was_displayed_negative_control_for
    object: assay
    notes: Figure 7 Blank and S1 File panel B concern 50 mM sodium phosphate pH 7,
      not an equal-protein host-lysate control. The plotted blank does not establish
      absence of all lysate matrix effects.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Activity assay and Figure 7, PDF pp.5,10.
    - reference: DOI:10.1371/journal.pone.0171056.s008
      evidence_type: PRIMARY_EXPERIMENT
      notes: S1 File, Figure B, PDF p.2.
  - subject: assay
    predicate: has_reported_chromatographic_readouts
    object: chromatograms
    notes: A Shimadzu Nexera HPLC-MS with an Agilent Poroshell 120 EC-C18 100x3-mm,
      2.7-um column was used. All twelve displayed chromatograms have PDA 305-nm headers;
      captions E/G call them HPLC(MS), a retained label discrepancy. Panels A/B are
      WT/buffer and C-L follow the ten mutants. They are not raw triplicate integration
      tables or a full calibration curve; exact numerical means are not invented.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; HPLC-MS, PDF p.5.
    - reference: DOI:10.1371/journal.pone.0171056.s008
      evidence_type: PRIMARY_EXPERIMENT
      notes: S1 File, all twelve figures A-L.
  - subject: assay
    predicate: forms_source_assigned_surrogate
    object: product
    notes: The study assigns C8 methylation. WT panel A reports nominal m/z 312 [M+H]+,
      334 [M+Na]+ and 350 [M+K]+, whereas blank panel B reports substrate ions 298/320.
      These support the source assignment but are not a new independent regiochemical
      determination for each variant or evidence of mature-antibiotic synthesis.
    evidence:
    - reference: DOI:10.1371/journal.pone.0171056
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pavkov-Keller 2017; Figure 7 and mechanism discussion, PDF pp.9-10.
    - reference: DOI:10.1371/journal.pone.0171056.s008
      evidence_type: PRIMARY_EXPERIMENT
      notes: S1 File, Figures A/B, PDF pp.1-2.
  - subject: product
    predicate: has_conflicting_supplement_label
    object: label_conflict
    notes: S6 draws a methyl substituent and names SAM as donor but prints 8-allyl
