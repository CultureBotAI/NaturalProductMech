  scope: BIOSYNTHESIS
  description: 'Complete eleven-row protein-content table and ten mutant endpoint
    comparisons, with WT, buffer and empty-vector controls; min/max uncertainty and
    the S6 product-label conflict remain explicit. Author-agent review #556. Native
    identity, engineered preparations and measured or inferred outcomes remain distinct;
    these precursor/surrogate studies do not demonstrate synthesis of mature coumermycin
    A1.'
