  scope: BIOSYNTHESIS
  description: 'Four native protein references (CouM, CouP, CouL, and NovN) accompany
    abstract-supported precursor tailoring. The reported tandem reactions do not establish
    a physical complex or complete native-A1 synthesis. Preparations and precursor/engineered
    products remain separately ungrounded; assay conditions were not obtained. Author-agent
    review #587; partial curation, not full-record sign-off.'
