  description: 'Partial TP-A0274 aglycone evidence: C-His StaP crystallography, separately
    purified C-His StaP/StaC tandem assays, and staJ-deletion cultures. IDs denote
    canonical parents, not constructs. No stable complex, direct StaC substrate, radical
    mechanism or sugar stereochemistry inferred.'
