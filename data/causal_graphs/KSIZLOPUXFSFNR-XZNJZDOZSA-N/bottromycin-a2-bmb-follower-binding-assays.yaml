  description: 'Fluorescence-polarization binding to engineered BmbC-C8S/S43C with
    a C-terminal His-tag extension and 6-(iodoacetamido)fluorescein label (SI Figure
    S12). All binding proteins remain MBP-tagged. BmbB/F nodes represent excised RRE
    domains, not assayed full-length methyltransferases; no methylation or native-substrate
    affinity is inferred. SI p. S7: 25 nM tracer, serial protein dilution, 50 mM HEPES
    pH 7.5, 300 mM NaCl, 2.5% glycerol, 0.5 mM TCEP, 30 min at 25 C, three independent
    titrations.'
