  scope: BIOSYNTHESIS
  description: Separate ACP-bound substrate and negative-control assays with a deliberately
    nonnative Fre surrogate. Exact-owner candidate CHEBI:7025 denotes pseudomonic
    acid A,not the clinical mixture. Native references,experimental preparations and
    source-assigned readouts are distinct. Substrate9 labels follow the beta-keto
    assay context; one synthesis sentence instead calls9 beta-hydroxy. That source
    inconsistency is retained,not a new chemical grounding. Partial main-text curation,not
    native pathway reconstitution,an established docking complex or full-record sign-off.
