    productive D-carrier priming. Candidate owner CHEBI:7025 denotes exact pseudomonic
    acid A, not the clinical mixture. Mixed-origin carrier/enzyme tests are methodological
    cross-compatibility evidence, not native thiomarinol or complete mupirocin biosynthesis.
