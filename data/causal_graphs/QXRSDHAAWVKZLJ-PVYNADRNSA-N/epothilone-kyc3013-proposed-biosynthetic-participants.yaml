graph:
  graph_id: epothilone-kyc3013-proposed-biosynthetic-participants
  scope: BIOSYNTHESIS
  description: 7 exact KYC3013 references with proposed source-annotated biosynthetic
    participation. Gene names follow this native deposit, not SMP44. Native PKS/NRPS
    annotations do not establish exact module reactions. UniProt automated thailandamide
    and fatty-acid annotations are not adopted. All seven historical UniProt entries
    D2X8Z3-D2X8Z9 are deleted; versioned GenPept references are used instead. The
    native record has a direct-submission reference. The legacy MIBiG paper concerns
    So ce90 and is not KYC3013 experimental proof. Proposed biosynthetic participation
    from native-locus annotations and the database cluster link, not an independently
    assayed catalytic function. No exact substrate, intermediate, reaction order,
    stoichiometry, physical complex or protein-to-final-product reaction is asserted.
    GROUNDED denotes reference identity, not experimental validation. Strain-specific
    gene names and sequences are not interchangeable with SMP44 or other strains;
    no assay construct or stock equivalence is claimed.
