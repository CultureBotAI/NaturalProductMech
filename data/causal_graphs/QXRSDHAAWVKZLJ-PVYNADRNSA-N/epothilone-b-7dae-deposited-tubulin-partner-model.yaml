  description: A deposited mixed-species tubulin-partner crystallization complex,
    not a native multispecies assembly. 7DAE version 1.1 (2023-11-29) models native-source
    porcine tubulins (taxon 9823), an engineered mouse Stmn4 fragment (taxon 10090),
    and an engineered chicken TTL construct (taxon 9031); the latter two are expressed
    in E. coli (taxon 562) according to the deposit. Strains are unspecified. Alternate
    conformers and partial protein-atom occupancies are retained. The primary paper
    DOI:10.1016/j.bbrc.2020.11.082 was inaccessible; only its abstract on the PDB
    page was inspected. No primary assay result is imported. GROUNDED identifies the
    deposited model reference, not an independently assayed native protein. No native
    isoform homogeneity, stock equivalence, processing state, affinity, potency, precise
    hydrogen bond, drug-induced assembly or downstream effect is asserted. Other modeled
    partners are not asserted to be drug targets.
