    causal result is imported. These are deposited model references, not proof of
    uniform native isoforms, processing or post-translational modifications. No isoform-selective
    binding, affinity, potency, precise hydrogen bond, downstream regeneration or
    clinical effect is asserted. GROUNDED denotes reference identity, not an independent
    functional assay.
