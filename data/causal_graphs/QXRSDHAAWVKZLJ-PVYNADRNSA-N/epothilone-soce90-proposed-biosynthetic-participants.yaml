graph:
  graph_id: epothilone-soce90-proposed-biosynthetic-participants
  scope: BIOSYNTHESIS
  description: 6 exact So ce90 references with proposed source-annotated biosynthetic
    participation. Gene names follow this native deposit, not SMP44. Native PKS/NRPS
    annotations do not establish exact module reactions. UniProt automated thailandamide
    and fatty-acid annotations are not adopted. Only six new core references are included;
    the existing Q9KIZ4 EpoK graph is not duplicated or rewritten. The primary 2000
    paper was inaccessible; citation metadata is not treated as inspected experimental
    evidence. Proposed biosynthetic participation from native-locus annotations and
    the database cluster link, not an independently assayed catalytic function. No
    exact substrate, intermediate, reaction order, stoichiometry, physical complex
    or protein-to-final-product reaction is asserted. GROUNDED denotes reference identity,
    not experimental validation. Strain-specific gene names and sequences are not
    interchangeable with SMP44 or other strains; no assay construct or stock equivalence
    is claimed.
