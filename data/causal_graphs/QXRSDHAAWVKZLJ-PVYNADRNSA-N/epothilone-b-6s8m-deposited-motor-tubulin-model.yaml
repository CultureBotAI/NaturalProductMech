    microtubule. 6S8M version 1.4 (2025-10-01) supersedes 5MLV as alternative modeling
    of the same data, not an independent experiment. All three gene-source and expression-host
    tables name S. pombe NCBITaxon:4896 with unspecified strains; UniProt references
    name strain 972, NCBITaxon:284812, which does not establish experimental-stock
    equivalence. The primary paper DOI:10.1016/j.jmb.2019.01.011 was inaccessible;
    only its abstract on the PDB page was inspected. No primary assay result is imported.
    GROUNDED identifies the deposited model reference, not an independently assayed
    native protein. No native isoform homogeneity, stock equivalence, processing state,
    affinity, potency, precise hydrogen bond, drug-induced assembly or downstream
    effect is asserted. Other modeled partners are not asserted to be drug targets.
