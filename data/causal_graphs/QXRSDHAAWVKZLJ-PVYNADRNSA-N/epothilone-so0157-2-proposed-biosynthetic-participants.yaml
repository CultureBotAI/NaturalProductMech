graph:
  graph_id: epothilone-so0157-2-proposed-biosynthetic-participants
  scope: BIOSYNTHESIS
  description: 7 exact So0157-2 references with proposed source-annotated biosynthetic
    participation. Gene names follow this native deposit, not SMP44. Native PKS/NRPS
    annotations do not establish exact module reactions. UniProt automated thailandamide
    and fatty-acid annotations are not adopted. EpoF/D3G7A8 is a generic P450 with
    homology-level existence, not an experimentally established epothilone D epoxidase.
    The inspected 2013 abstract concerns promoters, not individual synthase assays;
    full text was inaccessible. Proposed biosynthetic participation from native-locus
    annotations and the database cluster link, not an independently assayed catalytic
    function. No exact substrate, intermediate, reaction order, stoichiometry, physical
    complex or protein-to-final-product reaction is asserted. GROUNDED denotes reference
    identity, not experimental validation. Strain-specific gene names and sequences
    are not interchangeable with SMP44 or other strains; no assay construct or stock
    equivalence is claimed.
