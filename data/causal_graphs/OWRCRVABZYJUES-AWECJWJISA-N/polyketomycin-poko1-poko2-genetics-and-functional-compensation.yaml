  - subject: d2
    predicate: has_reported_metabolite_signal
    object: ip5
    notes: The main new signal is IP5 at 24.25 min, [M-H]- m/z 451.2. Isolation from
      15 L cultures was difficult and the available NMR data were not interpretable.
      The results describe complete degradation after three weeks at 4 C, discussion
      after two weeks, with greater stability at -20 C. Similarity to premithramycinone
      G in mass, UV and instability does not establish exact chemical identity, an
      additional three-carbon extension, or an enzyme substrate. Figure 4.3 is a structural
      proposal.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.1.4.4-3.1.5 pp. 35-37, Table 3.5/Fig. 3.10; discussion 4.1.3
        pp. 78-79.
  - subject: d2
    predicate: has_reported_metabolite_signal
    object: ip6
    notes: The minor IP6 signal has LC/MS retention 28.96 min and a distinct UV profile.
      Text reports [M-H]- m/z 683.2 while Table 3.5 gives 682.2. Neither is silently
      selected as an exact mass. IP6 was not isolated because too little material
      was available; no formula, structure, precursor assignment or parent identity
      is adopted from this signal.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
