graph:
  graph_id: polyketomycin-poko1-poko2-genetics-and-functional-compensation
  scope: BIOSYNTHESIS
  description: 'Native Tu6028 PokO1/PokO2 single- and double-mutant genetics, metabolite
    profiles and PokO2-fragment rescue. Restoration supports genetic compensation,
    not purified enzyme substitution or a physical complex. IP3 is a characterized
    shunt; IP5/IP6 remain incompletely identified, and proposed hydroxylation chemistry
    is kept distinct from measured production. Source-review issue #532 preserves
    allele-size, culture, probe and labeling discrepancies. All product observations
    retain the owner record''s unresolved stereochemical resolution.'
