  - subject: d2
    predicate: has_reported_production_phenotype
    object: loss
    notes: Matched four-day HA cultures were extracted and analyzed by HPLC/LC-MS.
      The mutant lacked the wild-type polyketomycin signal at 27.20 min, [M-H]- m/z
      863.3. Figure 3.9 four-day traces use 430 nm, while the two-day mutant trace
      uses 320 nm. This is no detected product under the tested conditions, not a
      calibrated zero titer, stated detection limit or universal essentiality.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
