  - subject: d2
    predicate: has_reported_early_metabolite_profile
    object: early
    notes: Two-day pokOII-mutant extract contained IP1/IP2/IP4. Figure 3.9 uses 320
      nm for this early trace versus 430 nm for the four-day profiles, so signal heights
      are not directly comparable titers. Wild-type occurrence and the historical
      assignment limits preclude treating these as demonstrated PokO2 substrates or
      products.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.1.4.4 p. 35 and Fig. 3.9; historical evidence 3.1.2.4/3.1.3.
  - subject: double
    predicate: has_reported_early_metabolite_profile
    object: early
    notes: The double mutant also showed IP1/IP2/IP4 after two days, as did the other
      mutants and wild type. This is an extract-profile observation, not a proven
      link from either oxygenase to the biosynthesis of these compounds.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.1.7.3 p. 44.
  - subject: rd
    predicate: supports_genetic_inference
    object: compensation
    notes: Retained product in the pokOI single mutant, loss in the double mutant
      and restoration upon adding the pokOII-containing construct support functional
      compensation at the genetic/production level. This is not purified PokO2 turnover
      of the native PokO1 substrate, a demonstrated binding interaction, or proof
      of an evolved substrate-flexibility mechanism. Media effects, expression context
      and unresolved mutant sequence details bound the inference.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: CURATOR_INFERENCE
      notes: Inference from 3.1.6-3.1.7 pp. 38-45 and discussion 4.1.4 pp. 81-84.
  - subject: poko2
    predicate: has_inferred_compensatory_role
    object: compensation
    notes: The source assigns PokO2 the capacity to compensate for loss of intact
      pokOI in this native producer and pSET rescue context. No oligomer, protein
      complex, stoichiometry or enzyme kinetic equivalence was tested in the inspected
      experiments. The native accession is exact; the mechanistic interpretation remains
      genetic inference.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: CURATOR_INFERENCE
      notes: Discussion 4.1.3-4.1.4 pp. 80-84, grounded in double-mutant/rescue results.
  - subject: poko1
    predicate: has_proposed_biosynthetic_role
    object: c4
    notes: The authors propose early hydroxylation at aglycone C-4, based on the mutant
      shunt profile, structural analysis and analogy with OxyE/CmmOI/MtmOI. No purified
      native PokO1 assay, exact immediate substrate, cofactor requirement measurement
      or reaction rate is provided here. Retained production does not make PokO1 irrelevant,
      and similarity to other pathways is not a native enzyme experiment. Numbering
      follows the thesis polyketomycin aglycone.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: CURATOR_INFERENCE
      notes: Sections 3.1.6.1 p. 38 and 3.1.8.4 pp. 47-49; discussion 4.1.4 pp. 81-84.
  - subject: poko2
    predicate: has_proposed_biosynthetic_role
    object: diol
    notes: The proposed role is hydroxylation at C-4a and C-12a of the aglycone, inferred
      from native genetics, the IP3 structural assignment and analogy to related FAD
      oxygenases. IP5 was not resolved by NMR, so its proposed absence of these groups
      is not independent structural proof. No purified PokO2 reaction, exact native
      substrate or oxygen-source experiment is asserted. The owner stereochemical
      disagreement is unchanged.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: CURATOR_INFERENCE
      notes: Sections 3.1.4.1 p. 32, 3.1.5.2 p. 37 and 3.1.8.4 p. 49; discussion 4.1.3
        pp. 78-80.
  - subject: poko2
    predicate: has_proposed_compensatory_reaction
    object: c4
    notes: The C-4 hydroxylation assignment in the absence of intact pokOI is the
      authors' chemical interpretation of genetic compensation. Restoration of the
      final product does not on its own measure this particular bond change or rule
      out all indirect effects. It is not a direct substrate-to-product reaction edge
      and does not use IP3 as a demonstrated substrate.
