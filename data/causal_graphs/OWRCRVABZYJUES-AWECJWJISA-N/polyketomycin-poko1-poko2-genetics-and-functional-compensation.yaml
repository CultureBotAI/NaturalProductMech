  - subject: d1
    predicate: has_reported_production_phenotype
    object: retained
    notes: 'HPLC and LC/MS of HA production extracts retained a peak assigned as polyketomycin
      by retention, UV and [M-H]- m/z 863.3. Other confirmed mutant clones also retained
      product. This is not equal wild-type titer or all-condition dispensability:
      Fig. 3.13 uses different vertical scales. Results say six-day cultures while
      the caption says four days; its mutant trace label says pokOII although the
      section, caption and Table 3.6 identify pokOI. No PokO1 complementation was
      performed because production was retained. The genotype PCR contains partial
      pokT1/pokC2 sequences and is not evidence for a performed rescue construct.'
    evidence:
