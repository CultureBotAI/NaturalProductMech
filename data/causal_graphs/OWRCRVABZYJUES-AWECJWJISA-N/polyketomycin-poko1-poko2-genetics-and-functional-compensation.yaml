  - subject: double
    predicate: has_no_detected_metabolite_signal
    object: ip5
    notes: The double mutant did not show the IP5 signal reported in the pokOII single
      mutant. This comparative profile is consistent with a changed pathway block,
      but IP5 structure remains unresolved and yeast-extract effects are reported
      elsewhere. No direct PokO1-to-IP5 reaction or concentration of exactly zero
      is inferred from this absence.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.1.7.3 pp. 44-45, Table 3.7/Fig. 3.16; medium context 4.1.3
        p. 78.
  - subject: double
    predicate: accumulates_reported_metabolite
    object: ip3
    notes: IP3 is the major reported double-mutant signal at 24.44 min, [M-H]- m/z
      395.2. The authors recovered 5 mg from 20 L of four-day cultures, a 0.25 mg/L
      isolation yield, not calibrated biosynthetic titer. Acidified supernatant was
      fractionated; a co-eluting impurity in the 95% MeOH fraction required preparative
      TLC. Fractions were checked by HPLC before pooling. High-resolution negative-mode
      ESI-MS gave 395.07731 versus calculated 395.076695 for [M-H]-, supporting C21H16O8.
      Discussion p. 82 instead says EIMS; the method-specific results are retained
      without treating that label as a second experiment.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 3.7 p. 45; sections 3.1.8.1-3.1.8.3 pp. 46-47 and Fig. 3.17; compare
        discussion 4.1.4 p. 82.
  - subject: rd
    predicate: introduces_gene_encoding
    object: poko2
    notes: The same pSET-pok28 construct was introduced into the pokOI/pokOII double
      mutant to restore the pokOII function while pokOI remained disrupted. This is
      one-locus complementation of a double mutant, not reconstruction of both native
      loci, or evidence that the O1 deletion protein is equivalent to native PokO1.
      The primer-defined full O2/partial T2 coverage and absence of a complete final
      plasmid sequence apply to this context too.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.1.7.4 p. 45; shared construct 5.6.5.3 pp. 128-129.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ483966.1
      evidence_type: CURATOR_INFERENCE
      notes: F/R-pok28komp native coverage 45115..47109 contains complete pokO2, 188
        bp of pokT2, and no second complete CDS.
  - subject: rd
    predicate: restores_reported_production
    object: restored
    notes: All seven transformed double-mutant clones again synthesized detectable
      polyketomycin after addition of pSET-pok28. The section calls this partial complementation
      because only one of two deleted loci is supplied; it gives no numerical fraction
      of wild-type yield. Do not reinterpret partial as a measured low production
      percentage. A matched empty-vector production trace is not shown in this inspected
      section.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.1.7.4 p. 45.
      snippet: Die sieben transformierten Klone waren wieder in der Lage Polyketomycin
        zu synthetisieren.
  - subject: d1
    predicate: has_reported_early_metabolite_profile
    object: early
    notes: After two days, IP1/IP2/IP4 signals were also found in the pokOI-mutant
