  - subject: d2
    predicate: targets_gene_encoding
    object: poko2
    notes: pKC-pok28del was made by Red/ET cassette replacement and NheI/SpeI excision,
      reported as approximately 95% internal deletion with 80 native bases remaining.
      Clone 82 lacked the 612-bp internal PCR product and showed a short external-primer
      product; intact genomic PCR was unreliable, so absence alone was not the genotype
      proof. Southern supported deletion. Results report external PCR 1995/465 bp,
      whereas methods report 1996/460 bp. Literal native-primer reconstruction gives
      1995/459 bp and a 1536-bp in-frame net deletion; BamHI 3265/1729 bp agrees with
      the reported Southern. These calculations are not the actual sequenced mutant.
      The 801-bp probe spans parts of pokC3 and pokT2 plus their intergenic region,
      although methods describe it as pokT2. Figure 3.7 reverses left/right in part
      of its caption. Method 5.6.5.2 first says pokOI next to pokOIV, but heading/primers/maps
      target pokOII. Discussion p. 81 gives 451 aa instead of the verified native
      541 aa.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.1.4.2-3.1.4.3 pp. 32-34, Figs. 3.7-3.8; Table 5.21 pp. 123-124;
        construction 5.6.5.2/Table 5.23 p. 128; PCR p. 134 and Southern pp. 137-138;
        map p. 170.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ483966.1
      evidence_type: CURATOR_INFERENCE
      notes: 'Curator mapping: external primers 45115..47109; internal 45941..46552;
        probe 44150..44950 spans 348 bp of pokC3 and 404 bp of pokT2. Reported primer
        sequences and restriction geometry checked; no complete mutant sequence asserted.'
    - reference: https://www.uniprot.org/uniprotkb/C0JWD3
