  edges:
  - subject: d1
    predicate: targets_gene_encoding
    object: poko1
    notes: The source describes replacement of approximately 94% of pokOI by an apramycin/oriT
      cassette through Red/ET, then NheI excision and transfer to pKC1132 as pKC-pok20del.
      After seven selection-free passages, PCR distinguished reverted wild type, single
      crossovers and deletion clones; II-26 was selected. Results report 1882/731-bp
      PCR and 2531/1375-bp KpnI Southern fragments, but methods give 1388 bp for the
      latter. Literal primer/native-locus reconstruction instead predicts a 1143-bp
      in-frame net deletion, 739-bp PCR and 1388-bp Southern. These are curator calculations,
      not an observed mutant sequence or replacement of the reported allele. The inactivation
      plasmid was reportedly sequence-checked. Figure 3.11 calls one single-crossover
      clone 76 in text but 79 in its caption; II-26 is unambiguous. The native accession
      denotes the full parent, not the residual deletion protein.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.1.6.2-3.1.6.3 pp. 38-40, Figs. 3.11-3.12; Table 5.21 p. 123;
        methods 5.6.5.1 p. 127, Table 5.25 p. 133 and Southern pp. 138-139; Fig. 7.2
        p. 169.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ483966.1
      evidence_type: CURATOR_INFERENCE
      notes: F/R-pok20komp map 37492..39373; F/R-pok20Red plus NheI scar predict 1143
        bp net deletion. F-pok20komp/R-SBpok20Kpn span 269 bp, matching methods rather
        than results 270 bp. Expected band labels are not exact measurements from
        the gel.
    - reference: https://www.uniprot.org/uniprotkb/C0JWC5
      evidence_type: DATABASE_ASSERTION
      notes: Active unreviewed native PokO1, 409 aa, taxon 42236; EMBL FJ483966/ACN64845.1.
        Inspected 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ACN64845.1
      evidence_type: DATABASE_ASSERTION
      notes: Native PokO1 of Streptomyces diastatochromogenes Tu6028; FJ483966.1:37950..39179,
        positive strand.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ483966.1
      evidence_type: CURATOR_INFERENCE
      notes: 'Curator comparison: native GenBank, MIBiG BGC0001061.4, GenPept and
        UniProt translations agree exactly. MIBiG substitutes ambiguity codes at four
        locus positions; two lie within pokO2 but do not change its translation. Whole-DNA
