  - subject: d2
    predicate: has_reported_medium_dependent_profile
    object: medium
    notes: The discussion reports IP5 in the pokOII mutant with Difco yeast extract
      but IP3 with Roth yeast extract. This shows culture-context dependence in the
      reported profiles, not direct measurement of PokO1 activity, expression or a
      particular medium constituent. The authors' interpretation that PokO1 only functions
      with the Difco preparation is not promoted to an enzyme-assay result. No quantitative
      media comparison or calibrated productivity ratio is given.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Discussion 4.1.3 p. 78; yeast-extract source context 5.1.1.
  - subject: r2
    predicate: introduces_gene_encoding
    object: poko2
    notes: Pfu amplification with F/R-pok28komp produced the native pokOII-containing
      fragment, cloned via EcoRI/XbaI into pUWLoriT and then via ClaI/XbaI into integrative
      pSET-1cerm under ermE-up. pUWL work was abandoned for unreliable thiostrepton
      selection, not a controlled inactivity result. Native primer mapping gives 1995
      bp at 45115..47109, containing full pokO2 plus 188 bp of pokT2 and no second
      complete CDS. Engineered restriction substitutions lie outside pokO2; the amplified
      sequence has no internal ClaI site. The pre-digestion PCR span is not the complete
      final integrated plasmid. Partial pokT2 carriage does not establish expression
      of functional PokT2.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.1.4.5 p. 36; Table 5.21 pp. 123-124; methods 5.6.5.3 pp. 128-129.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ483966.1
      evidence_type: CURATOR_INFERENCE
      notes: Curator F/R-pok28komp alignment and CDS overlap; EcoRI/XbaI engineered
        sites and ClaI absence checked on the PCR model. This is reconstructed native
        coverage, not a deposited full plasmid sequence.
  - subject: r2
    predicate: restores_reported_production
    object: restored
    notes: All ten tested exconjugants resumed detectable polyketomycin production
      by chromatographic analysis. The source concludes that polar effects are excluded.
      The result supports rescue in this expression context, but no calibrated recovery
      to wild-type yield or universal exclusion of neighboring-gene effects is asserted.
      The inspected rescue section does not show a matched empty-pSET production control;
      generic conjugation controls are not the same comparison.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.1.4.5 p. 36; pSET-pok28 construction 5.6.5.3 pp. 128-129.
  - subject: double
    predicate: targets_gene_encoding
    object: poko1
    notes: The second knockout was introduced into the already verified pokOI mutant.
      Clone II-27 retained the pokOI deletion by KpnI Southern, with the results again
      labeling wild-type 2531 bp and mutant 1375 bp. The pre-existing O1 result versus
      method/reconstruction discrepancy remains unresolved; the two loci were tested
      in one double-mutant clone, not inferred from separate strains.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.1.7.1-3.1.7.2 pp. 42-44, Figs. 3.14-3.15.
  - subject: double
    predicate: targets_gene_encoding
    object: poko2
    notes: pKC-pok28del was conjugated into the pokOI mutant, followed by seven passages
      and selection of apramycin-sensitive clones. Clone II-27 gave the reported 465-bp
      external PCR product and 1729-bp BamHI Southern fragment rather than the native
      3265-bp fragment. Clone I-26 also showed the short PCR product; I-31/II-5 did
      not yield a product. This is targeted genotype evidence, not a complete double-mutant
      genome sequence. The single-mutant primer-derived 459-bp expectation remains
      distinct from the reported 465-bp label.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/5426
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.1.7.1-3.1.7.2 pp. 42-44, Figs. 3.14-3.15; same construct/primers
        as 5.6.5.2/Table 5.21.
  - subject: double
    predicate: has_reported_production_phenotype
    object: loss
    notes: No polyketomycin signal was detected in clone II-27 extracts, compared
      with simultaneously inoculated wild type. Results text says six-day harvest;
