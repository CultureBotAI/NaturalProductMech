    notes: 'Sequence similarity suggests an anthrone-type oxygenase forming the outer-ring
      quinone. The thesis did not inactivate pokO3 and leaves biochemical testing
      open. Cofactor independence, catalytic residue functions and isotope incorporation
      were not tested for PokO3. Figure 4.7 places this step after hydroxylation and
      before late tailoring, but neither order nor exact substrate was measured. IP3
      is a shunt and IP5 lacks an established structure; neither demonstrates PokO3
      turnover. No essentiality or physical-complex claim is made. See source-review
      issue #533.'
