graph:
  graph_id: polyketomycin-poko4-bounded-genetics-and-rescue-cocarriage
  scope: BIOSYNTHESIS
  description: 'Native Tu6028 PokO4 deletion and rescue implicate the locus in polyketomycin
    production, without establishing purified enzyme chemistry. The rescue fragment
    is inferred to carry native PokS7 as well as PokO4; PokS7 has no individually
    assigned activity here. Historical IP1/IP2/IP4 signals, later foxicin observations
    and early-PKS hypotheses remain distinct. Source-review issue #531 preserves construct,
    time-course, structure and numbering limits. The owner remains at its original
    unresolved stereochemical resolution.'
