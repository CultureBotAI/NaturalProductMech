    Compound numbers follow Fan et al. 2025. Cached main text and captions only; supplementary
    sequences and methods were inaccessible. Paper-labelled proteins remain ungrounded
    or review-needed, not substituted with homologs. No native necessity, physiological
    rate limit, localization, preferred methylation order or quantitative kinetics
    is asserted. The demethylated branch stops at 3-CoA here; no unrepresented downstream
    steps are implied.
