  - subject: construct
    predicate: was_designed_for_internal_deletion_of
    object: gene
    notes: Cosmid VII-8g arms were cloned XbaI/BamHI then BamHI/EcoRI into pBSKT to
      form pUG012; its approximately 2.8-kb XbaI/EcoRI insert was transferred to pKC1132,
      yielding pUG013 with apramycin selection. The source reports an internal in-frame
      756-bp deletion, not whole-gene removal. Literal primers are P01f GTACGGCGGTCTAGAAGGAC,
      P01r CATTCGGGATCCTTCCCTGC, P02f CGACGGCGGATCCCAGTGAA and P02r GGCCACCGAATTCGGCCACA.
      Their declared native coordinates and introduced sites reproduce 1392- and 1434-nt
      PCR products. A BamHI fusion model loses 756 nt net and leaves a 66-nt CDS including
      stop, predicting a 21-aa remnant (MNQPWPATRADRPNICREGSQ). This model is not
      a sequenced experimental allele, verified expression product or full plasmid.
      The single-crossover strains retain both copies in different arrangements.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Tables 14/15 and section 7.5.1, thesis PDF pp.39-40,49-50.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: CURATOR_INFERENCE
      notes: Literal-primer amplicons and intended BamHI-fusion reconstruction, not
        complete experimental junction sequencing.
  - subject: sc15
    predicate: was_generated_with
    object: construct
    notes: PEG-mediated protoplast transformation and apramycin selection yielded
      UG J1-15 as a single-crossover isolate. The source reports pUG013 integration
      by homologous recombination; pUG012/thiostrepton selection instead gave many
      spontaneous-resistant colonies and is not equivalent evidence of integration.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 1.3.1 and Figure 5, thesis PDF pp.80-81.
  - subject: sc21
    predicate: was_generated_with
    object: construct
    notes: UG J1-21 is another pUG013 single-crossover arrangement, not a clean simJ1
      deletion. The source map retains an intact copy separated from the putative
      native transcriptional unit by vector and resistance-gene DNA. Its inferred
      transcriptional silencing is not a measured RNA or protein abundance.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
