  edges:
  - subject: gene
    predicate: encodes_native_protein
    object: simj1
    notes: AAL15603.1 at AF322256.1:23738..24559(+), AAG34187.1 at AF321122.1:6950..7771(+)
      and AAK06807.1 at AF324838.2:68532..69353(+) each have an 822-nt CDS including
      stop and translate exactly to the 273-aa Q9F5J1 sequence using CDS-aware table
      11. The last deposit calls the gene simD2; all name S. antibioticus Tu6040/Tue6040,
      taxon 1890. This is not the distinct 246-aa SimJ2/SimC6 protein, and the native
      accession does not identify an engineered allele. Earlier SimReg1 graphs mention
      partial simD2 flanks in constructs, not an independently assayed SimJ1 protein.
    evidence:
