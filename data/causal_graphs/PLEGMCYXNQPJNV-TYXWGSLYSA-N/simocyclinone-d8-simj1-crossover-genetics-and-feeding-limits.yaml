  - subject: fed
    predicate: uses_mutant_background
    object: sc21
    notes: The feeding experiment used UG J1-21 in 50 mL complex production medium
      1 at 28 C and 120 rpm. Section 4.1.3 defines that medium as glycerol 20 g/L
      and full-fat soy flour 20 g/L in tap water, pH 7.5. These feeding-specific conditions
      are not replaced by the broader temperature and shaking ranges in the general
      culture section, and are not assumed for every unrelated experiment.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 4.1.3 and 8.5.1, thesis PDF pp.30,63-64.
  - subject: fed
    predicate: was_supplied_with
    object: methyl_adhc
    notes: At 42 h after inoculation and again 5 h later, 1 mg novobiocin-derived
      8-methyl-aminocoumarin in 10 uL methanol was added. Cultures continued for another
      43 h before extraction/HPLC. This substrate differs from the native 8-chloro
      aminocoumarin of D8; no exact compound accession is chosen from a similar name.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 8.5.1 and discussion, thesis PDF pp.63-64,115.
  - subject: fed
    predicate: has_source_assigned_analogue_readout
    object: dmet
    notes: Figure 6D reports D-met, [M-H]- 910.2, with a methyl substituent in place
      of the D8 chlorine. Feeding restores formation of an aminocoumarin-containing
      D-series analogue, not native chlorinated D8. Residual C4/C4a signals are visible;
      complete conversion or full WT yield is not claimed. This is metabolic bypass
      feeding, not simJ1 gene complementation, direct SimJ1 catalysis or a separately
      measured purified SimL reaction.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 1.3.3, Figure 6D and discussion, thesis PDF pp.82-83,115.
  - subject: solvent_controls
    predicate: were_reported_as_parallel_controls_for
    object: fed
    notes: Methods specify parallel original WT and mutant cultures without the aminocoumarin
      feed but with 10-uL methanol additions, extracted and analyzed likewise. This
      records the control design; it does not invent a numerical solvent effect or
      silently identify every displayed WT trace as that particular solvent-control
      culture.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 8.5.1, thesis PDF p.64.
