  - subject: sc15
    predicate: has_reported_genotyping_readout
    object: sc_genotyping
    notes: Figure 5 places the intact copy at the end of the proposed simKLHIYJ1 unit
      in UG J1-15. BglII/NotI and PvuII/EcoRI Southern patterns support the source-assigned
      arrangement. Native AF322256.1 fragment lengths 3788 and 3893 bp agree with
      the displayed WT 3.79/3.89-kb rounding. The source reports a 1242-bp downstream
      probe (1.2 kb in methods), consistent with the primer-derived BamHI/EcoRV interval.
      No complete single-crossover vector junction was sequenced in this independent
      audit.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Southern methods and Figure 5, thesis PDF pp.57-58,80-81.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: CURATOR_INFERENCE
      notes: Native restriction geometry and primer-derived 1242-bp probe.
  - subject: sc21
    predicate: has_reported_genotyping_readout
    object: sc_genotyping
    notes: Figure 5 instead places the deleted copy adjacent to the putative native
      transcriptional unit in UG J1-21. The results report BglII/EcoRV bands at 2.77
      and 1.97 kb (not pictured there). The deposited native interval is 2729 bp,
      not 2770 bp; the intended 756-nt deletion model gives 1973 bp. This source-versus-native
      discrepancy is unresolved. Figure 7 later uses coarse 2.8/2.0-kb labels. Reported
      bands, reconstructed lengths and exact experimental allele sequences are not
      interchangeable.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results for the single crossovers and Figure 7, thesis PDF pp.80,84.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: CURATOR_INFERENCE
      notes: Native BglII/EcoRV cuts 23062 and 25791 (one-based cut positions); intended-deletion
        model loses 756 nt.
  - subject: wildtype
    predicate: has_source_assigned_product_profile
    object: d_profile
    notes: Figure 6A shows D4 and D8 signals in the original WT; Figure 6B labels
      [M-H]- assignments of 896.2 and 930.4, respectively. These are source assignments,
      not independently verified accurate masses or complete stereochemical determinations.
      Section 9.1.2 specifies acidifying 50 mL whole culture to pH 4, extracting twice
      with 50 mL ethyl acetate and reconstituting in 5 mL methanol. The results call
      the analyzed material culture filtrate; this fraction discrepancy remains unresolved.
      The specific simocyclinone HPLC used a 0.1% phosphoric acid/acetonitrile gradient
      at 2 mL/min, not the preceding generic 1 mL/min RP-18 method. No absolute yield,
      detection threshold or replicate count is invented.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Specific analytical method and Figure 6, thesis PDF pp.66,82-83.
  - subject: sc15
    predicate: retains_source_assigned_product_profile
    object: d_profile
    notes: UG J1-15 produces the same source-assigned D-series identities as WT, D4
      and D8. Figure 6 uses different intensity scales across panels; this is not
      proof of identical molar productivity, unchanged protein expression or a purified
      reaction rate.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 6B and section 1.3.2, thesis PDF pp.82-83.
  - subject: sc21
    predicate: lacks_detected_D_series_profile
    object: d_profile
    notes: The source reports complete loss of D4/D8 production in UG J1-21, with
      no corresponding assigned peaks in Figure 6C. The graph records a qualitative
      nondetection phenotype, not a numerical zero or a universal detection limit.
      It supports a role for the manipulated region in aminocoumarin-containing product
      formation but does not isolate a biochemical catalytic step or exclude all polar
      and insertion effects.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 1.3.2 and Figure 6C, thesis PDF pp.82-83.
