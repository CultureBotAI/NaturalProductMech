graph:
  graph_id: simocyclinone-d8-simj1-crossover-genetics-and-feeding-limits
  scope: BIOSYNTHESIS
  description: 'SimJ1/SimD2 native genetics, methyl-aminocoumarin feeding and the
    confounded double-crossover follow-up from Ute Galm''s 2003 primary thesis (review
    #544). Native Q9F5J1 is distinct from engineered alleles; single crossovers retain
    differently arranged intact and deleted copies. D-met feeding rescue is not restored
    chlorinated D8. Qualitative product assignments, the restriction-size and culture-fraction
    discrepancies, and source-inferred catalysis remain explicit. The related 2002
    journal paper was not independently obtained in full; thesis-only results are
    cited to the thesis. PDF page numbers are four greater than printed page numbers.'
