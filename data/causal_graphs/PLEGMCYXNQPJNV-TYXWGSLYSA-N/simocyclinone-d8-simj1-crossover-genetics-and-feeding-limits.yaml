  - subject: wildtype
    predicate: is_parallel_positive_production_comparator_for
    object: production_loss
    notes: The original WT cultured in parallel still produced D8 while both deletion-classified
      isolates and the revertant lost all reported simocyclinones. This is a positive
      production comparator, not a purified-enzyme control or proof that the passaged
      strains differ only at simJ1.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 1.3.4, thesis PDF pp.84-85.
  - subject: simj1
    predicate: is_proposed_to_contribute_to
    object: oxidation
    notes: The thesis proposes oxidation of a beta-hydroxytyrosyl intermediate to
      a beta-ketotyrosyl intermediate, based on sequence similarity and pathway reasoning.
      These experiments show genetics and feeding, not purified SimJ1 turnover or
      a directly determined substrate. The source argues against polarity from 170/322-bp
      intergenic distances but could not unambiguously identify the downstream -10/-35
      promoter regions. The simKLHIYJ1 transcriptional unit is also proposed from
      spacing, not mapped transcripts. Lack of rescue by endogenous SimJ2 in this
      context is not a universal inactivity claim; the separate SimJ2 mutant production
      profiles were explicitly not examined in the thesis.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Discussion and hypothetical Figure 18, thesis PDF pp.112,114-115; unexamined
        SimJ2 phenotypes stated on PDF p.86.
