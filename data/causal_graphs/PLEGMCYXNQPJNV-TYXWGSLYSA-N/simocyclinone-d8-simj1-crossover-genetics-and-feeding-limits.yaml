  - subject: dc692
    predicate: has_shared_followup_production_loss
    object: production_loss
    notes: UG J1-692 likewise lost all reported simocyclinone production. This broader
      loss is not interpreted as specific proof of the proposed SimJ1 oxidation reaction.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 1.3.4, thesis PDF pp.84-85.
  - subject: revertant
    predicate: also_has_followup_production_loss
    object: production_loss
    notes: 'The WT-genotype revertant also produced no simocyclinones in the repeated
      cultures. This shared loss is a confound for interpreting the double crossovers:
      it cannot be attributed specifically to absence of simJ1. The cause was not
      resolved and the source stopped this follow-up; no particular secondary mutation
