graph:
  graph_id: simocyclinone-d8-simj2-constructs-and-unexamined-production
  scope: BIOSYNTHESIS
  description: 'Native SimJ2/SimD4 Q9F5I9 and genetically targeted constructs from
    the Galm 2003 and Schafer 2016 primary theses (review #546). Historical SimC6
    maps this protein by literal primers, not by the current GenBank gene name alone.
    The Galm single-crossover clones were genotyped, but their metabolite production
    was explicitly not examined. Reported deletion/frame and fragment sizes remain
    separate from native and literal-primer reconstructions. The later PAC construct
    is a source-listed resource, not a measured catalytic or production outcome. No
    purified SimJ2 reaction, functional-null allele or established modular-PKS tetraene
    role is asserted. Existing simD4-region DNA assays and promoter reporters are
    preserved without promotion to protein activity. Galm PDF page numbers exceed
    printed pages by four; Schafer numbers coincide.'
