  - subject: wt
    predicate: has_measured_activity_in
    object: assay
    notes: 'Tagged wild type: reported conversion 100.0 +/- 7.3% relative to tagged
      wild type; specific activity 13.9 +/- 1.0 nmol/min/mg in Figure 4C. The paper
      calls the errors standard errors for three independent experiments. Thesis Table
      5.6 calls the errors standard deviations; the same means are not pooled or treated
      as independent replication. Normalization to 100% does not establish absolute
      substrate depletion. These are HPLC-derived specific activities, not kcat/Km
      or independently reconstructed initial rates.'
    evidence:
    - reference: DOI:10.1016/j.chembiol.2016.07.018
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 4C, p.1095; numerical table and uncertainty caption visually checked.
      snippet: three independent experiments
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 5.6 p.190 and variant assay methods p.99; uncertainty conflict
        retained rather than silently reconciled.
