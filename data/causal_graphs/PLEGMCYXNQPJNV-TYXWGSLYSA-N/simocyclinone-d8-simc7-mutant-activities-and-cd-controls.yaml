  edges:
  - subject: template
    predicate: is_reported_to_express
    object: wt
    notes: The pET15b-NB-C7 construct supplies the tagged wild-type comparator and
      the template for PCR-based Q5 mutagenesis. The paper reports N-terminally His-tagged
      E. coli expression, Ni-affinity purification and sequence verification. Thesis
      pp.87-88 distinguishes a later low-salt protocol for crystal and mutant proteins
      (18 C induction with 0.5 mM IPTG for 16 h) from earlier production. The historical
      template promoter/primer discrepancies remain documented in the existing SimC7
      graphs; no uninspected complete plasmid junction is asserted here.
    evidence:
    - reference: DOI:10.1016/j.chembiol.2016.07.018
      evidence_type: PRIMARY_EXPERIMENT
      notes: Main experimental procedures p.1096.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 2.5.9 p.85 and protein expression/purification pp.87-88.
  - subject: wt
    predicate: has_native_parent_sequence
    object: native
    notes: The intended 304-aa recombinant protein comprises the 20-aa N-terminal
      extension MGSSHHHHHHSSGLVPRGSH plus native 284-aa SimC7. There is no claim of
      tag removal. The native accession identifies the parent, not an exact tagged
      or mutant experimental molecule. Residue labels S95/I108/H112 use native numbering;
      their positions would be 115/128/132 when the extension is counted.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Native SimC7, AEU17892.1, AF324838.2:9344..10198(+), taxon 1890; CDS-aware
        native translation agrees exactly with G9VYV4 and pinned MIBiG.
    - reference: https://www.uniprot.org/uniprotkb/G9VYV4
      evidence_type: DATABASE_ASSERTION
      notes: G9VYV4, unreviewed entry version 41, sequence version 1; inspected 2026-10-04.
        This is native parent-sequence identity.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: N-terminal extension and tagged-protein mass, p.87.
  - subject: s95a
    predicate: is_site_directed_variant_of
    object: wt
    notes: S95A denotes the engineered tagged protein, using native residue numbering.
      The printed replacement codon is TCG to GCC. Q5 amplification used pET15b-NB-C7,
      DpnI template digestion, kinase/ligase treatment and E. coli DH5alpha transformation;
      sequencing was reported. The independent primer audit reconstructs the intended
      local substitution, not the full experimental plasmid or protein sample. No
      exact UniProt accession is assigned to this variant.
    evidence:
    - reference: DOI:10.1016/j.chembiol.2016.07.018
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Main experimental procedures: site-directed mutants and sequencing.'
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 2.5 p.63 and Q5 mutagenesis method p.85.
      snippet: Mutations were verified by sequencing.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: 'Literal primer reconstruction against AF324838.2: S95Anew-F at 9618..9644(+)
        with S95AT-R at 9600..9617(-); the primer flanks match and the opposing primers
        are back-to-back. Translation predicts exactly the named amino-acid substitution
        without another coding change.'
