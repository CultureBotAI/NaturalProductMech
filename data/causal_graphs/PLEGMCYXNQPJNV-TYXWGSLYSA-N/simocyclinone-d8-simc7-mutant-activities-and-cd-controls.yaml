graph:
  graph_id: simocyclinone-d8-simc7-mutant-activities-and-cd-controls
  scope: BIOSYNTHESIS
  description: 'Six engineered SimC7 variants constrain the proposed ketoreduction
    mechanism through HPLC activity measurements and a displayed subset of far-UV
    CD controls. Native G9VYV4 is distinct from every tagged assay protein. The paper/thesis
    uncertainty disagreement, residual activity and limited structural control remain
    explicit (review #539). The 2016 main paper was inspected in the public author-thesis
    appendix, not as an independently fetched final PDF; the journal supplement was
    not obtained. This graph does not turn mutant phenotypes into direct observation
    of proton transfer or a phenolate intermediate.'
