  - subject: assay
    predicate: uses_substrate
    object: oxo
    notes: Thesis mutant methods specify 0.2 mM source-assigned 7-oxo-SD8, 500 nM
      enzyme (reported as 16.12 ug/mL) and 50 mM HEPES pH 7.2. This mutant paragraph
      is distinct from the conflicting 24.18 ug/mL in the generic assay paragraph.
      Reaction duration and temperature were not independently established for this
      mutant table in the inspected methods; the earlier one-hour assay and CD temperature
      are not substituted. The final physiological substrate and pathway order remain
      unresolved, as in the prior SimC7 component.
    evidence:
    - reference: DOI:10.1016/j.chembiol.2016.07.018
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 4C and experimental procedures; detailed methods referred to supplement.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 2.8.5 p.99, variant-specific paragraph.
  - subject: assay
    predicate: quantifies_product
    object: sd8
    notes: The variant method quantifies the SD8 HPLC peak against purified standards
      spanning 7.5-9000 pmol, using a 70-95% methanol gradient over 10 min. Three
      independent experiments and two technical replicates are reported. Methanol
      quenching, heating for ten minutes at 100 C and centrifugation precede analysis;
      the heating step is not the enzyme reaction temperature. Chemical assignments
      and the owner's incomplete stereochemistry are not upgraded by this relative-conversion
      assay.
    evidence:
    - reference: DOI:10.1016/j.chembiol.2016.07.018
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 4C and main experimental procedures.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Variant-specific HPLC methods p.99 and Table 5.6 p.190.
  - subject: nadh
    predicate: is_reduced_cofactor_in
    object: assay
    notes: The mutant methods specify 0.3 mM NADH. They do not report an NADPH mutant
      comparison or measure cofactor-binding affinity; the prior wild-type NADH/NADPH
      activity experiments are a separate claim.
    evidence:
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Variant assay methods 2.8.5 p.99.
  - subject: cd
    predicate: provides_limited_structural_control_for
    object: assay
    notes: The displayed CD experiment compares tagged wild type with I108D, H112A,
      H112N and H112Q. The main paper and thesis methods more broadly report CD integrity
      checks, but the inspected thesis panel does not display S95A or I108A. Similar
      far-UV spectra constrain gross secondary-structure changes; they do not exclude
      local active-site rearrangements or prove the proposed proton-transfer mechanism.
      This comparison is an experimental control, not a biochemical interaction between
      CD and ketoreduction.
    evidence:
    - reference: DOI:10.1016/j.chembiol.2016.07.018
      evidence_type: PRIMARY_EXPERIMENT
      notes: Main experimental procedures p.1096, structural-integrity statement.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods p.88 and Figure 5.12 pp.190-191; exact displayed subset.
  - subject: wt
    predicate: has_reference_spectrum_in
    object: cd
    notes: The tagged wild-type spectrum is the comparator. Thesis methods use 0.2
      mg/mL protein in 20 mM potassium phosphate pH 7.2 and 5% glycerol, measured
      at 20 C with a 0.5-mm cuvette. Four scans over 190-260 nm are averaged (2-nm
      bandwidth, 0.5-nm step). These are CD conditions, not the kinetic assay. The
      plot does not establish identical tertiary structure, local binding geometry
      or statistical equivalence.
    evidence:
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 2.8.3 p.98 and Figure 5.12 p.191; panel and legend visually checked.
