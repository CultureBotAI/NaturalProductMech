  edges:
  - subject: gene
    predicate: encodes_deposited_native_protein
    object: simb3
    notes: The 1449-nt CDS including stop at AF324838.2:71408..72856(+) encodes AAK06810.1.
      CDS-aware table-11 translation and deposited translation exactly match the 482-aa
      UniProt Q9AMH2 sequence. This is the source-linked native sequence, not a sequence
      of the disrupted allele or a purified experimental protein.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: DATABASE_ASSERTION
      notes: Native simB3 sequence, strain Tue6040, cosmid 5J10, taxon 1890.
    - reference: https://www.uniprot.org/uniprotkb/Q9AMH2
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed Q9AMH2, gene simB3, taxon 1890; entry version 27, sequence
        version 1, annotation updated 2025-02-05; inspected 2026-10-04. Automatic
        function is not a catalytic assay.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Independent CDS-aware translation and exact protein comparison.
  - subject: sim20
    predicate: differs_in_deposited_sequence_from
    object: simb3
    notes: AF322256.1:26613..28061(+) encodes 482-aa AAL15606.1 / Q93F99 (gene sim20).
      Exact CDS-aware translation agrees with Q93F99, but comparison to Q9AMH2 gives
      Leu134 versus Pro134. CDS positions 401/402 change CTG to CCT; position 243
      changes CGG to CGC synonymously at Arg81. Both deposits name Tu6040 and taxon
      1890. The discrepancy is not resolved as natural polymorphism, sequencing error
      or a measured functional difference, and the two proteins are not merged as
      identical examples.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: DATABASE_ASSERTION
      notes: Independent native sim20 deposit; not a mutant assay.
    - reference: https://www.uniprot.org/uniprotkb/Q93F99
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed Q93F99, entry version 27, sequence version 1; annotation updated
        2025-02-05; inspected 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Pairwise protein and CDS comparison against AF322256.1.
  - subject: construct
    predicate: contains_reported_internal_fragment_of
    object: gene
    notes: Methods report a 0.8-kb internal simB3 PCR fragment (Figure 2 fragment
      A) ligated into the singular XbaI site of erythromycin resistance vector pSP1.
      The exact insert and whole plasmid were not independently sequenced here. The
      gene-discovery primers as printed are PCR-D1a CAGGCSACSWSSAACTACAC and PCR-D1b
      SWRGAASCGSCCSCCCTCCT (R=A/G, W=A/T, S=C/G). The former has no exact IUPAC-compatible
      match on either strand of AF324838.2; the latter maps uniquely to 72666..72685(-).
      No primer is silently repaired and no exact amplicon length or failed experimental
      amplification is inferred.
    evidence:
    - reference: DOI:10.1128/AAC.46.5.1174-1182.2002
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Methods: PCR and chromosomal-mutant construction; Figure 2.'
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Literal-primer search of the complete deposited sequence, both strands.
        A computational mismatch does not disprove the source-reported construct.
  - subject: mutant
    predicate: has_reported_chromosomal_integration_of
    object: construct
    notes: Unmethylated plasmid was prepared in E. coli ET12567 and introduced into
      native-producer protoplasts; erythromycin selection and PCR supported integration.
      Sim-C2 is an insertional disruption, not a clean whole-gene deletion. The inspected
      article does not report SimB3 complementation, a complete sequenced mutant allele
      or exclusion of polar effects.
    evidence:
    - reference: DOI:10.1128/AAC.46.5.1174-1182.2002
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and insertional-inactivation results.
      snippet: PCR analysis confirmed the integration
  - subject: wildtype
    predicate: is_reported_production_comparator_for
    object: mutant
    notes: Figure 3 compares culture extracts from wild type and Sim-C2. The methods
      describe 2% mannitol / 2% soybean meal, pH 7.5, 28 C, with 20 mL liquid culture
      in a single-baffled 100-mL Erlenmeyer flask; mutant maintenance uses 50 ug/mL
      erythromycin. Production, extraction and HPLC details are referred to earlier
      publications. The shown comparison is not a matched empty-vector strain or a
      purified substrate-turnover experiment.
    evidence:
    - reference: DOI:10.1128/AAC.46.5.1174-1182.2002
      evidence_type: PRIMARY_EXPERIMENT
      notes: Strains/growth and analytical methods; Figure 3.
  - subject: wildtype
    predicate: has_assay_phenotype
    object: detected
    notes: The wild-type culture extract has a source-assigned D8 peak, retention
      time 10.8 min, with the displayed UV/visible spectrum. This is a qualitative
      HPLC-UV/Vis comparison, not a reported absolute titer, mass-spectrometric identification
      or independent resolution of the owner's six unspecified stereocentres.
    evidence:
    - reference: DOI:10.1128/AAC.46.5.1174-1182.2002
      evidence_type: PRIMARY_EXPERIMENT
      notes: Insertional-inactivation results and Figure 3/caption.
  - subject: mutant
    predicate: has_assay_phenotype
    object: undetected
    notes: D8 was not detected in the Sim-C2 culture extract under the reported HPLC-UV/Vis
      conditions. No numerical detection limit, replicate count, uncertainty, fold
      change or absolute zero is assigned from this figure. Loss of the product signal
      does not isolate a single enzyme reaction or distinguish the disrupted gene's
      effect from possible effects on neighboring expression.
    evidence:
    - reference: DOI:10.1128/AAC.46.5.1174-1182.2002
      evidence_type: PRIMARY_EXPERIMENT
      notes: Insertional-inactivation results and Figure 3/caption.
  - subject: mutant
    predicate: has_assay_phenotype
    object: a1
    notes: The source assigns the accumulated 5.8-min HPLC-UV/Vis peak to simocyclinone
      A1. This graph preserves that historical assignment as a phenotype; it does
      not mint an exact chemical accession, infer all A1 stereochemistry, or call
      the extract a pure compound. Figure 3 does not provide an absolute A1 titer.
    evidence:
    - reference: DOI:10.1128/AAC.46.5.1174-1182.2002
      evidence_type: PRIMARY_EXPERIMENT
      notes: Insertional-inactivation results and Figure 3/caption.
      snippet: accumulation of simocyclinone A1
  - subject: simb3
    predicate: is_proposed_to_participate_in
    object: olivose
    notes: The source proposes a dNDP-4-keto-6-deoxyglucose 2,3-dehydratase role from
      sequence similarity and the deoxysugar-pathway model. Table 1 compares SpnO
      (AAG23276, 54% identity), which is a homolog, not the native SimB3 accession.
      Genetic production effects do not establish purified catalysis, substrate specificity
      or kinetics.
    evidence:
    - reference: DOI:10.1128/AAC.46.5.1174-1182.2002
      evidence_type: CURATOR_INFERENCE
      notes: dTDP-D-olivose discussion, Table 1 and hypothetical Figure 1; explicit
        source hypothesis, not a direct enzyme assay.
  - subject: a1
    predicate: is_consistent_with_source_proposal_of
    object: olivose
    notes: The authors interpret A1 accumulation together with loss of the D8 signal
      as disruption of deoxysugar assembly while angucycline production persists.
      This is an inference from metabolite profiles, not a direct measurement proving
      absence of every dTDP-D-olivose molecule or a SimB3-specific catalytic block
      independent of insertion effects.
    evidence:
    - reference: DOI:10.1128/AAC.46.5.1174-1182.2002
      evidence_type: CURATOR_INFERENCE
      notes: Bounded interpretation of insertional-inactivation results.
