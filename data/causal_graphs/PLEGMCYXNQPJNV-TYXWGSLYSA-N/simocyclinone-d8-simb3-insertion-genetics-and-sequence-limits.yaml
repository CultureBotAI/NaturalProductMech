graph:
  graph_id: simocyclinone-d8-simb3-insertion-genetics-and-sequence-limits
  scope: BIOSYNTHESIS
  description: 'Native-producer SimB3 insertion genetics reported by Trefzer et al.
    support involvement in simocyclinone biosynthesis, but not a purified 2,3-dehydratase
    reaction or exclusion of polar effects. The two deposited 482-aa proteins differ
    at residue 134 and remain distinct; neither accession denotes the engineered Sim-C2
    allele. Reported internal-fragment size, the uncorrected degenerate-primer discrepancy,
    HPLC detection limits and source-assigned A1 identity are retained (review #541).
    This is separate from the paper''s multigene Sim-PKSII insertion and does not
    adopt its tetraene-pathway hypotheses.'
