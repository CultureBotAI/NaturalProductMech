  edges:
  - subject: gene
    predicate: encodes_native_protein
    object: simc1b
    notes: The 6597-nt CDS including stop at AF324838.2:15910..22506(+) encodes AEU17897.1.
      Its CDS-aware table-11 translation and deposited translation exactly match the
      2198-aa G9VYV9 sequence. The native producer is S. antibioticus Tu6040 (Tue6040
      in the deposit), taxon 1890. This grounding does not identify the sequence or
      expression state of any engineered protein.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: DATABASE_ASSERTION
      notes: Native sequence and simC1B annotation.
    - reference: https://www.uniprot.org/uniprotkb/G9VYV9
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed G9VYV9, gene simC1B, taxon 1890; entry version 62, sequence
        version 1, annotation updated 2026-09-02; inspected 2026-10-04. An automatic
        enzyme name is not a catalytic assay.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Independent CDS-aware translation and exact native protein comparison.
  - subject: construct
    predicate: was_designed_to_replace_KS_encoding_region_of
    object: gene
    notes: Methods p.33 describe two 2.5-kb homology arms fused by overlap PCR in
      pJET1.2, an hph cassette flanked by loxP, and transfer to pKG1139. They call
      the central site SspI and external sites StuI. The literal primer table on p.41
      instead labels and contains central EcoRV (GATATC) and external SspI (AATATT),
      with no StuI (AGGCCT) site in these four primers. The table is headed S5 but
      listed as S6 in the contents. Neither the source text nor primers are silently
      corrected. No complete plasmid or inserted hph/loxP sequence was independently
      audited.
    evidence:
    - reference: DOI:10.1021/acschembio.5b00669.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Chapter S2 pp.32-33, Figure S8a and literal primer table p.41. The two
        source descriptions conflict.
  - subject: mutant
    predicate: was_generated_using
    object: construct
    notes: The supplement reports screening for loss of vector resistance after double
      crossover and confirmation of intragenic deletions by PCR. Figure S8a specifically
      maps the Tu6040 deltaKS replacement. The hph/loxP cassette remains shown; no
      Cre-excised scar-only allele or complete experimental mutant sequence is asserted.
      The inspected supplement does not show SimC1B complementation or exclude all
      secondary genomic effects. The nearby smcKSII complementation experiments are
      in a different producer and are not SimC1B rescue tests.
    evidence:
    - reference: DOI:10.1021/acschembio.5b00669.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Chapter S2 p.33 and Figure S8a; genotype evidence, not a protein-expression
        measurement.
      snippet: Deletions within the genes were confirmed by PCR.
  - subject: mutant
    predicate: has_reported_KS_region_replacement_in
    object: gene
    notes: Figure S8a replaces the KS-encoding segment with hph/loxP while retaining
      the region labelled AT, DH, ER and KR; this is not deletion of the full simC1B
      gene. Literal primers are KS_R_fus-f TTCGGCAGTATCTGAAGAAGGATATCGCGCAGCCCGACGCACCGGG;
      KS_F_fus-r CCCGGTGCGTCGGGCTGCGCGATATCCTTCTTCAGATACTGCCGAA; KS_R-SspI-r ACTAATATTCCGCCCCATGGGTCAGGACGA;
      and KS_F-SspI-f ACTAATATTGGTCTGGCCGGGACGACGCTC. Separating their artificial
      sites gives native arms 13410..15909 and 17410..19909 of AF324838.2, each 2500
      nt, surrounding 15910..17409 (the first 1500 CDS nt / 500 aa). This is a primer-derived
      model, not a sequenced allele or a measured domain boundary. The reverse inner
      primer has an incidental 21-nt native suffix crossing its artificial-site boundary;
      that match does not change the 20-nt designed arm. No exact mutant protein,
      folding state or residual catalytic activity is inferred from the replacement
      diagram.
    evidence:
    - reference: DOI:10.1021/acschembio.5b00669.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure S8a and primer table p.41 support the reported intervention.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Native-arm and removed-region reconstruction from the four literal primers.
        Site/prose conflict remains unresolved.
  - subject: wildtype
    predicate: is_hybridization_comparator_for
    object: mutant
    notes: Figure S8aB compares wild-type and deltaKS chromosomal DNA with an hph
      probe, alongside a DNA ladder and the pKGKSdelta cassette control. No corresponding
      hph band is visible in the wild-type lane. This comparator concerns hybridization,
      not matched fermentation yield or protein abundance; it does not establish absence
      of every unintended mutation.
    evidence:
    - reference: DOI:10.1021/acschembio.5b00669.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Visually inspected Figure S8aB and its caption, p.37.
  - subject: mutant
    predicate: has_genotyping_readout
    object: southern
    notes: The source marks the mutant hph-hybridizing band near a predicted 5.9-kb
      fragment position. The value is reported from the figure/caption, not independently
      reconstructed from a specified restriction digest or fully sequenced junctions.
      Band appearance is not an absolute copy-number measurement or proof of whole-genome
