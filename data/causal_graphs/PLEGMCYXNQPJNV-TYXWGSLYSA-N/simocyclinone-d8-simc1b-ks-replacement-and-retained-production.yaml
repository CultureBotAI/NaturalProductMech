  graph_id: simocyclinone-d8-simc1b-ks-replacement-and-retained-production
  scope: BIOSYNTHESIS
  description: 'Native S. antibioticus Tu6040 SimC1B KS-region replacement and retained
    source-assigned D8 production, from the Bilyk et al. primary supporting information.
    G9VYV9 denotes the native protein, not the engineered allele. The primer-site/prose
    conflict and qualitative genotype and metabolite readouts are explicit (review
    #542). This is not a clean whole-gene deletion, purified catalysis or proof that
    every SimC1B domain is dispensable under all conditions. The historical type-I-PKS
    tetraene-assembly assignment is not adopted as an established function. The full
    main article was not obtained.'
