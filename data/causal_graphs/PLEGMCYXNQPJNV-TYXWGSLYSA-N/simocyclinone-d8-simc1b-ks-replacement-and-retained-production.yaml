  - subject: mutant
    predicate: retains_source_assigned_product_signal
    object: sd8
    notes: Figure S8b shows the mutant crude-extract HPLC-ESI/MS chromatogram, with
      SD8 labelled m/z 930.65 [M-H]-. The displayed trace has an mAU intensity axis;
      the source ion assignment is retained without silently converting the number
      to an accurate-mass measurement. D8 detection after this intervention argues
      against a strict requirement for the targeted intact KS region under the assayed
      conditions. It does not establish unchanged wild-type yield, absence of all
      SimC1B functions, or the alternative enzymatic route. No absolute titer, replicate
      count, uncertainty or exact retention time is supplied. Main-article fermentation
      conditions were not obtained; Kitasatospora culture conditions and the supplement's
      printed mg/mL conjugation selection values are not turned into a validated Tu6040
      production protocol. The owner's six unspecified stereocentres remain unresolved.
    evidence:
    - reference: DOI:10.1021/acschembio.5b00669.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Visually inspected Figure S8b, p.38, and contents p.3 identifying this
        as the S. antibioticus deltaKS experiment.
      snippet: Arrows indicate ions corresponding to simocyclinones.
    - reference: DOI:10.1021/acschembio.5b00669.s001
      evidence_type: CURATOR_INFERENCE
      notes: Bounded inference from retained source-assigned D8 after the reported
        domain-region intervention; not a purified enzyme test or proof of global
        dispensability.
  - subject: mutant
    predicate: has_source_assigned_product_signal
    object: sd6
    notes: The same Figure S8b labels a second signal as SD6, m/z 890.37 [M+H]+. Its
      positive-ion annotation is kept distinct from the negative-ion SD8 annotation.
      This is a source assignment in a crude extract, not a new exact chemical record,
      independently confirmed stereochemistry, absolute yield or measured SD6-to-SD8
      conversion. Relative peak heights do not establish molar product ratios.
    evidence:
    - reference: DOI:10.1021/acschembio.5b00669.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Visually inspected Figure S8b label and caption, p.38.
