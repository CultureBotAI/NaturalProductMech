    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF321122.1
      evidence_type: DATABASE_ASSERTION
      notes: Paper-named AAG34186.1 native CDS.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
