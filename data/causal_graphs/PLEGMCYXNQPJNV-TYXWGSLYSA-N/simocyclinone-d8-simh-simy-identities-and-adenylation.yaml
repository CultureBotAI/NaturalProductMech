  edges:
  - subject: his_simh
    predicate: was_prepared_from_native_sequence_named_as
    object: simh
    notes: The paper explicitly identifies AAL15600 (997 aa). AAL15600.1 from AF322256.1:19223..22216(+)
      and AAG34184.1 from AF321122.1:2435..5428(+) both translate exactly to Q9F5J4
      using CDS-aware table 11. The producer is S. antibioticus Tu6040, taxon 1890.
      pBB25 expresses an N-terminal His6 fusion in E. coli BL21(DE3) with a ybdZ deletion
      and pSU20_sfp (B. subtilis Sfp). Sfp is preparation context, not a measured
      PCP-loading fraction. The N-terminal tag was retained. No native accession is
      assigned to the full recombinant protein, whose vector junctions were not independently
      sequenced. Literal primers GGGAATTCCATATGGCCATGCCATCCGGCA and GCCCTCGAGTCACTTCACGGCCGTTGTGG
      predict a 3014-nt amplicon containing the 2994-nt CDS with its stop; this is
      a reconstruction, not a measured complete plasmid. The source reports checking
      entire gene sequences. Induction was 0.4 mM IPTG for 14 h at 20 C after OD600
      0.6. Ni-affinity and gel filtration gave 9.4 mg SimH per liter culture from
      the deletion host; this is not assay loading or a reported ybdZ+ yield. The
      source assigns no established biosynthetic function to the additional N-terminal
      condensation-like region.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and results, thesis PDF pp.91-96. Inspected in the author-reproduced
        manuscript, marked publication ahead of print; final journal full text not
        independently retrieved.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49604/pdf/Boll_2011_online.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and results, thesis PDF pp.91-96. Public primary thesis, Chapter
        7; PDF page numbers are five greater than the printed page numbers.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: DATABASE_ASSERTION
      notes: Native AAL15600.1 CDS and deposited translation.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF321122.1
      evidence_type: DATABASE_ASSERTION
      notes: Independent AAG34184.1 deposit with identical 997-aa translation.
    - reference: https://www.uniprot.org/uniprotkb/Q9F5J4
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed SimH Q9F5J4, taxon 1890; entry 118, sequence version 1, annotation
        2026-09-02; inspected 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: CURATOR_INFERENCE
      notes: Exact CDS/UniProt comparison and literal-primer amplicon model; complete
