  - subject: mixture
    predicate: supports_measured_adenylation_assay
    object: exchange
    notes: Adding SimY made the SimH adenylation signal readily detectable. Reactions
      ran for 5 min at 30 C, initiated by enzyme addition; charcoal isolation and
      scintillation measured radiolabel exchange. The assay supports the adenylation
      step, not direct covalent tyrosyl-PCP loading or synthesis of a complete aminocoumarin
      or D8 molecule.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: PRIMARY_EXPERIMENT
      notes: Exchange methods and Figure 3 results, thesis PDF pp.94-97. Inspected
        in the author-reproduced manuscript, marked publication ahead of print; final
        journal full text not independently retrieved.
      snippet: adenylating activity was readily detectable
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49604/pdf/Boll_2011_online.pdf?isAllowed=y&sequence=1
