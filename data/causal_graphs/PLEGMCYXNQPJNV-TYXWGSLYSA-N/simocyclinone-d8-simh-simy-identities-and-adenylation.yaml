  - subject: prepared_simy
    predicate: stimulates_in_vitro_adenylation_by
    object: his_simh
    notes: The paired absence/presence comparison supports stimulation by prepared
      SimY. This functional comparison alone does not prove a physical interface,
      absolute in-vivo requirement or unique specificity for SimY. The separate cross-activation
      experiment reports other MbtH-like proteins can stimulate SimH; those heterologous
      helpers are not asserted here as native D8 biosynthetic partners.
