graph:
  graph_id: simocyclinone-d8-simh-simy-identities-and-adenylation
  scope: BIOSYNTHESIS
  description: 'SimH/SimY tyrosine-adenylation evidence for the simocyclinone D8 aminocoumarin
    branch, from Boll et al. 2011. Native Q9F5J4 and Q9F5J2, alternate Q9AMH5, recombinant
    preparations and assay readouts remain distinct (review #543). The source length
    and tag-state limits are preserved. ATP-PPi exchange is not direct PCP loading,
    complete D8 production or proof of physiological flux. The inspected primary text
    is the author-reproduced manuscript and supplement in the public thesis, not independently
    retrieved final journal full text.'
