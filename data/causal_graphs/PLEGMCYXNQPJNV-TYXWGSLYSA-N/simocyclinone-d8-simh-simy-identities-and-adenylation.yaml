  - subject: mixture
    predicate: has_reported_kinetic_readout
    object: kinetics
    notes: At SimH:SimY 1:1.2, varying L-tyrosine and nonlinear regression in Prism
      5 gave Km 164 uM in Table 1 (rounded), kcat 1.01 s^-1 and kcat/Km 6180 M^-1
      s^-1. Figure S3 prints Km 163.5 +/- 2.6 uM; the inspected text/caption does
      not define that uncertainty as SD or SE. These are reported parameters for the
      prepared mixture under the exchange-assay conditions, not intrinsic constants
      of free native SimH or a D8 pathway flux. No kcat uncertainty is invented. Very
      low unassisted activity prevented a SimH-alone kinetic investigation.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
