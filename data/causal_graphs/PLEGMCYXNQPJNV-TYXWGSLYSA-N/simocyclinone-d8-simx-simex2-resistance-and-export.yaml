  - subject: simex2_tested
    predicate: has_predicted_native_protein_sequence
    object: simex2
    notes: Literal primer reconstruction changes native GTG to ATG but preserves the
      1242-bp coding span including its stop, predicting the same 413-aa CDS-aware
      translated protein. The 1298-bp tailed amplicon includes sequence beyond the
      stop; its maximal matching native suffix is 12946..14227, not evidence for a
      one-base gene truncation. This is a primer-derived intended product, not an
      independently sequenced whole plasmid or an experimentally verified mature protein.
      The native Na/H-antiporter annotation is a prediction, not a measured ion-transport
      mechanism.
