  graph_id: simocyclinone-d8-simx-simex2-resistance-and-export
  scope: BIOSYNTHESIS
  description: 'Producer-cluster SimX/SimEx2 resistance genetics and the proposed
    SD8 export role. The two deposited SimX variants remain distinct, and the tested
    residue-126 allele is unresolved. Native simX::apr genetics, heterologous expression,
    MIC and disk readouts are separate; no direct transport flux or SimEx2 functional-null
    claim is inferred (review #537). Existing owner stereochemistry and mechanism
    are unchanged.'
