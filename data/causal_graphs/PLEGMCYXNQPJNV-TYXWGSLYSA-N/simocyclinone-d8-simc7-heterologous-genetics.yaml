    object: rescue2_construct
    notes: The named pGM1190 derivative provides an in-trans simC7 copy. The source
      does not establish equal expression, copy number or promoter activity between
      the rescue constructs.
    evidence:
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 2.4, methods p.85 and Figure 4.16.
  - subject: rescue1_construct
    predicate: provides_reported_intact_copy_of
    object: gene
    notes: Methods p.85, Table 2.4 and Figure 4.16 describe pGM1190-NB-C7 as ptipA::simC7.
      Results p.146 instead explain its low yield by a missing promoter. This unresolved
      source conflict is not repaired or used to assign a demonstrated promoter mechanism.
      The reverse-primer name/site discrepancy in Table 2.5 also prevents literal
      reconstruction of the final cloning junction from names alone.
    evidence:
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 2.4 p.53, Table 2.5 p.60, methods p.85, results pp.146-147.
  - subject: rescue2_construct
    predicate: provides_reported_intact_copy_of
    object: gene
    notes: The second rescue fuses simC7 to the approximately 400-bp region upstream
      of simB7 in pGM1190. Literal 20-nt promoter-primer arms map to 3812..3831(+)
      and 4189..4208(-), predicting a 397-bp native segment and 415-bp tailed PCR
      product. This reconstruction does not establish an experimental plasmid junction
      or directly map a promoter. The proposed simB7-to-simC7 seven-gene operon remains
      putative.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Complementation methods/results.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 2.5 p.60 and section 4.3 p.146.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Native promoter-fragment reconstruction.
  - subject: rescue1
    predicate: has_reported_low_production_of
    object: sd8
    notes: The thesis reports low SD8 yield from the first rescue and shows a source-assigned
      SD8 peak in Figure 4.16. The promoter explanation is disputed within the source.
      Panel-normalized intensity is not an absolute yield or a quantified fraction
      of wild-type rescue; a matched empty-rescue-vector comparison is not shown in
      this panel.
    evidence:
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 4.3 pp.146-147, Figure 4.16.
  - subject: rescue2
    predicate: restores_detectable_production_of
    object: sd8
    notes: The article reports complementation with the simB7-upstream fusion as data
      not shown. The thesis Figure 4.16 displays LC-MS-UV chromatograms at 200-700
      nm after six days at 30 C and reports HRMS confirmation without displaying those
      spectra. The normalized traces and SD8/7-oxo standards support product rescue,
      not an absolute wild-type-equivalent yield or exclusion of all polar effects.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Complementation results and methods, text-reported rescue.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 4.3 and Figure 4.16.
      snippet: restored SD8 production
