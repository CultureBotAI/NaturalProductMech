graph:
  graph_id: simocyclinone-d8-simc7-heterologous-genetics
  scope: BIOSYNTHESIS
  description: 'SimC7 deletion and complementation in the heterologous sim cluster,
    including the engineered SimX-expressing host background and chemical assignment
    of 7-oxo-SD8. Native sequence identity, intended alleles, source-reported rescue
    and conflicting construct/yield descriptions remain distinct (review #538). The
    2015 main article and relevant primary thesis sections were inspected; the journal
    supplementary file was not obtained. Neither native-producer deletion nor complete
    owner stereochemistry is established by these experiments.'
