  - subject: intact
    predicate: produces
    object: sd8
    notes: Culture extracts match source-assigned SD8 by LC-MS-UV, against an isolated
      standard. Production conditions were six days at 30 C and 250 rpm in defined
      medium with glutamine 5.84 g/L and glycerol 20 mL/L. The article reports 24-56
      mg/L versus 9-14 mg/L for native Tu6040. Thesis p.115 instead prints 24-56 mg/mL,
      while Figure 3.3 uses an mg/L axis; the conflict is preserved, not silently
      corrected. That thesis growth curve also used 1e8 spores for the cluster strain
      versus 1e7 for host-only controls. It is not an equal-inoculum growth-rate experiment.
      Figure 3.2 qualitatively shows partial alleviation of cluster-associated growth/sporulation
      impairment by SimX on SFM agar after nine days at 30 C.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results, heterologous production; Figure 2; production methods.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.3 p.115 and Figures 3.2-3.3 pp.116-117.
  - subject: host
    predicate: has_no_detected_production_of
    object: sd8
    notes: The M1152ex1 control without the sim cluster produced no detected simocyclinones
      under the reported production conditions. This is a negative assay control,
      not proof of absence under every culture condition or a numerical zero yield.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results, heterologous production; production methods.
  - subject: mutant
    predicate: produces
    object: oxo
    notes: 'The principal mutant product is assigned as 7-oxo-SD8, not failure of
      all simocyclinone synthesis. Figure 2 compares mutant, intact-cluster and SD8-standard
      extracts after six days; their displayed retention times are 20.65, 19.53 and
      19.48 min. Approximately 63 mg was purified from 4 L with reported >98% purity
      and 27% recovery. Retention time alone is not the structural proof: HRMS, fragmentation
      and NMR supply the assignment.'
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results and Figures 2-5; purification methods.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 4.2 pp.122-124, same experimental work rather than independent
        replication.
      snippet: had a mass 2 Da lighter
  - subject: oxo
    predicate: has_source_assigned_structural_difference_from
    object: sd8
    notes: The reported difference is a C-7 carbonyl instead of the C-7 hydroxyl on
      the angucyclinone, with the tetraene linker retained. Two-Da lower parent mass,
      polyketide-localized MS/MS differences, missing H-7, shifted H-6, and carbonyl/HMBC
      NMR evidence support this assignment. These source-assigned assay compounds
      are distinct from MGD8N2A and other congeners. No uninspected complete chemical
      identifier is invented; the owner retains six unspecified stereocentres and
      its open shared-MIBiG discussion remain unresolved.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Main Figures 1-5 and structural-analysis results. Supplementary NMR tables
        were cited by the paper but not independently obtained in this review.
  - subject: rescue1
    predicate: is_complemented_derivative_of
    object: mutant
    notes: Complementation was performed in the M1152ex1/PAC-12I delta-simC7 background,
      not in native Tu6040. The genotype is not silently replaced by the intact-PAC
