  edges:
  - subject: gene
    predicate: encodes
    object: simc7
    notes: This node denotes the deposited native protein. The scar mutant, tagged
      enzyme and complementation plasmids are separate entities; none is assigned
      the native accession as an exact engineered-sequence identifier.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/protein/AEU17892.1
      evidence_type: DATABASE_ASSERTION
      notes: 'Native S. antibioticus Tu6040 simC7: AEU17892.1, AF324838.2:9344..10198(+),
        855 nt including stop, 284 aa. The historical hydroxylase/dehydratase product
        label is an annotation, not the experimentally revised reaction.'
    - reference: https://www.uniprot.org/uniprotkb/G9VYV4
      evidence_type: DATABASE_ASSERTION
      notes: Active unreviewed G9VYV4, taxon 1890, entry version 41, sequence version
        1; inspected 2026-10-04. Native sequence grounding, not assignment of a canonical
        accession to an engineered tagged protein.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: CDS-aware table-11 translation, GenPept, UniProt and pinned BGC0001072.5
        agree exactly for the 284-aa native protein. This does not independently sequence
        the experimental PAC, expression plasmid or deletion junction.
  - subject: pac
    predicate: contains
    object: gene
    notes: The paper reports PAC-12I with a roughly 95-kb insert containing the approximately
      72-kb, 49-gene cluster and about 19-kb/4-kb flanks. Thesis Table 2.4 instead
      describes an 85-kb BamHI genomic fragment; the whole insert and restriction
      fragment are not assumed identical measurements. PAC sequencing was reported,
      but a complete public experimental insert was not independently compared base-for-base
      here.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Main article, introduction and PAC-clone methods.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 2.4 pp.51-52 and section 3.2; no significant sequence differences
        is not a claim of literal identity at every nucleotide.
  - subject: pac_delta
    predicate: is_derived_from
    object: pac
    notes: PCR targeting in E. coli used lambda RED and an apramycin cassette amplified
      from pIJ773_del_oriT; FLP excision removed the marker and reportedly left an
      81-bp in-frame scar. PCR and EcoRI digestion verified the construct. This is
      not a scarless deletion, the earlier native simX::apr allele, or a sequenced
      final junction.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Main article, simC7 deletion methods.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 2.5.8 pp.82-84 and Table 2.5 p.60.
  - subject: pac_delta
    predicate: disrupts
    object: gene
    notes: Literal 39-nt deletion arms map to AF324838.2:9308..9346(+) and 10196..10234(-),
      retaining native ATG/TAG and replacing the intervening 849 bp. An 81-bp scar
      would give an 87-bp start-to-stop allele. Check primers span 9192..10350, predicting
      1159 bp natively versus 391 bp for that scar model. These are curator reconstructions,
      not measured mutant sequence or observed gel sizes; possible local regulatory
      effects are not excluded by calling the scar in-frame.
    evidence:
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: Literal Table 2.5 primers and reported targeting protocol.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Native-locus reconstruction against AF324838.2.
  - subject: host
    predicate: carries
    object: simx_construct
    notes: M1152ex1 was created by introducing the integrative pIJ10480 construct
      into S. coelicolor M1152. All subsequent SimC7 cluster experiments use this
      engineered background; the native producer S. antibioticus Tu6040 was not deleted
      in this study.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results, optimization of the heterologous host; methods.
  - subject: simx_construct
    predicate: is_reported_to_express
    object: simx
    notes: 'The construct drives simEx1/SimX from ermEp*. This experiment does not
      resolve the native Ala/Gly126 SimX ambiguity documented in the existing resistance
      graph (review #537), nor does enhanced resistance directly measure transport
      flux.'
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Heterologous-host optimization, pIJ10480.
  - subject: host
    predicate: has_reported_resistance_relative_to
    object: m1152
    notes: Reported SD8 MIC changes from 1 to 100 ug/mL after introduction of pIJ10480.
      This is the M1152 comparison, not the earlier S. lividans 2-to-65 ug/mL result.
      The thesis specifies 200-uL 96-well SMMS assays, 1e5 spores per well, 30 C for
      six days and a growth-inhibition endpoint; no flux, energy coupling or quantitative
      MIC uncertainty is measured here.
    evidence:
    - reference: DOI:10.1016/j.jmb.2015.03.019
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results, heterologous-host optimization.
    - reference: https://ueaeprints.uea.ac.uk/id/eprint/61276/
      evidence_type: PRIMARY_EXPERIMENT
      notes: MIC methods 2.3.4 p.74 and section 3.3.
