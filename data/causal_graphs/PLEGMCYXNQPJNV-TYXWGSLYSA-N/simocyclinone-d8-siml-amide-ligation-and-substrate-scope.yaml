  edges:
  - subject: native
    predicate: is_source_assigned_to
    object: assembly
    notes: Luft et al. assign SimL to formation of the amide joining the aminocoumarin
      and complex acyl moieties of simocyclinone. Native protein identity is independently
      sequence-grounded; exact experimental constructs remain ungrounded.
    evidence:
    - reference: DOI:10.1007/s00203-005-0770-0
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary article abstract; full article not obtained.
    - reference: https://www.uniprot.org/uniprotkb/Q9F5J5
      evidence_type: DATABASE_ASSERTION
      notes: Q9F5J5 is an unreviewed native Streptomyces antibioticus SimL entry,
        synonym SimD5, taxon 1890, 519 aa; entry version 62, sequence version 1, annotation
        updated 2026-09-02; inspected 2026-10-04. Sequence identity does not establish
        the exact recombinant sample sequence.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: CDS-aware table-11 translation, including native TTG initiation, exactly
        matches Q9F5J5 for AAK06803.1, AF324838.2:62429..63988(+). Independent translations
        of AAL15599.1, AF322256.1:17635..19194(+), and AAG34183.1, AF321122.1:847..2406(+),
        give the same 519-aa sequence. All three 1560-nt coding sequences including
        stop agree exactly.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: DATABASE_ASSERTION
      notes: Independent native simL CDS AAL15599.1; sequence deposit, not an assay.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF321122.1
      evidence_type: DATABASE_ASSERTION
      notes: Independent native simL CDS AAG34183.1; sequence deposit, not an assay.
