graph:
  graph_id: simocyclinone-d8-siml-amide-ligation-and-substrate-scope
  scope: BIOSYNTHESIS
  description: 'SimL/SimD5 is assigned the aminocoumarin amide-ligation role in simocyclinone
    biosynthesis. Exact native Q9F5J5 is distinct from the two recombinant preparations.
    The inspected 2005 evidence is abstract-level only: natural C4 acceptance, broad
    acid-substrate activity and engineered novobiocin-analogue tailoring are separate
    claims. No uninspected kinetic conditions, exact construct sequence, complete
    native D8 reconstitution or final in-vivo step order is asserted. Review #540
    preserves these evidence and identity boundaries.'
