graph:
  graph_id: simocyclinone-d8-siml-recombinant-scar-and-surrogate-activity
  scope: BIOSYNTHESIS
  description: 'Primary Metzger thesis experiments characterize a distinct pUM06-derived
    SimL preparation. N-terminal His8-tag removal leaves a reported cloning scar;
    neither recombinant state is exact native Q9F5J5. HPLC specific activity on prenylhydroxybenzoate
    and a methylated aminocoumarin is a surrogate-substrate result, not native C4
    turnover or D8 reconstitution. Literal primers, fragment sizes, purification data
    and the SimL-specific gel were checked; review #540 limitations remain.'
