    predicate: is_a_component_of_observed_fraction
    object: complex
    notes: Analytical gel filtration of a mixture and SDS-PAGE of the isolated approximately
      208-kDa fraction support association of the recombinant proteins. This is not
      a structure-based interface determination or native-cell oligomer measurement.
      The SimH native accession is not an identifier for the whole complex.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
