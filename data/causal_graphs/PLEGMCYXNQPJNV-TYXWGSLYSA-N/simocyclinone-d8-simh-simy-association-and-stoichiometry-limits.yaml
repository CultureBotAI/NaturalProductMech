graph:
  graph_id: simocyclinone-d8-simh-simy-association-and-stoichiometry-limits
  scope: BIOSYNTHESIS
  description: 'Association of separately prepared recombinant SimH and SimY, with
    apparent gel-filtration masses and an activity titration supporting a proposed
    heterotetramer (review #543). The observed co-eluting complex is not assigned
    a subunit accession or a verified native in-vivo stoichiometry. Source-reported
    tag removal and the different Figure S2 label remain explicit. The public primary
    author manuscript and supplement were inspected; final journal full text was not
    independently retrieved.'
