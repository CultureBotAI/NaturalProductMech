  edges:
  - subject: his_simh
    predicate: was_prepared_from_native_sequence_named_as
    object: simh
    notes: The source links SimH to AAL15600, whose 997-aa native sequence matches
      Q9F5J4 and the independent AAG34184.1 deposit. The protein used in association
      experiments is a recombinant N-His6 preparation, not the accession-defined native
      sequence. General methods describe pBB25 in BL21(DE3) with or without ybdZ deletion
      and with pSU20_sfp; the analytical SEC section does not separately identify
      which host preparation supplied that experiment. It is not silently assigned
      the deletion-host provenance of Figure 3. Entire gene sequences were reported
      checked by the authors, but complete experimental vector and tag junctions were
      not independently obtained. The literal primers cannot distinguish paper-linked
      SimH from the two-residue-different shortened product of alternate simD6/AAK06804.1.
      The explicit paper accession supports the selected native grounding, not a claim
      to have sequenced the complete assayed protein.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and results, thesis PDF pp.91-96. Inspected in the author-reproduced
        manuscript, marked publication ahead of print; final journal full text not
        independently retrieved.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49604/pdf/Boll_2011_online.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and results, thesis PDF pp.91-96. Public primary thesis, Chapter
        7; PDF page numbers are five greater than the printed page numbers.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: DATABASE_ASSERTION
      notes: Native AAL15600.1 CDS and deposited translation.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF321122.1
      evidence_type: DATABASE_ASSERTION
      notes: Independent AAG34184.1 deposit with identical 997-aa translation.
    - reference: https://www.uniprot.org/uniprotkb/Q9F5J4
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed SimH Q9F5J4, taxon 1890; entry 118, sequence version 1, annotation
        2026-09-02; inspected 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: CURATOR_INFERENCE
      notes: Exact CDS/UniProt comparison and literal-primer amplicon model; complete
        experimental vector and tag junctions not inspected.
  - subject: prepared_simy
    predicate: was_prepared_from_native_sequence_named_as
    object: simy
    notes: The paper names AAG34186 but reports 69 aa. AAG34186.1 at AF321122.1:6727..6939(+),
      AAL15602.1 at AF322256.1:23515..23727(+) and AAK06806.1 at AF324838.2:68309..68521(+)
      all have 213-nt CDSs including stop and translate exactly to the 70-aa Q9F5J2
      sequence. The 69/70-aa discrepancy is unresolved; initiator removal or an error
      is not assumed. pBB28 in E. coli Rosetta2(DE3) initially produced N-His6-SimY.
      General methods and results report MbtH-tag removal with 0.4 units thrombin/mg
      protein for 8 h at 4 C before gel filtration, yet Figure S2 labels N-His6-SimY
      and a calculated 9.4-kDa mass. The gel may depict a different purification stage;
      it does not identify the functional-assay tag state. No exact cleavage scar
      or complete assay sequence is independently verified. Primers GGGAATTCCATATGGCCAACCCGTTTGACGA
      and GCCCTCGAGTCAGCTGGGGTCCGTCG predict a 233-nt amplicon retaining the native
      coding start and stop; this is not a sequenced plasmid. The reported yield is
      27 mg/liter culture, not an assay concentration. The native accession is not
      assigned to the recombinant preparation.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods/results, thesis PDF pp.92-96; Figure S2, PDF p.109. Inspected
        in the author-reproduced manuscript, marked publication ahead of print; final
        journal full text not independently retrieved.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49604/pdf/Boll_2011_online.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods/results, thesis PDF pp.92-96; Figure S2, PDF p.109. Public primary
        thesis, Chapter 7; PDF page numbers are five greater than the printed page
        numbers.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF321122.1
      evidence_type: DATABASE_ASSERTION
      notes: Paper-named AAG34186.1 native CDS.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF322256.1
      evidence_type: DATABASE_ASSERTION
      notes: Native AAL15602.1 CDS.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: DATABASE_ASSERTION
      notes: Native AAK06806.1 CDS.
    - reference: https://www.uniprot.org/uniprotkb/Q9F5J2
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed Q9F5J2, SimY/simX1, taxon 1890; entry 45, sequence version
        1, annotation 2025-02-05; inspected 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF321122.1
      evidence_type: CURATOR_INFERENCE
      notes: Three exact native translations and the primer-derived coding region
        agree at 70 aa; source length remains discrepant.
