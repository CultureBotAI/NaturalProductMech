  - subject: his_simh
    predicate: has_helper_titration_response
    object: ratio
    notes: The L-tyrosine adenylation activity increased as SimY was added and plateaued
      at approximately equimolar SimY:SimH. Figure 4 measures activity, not directly
      bound subunits. No dissociation constant, Hill coefficient or binding occupancy
      is inferred from this curve.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 4 and results, thesis PDF p.99. Inspected in the author-reproduced
        manuscript, marked publication ahead of print; final journal full text not
        independently retrieved.
      snippet: molar ratio of 1:1
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49604/pdf/Boll_2011_online.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 4 and results, thesis PDF p.99. Public primary thesis, Chapter
        7; PDF page numbers are five greater than the printed page numbers.
  - subject: prepared_simy
    predicate: was_varied_in_activity_titration
    object: ratio
    notes: Different SimY amounts were assayed with SimH. Further helper beyond the
      approximately 1:1 ratio did not increase activity in the displayed experiment.
      This does not prove a heterodimer, and it is not the distinct CloH/CloY pETDUET
      coexpression experiment.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 4 and results, thesis PDF pp.99-100. Inspected in the author-reproduced
