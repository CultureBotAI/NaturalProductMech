  - subject: his_simh
    predicate: has_analytical_gel_filtration_readout
    object: simh_sec
    notes: SimH alone eluted predominantly near an apparent mass of 650 kDa, interpreted
      by the source as aggregation. The source gives 107.3 kDa as the calculated tagged
      monomer mass; neither value is a measured native monomer mass or an exact number
      of aggregate subunits. Analytical SEC used a Superdex 200 10/300 GL, 24-mL bed,
      20 mM Tris-HCl pH 8 and 150 mM NaCl with log-mass/Kav calibration standards.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: PRIMARY_EXPERIMENT
      notes: Analytical gel-filtration methods and Figure 5A, thesis PDF pp.95,99-100.
        Inspected in the author-reproduced manuscript, marked publication ahead of
        print; final journal full text not independently retrieved.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49604/pdf/Boll_2011_online.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Analytical gel-filtration methods and Figure 5A, thesis PDF pp.95,99-100.
        Public primary thesis, Chapter 7; PDF page numbers are five greater than the
        printed page numbers.
  - subject: complex
    predicate: has_mixture_gel_filtration_readout
    object: mixture_sec
    notes: The SimH/SimY mixture has a dominant approximately 208-kDa peak by calibrated
      SEC. Figure 5A also shows residual approximately 650-kDa and <=15-kDa signals;
      not all material became one homogeneous complex. These are hydrodynamic apparent
      masses. The inspected SEC method does not specify the sample loading concentration,
      injection volume or mixture ratio; the separate 1:1.2 activity-assay ratio is
      not substituted for a missing SEC loading ratio.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and visually inspected Figure 5A, thesis PDF pp.95,99-100. Inspected
