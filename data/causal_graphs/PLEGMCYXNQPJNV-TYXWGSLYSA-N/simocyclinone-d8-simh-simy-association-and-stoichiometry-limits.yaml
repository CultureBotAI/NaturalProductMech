  - subject: mixture_sec
    predicate: is_consistent_with_source_proposed_model
    object: model
    notes: The authors compare the apparent 208-kDa complex with a calculated 229-kDa
      (SimH)2(SimY)2 assembly. The 229-kDa value is the source calculation, not independently
      verified from complete assayed tag/cleavage sequences. SEC alone does not directly
      count subunits or exclude alternative shapes or oligomers. This remains the
      source-supported model, not an experimentally solved native structure.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: CURATOR_INFERENCE
      notes: Inference from Figure 5 and discussion, thesis PDF pp.99-102.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49604/pdf/Boll_2011_online.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Author manuscript with the proposed rather than directly determined heterotetramer
        interpretation.
  - subject: ratio
    predicate: supports_relative_composition_in_proposed_model
    object: model
    notes: The activity plateau is compatible with equal relative amounts of helper
      and adenylating enzyme. Combined with SEC it motivated the 2:2 proposal; it
      does not uniquely determine that stoichiometry or establish which oligomer exists
      in the native producer.
    evidence:
    - reference: DOI:10.1074/jbc.M111.288092
      evidence_type: CURATOR_INFERENCE
      notes: Bounded interpretation of Figure 4 and the discussion, thesis PDF pp.99,102.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49604/pdf/Boll_2011_online.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Primary author manuscript; source model remains inference.
