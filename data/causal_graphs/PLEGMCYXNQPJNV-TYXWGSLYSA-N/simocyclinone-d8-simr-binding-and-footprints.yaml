  graph_id: simocyclinone-d8-simr-binding-and-footprints
  scope: BIOSYNTHESIS
  description: 'SimR DNA binding, engineered truncations and point mutants in producer-cluster
    regulation. Native Q9AMH9 is distinct from the 259-aa paper parent and tagged
    assay constructs; source residue numbering and assay boundaries are retained (review
    #536). This graph does not assert SimR catalysis or remeasure native export.'
