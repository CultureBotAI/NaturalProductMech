  edges:
  - subject: tagged
    predicate: has_native_sequence_parent
    object: simr
    notes: The paper calls its parent 259 aa. Supplement S2 exactly matches native
      Q9AMH9 residues 3..261, omitting the native MW start; deposited protein is those
      259 residues plus LEHHHHHH (267 aa). Paper positions map to UniProt with +2.
      Synthetic codon-optimized simR, pIJ10499, was expressed in E. coli and purified
      by nickel affinity. This edge does not assert native N-terminal processing,
      a corrected native annotation, or equivalence of tagged and native proteins.
    evidence:
    - reference: DOI:10.1093/nar/gkr640
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and Supplement S2; C-terminal tag construction.
    - reference: https://www.ncbi.nlm.nih.gov/protein/AAK06798.1
      evidence_type: DATABASE_ASSERTION
      notes: Native AAK06798.1, simReg2, S. antibioticus Tue6040, 261 aa; AF324838.2
        complement(57298..58083).
    - reference: https://www.uniprot.org/uniprotkb/Q9AMH9
      evidence_type: DATABASE_ASSERTION
      notes: Active unreviewed Q9AMH9, taxon 1890, entry version 132, sequence version
        1; inspected 2026-10-04. The simReg2 gene and EMBL AAK06798.1 cross-reference
        identify this native entry, not a convenient homolog.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Native GenPept, GenBank CDS-aware table-11 translation, MIBiG BGC0001072.5
        and UniProt sequences agree exactly. Supplement S2/deposited entity comparison
        establishes the two-residue offset; no claim of identity to the alternate
        AF322256.1 cluster or all engineered nucleotide sequences.
    - reference: https://www.rcsb.org/structure/3ZQL
      evidence_type: DATABASE_ASSERTION
      notes: PDB sequence mapping 1..259 to Q9AMH9 3..261; tag is outside this alignment.
        The deposited entity sequence is not a claim that every residue is modeled.
  - subject: tagged
    predicate: shifts_in_emsa
    object: probe
    notes: 'The 138-bp simR-simX-region probe contains OR and OX; this is not either
      short isolated operator or a whole gene. EMSA: 0.1 nM radiolabelled probe in
      20 uL, 20 mM Tris pH 8, 1 ug calf-thymus DNA, 100 mM NaCl, 8% glycerol, 22 C
      for 10 min, 5% native PAGE. Plotted protein series 0/0.8/1.6/3.1/12.5/25/50/200
      nM. Fold changes are the authors'' gel-based binding comparisons, not fitted
      Kd values or native transcription/production measurements. The source assigns
      lower and upper shifted complexes to occupancy of one and both sites; the gel
      alone is not a determination of a physiological tetramer.'
    evidence:
    - reference: DOI:10.1093/nar/gkr640
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and Figure 2 WT lanes; site-occupancy interpretation refers to
        earlier work.
  - subject: tagged
    predicate: protects_regions_from_dnase_i
    object: probe
    notes: Figure 8 uses 200 nM tagged WT as the full-footprint reference at both
      OR and OX. The readout is DNase I protection, not gene expression or a measured
      equilibrium constant.
    evidence:
    - reference: DOI:10.1093/nar/gkr640
      evidence_type: PRIMARY_EXPERIMENT
      notes: DNase I methods, Figure 8A/B.
  - subject: delta10
    predicate: is_engineered_derivative_of
    object: tagged
    notes: 'pIJ10500: NdeI/XhoI cloning into pET20b through sequence-verified pUC18
      intermediates; source reports deletion of 10 N-terminal paper residues, retaining
      paper 11..259 (native Q9AMH9 13..261) and a C-terminal tag. Literal upstream
      primer translation includes an added initiator M before that retained segment
      (Delta10 begins MM). This is a primer-derived reading-frame model, not an experimentally
      determined mature N-terminus or a deposited complete plasmid sequence. The downstream
      primer is consistent with the ERPALA parent tail. Supplement S1 shows purified
      bands, not proof of identical folding or absolute purity.'
    evidence:
    - reference: DOI:10.1093/nar/gkr640
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Expression methods: four literal NdeI primers, shared XhoI primer, Supplement
        S1.'
    - reference: DOI:10.1093/nar/gkr640
      evidence_type: CURATOR_INFERENCE
      notes: Literal-primer translation and Supplement S2/native sequence alignment;
        no guessed full synthetic nucleotide sequence.
  - subject: delta10
    predicate: shows_reduced_emsa_binding_to
    object: probe
    notes: 'The 138-bp simR-simX-region probe contains OR and OX; this is not either
      short isolated operator or a whole gene. EMSA: 0.1 nM radiolabelled probe in
      20 uL, 20 mM Tris pH 8, 1 ug calf-thymus DNA, 100 mM NaCl, 8% glycerol, 22 C
      for 10 min, 5% native PAGE. Plotted protein series 0/0.8/1.6/3.1/12.5/25/50/200
      nM. Fold changes are the authors'' gel-based binding comparisons, not fitted
      Kd values or native transcription/production measurements. Reported approximately
      30-fold reduction relative to tagged WT. This is not complete loss of all binding,
      nor proof that only the deleted residues directly contact DNA; truncation can
      also alter arm positioning.'
    evidence:
    - reference: DOI:10.1093/nar/gkr640
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 2 and N-terminal-truncation results.
  - subject: delta10
    predicate: produces_retracted_dnase_i_footprint_on
    object: probe
    notes: 'DNase I protection of the simR-simX-region probe, upper/lower strand separately
      labelled, 40 uL EMSA buffer, 22 C for 10 min, 10 U DNase I for 60 s; G+A ladder
      and no-protein controls. Compared with tagged WT, each truncation has the same
      reported retraction: OR upper strand 2 bp left and 1 bp right, OR lower unchanged;
      OX upper 1 bp left/right unchanged; OX lower 1 bp at each end. Boundaries are
      source figure orientations, not independent genomic-coordinate assignments.
      This derivative was assayed at 200 nM, versus 200 nM WT. The authors use saturating
      doses; differing doses must not be represented as equal-dose occupancy or as
      quantitative affinity measurements.'
    evidence:
    - reference: DOI:10.1093/nar/gkr640
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 8 and footprint results.
