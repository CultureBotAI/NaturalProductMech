    notes: 'Trypsin assay: 1 nmol tagged SimR with 1 pmol bovine trypsin in 100 uL,
      50 mM Tris pH 8, 20 mM CaCl2, 150 mM NaCl at 4 C. DNA preincubation is equimolar
      for 5 min; SDS-PAGE samples at 0/5/10/15 min. Band persistence is not a measured
