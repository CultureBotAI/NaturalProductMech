graph:
  graph_id: simocyclinone-d8-simc7-ketoreduction-and-assay-limits
  scope: BIOSYNTHESIS
  description: 'Purified N-terminally His-tagged SimC7 converts source-assigned 7-oxo-SD8
    to SD8 with NADH or NADPH and supports the slower reverse reaction with NAD+.
    Controls, construct discrepancies and concentration conflicts remain explicit
    (review #538). The earlier physiological substrate is a hypothesis, so no terminal
    in-vivo pathway order or kinetic constants are invented. This graph does not duplicate
    gyrase-target bioactivity mechanisms.'
