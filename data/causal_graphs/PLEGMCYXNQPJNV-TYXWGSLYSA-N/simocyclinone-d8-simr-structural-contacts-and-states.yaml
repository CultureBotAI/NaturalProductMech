  graph_id: simocyclinone-d8-simr-structural-contacts-and-states
  scope: BIOSYNTHESIS
  description: 'SimR operator contacts and static DNA/ligand/apo structure comparisons
    in producer-cluster regulation. Crystal packing, paper-to-native residue offsets
    and unresolved owner stereochemistry constrain interpretation (review #536). This
    is not a drug-target graph or an observed kinetic transition pathway.'
