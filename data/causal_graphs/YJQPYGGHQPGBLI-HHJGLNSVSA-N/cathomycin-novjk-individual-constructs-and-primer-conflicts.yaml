graph:
  graph_id: cathomycin-novjk-individual-constructs-and-primer-conflicts
  scope: BIOSYNTHESIS
  description: 'Four reported individual NovJ/NovK constructs, intended tagged products
    and bounded primer/solubility evidence. Review #562. The cathomycin/BGC0000834
    owner retains its unspecified sugar stereocentre and SEEDED status. Precursor
    and recombinant protein evidence does not resolve that stereocentre or establish
    an exact-key merge with fully specified novobiocin. Main-paper evidence is abstract-only;
    the official four-page supplement and native deposits were inspected directly.'
