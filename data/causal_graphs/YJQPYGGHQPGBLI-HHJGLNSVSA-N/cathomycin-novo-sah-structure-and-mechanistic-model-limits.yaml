graph:
  graph_id: cathomycin-novo-sah-structure-and-mechanistic-model-limits
  scope: BIOSYNTHESIS
  description: 'Observed NovO-SAH structure and deposited homodimer are kept distinct
    from coumarin/SAM docking, substrate-entry and catalytic hypotheses in Sadler
    2017. Review #555. PDF locators refer to the 60-page accepted manuscript/SI, not
    final journal pagination; SI printed pages are seven lower. The cathomycin owner
    retains its unspecified sugar stereocentre.'
