graph:
  graph_id: cathomycin-novm-staged-tailoring-and-product-mass-conflict
  scope: BIOSYNTHESIS
  description: 'Direct 2005 supplement evidence for staged NovM/NovP/NovN assays around
    NovO, with unresolved product mass and sequence boundaries. Review #563. The BGC0000834
    cathomycin owner retains its unspecified sugar stereocentre and SEEDED status.
    These precursor and recombinant assays do not resolve that stereocentre or justify
    an exact-key merge with fully specified novobiocin.'
