graph:
  graph_id: cathomycin-novp-assembly-evidence-and-solution-size-disagreement
  scope: BIOSYNTHESIS
  description: 'Separate author/PISA dimer, dimer-like 2010 SEC and monomer-like 2007
    DLS evidence. None uniquely establishes native-cell stoichiometry. Review #558.
    The 2010 page locators refer to the 30-page author manuscript, not journal pagination.
    The cathomycin owner retains its unspecified sugar stereocentre; no exact merge
    with fully specified novobiocin or new mature-product synthesis claim is made.'
