  edges:
  - subject: wt
    predicate: was_crystallized_for
    object: structure
    notes: 2WK1 has one protein chain in the asymmetric unit. A two-chain biological
      assembly is not two independently observed asymmetric-unit chains.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        pp.3-4.
    - reference: https://files.rcsb.org/download/2WK1.cif
      evidence_type: DATABASE_ASSERTION
      notes: Asymmetric-unit atom/entity records.
  - subject: structure
    predicate: supports_proposed_assembly
    object: dimer
    notes: The authors and PISA assign a dimer generated by operations x,y,z and -x,y,-z+1.
      The paper reports approximately 856 A^2 buried surface per subunit, about 8%,
      mainly involving helices alpha1 and alpha7. This is crystal-interface analysis,
      not direct native-cell assembly measurement.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: COMPUTATIONAL_PREDICTION
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        pp.4-5 and Figure 5, PDF p.22.
    - reference: https://files.rcsb.org/download/2WK1.cif
      evidence_type: DATABASE_ASSERTION
      notes: Assembly 1, author_and_software_defined_assembly/PISA; symmetry operations.
  - subject: wt
    predicate: has_measured_solution_size_in
    object: sec
    notes: After nickel affinity and buffer exchange, approximately 2 mL at 10 mg/mL
      was loaded on Superdex 75 16/60 in 50 mM Tris-HCl, 200 mM NaCl pH 8.0, at 1
      mL/min. Standards were albumin 67, ovalbumin 43, chymotrypsinogen A 25, ribonuclease
      A 13.7 and dextran blue 2000 kDa. The main fraction had apparent size about
      66 kDa; no monomer peak was reported. The manuscript does not display a SEC
      chromatogram.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        p.5, Results; p.11, Size exclusion chromatography.
  - subject: sec
    predicate: supports_dimer_like_size_for
    object: dimer
    notes: The reported approximately 66-kDa apparent mass is near the source 64.2-kDa
      expected tagged dimer. SEC is hydrodynamic evidence for that preparation, not
      a measured association constant or native in-cell stoichiometry.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        p.5, Results.
  - subject: wt
    predicate: has_earlier_solution_size_estimate
    object: dls
    notes: The 2007 DLS experiment at 293 K used at least 15 measurements, giving
      a monomodal distribution, 17.1% polydispersity and apparent mass 32.8 kDa, compared
      with calculated 32.1-kDa His-tagged monomer. It is a different method/preparation
      context from the later SEC result.
    evidence:
    - reference: DOI:10.1107/S1744309107008287
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2007 primary PDF text; Dynamic light scattering methods/results.
        Text inspected, not visually verified; extraction-ambiguous micro-unit volumes/dimensions
        excluded.
  - subject: dls
    predicate: limits_unique_stoichiometry_claim
    object: limits
    notes: Retain the monomer-like DLS estimate rather than silently converting it
      to the later dimer assignment. These data do not by themselves resolve concentration
      dependence, shape effects or a monomer-dimer equilibrium.
    evidence:
    - reference: DOI:10.1107/S1744309107008287
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2007 primary PDF text; DLS result. Text inspected, not visually
        verified; extraction-ambiguous micro-unit volumes/dimensions excluded.
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        pp.4-5, later SEC/dimer assignment.
  - subject: dimer
    predicate: has_context_limit
    object: limits
    notes: The structural/PISA model and SEC support a tagged-protein dimer under
      the studied conditions; the earlier DLS estimate remains distinct. No unique
      native-cell stoichiometry is asserted.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        pp.4-5.
    - reference: DOI:10.1107/S1744309107008287
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2007 primary PDF text; DLS result. Text inspected, not visually
        verified; extraction-ambiguous micro-unit volumes/dimensions excluded.
  - subject: dimer
    predicate: does_not_establish_assembly_of
    object: homologs
    notes: The paper predicts related CouP/CloP interfaces from conservation and is
      less certain about TylF. NovP coordinates do not experimentally demonstrate
      an identical dimer interface in these other proteins.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: COMPUTATIONAL_PREDICTION
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        p.5, conservation-based comparisons.
