  scope: BIOSYNTHESIS
  description: 'Distinct NovN preparation sizes and the explicitly unsolved 2008 crystal
    forms. Review #560. Xu locators are PDF pages, nineteen higher than printed main-text
    pages. The owner retains its unspecified sugar stereocentre and SEEDED status;
    source-assigned novobiocin is not an exact structure-key merge with cathomycin.
    Native reference, engineered protein and DNA construct are separate entities.'
