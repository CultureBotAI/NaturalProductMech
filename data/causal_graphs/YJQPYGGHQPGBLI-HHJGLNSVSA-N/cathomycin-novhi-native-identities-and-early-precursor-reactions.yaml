      a complete construct or detailed preparation protocol in the inspected text.
    evidence:
    - reference: DOI:10.1016/S1074-5521(01)00009-6
      evidence_type: PRIMARY_EXPERIMENT
      notes: Chen and Walsh 2001 primary abstract, PMID 11325587. Results. Full paper
        and supporting methods were not obtained.
  - subject: i_gene
    predicate: is_reported_source_of
    object: i_prep
    notes: The same abstract reports recombinant approximately 45-kDa NovI as a heme
      protein functioning as a P450-type monooxygenase. The native accession is not
      assigned to this incompletely specified preparation.
    evidence:
    - reference: DOI:10.1016/S1074-5521(01)00009-6
      evidence_type: PRIMARY_EXPERIMENT
      notes: Chen and Walsh 2001 primary abstract, PMID 11325587. Results. Full paper
