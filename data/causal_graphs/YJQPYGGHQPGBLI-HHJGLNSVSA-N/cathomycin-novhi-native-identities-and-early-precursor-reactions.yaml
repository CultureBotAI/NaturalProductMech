  graph_id: cathomycin-novhi-native-identities-and-early-precursor-reactions
  scope: BIOSYNTHESIS
  description: 'NovH/NovI deposited identities and bounded 2001 activation, loading
    and hydroxylation evidence. Review #561. The cathomycin/BGC0000834 owner retains
    its unspecified sugar stereocentre and SEEDED status; these precursor assays do
    not establish an exact-structure merge with fully specified novobiocin. Boll page
    locators are PDF pages, five above printed pages. Native references, DNA constructs
    and engineered preparations are distinct.'
