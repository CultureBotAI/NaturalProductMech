graph:
  graph_id: cathomycin-novq-e281-variants-and-surrogate-assay-limits
  scope: BIOSYNTHESIS
  description: 'Nine NovQ E281 variants and bounded menadione-hydroquinol assays from
    Ni 2020 (review #554), linked to the NovQ precursor mechanism as engineered substrate-scope
    evidence. The full public ten-page supplement was inspected; main-article and
    correction access was limited to abstracts/metadata. Native sequence references,
    literal-primer models, actual preparations, docking and engineered-host product
    measurements are distinct. No native-product identity or full experimental sequence
    is inferred.'
