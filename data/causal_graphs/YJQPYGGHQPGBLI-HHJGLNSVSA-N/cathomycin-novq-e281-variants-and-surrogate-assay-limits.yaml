      evidence_type: CURATOR_INFERENCE
      notes: CDS reference for literal-primer reconstruction.
  - subject: vector
    predicate: is_reported_backbone_for
    object: wt_construct
    notes: Table S2 describes pMBPtev as pET30a-derived with MBP and a TEV site before
      the cloning site. Figure S1 shows the 6.4-kbp vector and NotI position. This
      schematic does not provide a complete plasmid sequence or every processed terminus.
    evidence:
    - reference: https://static-content.springer.com/esm/art%3A10.1007%2Fs00253-020-10470-w/MediaObjects/253_2020_10470_MOESM1_ESM.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure S1 and Table S2, PDF pp.2,9.
  - subject: wt_construct
    predicate: encodes_engineered_preparation
    object: wt
    notes: 'Table S1 gives WT-F ATAAGAATGCGGCCGCAATGCCCGCACTCCCGATG and WT-R ATAAGAATGCGGCCGCTCAGTGGTGGTGGTGGTGGTGTCGGGCACCTCCGGTGAT
      (both 5-prime). Their native ends match the first and last 18 coding nt in both
      AF170880.4 and AB496950.1. The reverse-primer extension encodes six C-terminal
      histidines followed by stop: the reconstructed native-core-plus-His6 segment
      is 329 aa. This excludes unknown N-terminal vector/fusion sequence. The TEV
      site does not demonstrate tag cleavage in every kinetic aliquot, and cleavage
      would not by itself remove this C-terminal extension.'
    evidence:
    - reference: https://static-content.springer.com/esm/art%3A10.1007%2Fs00253-020-10470-w/MediaObjects/253_2020_10470_MOESM1_ESM.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Literal WT primers and vector/strain table, PDF pp.2,8-9.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: CURATOR_INFERENCE
      notes: Literal-primer reading-frame model, not experimental sequencing.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB496950.1
      evidence_type: CURATOR_INFERENCE
      notes: Same native-end and His6 model on second deposited CDS.
  - subject: wt_construct
    predicate: is_parental_reference_for
    object: panel
    notes: The source names nine E281 substitutions in pMBPtev-derived constructs.
      All nine literal forward/reverse pairs are exact reverse complements and uniquely
      match native CDS nt826..858 with the designed mismatches. Models change only
      residue 281 in the native core; full plasmids and individual assayed aliquots
      were not independently sequenced.
    evidence:
    - reference: https://static-content.springer.com/esm/art%3A10.1007%2Fs00253-020-10470-w/MediaObjects/253_2020_10470_MOESM1_ESM.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Tables S1/S2, PDF pp.8-9.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: CURATOR_INFERENCE
      notes: CDS-local primer matching and translated-core comparison.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB496950.1
      evidence_type: CURATOR_INFERENCE
      notes: Independent second deposited template model.
