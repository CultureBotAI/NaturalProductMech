    predicate: is_sequence_reference_for_primer_model
    object: wt_construct
    notes: The 323-aa native sequence supplies an explicit reconstruction reference,
      not proof of the full experimental construct. Table S2 names S. niveus for gene
      amplification without a strain number; the 16259 taxonomy conflict is not resolved
      or transferred to this sample by matching short primers.
    evidence:
