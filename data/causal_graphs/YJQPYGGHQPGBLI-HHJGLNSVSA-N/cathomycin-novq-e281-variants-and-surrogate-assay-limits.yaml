      notes: Primary abstract only.
      snippet: 2.05-fold activities
  - subject: panel
    predicate: tests_functional_consequences_near_hypothesis
    object: model
    notes: The study motivates E281 substitutions using substrate docking; Figure
      S2 is a docking-energy distribution. This is computational contact evidence,
      not a solved NovQ-substrate complex or direct proton-transfer observation. The
      publisher records a Figure 1 correction dated 2020-04-14; its full correction
      and main article were not obtained. No uninspected atom-level contact map or
      corrected Figure 1 geometry is asserted.
    evidence:
    - reference: https://static-content.springer.com/esm/art%3A10.1007%2Fs00253-020-10470-w/MediaObjects/253_2020_10470_MOESM1_ESM.pdf
      evidence_type: CURATOR_INFERENCE
