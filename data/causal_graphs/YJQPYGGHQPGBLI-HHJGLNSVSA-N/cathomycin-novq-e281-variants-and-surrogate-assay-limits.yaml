  - subject: spectra
    predicate: supports_source_product_assignment
    object: product
    notes: Figure S3 shows an MS peak labelled m/z 241.1222 and UV markers at 244,
      248, 261 and 269 nm. Figure S4 supplies a proton-NMR spectrum in CDCl3 with
      TMS. These are the source product-characterization figures, not separate structural
      determinations for each mutant or fermentation sample. No independent full spectral
      assignment or exact chemical record is constructed here.
    evidence:
    - reference: https://static-content.springer.com/esm/art%3A10.1007%2Fs00253-020-10470-w/MediaObjects/253_2020_10470_MOESM1_ESM.pdf
