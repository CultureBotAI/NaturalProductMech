graph:
  graph_id: cathomycin-novjk-reported-assembly-and-sec-interpretation-limits
  scope: BIOSYNTHESIS
  description: 'Source-reported J2K2 assembly and three directly inspected concentration-labeled
    SEC traces. Review #562. The cathomycin/BGC0000834 owner retains its unspecified
    sugar stereocentre and SEEDED status. Precursor and recombinant protein evidence
    does not resolve that stereocentre or establish an exact-key merge with fully
    specified novobiocin. Main-paper evidence is abstract-only; the official four-page
    supplement and native deposits were inspected directly.'
