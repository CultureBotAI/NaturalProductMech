  edges:
  - subject: sample
    predicate: was_analyzed_by
    object: sec
    notes: Supporting Figures 1-3 plot analytical gel-filtration absorbance against
      retention volume. The four SI pages do not identify a complete sample sequence,
      unique tag combination, buffer, column or mass-calibration method for these
      traces.
    evidence:
    - reference: DOI:10.1021/bi051297m.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Official four-page supporting information; all pages read as text and
        visually. pp.1-2, all three captions and plots.
  - subject: sample
    predicate: has_study_level_assembly_context
    object: reported
    notes: The main abstract separately reports purification as a J2K2 heterotetramer.
      This does not identify every SEC peak or establish that the individual SI constructs
      are the same assayed preparation.
    evidence:
    - reference: DOI:10.1021/bi051297m
      evidence_type: PRIMARY_EXPERIMENT
      notes: Pacholec et al. 2005 primary abstract, PMID 16171397. Source-reported
        assembly, not a reanalysis of SEC plots. Main article methods/results were
        not obtained; the four-page SI was inspected separately.
    - reference: DOI:10.1021/bi051297m.s001
      evidence_type: CURATOR_INFERENCE
      notes: Official four-page supporting information; all pages read as text and
        visually. pp.1-4, limited sample/preparation context.
  - subject: sec
    predicate: has_concentration_labeled_trace
    object: high
    notes: Figure 1 labels both [J] and [K] as 155 uM, not total tetramer concentration.
      The plot has early and later absorbance peaks; the red pseudo-Gaussian overlay
      fits the later peak rather than the entire trace. No exact peak area or fitted
      retention volume is extracted from the raster.
    evidence:
    - reference: DOI:10.1021/bi051297m.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Official four-page supporting information; all pages read as text and
        visually. p.1, Supporting Figure 1, visually inspected.
