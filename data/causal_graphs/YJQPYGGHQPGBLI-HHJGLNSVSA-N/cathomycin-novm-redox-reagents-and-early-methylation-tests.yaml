graph:
  graph_id: cathomycin-novm-redox-reagents-and-early-methylation-tests
  scope: BIOSYNTHESIS
  description: 'New commercial redox-support proteins and directly inspected early-stage
    NovO/CouO tests. The supplement does not establish complete sequences/tags for
    its recombinant preparations. Review #563. The BGC0000834 cathomycin owner retains
    its unspecified sugar stereocentre and SEEDED status. These precursor and recombinant
    assays do not resolve that stereocentre or justify an exact-key merge with fully
    specified novobiocin.'
