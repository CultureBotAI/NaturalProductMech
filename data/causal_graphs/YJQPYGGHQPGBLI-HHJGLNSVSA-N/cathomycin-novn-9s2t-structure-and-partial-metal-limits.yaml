  scope: BIOSYNTHESIS
  description: 'The 2025 NovN deposit, engineered sequence, coordinate coverage and
    bounded local geometry. Review #560. Xu locators are PDF pages, nineteen higher
    than printed main-text pages. The owner retains its unspecified sugar stereocentre
    and SEEDED status; source-assigned novobiocin is not an exact structure-key merge
    with cathomycin. Native reference, engineered protein and DNA construct are separate
    entities.'
