  edges:
  - subject: construct
    predicate: encodes_engineered_preparation
    object: wt
    notes: The source uses a codon-optimized pET26b(+) gene with C-terminal His6.
      WT means this recombinant assay comparator, not untagged native NovO.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI section 15, PDF
        p.34.
  - subject: wt
    predicate: has_measured_endpoint_in
    object: assay
    notes: Table 2 reports WT 98% conversion after 24 h. This is HPLC area/area% at
      320 nm, not 98% relative to a 100%-normalized WT, an initial turnover rate or
      independently calibrated molar conversion. No replicate count or uncertainty
      accompanies the endpoint table.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI sections 12-13,
        PDF pp.30-32; main Figure 3a, PDF p.3.
  - subject: substrate
    predicate: is_acceptor_for
    object: assay
    notes: Substrate 6 is the synthetic benzamide coumarin, not native 8-desmethylnovobiocic
      acid or mature cathomycin. The assay lists 100 uM acceptor, 2 mM SAM, 0.1 mg/mL
      BSA, 50 mM sodium phosphate pH 6.5, total 0.5 mL, 35 C and 1000 rpm for 24 h,
      followed by 80 C for 15 min to quench.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI sections 11-13,
        PDF pp.30-32.
  - subject: sam
    predicate: is_donor_for
    object: assay
    notes: SAM is directly supplied at a stated 2 mM in this endpoint assay. Do not
      transfer SalL-mediated donor-supply methods from the separate KIE assay.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI section 12, PDF
        pp.30-31.
  - subject: assay
    predicate: forms_source_assigned_product
    object: product
    notes: The HPLC product is assigned as N-(4,7-dihydroxy-8-methyl-2-oxo-2H-chromen-3-yl)benzamide
      (4a). Preparative characterization supports the source assignment but is not
      a separate structural determination of every mutant endpoint.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI sections 12-14,
        PDF pp.31-33.
  - subject: control
    predicate: has_measured_endpoint_in
    object: assay
    notes: The no-MT control is reported as 0% area conversion. This is the source
      endpoint, not a measured absolute zero or a stated detection limit.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI Table 2 and footnote,
        PDF p.32.
  - subject: assay
    predicate: has_unresolved_loading_description
    object: loading
    notes: Section 12 reports 250 ug purified enzyme in 0.5 mL and a final 1.9 uM
      concentration. With the source 26.23-kDa theoretical mass (PDF p.36), the mass/volume
      implies about 19.06 uM, roughly tenfold higher. Neither value is silently selected
      as actual loading; no new enzyme-normalized rate is calculated.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI sections 12/17,
        PDF pp.30-31,36.
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: CURATOR_INFERENCE
      notes: Sadler 2017 accepted manuscript with appended SI; Dimensional mass/volume
        calculation, not a corrected experiment.
  - subject: construct
    predicate: was_expressed_for_lysate_preparation
    object: lysate
    notes: The preparative experiment uses E. coli lysate from NovO overexpression,
      distinct from purified WT in the endpoint comparison.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI section 14, PDF
        pp.32-33.
  - subject: lysate
    predicate: was_used_in
    object: preparative
    notes: The procedure starts with 40 mL lysate, 20 mg substrate and 72 mg SAM,
      then adds another 72 mg SAM after 24 h and incubates for a further 16 h. It
      reports 90% HPLC conversion and 14 mg isolated product (67% yield). Conversion
      and isolated recovery are different readouts, not native antibiotic titers or
      a WT-versus-mutant comparison.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI section 14, PDF
        pp.32-33.
  - subject: preparative
    predicate: yielded_characterized_product
    object: product
    notes: The source provides proton/carbon NMR and HRMS (calculated [M+H]+ 312.0868,
      found 312.0866) for the isolated surrogate. No new exact-structure record or
      independent full spectral assignment is made.
    evidence:
    - reference: https://strathprints.strath.ac.uk/60153/1/Sadler_etal_ACSCB_2017_C_methylation_of_coumarin_scaffolds_by_NovO.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sadler 2017 accepted manuscript with appended SI; SI section 14, PDF
        p.33.
  - subject: construct
    predicate: is_reported_parent_for
    object: f14m
    notes: Literal forward 5-prime GGTTCCGAAGCAGAAGCAATGCACCGCATGGGCTCG; reverse 5-prime
      CGAGCCCATGCGGTGCATTGCTTCTGCTTCGGAACC. The reverse-complement pair encodes the
      named local peptide change. The authors report sequencing mutant genes. Full
      experimental plasmids were not independently obtained; short peptide models
      do not establish complete sequence identity. No native accession is assigned.
