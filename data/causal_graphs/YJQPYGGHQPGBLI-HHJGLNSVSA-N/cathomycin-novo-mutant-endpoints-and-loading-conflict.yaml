graph:
  graph_id: cathomycin-novo-mutant-endpoints-and-loading-conflict
  scope: BIOSYNTHESIS
  description: 'Eleven NovO engineered variants in the Sadler 2017 24-hour benzamide-surrogate
    assay, with WT and no-MT controls. Lysate, double-mutant identity, censored values,
    loading conflict and preparative recovery remain explicit. Review #555. PDF locators
    refer to the 60-page accepted manuscript/SI, not final journal pagination; SI
    printed pages are seven lower. The cathomycin owner retains its unspecified sugar
    stereocentre.'
