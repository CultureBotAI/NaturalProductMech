    object: quality
    notes: The author manuscript reports Rwork 14.5% and Rfree 16.2%; current deposited
      refinement values are 0.145 and 0.163. Preserve the source-specific difference
      rather than silently harmonizing it. The 2007 maximum 1.35-A collection and
      reprocessed 1.40-A dataset are different reports, not two resolutions for the
      final atomic model.
    evidence:
