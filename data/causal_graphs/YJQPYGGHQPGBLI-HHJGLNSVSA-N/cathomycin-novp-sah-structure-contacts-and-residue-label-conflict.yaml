        excluded.
    - reference: https://files.rcsb.org/download/2WK1.cif
      evidence_type: DATABASE_ASSERTION
      notes: Refinement records, version 1.4.
  - subject: structure
    predicate: contains_observed_region
    object: lid
    notes: Residues 126..151 form the helical lid over mostly buried SAH. The paper
      gives lid main/side-chain B factors 20.5/24.7 A^2 versus 14.0/17.7 for the rest
      of the protein. Table 2 whole-protein values 14.6/18.1 use another denominator.
      Static B factors are not direct measurements of gating trajectories, exchange
      rates or rate-limiting lid motion.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        pp.5-6 and Table 2, PDF p.29.
  - subject: lid
    predicate: has_unresolved_source_residue_label
    object: label_conflict
    notes: Page 5 first names Gly126/Pro128 and later prints Asp128 as contacting
      Tyr200/Glu201. Native 128 is Pro, whereas 138 is Asp. Independent 2WK1 distances
      are Asp138 OD1--Tyr200 N 2.763 A and Asp138 OD2--Glu201 N 3.000 A. These support
      a possible residue-number error, not an authorized correction of the source
      or direct proof of a lid-locking mechanism.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        p.5, SAM/SAH binding site.
    - reference: https://files.rcsb.org/download/2WK1.cif
      evidence_type: CURATOR_INFERENCE
      notes: Independent sequence/atom-distance comparison.
    - reference: https://www.uniprot.org/uniprotkb/Q9L9F2
      evidence_type: DATABASE_ASSERTION
      notes: Native positions 128 and 138.
  - subject: structure
    predicate: contains_observed_disulfide
    object: disulfide
    notes: Cys228 and Cys231 have deposited SG separation 2.167 A and an explicit
      disulfide record. The authors consider prolonged aerobic exposure during up-to-one-month
      crystal growth as a possible artifact. No physiological redox role, obligatory
      catalytic function or experimentally demonstrated activity loss caused by this
      bond is inferred.
    evidence:
    - reference: DOI:10.1016/j.jmb.2009.10.045
      evidence_type: PRIMARY_EXPERIMENT
      notes: Gomez Garcia 2010 author manuscript at https://hdl.handle.net/10261/87465;
        p.6.
    - reference: https://files.rcsb.org/download/2WK1.cif
      evidence_type: CURATOR_INFERENCE
      notes: struct_conn and independently calculated SG distance.
  - subject: structure
    predicate: has_observed_coordinate_inventory
    object: inventory
    notes: The asymmetric unit contains 1965 protein atoms, 26 SAH atoms, two sulfates,
      two ethylene glycol molecules and 242 waters. Deposited coordinates contain
      no metal, SAM or DDN. Reported MgCl2 soaking and co-crystallization also gave
      no metal density, but those trials are data-not-shown and are not separately
      displayed structures.
    evidence:
