  description: 'Observed SAH contacts and structural limits, with independent coordinate
    checks kept separate from the printed Asp128 label and from functional inference.
    Review #558. The 2010 page locators refer to the 30-page author manuscript, not
    journal pagination. The cathomycin owner retains its unspecified sugar stereocentre;
    no exact merge with fully specified novobiocin or new mature-product synthesis
    claim is made.'
