graph:
  graph_id: cathomycin-novp-native-identity-and-tagged-preparation
  scope: BIOSYNTHESIS
  description: 'Native NovP identity, recombinant preparation and explicitly database-annotated
    precursor methylation. Native sequence, DNA construct and tagged protein remain
    distinct. Review #558. The 2010 page locators refer to the 30-page author manuscript,
    not journal pagination. The cathomycin owner retains its unspecified sugar stereocentre;
    no exact merge with fully specified novobiocin or new mature-product synthesis
    claim is made.'
