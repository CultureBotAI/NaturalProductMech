  graph_id: cathomycin-novq-native-identity-and-precursor-evidence
  scope: BIOSYNTHESIS
  description: 'NovQ native sequence, source-taxonomy conflict and bounded Ozaki 2009
    precursor evidence (review #554). The BGC0000834 owner is not merged with fully
    specified novobiocin. The deposited NCIMB 9219 sequence is grounded; the strain-16259
    source and recombinant sample retain identity uncertainty. Only the primary abstract
    was obtained for biochemical claims.'
