  edges:
  - subject: native_nov
    predicate: is_sequence_reference_for
    object: nov_parent
    notes: All 527 NovL residues printed in Figure 3.27 match the CDS-aware AF170880.4/AAF67505.1
      translation and Q9L9F6. pUM07 is an engineered N-terminal His-tag construct,
      not native Q9L9F6. Current AF170880.4 is attributed to NCIMB 9219 following
      the published strain correction; historical strain labels do not uniquely identify
      each assay sample. No matched parent batch or tag-cleavage state is supplied
      in the chimera activity table.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Plasmid table and Figure 3.27, PDF pp.29,91.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: DATABASE_ASSERTION
      notes: Native deposited CDS.
    - reference: https://www.uniprot.org/uniprotkb/Q9L9F6
      evidence_type: DATABASE_ASSERTION
      notes: Reviewed Q9L9F6, entry 67, sequence 1, retrieved 2026-10-04.
    - reference: DOI:10.1128/genomeA.01146-13
      evidence_type: PRIMARY_EXPERIMENT
      notes: Indexed primary strain-correction text.
  - subject: cou_alignment
    predicate: limits_exact_identity_of
    object: cou_parent
    notes: Figure 3.27 prints a 529-aa CouL with EA384-385. AF235050.1-.3/AAG29784.1
      have RA, whereas AF235050.4/AAG29784.2 has EG. All other printed residues agree.
      Thus neither historical nor current deposit exactly identifies the printed parent.
      A printing error or sample difference is unresolved; this is not proof of a
      third biological allele. pUM05 was derived from couMW12 via pUM10. The table
      reports a 1607-bp PCR product and a 1615-bp BspHI/NotI subclone; without the
      full vector sequence, these do not establish exact junctions or an impossible
      cloning event. CouL-derived segments in Chim1-4 and Chim12 include positions
      384-385.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
