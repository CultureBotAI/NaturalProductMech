  - subject: nov_parent
    predicate: supplied_template_segments_to
    object: panel
    notes: Table 2.5 identifies pUM07 as NovL template. Region I is 161-171; IIa is
      192-214; IIb is 215-229; the C-terminal region starts at 413. These source-defined
      regions guide the schematic swaps, not uniquely sequenced crossover coordinates.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
