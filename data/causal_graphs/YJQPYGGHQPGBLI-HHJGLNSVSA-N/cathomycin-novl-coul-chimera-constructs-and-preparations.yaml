  - subject: cou_parent
    predicate: supplied_template_segments_to
    object: panel
    notes: Table 2.5 identifies pUM05 as CouL template. Region I is 161-171; IIa is
      192-216; IIb is 217-231; the C-terminal region starts at 415. The source informally
      calls the C terminus the last 100 residues, but 415-529 comprises 115 residues.
      No exact 100-residue construct boundary is inferred.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 2.5 and Figure 3.27, PDF pp.40-41,91.
  - subject: panel
    predicate: has_literal_primer_audit
    object: primer_audit
    notes: All 15 printed primer strings were checked; each of the six internal forward/reverse
      pairs is reverse-complementary. Full-length ungapped matches within the deposited
      parent CDSs uniquely localize the internal primers despite template mismatches;
      short exact suffixes alone can select unrelated genomic positions. The shared
      reverse primer GAATGAAGCTTCTCACCTGTCCACCAGGACGTC differs from CouL six bases
      from its 3-prime end, reconstructing synonymous GTG-to-GTC at native CouL V525.
      The models use NovL AF170880.4 and historical CouL AF235050.3, not a recovered
      pUM05 sequence. Relative to simple concatenation at the stated region boundaries,
      Chim4 retains NovL R241/A245 in place of CouL K243/T247; Chim8 retains NovL
      S154/V155 in place of CouL T154/A155. The other eight modeled internal cores
      match that simple combination. Conserved sequence can make a crossover nonunique.
      These are inferred models excluding native residues 1-2 and unknown vector-derived
      sequence, not experimental sequence determinations.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Literal primers, Table 2.5 and Figure 3.27, PDF pp.31-32,40-41,91.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: CURATOR_INFERENCE
      notes: CDS-local primer matching and reading-frame reconstruction.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.3
      evidence_type: CURATOR_INFERENCE
      notes: Historical template model; actual CouL parent identity unresolved.
  - subject: host
    predicate: supplied_expression_material_for
    object: purification
    notes: Expression used 1 L TB culture, cooling at OD600 0.6, 0.5 mM IPTG and six
      hours at 20 C/250 rpm. Proteins were expressed with an N-terminal His tag and
      purified by IMAC. For chimeras, pooled fractions underwent PD-10 desalting,
      addition of 15% glycerol and storage at -70 C. The separate thrombin/size-exclusion
      protocol for crystallization proteins does not establish tag removal for these
      chimeras.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 2.6.1-2.6.2, PDF pp.43-45.
  - subject: purification
    predicate: has_reported_readout
    object: sds
    notes: Figure 3.28 displays all ten chimeras at 20 ug per lane and labels them
      57 kDa, but their apparent migrations differ. Near purity is the author description,
      not a quantified purity percentage, folding/stability control or biological
      oligomer determination. Table 3.7 gives dashes for both parental yield/concentration
      rows; earlier NovL preparations must not be substituted as matched measurements.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 3.7 and Figure 3.28, PDF p.92.
  - subject: panel
    predicate: generated_expression_construct_for
    object: chim1
    notes: 'Chim1: NovL-derived N-terminal segment and CouL-derived C-terminal segment,
      schematic transition before region I. Table 2.5 uses NovCouMut2f/r for the internal
      overlap. pGEM-T intermediate pUM18 precedes pHis8 construct pUM27. The reported
      1608-bp PCR and 1592-bp BspHI/HindIII fragment agree with the literal deposited-template
