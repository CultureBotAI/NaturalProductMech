graph:
  graph_id: cathomycin-novl-coul-chimera-constructs-and-preparations
  scope: BIOSYNTHESIS
  description: 'Ten engineered NovL/CouL amide-synthetase chimeras from Metzger 2010
    (review #551), associated with the NovL precursor mechanism of the cathomycin/BGC0000834
    owner. These are experimental fusion proteins, not ten native UniProt entries
    or ten natural-product structures. Parent sequence references, schematic swaps,
    literal-primer models and actual assayed preparations are distinct. The thesis
    reports sequence verification, but complete experimental plasmids were not independently
    obtained. Figure 3.27 CouL does not exactly match any of AF235050.1-.4. All page
    locators below are PDF pages, twelve above printed pages.'
