    object: panel
    notes: Figure 6 tests deletion-host NovH with CloY, CdaX, SimY or Orf1van at enzyme:partner
      1:1.2 by the 5-min, 30-C ATP-PPi exchange assay. The panel is heterologous functional
      stimulation, not four endogenous novobiocin-cluster partners or direct physical
      binding measurements.
