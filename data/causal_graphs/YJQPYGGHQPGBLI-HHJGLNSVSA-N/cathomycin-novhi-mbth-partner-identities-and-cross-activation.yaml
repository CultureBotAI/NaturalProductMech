    object: orf
    notes: The source-named AAL90876.1 is a 69-aa conceptual translation from Amycolatopsis
      orientalis, taxon 31958, at AF486630.1:720..929(+). The 210-nt CDS including
      stop matches the protein deposit. The paper used a commercially synthesized,
      E. coli-codon-optimized orf1van in pET28a/pBB34, not a directly assayed native
      preparation. No full synthetic construct sequence or defensible exact UniProt
      mapping was obtained in the bounded accession queries; the named NCBI accession
      is retained.
