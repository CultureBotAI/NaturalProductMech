    predicate: produced
    object: cloy
    notes: This partner was expressed in E. coli Rosetta2(DE3) as an N-terminal His6
      fusion. Methods report thrombin removal of MbtH tags (0.4 U/mg, 8 h at 4 C)
      before gel filtration, with Ni-NTA and Superdex purification. The reported preparation
      yield is 6.9 mg/L culture. A280-derived concentration and tag removal do not
      establish active fraction or restoration of the exact native N terminus.
    evidence:
