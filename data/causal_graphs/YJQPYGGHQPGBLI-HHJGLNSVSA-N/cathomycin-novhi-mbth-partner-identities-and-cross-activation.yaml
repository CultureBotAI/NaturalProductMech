graph:
  graph_id: cathomycin-novhi-mbth-partner-identities-and-cross-activation
  scope: BIOSYNTHESIS
  description: 'Four heterologous MbtH partners, exact native reference boundaries
    and complete NovH cross-activation scope. Review #561. The cathomycin/BGC0000834
    owner retains its unspecified sugar stereocentre and SEEDED status; these precursor
    assays do not establish an exact-structure merge with fully specified novobiocin.
    Boll page locators are PDF pages, five above printed pages. Native references,
    DNA constructs and engineered preparations are distinct.'
