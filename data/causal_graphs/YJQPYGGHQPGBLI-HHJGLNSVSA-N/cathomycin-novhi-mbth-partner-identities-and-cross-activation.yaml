    predicate: has_checked_primer_models
    object: primers
    notes: The six printed CloY/SimY/CdaX primers were visually checked and modeled
      against their native CDSs. PCR lengths including 11-nt forward and 9-nt reverse
      tails are 236, 233 and 236 nt, respectively. CloY and SimY cores are unchanged;
      CdaX GTG is recoded to ATG without changing its CDS-aware protein translation.
      These models do not establish complete vector junctions or post-thrombin scars.
    evidence:
