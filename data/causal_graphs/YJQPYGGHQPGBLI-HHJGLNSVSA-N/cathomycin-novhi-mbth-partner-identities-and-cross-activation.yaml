  - subject: cloy
    predicate: stimulated_novh_in
    object: panel
    notes: Figure 6 shows higher NovH exchange activity with this partner than without
      added MbtH. The NovH panel normalizes its CloY condition to 100%; the other
      enzyme panels have their own denominators. No precise percentage is newly estimated
      from the bars, and stimulation alone is not direct binding or native pathway
      flux.
