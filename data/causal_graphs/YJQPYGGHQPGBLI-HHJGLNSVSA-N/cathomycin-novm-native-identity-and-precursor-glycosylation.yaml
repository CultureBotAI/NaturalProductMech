  scope: BIOSYNTHESIS
  description: 'Native NovM identity, a distinct His8 preparation and bounded primary
    glycosylation evidence. Review #563. The BGC0000834 cathomycin owner retains its
    unspecified sugar stereocentre and SEEDED status. These precursor and recombinant
    assays do not resolve that stereocentre or justify an exact-key merge with fully
    specified novobiocin.'
