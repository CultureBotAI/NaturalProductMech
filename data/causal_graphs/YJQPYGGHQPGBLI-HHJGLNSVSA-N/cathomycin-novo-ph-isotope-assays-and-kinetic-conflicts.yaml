  scope: BIOSYNTHESIS
  description: 'Two additional NovO lysine variants, the WT comparator and auxiliary
    SalL in Sadler 2017 pH, substrate-analogue and coupled isotope experiments. Reported
    measurements remain separate from uncertain scale, substrate-axis identity and
    mechanistic inference. Review #555. PDF locators refer to the 60-page accepted
    manuscript/SI, not final journal pagination; SI printed pages are seven lower.
    The cathomycin owner retains its unspecified sugar stereocentre.'
