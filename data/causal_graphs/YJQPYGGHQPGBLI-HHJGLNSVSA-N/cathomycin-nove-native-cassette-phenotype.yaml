  description: 'Native novE cassette genetics, residual product and unresolved polarity/rescue
    limits. Partial biosynthesis curation (review #589), not full-record sign-off.
    The cathomycin owner retains its unspecified sugar stereocentre; source-assigned
    novobiocin products remain ungrounded, not exact-key merged with CID 54675769.
    Native deposited sequences do not retrospectively identify every historical strain
    stock, complete preparation or engineered allele.'
