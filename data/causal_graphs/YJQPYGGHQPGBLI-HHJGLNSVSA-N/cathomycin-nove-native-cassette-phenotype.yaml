  edges:
  - subject: cluster
    predicate: encodes_native_reference
    object: NovE
    notes: AF170880.4 CDS 4859..5512(+), 1-based inclusive, encodes AAF67498.1, 217
      aa. CDS-aware table-11 translations across AF170880.2/.3/.4 exactly match the
      selected UniProt sequence. Old .2/.3 qualifiers are S. caeruleus, taxon 195949,
      NCIB 11891; .4 is S. niveus, taxon 193462, NCIMB 9219. The published correction
      assigns the deposit to 9219, not 11891. The thesis additionally prints 11897
      in its strain table versus 11891 in results. These are retained source conflicts,
      not proof that all experimental stocks were identical.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: DATABASE_ASSERTION
      notes: Current native deposit, compared with pinned .2 and .3 records.
      retrieved_on: '2026-10-06'
    - reference: https://www.uniprot.org/uniprotkb/Q9L9G3
      evidence_type: DATABASE_ASSERTION
      notes: 'Reviewed entry 35, sequence 1; annotation 2026-09-02, sequence 2000-10-01;
        protein existence 4: Predicted. Reviewed status does not identify a complete
        experimental preparation.'
      retrieved_on: '2026-10-06'
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: CURATOR_INFERENCE
      notes: Exact CDS-aware sequence audit; alternate NovE A0ABZ2ADU8 is not an exact
        historical reference because of N14S,T38P,G40A,E179Q differences.
      retrieved_on: '2026-10-06'
    - reference: DOI:10.1128/genomeA.01146-13
      evidence_type: PRIMARY_EXPERIMENT
      notes: Indexed primary text reporting PCR/sequencing-based deposit-strain correction
        inspected; direct full-text retrieval unavailable.
      retrieved_on: '2026-10-06'
    - reference: https://tobias-lib.uni-tuebingen.de/xmlui/bitstream/handle/10900/48693/pdf/diss_AE.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
