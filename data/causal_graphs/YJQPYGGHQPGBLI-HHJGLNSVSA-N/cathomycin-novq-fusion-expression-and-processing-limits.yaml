  scope: BIOSYNTHESIS
  description: 'NovQ fusion/preparation evidence from Ni 2019 (review #554), associated
    with the deposited NovQ precursor mechanism rather than new native proteins. The
    primary abstract, public figure previews and two supplementary gels were inspected;
    subscription main methods were not obtained. No complete construct, native strain
    or catalytic identity is inferred from soluble expression, SDS-PAGE or TEV processing.'
