    predicate: has_reported_solubility_outcome
    object: solubility
    notes: The abstract describes soluble protein as approximately 70% of total cellular
      proteins. Retain that stated denominator; do not reinterpret it as 70% of NovQ,
      absolute yield, purity or catalytic conversion. The full quantitative methods
      were not obtained.
    evidence:
    - reference: DOI:10.1007/s00449-018-2050-9
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract; denominator retained literally.
  - subject: panel
    predicate: has_reported_expression_association
    object: trna
    notes: The abstract associates greater rare-tRNA abundance with higher total and
      soluble recombinant protein. This does not demonstrate a particular translation
      bottleneck or supply a quantitative comparison for every construct.
    evidence:
    - reference: DOI:10.1007/s00449-018-2050-9
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract.
  - subject: panel
    predicate: has_reported_purification_outcome
    object: purification
    notes: The source reports greater than 90% recombinant-protein purity after Ni-NTA.
      Purity is distinct from soluble fraction, recovery and catalytic activity; it
      is not assigned to every fusion or lane.
    evidence:
    - reference: DOI:10.1007/s00449-018-2050-9
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract.
  - subject: mbp
    predicate: was_reportedly_processed_to
    object: cleaved
    notes: In-vitro TEV cleavage is reported. Complete processed termini, residual
      tags, cleavage efficiency and activity recovery are not established by the inspected
      abstract. Processing is not assumed to regenerate native Q9L9F1.
    evidence:
    - reference: DOI:10.1007/s00449-018-2050-9
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract.
      snippet: cleaved using TEV protease
  - subject: panel
    predicate: includes_supplementary_comparison
    object: supp1
    notes: Figure S1 labels control, NovQ and molecular-partner groups with S/P lanes
      and NovQ arrows near 40 kDa. The caption does not identify the molecular partners
