graph:
  graph_id: cathomycin-novhi-2011-novh-construct-and-host-preparations
  scope: BIOSYNTHESIS
  description: 'NovH sequence-version limits, literal primers and the two 2011 host-conditioned
    preparations. Review #561. The cathomycin/BGC0000834 owner retains its unspecified
    sugar stereocentre and SEEDED status; these precursor assays do not establish
    an exact-structure merge with fully specified novobiocin. Boll page locators are
    PDF pages, five above printed pages. Native references, DNA constructs and engineered
    preparations are distinct.'
