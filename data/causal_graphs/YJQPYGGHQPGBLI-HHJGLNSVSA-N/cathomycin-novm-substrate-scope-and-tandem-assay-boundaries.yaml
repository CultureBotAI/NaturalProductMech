  graph_id: cathomycin-novm-substrate-scope-and-tandem-assay-boundaries
  scope: BIOSYNTHESIS
  description: 'Separate NovM donor/acceptor evidence and abstract-level tandem incubations,
    without physical-complex claims. Review #563. The BGC0000834 cathomycin owner
    retains its unspecified sugar stereocentre and SEEDED status. These precursor
    and recombinant assays do not resolve that stereocentre or justify an exact-key
    merge with fully specified novobiocin.'
