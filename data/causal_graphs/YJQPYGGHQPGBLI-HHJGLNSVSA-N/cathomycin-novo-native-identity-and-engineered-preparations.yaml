graph:
  graph_id: cathomycin-novo-native-identity-and-engineered-preparations
  scope: BIOSYNTHESIS
  description: 'NovO native sequence, historical taxonomy, abstract-limited 2005 precursor
    chemistry and separate Sadler 2017 preparations. Native Q9L9F3 is a deposited
    sequence reference, not an engineered assay protein. Review #555. PDF locators
    refer to the 60-page accepted manuscript/SI, not final journal pagination; SI
    printed pages are seven lower. The cathomycin owner retains its unspecified sugar
    stereocentre.'
