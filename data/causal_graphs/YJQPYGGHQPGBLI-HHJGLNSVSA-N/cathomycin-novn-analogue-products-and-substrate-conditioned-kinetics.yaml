  edges:
  - subject: wt
    predicate: catalyzes
    object: panel
    notes: The five analogue acceptors 104, 105, 107, 108 and 283 were incubated overnight
      with carbamoyl phosphate under the endpoint protocol (1 mM acceptor, 5 mM donor,
      2 mM ATP/Mg, 0.4 uM enzyme, 30 C). Product assignments use HPLC, NMR and negative
      FAB-MS. These are source structural assignments, not new independent reassignments.
    evidence:
    - reference: https://tobias-lib.uni-tuebingen.de/xmlui/bitstream/handle/10900/48601/pdf/Dissertation-endvision.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Xu 2004 primary dissertation; Methods, Figure 19 and Tables 21-22, PDF
        pp.57,60-61,89-91; appendices pp.112-126.
  - subject: panel
    predicate: has_reported_aggregate_conversion
    object: average
    notes: The source gives 87% overnight conversion for 104 and about 54% as the
      average for the other four acceptors. The latter is not four individual measurements,
      a rate or a common uncertainty estimate.
    evidence:
    - reference: https://tobias-lib.uni-tuebingen.de/xmlui/bitstream/handle/10900/48601/pdf/Dissertation-endvision.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Xu 2004 primary dissertation; Analogue results, PDF pp.89-90.
  - subject: wt
    predicate: was_measured_in
    object: kinetics
    notes: The separate kinetic comparison uses 37.5 nM NovN, 5 mM donor, 2.5-40 uM
      acceptor and five-minute incubations, duplicate assays and Lineweaver-Burk analysis.
      It is not the overnight conversion panel.
    evidence:
    - reference: https://tobias-lib.uni-tuebingen.de/xmlui/bitstream/handle/10900/48601/pdf/Dissertation-endvision.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Xu 2004 primary dissertation; Kinetic methods and Figure 20, PDF pp.57,91.
  - subject: a104
    predicate: is_tested_acceptor_for
    object: panel
    notes: The source names novclobiocin 104 as this panel acceptor; no exact chemical
      CURIE or equivalence to the owner is assigned.
    evidence:
    - reference: https://tobias-lib.uni-tuebingen.de/xmlui/bitstream/handle/10900/48601/pdf/Dissertation-endvision.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Xu 2004 primary dissertation; Materials, Figure 19 and Table 21, PDF
        pp.30,89-90.
  - subject: panel
    predicate: forms_source_assigned_product
    object: p114
    notes: For the 104->114 reaction, the source assigns 3-double-prime carbamoylation
      from H-3 double-prime shifting 4.18->5.37 ppm and a +43-Da mass change. Product
      negative FAB [M-H]- is reported as m/z 631, a source integer assignment rather
      than an exact mass. This is the 87% overnight conversion row; no error estimate
      is given.
    evidence:
    - reference: https://tobias-lib.uni-tuebingen.de/xmlui/bitstream/handle/10900/48601/pdf/Dissertation-endvision.pdf?isAllowed=y&sequence=1
