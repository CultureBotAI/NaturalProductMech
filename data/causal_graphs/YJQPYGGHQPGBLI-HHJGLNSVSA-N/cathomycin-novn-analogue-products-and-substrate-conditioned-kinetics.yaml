  scope: BIOSYNTHESIS
  description: 'Five source-assigned NovN analogue products and two separate analogue
    kinetic fits. Review #560. Xu locators are PDF pages, nineteen higher than printed
    main-text pages. The owner retains its unspecified sugar stereocentre and SEEDED
    status; source-assigned novobiocin is not an exact structure-key merge with cathomycin.
    Native reference, engineered protein and DNA construct are separate entities.'
