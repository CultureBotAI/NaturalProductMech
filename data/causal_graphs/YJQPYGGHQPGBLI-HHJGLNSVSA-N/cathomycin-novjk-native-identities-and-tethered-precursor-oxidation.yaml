  graph_id: cathomycin-novjk-native-identities-and-tethered-precursor-oxidation
  scope: BIOSYNTHESIS
  description: 'Exact native NovJ/NovK identities and bounded primary evidence for
    tethered precursor oxidation. Review #562. The cathomycin/BGC0000834 owner retains
    its unspecified sugar stereocentre and SEEDED status. Precursor and recombinant
    protein evidence does not resolve that stereocentre or establish an exact-key
    merge with fully specified novobiocin. Main-paper evidence is abstract-only; the
    official four-page supplement and native deposits were inspected directly.'
