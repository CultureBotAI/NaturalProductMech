  scope: BIOSYNTHESIS
  description: 'Condition-specific negative NovE EMSAs and detectable reciprocal regulator
    transcripts. No direct NovE-DNA event or NovE-NovG physical complex is asserted.
    Partial biosynthesis curation (review #589), not full-record sign-off. The cathomycin
    owner retains its unspecified sugar stereocentre; source-assigned novobiocin products
    remain ungrounded, not exact-key merged with CID 54675769. Native deposited sequences
    do not retrospectively identify every historical strain stock, complete preparation
    or engineered allele.'
