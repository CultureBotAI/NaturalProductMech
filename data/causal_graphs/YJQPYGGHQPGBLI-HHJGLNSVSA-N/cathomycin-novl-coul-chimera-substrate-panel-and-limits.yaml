graph:
  graph_id: cathomycin-novl-coul-chimera-substrate-panel-and-limits
  scope: BIOSYNTHESIS
  description: 'Metzger 2010 Figure 3.31 endpoint assays of ten NovL/CouL chimeras
    and two parental comparators (review #551). Each protein has its own reported
    six-column activity vector, retaining substrate, product, loading, normalization
    and censoring. Comparisons support bounded regional contributions to precursor-ligation
    activity, not exact substrate-contact residues, catalytic efficiencies or mature
    antibiotic synthesis. The cathomycin owner has an unspecified sugar stereocentre;
    unglycosylated assays do not resolve it or justify an exact-structure merge. Construct
    identity is qualified in the separate chimera preparation graph. PDF locators
    are printed pages +12.'
