  - subject: assay
    predicate: is_limited_by
    object: linearity
    notes: Figure 3.30 tested parental enzyme loads up to 6 ug per 100 uL. NovL product
      formation was linear only up to 2 ug for S1 and 3.5 ug for S2. The text describes
      CouL as linear beyond 6 ug, although the plotted range ends at 6. The selected
      4-ug panel load exceeds both stated NovL bounds, and 40-ug S3 results are outside
      this tested loading range. Figure 3.31 reports duplicate assays without specifying
      biological replicates or tabulated uncertainty. The Figure 3.30 error bars are
      not identified here as SD or SE. Thus these endpoint comparisons must not become
      initial-rate kinetics, kcat or catalytic-efficiency estimates.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 3.30/results 3.4.3 and Figure 3.31 text, PDF pp.93-94.
      snippet: Doppelbestimmung
  - subject: assay
    predicate: supports_bounded_interpretation
    object: interpretation
    notes: The selected swaps associate region IIa, region IIb and the following segment
      with activity differences. For S1, Chim5/8/9 have near-NovL normalized values,
      while Chim10/11 are lower; for S3 the author emphasizes the 40-ug monoamide
      column because other signals are weak. This does not establish universal dispensability
      of the termini or region I, direct substrate binding by particular residues,
      or loss of folding in less active fusions. Normalized columns cannot be compared
      as an absolute protein-dose response. Homology-based candidate residues on PDF
      pp.97-99 remain untested hypotheses in this study; no extra point-mutant proteins
      or solved NovL/CouL structures are inferred. Below-detection entries are retained
      as censored observations.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 3.31 caption and discussion, PDF pp.94-99.
      snippet: unterhalb der Nachweisgrenze
