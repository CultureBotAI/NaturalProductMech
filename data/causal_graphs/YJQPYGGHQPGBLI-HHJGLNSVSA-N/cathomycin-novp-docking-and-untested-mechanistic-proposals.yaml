graph:
  graph_id: cathomycin-novp-docking-and-untested-mechanistic-proposals
  scope: BIOSYNTHESIS
  description: 'NovP substrate docking and structural hypotheses are explicitly computational,
    not observed catalytic complexes, engineered-mutant results or protein interactions.
    Review #558. The 2010 page locators refer to the 30-page author manuscript, not
    journal pagination. The cathomycin owner retains its unspecified sugar stereocentre;
    no exact merge with fully specified novobiocin or new mature-product synthesis
    claim is made.'
