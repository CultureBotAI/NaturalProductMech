  description: Partial ARSEF 2860 reference view of tenellin assembly, oxidative ring
    expansion, N-hydroxylation and database-reported genetic effects. References are
    not verified experimental alleles; database annotations aggregate citations across
    strains and constructs. TenS/TenC collaboration is not a physical-complex claim.
    Named intermediates remain chemically ungrounded; variable source spellings, detailed
    precursor accounting and exact stereochemical assignments remain unresolved. Broader
    2-pyridone impairment is separated from tenellin loss. No congener-specific glycosylation,
    siderophore mechanism, bioactivity target, host-infection phenotype or engineered
    domain-swap product is transferred to tenellin. J4UJ10 sequence version 2 is 544
    aa; deposited EJP63692.1 and RefSeq XP_008600655.1 are 490 aa. UniProt marks the
    deposited gene model erroneous. The corrected protein is not sequence-identical
    to those records. Its exact native splice/experimental sequence remains REVIEW_NEEDED.
    TenR regulation does not establish direct DNA binding; the TenS induction citation
    mismatch is not resolved.
