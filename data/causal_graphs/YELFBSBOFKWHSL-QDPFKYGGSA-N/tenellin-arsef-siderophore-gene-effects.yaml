    evidence:
    - reference: https://www.uniprot.org/uniprotkb/J4W6X9/entry
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-11'
      notes: 'Reviewed UniProtKB DISRUPTION PHENOTYPE annotation, release 2026_03,
        entry 53, sequence 1. The DISRUPTION PHENOTYPE annotation explicitly includes
        impaired tenellin production among multiple affected products (PMID:39109629,
        DOI:10.1021/acs.jafc.4c02957). This is a genetic production-effect claim,
        not complete loss, direct tenellin catalysis, an ornithine-derived tenellin
        precursor claim or an established indirect regulatory mechanism. SIDDA/SIDF/SIDI
        text says six products but lists seven; no product count is adopted. The current
        UniProt gene symbol SIDDA is retained beside the FUNCTION label SIDD. Primary
        methods were not inspected: the publisher returned HTTP403 and no alternate
        retrieval was attempted. Database annotation, not independently inspected
        primary experiments or a verified assayed allele. No generalization of a deletion
        phenotype to every native strain or construct.'
      snippet: rhodotorulic acid (RA) and tenellin
