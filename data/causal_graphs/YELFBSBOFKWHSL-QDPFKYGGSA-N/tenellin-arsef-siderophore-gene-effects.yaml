  description: Partial database-derived genetic production-effect view, separate from
    direct tenellin assembly. Native ARSEF 2860 references SIDA, SIDDA/SIDD, SIDF
    and SIDI have disruption annotations explicitly naming impaired tenellin production.
    Their usual siderophore catalytic roles are not transferred into tenellin biosynthetic
    reactions. Neither complete production loss, direct catalysis, ornithine incorporation,
    a specific regulatory mechanism nor verified assayed alleles is asserted. SIDC/SIDL/SIDH
    lack an equally specific tenellin production-effect statement in the inspected
    annotations; they remain follow-up leads, not proven irrelevant. No source-owned
    producer or cluster grade changes.
