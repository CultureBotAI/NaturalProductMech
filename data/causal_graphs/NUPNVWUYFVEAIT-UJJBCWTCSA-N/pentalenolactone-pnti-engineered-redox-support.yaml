    evidence:
    - reference: DOI:10.1016/j.engmic.2025.100206
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Figure 5: the pair improved yield relative to PenA/PntI alone; the authors
        reported no significant change for individual additions.'
  - subject: pena
    predicate: supplies pentalenene for
    object: acid_production
    evidence:
    - reference: DOI:10.1016/j.engmic.2025.100206
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Figures 4A and 5: the E. coli strains carry UC5319 penA; PenA is not
        the TU469 PntA used in the Streptomyces experiment.'
    - reference: https://www.uniprot.org/uniprotkb/Q55012
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-03'
      notes: UC5319 PenA, 337 aa; exact sequence match to both original clone AAA19131.1/U05213.1
        and ADO85594.1/HQ292066.1. The 1994 source names Streptomyces UC5319; the
        cluster and 2025 paper name S. exfoliatus.
  - subject: xnr_4772
    predicate: is coexpressed in
    object: paired_expression_4772
    evidence:
    - reference: DOI:10.1016/j.engmic.2025.100206
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Table S2: pLJ52 carries J1074 XNR_4772, transferred via pLJ55 to pLJ64.
        Figure 5 and Tables S2-S4 use XNR_4772; an earlier main-text occurrence of
        XNR_4722 is inconsistent.'
    - reference: https://www.ncbi.nlm.nih.gov/protein/AGI91094.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-03'
      notes: 395-aa XNR_4772 at CP004370.1:5424795..5425982, strain J1074. NCBI calls
        this S. albidoflavus; the paper calls it S. albus. Exact-locus and GenPept-cross-reference
        UniProt searches did not resolve an accession; no homolog was substituted.
        NCBI labels it oxidoreductase; the paper selects it as a predicted FDR.
  - subject: xnr_5179
    predicate: is coexpressed in
    object: paired_expression_4772
    evidence:
    - reference: DOI:10.1016/j.engmic.2025.100206
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Table S2: XNR_5179 from pLJ54 is added to pLJ55 to make pLJ64, jointly
