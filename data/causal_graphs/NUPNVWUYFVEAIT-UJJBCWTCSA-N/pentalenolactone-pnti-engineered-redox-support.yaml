  graph_id: pentalenolactone-pnti-engineered-redox-support
  scope: BIOSYNTHESIS
  description: Engineered E. coli BL21(DE3) with PenA/PntI and alternative J1074 redox-gene
    expression conditions. XNR_5179-containing pairs increased intermediate production;
    XNR_1673 conditions are represented only as tested conditions. Neither native
    partnership, physical complex, nor increased final pentalenolactone yield is asserted.
