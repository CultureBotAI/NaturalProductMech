    - reference: https://www.ncbi.nlm.nih.gov/protein/AGI88059.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-03'
      notes: J1074 XNR_1673, 106 aa, complement(CP004370.1:1979389..1979709). NCBI
        uses S. albidoflavus; the paper uses S. albus. UniProt query (AGI88059 OR
        gene:XNR_1673) returned no results; the versioned NCBI accession avoids substituting
        a homolog.
