        not resolve an accession; no homolog was substituted.
  - subject: paired_expression_4772
    predicate: increases
    object: acid_production
    evidence:
    - reference: DOI:10.1016/j.engmic.2025.100206
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 5 compares pLJ64 with PenA/PntI-only pLJ9. The paired condition
        increased acid production; the authors reported no significant change for
        individual additions. No physical complex or native partnership is demonstrated.
  - subject: xnr_1673
