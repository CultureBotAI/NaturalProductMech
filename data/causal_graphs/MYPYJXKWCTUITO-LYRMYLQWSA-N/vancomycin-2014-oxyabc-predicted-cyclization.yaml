    notes: The2014 source annotates AORI_1482/OxyA as a P450 candidate for peptide
      cyclization by comparison with related clusters. The identifier grounds a current
      native sequence, not experimentally established cyclization activity in this
      strain. Complete CP003410.1 CDS 1568701..1569876(+) translates to AGM04070.1
      and the 391-residue UniProt reference. Current source strain is HCCB10007, A.
      keratiniphila taxon129921; the versioned protein record documents the2018 taxonomy
      change from historical A. orientalis. Source-owned producer fields are not relabeled.
      The complete current CDS is identical to the older HQ679900.1 CDS encoding AEI58868.1.
      Current UniProt FUNCTION/PATHWAY comments are automated ECO:0000256 annotations,
      not independent experimental support. No purified-enzyme assay, exact crosslink
      position, reaction order, carrier state, reductase partner, physical enzyme
      complex or historical stock sequence is asserted.
    evidence:
    - reference: DOI:10.1186/1471-2164-15-363
      evidence_type: COMPUTATIONAL_PREDICTION
      notes: Page11 explicitly infers the roles from corresponding cep/bal cluster
        genes. Table2 on page12 and Figure5 on page13 were visually inspected. The
        paper's four gene-replacement experiments concern other tailoring genes; they
        do not experimentally validate OxyA/B/C.
      retrieved_on: '2026-10-06'
      snippet: likely encode three P450 monooxygenases
    - reference: https://www.uniprot.org/uniprotkb/R4SMY3
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed entry48/sequence1; 391 residues, locusAORI_1482, strainHCCB10007.
