  description: Independent structural dataset for DAPG-biosynthesis-associated PhlABC.
    Deposited participants are separate from native CHA0/Pf-5 sequence references;
    PhlA source-taxonomy disagreement remains REVIEW_NEEDED. Assembly multiplicity,
    PhlB zinc contacts and PhlC SCY88 are structural observations, not turnover, native
    mixed-strain complex or physiological stoichiometry. No bound DAPG/MAPG, complete
    biosynthesis, producer-grade upgrade or antimicrobial-target claim. Associated
    paper/abstract/figures/SI unread; not full-record sign-off.
