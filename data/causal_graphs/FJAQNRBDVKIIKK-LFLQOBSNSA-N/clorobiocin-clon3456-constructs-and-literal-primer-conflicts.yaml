  - subject: intermediates
    predicate: have_literal_primer_models
    object: junction
    notes: 'Literal primers: cloN6_f AATTGAACGCGGATCCGTTCCTGCTA; cloN6_r CCGTCTCCGAAGCTTCACGGGGTCA;
      cloN6Q_f AAATTGAACGGATCCATGTTCC; cloN6Q_r CTCCGTGAGATCTCGGGGTCA; cloN6G_r TCTCCGTGCGGCCGCGGGGTCAT;
      cloN6SQ_f AACGCGGGCATGCTCCTGCTA. Forward f model25278..25303 and reverse r26991..26967
      differ from printed ends25304 and26992. Q_f models25277..25298; Q_r26987..26967,
      not the printed12-nt26976..26987 interval. G_r models26988..26966 versus printed
      end26989; SQ_f25283..25303. Some8-9nt suffixes are unique only within the source-named
      locus. Minimal amplicons: pCA1 1714nt, pCA3 1711nt, pCA4 1712nt, pCA5 1705nt,
      conditional pCA9 1715nt. At native coordinates pCA1 changes the initial ATG
      to a proline codon, pCA5 predicts F2L and stop-to-Arg, pCA3/pCA4 replace the
      stop with Arg, and conditional pCA9 preserves the native core. These are primer
      models, not complete fusion sequences or independent plasmid resequencing.'
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49061/pdf/Diss_C.Anderle.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Anderle 2007 primary thesis, PDF pp.44,47,59; PDF pages are twelve above
        printed pages.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF329398.1
      evidence_type: CURATOR_INFERENCE
      notes: Literal-primer alignment and table-11 native-coordinate translation.
  - subject: junction
    predicate: reveals_source_conflict
    object: restriction
    notes: 'The SphI/BglII pCA5 model has cut positions13,1114 and1694: upstream SphI/SphI
      interval1101nt and downstream SphI/BglII interval580nt. Methods instead call
      these0.6kb and1.1kb respectively. The table assigns25283..26391 to C-terminal
      pCA5/1 and26391..26987 to N-terminal pCA6, conflicting with native orientation
      and the literal restriction model. These disagreements are retained rather than
      choosing an unverified corrected construct.'
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49061/pdf/Diss_C.Anderle.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Anderle 2007 primary thesis, PDF pp.44,59; PDF pages are twelve above
        printed pages.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF329398.1
      evidence_type: CURATOR_INFERENCE
      notes: Independent restriction geometry of the literal-primer model.
  - subject: intermediates
