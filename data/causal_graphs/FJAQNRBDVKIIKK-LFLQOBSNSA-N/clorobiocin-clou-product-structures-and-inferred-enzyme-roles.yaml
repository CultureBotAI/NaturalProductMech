  - subject: '122'
    predicate: has_reported_nmr_assignment
    object: nmr122
    notes: In DMSO, TableIII.2 reports 4''-H3.44ppm triplet(J9.6Hz),5''-H3.71ppm dq(J6.4,9.2Hz),
      and a single 5-position methyl signal7''-H3 at1.18ppm doublet(J6.4Hz). The6''
      methyl signal is absent. The source assigns an L-rhamnose-derived sugar with
      the axial5-methyl group replaced by H; this is the source structural interpretation,
      not an independently solved absolute structure.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.99,101,154; PDF pages are ten above
        printed pages.
      snippet: nur eine Methylgruppe
  - subject: '123'
    predicate: has_reported_nmr_assignment
    object: nmr123
    notes: TableIII.2 gives2''-H5.36ppm triplet(overlap,Jundetermined),3''-H4.29ppm
      dd(J2.8,9.0Hz),4''-H3.38ppm triplet(J9.0Hz), and7''-H3 at1.19ppm doublet(J6.4Hz).
      The source places the5-methylpyrrole-2-carbonyl substituent at2''-O rather than3''-O.
      The two desmethyl products are positional congeners, not interchangeable parent
      identities.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.100-101,155; PDF pages are ten above
        printed pages.
  - subject: '122'
    predicate: has_reported_ion_in
    object: mass
    notes: Results text assigns nominal m/z681 [M-H]- and a14-mass-unit decrease relative
      to clorobiocin. The negative FAB appendix labels681.0; this is not a high-resolution
      neutral exact mass.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.82,99,154; PDF pages are ten above
        printed pages.
  - subject: '123'
    predicate: has_reported_ion_in
    object: mass
    notes: Results describe the same nominal negative ion as122; the appendix labels681.3.
      Preserve the displayed value without calling the two decimal values identical
      exact-mass measurements.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.82,100,155; PDF pages are ten above
        printed pages.
  - subject: acid
    predicate: has_reported_ion_in
    object: mass
    notes: Prose p.99 calls415 a molecular weight, whereas the negative FAB appendix
      labels414.1. Retain this distinction; do not silently turn either into a neutral
      monoisotopic mass.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.82,99,153; PDF pages are ten above
