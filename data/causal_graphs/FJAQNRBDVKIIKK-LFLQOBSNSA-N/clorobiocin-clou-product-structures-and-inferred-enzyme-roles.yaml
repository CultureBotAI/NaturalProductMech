  - subject: '106'
    predicate: has_reported_ion_in
    object: mass
    notes: Prose reports380 and the negative FAB appendix labels379.9. The nonchlorinated
      aglycone assignment also uses an8'-H signal at6.66ppm; the source's stated35-Da
      comparison is not an independently reconciled exact-mass difference.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.99,101,152; PDF pages are ten above
        printed pages.
  - subject: acid
    predicate: has_nmr_source_discrepancy
    object: solvent
    notes: TableIII.2 and the appendix heading specify methanol/CD3OD for the acids,
      but the acquisition text on the appendix acid spectra reads DMSO. Methods also
      use the unusual word Dimethylsulfonamid, while TableIII.2 names Dimethylsulfoxid
      for122/123. No harmonized acid solvent is asserted.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.82,101,152-153; PDF pages are ten
        above printed pages.
  - subject: nmr122
    predicate: supports_genetic_role_assignment
    object: methylation
    notes: The source combines loss of the axial5-methyl group in the cloU mutant
      with complementation to assign a5-C-methylation role. It does not supply a purified
      CloU substrate panel, SAM stoichiometry or a kinetic constant.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Freitag 2006 primary thesis, PDF pp.99-101,125; PDF pages are ten above
        printed pages.
    - reference: DOI:10.1099/mic.0.28931-0
      evidence_type: PRIMARY_EXPERIMENT
      notes: Inspected primary abstract only; full publisher endpoint returned403.
  - subject: u
    predicate: has_genetically_supported_role
    object: methylation
    notes: This assignment concerns CloU in clorobiocin biosynthesis. Homology to
      NovU/CouU is not a substitute for experiments on those proteins.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Freitag 2006 primary thesis, PDF p.125; PDF pages are ten above printed
        pages.
    - reference: https://www.uniprot.org/uniprotkb/Q8GHA8
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed Q8GHA8, entry 49, sequence 1, taxon149682; retrieved 2026-10-04.
        Exact native reference, not an experimentally verified construct.
  - subject: nmr122
    predicate: motivates_pathway_inference
    object: epimerization
    notes: Source-assigned L-rhamnose-derived stereochemistry supports3,5-epimerization
      somewhere in the sugar pathway. End-product genetics is not direct observation
      of each nucleotide-sugar intermediate or a uniquely assigned epimerase reaction.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Freitag 2006 primary thesis, PDF pp.125,127-128; PDF pages are ten above
        printed pages.
    - reference: DOI:10.1099/mic.0.28931-0
      evidence_type: CURATOR_INFERENCE
      notes: Primary abstract gives the authors' pathway interpretation; not a purified
        CloW assay.
  - subject: w
    predicate: is_proposed_to_mediate
    object: epimerization
    notes: The thesis proposes CloW as the3,5-epimerase, informed by sequence similarity
      and the CloU-mutant products. No CloW deletion, purified CloW turnover or exclusion
      of heterologous host-enzyme contributions is shown in this experiment.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Freitag 2006 primary thesis, PDF pp.127-128; PDF pages are ten above
        printed pages.
      snippet: sehr wahrscheinlich
    - reference: https://www.uniprot.org/uniprotkb/Q8GHA6
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed Q8GHA6, entry 69, sequence 1, taxon149682; retrieved 2026-10-05.
        Exact native reference, not an experimentally verified construct.
  - subject: epimerization
    predicate: has_attribution_limit
    object: limits
    notes: Do not transfer this CloU-deletion interpretation into direct in-vivo NovW
      or CouW evidence. The separately curated NovW in-vitro isotope/kinetic study
      and this heterologous clorobiocin genetic experiment answer different questions.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Freitag 2006 primary thesis, PDF pp.127-128; PDF pages are ten above
        printed pages.
  - subject: methylation
    predicate: has_assay_limit
    object: limits
    notes: These data support a genetic biosynthetic role, not observed physical assembly,
      purified catalysis or proof of a unique native intermediate order.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Freitag 2006 primary thesis, PDF pp.95-100,125; PDF pages are ten above
        printed pages.
  - subject: solvent
    predicate: limits_comparison
    object: limits
    notes: Clorobiocin and the acids are listed in methanol whereas122/123 are listed
      in DMSO. Cross-solvent chemical shifts cannot be treated as isolated effects
      of methyl removal; the conflicting acid acquisition labels remain unresolved.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
      notes: Freitag 2006 primary thesis, PDF pp.101,152-155; PDF pages are ten above
        printed pages.
