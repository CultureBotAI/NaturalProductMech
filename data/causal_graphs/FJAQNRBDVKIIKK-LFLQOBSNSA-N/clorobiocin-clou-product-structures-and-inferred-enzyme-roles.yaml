  - subject: mutant
    predicate: supplied_culture_for
    object: isolation
    notes: A deletion host was grown in5L for preparative ethyl-acetate extraction
      and HPLC isolation. The general methods describe pH4 extraction, petroleum-ether
      pretreatment, Sephadex LH20 and preparative RP18 purification. Spectra concern
      isolated products, not direct purified CloU catalysis.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.81-83,96; PDF pages are ten above
        printed pages.
  - subject: isolation
    predicate: provided_congener_data_for
    object: assignments
    notes: The stated 5-L preparation targets novclobiocin 122 and 123. Aglycone assignments
      are also discussed and appendix spectra are supplied, but their exact aliquots
      are not identified as this same 5-L culture.
