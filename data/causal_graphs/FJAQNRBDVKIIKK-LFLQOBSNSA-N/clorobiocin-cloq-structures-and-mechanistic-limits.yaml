  - subject: 2xlq
    predicate: has_observed_acceptor_contacts
    object: contacts
    notes: Using the CCD atom map, E281 OE1 to phenolic 34H O3 is 2.574 A; the shortest
      R160 guanidinium/carboxyl oxygen pair is NH2-O1 at 3.101 A. These are curator-calculated
      heavy-atom distances, not experimentally located hydrogens. The source interprets
      E281 hydrogen bonding and an R160 carboxyl interaction, with a surrounding hydrophobic
      environment including F68, W122, Y174, Y233 and L235. Contact geometry does
      not by itself establish proton-transfer direction, affinity or the essentiality
      of a residue.
    evidence:
    - reference: https://files.rcsb.org/download/2XLQ.cif
      evidence_type: CURATOR_INFERENCE
      notes: Independent coordinate/CCD atom mapping and distances.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
