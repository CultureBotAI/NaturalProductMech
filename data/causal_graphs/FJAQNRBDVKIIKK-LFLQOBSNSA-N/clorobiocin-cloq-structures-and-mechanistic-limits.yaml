  - subject: wt
    predicate: has_deposited_structural_state
    object: 2xlq
    notes: '2XLQ: X-ray diffraction, 2.22 A; 316 modeled polymer residues versus 327
      deposited. Revision history 2010-10-27 through 2024-11-13, version 1.5; coordinates
      inspected 2026-10-04. This WT-4HPP state came from preparation/crystallization
      with 2 mM 4-HPP in the buffers. Thesis Table 3.3 lists a 2.21-A high-resolution
      data limit, while the current deposited refinement resolution is 2.22 A. Modeled
      residues are native 1-313 plus GSH, not all 327 deposited residues. The I4122
      crystal state is not a direct measurement of cellular flux or a solved donor-bound
      ternary complex.'
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Crystal conditions, structural solution and comparisons, PDF pp.70-76.
    - reference: https://files.rcsb.org/download/2XLQ.cif
      evidence_type: DATABASE_ASSERTION
      notes: Sequence, atom inventory, refinement and revision metadata.
