    predicate: is_core_reference_for
    object: wt
    notes: 'All four deposited polymer sequences are 327 aa: GSH plus the native 324-aa
      Q8GHB2 sequence, except the intended C215S in 2XM5 and R66S in 2XM7. Author
      residue numbers equal native numbers; label_seq_id is author number plus three.
      The sequence-difference positions 218 and 69 are label numbering, not native
      C215S/R66S positions.'
