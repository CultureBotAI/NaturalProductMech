  graph_id: clorobiocin-cloq-structures-and-mechanistic-limits
  scope: BIOSYNTHESIS
  description: 'Four deposited CloQ structural states, exact scar/native sequence
    mappings, the Cys215 thiohemiketal and bounded mechanistic hypotheses (review
    #553). Direct coordinate observations, source interpretations and proposed donor
    contacts are separate. Detailed methods are from the inspected Metzger thesis;
    only the journal abstract was obtained. PDF pages are twelve above printed pages.'
