  - subject: 2xlq
    predicate: contains_reported_covalent_adduct
    object: adduct
    notes: The deposited covale record links CYS author215 SG to ligand 34H C2. Direct
      Euclidean coordinate distance is 1.883 A, matching the deposited link distance.
      All 13 ligand heavy atoms have modeled occupancy 1.00; that is a refinement
      assignment, not a solution binding fraction. The source interprets continuous
      density and tetrahedral geometry as a 4-HPP thiohemiketal.
    evidence:
    - reference: https://files.rcsb.org/download/2XLQ.cif
      evidence_type: DATABASE_ASSERTION
      notes: Covalent link and ligand atom metadata.
    - reference: https://files.rcsb.org/download/2XLQ.cif
