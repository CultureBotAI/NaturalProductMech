  - subject: adduct
    predicate: has_covalent_context_in
    object: contacts
    notes: Standalone CCD 34H is named (2R)-2-hydroxy-3-(4-hydroxyphenyl)propanoic
      acid. Its bond table maps C2-O4 as the alpha hydroxyl and C7-O3 as the phenolic
      hydroxyl; a CCD covalent-modification annotation links C2 to CYS SG. The full
      crystal includes that protein-ligand covalent connection. The component name
      or isolated CCD formula is not evidence that CloQ makes free phenyllactate,
      and it is not equated with the unmodified CHEBI:36242 substrate.
    evidence:
    - reference: https://files.rcsb.org/ligands/download/34H.cif
      evidence_type: DATABASE_ASSERTION
      notes: Chemical-component bonds, descriptors and CYS covalent-modification annotation.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Thiohemiketal source interpretation, PDF pp.75-76.
  - subject: 2xm5
    predicate: has_unassigned_density
    object: density
    notes: Despite a 5 mM 4-HPP soak, the source does not assign the acceptor-region
      density to 4-HPP or another ligand. Disorder/keto-enol exchange is suggested,
      not demonstrated. The observed Y233 displacement and R66 rotation do not locate
      the missing ligand or prove a different bound substrate pose. Absence of an
      assigned ligand is not absence of binding in solution.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: C215S density and Figure 3.17, PDF pp.74-76.
    - reference: https://files.rcsb.org/download/2XM5.cif
      evidence_type: DATABASE_ASSERTION
      notes: No 34H ligand in the deposited atom inventory.
  - subject: 2xlq
    predicate: shows
    object: barrel
    notes: Five repeated alpha-alpha-beta-beta units produce a ten-stranded antiparallel
      beta barrel surrounded by helices. The central cavity has polar and hydrophobic
      regions; the C-terminal region including helix 11 closes the lower end in the
      observed structure. This is not a TIM barrel or evidence that every substrate
      must use one experimentally tracked entry route.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Architecture and Figures 3.14-3.16, PDF pp.72-74.
    - reference: DOI:10.1016/j.jmb.2010.09.067
      evidence_type: PRIMARY_EXPERIMENT
      notes: PT-barrel architecture in inspected journal abstract.
  - subject: barrel
    predicate: motivates_hypothesis
    object: donor_model
    notes: No DMAPP, GPP or nonhydrolysable donor analogue was observed bound in these
      four deposits despite soaking/cocrystallization trials. The source schematic
      proposes K54, R66, K120, R229 and K279 as a positive diphosphate-binding region,
      with N172 and surrounding aromatic side chains contributing contacts/shielding.
      The putative K54 substitution for a metal charge and cation-pi shielding are
      hypotheses informed by homolog structures and mutagenesis, not observed CloQ
      donor contacts. Figure 3.19 is schematic, not a refined bound-donor model.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: CURATOR_INFERENCE
      notes: Failed donor-binding trials and hypothetical site, PDF pp.70-71,78-80.
  - subject: contacts
    predicate: motivates_hypothesis
    object: base_model
    notes: The source proposes E281 both activating the phenolic group and removing
      the proton from the aromatic sigma-complex. It explicitly treats the dual role
      as hypothetical because exact substrate positions are not secured. Severe E281G
      activity loss supports functional importance but does not independently prove
      either proton-transfer step or observe a carbocation intermediate.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: CURATOR_INFERENCE
      notes: Mechanistic interpretation, PDF p.80.
      snippet: rein hypothetisch
  - subject: 2xlq
    predicate: has_bounded_assembly_assignment
    object: oligomer
    notes: 2XLQ assembly 1 is author-assigned monomeric; assembly 2 is a PISA-generated
      tetramer. Both assignments remain visible and are not collapsed into a proven
      biological tetramer. The thesis DLS interpretation concerns prepared protein
      in solution; crystallographic packing and software assemblies answer different
      questions.
    evidence:
