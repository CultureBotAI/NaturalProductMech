  - subject: gene
    predicate: encodes_native_protein
    object: native
    notes: AF329398.1 cloQ/AAN65239.1 is CDS 31832..32806(+), 975 nt including stop.
      CDS-aware table-11 translation exactly matches the deposited protein and Q8GHB2,
      324 aa. UniProt taxon 149682 is subspecies-level; the owner/BGC strain taxon
      1352936 is DS 12.976, a resolution difference rather than a sequence mismatch.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF329398.1
      evidence_type: DATABASE_ASSERTION
      notes: cloQ CDS, coordinates and strain.
    - reference: https://www.uniprot.org/uniprotkb/Q8GHB2
      evidence_type: DATABASE_ASSERTION
      notes: Entry 49, sequence 1, annotation 2026-06-10; retrieved 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF329398.1
      evidence_type: CURATOR_INFERENCE
      notes: Exact CDS-aware/deposited/UniProt sequence comparison.
  - subject: native
    predicate: is_core_sequence_reference_for
    object: wt
    notes: The native protein is distinct from the recombinant WT comparator. The
      crystallized WT deposit contains GSH before the 324-aa native core after thrombin
      cleavage; this is not a native N terminus. The precise experimental aliquot
      used for each kinetic determination was not independently sequenced.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: WT preparation and GSH scar, PDF pp.68,72.
    - reference: https://files.rcsb.org/download/2XLQ.cif
      evidence_type: CURATOR_INFERENCE
      notes: Deposited 327-aa sequence and exact core comparison.
  - subject: parent
    predicate: was_expression_construct_for
    object: wt
    notes: The source uses the Keller pET28_CloQ construct, also written pET28a_CloQ
      in the plasmid table. His-tag removal is demonstrated for the crystallization
      preparation; neither construct spelling identifies a separate native protein.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Plasmid table and WT expression, PDF pp.29-30,68.
  - subject: parent
    predicate: was_reported_template_for
    object: mutagenesis
    notes: QuikChange-style PCR followed by DpnI digestion, E. coli transformation
      and reported plasmid sequencing generated the panel. Most constructs use pET28_CloQ;
      pUM34 has conflicting pUM32/pUM33 template descriptions, retained on its own
      edge. Literal-primer models are reconstructed native cores, not verified complete
      experimental plasmids.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Plasmids, primers, methods and results, PDF pp.29-31,41,69.
  - subject: mutagenesis
    predicate: generated_expression_construct_for
    object: c215s
    notes: pUM28 is the reported C215S expression construct. Forward primer 5-prime
      ATGCCCGAGGACTACTCCGTCGCCATCACCCTC; reverse primer 5-prime GAGGGTGATGGCGACGGAGTAGTCCTCGGGCAT.
      The pair is exactly reverse-complementary and has a unique near-match at the
      expected native-CDS position. The literal native-CDS primer model gives the
      intended C215S change and otherwise preserves the native core.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
