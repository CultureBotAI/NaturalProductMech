    predicate: generated_expression_construct_for
    object: e290stop
    notes: pUM44 is the reported E290stop expression construct. Forward primer 5-prime
      CCGGCAACATGGCCTGAATCCTGGCCGGCTGG; reverse primer 5-prime CCAGCCGGCCAGGATTCAGGCCATGTTGCCGG.
      The pair is exactly reverse-complementary and has a unique near-match at the
      expected native-CDS position. The literal primer introduces a stop at native
      codon 290, predicting residues 1-289 and loss of 35 of the 324 native residues.
      Results prose instead reports removal of 37 residues. This conflict is not resolved
      by assuming the actual sample sequence equals the model; tag/scar residues are
      separate.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
