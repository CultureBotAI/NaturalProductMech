graph:
  graph_id: clorobiocin-cloq-variant-constructs-and-preparations
  scope: BIOSYNTHESIS
  description: 'Eleven CloQ engineered proteins from Metzger 2010, with native identity,
    literal-primer reconstructions, preparation measurements and limited folding controls
    (review #553). The native reaction is already curated and is not duplicated. Q8GHB2
    denotes the native 324-aa protein, not a mutant, tag-bearing precursor or GSH-scar
    preparation. The thesis reports sequencing, but complete experimental plasmids
    were not independently obtained. All thesis page locators are PDF pages, twelve
    above printed pages.'
