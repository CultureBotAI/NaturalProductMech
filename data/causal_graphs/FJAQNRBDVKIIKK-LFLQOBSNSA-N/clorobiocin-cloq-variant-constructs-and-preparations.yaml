    predicate: has_reported_preparation_in
    object: purification
    notes: Table 3.2 reports 0.2 mg purified protein per L culture and final concentration
      2.0 mg/mL for pUM44. A280 quantification used 1.3 L/g/cm. These are recovered-protein
