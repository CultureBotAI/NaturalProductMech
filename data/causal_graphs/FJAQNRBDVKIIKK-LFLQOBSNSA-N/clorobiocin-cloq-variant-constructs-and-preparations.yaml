  - subject: wt
    predicate: has_reported_preparation_in
    object: purification
    notes: WT crystallization preparation yielded 8.3 mg/L culture at 8.3 mg/mL. SDS-PAGE
      shows induction, soluble protein, tag cleavage and final material (Figure 3.10,
      including a 15-ug final lane). A280 coefficients were 1.2 L/g/cm with His tag
      and 1.3 without it. Trace impurities are described, not a quantified purity
