    predicate: is_native_sequence_reference_for_variant
    object: mutant
    notes: Native residue383 is leucine. Modeling the visually checked mutagenic primer
      against AF329398.1 changes internal CDS nucleotide1147 T to A (TTG to ATG),
      producing L383M only in the core. This is distinct from the initiation recoding
      used for expression. The source reports full-gene sequencing and transfer to
      pET28a; no complete historical mutant plasmid was independently obtained. The
      mutant has no exact-native accession assignment.
    evidence:
