  - subject: wt
    predicate: was_measured_in
    object: kinetics
    notes: The same PPi/NADH method, with 2.5 mM MgCl2 at 30 C, was used for WT kinetic
      fits after checking enzyme-dose linearity. Aromatic-substrate series held DMAPP
      at 0.5 mM; donor series held 4-HPP at 0.5 mM. Table 3.4/Figure 3.21 give fitted
      Km, turnover and efficiencies, using GraphPad Prism 5.01. The printed +/- values
      lack a stated error definition in the inspected relevant methods/results, and
      no replicate count is assigned. Fits at a fixed cosubstrate concentration are
      not independent binding constants or kinetic measurements for every mutant.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Kinetic methods, Table 3.4 and Figure 3.21, PDF pp.48-49,83-84.
  - subject: kinetics
    predicate: has_substrate_conditioned_fit_for
    object: hpp
    notes: For 4-HPP, reported Km is 16 +/- 3.9 uM, kcat 0.159 s^-1 and kcat/Km 10000
      M^-1 s^-1. The fixed cosubstrate is DMAPP at 0.5 mM; enzyme load is 2 ug in
      200 uL. Values are transcribed from Table 3.4, including its rounding; uncertainty
      type and independent replication are unspecified. They are WT-preparation values,
      not intrinsic constants assigned to every engineered protein.
    evidence:
