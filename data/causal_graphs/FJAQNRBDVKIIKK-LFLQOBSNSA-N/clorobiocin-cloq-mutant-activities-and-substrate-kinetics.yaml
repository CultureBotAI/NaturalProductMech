  edges:
  - subject: wt
    predicate: was_reference_preparation_in
    object: assay
    notes: The coupled assay used 200 uL, 75 mM Tris-HCl pH 7.5, 2.5 mM MgCl2, 0.5
      mM 4-HPP and 0.5 mM DMAPP or GPP, plus 66.7 uL PPi reagent prepared in 4 mL
      water. Following five minutes preincubation at 30 C, enzyme started a 15-minute
      NADH trace at 340 nm. Four coupling reactions oxidize two mol NADH per mol PPi,
      with extinction coefficient 6.22 mM^-1 cm^-1. The reported mutant loads vary
      from 5 to 50 ug according to activity; individual loads and an exact WT panel
      load are not assigned here. PPi-coupled rates are not direct structural identification
      of every product. MgCl2 was supplied despite CloQ being characterized as Mg-independent
      elsewhere.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Coupled assay and Figure 3.20, PDF pp.48-49,81.
  - subject: c215s
    predicate: has_reported_activity_in
    object: assay
    notes: Source text reports 36% increased activity over WT with 4-HPP/DMAPP; the
      bar plot is consistent with retained or increased activity. GPP was not separately
      tested for this mutant in Figure 3.20. Figure 3.20 has no supplied error-bar
      definition or replicate count; no exact bar height, mutant Km/kcat, or in-vivo
      flux is inferred.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
