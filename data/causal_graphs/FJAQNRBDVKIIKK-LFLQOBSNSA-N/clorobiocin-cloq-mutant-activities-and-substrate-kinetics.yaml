  - subject: wt
    predicate: was_tested_in
    object: hplc
    notes: Separate endpoint assays used 100 uL, 75 mM Tris-HCl pH 7.5, 2.5 mM MgCl2,
      0.5 mM aromatic acceptor and 0.5 mM donor, 2 or 16 ug enzyme, ten minutes at
      30 C, then 2 uL formic acid. Products were extracted with 500 uL ethyl acetate.
      HPLC monitored 275 nm for keto-4-HPP/tyrosine and 300 nm for enol-4-HPP/p-coumarate.
      Tautomerism complicated HPLC quantitation, motivating the separate coupled kinetic
      assay. Methods do not establish an identical product-validation panel for each
      mutant.
    evidence:
