  - subject: kinetics
    predicate: does_not_resolve
    object: tautomer
    notes: L-tyrosine and p-coumarate were used as analogues of keto- and enol-like
      acceptors. Their low but nonzero efficiencies do not identify the physiological
      4-HPP tautomer used by CloQ. The source concludes this comparison did not establish
      a preference. Relative alternative-substrate efficiencies also do not measure
      intracellular substrate availability or flux.
    evidence:
