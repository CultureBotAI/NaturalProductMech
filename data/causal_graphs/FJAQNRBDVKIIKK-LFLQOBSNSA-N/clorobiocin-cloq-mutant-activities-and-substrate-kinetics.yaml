  scope: BIOSYNTHESIS
  description: 'CloQ WT and eleven mutant activity comparisons, with separate WT substrate-conditioned
    kinetic fits and endpoint product checks from Metzger 2010 (review #553). All
    measurements concern recombinant enzyme assays, not native clorobiocin production
    or each mutant binding a donor in a crystal. WT/variant preparations remain distinct
    from native Q8GHB2. PDF pages are twelve above printed pages.'
