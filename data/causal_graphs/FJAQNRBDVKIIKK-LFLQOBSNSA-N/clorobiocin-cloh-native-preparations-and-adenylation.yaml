      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed native CloH reference, 600 aa; entry102/sequence1, annotation2026-09-02.
        UniProt subspecies taxon149682 versus deposited DS12.976 strain taxon1352936.
    - reference: https://www.ncbi.nlm.nih.gov/protein/AAN65224.1
      evidence_type: DATABASE_ASSERTION
      notes: Independent GenPept sequence equals the complete deposited CDS translation
        and Q8GHC7.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF329398.1
      evidence_type: DATABASE_ASSERTION
      notes: Native CDS13390..15192(+),1803nt including stop. Table11 CDS-aware translation
        interprets TTG initiation as methionine; native internal residue383 is leucine.
