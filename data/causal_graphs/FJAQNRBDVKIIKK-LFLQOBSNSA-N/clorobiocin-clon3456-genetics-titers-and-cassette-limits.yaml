  - subject: cloN6
    predicate: is_native_reference_for_targeted_locus_in
    object: deleted
    notes: Native DS12.976 gene inactivation is distinct from the heterologous tag-insertion
      experiment. Westrich2003 primary abstract supports PCR targeting and product
      structures; the later thesis names the delta-cloN6-67 culture. Exact deletion
      endpoints are not invented.
    evidence:
    - reference: https://www.uniprot.org/uniprotkb/Q8GHB6
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed Q8GHB6, entry 73, sequence 1; annotation 2026-09-02; retrieved
        2026-10-05. Native reference, not a sequenced experimental fusion.
    - reference: DOI:10.1002/cbic.200300609
      evidence_type: PRIMARY_EXPERIMENT
      notes: Inspected PubMed-indexed primary abstract only; full journal methods
        not obtained.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49061/pdf/Diss_C.Anderle.pdf?isAllowed=y&sequence=1
