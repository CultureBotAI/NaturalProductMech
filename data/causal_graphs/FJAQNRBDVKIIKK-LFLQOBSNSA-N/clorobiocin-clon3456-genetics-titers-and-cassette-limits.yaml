    object: tagged
    notes: Double-joint PCR and lambda-RED recombination insert an N-terminal His6
      tag with aac(3)IV from pUG019. This cassette lacks FRT sites and oriT and was
      retained for selection, not excised. The source reports sequencing confirmation,
      but sequence files were not obtained.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49061/pdf/Diss_C.Anderle.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Anderle 2007 primary thesis, PDF pp.45,57-58,75,88; PDF pages are twelve
        above printed pages.
