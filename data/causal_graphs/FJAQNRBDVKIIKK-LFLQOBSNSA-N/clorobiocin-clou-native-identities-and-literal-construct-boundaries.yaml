      evidence_type: CURATOR_INFERENCE
      notes: Freitag 2006 primary thesis, PDF p.97; PDF pages are ten above printed
        pages.
  - subject: parent
    predicate: was_pcr_template_for
    object: rescue
    notes: Literal k-cloU-f GACCGGCGGTTTGGATCCCGTGA; k-cloU-r TTCGGACCTTCTAGACACGTGG.
      The1354-nt PCR model has BamHI/XbaI top-strand cuts1327nt apart, consistent
      with the reported approximate1.3-kb insert. It was cloned through pBluescript
      SK(-) pAF15 into pUWL201 pAF16 under constitutive ermE. Primer-introduced changes
      lie outside the CDS; complete experimental plasmids were not obtained.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
