  - subject: gu
    predicate: was_targeted_in
    object: replacement
    notes: 'Literal deletion primers: cloU-f GACCGGCGGTTTGCATCCCGTGAGGGGGAGGAAGAGTTGATTCCGGGGATCTCTAGATC;
      cloU-r TGGAACGGGATCACCGCAGCCGACACCGTGGCCACGTCAACTAGTCTGGAGCTGCTTC. Their unique39-nt
      native arms map36566..36604(+) and37900..37862(-), including the TTG start and
      TGA stop. These primers replace the intervening coding segment; the source shorthand
      entire ORF must not erase the retained ends.'
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.54,77,95; PDF pages are ten above
        printed pages.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF329398.1
      evidence_type: CURATOR_INFERENCE
      notes: Unique literal homology-arm matches.
  - subject: replacement
    predicate: was_excised_to_form
    object: deletion
    notes: XbaI/SpeI digestion and ligation removed the cassette. Apramycin-sensitive,
      kanamycin-resistant clones were screened. Removal was intended to avoid polar
      effects; intent alone is not measured downstream expression.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.53,76-77,95-96; PDF pages are ten
        above printed pages.
  - subject: deletion
    predicate: has_reconstructed_junction
    object: scar
    notes: The literal-primer/XbaI-SpeI model retains TTGATTCCGGGGATCTCTAGTTGA:24
      nt including start/stop, predicting MIPGISS with CDS-aware initiation and a
      net1239-nt deletion from the1263-nt native CDS. This is a reconstructed in-frame
      remnant, not a sequenced mutant or observed seven-residue protein.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.54,76-77; PDF pages are ten above
        printed pages.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF329398.1
      evidence_type: CURATOR_INFERENCE
      notes: Independent compatible-end junction reconstruction.
