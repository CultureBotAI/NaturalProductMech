  edges:
  - subject: wt
    predicate: was_cultured_and_extracted_in
    object: assay
    notes: Source methods use a two-day YMG preculture at30 C/210rpm, two days in
      corn-starch medium at33 C/210rpm, then5mL into50mL distillers-solubles production
      medium in a500-mL flask for nine days at33 C/210rpm. The same protocol is specified
      for S. coelicolor cluster strains; these are not native-producer titers.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.58,96,100; PDF pages are ten above
        printed pages.
  - subject: wt
    predicate: had_reported_profile
    object: wt_readout
    notes: One intact-cluster comparator and five independent deletion isolates were
      reported as cultured. The printed titers lack clone-specific replicate values
      and uncertainty estimates; five genotyped isolates do not become five quantitative
      replicates for every value.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Freitag 2006 primary thesis, PDF pp.96-100; PDF pages are ten above printed
        pages.
  - subject: assay
    predicate: measured
    object: wt_readout
    notes: One-mL culture aliquots were acidified to pH4 and extracted twice with1mL
      ethyl acetate. Dried extracts were dissolved in200-500uL methanol;50-100uL was
      injected on RP18 at1mL/min with340-nm detection. Authentic clorobiocin was the
      stated standard. Distinct congener response factors and detection thresholds
      are not supplied.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48957/pdf/Dissertation_Anja_Freitag.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
