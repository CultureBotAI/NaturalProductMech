    notes: HPLC gives average12 mg/L versus54 mg/L for the intact-cluster control,
      about22% retained under these conditions. Text later uses equivalent ug/mL.
      Four individual integration mutants are described; no statistical equivalence,
      complete abolition or universal dispensability follows. Congener peaks remain
      distinct.
