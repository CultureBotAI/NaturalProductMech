        pages are ten lower. Retained primary thesis inspected; not an independently
        obtained full text of DOI:10.1099/mic.0.2006/002998-0.
  - subject: cloy
    predicate: is_native_reference_for_gene_targeted_in
    object: single
    notes: cloBG01 carries the clorobiocin cluster; cloMW16 is the reported in-frame
      scar derivative after removing the initial resistance cassette in cloMW15. This
      is neither a native DS12.976 knockout nor a verified scarless allele. The full
      historical construct sequence was not independently inspected.
