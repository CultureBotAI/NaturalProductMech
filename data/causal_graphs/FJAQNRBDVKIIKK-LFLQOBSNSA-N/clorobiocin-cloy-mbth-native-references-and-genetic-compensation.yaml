  - subject: control
    predicate: was_assayed_in
    object: assay
    notes: Heterologous M512 is described as an M145 derivative, not the natural clorobiocin
      producer. Culture extracts were analyzed by RP-HPLC at340nm with an authentic
      clorobiocin standard. No quantitative uncertainty or detection limit is invented.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49097/pdf/Dissertation_Wolpert.pdf?sequence=1
