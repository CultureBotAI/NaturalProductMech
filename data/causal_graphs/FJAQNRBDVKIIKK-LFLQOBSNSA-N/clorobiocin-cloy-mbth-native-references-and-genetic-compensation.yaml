    object: triple
    notes: Host CDA-ORFX/SCO3218 and cchK/SCO0489 are separately cassette-replaced
      in MW03 before introduction of cloMW16. Their host roles are not native clorobiocin-cluster
      membership. PCR supports targeted replacements, not whole-genome identity or
      absence of every possible compensating protein.
