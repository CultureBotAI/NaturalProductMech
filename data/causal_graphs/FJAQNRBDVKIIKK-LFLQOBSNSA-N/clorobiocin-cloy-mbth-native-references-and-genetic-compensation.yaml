    - reference: https://www.uniprot.org/uniprotkb/Q8GHC8
      evidence_type: DATABASE_ASSERTION
      notes: CloY unreviewed native reference. 71 aa; CDS12920..13135(+),216 nt including
        stop. DS12.976 strain taxon1352936 versus UniProt subspecies taxon149682;
        entry34/sequence1, annotation2025-02-05.
      retrieved_on: '2026-10-07'
    - reference: https://www.ncbi.nlm.nih.gov/protein/AAN65223.1
      evidence_type: DATABASE_ASSERTION
      notes: Independent GenPept sequence agrees with full CDS translation and UniProt.
      retrieved_on: '2026-10-07'
