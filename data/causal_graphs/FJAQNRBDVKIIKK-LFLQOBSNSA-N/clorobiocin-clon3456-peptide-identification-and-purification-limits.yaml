        printed pages.
  - subject: coverage
    predicate: has_boundary_limit
    object: limits
    notes: The source allows up to19 additional residues from the adjacent tryptic
      interval. No exact cleavage site, N/C-terminal boundary or unique intact mass
      is inferred. The five-matching-fragment identification threshold is relayed
      personal communication, not an independently obtained validation standard.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49061/pdf/Diss_C.Anderle.pdf?isAllowed=y&sequence=1
      evidence_type: CURATOR_INFERENCE
