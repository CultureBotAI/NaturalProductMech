  - subject: ms
    predicate: supported_sequence_identification
    object: coverage
    notes: Ten detected peptides map exactly to native Q8GHB6 and span68-555. Coverage
      is discontinuous and is not the complete proteoform sequence. The source calculates56.5kDa
      for68-555 and compares approximately60kDa on gel with65.7kDa for tagged full
      protein; it explicitly cannot locate the cleavage boundary.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49061/pdf/Diss_C.Anderle.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Anderle 2007 primary thesis, PDF pp.85-86,160; PDF pages are twelve above
        printed pages.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF329398.1
      evidence_type: CURATOR_INFERENCE
      notes: Independent matching of all ten literal detected peptides to the deposit.
  - subject: ms
    predicate: did_not_detect
    object: absent
    notes: Targeted spectral searches did not find native-position peptides 1-13 MFLLHAPSVYDFR;
      16-46 DDILFAYLSDSDSVNVTSVYEMYPIGWFSIK; 47-67 QQLADHDFDCQIVNIASLMLK. All three
      literal sequences match the native sequence. Nondetection does not prove exact
      loss of67 residues.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/49061/pdf/Diss_C.Anderle.pdf?isAllowed=y&sequence=1
