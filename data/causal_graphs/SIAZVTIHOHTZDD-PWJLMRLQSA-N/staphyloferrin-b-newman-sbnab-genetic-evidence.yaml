  scope: BIOSYNTHESIS
  description: Bounded genetic evidence for Newman SbnA and SbnB, with deliberately
    selected canonical references. Newman-derived delta-sfa background, not the owner's
    NCTC 8325 BGC stock. Insertional inactivation, not a clean deletion or an independently
    sequenced mutant. The paper reports absence of staphyloferrin B in mutant spent
    supernatants by ESI-MS in iron-limited medium without added transferrin; those
    spectra are data not shown. Growth and CAS readouts are not compound-specific
    concentration measurements. The neutral owner is the author-assigned compound
    anchor, not an independently verified protonation state, absolute stereopurity
    or ferric-complex assignment. No direct catalysis, physical SbnA-SbnB complex,
    exclusive pathway, producer/BGC, virulence or origin upgrade.
