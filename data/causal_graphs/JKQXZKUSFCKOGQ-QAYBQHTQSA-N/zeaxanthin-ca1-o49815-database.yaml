      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: The complete seven-exon CrtZ-2 CDS, join(17..436,786..845,945..1016,1133..1267,1426..1551,1737..1793,1964..2041),
        translates to ADH04291.1 and current UniProt O49815, all315aa. Native source
        is Capsicum annuum/taxon4072, cultivarValencia, fruit pericarp. The complete
        NM_001324855.1:1..948 CDS is nucleotide-identical after splicing and translates
        to NP_001311784.1 and the same canonical protein. Both use codon_start1 and
        standard table1 (no explicit transl_table qualifier). RefSeq is PROVISIONAL,
        derived from JQ031264.1; its cultivar is unstated and its processing annotations
        are propagated from UniProt, not independent evidence. This is reference identity,
        not shared assay-stock or construct identity.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/Y09225.1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: The original Y09225.1:25..972 CDS independently translates to CAA70427.1,315aa,
        with no source cultivar qualifier. It differs from canonical O49815 at positions211/212
        LL->FF,225 L->I,259 N->K,298 L->I and312 S->L, exactly the five UniProt sequence-conflict
        features covering six residues. No adjudication of sequencing error versus
        biological variation, and no transfer of a historical assay to the present
        canonical sequence. Predicted transit cleavage59..315 and the ten annotated
        H->A mutants are not assayed-construct mappings.
    - reference: https://www.ebi.ac.uk/chebi/CHEBI:27547
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: The inspected UniProt overall reaction cross-references CHEBI:17579 and
        CHEBI:27547. The same-day ChEBI255 cache receipt identifies neutral beta-carotene
