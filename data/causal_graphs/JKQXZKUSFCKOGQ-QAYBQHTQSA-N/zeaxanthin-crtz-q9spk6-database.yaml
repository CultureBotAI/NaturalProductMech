        with no strain qualifier; H.pluvialis is the entry synonym. The partial CDS
        <1..971 has codon_start3. Standard table1 translation (no explicit transl_table
        qualifier) of the reported frame yields the exact322aa deposited and UniProt
        fragment plus terminal stop. This does not recover the missing N-terminus
        or establish a full-length CDS. Predicted transit cleavage at68/69 and membrane
        topology do not define an independently verified mature enzyme or assay construct.
