        CHEBI:27547. The same-day ChEBI255 cache receipt identifies neutral beta-carotene
        as OENHQHLEOONYIE-JLTXGRSLSA-N and stereospecified neutral zeaxanthin as JKQXZKUSFCKOGQ-QAYBQHTQSA-N,
        the exact owner. This is annotation-to-owner correspondence, not an independent
        assay stereochemical measurement. No meso-zeaxanthin, other geometrical isomer,
        astaxanthin or glycoside transfer.
