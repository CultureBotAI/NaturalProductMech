  graph_id: trypacidin-native-catalytic-references
  scope: BIOSYNTHESIS
  description: 'Catalytic chemistry component. Across this owner''s two components:
    Sequence-verified native Af293 references with explicitly database-level trypacidin
    roles, not verified experimental alleles. Ten enzyme annotations and two regulators
    are represented. TpcB/G/I catalytic roles remain similarity-derived. Named intermediates
    are not exact chemical-species groundings or balanced equations. No atrochrysone-to-emodin-anthrone
    connector is asserted, so this is not a complete reconstituted pathway. The database
    spelling monomethylsulfochrin and the product''s unspecified stereochemistry remain
    unresolved. Genetic loss and impairment are distinguished; no direct promoter
    binding, physical complex, bioactivity target, virulence mechanism, universal
    essentiality or producer-grade upgrade is asserted. TpcF is held without a catalytic
    assignment.'
