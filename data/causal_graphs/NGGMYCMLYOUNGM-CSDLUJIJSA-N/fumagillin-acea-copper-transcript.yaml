  scope: BIOSYNTHESIS
  description: 'Partial fumagillin regulation view: AceA deletion and the reported
    Afu8g00430 transcript difference under copper stress. The independently verified
    Af293 protein is a separate reference, not the experimental allele. This paper
    measures RNA, not enzyme catalysis. Only the shared Figure2/Table S11 locus claim
    is added; broader cluster labels and other loci are not generalized. No direct
    promoter binding, protein-abundance measurement, product yield, universal essentiality
    or complete pathway is asserted. Strain and growth-time wording differences remain
    explicit in evidence.'
