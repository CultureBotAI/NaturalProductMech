    object: lower_430
    evidence:
    - reference: DOI:10.1080/21505594.2021.1958057
      evidence_type: PRIMARY_EXPERIMENT
      retrieved_on: '2026-10-12'
      notes: Figure2a/c explicitly compares WT(+Cu)/deltaaceA(+Cu); Afu8g00430 is
        higher in WT, also listed in the upregulated group in Table S11A. Thus the
        deletion strain has lower transcript abundance under this comparison. RNAseq,
        three samples per group, MM liquid, 37 C, 200 uM Cu for1 h. Methods specifies24
