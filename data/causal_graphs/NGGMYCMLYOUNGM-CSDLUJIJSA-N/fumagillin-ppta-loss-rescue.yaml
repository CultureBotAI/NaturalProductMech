graph:
  graph_id: fumagillin-ppta-loss-rescue
  scope: BIOSYNTHESIS
  description: 'Partial fumagillin biosynthesis view: pptA genetic deletion and native-locus
    rescue in CEA10-derived A1160p+, with the bounded LC-MS detection phenotype. A
    separately sequence-verified CEA10/A1163 reference is not equated to the experimental
    allele. No direct PptA-to-FmaPKS priming, catalytic substrate/product step, protein-abundance
    measurement, universal essentiality or fumagillin-mediated virulence mechanism
    is asserted; the paper''s recombinant activity assay uses AarA.'
