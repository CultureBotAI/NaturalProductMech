graph:
  graph_id: fumagillin-ppza-iron-depletion
  scope: BIOSYNTHESIS
  description: 'Partial fumagillin genetic-regulation view: ppzA deletion and complementation
    under iron depletion. The independently sequence-verified CEA10/A1163 reference
    is not equated to the experimental CEA17 allele. Preserve the unspecified Figure4
    timepoint, non-specific metal chelation and qualitative LC-MS scope. No direct
    phosphatase substrate, complete pathway, iron-repletion reduction, universal essentiality
    or fumagillin-mediated virulence is asserted.'
