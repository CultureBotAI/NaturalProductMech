graph:
  graph_id: fumagillin-fumr-vea-laea-regulation
  scope: BIOSYNTHESIS
  description: Partial fumagillin genetic-regulation graph from DOI10.1371/journal.pone.0077147.
    Separate perturbation components retain the measured outcomes; unproven mediation
    links between them are intentionally omitted. Separate Af293 protein references,
    accession-unresolved experimental proteins, genes, perturbations and measured
    outcomes. CEA10 controls the VeA series; TSD51.1 controls CEA17ku80-derived fumR/laeA
    deletions. Both veA deletion and overexpression decrease expression and product
    signal. FumR deletion lowers the nine assayed cluster transcripts and makes fumagillin
    undetectable at the tested times. LaeA edges concern transcripts only. No direct
    promoter binding, protein-abundance measurement, velvet-complex assembly, universal
    essentiality, complete pathway or exact experimental-allele mapping is asserted.
