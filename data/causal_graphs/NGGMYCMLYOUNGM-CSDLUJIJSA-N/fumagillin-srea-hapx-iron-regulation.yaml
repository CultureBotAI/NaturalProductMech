  scope: BIOSYNTHESIS
  description: 'Partial fumagillin genetic-regulation view: SreA and HapX deletion
    outcomes at specified iron concentrations. Separate perturbation components intentionally
    omit unproven mediation links. Af293 protein references are not equated to experimental
    ATCC46645 alleles. HPLC-PDA peak areas are dry-weight normalized and compared
    with WT at each iron condition. No direct promoter binding, protein-abundance
    measurement, universal essentiality, complete pathway or rescue claim is asserted.'
