  scope: BIOACTIVITY
  description: Deposited kojic-acid associations with two distinct TyrBm constructs,
    grounded to native B2ZB02 without assigning the reference isolate VS1 to an unspecified
    structural source strain. DOI:10.1016/j.jmb.2010.10.048 was tool-inaccessible.
    A partial read of DOI:10.1038/srep34993 stopped at an identity redirect; no alternate
    retrieval or quantitative functional experiment is adopted. Structural association
    is not a direct binding assay, measured inhibition, affinity or inhibition mode,
    physiological metal stoichiometry, cellular phenotype, or a producer/BGC claim.
    Protein engineering here does not change the natural-product origin classification.
