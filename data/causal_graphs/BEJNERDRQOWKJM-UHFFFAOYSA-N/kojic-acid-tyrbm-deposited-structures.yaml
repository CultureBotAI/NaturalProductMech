    - reference: https://files.rcsb.org/validation/view/3nq1_full_validation.pdf
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-09'
      notes: 'Report dated 2026-03-05, inspected pages 4, 20-21 and 23-24. Each KOJ
