  edges:
  - subject: kojic_acid
    predicate: has_deposited_structural_association_with
    object: tyrbm_his6
    notes: Construct-specific association in PDB:3NQ1; canonical UniProt grounds the
      reference protein, not an assertion that this is the intact native protein.
      The deposited title is quoted as metadata, not independently verified inhibition
      or active-site chemistry. Ligand geometry and density-fit limitations are retained
      in the validation evidence.
    evidence:
    - reference: https://www.rcsb.org/structure/3NQ1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: Independent curator sequence/model comparison using the deposited reference;
        quoted titles and source metadata remain attributed to the deposit. PDB revision
        1.3, X-ray resolution 2.30 angstrom. 303-aa deposited construct matching native
        positions 1..297 plus six C-terminal histidines. Modeled author positions
        A/B 4..286 (283 per chain); the His6 tag is unmodeled. Every modeled polymer
        residue matches its audited construct; side-chain completeness is not established.
        Native source Bacillus megaterium, now Priestia megaterium, taxon 1404; PDB
        source strain unspecified, not assigned VS1. Expression host E. coli taxon
        562, BL21(DE3), plasmid pET9d. KOJ A1351/B1351 (label F/Q); four Cu and thirteen
        Zn ions deposited. Each KOJ has ten heavy atoms at modeled occupancy 1 without
        alternates. Metal inventory does not establish physiological stoichiometry
        or coordination.
      snippet: Crystal Structure of Tyrosinase from Bacillus megaterium in complex
        with inhibitor kojic acid
    - reference: https://www.uniprot.org/uniprotkb/B2ZB02
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-09'
      notes: Unreviewed entry version 78, sequence version 1, Priestia megaterium
        taxon 1404, 297 aa. No kojic-acid inhibition annotation is present in the
        inspected entry. The structural construct is grounded by exact sequence correspondence,
        not by assuming a reviewed status or a convenient tyrosinase homolog.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ACC86108.1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: Independent curator sequence/model comparison using the deposited reference;
        quoted titles and source metadata remain attributed to the deposit. Complete
        297-aa native reference, deposited Bacillus megaterium isolate VS1, taxon
        1404, matching B2ZB02 exactly. The native isolate is not transferred to the
        unspecified PDB source strain or identified as the historical assay stock.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/EU627691.1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: The complete 894-nt CDS 1..894, codon_start 1/table 11, independently
        translates to 297 aa identical to ACC86108.1 and B2ZB02. The structural tag/truncation
        is separately resolved against this reference. No complete expression-plasmid
