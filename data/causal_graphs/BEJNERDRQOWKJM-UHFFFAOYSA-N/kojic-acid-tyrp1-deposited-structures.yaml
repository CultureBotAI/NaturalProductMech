graph:
  graph_id: kojic-acid-tyrp1-deposited-structures
  scope: BIOACTIVITY
  description: Deposited kojic-acid associations with two distinct engineered fragments
    of human TYRP1, not human tyrosinase TYR. Canonical P17643 grounds reference identity
    while node labels and evidence retain truncation and mutation differences. DOI:10.1002/anie.201704616
    was tool-inaccessible; no alternate retrieval or primary functional experiment
    is adopted. Structural association is not a direct binding assay, measured inhibition,
    affinity or inhibition mode, physiological metal stoichiometry, cellular phenotype,
    or a producer/BGC claim. Protein engineering here does not change the natural-product
    origin classification.
  nodes:
  - node_id: kojic_acid
    label: kojic acid
    node_type: COMPOUND
    identifier: CHEBI:43572
    grounding_status: GROUNDED
  - node_id: tyrp1_wt_fragment
    label: Human TYRP1 25..470 (5M8M; wild-type sequence)
    node_type: PROTEIN
    identifier: UniProtKB:P17643
    grounding_status: GROUNDED
  - node_id: tyrp1_mutant_fragment
    label: Human TYRP1 25..470 Y362F/R374S/T391V (5M8Q)
    node_type: PROTEIN
    identifier: UniProtKB:P17643
    grounding_status: GROUNDED
  edges:
  - subject: kojic_acid
    predicate: has_deposited_structural_association_with
    object: tyrp1_wt_fragment
    notes: Construct-specific association in PDB:5M8M; canonical UniProt grounds the
      reference protein, not an assertion that this is the intact native protein.
      The deposited title is quoted as metadata, not independently verified inhibition
      or active-site chemistry. Ligand geometry and density-fit limitations are retained
      in the validation evidence.
    evidence:
    - reference: https://www.rcsb.org/structure/5M8M
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: Independent curator sequence/model comparison using the deposited reference;
        quoted titles and source metadata remain attributed to the deposit. PDB revision
        3.0, X-ray resolution 2.65 angstrom. Deposited 446-aa wild-type-sequence fragment
        of human TYRP1 positions 25..470; each modeled polymer residue in chains A/B/C/D
        matches that construct, including all 446 residue positions, not necessarily
        every side-chain atom. Native source is Homo sapiens taxon 9606; expression
        host Spodoptera frugiperda taxon 7108, cell line/vector unspecified. KOJ copies
        at author A503/B504/C503/D504 (label chains AA/EA/HA/LA), each ten heavy atoms
        at modeled occupancy 1 without alternates. Nine deposited Zn ions are an inventory,
        not physiological stoichiometry. Four deposited monomeric assemblies do not
        establish a tetramer.
      snippet: Crystal structure of human tyrosinase related protein 1 in complex
        with kojic acid
    - reference: https://www.uniprot.org/uniprotkb/P17643
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-09'
      notes: Reviewed TYRP1 entry version 224, sequence version 2, Homo sapiens taxon
        9606, 537-aa precursor. TYRP1 is not TYR/P14679. UniProt cautions that DHICA
        oxidase activity is controversial and metal-dependent, absent with Zn in the
        cited annotation. No kojic-acid inhibition annotation is adopted. The graph
        uses PROTEIN, not a claim of active Zn-loaded enzyme.
    - reference: https://www.ncbi.nlm.nih.gov/protein/AAH52608.1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: Independent curator sequence/model comparison using the deposited reference;
        quoted titles and source metadata remain attributed to the deposit. Complete
        537-aa human reference; clone MGC:59834 IMAGE:6258285, skin melanoma/melanotic
        tissue. Sequence agrees with P17643, unlike older conflicting references.
        DH10B-R/pOTB7 is cloning metadata, not the crystallographic expression host
        or a kojic-acid cellular assay.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/BC052608.1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: The 2628-nt mRNA CDS 98..1711, codon_start 1/default table 1, independently
        translates to 537 aa identical to AAH52608.1 and P17643. Fragment boundaries
        and any substitutions are separately resolved against this reference; no full
        expression plasmid or historical assay-stock identity is established.
    - reference: https://data.rcsb.org/rest/v1/core/chemcomp/KOJ
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-09'
      notes: CCD KOJ has neutral charge, C6H6O4, no chiral atoms and the same StandardInChI
        and InChIKey as CHEBI:43572. This establishes deposited component identity,
        not protonation or coordination in the metal complex.
    - reference: https://files.rcsb.org/validation/view/5m8m_full_validation.pdf
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-09'
      notes: Report dated 2026-03-05, inspected ligand sections on pages 48-50 and
        70. All four KOJ copies have bond-length and bond-angle outliers; A/D torsion
        outliers; D has one short contact. KOJ A503/B504/C503/D504 RSCC/RSR are 0.93/0.10,
        0.88/0.13, 0.89/0.13, 0.85/0.14. Reported ligand geometry/density-fit caveats
        remain unresolved; no independent map interpretation, distance/contact calculation,
        protonation, refinement, full side-chain or whole-model quality audit was
        performed.
  - subject: kojic_acid
    predicate: has_deposited_structural_association_with
