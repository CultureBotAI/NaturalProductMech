definition: An octahydronaphthalene that is 2,4,5,7-tetramethyloctahydronaphthalen-1(2<em>H</em>)-one
  which is substituted by hydroxy groups at positions 2 and 7, a (2<i>R</i>)-1-hydroxybutan-2-yl
  group at position 3, and a (2<i>Z</i>)-3-hydroxyprop-2-enoyl group at position 4
  (the 2<i>S</i>,3<i>R</i>,4<i>R</i>,4a<i>S</i>,5<i>R</i>,7<i>R</i>,8a<i>S</i> stereoisomer).
  Isolated from the endophytic fungus <em>Stemphylium botryosum</em>, it is the causal
  agent of leaf spot and foliage blight disease in tomatoes. Its phytotoxcity is at
  least 200 times greater than that of stemphyloxin II. It shows high affinity for
  Fe<small><sup>3+</small></sup> (but not Fe<small><sup>2+</small></sup>) ions.
