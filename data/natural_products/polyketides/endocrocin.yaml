    notes: Neutral C16H10O7; SMILES, InChI and InChIKey agree, with no stereocenters.
      Representation consistency does not resolve experimental strain or the shared-structure
      question.
- discussion_id: curator-endocrocin-global-regulator-limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Which experimental alleles, conditions and endocrocin-specific effects support
    the global-regulator annotations?
  rationale: Reference sequence identity does not resolve experimental context or
    the direction and intermediate mechanism of CsdA/LaeB regulation of endocrocin.
  notes: This addition adopts LaeA/Q4WRY5, CsdA/Q4WE89 and LaeB/Q4WUK4 as native Af293
    references at DATABASE_ASSERTION level, superseding only the earlier discussion
    statement that regulatory hits were not yet adopted. All earlier Enc claims and
    source-strain questions remain unchanged. LaeA uses canonical EAL90797.1, not
    the unexamined ALT_SEQ AAR01218.1 with a gene-model warning; its transcript-level
    protein-existence flag is retained. LaeA deletion supports reduction, not complete
    loss or direct promoter binding. CsdA/LaeB function annotations explicitly name
    endocrocin, but no endocrocin-specific sign, fold change, SebA/fmqA-E route or
    motif-specific splicing mechanism is asserted. Their physical interaction is not
    represented as an endocrocin-specific complex. Primary access to DOI:10.1128/AEM.07710-11
    and DOI:10.1002/advs.202519021 remains stopped; no alternate retrieval was attempted.
    Indexed excerpts are not complete primary methods. Native references do not identify
    assayed strains or constructs; previously reported CEA17 delta-nkuB context is
    not equated with Af293. All source-owned fields, the separate Claviceps evidence,
    prior graphs/discussions/history and SEEDED status are preserved. This is not
    a full-record REVIEWED sign-off.
