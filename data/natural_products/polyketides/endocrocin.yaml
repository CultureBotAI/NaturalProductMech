      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-11'
      snippet: Abolishes the production of endocrocin
      notes: 'Reviewed UniProtKB/Swiss-Prot disruption-phenotype annotation, entry
        version 121, sequence version 1, gene encA, AFUA_4G00210, 1775 aa, NCBITaxon:330879.
        The disruption annotation cites PMID22492455 and PMID23592999. The exact stoichiometric
