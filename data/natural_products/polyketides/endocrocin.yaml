  scope: BIOSYNTHESIS
  description: Database-annotated endocrocin genetic associations with sequence-verified
    Af293 EncA/B/C/D reference proteins. UniProt reports loss after encA/B/C disruption
    and increased production after encD disruption. These are selected native references,
    not verified experimental alleles. Primary methods and the experimental-strain
    mapping remain unresolved; effects are not universal requirements across conditions
    or alternative pathways. No complete reaction sequence, direct regulation, protein
    complex, bioactivity target or source-grade upgrade is asserted.
