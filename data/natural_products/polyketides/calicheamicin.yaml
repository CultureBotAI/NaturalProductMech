      notes: MITE0000005 is active, assigns inferred CoA- and 4'-phosphopantetheine-bound
        orsellinic acid derivative iodination reactions to CalO3, lists flavin mononucleotide
        as the organic cofactor, and links CalO3 to UniProtKB:Q8KND5, GenPept AAM70353.1,
        and MIBiG BGC0000033.
    - reference: DOI:10.1002/prot.22131
      evidence_type: PRIMARY_EXPERIMENT
      notes: McCoy et al. structurally characterized the downstream CalO2 P450 and
        proposed that CalO3-catalyzed iodination may precede the CalO2 step on a CoA-
        or ACP-bound substrate; this supports the reaction placement as an inference,
        not a direct CalO3 assay.
