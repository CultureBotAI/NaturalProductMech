        echinospora calicheamicin biosynthetic gene cluster and links the CDS to MITE0000005
        at 100% identity.
    - reference: https://www.uniprot.org/uniprotkb/Q8KND5
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: UniProtKB:Q8KND5 resolves as a 420 aa Micromonospora echinospora calO3/CalO3
