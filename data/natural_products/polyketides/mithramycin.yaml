    node_type: PRECURSOR
    grounding_status: UNGROUNDED
  edges:
  - subject: 4_dpmc
    predicate: is 4-O-methylated by
    object: mtmmi
    notes: MtmMI transfers a SAM-derived methyl group to the C-4 hydroxyl of 4-DPMC
      in the mithramycin polyketide pathway.
    evidence:
    - reference: DOI:10.1074/jbc.275.5.3065
      evidence_type: PRIMARY_EXPERIMENT
      snippet: transfer of tritium from [(3)H]S-adenosylmethionine into 4-DPMC
      notes: Lozano et al. insertionally inactivated mtmMI and mtmMII and assayed
        Streptomyces lividans extracts expressing each gene. Extracts from MJM1 expressing
        mtmMI transferred tritium from [(3)H]S-adenosylmethionine into 4-DPMC, supporting
        MtmMI as the SAM-dependent 4-O-methyltransferase that converts 4-DPMC toward
        premithramycinone.
    - reference: https://mite.lisc.univie.ac.at/repository/MITE0000014
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: MITE0000014 is active and links MtmMI to UniProtKB:Q194P7, GenPept CAK50791.1,
        MIBiG BGC0000247, SAM and C-4-O methylation of 4-DPMC to PMC in the mithramycin
        pathway.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0000247.5/BGC0000247.gbk
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: MIBiG BGC0000247.5 places mtmMI/CAK50791.1 inside the active Streptomyces
