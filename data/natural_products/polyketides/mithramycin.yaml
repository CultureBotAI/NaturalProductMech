biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q194Q1
  enzyme_label: MtmW ketoreductase
  notes: MtmW reduces the MtmOIV-derived mithramycin DK side-chain keto group to iso-mithramycin.
    Iso-mithramycin then nonenzymatically isomerizes to CHEBI:31856 mithramycin in
    a Mg2+-catalyzed reaction, so this partial enzymatic step does not set product
    to the final stereoisomer.
  evidence:
  - reference: DOI:10.1002/anie.201910241
    evidence_type: PRIMARY_EXPERIMENT
    snippet: MtmOIV and MtmW catalyze the final two reactions
    notes: 'Wheeler et al. showed that MtmOIV and MtmW catalyze the final two enzymatic
      mithramycin steps: Baeyer-Villiger opening of premithramycin B to mithramycin
      DK followed by MtmW reduction to iso-mithramycin, which then undergoes Mg2+-catalyzed
      nonenzymatic isomerization to mithramycin.'
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000017
    evidence_type: DATABASE_ASSERTION
    snippet: In vitro assay
    retrieved_on: '2026-10-01'
    notes: MITE0000017 is an active MtmW entry for UniProtKB:Q194Q1, GenPept CAK50787.1
      and MIBiG BGC0000247. It records NADP-dependent side-chain reduction as a non-intermediate
      in vitro reaction; the example product SMILES shares the CFCUWKMKBJTWLW connectivity
      layer with CHEBI:31856.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/X89899.2
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="CAK50787.1"
    retrieved_on: '2026-10-01'
    notes: GenBank X89899.2 is the Streptomyces argillaceus ATCC 12956 mithramycin
      cluster sequence and maps mtmW to CAK50787.1.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000247.5/BGC0000247.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="CAK50787.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0000247.5 places mtmW/CAK50787.1 inside the active Streptomyces
      argillaceus mithramycin cluster.
  - reference: https://www.uniprot.org/uniprotkb/Q194Q1
    evidence_type: DATABASE_ASSERTION
    snippet: GN=mtmW
    retrieved_on: '2026-10-01'
    notes: Current unreviewed UniProtKB:Q194Q1 resolves as Streptomyces argillaceus
      MtmW putative side chain reductase, cross-references EMBL X89899 protein CAK50787.1
      and PDB structures 6OVQ, 6OVX and 6OW0, and is sequence-identical to GenPept
      CAK50787.1.
