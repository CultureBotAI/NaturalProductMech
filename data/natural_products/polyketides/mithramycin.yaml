- graph_id: mithramycin-mtmmi-o-methylation
  scope: BIOSYNTHESIS
  description: Streptomyces argillaceus MtmMI-catalyzed SAM-dependent 4-O-methylation
    of 4-DPMC to premithramycinone in mithramycin biosynthesis.
  nodes:
