- discussion_id: curator-calcimycin-reference-and-experiment-boundaries
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#calcimycin-caln1-calb2-locus-disruption
  prompt: Can exact experimental sequences and individual protein functions resolve
    the remaining calcimycin reference, locus and construct boundaries?
  rationale: Native reference identity is secure, but the paper-to-deposit aliases
    remain explicit inferences and the calN1/calB2 disruptions do not exclude polar
    effects. Do not transfer the calN2 complementation result to these two loci.
  evidence:
  - reference: DOI:10.1128/AAC.01130-10
    supports: PARTIAL
    evidence_source: Inspected 2011 primary study
    explanation: Methods, Table 3 and Figures 1, 4-6 distinguish chemical forms, native
      gene assignments, cassette-disruption phenotypes and the calN2-only rescue.
      Table 3 lists CalN2 as 495 aa and CalB1 as 534 aa; the deposit gives 494 and
      535 aa, respectively. Neither mismatch is silently repaired.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/HM452329.1
    supports: PARTIAL
    evidence_source: Native NRRL 3882 sequence deposit
    explanation: DNA, CDS, GenPept and UniProt agree for SchN1/SchB2; other source
      annotations and later assayed constructs still need claim-specific review.
  - reference: https://www.rcsb.org/structure/7WVZ
    supports: PARTIAL
    evidence_source: Independent native sequence and deposited-coordinate audit
    explanation: Full-native CalA3 A0A2N9BJK0/SOR83529.1 is1727aa; legacy AEH42487.1/F8QZR7
      equals its residues110-1727. Deposited7WVZ adds AAALEHHHHHH; chainA models1-1719
      and chainB9-1719. This resolves native/deposited-construct numbering, not functional
      assays.
  notes: 'No catalytic pathway step or molecular target added. CalN2/CalB1 length
    discrepancies are retained for follow-up. The 2023 CalA3 paper DOI:10.1038/s41467-023-36989-w
    was only partly accessible; a residue label beyond the 1618-aa native SchA3 reference
    requires construct resolution. The 2017 CalR3 paper DOI:10.3389/fmicb.2017.02371
    was read from previously retrieved XML, but its figures and primer supplement
    remain uninspected after a browser challenge. Its proposed CalT export and small-molecule
    interpretations are not adopted. Preserve source-owned grades, chemical identity,
    natural origin and SEEDED status. Follow-up identity resolution: the CalA3 numbering
    question above is now resolved at native-reference and deposited7WVZ-construct
    level; full-nativeR1718 maps to legacyR1609. The held 2023 paper methods and functional
    assignments remain unadopted. Issue814 also retains exact cezomycin stereochemical
    grounding and other assay/construct questions.'
