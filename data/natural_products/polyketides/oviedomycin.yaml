definition: A member of the class of tetraphenes that is 1,4,7,12-tetrahydrotetraphene
  substituted by oxo groups at positions 1, 4, 7, and 12, by hydroxy groups at positions
  2, 6 and 8, and by a methyl group at position 3. It is a natural product found in
  Streptomyces antibioticus ATCC 11891 which exhibits cytotoxicity against A549 human
  lung cancer cells, HepG2 liver cancer cells, and MCF-7 breast cancer cells.
