    grounding_status: GROUNDED
  edges:
  - subject: ssfm4_c_methylation_substrate
    predicate: is C-methylated by
    object: ssfm4
    notes: MITE represents SsfM4 as the C-methyltransferase for an SF2575-pathway
      tetracycline intermediate; an exact local record or ChEBI grounding is absent
      for the submitted substrate structure.
    evidence:
    - reference: DOI:10.1002/anie.201205426
      evidence_type: PRIMARY_EXPERIMENT
      snippet: SsfM4 was identified to catalyze C6 C-methylation by heterologous reconstitution
        in CH999.
      notes: Wang et al. inactivated ssfM4 in a Streptomyces lividans K4-114 heterologous
        host carrying the SF2575 ssf cluster, observed products lacking C6 methylation,
        and concluded that the C6 methyl transfer occurs early to generate 6-methylpretetramide.
    - reference: DOI:10.1021/ja907852c
      evidence_type: PRIMARY_EXPERIMENT
      snippet: C-6 methylation of 47, which is catalyzed by the OxyF homolog SsfM4.
      notes: Pickens et al. placed ssfM4 in the 40-ORF SF2575 biosynthetic gene cluster
        and heterologously reconstituted production of the oxidized 6-methylpretetramide
        product WJ119 after adding ssfL2 to ssfY1Y2M4.
    - reference: https://mite.bioinformatics.nl/repository/MITE0000022
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: MITE0000022 is active, links SsfM4 to UniProtKB:D6MSU6, GenPept ADE34484.1
        and MIBiG BGC0000269, lists SAM and FeS as cofactors, and represents a knock-out-supported
        C-methylation reaction in the SF2575 biosynthetic pathway.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0000269.5/BGC0000269.gbk
      evidence_type: DATABASE_ASSERTION
      snippet: 'MITE0000022: Methylation (100% identity)'
