  edges:
  - subject: ssfm2_o_methylation_substrate
    predicate: is O-methylated by
    object: ssfm2
    notes: MITE represents SsfM2 as the O-methyltransferase for an SF2575 tetracycline
      intermediate; an exact local record is absent for the submitted substrate structure.
    evidence:
    - reference: DOI:10.1002/anie.201205426
      evidence_type: PRIMARY_EXPERIMENT
      snippet: inactivation of ssfM2 led to the isolation of three different desmethyl
        compounds
      notes: Wang et al. inactivated ssfM2 in a Streptomyces lividans K4-114 heterologous
        host carrying the SF2575 ssf cluster, isolated C6-desmethyl SF2575-pathway
        products, restored SF2575 production by complementation with ssfM2, and assigned
        SsfM2 as the C6 O-methyltransferase.
    - reference: https://mite.bioinformatics.nl/repository/MITE0000021
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: MITE0000021 is active, links SsfM2 to UniProtKB:D6MSW0, GenPept ADE34498.1
        and MIBiG BGC0000269, and represents a knock-out-supported O-methylation reaction
        in the SF2575 biosynthetic pathway.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0000269.5/BGC0000269.gbk
      evidence_type: DATABASE_ASSERTION
      snippet: 'MITE0000021: Methylation (100% identity)'
      retrieved_on: '2026-10-02'
      notes: MIBiG BGC0000269.5 places ssfM2/ADE34498.1 inside the active Streptomyces
        sp. SF2575 biosynthetic gene cluster as a biosynthetic-additional locus with
        a 100% identity MITE0000021 methylation annotation.
