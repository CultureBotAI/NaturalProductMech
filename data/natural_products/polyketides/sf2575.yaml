      evidence_type: DATABASE_ASSERTION
      snippet: GN   Name=ssfM2
      retrieved_on: '2026-10-02'
      notes: Current UniProtKB:D6MSW0 resolves as a 331 aa Streptomyces sp. SF2575
        SsfM2 entry and cross-references EMBL GQ409537 protein ADE34498.1.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ADE34498.1
