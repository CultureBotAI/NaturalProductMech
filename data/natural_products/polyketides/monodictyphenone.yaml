definition: A member of the class of benzophenones in which one phenyl group is substituted
  at positions 2 and 6 by hydroxy groups while the other is substituted at positions
  2, 4, and 6 by hydroxy, methyl, and carboxy groups, respectively. First obtained
  from the fungal strain Monodictys putredinis, isolated from the inner tissue of
  a marine green alga, it was subsequently obtained from the fungus Aspergillus nidulans.
