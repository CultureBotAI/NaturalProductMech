discussions:
- discussion_id: curator-nataxazole-reaction-and-product-scope
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#nataxazole-native-core-protein-participation
  prompt: Which exact reactions and constructs establish the native core-protein roles,
    and which additional steps connect the core pathway to the exact nataxazole methyl
    ester?
  rationale: The added graph records explicit deposited protein-function annotations,
    not individual functional experiments. The public 2015 abstract distinguishes
    AJI9561 production by the transferred cluster from nataxazole and reports the
    missing O-methyltransferase gene. A complete final-product pathway cannot be inferred
    from the twelve annotations. NatAM and NatL2 structure identities are verified,
    but neither structure is a nataxazole complex or proof of a two-enzyme complete
    pathway.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/LN713864.1
    supports: PARTIAL
    evidence_source: GenBank, retrieved 2026-10-11
    explanation: Native gene labels, protein sequences and biosynthesis function qualifiers
      were inspected; NatAC2 is explicitly proposed. These annotations do not distinguish
      all demonstrated reactions from historical proposals.
  - reference: DOI:10.1002/cbic.201500153
    supports: PARTIAL
    evidence_source: PubMed:25892546 public abstract only
    explanation: The abstract reports heterologous AJI9561 production and absence
      of the required O-methyltransferase gene from the characterized cluster. Full
      text and supplements were inaccessible and are not used as inspected evidence.
  notes: Resolve ester-versus-amide intermediate assignments and the separate second-ring
    mechanism before adding ordered reaction steps. DOI:10.1002/anie.201915685 (NatL2/NatAM)
    and DOI:10.1021/acscatal.5c00835 (NatS) are further leads whose full papers and
    supplements were not inspected. Retain their access stops. PDB 6SJ2 contains a
    25-aa NatAM extension and names S. albus as expression host; PDB 6SIY contains
    the native-length NatL2 polymer and names E. coli BL21. No host equivalence or
    native producer attribution follows from expression metadata. Other native regulators
    and transporters require separately scoped evidence. Existing source-owned chemistry,
    classification, occurrences and producer grades remain unchanged, and the record
    remains SEEDED.
- discussion_id: curator-nataxazole-regulation-and-transport-scope
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#nataxazole-native-regulation-and-transport
  prompt: Which native regulatory targets and signs, and which transporter substrates
    and directions, are experimentally established for NatR1-4 and NatT1-4?
  rationale: Exact sequence identity and an explicit biosynthetic-cluster annotation
    do not establish a regulatory effect or transport mechanism. The four NatT function
    qualifiers are explicitly proposed. The NatT4 product name mentions drug resistance
    but is not evidence of nataxazole-specific self-resistance. Regulation, transport,
    native protein identity and assay-construct identity must be evaluated separately
    before strengthening the graph.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/LN713864.1
    supports: PARTIAL
    evidence_source: GenBank LN713864.1, retrieved 2026-10-11
    explanation: Four regulator annotations and four proposed-transporter annotations
      were inspected with their native sequences. Neither positive/negative regulatory
      signs nor transport directions are stated in those qualifiers.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CEK42811.1
    supports: PARTIAL
    evidence_source: GenPept natR1 reference
    explanation: Native regulator identity and annotation agree with the nucleotide
      record; predicted domains are not direct regulatory assays.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CEK42829.1
    supports: PARTIAL
    evidence_source: GenPept natT4 reference
    explanation: The record combines a drug-resistance-family product name with an
      explicitly proposed nataxazole transporter function; no compound-specific resistance
      phenotype is supplied by these annotations.
  notes: Keep PMID:25892546 / DOI:10.1002/cbic.201500153 as an uninspected full-paper
    lead under the existing access stop. Do not upgrade a database assertion by citing
    its uninspected primary reference. A bounded exact-strain NatR1 UniProt search
    returned no result; changed-gene/taxon suggestions were rejected. This does not
    establish that UniProt lacks all eight native proteins. No example was selected
    here, and the versioned GenPept sequences provide the actual grounding. The previous
    core graph and its final-methylation discussion remain unchanged; source-owned
    fields and SEEDED status are retained.
