  scope: BIOSYNTHESIS
  description: 'Partial map of twelve native protein references explicitly annotated
    for nataxazole biosynthesis in GenBank LN713864.1, not a reconstructed sequence
    of experimentally demonstrated reactions. NatAM and NatL2 are grounded to exact
    UniProt/native sequences and checked against independent PDB deposits; the other
    ten references use verified GenPept identifiers without substituting homologs.
    All participation edges are database assertions, and NatAC2 remains proposed.
    The core-cluster association does not establish conversion to the exact final
    methyl ester: no nataxazole product endpoint, producer upgrade or complete-pathway
    claim is added. Native regulatory and transport candidates remain outside this
    core-protein mechanism; the functionless NatX annotation is not promoted.'
