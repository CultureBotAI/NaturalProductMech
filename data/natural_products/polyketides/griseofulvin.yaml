    label: acetyl-CoA(4-)
    node_type: PRECURSOR
    identifier: CHEBI:57288
    grounding_status: GROUNDED
  - node_id: malonyl_coa
    label: malonyl-CoA(5-)
    node_type: PRECURSOR
    identifier: CHEBI:57384
    grounding_status: GROUNDED
  - node_id: gsfa
    label: GsfA non-reducing polyketide synthase
    node_type: ENZYME
    identifier: UniProtKB:D7PI15
    grounding_status: GROUNDED
