biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:D7PI15
  enzyme_label: GsfA non-reducing polyketide synthase
  reaction_id: RHEA:73915
  substrates:
  - CHEBI:57288
  - CHEBI:57384
  product: CHEBI:193062
  proposed: true
  notes: GsfA is proposed to form the heptaketide benzophenone from acetyl-CoA and
    six malonyl-CoA units; Rhea captures this non-reducing polyketide synthase reaction
    as RHEA:73915.
  evidence:
  - reference: DOI:10.1021/cb400541z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: most likely that the true heptaketide product of GsfA is the benzophenone
      5a
    notes: Cacho et al. purified recombinant holo-GsfA from Saccharomyces cerevisiae
      and observed that GsfA alone turned over malonyl-CoA to norlichexanthone; they
      reasoned that the true heptaketide product in griseofulvin biosynthesis is the
      benzophenone 5a that spontaneously dehydrates to norlichexanthone.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
      gene cluster CDS ADI24953.1 to GsfA.
  - reference: https://www.uniprot.org/uniprotkb/D7PI15
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:D7PI15 is the 1790 aa P. aethiopicum GsfA non-reducing
      polyketide synthase, cross-references GU574478 protein ADI24953.1, and annotates
      RHEA:73915 from PMID:23978092.
  - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: The Rhea Swiss-Prot mapping links UniProtKB:D7PI15 to the master GsfA reaction
      RHEA:73915 and left-to-right reaction RHEA:73916.
- step_number: 2
  enzyme_id: UniProtKB:D7PI16
  enzyme_label: GsfB O-methyltransferase
  reaction_id: RHEA:73923
  substrate: CHEBI:193062
  product: CHEBI:193064
  notes: GsfB methylates the GsfA benzophenone product at 3-OH to yield griseophenone
    D, the immediate substrate for GsfC; Rhea captures the SAM-dependent methyltransferase
    reaction as RHEA:73923.
  evidence:
  - reference: DOI:10.1021/cb400541z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: GsfB is the 3-OH MT
    notes: Cacho et al. deleted gsfB and observed griseophenone-family intermediates
      that lacked 3-OH methylation; a coupled GsfA/GsfB in vitro assay further supported
      GsfB 3-OH O-methyltransferase activity and produced griseophenone D.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
      gene cluster CDS ADI24954.1 to GsfB.
  - reference: https://www.uniprot.org/uniprotkb/D7PI16
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:D7PI16 is the 419 aa P. aethiopicum GsfB O-methyltransferase,
      cross-references GU574478 protein ADI24954.1, and annotates RHEA:73923 from
      PMID:23978092.
- step_number: 3
  enzyme_id: UniProtKB:D7PI17
  enzyme_label: GsfC O-methyltransferase
  reaction_id: RHEA:73927
  substrate: CHEBI:193064
  product: CHEBI:193065
  notes: GsfC methylates griseophenone D at 9-OH to yield griseophenone C, the immediate
    substrate for GsfI; Rhea captures the SAM-dependent methyltransferase reaction
    as RHEA:73927.
  evidence:
  - reference: DOI:10.1021/cb400541z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: GsfC is the 9-OH MT
    notes: Cacho et al. deleted gsfC and observed accumulation of 3-O-methylated,
      9-OH-unmethylated intermediates including griseophenone D; coupled GsfA/GsfC
      in vitro assays further supported GsfC 9-OH O-methyltransferase activity.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
      gene cluster CDS ADI24955.1 to GsfC.
  - reference: https://www.uniprot.org/uniprotkb/D7PI17
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:D7PI17 is the 396 aa P. aethiopicum GsfC O-methyltransferase,
      cross-references GU574478 protein ADI24955.1, and annotates RHEA:73927 from
      PMID:23978092.
- step_number: 4
  enzyme_id: UniProtKB:D7PI14
  enzyme_label: GsfI flavin-dependent halogenase
  reaction_id: RHEA:73931
  substrate: CHEBI:193065
  product: CHEBI:193066
  notes: GsfI chlorinates griseophenone C at C13 to form griseophenone B immediately
    upstream of GsfF-catalyzed grisan scaffold formation; Rhea captures the reduced-flavin
    chlorination as RHEA:73931.
  evidence:
  - reference: DOI:10.1021/cb400541z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: GsfI led to the production of chlorinated phenone 11
    notes: Cacho et al. cloned, expressed, and purified GsfI and reconstituted chlorination
      of griseophenone C, compound 10, to griseophenone B, compound 11, in vitro with
      SsuE to regenerate the reduced flavin cofactor.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
      gene cluster CDS ADI24948.1 to GsfI.
  - reference: https://www.uniprot.org/uniprotkb/D7PI14
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:D7PI14 is the 533 aa P. aethiopicum GsfI flavin-dependent
      halogenase, cross-references GU574478 protein ADI24948.1, and annotates RHEA:73931
      from PMID:23978092.
- step_number: 5
  enzyme_id: UniProtKB:D7PI20
  enzyme_label: GsfF cytochrome P450 monooxygenase
  reaction_id: RHEA:73935
  substrate: CHEBI:193066
  product: CHEBI:193067
  notes: GsfF performs the late oxidative phenolic coupling that converts griseophenone
    B into the grisan scaffold of desmethyl-dehydrogriseofulvin during griseofulvin
    biosynthesis.
  evidence:
  - reference: DOI:10.1021/cb400541z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: 90% conversion of 11 to 14
    notes: Cacho et al. deleted gsfF in Penicillium aethiopicum, observed griseophenone
      B accumulation, expressed GsfF with Aspergillus terreus cytochrome P450 reductase
      in Saccharomyces cerevisiae, and confirmed that GsfF converts griseophenone
      B, compound 11, to the grisan product desmethyl-dehydrogriseofulvin, compound
      14.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
      gene cluster CDS ADI24958.2 to GsfF.
  - reference: https://www.uniprot.org/uniprotkb/D7PI20
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:D7PI20 is the 504 aa P. aethiopicum GsfF cytochrome
      P450 monooxygenase, cross-references GU574478 protein ADI24958.2, and annotates
      RHEA:73935 from PMID:23978092.
- step_number: 6
  enzyme_id: UniProtKB:D7PI18
  enzyme_label: GsfD O-methyltransferase
  reaction_id: RHEA:73939
  substrate: CHEBI:193067
  product: CHEBI:81999
  proposed: true
  notes: GsfD is proposed to methylate desmethyl-dehydrogriseofulvin at 5-OH to yield
    dehydrogriseofulvin; Rhea maps the SAM-dependent GsfD O-methyltransferase to RHEA:73939.
  evidence:
  - reference: DOI:10.1021/cb400541z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: GsfD regioselectively targets 5-OH
    notes: Cacho et al. deleted gsfD and observed late-stage griseofulvin intermediates
      lacking 5-O-methylation; they proposed that GsfD methylates desmethyl-dehydrogriseofulvin,
      compound 14, to produce dehydrogriseofulvin, compound 18.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
      gene cluster CDS ADI24956.1 to GsfD.
  - reference: https://www.uniprot.org/uniprotkb/D7PI18
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:D7PI18 is the 378 aa P. aethiopicum GsfD O-methyltransferase
      and cross-references GU574478 protein ADI24956.1.
  - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: The Rhea Swiss-Prot mapping links UniProtKB:D7PI18 to the master GsfD reaction
      RHEA:73939 and left-to-right reaction RHEA:73940.
- step_number: 7
  enzyme_id: UniProtKB:D7PI19
  enzyme_label: GsfE short-chain dehydrogenase
  reaction_id: RHEA:73943
  substrate: CHEBI:81999
  product: naturalproductmech:mibig-e59592cca0
  notes: GsfE stereospecifically reduces dehydrogriseofulvin to griseofulvin with
    NADPH; Rhea maps this final reductase reaction to RHEA:73943.
  evidence:
  - reference: DOI:10.1021/cb400541z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: GsfE fully converted 18 or 19 to 1 or 2
    notes: Cacho et al. deleted gsfE and observed dehydrogriseofulvin and dechloro-dehydrogriseofulvin
      accumulation, then purified His-tagged GsfE and showed NADPH-dependent in vitro
      conversion of dehydrogriseofulvin, compound 18, to griseofulvin, compound 1.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
      gene cluster CDS ADI24957.1 to GsfE.
  - reference: https://www.uniprot.org/uniprotkb/D7PI19
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:D7PI19 is the 377 aa P. aethiopicum GsfE short-chain
      dehydrogenase and cross-references GU574478 protein ADI24957.1.
  - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: The Rhea Swiss-Prot mapping links UniProtKB:D7PI19 to the master GsfE reaction
      RHEA:73943 and left-to-right reaction RHEA:73944.
