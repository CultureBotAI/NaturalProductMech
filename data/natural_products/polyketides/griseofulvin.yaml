    label: 2-(2,4-dihydroxy-6-oxidobenzoyl)-5-hydroxy-3-methylbenzenolate
    node_type: COMPOUND
    identifier: CHEBI:193062
    grounding_status: GROUNDED
  edges:
  - subject: acetyl_coa
    predicate: is extended by
    object: gsfa
    notes: GsfA is proposed to prime the griseofulvin heptaketide backbone with acetyl-CoA
      before extension by malonyl-CoA.
    evidence:
    - reference: DOI:10.1021/cb400541z
      evidence_type: PRIMARY_EXPERIMENT
      snippet: most likely that the true heptaketide product of GsfA is the benzophenone
        5a
      notes: Cacho et al. purified recombinant holo-GsfA from Saccharomyces cerevisiae
        and observed that GsfA alone turned over malonyl-CoA to norlichexanthone;
        they reasoned that the true heptaketide product in griseofulvin biosynthesis
        is the benzophenone 5a that spontaneously dehydrates to norlichexanthone.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-09-30'
      notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
        gene cluster CDS ADI24953.1 to GsfA.
    - reference: https://www.uniprot.org/uniprotkb/D7PI15
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-09-30'
      notes: Reviewed UniProtKB:D7PI15 is the 1790 aa P. aethiopicum GsfA non-reducing
        polyketide synthase, cross-references GU574478 protein ADI24953.1, and annotates
        RHEA:73915 from PMID:23978092.
    - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
