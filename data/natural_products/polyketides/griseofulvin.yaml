  - subject: griseophenone_b
    predicate: is oxidatively coupled by
    object: gsff
    notes: GsfF catalyzes oxidative coupling of the orcinol and phloroglucinol rings
      in griseophenone B.
    evidence:
    - reference: DOI:10.1021/cb400541z
      evidence_type: PRIMARY_EXPERIMENT
      snippet: 90% conversion of 11 to 14
