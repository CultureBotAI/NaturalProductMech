discussions:
- discussion_id: curator-cercosporin-exact-identity
  kind: CONTROVERSY
  status: OPEN
  prompt: Which primary stereochemical and tautomer representation supports this exact
    cercosporin owner?
  rationale: Pinned RDKit 2026.03.5 reproduces the stored InChI and key. The encoded
    side-chain centers are R,R and PubChem CID91617 is an exact graph match. Default
    RDKit tautomer canonicalization yields the pinned CHEBI:3556 key DGAZLNHJYDOWLG-GHMZBOCLSA-N,
    but that computational relation does not authorize exact-key grounding, merging
    or transfer of biological claims. Primary absolute and helical stereochemistry,
    structural figures and exact-product occurrence support remain incompletely adjudicated.
    CHEBI:146017 is a dianion, not a neutral replacement. Preserve both exact owners
    pending source-specific review; do not infer equivalence from a shared label,
    change stereochemistry automatically, or promote SEEDED status.
  evidence:
  - reference: https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:3556
    explanation: Pinned ChEBI inventory contains neutral R,R cercosporin; graph comparison
      does not establish experimental identity.
  - reference: PMID:28535078
    explanation: Inspected abstract or main-text sections inform experimental context;
      rendered primary structures and complete stereochemical adjudication remain
      outstanding.
  - reference: https://github.com/CultureBotAI/NaturalProductMech/issues/955
    explanation: Tracks unresolved exact-product adjudication; this OPEN qualification
      does not resolve identity.
- discussion_id: curator-cercosporin-zeina-complementation
  kind: CONTROVERSY
  status: OPEN
  prompt: How should the native C. zeina CTB7-pseudogene locus and complemented production
    experiment be represented separately?
  rationale: PMID:28535078 reports cercosporin in one C. zeina transformant complemented
    with full-length C. zeae-maydis CTB7 under nitrogen-limited/light conditions.
    It reports lack of native in-vitro production in the studied context and only
    proposes a structural variant during maize infection. KY656140.1 is the partial
    native CTB region with a CTB7 pseudogene, from deposited isolate CMW25467, not
    the complemented construct. The LOTUS occurrence cites the same study and requires
    the same experimental-context audit; occurrence and production remain distinct
    claims. The publisher full text was inaccessible. This qualification does not
    prove species-wide absence, upgrade SOURCE_ASSERTION or CLUSTER_UNSTATED, or change
    the compound-origin class to ENGINEERED. Claim-level context or withholding requires
    further source-pinned curation.
  evidence:
  - reference: PMID:28535078
    explanation: Inspected primary abstract distinguishes native in-vitro observations
      from the complemented transformant.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/KY656140.1
    explanation: Versioned GenBank source and CTB7 pseudogene annotation inspected;
      isolate CMW25467 is deposited context, not an inferred engineered strain name.
  - reference: https://github.com/CultureBotAI/NaturalProductMech/issues/956
    explanation: Claim-level engineering-context repair remains open; this discussion
      is a mitigation only.
