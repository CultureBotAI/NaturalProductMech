- discussion_id: curator-fumagillin-p450-kr-assay-scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Which deposited construct sequences resolve these reference mappings, and
    should the transposed Fma-KR methods product numbers be corrected?
  rationale: Af293 sequence identity does not establish experimental allele identity.
    Figure 8A-C and Results consistently give 21 to 9, 22 to 6 and 23 to 2; methods
    list 6, 9 and 2 in that order.
  notes: Retain exact assay context and source discrepancy. KR can reduce multiple
    substrates in vitro; that does not fix its native timing. The original ABM host
    discrepancy remains separate and unchanged.
  evidence:
  - reference: DOI:10.1021/ja500881e
    evidence_source: Results, Figure 8, Experimental Section Fma-KR assays, supplement
      S8-S10/S13-S14
    notes: Primary source inspected; no full-record REVIEWED sign-off.
- discussion_id: curator-fumagillin-c6h-mt-reference-scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Which deposited inserts and fungal strains resolve C6H/MT assay identity,
    and can the source numbering and donor-name discrepancies be reconciled?
  rationale: C6H primers support only reference aa39-309; matching MT sequence is
    from a partial 5-prime transcript. Results/Figure 4C support 6-to-7 and paired
    6-to-2, conflicting with Chemical Analysis. PKS/AT FUNCTION and CATALYTIC ACTIVITY
    spell the acyl donor differently.
  notes: Keep these limits visible. PKS/TC/AT are database annotations, not freshly
    verified 2013 experiments. DOI10.1021/ja312503y access remains stopped without
    alternate retrieval. No full-record REVIEWED sign-off or source-owned correction.
  evidence:
  - reference: DOI:10.1021/ja500881e
    evidence_source: Figure 4C, Results, dedicated assay methods, Chemical Analysis,
      supplement Table S2
    notes: Primary article and supplement inspected.
  - reference: https://www.uniprot.org/uniprotkb/Q4WAY4/entry
    evidence_source: UniProt2026_03 FUNCTION and CATALYTIC ACTIVITY
    notes: Database wording discrepancy; no chemical-ID equivalence assumed.
