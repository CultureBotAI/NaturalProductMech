      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-12'
      notes: Selected same-named AFUA_8G00470 reference, not sequence identity of
        the assayed insert. Release2026_03 Q4WAZ2 matches the275-aa EAL85120.1 and
