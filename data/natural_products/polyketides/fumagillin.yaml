    experimental enzyme remains accession-unresolved; Af293 is a separate reference
    example, not an asserted identical allele. Main Figure4 names BJ5464-NpgA; supplement
    S6-S8 specifies BY4705. The host discrepancy is retained. No producer, essentiality,
    cofactor-independence or purified-enzyme sufficiency claim is added.
