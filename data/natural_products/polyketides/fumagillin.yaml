    identifier: UniProtKB:P50579
    grounding_status: GROUNDED
  edges:
  - subject: fumagillin
    predicate: binds
    object: metap2
    notes: PDB 1BOA maps chain A to UniProtKB:P50579 residues 1-478 with a single
      I347/V347 sequence conflict and records FUG fumagillin covalently linked to
      His231 NE2 of chain A.
    evidence:
    - reference: DOI:10.1126/science.282.5392.1324
      evidence_type: PRIMARY_EXPERIMENT
      snippet: Structure of human methionine aminopeptidase-2 complexed with fumagillin.
      notes: Sin et al. solved PDB 1BOA, a structure of human MetAP2 in complex with
        FUG fumagillin and cobalt.
    - reference: DOI:10.2210/pdb1boa/pdb
      evidence_type: DATABASE_ASSERTION
      notes: RCSB PDB identifies PDB 1BOA entity 1 as a methionine aminopeptidase
        mapped to UniProtKB:P50579, entity 3 as FUG fumagillin, and reports a 1.484
        Angstrom covalent bond between His231 NE2 and FUG C11.
- graph_id: fumagillin-abm-terminal-conversion
  scope: BIOSYNTHESIS
