definition: A meroterpenoid resulting from the formal condensation of the hydroxy
  group of fumagillol with the carboxylic acid group of (all-E)-deca-2,4,6,8-tetraenedioic
  acid. Originally isolated from the fungus Aspergillus fumigatus, it is used for
  the control of Nosema infection in honey bees.
