- step_number: 1
  enzyme_id: UniProtKB:Q70KH9
  enzyme_label: AurF 4-aminobenzoate N-oxygenase
  reaction_id: RHEA:58889
  notes: AurF oxidizes 4-aminobenzoate to 4-nitrobenzoate, the nitroaryl starter unit
    used by the aureothin polyketide synthase.
  evidence:
  - reference: DOI:10.1021/ja039328t
    evidence_type: PRIMARY_EXPERIMENT
    snippet: involvement of an unprecedented N-oxygenase
    notes: UniProtKB:Q70KH9 resolves to the Streptomyces thioluteus aurF gene product,
      maps to EMBL AJ575648 protein CAE02601.1, and annotates the left-to-right physiological
      RHEA:58889 reaction.
  substrate: CHEBI:17836
  product: CHEBI:142863
