- discussion_id: curator-lasalocid-ab449340-strain-conflict
  kind: CONTROVERSY
  status: OPEN
  prompt: 'Which strain attribution is correct for AB449340.1: the deposited ATCC31180
    or the primary-paper ATCC35851?'
  rationale: 'Current GenBank AB449340.1 source qualifiers name ATCC31180. The inspected
    advance-view paper DOI:10.1271/bbb.80631 (PMID:19129623), methods and deposition
    statement, instead assigns pKSL/AB449340 to ATCC35851. FM173265.1 separately names
    NRRL3382R. Do not silently equate these attributions or identify the type strain
    ATCC31180T/NRRL3382T with ATCC35851/NRRL3382R. The disagreement is unresolved;
    neither source is declared incorrect. The published Lsd19 biochemical experiment
    does not settle strain identity, sodium counterion processing or complete stereochemistry
    of this stored salt. Preserve SOURCE_ASSERTION and CLUSTER_UNSTATED pending claim-specific
    adjudication. Issue #971 addresses missing conflict representation, not biological
    resolution.'
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB449340.1
    notes: Source strain ATCC31180; accession version and qualifiers inspected 2026-10-14.
  - reference: DOI:10.1271/bbb.80631
    notes: Advance-view methods name ATCC35851 and explicitly deposit AB449340; no
      silent source reconciliation.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/FM173265.1
    notes: Separate BGC0000087 sequence has source strain NRRL3382R; not an adjudication
      of AB449340.
