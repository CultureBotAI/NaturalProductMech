biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A1S6QMP3
  enzyme_label: MrqO5 cofactor-independent monooxygenase
  notes: MrqO5 decarboxylates an aromatic type II polyketide biosynthesis intermediate
    in the murayaquinone pathway. This single-step partial pathway leaves assembly
    of the upstream carboxylated intermediate and its later conversion to murayaquinone
    uncurated.
  evidence:
  - reference: DOI:10.1021/acschembio.5c00695
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Decarboxylase Activity of an Antibiotic Biosynthesis Monooxygenase Family
      Protein in the Biosynthesis of the Type II Polyketide Murayaquinone
    notes: Zhou et al. characterized decarboxylase activity from a monooxygenase-family
      protein in type II polyketide murayaquinone biosynthesis; MITE curates MrqO5
      from this DOI as an in vitro decarboxylation reaction.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000465
    evidence_type: DATABASE_ASSERTION
    snippet: Decarboxylation of aromatic type II polyketide biosynthesis intermediate
    retrieved_on: '2026-10-01'
    notes: MITE0000465 is an active MrqO5 cofactor-independent monooxygenase entry
      for decarboxylation of an aromatic type II polyketide murayaquinone biosynthesis
      intermediate; it links UniProtKB:A0A1S6QMP3, GenPept AQW35073.1, MIBiG BGC0001675
      and the Zhou et al. DOI.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001675.5/BGC0001675.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="AQW35073.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0001675.5 places AQW35073.1 inside the active Streptomyces griseoruber
      Sgr29 murayaquinone cluster as the mrqO5 oxygenase CDS.
  - reference: https://www.uniprot.org/uniprotkb/A0A1S6QMP3
    evidence_type: DATABASE_ASSERTION
    snippet: GN   Name=mrqO5
    retrieved_on: '2026-10-01'
    notes: Current unreviewed UniProtKB:A0A1S6QMP3 resolves as a 103 aa Streptomyces
      griseoruber MrqO5 oxygenase and cross-references EMBL KX817190 protein AQW35073.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AQW35073.1
    evidence_type: DATABASE_ASSERTION
    snippet: oxygenase [Streptomyces griseoruber]
    retrieved_on: '2026-10-01'
    notes: GenPept AQW35073.1 is the 103 aa Streptomyces griseoruber Sgr29 oxygenase
      encoded by complement(KX817190.1:58328..58639) with gene qualifier mrqO5.
