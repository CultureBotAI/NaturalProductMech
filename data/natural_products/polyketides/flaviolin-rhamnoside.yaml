- enzyme_id: UniProtKB:Q8KQM3
  enzyme_label: RppA
  product: CHEBI:18365
  proposed: true
  notes: This curates the Saccharopolyspora erythraea BGC0000285/AY078067.1 RppA type
    III PKS as the knockout-supported scaffold enzyme in the red-brown pigment locus
    upstream of flaviolin and flaviolin rhamnoside. The record does not assert direct
    biochemical characterization of purified S. erythraea RppA or a single-enzyme
    reaction from RppA to flaviolin rhamnoside.
  evidence:
  - reference: DOI:10.1046/j.1365-2958.2002.02975.x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: disrupt the red-brown pigment-producing (rpp) locus in S. erythraea,
      generating a mutant that displayed an albino phenotype
    notes: Cortes et al. used rpp-locus disruption and vector recapture in Saccharopolyspora
      erythraea to connect the cloned chalcone-synthase-like rppA locus to diffusible
      red-brown flaviolin-derived pigment biosynthesis; the RppA-to-THN product assignment
      is proposed from type III PKS homology rather than an assay of purified S. erythraea
      RppA.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000285.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0000285.5 names flaviolin among products of the Saccharopolyspora
      erythraea AY078067.1 red-brown-pigment locus and annotates AAL78053.1/rppA as
      a knockout-supported Type III PKS scaffold-biosynthesis gene.
  - reference: https://www.uniprot.org/uniprotkb/Q8KQM3
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:Q8KQM3 is the 367 aa Saccharopolyspora erythraea RppA/rppA
      protein and cross-references EMBL AY078067 protein AAL78053.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAL78053.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AAL78053.1 is the AY078067.1 rppA CDS from the Saccharopolyspora
      erythraea red-brown-pigment locus and is sequence-identical to UniProtKB:Q8KQM3.
