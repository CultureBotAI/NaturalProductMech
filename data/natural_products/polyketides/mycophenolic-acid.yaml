- discussion_id: curator-mpah-prime-reference-gene-model
  kind: CURATION_TODO
  status: OPEN
  prompt: How should the NRRL864 MpaH' canonical433-aa sequence be reconciled with
    deposited AJG44385.1/KM595305.1 (398aa)?
  rationale: 'UniProt marks AJG44385.1 as an erroneous gene model (ALT_SEQ). Native
    CDS translation confirms the398-aa deposit, not the corrected433-aa canonical
    sequence. MpaH'' is not added as a grounded graph protein in this curation. Independent
    structural sequence mapping remains a lead, not an inspected resolution. Follow-up2026-10-12:
    independent7DBI entity sequence agrees with all433 canonical residues after SeMet
    normalization; 7DBL agrees except documentedS139A. This now supports a separate
    structural-reference graph, but does not repair the398-aa genomic model or authenticate
    the2025 assay construct. The native-model question remains OPEN; the earlier reference
    graph remains unchanged.'
  evidence:
  - reference: https://www.uniprot.org/uniprotkb/A0A0B5LB55
    evidence_source: Reviewed UniProt sequence caution, inspected2026-10-12
    notes: Entry20, sequence2; canonical433aa versus erroneous398-aa AJG44385.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AJG44385.1
    evidence_source: Independent native GenPept and complete genomic CDS translation
    notes: KM595305.1 three-exon model translates to398aa and disagrees with canonical
      UniProt.
  - reference: https://www.ebi.ac.uk/pdbe/entry-files/download/7dbi.cif
    evidence_source: Independent structural entity sequence comparison,2026-10-12
    notes: Declared sequence433aa equals canonical UniProt; observed coordinates cover
      only417-420 residues per chain. Native splice model unresolved.
