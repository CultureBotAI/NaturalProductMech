      snippet: MpaG' catalyzes the methylation of demethylmycophenolic acid (DMMPA,
        6) to form 1.
      notes: Zhang et al. identified the Penicillium brevicompactum NRRL 864 mpa'
        cluster and functionally and kinetically characterized its SAM-dependent MpaG'
        O-methyltransferase in vitro against demethylmycophenolic acid.
    - reference: DOI:10.1002/pro.5144
      evidence_type: PRIMARY_EXPERIMENT
      snippet: MpaG' catalyzes the 5-O-methylation of three precursors in MPA biosynthesis
        including demethylmycophenolic acid (DMMPA), 4-farnesyl-3,5-dihydroxy-6-methylphthalide
        (FDHMP), and an intermediate containing three fewer carbon atoms compared
        to FDHMP (FDHMP-3C) with different catalytic efficiencies.
      notes: You et al. solved substrate-bound MpaG' crystal structures and confirmed
        DMMPA, FDHMP and FDHMP-3C activity with the same Penicillium brevicompactum
        NRRL 864 enzyme.
