        MpaG' entry, cross-links KM595305/AJG44384.1, and annotates RHEA:81843 for
        6-O-desmethylmycophenolate O-methylation to mycophenolate.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/KM595305.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-01'
