  resolution_note: 'Unresolved in issue #968. MIBiG BGC0000066 version 5 encodes C30H42N2O8
    with carbon-linked acetamide; ChEBI:5292, PubChem CID5288382 and PDB GDM encode
    the distinct C29H40N2O9 carbamate. The nonexact CID and its 14 historical assay
    rows are withheld separately under #131. The dependent HSP90AA4P graph was withdrawn,
    not transferred to CHEBI:5292. Its original PRIMARY_EXPERIMENT claim relied on
    a database mapping. Q58FG1 is reviewed but UniProt marks protein existence uncertain
    and cautions about a possible pseudogene product; the deposited protocol describes
    recombinant Hsp90-alpha. No primary HSP90AA4P construct is established by this
    review. Preserve the source chemistry, NPAtlas xref and source-tier organism assertions
    pending primary adjudication; do not infer an owner merge or universal inactivity.'
