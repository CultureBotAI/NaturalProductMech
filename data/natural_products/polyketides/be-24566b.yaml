definition: An organic heterohexacyclic compound that is 6,7,9,16-tetrahydro-14H-6,16-epoxyanthra[2,3-e]benzo[b]oxocin-14-one
  substituted by hydroxy groups at positions 3, 11, 13 and 15, methyl groups at positions
  1 and 4 and geminal methyl groups at position 9 respectively. It is isolated from
  the fermentation broth of Streptomyces violaceusniger and exhibits moderate antibacterial
  activity.
