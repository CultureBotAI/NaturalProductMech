    evidence:
    - reference: DOI:10.1016/S1074-5521(98)90293-9
      evidence_type: PRIMARY_EXPERIMENT
      snippet: Purified PikC effectively converts YC-17 into methymycin and neomethymycin
      notes: Xue et al. inactivated pikC in Streptomyces venezuelae, observed loss
        of hydroxylated macrolides with YC-17 and narbomycin accumulation, and showed
        that purified recombinant PikC converts YC-17 into methymycin and neomethymycin
        in vitro.
