  enzyme_id: UniProtKB:A0A075TRK9
  enzyme_label: PatE patulin synthase
  reaction_id: RHEA:62228
  substrates:
  - CHEBI:145112
  - CHEBI:13193
  products:
  - CHEBI:74926
  - CHEBI:17499
  notes: PatE oxidizes (E)-ascladiol to patulin in the terminal step of P. expansum
    patulin biosynthesis; RHEA:62228 grounds the generic electron-acceptor reaction.
  evidence:
  - reference: DOI:10.1111/1462-2920.14542
    evidence_type: PRIMARY_EXPERIMENT
    snippet: functions of eight enzymes in the 10-step patulin biosynthetic pathway
      were verified in P. expansum
    notes: Li et al. systematically dissected the Penicillium expansum patulin cluster
      and connected PatE to the terminal conversion of (E)-ascladiol into patulin.
  - reference: DOI:10.1111/febs.16804
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Patulin synthase (PatE) from Penicillium expansum is a flavin-dependent
      enzyme that catalyses the last step
    notes: Tjallinks et al. expressed P. expansum patE in Aspergillus niger, purified
      and characterized PatE, and confirmed by HPLC that PatE uses ascladiol as its
      preferred substrate in patulin biosynthesis.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000120.5/BGC0000120.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000120.5 maps the P. expansum KF899892 patulin biosynthetic gene
      cluster to CDS AIG62134.1, gene patE, annotated as patulin synthase.
  - reference: https://www.uniprot.org/uniprotkb/A0A075TRK9
    evidence_type: DATABASE_ASSERTION
    snippet: PatE catalyzes the last step of the pathway which is the conversion of
      E-ascladiol to patulin
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:A0A075TRK9 is the 628 aa P. expansum Patulin synthase
      encoded by patE/PEX2_082770, cross-references KF899892 protein AIG62134.1, and
