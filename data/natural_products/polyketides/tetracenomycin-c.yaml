biosynthetic_pathway:
- step_number: 2
  enzyme_id: UniProtKB:P39888
  enzyme_label: TcmG tetracenomycin A2 monooxygenase-dioxygenase
  reaction_id: RHEA:42820
  notes: This curates the final Streptomyces glaucescens TcmG-catalyzed triple hydroxylation
    of tetracenomycin A2 to tetracenomycin C; the preceding TcmP methylation and earlier
    polyketide assembly steps remain uncurated.
  evidence:
  - reference: DOI:10.1128/jb.175.12.3876-3886.1993
    evidence_type: PRIMARY_EXPERIMENT
    snippet: tcmG is responsible for the hydroxylation of TCM A2 at positions C-4,
      C-4a, and C-12a to give TCM C
    notes: Decker et al. sequenced the Streptomyces glaucescens M80674 tcmG locus
      and used heterologous expression to place tcmG in the final tetracenomycin C
      hydroxylation step.
  - reference: DOI:10.1016/s0021-9258(18)43874-4
    evidence_type: PRIMARY_EXPERIMENT
    snippet: The heterologous expression of the tcmG gene in Streptomyces lividans
      and the purification and characterization of TcmG protein
    notes: Shen and Hutchinson purified TcmG/Tcm A2 oxygenase and measured NADPH-dependent
      conversion of tetracenomycin A2 toward tetracenomycin C.
  - reference: DOI:10.1021/ol0002267
    evidence_type: PRIMARY_EXPERIMENT
    snippet: The TcmG or ElmG oxygenase-catalyzed triple hydroxylation of tetracenomycin
      (Tcm) A2 to Tcm C
    notes: Rafanan et al. established the monooxygenase-dioxygenase stoichiometry
      captured by RHEA:42820.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000275.4/
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0000275.4 encodes tcmG as GenBank protein AAA67511.1 in the Streptomyces
      glaucescens M80674.1 tetracenomycin C cluster.
  - reference: https://www.uniprot.org/uniprotkb/P39888
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:P39888 is the 561 aa Streptomyces glaucescens TcmG/tetracenomycin
      A2 monooxygenase-dioxygenase, maps to EMBL M80674 protein AAA67511.1, and annotates
      RHEA:42820 with physiological left-to-right direction RHEA:42821.
  - reference: https://www.rhea-db.org/rhea/42820
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: RHEA:42820 captures tetracenomycin A2 + 2 NADPH + 2 O2 + 2 H(+) = tetracenomycin
      C + 2 NADP(+) + H2O; local Rhea directions map the left-to-right product-forming
      reaction to RHEA:42821 and UniProtKB:P39888.
  substrate: CHEBI:32197
  product: CHEBI:9470
