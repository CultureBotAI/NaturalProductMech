definition: A carbotricyclic compound that is betaenone A in which the butan-2-yl
  side-chain has been hydroxylated at position 1. A phytotoxin isolated from the endophytic
  fungus Stemphylium botryosum, it shows high affinity for ferric (but not ferrous)
  ions.
