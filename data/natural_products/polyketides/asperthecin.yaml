- graph_id: asperthecin-developmental-genetics
  scope: BIOSYNTHESIS
  description: Developmental-gene perturbations associated with asperthecin production.
    NsdD deletion lacks detectable asperthecin and cleistothecia; MAT1/MatB deletion
    increases asperthecin despite absent ascospores. The nodes are sequence-verified
    FGSC A4 references, not complete experimental alleles. Genetic effects are not
    equated with direct apt-promoter regulation, a catalytic reaction, a regulatory
    protein complex or universal production requirements. The source-imported producer
    and BGC grades are unchanged.
