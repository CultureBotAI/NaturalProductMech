      evidence_type: PRIMARY_EXPERIMENT
      retrieved_on: '2026-10-11'
      snippet: knockout strains of two genes involved in sexual development
      notes: 'Palmer et al. 2021, Table 1, Methods and Fig.4/p6: Table 1 lists the
        nsdD-deletion strain RDIT88.13 in a veA+ background. The nsdD-deletion profile
        lacks the assigned asperthecin peak, and Fig.4 also labels this genotype as
        lacking cleistothecia and ascospores. This is a developmental-context-associated
        loss of detectable metabolite, not proof of a direct effect on an apt promoter
        or of a missing catalytic step. The extraction/analytical workflow uses sexual-induction
        conditions, Champe medium at 37 C in darkness for 18 days and HPLC-DAD comparisons
        to an asperthecin standard; the article also reports mass-spectrometric identification.
        No fold change, detection limit or universal biosynthetic essentiality is
        inferred.'
