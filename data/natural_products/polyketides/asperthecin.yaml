      notes: 'Unreviewed UniProtKB/TrEMBL native reference, entry version 77, sequence
        version 1, gene nsdD, ANIA_03152, 461 aa, NCBITaxon:227321. Protein-existence
        annotation remains 4: Predicted. This entry supplies reference identity, not
        an independently curated asperthecin mechanism or proof of the complete laboratory
