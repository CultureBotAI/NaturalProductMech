- graph_id: asperthecin-aptabc-genetic-production
  scope: BIOSYNTHESIS
  description: Genetics-supported asperthecin production with AptA/B/C FGSC A4 reference
    proteins. Gene deletions in the 2021 laboratory strains remove the assigned asperthecin
    signal during sexual development. The reference proteins are not asserted to be
    the exact experimental alleles. No complete pathway, reaction order, immediate
    intermediates, native chain-shortening enzyme, protein complex or direct UV-protection
    mechanism is assigned. The source-imported producer and BGC grades remain unchanged.
