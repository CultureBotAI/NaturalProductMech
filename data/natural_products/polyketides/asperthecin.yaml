discussions:
- discussion_id: curator-asperthecin-apt-reference-and-pathway-limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Which native reactions and experimentally verified alleles connect AptA/B/C
    to the final asperthecin structure?
  rationale: The inspected 2021 study supports gene-level involvement and distinguishes
    deletion backgrounds, but leaves native chain shortening and several pigment identities
    unresolved. Canonical reference identity is stronger than our knowledge of complete
    experimental alleles.
  notes: 'The native FGSC A4 references on BN001301.1 match the complete spliced CDS,
    deposited translation, GenPept and UniProt sequences. The 2021 study uses laboratory
    crosses, not an unmodified FGSC A4 assay: aptA RJMP240.8, aptB RJMP238.5 and aptC
    RJMP239.7 are listed in Table 1. Historical clA6 is an aptA frameshift and clB1
    an aptB premature-stop allele; neither is represented as wild type. blA1 is not
    an identified aptC mutation. The article states chromosome 3 for the apt cluster,
    whereas the native BN001301.1 record states chromosome I; this textual discrepancy
    is not used to remap the sequence-verified locus. Do not equate recombinant anthracenone
    products, the cross-pathway naphthacenedione scaffold or putative ascoquinone
    polymers with the exact asperthecin owner. The 2021 aygA deletion did not support
    assigning AygA as the missing chain-shortening enzyme; absence of a tested production
    effect is not universal inactivity. The 2008 and 2011 full-article requests encountered
    browser challenges and were stopped without alternate retrieval. Their indexed
    excerpts and UniProt summaries are not independently inspected complete methods.
    No final-product enzymatic sufficiency, direct protein-protein interaction, regulatory
    causality, antimicrobial target or source-owned grade upgrade is added. All imported
    fields, history and SEEDED status are preserved.'
  evidence:
  - reference: DOI:10.1093/jimb/kuab055
    evidence_source: Inspected primary article, Table 1, Fig.4 and Methods/Discussion
    notes: Genetic support and assay/strain limitations; canonical references are
      not complete laboratory-allele determinations.
  - reference: https://cronfa.swansea.ac.uk/Record/cronfa61513/Download/61513__25525__7f91b71bd7b04b3d91c546ed3366c5a6.pdf
    evidence_source: Public institutional copy of the primary article, retrieved 2026-10-11
    notes: Full nine-page article inspected; Table 1 and Fig.4 also reviewed as rendered
      pages.
  - reference: https://pubchem.ncbi.nlm.nih.gov/compound/3084060
    evidence_source: PubChem, retrieved 2026-10-11
    notes: Stored SMILES, InChI and InChIKey agree with the official properties and
      independent RDKit calculation; neutral C15H10O8, no stereocenters.
- discussion_id: curator-asperthecin-developmental-regulator-limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Which direct molecular connections, if any, link NsdD and MAT1/MatB to asperthecin
    production independently of developmental changes?
  rationale: The inspected deletion phenotypes occur alongside different sexual-development
    states. Native reference sequences are verified, but direct apt-promoter regulation
    and complete laboratory-allele identity are not established.
  notes: The prior AptA/B/C graph and its evidence are preserved unchanged. The new
    graph adds only the 2021 developmental-gene deletion associations. NsdD/G5EB07
    (ANIA_03152, 461 aa) and MAT1/G5EAT5 (ANIA_02755, 361 aa) are unreviewed native
    FGSC A4 references on chromosome VI. Their protein-existence flags remain predicted
    and inferred from homology, respectively; exact sequence agreement does not upgrade
    those annotations. The paper explicitly equates MAT-1 with matB and identifies
    an alpha-box protein; NCBI Gene2874476 confirms MAT1/ANIA_02755 but supplies no
    matB synonym. The native GenPept product names and current explicit CDS xrefs
    support the chosen reference; inherited product-text accessions Q92226 and Q7Z896
    are not assumed to be additional exact groundings. Table 1 lists RDIT88.13 for
    nsdD deletion, two single matB-deletion lines TJMP190.4 and RJMP290.2, and the
    matB/aptC double deletion RJMP291.12. The plotted single matB-deletion profile
    is not uniquely assigned to one Table 1 line. The nsdD phenotype lacks cleistothecia
    as well as detectable asperthecin, so the graph does not separate direct pathway
    control from developmental or sampling effects. No new catalytic step, fold change,
    physical NsdD-MAT1 complex, regulatory binding site, molecular target or source-owned
    grade upgrade is added. Existing access stops and all original source-owned fields,
    history and SEEDED status remain unchanged.
  evidence:
  - reference: DOI:10.1093/jimb/kuab055
    evidence_source: Inspected primary article, Table 1, Methods and Fig.4
    notes: Gene-deletion and developmental-context evidence; not direct regulatory-mechanism
      or complete allele proof.
  - reference: https://www.ncbi.nlm.nih.gov/gene/2874476
    evidence_source: NCBI Gene, retrieved 2026-10-11
    notes: MAT1/ANIA_02755 gene identity; no additional matB synonym provided.
