    predicate: has_gene_deletion_support_for
    object: production
    notes: The node denotes the native FGSC A4 reference for the named gene. The evidence
      concerns a gene-deletion phenotype in laboratory backgrounds, not a purified-protein
      reaction or proof of identical alleles in every tested strain.
    evidence:
    - reference: DOI:10.1093/jimb/kuab055
      evidence_type: PRIMARY_EXPERIMENT
      retrieved_on: '2026-10-11'
      notes: 'Palmer et al. 2021, Table 1, Methods, pp5-7 and Fig.4: the aptA-deletion
        line RJMP240.8 is listed in a veA+ background. The authors crossed RDIT55.37
        with the corresponding earlier deletion line to generate the study strains;
        they report loss of asperthecin in the aptA deletion samples. Cleistothecial
        extracts after sexual induction on Champe medium at 37 C in darkness were
        compared with an asperthecin standard by HPLC-DAD; the article also reports
        mass-spectrometric identification. This supports involvement in production
        under those conditions, not sufficiency of three purified enzymes or a specific
        substrate/product step. The FGSC A4 canonical accession is an explicitly selected
        reference, not the sequenced complete experimental allele.'
    - reference: https://www.uniprot.org/uniprotkb/Q5B0D0/entry
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-11'
      snippet: Fails to produce asperthecin
      notes: Reviewed UniProtKB entry version 129, sequence version 1, disruption-phenotype
        annotation; the function comment identifies aptA as part of the asperthecin
        cluster. The shared detailed pathway paragraph is not adopted as a complete
        native reaction sequence. AptB cross-pathway Claisen chemistry is not assigned
        as a native asperthecin-forming step.
    - reference: https://www.ncbi.nlm.nih.gov/protein/CBF70387.1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-11'
      notes: Native FGSC A4 (NCBITaxon:227321) reference ANIA_06000, aptA, 1792 aa;
        join(BN001301.1:1542669..1542985, BN001301.1:1543039..1544140,BN001301.1:1544202..1546844,
        BN001301.1:1546898..1548214). CDS-aware genomic translation with intron splicing,
        deposited translation, independent GenPept and reviewed UniProt sequences
        match exactly. The 2021 paper explicitly used the FGSC A4 reference genome
        for SNP analysis, but its deletion lines and historical mutant alleles are
        not equated with the canonical sequence. No engineered tag, purified assay
