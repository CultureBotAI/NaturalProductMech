biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:D7UQ40
  enzyme_label: Sol5 bifunctional solanapyrone synthase
  reaction_id: RHEA:75143
  substrate: CHEBI:63164
  product: CHEBI:38240
  notes: Alternaria solani Sol5 catalyzes the cycloisomerization of prosolanapyrone
    III to solanapyrone D; UniProt and Rhea ground this half-reaction as RHEA:75143.
  evidence:
  - reference: DOI:10.1002/cbic.201000173
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Sol5, encoding a flavin-dependent oxidase (solanapyrone synthase, SPS),
      was expressed in Pichia pastoris and purified
    notes: Kasahara et al. cloned the Alternaria solani solanapyrone biosynthetic
      cluster AB514562, identified sol5 in the cluster, and expressed and purified
      Sol5 as solanapyrone synthase.
  - reference: DOI:10.1016/s0167-4838(98)00040-5
    evidence_type: PRIMARY_EXPERIMENT
    snippet: converting prosolanapyrone II to solanapyrones A and D via oxidation
      and subsequent Diels-Alder reaction
    notes: Katayama et al. detected Alternaria solani solanapyrone synthase activity
      producing solanapyrone D in cell-free extracts and partially purified active
      fractions.
  - reference: DOI:10.1271/bbb.70600
    evidence_type: PRIMARY_EXPERIMENT
    snippet: identified as truncated solanapyrone synthase, and its N-terminal amino
      acid sequence was found to be QETQNLNNFLESNAINP
    notes: Katayama et al. purified a truncated Alternaria solani solanapyrone synthase
      whose N terminus maps to the Sol5 sequence.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000146.3/
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG entry version 3 links BGC0000146 to the Alternaria solani AB514562
      solanapyrone biosynthetic gene cluster; the GenBank record contains sol5 / BAJ09785.1
      annotated as oxidase/Diels-Alderase.
  - reference: https://www.uniprot.org/uniprotkb/D7UQ40
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: UniProtKB:D7UQ40 is the Alternaria solani sol5 / BAJ09785.1 bifunctional
      solanapyrone synthase from EMBL AB514562 and annotates the RHEA:75143 prosolanapyrone
      III to solanapyrone D cycloisomerase reaction.
  - reference: https://www.rhea-db.org/rhea/75143
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: RHEA:75143 is the prosolanapyrone III to solanapyrone D reaction; RHEA:75144
      is its left-to-right direction.
