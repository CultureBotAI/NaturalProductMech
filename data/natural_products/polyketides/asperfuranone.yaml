discussions:
- discussion_id: curator-asperfuranone-identity-and-experimental-scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Can primary stereochemical detail, experimental alleles and molecular mediation
    be resolved without conflating reference sequences and perturbations?
  rationale: RDKit 2026.03.5 confirms SMILES/InChI/key agreement, three unspecified
    tetrahedral centers and two unspecified double bonds. Removing stereochemistry
    from saved CHEBI:64397 yields this connectivity, but its full key differs. Retain
    the source-owned MINTED identity and SEEDED status; no ChEBI equivalence or stereo
    replacement is authorized. The 2009 abstract reverses AfoE/AfoG PKS types relative
    to Results/Table 1; UniProt AfoA deletion attribution to that paper is not adopted.
    The 2010 abstract does not establish a direct ScpR promoter-binding assay.
  evidence:
  - reference: https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:64397
    evidence_source: Committed ChEBI inventory, not a new remote retrieval
    notes: Defined key ZNGSMORVYUMUDS-BYQFYWKXSA-N differs from this stereo-unspecified
      owner.
  - reference: DOI:10.1021/ja8088185
    evidence_source: Inspected Results/Discussion and Table 1
    notes: AfoE is NR-PKS; AfoG is HR-PKS. No AfoA deletion in this study.
  - reference: DOI:10.1128/aem.00683-10
    evidence_source: Inspected author abstract only
    notes: Genetic dependence is not direct promoter-binding evidence.
