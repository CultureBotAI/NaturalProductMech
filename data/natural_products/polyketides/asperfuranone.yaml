causal_graphs:
- graph_id: asperfuranone-native-reference-genetic-perturbations
  scope: BIOSYNTHESIS
  description: Partial genetic-perturbation view; mediation and chemical reaction
    steps are intentionally omitted. The 2009 alcAp-afoA experiments used an nkuA-deletion/stcJ-deletion
    background; AfoA was induced, not deleted. The 2010 ScpR experiments are abstract-bounded,
    including afoA deletion during ScpR induction. Shared outcome nodes denote readout
    categories, not pooled cultures. FGSC A4 accessions are native references, not
    verified experimental alleles. Claims concern asperfuranone at this owner's stereo-unspecified
    resolution, not every possible stereoisomer. No direct promoter binding, transport
    substrate, catalytic order or universal phenotype is asserted. The 2009 Results,
    Table 1, captions and partial Methods were inspected; figure images, detailed
    spectra and supplement were not. No primary isomer-level identity sign-off is
    claimed.
