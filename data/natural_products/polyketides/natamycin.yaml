definition: A macrolide antibiotic that has formula C<small><sub>33</sub></small>H<small><sub>47</sub></small>NO<small><sub>13</sub></small>,
  produced by several <em>Streptomyces</em> species including <em>Streptomyces natalensis</em>.
  It exhibits broad spectrum antifungal activity and used in eye drops, and as a food
  preservative, and also as a postharvest biofungicide for citrus and other fruit
  crops.
