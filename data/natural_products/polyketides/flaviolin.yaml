biosynthetic_pathway:
- enzyme_id: UniProtKB:Q8KQM3
  enzyme_label: RppA
  product: CHEBI:18365
  proposed: true
  notes: This curates the Saccharopolyspora erythraea BGC0000285/AY078067.1 RppA type
    III PKS as the knockout-supported scaffold enzyme in the red-brown pigment locus.
    The record does not assert direct biochemical characterization of purified S.
    erythraea RppA or a single-enzyme reaction from RppA to exact flaviolin.
  evidence:
  - reference: DOI:10.1046/j.1365-2958.2002.02975.x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: disrupt the red-brown pigment-producing (rpp) locus in S. erythraea,
      generating a mutant that displayed an albino phenotype
    notes: Cortes et al. used rpp-locus disruption and vector recapture in Saccharopolyspora
      erythraea to connect the cloned chalcone-synthase-like rppA locus to diffusible
      red-brown flaviolin-derived pigment biosynthesis; the RppA-to-THN product assignment
      is proposed from type III PKS homology rather than an assay of purified S. erythraea
      RppA.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000285.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0000285.5 names flaviolin among products of the Saccharopolyspora
      erythraea AY078067.1 red-brown-pigment locus and annotates AAL78053.1/rppA as
      a knockout-supported Type III PKS scaffold-biosynthesis gene.
  - reference: https://www.uniprot.org/uniprotkb/Q8KQM3
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:Q8KQM3 is the 367 aa Saccharopolyspora erythraea RppA/rppA
      protein and cross-references EMBL AY078067 protein AAL78053.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAL78053.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AAL78053.1 is the AY078067.1 rppA CDS from the Saccharopolyspora
      erythraea red-brown-pigment locus and is sequence-identical to UniProtKB:Q8KQM3.
- enzyme_id: UniProtKB:Q9FCA7
  enzyme_label: SCO1206
  reaction_id: RHEA:41524
  substrate: CHEBI:57384
  product: CHEBI:18365
  notes: This curates Streptomyces coelicolor A3(2) SCO1206 as the biochemically characterized
    type III PKS that condenses malonyl-CoA to 1,3,6,8-tetrahydroxynaphthalene upstream
    of spontaneous oxidation to flaviolin.
  evidence:
  - reference: DOI:10.1007/s10295-003-0075-8
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Expression and characterization of the type III polyketide synthase 1,3,6,8-tetrahydroxynaphthalene
      synthase from Streptomyces coelicolor A3(2)
    notes: Izumikawa et al. expressed and characterized Streptomyces coelicolor A3(2)
      SCO1206 as the type III PKS that catalyzes malonyl-CoA condensation to 1,3,6,8-tetrahydroxynaphthalene.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002127.3/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0002127.3 names flaviolin and 1,3,6,8-tetrahydroxynaphthalene
      as products of the Streptomyces coelicolor A3(2) AL645882.2 flaviolin locus.
  - reference: https://www.uniprot.org/uniprotkb/Q9FCA7
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Reviewed UniProtKB:Q9FCA7 is the 374 aa Streptomyces coelicolor A3(2) SCO1206
      1,3,6,8-tetrahydroxynaphthalene synthase and annotates EC:2.3.1.233/RHEA:41524
      with PMID:12905073.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAC01488.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept CAC01488.1 is the Streptomyces coelicolor A3(2) SCO1206/2SCG58.06
      putative polyketide synthase CDS and cross-references GOA:Q9FCA7.
