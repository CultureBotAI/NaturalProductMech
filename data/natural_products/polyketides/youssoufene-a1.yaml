biosynthetic_pathway:
- enzyme_label: YsfB/YsfC KS/CLF complex
  proposed: true
  notes: This curates YsfB/QHB92589.1 and YsfC/QHB92590.1 as one of three OUC6819
    type II ketosynthase/chain-length-factor complexes assigned to cinnamoyl-lipid
    skeleton assembly. The exact isolated substrate/product pair is unresolved, so
    enzyme_id is left unfilled while official NCBI accessions ground the subunits.
  evidence:
  - reference: DOI:10.1002/anie.202007777
    evidence_type: PRIMARY_EXPERIMENT
    snippet: YsfB/C, YsfD/E, and YsfJ/K
    notes: Deng et al. used in vivo gene inactivation, in vitro reconstitution, and
      intracellular tagged-carrier-protein tracking to assign the Streptomyces youssoufiensis
      OUC6819 YsfB/YsfC, YsfD/YsfE, and YsfJ/YsfK ketosynthase/chain-length-factor
      complexes to modular assembly of the youssoufene skeleton.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002547.2/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0002547.2 names youssoufene A1 as a product of the Streptomyces
      youssoufiensis OUC6819 MN844187.1 locus and records knock-out support for the
      cluster.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/MN844187.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: youssoufenes biosynthetic gene cluster
    notes: GenBank MN844187.1 is the 20,186 bp Streptomyces youssoufiensis strain
      OUC6819 youssoufenes biosynthetic gene cluster and carries ysfB/QHB92589.1,
      ysfC/QHB92590.1, ysfD/QHB92591.1, ysfE/QHB92592.1, ysfG/QHB92594.1, ysfJ/QHB92597.1,
      and ysfK/QHB92598.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/QHB92589.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: YsfB [Streptomyces youssoufiensis]
