biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0ABZ1Q8A7
  enzyme_label: EamK 10-decarboxylase
  proposed: true
  notes: This curates S. erythrochromogenes NRRL B-2112 IO28_RS0104785/eamK, encoded
    in BGC0001851 as RefSeq WP_245240010.1, as an assayed 10-decarboxylase that contributes
    to komodoquinone B aglycone formation. The native substrate of the decarboxylation
    branch is left unexpanded.
  evidence:
  - reference: DOI:10.1021/acschembio.9b00238
    evidence_type: PRIMARY_EXPERIMENT
    snippet: able to fully convert the substrate
    notes: Grocholski et al. assayed S. erythrochromogenes NRRL B-2112 EamK in vitro
      as an anthracycline 10-decarboxylase and then isolated komodoquinone B from
      S. erythrochromogenes NRRL B-2112 and Streptomyces sp. NRRL S-378.
  - reference: mibig:BGC0001851
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: 10-decarboxylase
    notes: MIBiG BGC0001851 version 4 names komodoquinone B as the exact product of
      the S. erythrochromogenes NRRL B-2112 type II PKS cluster and annotates IO28_RS0104785/eamK
      as a 10-decarboxylase encoded on NZ_JNZG01000006.1.
  - reference: https://www.uniprot.org/uniprotkb/A0ABZ1Q8A7
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Methyltransferase
    notes: Unreviewed UniProtKB:A0ABZ1Q8A7 is a 368 aa S. erythrochromogenes entry
      whose sequence matches the RefSeq WP_245240010.1 product of the BGC0001851 IO28_RS0104785/eamK
      locus.
  - reference: https://www.ncbi.nlm.nih.gov/protein/WP_245240010.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: methyltransferase
    notes: NCBI RefSeq WP_245240010.1 is the 368 aa S. erythrochromogenes protein
      encoded by the IO28_RS0104785 CDS in the BGC0001851 locus.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/NZ_JNZG01000006.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Streptomyces erythrochromogenes strain NRRL B-2112
    notes: RefSeq NZ_JNZG01000006.1 contains IO28_RS0104785 at 201890..202996 and
