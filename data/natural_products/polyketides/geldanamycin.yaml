discussions:
- discussion_id: source-lotus-exclusion-0ec7d4c791d0f6b16a9fdd2b531620e340e238f4025efd85c5ed88ffebc48bf2
  kind: CONTROVERSY
  status: RESOLVED
  prompt: Does DOI:10.1021/NP400889X support occurrence of this structure in NCBITaxon:112175?
  resolution_note: 'LOTUS source triple QTQAWLPCGQOSGP-KSRBKZBZSA-N, NCBITaxon:112175,
    DOI:10.1021/NP400889X is withheld from occurrences; the raw inventory is unchanged.
    PMC3993908 Results and Discussion and Extraction and Isolation identify radicicol
    and pochonin compounds 1-7 from Humicola fuscoatra UCSC108111A. Geldanamycin is
    a structurally unrelated HSP90 inhibitor used in the assay comparison, not a reported
    fungal isolate. Withhold only this unsupported triple; do not infer universal
    fungal absence or change producer claims. See issue #966. Source row SHA256 0ec7d4c791d0f6b16a9fdd2b531620e340e238f4025efd85c5ed88ffebc48bf2.
    Curator: codex; date: 2026-10-14.'
