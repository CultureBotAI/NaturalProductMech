causal_graphs:
- graph_id: geldanamycin-hsp90-binding
  scope: BIOACTIVITY
  description: Geldanamycin binds the N-terminal ATPase domain of human HSP90-alpha.
  nodes:
  - node_id: geldanamycin
    label: geldanamycin
    node_type: COMPOUND
    identifier: CHEBI:5292
    grounding_status: GROUNDED
  - node_id: hsp90_alpha
    label: human heat shock protein HSP 90-alpha
    node_type: PROTEIN
    identifier: UniProtKB:P07900
    grounding_status: GROUNDED
  edges:
  - subject: geldanamycin
    predicate: binds
    object: hsp90_alpha
    notes: RCSB PDB 1YET contains the GDM ligand with the exact QTQAWLPCGQOSGP-KSRBKZBZSA-N
      structure. RCSB/SIFTS maps the 228-residue deposited chain A sequence to UniProtKB:P07900
      positions 9-236 (accessed 2026-10-14). Comparison with the current UniProt sequence
      shows deposited T versus reference S at position 63; the cause is not adjudicated
      and this is not an assertion of an engineered mutation. The paper abstract describes
      the structural domain as residues 9-232, distinct from the deposited construct-to-reference
      mapping.
    evidence:
    - reference: DOI:10.1016/S0092-8674(00)80203-2
      evidence_type: PRIMARY_EXPERIMENT
      snippet: 'Crystal structure of an Hsp90-geldanamycin complex: targeting of a
        protein chaperone by an antitumor agent.'
      notes: Stebbins et al. solved PDB 1YET with geldanamycin in the human HSP90
        N-terminal geldanamycin-binding domain.
    - reference: https://data.rcsb.org/rest/v1/core/polymer_entity/1YET/1
      evidence_type: DATABASE_ASSERTION
      notes: SIFTS maps entity1 residues1-228 to P07900 starting at9. Current sequence
        comparison and registry receipts are retained in reviews/evidence/20261014-geldanamycin/;
        this mapping evidence is separate from the primary binding experiment.
