biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:O87605
  enzyme_label: PikC cytochrome P450 monooxygenase
  reaction_id: RHEA:39887
  substrate: CHEBI:29649
  product: CHEBI:29665
  notes: PikC hydroxylates the 14-membered macrolide narbomycin to form pikromycin.
    RHEA:39887 grounds the same monooxygenase reaction using the corresponding protonated
    ChEBI species.
  evidence:
  - reference: DOI:10.1016/S1074-5521(98)90293-9
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Purified PikC effectively converts YC-17 into methymycin and neomethymycin
      and narbomycin into pikromycin in vitro
    notes: Xue et al. inactivated pikC in Streptomyces venezuelae, observed loss of
      hydroxylated macrolides with YC-17 and narbomycin accumulation, and showed that
      purified recombinant PikC converts narbomycin into pikromycin in vitro.
  - reference: https://www.uniprot.org/uniprotkb/O87605
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:O87605 is the 416 aa Streptomyces venezuelae PikC/PicK
      cytochrome P450 monooxygenase, has gene name pikC, annotates EC 1.14.15.33,
      and cross-references the RHEA:39887 narbomycin-to-pikromycin reaction.
  - reference: RHEA:39887
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: RHEA:39887 grounds PikC-catalyzed hydroxylation of narbomycin(1+) to pikromycin(1+)
      through EC 1.14.15.33; this record uses neutral CHEBI:29649 and CHEBI:29665
      for the corresponding NaturalProductMech structures.
