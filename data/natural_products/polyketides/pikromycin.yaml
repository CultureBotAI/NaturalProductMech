biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9ZGH7
  enzyme_label: DesVII macrolide glycosyltransferase
  substrate: CHEBI:29650
  product: CHEBI:29649
  notes: DesVII (UniProtKB:Q9ZGH7, AAC68677.1, AF079762.1:1475..2755, EC 2.4.1.277
    / EC 2.4.1.278) functions in an obligate (alpha-beta)3 complex with the auxiliary
    protein DesVIII (UniProtKB:Q9ZGH8, AAC68676.1, AF079762.1:119..1327) to transfer
    the D-desosamine moiety from dTDP-alpha-D-desosamine (CHEBI:27948) onto the 14-membered
    macrolactone aglycone narbonolide (CHEBI:29650) to form narbomycin (CHEBI:29649),
    the immediate substrate of PikC.
  evidence:
  - reference: DOI:10.1021/ja049967j
    evidence_type: PRIMARY_EXPERIMENT
    snippet: DesVII has already been proven responsible for the coupling of TDP-D-desosamine
      with both 10-deoxymethynolide and narbonolide in S. venezuelae, and it has was
      also shown under in vitro conditions to require an additional protein, DesVIII,
      for full activity
    notes: Borisova et al. (PMID:15161264) purified Streptomyces venezuelae DesVII
      and DesVIII and demonstrated in vitro that DesVII requires the auxiliary protein
      DesVIII to transfer D-desosamine from TDP-D-desosamine onto narbonolide and
      10-deoxymethynolide.
  - reference: DOI:10.1021/bi1007657
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Together, DesVII and DesVIII serve as the glycosylation catalyst necessary
      to construct the bacterial macrolide antibiotics methymycin, neomethymycin,
      narbomycin, and pikromycin in Streptomyces venezuelae
    notes: Borisova and Liu (PMID:20695498) characterized the tight (alpha-beta)3
      heterohexameric Streptomyces venezuelae DesVII/DesVIII complex and showed that
      coexpression and complex formation with DesVIII are required for robust DesVII
      macrolide glycosyltransferase activity.
  - reference: DOI:10.1016/j.gene.2006.08.021
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Our results demonstrated that DesVIII is needed to assist the reaction
      deployed by the glycosyltransferase DesVII in vivo
    notes: Hong et al. (PMID:17049185) demonstrated by in vivo bioconversion in Streptomyces
      lividans that DesVIII is required alongside DesVII to glycosylate narbonolide
      to narbomycin and 10-deoxymethynolide to YC-17.
  - reference: DOI:10.1073/pnas.95.21.12111
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Dedicated to the biosynthesis of dTDP-D-desosamine, an essential deoxysugar
      component in the macrolide antibiotics methymycin, neomethymycin, narbomycin,
      and pikromycin
    notes: Xue et al. (PMID:9770448) sequenced the Streptomyces venezuelae ATCC 15439
      pik/des cluster (AF079762.1 / BGC0000898) and identified desVII and desVIII
      in the desosamine biosynthesis and transfer locus.
  - reference: https://www.uniprot.org/uniprotkb/Q9ZGH7
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: Reviewed Swiss-Prot UniProtKB:Q9ZGH7 (426 aa, gene desVII) in Streptomyces
      venezuelae cross-references EMBL AF079762 protein AAC68677.1 and annotates macrolide
      glycosyltransferase activity requiring DesVIII (UniProtKB:Q9ZGH8) to convert
      narbonolide and dTDP-alpha-D-desosamine to narbomycin.
  - reference: https://www.uniprot.org/uniprotkb/Q9ZGH8
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: Reviewed Swiss-Prot UniProtKB:Q9ZGH8 (402 aa, gene desVIII) in Streptomyces
      venezuelae cross-references EMBL AF079762 protein AAC68676.1 and annotates the
      glycosyltransferase auxiliary protein required for DesVII activity.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF079762.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: GenBank AF079762.1 (MIBiG BGC0000898) annotates desVIII at CDS 119..1327
      (protein_id AAC68676.1) and desVII at CDS 1475..2755 (protein_id AAC68677.1).
- step_number: 2
  enzyme_id: UniProtKB:O87605
  enzyme_label: PikC cytochrome P450 monooxygenase
  reaction_id: RHEA:39887
  substrate: CHEBI:29649
  product: CHEBI:29665
  notes: PikC hydroxylates the 14-membered macrolide narbomycin to form pikromycin.
    RHEA:39887 grounds the same monooxygenase reaction using the corresponding protonated
    ChEBI species.
  evidence:
  - reference: DOI:10.1016/S1074-5521(98)90293-9
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Purified PikC effectively converts YC-17 into methymycin and neomethymycin
      and narbomycin into pikromycin in vitro
    notes: Xue et al. inactivated pikC in Streptomyces venezuelae, observed loss of
      hydroxylated macrolides with YC-17 and narbomycin accumulation, and showed that
      purified recombinant PikC converts narbomycin into pikromycin in vitro.
  - reference: https://www.uniprot.org/uniprotkb/O87605
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:O87605 is the 416 aa Streptomyces venezuelae PikC/PicK
      cytochrome P450 monooxygenase, has gene name pikC, annotates EC 1.14.15.33,
      and cross-references the RHEA:39887 narbomycin-to-pikromycin reaction.
  - reference: RHEA:39887
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: RHEA:39887 grounds PikC-catalyzed hydroxylation of narbomycin(1+) to pikromycin(1+)
      through EC 1.14.15.33; this record uses neutral CHEBI:29649 and CHEBI:29665
      for the corresponding NaturalProductMech structures.
