biosynthetic_pathway:
- step_number: 1
  enzyme_label: PgaY/PgaF and PgaL angucyclinone cyclization module
  proposed: true
  notes: This partial pathway entry captures two exact Streptomyces sp. PGA64 cyclization/aromatization
    proteins from the demonstrated BGC0000262 angucycline locus. The exact nascent
    polyketide intermediate and the final oxidation from the UWM6 branch toward rabelomycin
    are left unexpanded, so the module rather than a single substrate-to-product reaction
    is curated.
  evidence:
  - reference: DOI:10.1128/AAC.47.4.1291-1296.2003
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Engineering anthracycline biosynthesis toward angucyclines.
    notes: Metsa-Ketela et al. engineered early polyketide assembly toward angucycline
      products with Streptomyces sp. PGA64 genes; MIBiG cites this paper for the exact
      BGC0000262 rabelomycin row.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000262.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: MIBiG BGC0000262.5 lists rabelomycin as a Streptomyces sp. PGA64 product
      of the AY034378.2 locus and marks the locus with enzymatic-assay, heterologous-expression,
      and gene-expression-correlated support.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAK57524.1
    evidence_type: DATABASE_ASSERTION
    snippet: angucyclinone cyclase
    retrieved_on: '2026-09-28'
    notes: NCBI GenPept AAK57524.1 is the 109 aa Streptomyces sp. PGA64 angucyclinone
      cyclase encoded on AY034378.2. MIBiG names the same protein pgaF; the GenBank
      product label is PgaY.
  - reference: https://www.uniprot.org/uniprotkb/Q93LY5
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: UniProtKB:Q93LY5 is the unreviewed 109 aa Streptomyces sp. PGA64 entry
      that cross-references EMBL AY034378 with ProteinId AAK57524.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAK57529.1
    evidence_type: DATABASE_ASSERTION
    snippet: cyclase/aromatase
    retrieved_on: '2026-09-28'
    notes: NCBI GenPept AAK57529.1 is the 314 aa Streptomyces sp. PGA64 PgaL cyclase/aromatase
      encoded on AY034378.2.
  - reference: https://www.uniprot.org/uniprotkb/Q93LY0
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: UniProtKB:Q93LY0 is the unreviewed 314 aa Streptomyces sp. PGA64 entry
      that cross-references EMBL AY034378 with ProteinId AAK57529.1.
