    object: pd4
    notes: EMSA with His-SimReg1, 50 ng DNA in 20 uL, 25 min at room temperature;
      20 mM Tris-HCl pH 8, 1 mM each EDTA/DTT/MgCl2, 100 mM KCl and 10% glycerol,
      4.5% native gel at 4 C, ethidium-bromide readout. Figure 6 tests 1.8 and 4.5
      ug protein against a no-protein lane; not every fragment shifts equally at both
      doses. This does not measure a footprint, Kd, transcriptional direction or native
      enzyme activity. The methods report 513 bp. Literal Table 2 primers yield a
      native coverage model of 516 bp (530 bp including unmatched 5-prime tails).
      SR1D4F/R; native bases 70099..70614 include 180 bp simReg1 and 14 bp simD4.
      This fragment differs from the GusA-reporter insert. Native-primer mappings
      are curator reconstructions, not sequenced assay constructs or corrected source
      values.
