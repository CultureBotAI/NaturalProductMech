  - subject: mutant
    predicate: disrupts
    object: gene
    notes: The hyg cassette was inserted at the unique BsaAI site within simReg1 carried
      on a reported 4.3-kb BamHI fragment, then transferred through pKC1139 and double
      crossover selection (39 C for 3 days, subsequent loss of apramycin resistance).
      This is an insertion, not a clean whole-gene deletion. Southern signals are
      reported as 4.3 kb in wild type and 6.3 kb in mutant. Results name a KpnI probe
      from pKCEsimR1; Figure 4 caption instead names a 1.4-kb SmaI probe. Native AF324838.2
      BamHI reconstruction spans 4576 bp between 0-based cuts 67163 and 71739, with
      one internal BsaAI cut at 70167. This discrepancy is not silently corrected
      or treated as a sequenced mutant/plasmid.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods, results and Figure 4.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: BamHI/BsaAI native-locus reconstruction; not an observed construct sequence.
  - subject: mutant
    predicate: has_assay_phenotype
    object: loss
    notes: 'Native S. antibioticus Tu6040 production assay: TSB preculture for 2 days
      at 30 C, 5 mL into 100 mL NL5 for 5 days at 30 C; ethyl-acetate extraction and
      methanol reconstitution, HPLC/TLC analysis (methods specify HPLC-MS). NL5 includes
      glycerol 25 g/L and L-glutamine 5.84 g/L, pH 7.3. Antibiotic amounts were normalized
      to dry biomass; the methods state at least three independent production experiments.
      These results concern source-assigned simocyclinones/precursors, not a separately
      quantified yield of chemically pure D8 or all possible culture conditions. Growth
      and morphology were reported similar to wild type. No detection is not a quantified
      zero or proof of an isolated catalytic step.'
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results and Figure 5a.
      snippet: no simocyclinone and its precursors
  - subject: rescue
    predicate: reportedly_carries_intact_copy_of
    object: gene
    notes: Table 1 describes mutant plus pSSimR1-1, containing native-promoter simReg1
      in integrative pSET152. Methods derive it via a 2.3-kb BamHI segment and a reported
      1.4-kb SmaI segment. Native-locus SmaI cuts at 0-based 68877/70373 span 1496
      bp and include full simReg1 plus 476 bp of simD2, not a second complete simD2
      CDS. This reconstruction does not establish the exact cloning junctions, functional
      neighbor rescue or the experimental plasmid sequence.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods and Table 1.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Native SmaI interval and CDS overlap, not a sequenced rescue construct.
  - subject: rescue
    predicate: reportedly_restores
    object: restored
    notes: 'Native S. antibioticus Tu6040 production assay: TSB preculture for 2 days
      at 30 C, 5 mL into 100 mL NL5 for 5 days at 30 C; ethyl-acetate extraction and
      methanol reconstitution, HPLC/TLC analysis (methods specify HPLC-MS). NL5 includes
      glycerol 25 g/L and L-glutamine 5.84 g/L, pH 7.3. Antibiotic amounts were normalized
      to dry biomass; the methods state at least three independent production experiments.
      These results concern source-assigned simocyclinones/precursors, not a separately
      quantified yield of chemically pure D8 or all possible culture conditions. The
      text reports mutant rescue comparable to wild type, but the same paragraph names
      wild type as the recipient and cites Figure 5b, whose caption identifies wild
      type versus wild type with an extra copy. Keep the text-reported rescue, not
      an independently illustrated rescue comparison or universal exclusion of polar
      effects. No matched empty-vector production control is shown in the inspected
      article and supplements.'
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Complementation paragraph, Table 1 and conflicting Figure 5b caption.
