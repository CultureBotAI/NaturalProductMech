  edges:
  - subject: reg_plasmid
    predicate: is_reported_to_express
    object: simreg1
    notes: Native simReg1 PCR product was cloned HindIII/BamHI in pUWL-oriT under
      constitutive ermE promoter control. Literal primers cover native bases 69486..70300
      (815 bp; 832 with unmatched tails), including the complete native CDS. The source
      calls it 0.8 kb. No His-tag or codon-optimized construct is assigned to this
      reporter experiment; the whole experimental plasmid sequence is not established.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Reporter-construction methods and Table 2.
    - reference: https://www.ncbi.nlm.nih.gov/protein/AAK06808.1
      evidence_type: DATABASE_ASSERTION
      notes: Native S. antibioticus Tue6040 simReg1, AF324838.2:69523..70278(+), AAK06808.1,
        251 aa; GTG start. This is the native parent, not a deposited sequence of
        an engineered expression construct.
    - reference: https://www.uniprot.org/uniprotkb/Q9AMH3
      evidence_type: DATABASE_ASSERTION
      notes: Active unreviewed Q9AMH3; simReg1 gene and EMBL AF324838/AAK06808.1 cross-reference.
        Taxon 1890; entry version 130, sequence version 1; inspected 2026-10-04. Protein
        existence remains predicted in this entry. Its automatic RegX3 name does not
        establish RegX3 physiology.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Native CDS, GenPept, UniProt and BGC0001072.5 protein sequences agree
        exactly; CDS-aware table-11 DNA translations agree. This is a protein-level
        comparison, not a demonstrated identity of every base of the loci or the alternate
        AF322256.1 cluster.
  - subject: with_reg
    predicate: carries
    object: reg_plasmid
    notes: S. lividans 1326 is the heterologous reporter host, not the native Tu6040
      simocyclinone producer. Transfer of the regulatory construct does not establish
      heterologous synthesis of simocyclinone D8.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 1, reporter results and Figure 9 strain 3.
  - subject: with_reg
    predicate: carries
    object: reporter_plasmid
    notes: The putative simD4 promoter fragment was cloned XbaI/KpnI upstream of gusA
      in pGUS. The source reports 0.5 kb; literal reporter primers map native bases
      70071..70570 (500 bp, 518 with unmatched tails), including 208 bp of simReg1.
      This differs from the PD4 EMSA fragment and does not imply transfer of a complete
      additional simReg1 gene.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods, Table 2 and Figure 9.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF324838.2
      evidence_type: CURATOR_INFERENCE
      notes: Literal reporter-primer/native-locus reconstruction, not a sequenced
        expression plasmid.
  - subject: without_reg
    predicate: carries
    object: reporter_plasmid
    notes: Reporter-only strain is the comparison for adding pUWLsimReg1; it is not
      a matched pUWL empty-vector strain. The pGUS controls instead address promoterless
      reporter background.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 1 and Figure 9 strain 1.
  - subject: with_reg
    predicate: increases_reporter_readout_to
    object: activity
    notes: Relative to reporter-only S. lividans 1326, source-reported GusA activity
      increases from 3.3 +/- 0.24 to 6.25 +/- 0.43 munits/mg (Figure 9 axis), approximately
      1.9-fold. TSB preculture 2 days then 5 days at 30 C; lysates assayed with p-nitrophenyl-beta-D-glucuronide
      at 37 C, absorbance 415 nm every minute for 20 minutes. Error type and reporter
      replicate count are not specified here; do not transfer the production assay's
      replicate count. This is a promoter-reporter readout, not direct native SimD4
      enzyme activity, an RNA-polymerase interaction assay or a demonstration of activation
      at every bound region.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Reporter methods/results and Figure 9, including plotted units.
      snippet: the activity was 6.25
  - subject: controls
    predicate: have_assay_phenotype
    object: background
    notes: Promoterless pGUS strains with and without pUWLsimReg1 show roughly 0.25
      +/- 0.06 munits/mg in the same assay. These controls support promoter-dependent
      reporter output, not the assertion that SimReg1 binds only simD4 or that all
      host-mediated effects are excluded.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Reporter results and Figure 9 strains 2 and 4.
  - subject: controls
    predicate: provides_promoterless_controls_for
    object: activity
    notes: Figure 9 compares promoterless pGUS strains, with and without pUWLsimReg1
      (strains 2 and 4), to PD4-gusA reporter strains without and with regulator (strains
      1 and 3). This edge records the experimental comparison linking background controls
      to the reported activation readout; it is not a biochemical causal interaction
      or a matched pUWL empty-vector control.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Reporter methods/results, Table 1 and Figure 9.
