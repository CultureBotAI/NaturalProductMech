- graph_id: simocyclinone-d8-simreg1-heterologous-promoter-reporter
  scope: BIOSYNTHESIS
  description: 'SimReg1-dependent activation of a simD4-region gusA reporter in S.
    lividans 1326. Heterologous transcriptional reporter output is distinct from native
    SimD4 protein abundance, ketoreductase activity and activation of every EMSA-positive
    region (review #534).'
