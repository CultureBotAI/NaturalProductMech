  edges:
  - subject: his
    predicate: has_reported_native_parent
    object: simreg1
    notes: Synthetic simReg1s from pMA-simR1 was amplified with SSR1F/R, cloned NcoI/EcoRI
      into pET21d as pETSR1c-15, and expressed in E. coli BL21(DE3)pLysS. His-resin
      purification and SDS-PAGE appear in methods and supplement 2. Full engineered
      DNA/protein sequence and tag junctions are not established here; canonical Q9AMH3
      denotes only the native parent. The apparent band near 35 kDa is not an exact
      mass/identity measurement or proof of absolute purity. Predicted REC 15-123
      and DNA-binding 167-239 domains, three of six conserved PhoB residues and no
      cluster kinase do not prove independence from phosphorylation or rule out an
      external kinase.
    evidence:
    - reference: DOI:10.1186/2191-0855-2-1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods, Figure 3 and supplement 2.
