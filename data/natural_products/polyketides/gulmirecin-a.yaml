    not a demonstrated enzyme assay. Its product is an aglycon intermediate, not the
    fully decorated gulmirecin A owner. No subsequent glycosylation/acylation route
    or ordered biosynthetic_pathway is asserted. The intermediate and process identifiers
    remain ungrounded; product double-bond configurations are unspecified and are
    not completed from the substrate. Only the 2014 paper abstract was inspected;
    it does not name GulG, and supplement access returned 403. No primary experimental
