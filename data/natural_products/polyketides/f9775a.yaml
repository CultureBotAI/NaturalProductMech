biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q5AUX1
  enzyme_label: OrsA
  reaction_id: RHEA:62973
  product: CHEBI:16162
  notes: This curates the Aspergillus nidulans FGSC A4 non-reducing polyketide synthase
    OrsA from the BGC0000057/AACD01000135.1 route; OrsA condenses acetyl-CoA with
    three malonyl-CoA units to form o-orsellinate, the branch precursor for F-9775
    A biosynthesis.
  evidence:
  - reference: DOI:10.1039/b904541d
    evidence_type: PRIMARY_EXPERIMENT
    snippet: only two additional genes
    notes: Sanchez et al. used targeted deletions in Aspergillus nidulans and found
      that OrsA is sufficient for orsellinic acid biosynthesis, while the adjacent
      AN7911.4/orsB and AN7912.4/orsC genes are additionally required for F-9775 A
      and B synthesis.
  - reference: https://www.uniprot.org/uniprotkb/Q5AUX1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: Reviewed UniProtKB:Q5AUX1 is the Aspergillus nidulans FGSC A4 OrsA orsellinic
      acid synthase, length 2103 aa, annotates the left-to-right physiological RHEA:62973
      reaction, and cross-references EMBL AACD01000135 protein EAA59563.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/EAA59563.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: NCBI GenPept EAA59563.1 is locus_tag AN7909.2 from the BGC0000057 AACD01000135.1
      Aspergillus nidulans FGSC A4 locus and maps to reviewed UniProtKB:Q5AUX1.
- step_number: 2
  enzyme_label: OrsB/OrsC F-9775 tailoring module
  product: naturalproductmech:mibig-1a2493f8d7
  proposed: true
  notes: This curates the genetically supported OrsB/OrsC branch that diverts the
    OrsA orsellinic acid product toward F-9775 A and B. The exact isolated substrate,
    intermediates and individual OrsB and OrsC reactions remain unresolved, so this
    two-protein step is marked proposed and leaves enzyme_id empty.
  evidence:
  - reference: DOI:10.1039/b904541d
    evidence_type: PRIMARY_EXPERIMENT
    snippet: only two additional genes
    notes: Sanchez et al. used targeted deletions in Aspergillus nidulans and found
      that OrsA is sufficient for orsellinic acid biosynthesis, while the adjacent
      AN7911.4/orsB and AN7912.4/orsC genes are additionally required for F-9775 A
      and B synthesis.
