      retrieved_on: '2026-10-02'
      notes: MITE0000024 is active, links XanH to UniProtKB:I1SKW0, GenPept ADE22292.1
        and MIBiG BGC0000279, lists FAD as an organic cofactor, and represents an
        in vitro-supported chlorination reaction in the xantholipin biosynthetic pathway.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0000279.5/BGC0000279.gbk
