definition: An organic heterotricyclic compound that is 3a,4,8,9a-tetrahydro-2<em>H</em>-furo[3,2-<em>g</em>][2]benzopyran-2,9(3<em>H</em>)-dione
  that is substituted at positions 3, 6, and 9a by hexanoyl, (1<i>E</i>)-prop-1-en-1-yl
  and methyl groups, respectively (the 3<i>S</i>,3a<i>R</i>,9a<i>R</i> diastereoisomer).
  One of the azaphilonoid pigments in extracts of <em>Monascus pilosus</em>-fermented
  rice (red-mould rice), it is a potent inhibitor of carcinogenesis measured against
  chemical- or UV-initiated, phorbol-promoted mouse skin tumours.
