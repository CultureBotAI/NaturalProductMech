definition: An organic heterotricyclic compound that is 3a,4,8,9a-tetrahydro-2H-furo[3,2-g][2]benzopyran-2,9(3H)-dione
  that is substituted at positions 3, 6, and 9a by hexanoyl, (1E)-prop-1-en-1-yl and
  methyl groups, respectively (the 3S,3aR,9aR diastereoisomer). One of the azaphilonoid
  pigments in extracts of Monascus pilosus-fermented rice (red-mould rice), it is
  a potent inhibitor of carcinogenesis measured against chemical- or UV-initiated,
  phorbol-promoted mouse skin tumours.
