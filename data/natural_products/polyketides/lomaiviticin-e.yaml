biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A4X724
  enzyme_label: Strop_2223 beta-ketoacyl synthase
  proposed: true
  notes: This curates the S. tropica CNB-440 Strop_2223/ABP54674.1 beta-ketoacyl synthase
    as a knockout-supported type II PKS enzyme in the ST_pks2/lom scaffold-biosynthesis
    branch that produces lomaiviticins, including lomaiviticin E. UniProtKB A4X724
    resolves to Strop_2223 in the CNB-440 genome; the exact Strop_2223 substrate/product
    pair and its minimal-PKS partner are left unresolved.
  evidence:
  - reference: DOI:10.1002/cbic.201300147
    evidence_type: PRIMARY_EXPERIMENT
    snippet: lomaiviticins A, D and E
    notes: Kersten et al. inactivated the S. tropica CNB-440 strop2223 beta-ketosynthase,
      found that the mutant extract was inactive in the DNA-interference assay, and
      used LC-MS profiling of wild-type and mutant extracts to identify lomaiviticins,
      including lomaiviticin E, as ST_pks2/lom products.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000241.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Scaffold biosynthesis
    notes: MIBiG BGC0000241.5 lists lomaiviticin E among the Salinispora tropica CNB-440
      products and annotates Strop_2223/ABP54674.1 as a beta-ketoacyl synthase with
      scaffold-biosynthesis function and knockout evidence.
  - reference: https://www.ncbi.nlm.nih.gov/protein/ABP54674.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: beta-ketoacyl synthase
    notes: NCBI Protein ABP54674.1 is the 423 aa Salinispora tropica CNB-440 Strop_2223
      product.
  - reference: https://www.uniprot.org/uniprotkb/A4X724
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Beta-ketoacyl-acyl-carrier-protein synthase I
    notes: UniProtKB A4X724 resolves to the 423 aa S. tropica CNB-440 Strop_2223 entry
      and cross-references the CP000667 chromosome.
