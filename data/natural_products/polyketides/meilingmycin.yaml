    predicate: is hydroxylated by
    object: meie
    notes: MITE reaction 2 represents MeiE hydroxylation of the C5-O-methylated meilingmycin/milbemycin
      scaffold. The exact substrate and product are left as local intermediates because
      MITE supplies reaction structures but no stable names for them.
    evidence:
    - reference: https://mite.bioinformatics.nl/repository/MITE0000010
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      snippet: Heterocyclization, Hydroxylation
      notes: MITE0000010 is active, lists three knock-out-supported MeiE reaction
        rows on meilingmycin/milbemycin scaffolds, assigns two rows to hydroxylation
        and one row to heterocyclization, lists heme and iron as cofactors, links
        each reaction row to DOI:10.1128/AEM.02262-09, and links MeiE to UniProtKB:Q6YL50,
        GenPept AAM97314.1, and MIBiG BGC0000093.
    - reference: DOI:10.1128/AEM.02262-09
      evidence_type: PRIMARY_EXPERIMENT
      notes: He et al. identified meiE as an aveE homolog in the meilingmycin gene
        cluster, annotated MeiE as a cytochrome P450 hydroxylase, and proposed that
        MeiE oxidizes the TE-released, cyclized polyketide to generate a C8-C6 furan
        ring, a C8 hydroxyl group, or C8 and C6 hydroxyl groups.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0000093.5/BGC0000093.gbk
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: MIBiG BGC0000093.5 places meiE/AAM97314.1 inside the active Streptomyces
        nanchangensis meilingmycin biosynthetic gene cluster and links the CDS to
        MITE0000010 at 100% identity.
    - reference: https://www.uniprot.org/uniprotkb/Q6YL50
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: UniProtKB:Q6YL50 resolves as a 459 aa Streptomyces nanchangensis meiE
        cytochrome P450 hydroxylase TrEMBL entry, cross-references EMBL FJ952082 protein
        AAM97314.1, annotates heme as a cofactor, and carries heme-binding and monooxygenase
        cross-references.
    - reference: https://www.ncbi.nlm.nih.gov/protein/AAM97314.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: NCBI Protein AAM97314.1 is the Streptomyces nanchangensis MeiE cytochrome
        P450 hydroxylase encoded by meiE at complement(FJ952082.1:58480..59859).
