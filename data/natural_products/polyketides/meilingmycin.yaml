  edges:
  - subject: c5_hydroxy_meilingmycin_intermediate
    predicate: is C5-O-methylated by
    object: meid
    notes: MITE represents MeiD methylation on the meilingmycin/milbemycin scaffold.
      The exact substrate and product are left as local intermediates because MITE
      supplies reaction structures but no stable names for them.
    evidence:
    - reference: https://mite.bioinformatics.nl/repository/MITE0000009
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      snippet: Methylation
      notes: MITE0000009 is active, lists a knock-out study evidence code, assigns
        a methylation reaction on the meilingmycin/milbemycin scaffold to MeiD, lists
        SAM as an organic cofactor, links the reaction row to DOI:10.1128/AEM.02262-09,
        and links MeiD to UniProtKB:D6C4C6, GenPept ADC45587.1, and MIBiG BGC0000093.
    - reference: DOI:10.1128/AEM.02262-09
      evidence_type: PRIMARY_EXPERIMENT
      notes: He et al. localized meiD downstream of the PKS genes encoding the loading
        and first two elongation modules, described MeiD as a C5-O-methyltransferase,
        and showed by gene deletion that meiD is required for production of C5-methylated
        meilingmycins D and E.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0000093.5/BGC0000093.gbk
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: MIBiG BGC0000093.5 places meiD/ADC45587.1 inside the active Streptomyces
        nanchangensis meilingmycin biosynthetic gene cluster and links the CDS to
        MITE0000009 at 100% identity.
    - reference: https://www.uniprot.org/uniprotkb/D6C4C6
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: UniProtKB:D6C4C6 resolves as a 286 aa Streptomyces nanchangensis meiD
        C5-O-methyltransferase TrEMBL entry, cross-references EMBL FJ952082 protein
        ADC45587.1, and carries SAM-dependent methyltransferase domain cross-references.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ADC45587.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: NCBI Protein ADC45587.1 is the Streptomyces nanchangensis MeiD C5-O-methyltransferase
        encoded by meiD at FJ952082.1:167087..167947.
