biosynthetic_pathway:
- step_number: 10
  enzyme_id: UniProtKB:Q00441
  enzyme_label: EryF 6-deoxyerythronolide B hydroxylase
  reaction_id: RHEA:40299
  substrate: CHEBI:16089
  product: CHEBI:27977
  notes: 'Partial tailoring view: EryF hydroxylates 6-deoxyerythronolide B to erythronolide
    B; uncurated glycosylation and deoxysugar steps between erythronolide B and erythromycin
    D are intentionally omitted.'
  evidence:
  - reference: DOI:10.1128/jb.174.3.725-735.1992
    evidence_type: PRIMARY_EXPERIMENT
    snippet: EryF hydroxylated a substrate with a turnover number of 53 min-1
    notes: UniProtKB:Q00441 resolves to eryF/SACE_0730 from Saccharopolyspora erythraea
      NRRL 2338 and links this reaction to RHEA:40299.
- step_number: 20
  enzyme_id: UniProtKB:P48635
  enzyme_label: EryK erythromycin C-12 hydroxylase
  reaction_id: RHEA:32631
  substrate: CHEBI:63677
  product: CHEBI:64258
  notes: EryK hydroxylates erythromycin D to erythromycin C. The erythromycin B branch
    is excluded here because EryK does not accept erythromycin B efficiently.
  evidence:
  - reference: DOI:10.1021/bi00006a006
    evidence_type: PRIMARY_EXPERIMENT
    snippet: preference of the enzyme for ErD over the alternative C-12 hydroxylase
      substrate ErB
    notes: UniProtKB:P48635 resolves to eryK/SACE_0713 from Saccharopolyspora erythraea
      NRRL 2338 and links this reaction to RHEA:32631.
- step_number: 30
  enzyme_id: UniProtKB:A4F7P5
  enzyme_label: EryG erythromycin 3''-O-methyltransferase
  reaction_id: RHEA:32647
  substrate: CHEBI:64258
  product: CHEBI:64268
  notes: EryG methylates erythromycin C(1+) at the mycarosyl 3-O position to produce
    erythromycin A(1+) in RHEA:32647; this NaturalProductRecord remains grounded to
    neutral erythromycin A, CHEBI:42355.
  evidence:
  - reference: DOI:10.1128/jb.172.5.2541-2546.1990
    evidence_type: PRIMARY_EXPERIMENT
    snippet: eryG codes for the structural gene of this enzyme
    notes: UniProtKB:A4F7P5 resolves to eryG/SACE_0728 from Saccharopolyspora erythraea
      NRRL 2338 and links this reaction to RHEA:32647.
