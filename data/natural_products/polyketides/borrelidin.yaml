biosynthetic_pathway:
- enzyme_id: UniProtKB:Q70HZ6
  enzyme_label: BorI cytochrome P450
  proposed: true
  notes: 'Database-proposed BorI aldoxime-to-nitrile function in the borrelidin pathway.
    MITE''s literal aldoxime and nitrile models are not grounded to this exact owner:
    the nitrile example conflicts at two specified tetrahedral centers and omits additional
    stereochemistry. The former exact product assignment and step number 5 are withdrawn;
    reaction-list position is not verified pathway order. No substrate/product CURIE,
    balanced reaction, isolated BorI assay or corrected source structure is asserted.
    The prior primary and native-sequence citations are preserved on the graph''s
    broader BorI participation edge, not used to validate the conflicting chemical
    model. BorJ chemical curation remains on hold.'
  evidence:
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000188
    evidence_type: DATABASE_ASSERTION
    snippet: Nitrile-formation via dehydation aldoxime
    retrieved_on: '2026-10-01'
    notes: MITE0000188 assigns the proposed aldoxime-to-nitrile dehydration to BorI
      (UniProtKB:Q70HZ6, CAE45673.1, BGC0000031). This retained database citation
      and exact snippet describe a source model, not an experimentally established
      conversion of the exact owner. The 2026-10-08 pinned re-audit below finds two
      conflicting specified tetrahedral centers as well as missing stereochemistry
      in its product. Its literal nitrile model is therefore represented separately,
      with no exact product identifier.
  - reference: https://github.com/mite-standard/mite_data/blob/6eacd913b2036376031072f69cbb33908f132998/mite_data/data/MITE0000188.json
    evidence_type: CURATOR_INFERENCE
    retrieved_on: '2026-10-08'
    notes: 'RDKit 2026.03.5 re-audit of the pinned MITE0000188 version 3 literal non-intermediate
      nitrile product gives OJCKRNPLOZHAOU-RQKVFPBWSA-N, not this owner''s OJCKRNPLOZHAOU-UGKRXNSESA-N.
      Full-connectivity mapping is unique, but the chiral match fails: the macrocycle
      ester-bearing center and the cyclopentane carboxyl-bearing center have opposite
      specified configurations. In the exact source/owner parsed SMILES, source atom
      14 (R) maps to owner atom 8 (S), and source atom 19 (S) maps to owner atom 4
      (R), using zero-based atom indices. The source also omits the cyclopentane attachment-center
      configuration and both alkene configurations. These are not merely unspecified
      stereochemistry or an exact chemical join. The source structures are neither
      inverted nor completed, and no biological epimerization is inferred. The graph''s
      MITE product node remains distinct from the exact borrelidin owner; terminal
      conversion of that owner is not established by this database model. MITE experiment
      codes are database annotations, not newly inspected primary results.'
