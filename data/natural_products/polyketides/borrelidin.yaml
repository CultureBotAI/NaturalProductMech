  - subject: bori
    predicate: participates_in_biosynthesis_of
    object: borrelidin
    notes: Retains the previously curated BorI pathway-participation evidence and
      native-reference grounding. The primary-paper account concerns genetic/heterologous
      pathway involvement, including BorI/BorJ co-expression, not a verified BorI-alone
      conversion of MITE's literal aldoxime model into this exact owner. The four
      retained EvidenceItems below are unchanged from prior curation. The inaccessible
