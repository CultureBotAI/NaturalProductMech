biosynthetic_pathway:
- step_number: 5
  enzyme_id: UniProtKB:Q70HZ6
  enzyme_label: BorI cytochrome P450
  product: naturalproductmech:mibig-af79f8ac64
  proposed: true
  notes: MITE assigns the final aldoxime-to-nitrile dehydration in the proposed BorI/BorJ/BorK
    nitrile-forming pathway to BorI. The ungrounded aldoxime pre-borrelidin substrate
    is the immediate precursor in MITE0000188; earlier oxidation and amination chemistry
    are outside this single terminal-step graph.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2004.04090.x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: co-expressing borI and borJ in Streptomyces albus J1074
    notes: Olano et al. showed that borI and borJ insertional mutants no longer produced
      borrelidin, that a borI-minus mutant accumulated 12-desnitrile-12-methyl-borrelidin,
      and that heterologous S. albus co-expressing borI and borJ converted 12-desnitrile-12-methyl-borrelidin
      into borrelidin more efficiently when borK was also expressed. These experiments
      support BorI participation in the proposed nitrile-forming pathway; MITE assigns
      the terminal aldoxime dehydration specifically to BorI.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000188
    evidence_type: DATABASE_ASSERTION
    snippet: Nitrile-formation via dehydation aldoxime
    retrieved_on: '2026-10-01'
    notes: MITE0000188 is an active BorI entry for UniProtKB:Q70HZ6, GenPept CAE45673.1
      and MIBiG BGC0000031. It marks aldoxime-to-nitrile dehydration as the non-intermediate
      BorI reaction; the MITE product SMILES shares the OJCKRNPLOZHAOU connectivity
      layer with this borrelidin record but omits alkene stereochemistry.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AJ580915.1
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="CAE45673.1"
    retrieved_on: '2026-10-01'
    notes: GenBank AJ580915.1 is the Streptomyces parvulus Tu4055 borrelidin cluster
      sequence and maps borI to CAE45673.1.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000031.5/BGC0000031.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="CAE45673.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0000031.5 places borI/CAE45673.1 inside the active Streptomyces
      parvulus borrelidin cluster.
  - reference: https://www.uniprot.org/uniprotkb/Q70HZ6
    evidence_type: DATABASE_ASSERTION
    snippet: GN=borI
    retrieved_on: '2026-10-01'
    notes: Current unreviewed UniProtKB:Q70HZ6 resolves as Streptomyces parvulus BorI
      putative cytochrome P450, cross-references EMBL AJ580915 protein CAE45673.1,
      and is sequence-identical to GenPept CAE45673.1.
