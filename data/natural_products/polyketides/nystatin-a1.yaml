definition: A polyene macrolide antibiotic; part of the nystatin complex produced
  by several Streptomyces species. It is an antifungal antibiotic used for the treatment
  of topical fungal infections caused by a broad spectrum of fungal pathogens comprising
  yeast-like and filamentous species.
