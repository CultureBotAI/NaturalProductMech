      and purified recombinant NysL used 10-deoxynystatin as an in vitro substrate.
    evidence:
    - reference: DOI:10.1128/AEM.72.4.2514-2519.2006
      evidence_type: PRIMARY_EXPERIMENT
      snippet: NysL is a hydroxylase responsible for the post-polyketide synthase
        modification of 10-deoxynystatin at position C-10.
      notes: Volokhan et al. replaced nysL in Streptomyces noursei, observed 10-deoxynystatin
        accumulation, heterologously expressed His-tagged NysL in Escherichia coli
        and assayed the purified enzyme with 10-deoxynystatin as substrate.
