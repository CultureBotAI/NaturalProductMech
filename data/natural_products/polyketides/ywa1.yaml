  - CHEBI:57384
  product: CHEBI:133763
  proposed: true
  notes: The A. oryzae wA promoter-replacement experiment supports AO090102000545
    as the exact YWA1-forming gene. The full acetyl-CoA and malonyl-CoA stoichiometry
    is grounded by RHEA:62652 rather than by purified Q2UA48 biochemistry.
  evidence:
  - reference: DOI:10.1186/s12896-019-0567-x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: production of the polyketide derived from A. oryzae wA
    notes: Tamano et al. replaced the native wA promoter in an A. oryzae kojA disruptant
      with the kojA promoter, confirmed recombination at the targeted wA locus, and
      matched the accumulated compound to a YWA1 standard by UV-Vis and UPLC-MS.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002175.3/BGC0002175.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0002175.3 maps the Aspergillus oryzae RIB40 YWA1 cluster CDS AO090102000545
      to GenPept BAE61567.1.
  - reference: https://www.uniprot.org/uniprotkb/Q2UA48
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Unreviewed UniProtKB:Q2UA48 is the 2,141 aa Aspergillus oryzae RIB40 AO090102000545
      entry; its canonical sequence is identical to the MIBiG BAE61567.1 translation,
      and its RHEA:62652/RHEA:62653 annotation is computational.
  - reference: https://www.rhea-db.org/rhea/62652
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: RHEA:62652 is the acetyl-CoA plus six malonyl-CoA naphthopyrone YWA1 synthase
      master reaction, mapped to left-to-right direction RHEA:62653 through homologous
      Swiss-Prot fungal naphthopyrone synthases.
