biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:D7PI19
  enzyme_label: GsfE short-chain dehydrogenase
  product: naturalproductmech:mibig-ea4dc2a26d
  notes: GsfE stereospecifically reduces dechloro-dehydrogriseofulvin, Cacho et al.
    compound 19, to epidechlorogriseofulvin, compound 2, with NADPH. The dechlorinated
    substrate is ungrounded locally, so this step names the exact substrate in notes
    rather than assigning a placeholder identifier.
  evidence:
  - reference: DOI:10.1021/cb400541z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: GsfE fully converted 18 or 19 to 1 or 2
    notes: Cacho et al. deleted gsfE and observed dehydrogriseofulvin and dechloro-dehydrogriseofulvin
      accumulation, then purified His-tagged GsfE and showed NADPH-dependent in vitro
      conversion of dechloro-dehydrogriseofulvin, compound 19, to epidechlorogriseofulvin,
      compound 2.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000070.5/BGC0000070.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000070.5 maps the P. aethiopicum GU574478.1 griseofulvin biosynthetic
      gene cluster CDS ADI24957.1 to GsfE and lists epidechlorogriseofulvin as a product.
  - reference: https://www.uniprot.org/uniprotkb/D7PI19
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:D7PI19 is the 377 aa P. aethiopicum GsfE short-chain
      dehydrogenase and cross-references GU574478 protein ADI24957.1.
