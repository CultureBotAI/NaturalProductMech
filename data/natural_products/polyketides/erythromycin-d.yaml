biosynthetic_pathway:
- step_number: 10
  enzyme_id: UniProtKB:Q00441
  enzyme_label: EryF 6-deoxyerythronolide B hydroxylase
  reaction_id: RHEA:40299
  substrate: CHEBI:16089
  product: CHEBI:27977
  notes: 'Partial tailoring view: EryF hydroxylates 6-deoxyerythronolide B to erythronolide
    B; uncurated glycosylation and deoxysugar steps between erythronolide B and erythromycin
    D are intentionally omitted.'
  evidence:
  - reference: DOI:10.1128/jb.174.3.725-735.1992
    evidence_type: PRIMARY_EXPERIMENT
    snippet: EryF hydroxylated a substrate with a turnover number of 53 min-1
    notes: UniProtKB:Q00441 resolves to eryF/SACE_0730 from Saccharopolyspora erythraea
      NRRL 2338 and links this reaction to RHEA:40299.
- step_number: 20
  enzyme_id: UniProtKB:P48635
  enzyme_label: EryK erythromycin C-12 hydroxylase
  reaction_id: RHEA:32631
  substrate: CHEBI:63677
  product: CHEBI:64258
  notes: EryK hydroxylates erythromycin D to erythromycin C. The erythromycin B branch
    is excluded here because EryK does not accept erythromycin B efficiently.
  evidence:
  - reference: DOI:10.1021/bi00006a006
    evidence_type: PRIMARY_EXPERIMENT
    snippet: preference of the enzyme for ErD over the alternative C-12 hydroxylase
      substrate ErB
    notes: UniProtKB:P48635 resolves to eryK/SACE_0713 from Saccharopolyspora erythraea
      NRRL 2338 and links this reaction to RHEA:32631.
- step_number: 30
  enzyme_id: UniProtKB:A4F7P5
  enzyme_label: EryG erythromycin 3''-O-methyltransferase
  reaction_id: RHEA:32651
  substrate: CHEBI:63677
  product: CHEBI:64279
  notes: Saccharopolyspora erythraea NRRL 2338 SACE_0728 EryG O-methylates the 3''-hydroxyl
    of the mycarose moiety of erythromycin D to form erythromycin B. RHEA:32651 uses
    protonated CHEBI:63677 erythromycin D(1+) and CHEBI:64279 erythromycin B(1+) as
    reaction participants corresponding to neutral records CHEBI:28331 and CHEBI:28196.
  evidence:
  - reference: DOI:10.1128/jb.172.5.2541-2546.1990
    evidence_type: PRIMARY_EXPERIMENT
    snippet: eryG codes for the structural gene of this enzyme
    notes: Paulus et al. sequenced the Saccharopolyspora erythraea eryG region and
      showed in Escherichia coli that eryG encodes S-adenosylmethionine:erythromycin
      C/D O-methyltransferase converting erythromycin D to erythromycin B and erythromycin
      C to erythromycin A.
  - reference: DOI:10.1021/bi00006a006
    evidence_type: PRIMARY_EXPERIMENT
    snippet: preference of the enzyme for ErD over the alternative C-12 hydroxylase
      substrate ErB
    notes: Lambalot et al. characterized the branched late erythromycin pathway in
      Saccharopolyspora erythraea where erythromycin D is either C-12 hydroxylated
      by EryK to erythromycin C or 3''-O-methylated by EryG to erythromycin B.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000055.5/BGC0000055.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0000055.5 lists the Saccharopolyspora erythraea NRRL 2338 SACE_0730
      eryF, SACE_0728 eryG, and SACE_0713 eryK tailoring genes for erythromycins A,
      B, C, and D.
  - reference: https://www.uniprot.org/uniprotkb/A4F7P5
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:A4F7P5 is the Saccharopolyspora erythraea NRRL 2338
      SACE_0728 eryG O-methyltransferase and annotates EC:2.1.1.254 with RHEA:32647
      (erythromycin C to A) and RHEA:32651 (erythromycin D to B).
  - reference: https://www.rhea-db.org/rhea/32651
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: RHEA:32651 is the EC:2.1.1.254 reaction S-adenosyl-L-methionine + erythromycin
      D(1+) = S-adenosyl-L-homocysteine + erythromycin B(1+) + H+.
