biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A017SFB8
  enzyme_label: FogE cytochrome P450 monooxygenase
  notes: FogE catalyzes aromatic C-3 hydroxylation of an alkylated salicyl alcohol
    intermediate in the flavoglaucin pathway. This single-step partial pathway leaves
    FogA-D formation of the salicyl alcohol substrate and the later FogH/FogF prenylation
    and reoxidation steps uncurated.
  evidence:
  - reference: DOI:10.1021/acs.orglett.0c00440
    evidence_type: PRIMARY_EXPERIMENT
    snippet: heterologous expression, precursor feeding, and biochemical characterization
    notes: Nies et al. elucidated the Aspergillus ruber flavoglaucin and congener
      pathway; MITE and UniProtKB curate the FogE-specific C-3 aromatic hydroxylation
      from this same primary article.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000457
    evidence_type: DATABASE_ASSERTION
    snippet: aromatic hydroxylation of flavoglaucin biosynthetic intermediate
    retrieved_on: '2026-10-01'
    notes: MITE0000457 is an active FogE cytochrome P450 entry for hydroxylation of
      a flavoglaucin-pathway salicyl alcohol intermediate; it links UniProtKB:A0A017SFB8,
      GenPept EYE95339.1, MIBiG BGC0002234 and the Nies et al. DOI.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002234.3/BGC0002234.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: locus_tag="EURHEDRAFT_455792"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0002234.3 places EYE95339.1 inside the active Aspergillus ruber
      CBS 135680 flavoglaucin cluster as the EURHEDRAFT_455792 cytochrome P450 CDS.
  - reference: https://www.uniprot.org/uniprotkb/A0A017SFB8
    evidence_type: DATABASE_ASSERTION
    snippet: Cytochrome P450 monooxygenase fogE
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:A0A017SFB8 resolves as Aspergillus ruber CBS 135680
      FogE/FOGE_ASPRC, a 538 aa cytochrome P450 monooxygenase, and cross-references
      EMBL KK088422 protein EYE95339.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/EYE95339.1
    evidence_type: DATABASE_ASSERTION
    snippet: cytochrome P450 [Aspergillus ruber CBS 135680]
    retrieved_on: '2026-10-01'
    notes: GenPept EYE95339.1 is the 538 aa Aspergillus ruber CBS 135680 cytochrome
      P450 protein encoded by six exons on WGS scaffold KK088422.1.
