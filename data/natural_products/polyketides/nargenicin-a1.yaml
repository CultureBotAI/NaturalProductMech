  edges:
  - subject: ngno1
    predicate: is_required_partner_in_reported_assay_for
    object: related_pathway_assay
    notes: Both Ngn gene products were needed in the reported two-protein assay under
      its tested conditions. Numbers6/7 and8 are local to the cited2021 study and
      refer to related streptoseomycin-pathway compounds, not to mature nargenicin
      A1. The mixture experiment does not independently prove turnover of each isolated
      component, and the proposed transient products12/12b were not fully structure-elucidated.
      No exact SMILES, reaction order, catalytic site allocation, physical heterodimer
      or in-vivo native necessity is asserted. NtfO1/NtfO2 crystallography and FMN
      docking concern different proteins and are not transferred to these nodes.
    evidence:
    - reference: DOI:10.1038/s41467-021-22395-7
      evidence_type: PRIMARY_EXPERIMENT
      retrieved_on: '2026-10-07'
      notes: 'Results: In vitro characterization of NgnO1-NgnO2 as hydroxylase; Fig.3
        caption; Methods: Gene expression and protein purification and In vitro assay
        of NgnO1, NgnO2, NgnO1-NgnO2. The main text reports ATCC31306 genes expressed
        in E. coli, a paired assay with related streptoseomycin-pathway mixture6/7
        and observed product8, and single-protein controls without detected conversion.
        Full main text inspected via NCBI BioC/PMC8027225; figure pixels and supplementary
        construct/assay data were not inspected. This is not a purified mature-nargenicin-forming
        assay.'
      snippet: NgnO1 or NgnO2 alone has no effects on 6/7
    - reference: https://www.ncbi.nlm.nih.gov/protein/AXG22411.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-07'
      notes: Native NgnO1 reference from Nocardia argentinensis ATCC31306/taxon1311812,
        310aa. Gene name, strain and MH544245.1 coded_by mapping identify the canonical
        parent, not a completely reconstructed historical tagged assay construct.
        Family/product annotations are not independent proof of the specific reaction.
        Gene/species and exact GenPept-xref UniProtKB searches returned no entries
        on2026-10-07; this is not global absence and no homolog was selected.
  - subject: ngno1
    predicate: is_inferred_paired_oxidation_participant_in_biosynthesis_of
    object: nargenicin_a1
    notes: Explicit native-pathway inference from the source-named ngn locus, canonical
      native gene identity and the measured paired activity on related-pathway intermediates.
