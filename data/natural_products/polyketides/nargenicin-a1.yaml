    ATCC31306 parents with native CDS and GenPept identity verified. No mature-nargenicin
    reaction, nargenicin genetic necessity, exact historical tagged construct, physical
    Ngn heterodimer, or Ntf structural/ligand transfer is asserted. No MITE reaction
    model is adopted. This is not full-record REVIEWED sign-off.'
