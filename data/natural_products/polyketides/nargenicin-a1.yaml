- graph_id: nargenicin-a1-ngnd-database-cyclase-native-parent
  scope: BIOSYNTHESIS
  description: Qualified database assignment of NgnD as a putative cyclase in nargenicin
    biosynthesis. The canonical ATCC 31306 protein is grounded independently of the
    longer PDB construct. This graph does not assert an inspected native knockout,
    an exact intermediate reaction, a demonstrated solution dimer, or direct production
    of mature nargenicin A1.
  nodes:
  - node_id: ngnd
    label: NgnD, native ATCC 31306 parent (putative cyclase)
    node_type: ENZYME
    identifier: NCBIProtein:AXG22404.1
    grounding_status: GROUNDED
  - node_id: nargenicin_a1
    label: nargenicin A1
    node_type: COMPOUND
    identifier: naturalproductmech:mibig-6437746e58
    grounding_status: GROUNDED
  edges:
  - subject: ngnd
    predicate: is_database_assigned_putative_cyclase_in_biosynthesis_of
    object: nargenicin_a1
    notes: Database-level pathway-role assertion only. The pinned MITE row gives a
      tentative bispericyclase assignment and links this exact GenPept reference to
      BGC0002024. Its knockout evidence code was not independently verified in the
      inaccessible 2020 paper, whose abstract names a different strain; no native
      ATCC 31306 knockout phenotype is transferred. MITE models are C22H34O4 intermediates,
      distinct from the C28H37NO8 owner even without stereochemistry, and its product
      has undefined centres. No exact native substrate/product pair, specific cycloaddition
      outcome or mature-owner-forming reaction is adopted. PDB biological-assembly
      annotation is not solution stoichiometry evidence.
    evidence:
    - reference: https://github.com/mite-standard/mite_data/blob/6eacd913b2036376031072f69cbb33908f132998/mite_data/data/MITE0000113.json
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-06'
      snippet: '[6+4] cycloaddition; NgnD acts likely similar to a bispericyclase'
      notes: MITE0000113 version 2, inspected 2026-10-07; archive member and Git blob
        verified at the cited commit. The row names NgnD, GenPept AXG22404.1, UniParc
        UPI001005A892 and MIBiG BGC0002024. Preserve the source's tentative wording.
        Neither its reaction model nor its knockout evidence code is promoted to an
        independently inspected primary experiment.
    - reference: https://www.rcsb.org/structure/6A5F
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-07'
      notes: Independent PDB deposit DOI:10.2210/pdb6A5F/pdb names NgnD and a nargenicin-pathway
        cyclase. Polymer entity 1/chains A and B contain the exact 152-aa native sequence
        followed by 13 additional C-terminal residues; the origin of that extension
        is not reconstructed from the inaccessible paper. The 2.05-Angstrom model
        covers native positions 2-152, with residue 1 and the whole extension unmodeled.
        The source strain taxon 1311813 has species ancestor 1311812 in the inspected
        RCSB lineage. Author/PISA dimeric assembly annotation explicitly has experimental_support
        none; no physical assembly node is adopted. Structural identity does not establish
        the exact catalytic reaction.
    - reference: https://www.ncbi.nlm.nih.gov/protein/AXG22404.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-07'
      notes: Canonical native NgnD, Nocardia argentinensis ATCC 31306, 152 aa; source
        strain and gene agree. The full reverse-strand MH544245.1 CDS at 5198..5656
        is 459 nt, table 11/codon 1, and translates identically to GenPept and UniParc
        UPI001005A892. Independent coded_by coordinates, strand and DNA agree. UniParc
        marks A0A3S7PZF0 inactive; the bounded current exact-gene/taxon or GenPept-xref
        UniProtKB query returned no entries. No homolog or same-sequence protein from
        another strain was substituted. Family annotation alone does not prove cyclase
        function.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/MH544245.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-07'
      notes: MH544245.1 is the complete 69,359-bp nargenicin cluster deposit, not
        a complete genome. It establishes native gene identity and source context,
        not experimental function from neighborhood alone.
    - reference: https://dl.secondarymetabolites.org/mibig/mibig_json_4.0.tar.gz
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-06'
      notes: 'Adopted MIBiG 4.0 archive SHA256 986f1a69fb5eeb84fd7c0175ae921304c22fd5f8ed04c96d8c1c0c95a145837b;
        BGC0002024 version 3 inspected 2026-10-07. Both compound rows share the exact
        owner SMILES, source taxon 1311812 and locus MH544245.1. This is a compound/locus
        anchor only: the entry supplies no NgnD gene-function evidence and does not
        support a producer or cluster evidence-grade upgrade.'
