    and NCBIProtein:AXG22410.1 after complete native CDS/GenPept comparison. Two primary-text-supported
    edges describe the reported paired assay on related streptoseomycin-pathway intermediates;
    two separate edges explicitly infer native nargenicin pathway participation. Every
    edge has a DOI or stable URL and one short primary caption snippet is retained.
    No direct mature-nargenicin reaction, nargenicin knockout phenotype, precise unstable-intermediate
    structure, physical Ngn heterodimer, Ntf crystal or FMN occupancy transfer, or
    complete historical tagged-construct identity is asserted. Full main primary text
    read, but figure pixels and SI were not inspected. Two bounded UniProtKB searches
    were empty; no homolog substituted. Preserved owner structure, filing, source
    grades, duplicate imported rows, SEEDED status and all prior history. Added a
    separate two-node/one-edge NgnD graph for a qualified database cyclase assignment,
    grounded to NCBIProtein:AXG22404.1. Complete native CDS, GenPept and UniParc sequences
    agree; PDB6A5F has this canonical 152-residue parent plus a 13-residue C-terminal
    extension. Its author/PISA dimer annotation has no deposited experimental assembly
    support and is not adopted as demonstrated solution assembly. Inactive A0A3S7PZF0
    was not selected as a UniProtKB example, and a bounded current query was empty.
    MITE0000113v2 reaction models are distinct C22 intermediates, not the C28 owner.
    Retained the tentative MITE wording as a short snippet. No direct native knockout
    phenotype, exact cycloaddition reaction, mature owner formation, primary-paper
    access, producer-grade promotion or full-record REVIEWED status is claimed for
