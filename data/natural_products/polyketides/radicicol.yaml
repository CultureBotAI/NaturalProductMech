biosynthetic_pathway:
- enzyme_id: UniProtKB:B3FWT7
  enzyme_label: Rdc2 flavin-dependent halogenase
  proposed: true
  product: naturalproductmech:mibig-7fc8631300
  notes: Database-annotated Rdc2 chlorination of monocillin I to radicicol, from reviewed
    UniProt B3FWT7. The proposed flag retains the local uncertainty from uninspected
    primary experiments; the source annotation is not recast as a newly observed assay.
    Monocillin I has no independently verified structural CURIE here. The radicicol
    product is represented at the existing owner's unspecified stereochemical resolution,
    not assigned new stereochemistry. No pathway order, balanced reaction, construct
    details, or measured signal processing is inferred. MITE0000427v2's monocillin
    II-to-pochonin D intermediate example is a different reaction and is not used
    as this product.
  evidence:
  - reference: https://www.uniprot.org/uniprotkb/B3FWT7/entry
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    snippet: to convert monocillin I into radicicol
    notes: 'Reviewed UniProtKB B3FWT7, entry 40/sequence 1 (annotation 2026-09-02),
      explicitly assigns this conversion to Rdc2 within radicicol biosynthesis. The
      annotation concerns Metacordyceps chlamydosporia (Pochonia chlamydosporia),
      NCBITaxon:280754. Its cited experiments were not inspected: PMID:18567690 /
      DOI:10.1128/AEM.00478-08 and PMID:20827793 / DOI:10.1002/cbic.201000439 were
      inaccessible in this pass. This is a database annotation, not a newly verified
      isolated-enzyme assay or a claim of resolved product stereochemistry.'
  - reference: https://www.ncbi.nlm.nih.gov/protein/ACD39771.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    snippet: non-heme halogenase [Pochonia chlamydosporia]
    notes: GenPept ACD39771.1 identifies Rdc2, 519 aa, strain ATCC 16683, taxon 280754,
      and a six-part coded_by join on EU520419.1. Its complete sequence equals UniProtKB:B3FWT7.
      This supports protein identity only, not the substrate/product assignment or
      historical assay-stock identity.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/EU520419.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    snippet: Pochonia chlamydosporia strain ATCC 16683 radicicol gene cluster, partial
      sequence
    notes: EU520419.1 is the 31,332-nt native cluster reference also named by this
      owner's BGC0000134. The Rdc2 CDS is complete despite the cluster's partial-sequence
      description and the gene/mRNA's fuzzy boundaries. Its protein_id is ACD39771.1.
      This is a native-reference association, not new production evidence.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/EU520419.1
    evidence_type: CURATOR_INFERENCE
    retrieved_on: '2026-10-08'
    notes: 'Independent reference-identity audit: plus-strand CDS exons 8912..9036,
      9114..9210, 9280..9319, 9406..9813, 9882..10424 and 10502..10848 (1-based inclusive)
      agree with GenPept coded_by. The 1,560-nt joined CDS, codon_start 1, translates
      under standard table 1 to the complete 519-aa GenPept/UniProt precursor. No
      transl_table qualifier was present, so table 1 is the standard default. The
      UniProt predicted signal/chain boundaries were not used to truncate the sequence
      or to assert measured processing. Native sequence identity does not independently
      prove catalysis, strain-specific production, or exact substrate stereochemistry.'
- enzyme_id: UniProtKB:B3FWT9
  enzyme_label: Rdc4 cytochrome P450 monooxygenase (proposed epoxidation)
  proposed: true
  notes: UniProt proposes Rdc4 as a possible epoxide-forming post-PKS enzyme in radicicol
    biosynthesis. This is a database-proposed role, not a verified isolated-enzyme
    conversion. No exact substrate, immediate product, reaction stoichiometry or pathway
    order relative to Rdc2 was established. The owner has unspecified stereochemistry;
    no epoxide configuration is assigned.
  evidence:
  - reference: https://www.uniprot.org/uniprotkb/B3FWT9/entry
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    snippet: could introduce the epoxide and the chlorine, respectively
    notes: Reviewed UniProtKB B3FWT9, entry 46/sequence 1, annotation 2026-09-02.
      The FUNCTION text proposes Rdc4 and Rdc2 as possible epoxide- and chlorine-introducing
      enzymes, respectively. The organism is Metacordyceps chlamydosporia (Pochonia
      chlamydosporia), taxon 280754. PMID:18567690 / DOI:10.1128/AEM.00478-08 was
      not accessible in this pass; no primary experiment was inspected. The alternative
      protein name mentioning hypothemycin is not used to identify the compound or
      to assert an exact reaction.
