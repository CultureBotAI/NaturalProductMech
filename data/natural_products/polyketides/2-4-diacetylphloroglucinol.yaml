biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q51725
  enzyme_label: PhlD
  notes: Q2-87 PhlD is represented as the upstream type III polyketide synthase required
    for MAPG and 2,4-DAPG formation. The exact malonyl-CoA to phloroglucinol reaction
    is biochemically supported for the Pf-5 PhlD ortholog and marked proposed here
    because Bangera and Thomashow genetically placed Q2-87 PhlD upstream of MAPG before
    the PhlD reaction was biochemically revised.
  evidence:
  - reference: DOI:10.1021/ja042340g
    evidence_type: PRIMARY_EXPERIMENT
    snippet: catalyzed the conversion of malonyl-CoA into phloroglucinol
    notes: Achkar and colleagues purified Pseudomonas fluorescens Pf-5 PhlD and showed
      the exact malonyl-CoA-to-phloroglucinol reaction later assigned by similarity
      to the Q2-87 PhlD entry.
  - reference: DOI:10.1128/JB.181.10.3155-3163.1999
    evidence_type: PRIMARY_EXPERIMENT
    snippet: four of which (phlACBD) comprise an operon
    notes: Bangera and Thomashow showed that Q2-87 phlD is part of the phlACBD biosynthetic
      operon required for 2,4-DAPG production. Later biochemical revision assigns
      the exact PhlD reaction to phloroglucinol formation, so this record captures
      a genetic role upstream of MAPG rather than an obsolete standalone MAPG synthase
      reaction.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/U41818.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: GenBank U41818.1 is the Pseudomonas fluorescens Q2-87 2,4-diacetylphloroglucinol
      biosynthesis locus carrying phlA, phlB, phlC, and phlD.
  - reference: https://www.uniprot.org/uniprotkb/Q51725
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: UniProtKB:Q51725 resolves the Pseudomonas fluorescens Q2-87 phlD protein
      and cross-references EMBL U41818 protein AAB48106.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAB48106.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AAB48106.1 is the U41818.1 Q2-87 phlD coding sequence.
  reaction_id: RHEA:50380
  substrate: CHEBI:57384
  product: CHEBI:16204
  proposed: true
- step_number: 2
  enzyme_label: PhlA/PhlC/PhlB MAPG acetylation module
  substrate: CHEBI:64344
  product: CHEBI:78688
  notes: The step is kept as a multi-protein Q2-87 module because the 1999 paper showed
    PhlA, PhlC, and PhlB are collectively needed to convert MAPG to 2,4-DAPG without
    assigning separable individual reactions.
  evidence:
  - reference: DOI:10.1128/JB.181.10.3155-3163.1999
    evidence_type: PRIMARY_EXPERIMENT
    snippet: PhlA, PhlC, and PhlB are necessary to convert MAPG to 2,4-DAPG
    notes: Bangera and Thomashow sequenced the Pseudomonas fluorescens Q2-87 U41818
      phlACBD operon and assigned PhlD and PhlA/PhlC/PhlB from heterologous expression
      of individual and combined phl genes.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/U41818.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: GenBank U41818.1 is the Pseudomonas fluorescens Q2-87 2,4-diacetylphloroglucinol
