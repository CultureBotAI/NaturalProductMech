biosynthetic_pathway:
- step_number: 1
  enzyme_label: LnyI ACP S-malonyltransferase
  proposed: true
  notes: LnyI catalyzes transfer of a malonyl starter unit from malonyl-CoA to the
    holo-LnyPloading acyl carrier protein domain to form malonyl-S-LnyPloading for
    linearmycin A polyketide assembly; enzyme_id is grounded to the native GenPept
    accession NCBIProtein:AKL64828.1 because UniParc UPI00017E925A maps only to retired/obsolete
    UniProtKB/TrEMBL entry B4VDY5.1 with no active UniProtKB accession.
  evidence:
  - reference: DOI:10.1016/j.chembiol.2017.08.008
    evidence_type: PRIMARY_EXPERIMENT
    snippet: no linearmycins were produced
    notes: Hoefler et al. replaced the Streptomyces sp. Mg1 lnyI acyltransferase open
      reading frame with an apramycin resistance marker, observed by HPLC that the
      mutant no longer produced linearmycin A/B/C, and restored linearmycin production
      by native-promoter lnyI complementation.
  - reference: mibig:BGC0002072
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0002072 version 3 names linearmycin A as an exact product of the
      Streptomyces sp. Mg1 type I PKS cluster on CP011664.1 and records knock-out
      support for the locus.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AKL64828.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: ACP S-malonyltransferase
    notes: NCBI Protein AKL64828.1 is the 345-aa Streptomyces sp. Mg1 ACP S-malonyltransferase
      LnyI encoded by locus tag M444_04805 on GenBank CP011664.1 (1035948..1036985)
      and grounds the LnyI step and enzyme node as NCBIProtein:AKL64828.1.
  - reference: https://www.uniprot.org/uniparc/UPI00017E925A
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-23'
    snippet: AKL64828.1
    notes: UniParc UPI00017E925A archives the exact 345-aa Streptomyces sp. Mg1 LnyI
      sequence (EMBL CP011664.1 protein AKL64828.1, locus tag M444_04805) and records
      that UniProtKB/TrEMBL entry B4VDY5.1 is inactive/obsolete, confirming no active
      UniProtKB accession resolves for AKL64828.1.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/CP011664.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Streptomyces sp. Mg1
    notes: GenBank CP011664.1 is the complete Streptomyces sp. Mg1 genome used by
      BGC0002072; within that genome, lnyI/M444_04805 occupies 1076160..1077197 and
      encodes AKL64828.1.
  enzyme_id: NCBIProtein:AKL64828.1
