    predicate: has_genetically_inferred_biosynthetic_role
    object: c6_methylation
    notes: The inactivation, purified congener assignment and complementation support
      attribution of C-6 methylation to PokMT2. The experiment is genetic inference,
      not purified native PokMT2 conversion of MD3 or an isolated early intermediate.
      Similarity to OxyF/BenF supplies context but those proteins are not substituted
      as exact polyketomycin enzymes. MD3 diffusion-assay results concern the congener,
      not a bioactivity-target role for PokMT2.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: CURATOR_INFERENCE
      notes: Sections 3.6 pp. 75-81 and 4.3.2 pp. 110-112; inference from native genetics,
        metabolite analysis and rescue.
  - subject: c6_methylation
    predicate: has_proposed_pathway_timing
    object: early_step
    notes: The thesis proposes C-methylation after formation of the tetracycle and
      before oxidation at C-6, based on previously reported shunts and analogy with
      oxytetracycline biosynthesis. Figure 4-10 explicitly treats POK-IP3 as a shunt,
      not the direct substrate; the proposed substrate was modeled on pretetramid.
      This is not an experimentally measured reaction order, demonstrated substrate
      specificity or evidence that complete MD3 is methylated as the last step. The
      reported ability to form MD3 shows downstream biosynthesis can proceed without
      this methyl group in the tested mutant.
