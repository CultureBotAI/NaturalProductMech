      to aromatic O-methyltransferases and pathway chemistry. The pokMT3 mutant did
      not yield the corresponding desmethyl polyketomycin, and the inspected work
      does not show purified PokMT3 conversion of a defined substrate. A late methylation
      step after cyclization is proposed, not measured. The native accession is grounded
      independently of the confidence in this reaction assignment.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: CURATOR_INFERENCE
      notes: Section 3.7.1 pp. 82-83; discussion 4.3.3 pp. 112-115 and Figs. 3-39/4-11/4-12;
        proposed interpretation, not direct enzyme assay.
  - subject: pokmt3
    predicate: has_hypothesized_non_catalytic_role
    object: early_support
    notes: The authors speculate that PokMT3 helps organize early polyketide biosynthesis
      because inactivation blocks production before the proposed methylation stage.
      No protein interaction, stoichiometry or physical assembly was measured. TcmN
      is longer and its N-terminal cyclase/dehydrogenase region is not the region
      similar to PokMT3; TcmN bifunctionality therefore is not evidence for PokMT3
      cyclase activity. Sequence comparison alone also is not a direct negative cyclase
      assay. The possible pokC2 polar effect remains an alternative to the structural-role
      hypothesis, and no ComplexPortal identity is assigned.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: CURATOR_INFERENCE
      notes: Discussion 4.3.3 pp. 112-115; Figs. 4-11/4-12; structural role is explicitly
        speculative and polar effects are not excluded.
