  edges:
  - subject: frameshift
    predicate: targets_gene_encoding
    object: pokmt1
    notes: pKC1132-MT1del introduces a frameshift at an internal BglII site, not a
      whole-gene deletion. After 12 passages, 8% of 244 tested clones were apramycin-sensitive.
      PCR/BglII testing showed the reported mutant 1.25-kb uncut fragment versus wild-type
      0.8/0.4-kb products; single-crossover and plasmid controls were included. Figure
      3-25 attributes a faint uncut wild-type band to incomplete digestion. The exact
      residual mutant protein was not sequenced here. The 347-aa printed native sequence
      in Figure 3-31 matches the independently verified native parent.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.5.1-3.5.2, pp. 61-62; Fig. 3-25; Fig. 3-31 p. 71; construction
        5.7.2.5 p. 163.
    - reference: https://www.uniprot.org/uniprotkb/C0JWB3
      evidence_type: DATABASE_ASSERTION
      notes: Active unreviewed native PokMT1, 347 aa, taxon 42236, EMBL FJ483966/ACN64833.1;
        inspected 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ACN64833.1
      evidence_type: DATABASE_ASSERTION
      notes: Native PokMT1 from Streptomyces diastatochromogenes Tu6028, 347 aa, FJ483966.1:complement(24720..25763).
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ483966.1
      evidence_type: CURATOR_INFERENCE
      notes: 'Curator comparison: the selected CDS translation agrees exactly across
        native GenBank, GenPept, MIBiG BGC0001061.4 and UniProt. Whole loci are not
        identical: MIBiG replaces native ambiguity codes by N at positions 47, 289,
        46665 and 46736, outside these two CDSs.'
  - subject: frameshift
    predicate: has_reported_production_phenotype
    object: loss
    notes: HPLC/APCI-MS of six-day HA-medium production extracts reports POK-MD1 and
      POK-MD2 instead of the wild-type polyketomycin peak. Method pokAPCI2 and 450-nm
      traces were used. This is a detection/profile result, not a calibrated zero
      titer or all-condition requirement.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.5.3 pp. 62-63 and 5.10.2.2 p. 189; Table 5-48 p. 196.
  - subject: frameshift
    predicate: accumulates_reported_metabolite
    object: md1
    notes: 'POK-MD1 is the major mutant product: nominal mass 716 Da, retention 11.1
      min and relative 450-nm signal area 100. Table 3-7 normalizes each profile to
      its largest POK-family signal, not to biomass or an absolute standard. The proposed
      loss of the 3,6-dimethylsalicyloyl moiety rests on APCI-MS fragmentation; no
      POK-MD1 NMR data were acquired. Do not ground this provisional derivative to
      the parent record.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 3-7 p. 62; sections 3.5.3-3.5.4, pp. 63-68; Figs. 3-26, 3-27 and
        3-29.
  - subject: frameshift
    predicate: accumulates_reported_metabolite
    object: md2
    notes: Minor POK-MD2 has nominal mass 850 Da, retention 16.8 min and relative
      450-nm area 15 versus MD1=100; native polyketomycin is 864 Da at 19.2 min. MS
      supports a missing salicyloyl methyl rather than a sugar/aglycone deletion.
      After methyl-13C-methionine feeding, the 15.9-ppm methyl signal is absent while
      the other three enriched methyl signals remain. Methods p. 199 state that labelled
      POK and POK-MD2 were not isolated from fractionated extract because amounts
      were low. This is not complete NMR of a pure congener, nor an independent absolute
      stereochemical assignment.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 3-7 p. 62; section 3.5.4 pp. 64-68, Table 3-8 and Fig. 3-28; section
        5.11.1.2 p. 199.
  - subject: rescue
    predicate: introduces_gene_encoding
    object: pokmt1
    notes: pSET-pokMT1 is a pSET-1cerm/ermE-up rescue construct. Native primer alignment
      gives a 24659..25892 span (1234 bp), including the full pokMT1 CDS and only
      seven terminal bases of adjacent pokM2, not another complete enzyme. Primer-engineered
      restriction sites lie outside pokMT1. This is a curator reconstruction of native
      coverage, not a complete sequenced plasmid.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 5-35 p. 158; complementation methods 5.8.2.1-5.8.2.2 and 5.8.2.5,
        pp. 168-169.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ483966.1
      evidence_type: CURATOR_INFERENCE
      notes: Curator MT1-F/MT1-R alignment to FJ483966.1; full pokMT1 at 24720..25763
        and partial pokM2 ending at 24665.
  - subject: rescue
    predicate: restores_reported_production
    object: restored
    notes: The complemented mutant again produces polyketomycin, with a small residual
      POK-MD1 peak. Methods describe comparing three complemented clones to wild type
      and the mutant with pSET-1cerm control. The displayed profile is not a quantified
      claim that every clone has wild-type yield or that every possible polar effect
      is excluded.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.5.3 and Fig. 3-26 p. 63; section 5.8.3 p. 169.
      snippet: Polyketomycin wurde dadurch wieder hergestellt
  - subject: his2009
    predicate: uses_native_parent_sequence_from
    object: pokmt1
    notes: The thesis reports a 43.1-kDa N-terminal His6 fusion expressed using pRSET-pokMT1
      or pUWE-hispokMT1. Soluble affinity-purified protein was obtained in E. coli
      BL21(DE3)/pLysS, Origami B(DE3)/pLysS and KRX; TK24 expression succeeded in
      SG medium. Trypsin/MALDI assigned 19 of 23 mass signals and reported 52% coverage,
      not full sequence confirmation. Table 5-36 lists MT1Ex PstI/EcoRI primers but
      mislabels their target plaO1; p. 173 instead names His-MT1 primers, which the
      table assigns ClaI/XbaI for rescue. Native alignment supports MT1Ex targeting
      pokMT1, but the full engineered sequence/junction is not asserted. The native
      UniProt identifier is not assigned to the fusion.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.5.5.2-3.5.5.3 pp. 69-72; Fig. 3-30 and Table 3-9; Table 5-36
        p. 158 and methods pp. 169, 173-175.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ483966.1
      evidence_type: CURATOR_INFERENCE
      notes: Curator MT1Ex primer comparison supports the native pokMT1 region despite
        conflicting primer labels in source methods.
  - subject: his_rescue
    predicate: carries_expression_construct_for
    object: his2009
    notes: pSET-hispokMT1 was derived from the tagged expression construct and introduced
      into the native pokMT1 mutant. This rescue context is separate from purified
      in vitro tests and from the later 2018 pBS3080-based constructs.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.5.5.2 p. 69; section 5.8.2.6 p. 169.
  - subject: his_rescue
    predicate: restores_reported_production
    object: restored
    notes: Tagged rescue restored detectable polyketomycin. This supports retained
      in vivo functionality in that construct, not unchanged native kinetics, full
      fusion sequence identity or proof that every recombinant preparation is catalytically
      competent.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.5.5.2 p. 69.
  - subject: his2009
    predicate: has_bounded_negative_assay_result
    object: negative2009
    notes: The 2009 HPLC/MS assays detected no methylation with the displayed POK-MD2,
      salicylate, 6-methylsalicylate and three salicylate-SNAC derivatives. Figure
      3-32 lists A-F but its introductory caption says A-E, so the panel wording itself
      is inconsistent. Methods specify 14 uM tagged enzyme, 0.5-5 mM SAM, 50 mM phosphate
      or Tris pH 7.5-8.5, 3 h at 28 or 37 C, with some tests adding 1 mM MgCl2 and/or
      DTT. Not every combination is individually tabulated; substrate stock concentrations
      and detection limits are not given here. This negative result does not cover
      the CoA thioester demonstrated later, and does not show that native PokMT1 is
      inactive.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.5.6 pp. 72-73, Fig. 3-32; section 5.9.5.2 p. 185.
    - reference: DOI:10.1021/acs.biochem.7b01219.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Fig. S6 later identifies the CoA-tethered substrate, a distinct assay
        from the thesis panel.
  - subject: operon
    predicate: contains_gene_for
    object: pokmt1
    notes: The pUWE-36DMSA construct contains the proposed pokMT1/pokM2/pokM1/pokM3
      unit under ermE-up, with flanking sequence. The thesis calls its completeness
      presumptive. Construct carriage does not establish expression of each enzyme
      or a physical multienzyme complex.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.5.7 and Table 3-10 pp. 73-74; construction 5.9.1.4 p. 174.
  - subject: operon
    predicate: has_bounded_negative_assay_result
    object: operon_negative
    notes: TK24 production extracts showed no salicylate-derivative difference from
      the empty-pUWE control by HPLC/MS; Discussion also reports no substrate turnover
      using cell-free extract. Neither result proves that all four introduced enzymes
      were expressed or universally inactive. It is not a successful reconstitution
      of polyketomycin production.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.5.7 p. 74; Discussion 4.3.1 p. 109; methods pp. 174-175, 185.
  - subject: md2
    predicate: supports_genetic_assignment_of
    object: role
    notes: The mutant profile and methyl-label localization support a role at the
      salicyloyl C-3 position. Genetics alone did not identify the enzyme-bound substrate
      or establish whether methylation precedes CoA activation; the thesis considers
      several timings. The 2018 biochemical evidence must not be replaced by the older
      proposed order.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: CURATOR_INFERENCE
      notes: Sections 3.5.4 and 4.3.1 pp. 64-68, 104-109.
    - reference: DOI:10.1021/acs.biochem.7b01219.s001
      evidence_type: PRIMARY_EXPERIMENT
      notes: Fig. S6 gives substrate order; Fig. S10 is explicitly the original, historical
        proposal.
  - subject: pokmt1
    predicate: has_genetically_inferred_biosynthetic_role
    object: role
    notes: Native genetics and rescue assign PokMT1 to salicyloyl methylation in this
      producer. This edge is the genetic inference, not a claim that the 2009 study
      demonstrated purified conversion of free 6-methylsalicylic acid.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
      evidence_type: CURATOR_INFERENCE
      notes: Sections 3.5 and 4.3.1; inference from mutant metabolites and complementation.
- graph_id: polyketomycin-pokm3-pokmt1-coa-activated-precursor
  scope: BIOSYNTHESIS
  description: 'Guo et al. 2018 PokM3/PokMT1 precursor branch: CoA activation of 6-methylsalicylate
    precedes C-methylation. Curated from the primary abstract and openly deposited
    supporting information, including visually inspected experimental figures; full
    main-text methods were inaccessible. Native parent accessions are separate from
    recombinant His6 constructs. Reaction identity is supported, but complete assay
    conditions, mutant activity values and a full polyketomycin reconstitution are
