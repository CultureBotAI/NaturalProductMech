    under the tested conditions, with partial rescue. C-8 O-methylation and an early
    structural contribution remain proposed; the evidence does not establish direct
    turnover, a physical complex or a PokMT3 cyclase. The reported 600-bp deletion
    and primer-derived 660-bp reconstruction are distinct, and the possible pokC2
    polar effect remains unresolved (source-review issue #530). Product stereochemical
    identity is unchanged.'
