  kind: CURATION_TODO
  status: OPEN
  prompt: 'MIBiG cross-references this compound to CHEBI:66771, but ChEBI holds CHEBI:66771
    with Standard InChIKey OWRCRVABZYJUES-FLJLGRLJSA-N and this record''s structure
    is OWRCRVABZYJUES-AWECJWJISA-N. The skeleton blocks match, so the two disagree
    about stereochemistry: check which configuration the primary literature supports.'
  rationale: The primary structure report establishes sugar configurations and relative
    aglycone stereochemistry, and the Tu6028 biosynthesis paper explicitly labels
    the aglycone configuration relative. The new protein experiments do not resolve
    the owner/MIBiG versus ChEBI exact-structure disagreement. No atom-mapped comparison,
    absolute-configuration correction or exact AntibioticMech join is claimed.
  evidence:
  - reference: DOI:10.7164/antibiotics.51.26
    notes: 'Primary structure determination pp. 26-29: degradation, sugar assignments
      and relative aglycone X-ray analysis; Figures 1, 4 and 5 inspected.'
  - reference: DOI:10.7164/antibiotics.52.96
    notes: Primary Tu6028 product characterization p. 96 and Figure 1 caption p. 97
      explicitly retain relative aglycone configuration.
  notes: 'Protein graphs retain the existing incomplete-stereochemistry record and
    do not promote it to REVIEWED or merge POK-MD1/POK-MD2 with the parent. See source-review
    issue #529.'
