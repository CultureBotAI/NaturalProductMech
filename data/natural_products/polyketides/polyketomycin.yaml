  scope: BIOSYNTHESIS
  description: Daum 2009 native Tu6028 PokMT1 genetics and early tagged-protein assays.
    Frameshift, rescue, metabolite assignments and negative biochemical tests are
    distinct claims. Product identity follows the named polyketomycin at the owner
    record's unresolved stereochemical resolution; neither congeners nor fully specified
    ChEBI stereochemistry are merged. The later PokM3/PokMT1 CoA-substrate evidence
    is represented separately and prevents interpreting these early negative assays
    as universal inactivity.
