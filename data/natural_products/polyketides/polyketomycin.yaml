- graph_id: polyketomycin-pokmt2-genetics-and-c6-methylation-inference
  scope: BIOSYNTHESIS
  description: 'Native Tu6028 PokMT2 frameshift and rescue, with purified POK-MD3
    structural evidence supporting C-6 methylation. The native parent is exactly grounded,
    but no purified-enzyme reaction, immediate substrate or absolute biosynthetic
    timing is claimed. POK-MD3 is a distinct congener, not the parent or POK-MD2.
    The owner remains at its existing unresolved stereochemical resolution. Source-review
    issue #530 preserves normalized-profile, allele and inferred-substrate limitations.'
