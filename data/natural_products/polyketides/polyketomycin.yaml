  - subject: md3
    predicate: supports_genetic_assignment_of
    object: c6_methylation
    notes: The authors isolated 7.5 mg MD3 from a 3-L mutant production culture by
      fractionation and preparative HPLC, then acquired 1H/13C and COSY/HSQC/HMBC
      spectra in CDCl3 (400/100 MHz). Unlike labelled MD2, this was an isolated compound.
      Neutral formula C43H46O18 and HR-ESI-MS [M+H]+ m/z 851.27507 (calculated 851.27569)
      support one fewer methyl equivalent. The C-15 methyl signals are absent; C-6
      moves from 132.7 to 119.9 ppm and couples to a new 7.54-ppm proton, whose HMBC
      correlations establish its location. This supports 6-desmethyl polyketomycin,
      not an independently resolved absolute stereochemistry or exact parent identity.
      Appendix assignments at C-1/C-12 remain mutually exchangeable.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/6815
