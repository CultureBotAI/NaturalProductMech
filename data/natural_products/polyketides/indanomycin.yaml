definition: An indene that is (3a<i>S</i>,7a<i>R</i>)-2,3,3a,4,5,7a-hexahydro-1<em>H</em>-indene
  which is substituted at the 2-<em>pro</em>-<i>R</i> position by a 1<em>H</em>-pyrrol-2-ylcarbonyl
  group, at the 9-<em>pro</em>-<i>S</i> position by an ethyl group, and at the 5-<em>pro</em>-<i>R</i>
  position by a hexa-1,3-dineyl group in which position 4 has been substituted by
  a (2<i>R</i>,3<i>S</i>,6<i>R</i>)-6-[(1<i>R</i>)-1-carboxyethyl]-3-methyltetrahydropyran-2-yl
  group. It exhibits activity against Gram-positive bacteria as well as antihypertensive
  and antitumour. It also functions as an effective growth promoter for ruminants.
