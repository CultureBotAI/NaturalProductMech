biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:B9ZUK6
  enzyme_label: CndG 1'-carboxy-chondrochloren decarboxylase
  reaction_id: RHEA:81491
  substrates:
  - CHEBI:231889
  - CHEBI:57692
  product: CHEBI:132426
  notes: CndG carries out the terminal FAD-dependent oxidative decarboxylation of
    1'-carboxy-chondrochloren A to form mature chondrochloren A; Rhea maps the corresponding
    EC 4.1.1.129 reaction to RHEA:81491.
  evidence:
  - reference: DOI:10.1074/jbc.M109.079707
    evidence_type: PRIMARY_EXPERIMENT
    snippet: shown to be an FAD-dependent oxidative decarboxylase
    notes: Rachid et al. inactivated cndG in Chondromyces crocatus Cm c5, observed
      pre-chondrochloren accumulation and loss of mature chondrochloren production,
      then expressed CndG in E. coli and assayed oxidative decarboxylation of pre-chondrochlorens.
  - reference: DOI:10.1016/j.chembiol.2008.11.005
    evidence_type: PRIMARY_EXPERIMENT
    notes: Rachid et al. sequenced the AM988861 chondrochloren biosynthetic gene cluster
      from C. crocatus Cm c5 and nominated CndG as the candidate oxidative decarboxylase.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000970.5/BGC0000970.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000970.5 maps the C. crocatus AM988861 chondrochloren biosynthetic
      gene cluster CDS CAQ43085.1 to cndG and cross-references UniProtKB:B9ZUK6.
  - reference: https://www.uniprot.org/uniprotkb/B9ZUK6
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:B9ZUK6 is the 541 aa C. crocatus CndG 1'-carboxy-chondrochloren
      decarboxylase, cross-references AM988861 protein CAQ43085.1, and annotates RHEA:81491
      from PMID:20080978.
  - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: The Rhea Swiss-Prot mapping links UniProtKB:B9ZUK6 to RHEA:81491, the EC
      4.1.1.129 1'-carboxy-chondrochloren A decarboxylation reaction.
