- graph_id: chondrochloren-a-cndh-native-reference
  scope: BIOSYNTHESIS
  description: Native-reference identity only for CndH in Chondromyces crocatus Cm
    c5/taxon 52/AM988861.1. Placement in this owner is curator-inferred from the shared
    BGC0000970 context, not proof of an exact-product reaction. The MITE wildcard
    phenol model does not identify a complete carrier-bound substrate; carrier and
    reductase are not assigned. No chlorination, deletion phenotype, pathway order
    or physical complex is asserted. Historical UniProtKB:B9ZUJ5 is deleted; its UniParc
    identifier is not a current UniProtKB example. The CndH primary paper (DOI:10.1016/j.jmb.2008.10.057)
    returned HTTP 403 and the distinct cluster paper (DOI:10.1016/j.chembiol.2008.11.005)
    was inaccessible on 2026-10-08; retrieval stopped for both. No primary CndH experiment
    is independently adopted.
  nodes:
  - node_id: cndh_cds
    label: cndH CDS (AM988861.1)
    node_type: GENE
    grounding_status: UNGROUNDED
  - node_id: cndh
    label: CndH (C. crocatus Cm c5 native-reference example)
    node_type: PROTEIN
    grounding_status: GROUNDED
    identifier: NCBIProtein:CAQ43074.1
  edges:
  - subject: cndh_cds
    predicate: encodes the native protein reference
    object: cndh
    notes: 5294..6832 reverse strand; 1539-nt complete CDS including stop, 512 residues.
      The deposited PDB sample sequence matches, but this does not establish all coordinate
      residues, tag processing, the full experimental preparation or activity. Native
      sequence identity is distinct from a primary reaction claim.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AM988861.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-08'
      snippet: /gene="cndH"
      notes: The 51,243-bp cluster deposition annotates cndH/CAQ43074.1 at complement(5294..6832),
        codon_start 1, translation table 11, strain Cm c5/taxon 52. The deposited
        halogenase label is not independently inspected activity evidence.
    - reference: https://www.ncbi.nlm.nih.gov/protein/CAQ43074.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-08'
      notes: Versioned GenPept CAQ43074.1 is the 512-residue C. crocatus Cm c5 conceptual
        translation of cndH and explicitly codes from complement(AM988861.1:5294..6832).
        Its historical B9ZUJ5 cross-reference must not be treated as an active UniProtKB
        entry.
    - reference: https://data.rcsb.org/rest/v1/core/polymer_entity/3E1T/1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-08'
      notes: Independent PDB 3E1T entity 1 deposition (chain A) gives a 512-residue
        sample sequence, cndh source gene and C. crocatus taxon 52. It names E. coli
        as expression host, not as native producer. This is deposited sequence metadata,
        not a read of the inaccessible paper methods or proof that every residue is
        resolved.
    - reference: https://rest.uniprot.org/uniprotkb/B9ZUJ5.json
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-08'
      snippet: Not part of a reference proteome
      notes: Current endpoint reports entryType Inactive and inactiveReasonType DELETED,
        linking historical B9ZUJ5 to UniParc UPI0001932834. Neither is selected as
        a current UniProtKB example. Deletion is not evidence that the native protein
        does not exist.
    - reference: https://github.com/mite-standard/mite_data/blob/6eacd913b2036376031072f69cbb33908f132998/mite_data/data/MITE0000494.json
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-08'
      notes: Pinned active MITE0000494 v1 links CndH with CAQ43074.1 and BGC0000970.
        Its uniprot field contains a UniParc identifier. Its wildcard phenol chlorination
        model and heterologous-expression evidence code are not promoted into an independently
        verified complete-substrate reaction.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AM988861.1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-08'
      notes: Complete-CDS-aware reverse-strand translation, deposited translation,
        separate GenPept and PDB entity 1 sample sequence agree over all 512 residues.
        Matching gene, accession, native strain and taxon establish this reference
        identity. Placement in this owner is inferred from its existing AM988861.1/BGC0000970
        context, not from an experiment on the exact owner. The current exact-gene/taxon
        or accession UniProtKB query returned zero entries; this bounded result does
        not establish global database absence.
