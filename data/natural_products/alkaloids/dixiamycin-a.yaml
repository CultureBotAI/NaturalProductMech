biosynthetic_pathway:
- step_number: 1
  enzyme_label: XiaH aryl-coupling flavoprotein
  proposed: true
  notes: This proposed pathway entry captures Streptomyces sp. HKI0576 xiaH/CCH63734.1
    as the BGC0000665 aryl-coupling flavoprotein that forms the N-N-linked dixiamycin
    scaffold. The immediate xiamycin monomer and the atropodiastereomer branch between
    dixiamycin A and B are left unexpanded.
  evidence:
  - reference: DOI:10.1002/anie.201303733
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Regiodivergent N-C and N-N Aryl Coupling Reactions of Indoloterpenes
    notes: Baunach et al. assigned the HKI0576 xiamycin flavoenzyme XiaH as an aryl-coupling
      enzyme for N-N-linked dixiamycin formation.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000665.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0000665.5 lists dixiamycin A and dixiamycin B as products of the
      HE815466.1 Streptomyces sp. HKI0576 xiamycin cluster.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000665.5/BGC0000665.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: The official MIBiG BGC0000665.5 GenBank summary annotates xiaH as HE815466.1:7534..9327
      on the reverse strand with GenPept product CCH63734.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CCH63734.1
    evidence_type: DATABASE_ASSERTION
    snippet: XiaH protein
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept CCH63734.1 is the 597 aa xiaH coding sequence from the Streptomyces
      sp. HKI0576 HE815466.1 indolosesquiterpenoid cluster. UniProtKB currently has
      no exact entry for this GenPept or EMBL accession.
