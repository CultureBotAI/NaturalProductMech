definition: A triazaacenaphthylene that is 2,2a,3,4,5,5a,6,7-octahydro-1<em>H</em>-1,8,8b-triazaacenaphthylene
  which is substituted at positions 3, 4, and 7 by methyl, sulfooxy, and (2,6-dioxo-1,2,3,6-tetrahydropyrimidin-4-yl)(hydroxy)methyl
  groups, respectively (the 2a<i>S</i>,3<i>R</i>,4<i>S</i>,5a<i>S</i>,7<i>R</i> stereoisomer
  in which the carbon bearing the hydroxy group has <i>S</i> configuration). It is
  a cyanotoxin produced by several species of freshwater cyanobacteria, such as <em>Aphanizomenon
  ovalisporum</em>.
