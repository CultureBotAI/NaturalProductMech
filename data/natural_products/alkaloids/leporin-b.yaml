  edges:
  - subject: leporin_c
    predicate: is N-hydroxylated by
    object: lepd
    notes: LepD adds the N-hydroxy group that distinguishes the final hydroxamic-acid
      product leporin B from the 2-pyridone precursor leporin C.
    evidence:
    - reference: DOI:10.1038/nature23882
      evidence_type: PRIMARY_EXPERIMENT
      snippet: Further addition of the P450 lepD yielded the final product 1, thereby
        completing heterologous pathway reconstitution.
      notes: Ohashi et al. heterologously reconstituted leporin B biosynthesis in
        Aspergillus nidulans; after LepA/LepG/LepH/LepF/LepI formed leporin C as the
        desired pyran product, further addition of LepD yielded leporin B.
    - reference: https://mite.lisc.univie.ac.at/repository/MITE0000321
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-01'
      notes: MITE0000321 is active and links LepD to UniProtKB:B8NJG8, GenPept EED49867.1,
        MIBiG BGC0001445 and the N-hydroxylation of leporin C to leporin B.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0001445.5/BGC0001445.gbk
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-01'
      notes: MIBiG BGC0001445.5 places EED49867.1 in the active Aspergillus flavus
        NRRL3357 leporin B biosynthetic gene cluster as the AFLA_066890 cytochrome
        P450 locus.
    - reference: https://www.uniprot.org/uniprotkb/B8NJG8
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-01'
      notes: Reviewed UniProtKB:B8NJG8 is the 508 aa Aspergillus flavus NRRL3357 cytochrome
        P450 monooxygenase LepD entry and cross-references EMBL EQ963479 protein EED49867.1.
    - reference: https://www.ncbi.nlm.nih.gov/protein/EED49867.1
      evidence_type: DATABASE_ASSERTION
