  edges:
  - subject: alcohol_4
    predicate: is stereoselectively dehydrated by
    object: lepi
    notes: LepI dehydrates alcohol intermediate 4 to the (E)-5 o-quinone methide species
      that enters the pericyclic branch toward leporin C.
    evidence:
    - reference: DOI:10.1038/nature23882
      evidence_type: PRIMARY_EXPERIMENT
      snippet: which requires stereoselective dehydration to yield (E)-5 and subsequent
        HDA reaction to 2
      notes: Ohashi et al. heterologously expressed lepI in Aspergillus nidulans and
        purified LepI from Escherichia coli; both assays supported LepI stereoselectively
        dehydrating alcohol 4 and controlling the pericyclic reactions that produce
        leporin C.
    - reference: https://mite.lisc.univie.ac.at/repository/MITE0000316
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-01'
      notes: MITE0000316 is active and links LepI to UniProtKB:B8NJH3, GenPept EED49872.1,
        MIBiG BGC0001445, stereoselective dehydration and a hetero-Diels-Alder reaction.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0001445.5/BGC0001445.gbk
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-01'
      notes: MIBiG BGC0001445.5 places EED49872.1 in the active Aspergillus flavus
