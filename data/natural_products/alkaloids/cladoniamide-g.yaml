definition: An organic heteropentacyclic compound that is 7,12-dihydro-6H-pyrido[1,2-a:3,4-b']diindole
  substituted by chloro groups at positions 2 and 9, a hydroxy group at position 7,
  a methoxy group at position 13, a N-methyl carbamyl group at position 7 and an oxo
  group at position 6 (the 7R stereoisomer). It is isolated from the culture broth
  of Streptomyces uncialis and exhibits cytotoxicity against human breast cancer MCF-
  cells.
