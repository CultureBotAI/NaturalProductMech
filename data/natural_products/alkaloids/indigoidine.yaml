- discussion_id: curator-indigoidine-glna-construct-identity
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#indigoidine-indc-biosynthesis
  prompt: Which complete GlnA protein sequence was expressed in pFC6/pFC7, and how
    should the reported 1284-bp fragment be reconciled with the 1410-bp BL21(DE3)
    references?
  rationale: The conditional yield result can be represented without declaring an
    exact protein sequence. Native reference and primer agreement cannot decide whether
    the reported length is an error or reflects a different construct. Resolve this
    before assigning an exact accession or transferring sequence-specific properties.
    The deleted C6EF31 accession is a separate current-availability limitation.
  evidence:
  - reference: DOI:10.1007/s10295-015-1642-5
    supports: SUPPORT
    evidence_source: primary methods/results text
    explanation: Reports the BL21(DE3) donor, 1284-bp fragment and pFC6/pFC7 cloning;
      actual insert sequence and figure pixels are unverified.
  - reference: https://www.ncbi.nlm.nih.gov/protein/ACT45548.1
    supports: SUPPORT
    evidence_source: database
    explanation: 469-residue native reference with a 1410-nt CDS.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAQ34221.1
    supports: SUPPORT
    evidence_source: database
    explanation: Independent matching native protein reference.
  - reference: https://www.uniprot.org/uniprotkb/C6EF31/entry
    supports: SUPPORT
    evidence_source: database
    explanation: Historical accession is currently deleted, not an active example.
- discussion_id: curator-indigoidine-bpsa-reporter-construct
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#indigoidine-j1074-pptase-reporter
  prompt: What is the complete sequence of the BpsA reporter used in the J1074 PPTase
    experiment?
  rationale: The reported reverse primer has no exact 3-prime template suffix of at
    least 15 nt in AB240063.1, although the forward endpoint matches. This does not
    prove a nonsynonymous change or a wrong reporter. Do not equate the reporter with
    BAE93896.1/UniProtKB:Q1MWN4 without resolving the construct.
  evidence:
  - reference: DOI:10.1093/femsle/fnx155
    supports: SUPPORT
    evidence_source: primary methods
    explanation: Reporter amplified from pCDF-duet::bpsA and cloned into pIJ10257;
      methods give the two primers but not a full insert sequence.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB240063.1
    supports: SUPPORT
    evidence_source: curator sequence comparison
    explanation: Native 3849-nt CDS translates to all 1282 residues of BAE93896.1.
      Exact primer suffix search finds the forward endpoint but not the reverse endpoint;
      actual reporter sequence equivalence is unresolved.
