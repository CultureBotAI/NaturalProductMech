      retrieved_on: '2026-10-11'
      notes: 'Reviewed entry 88, sequence 1, release 2026_03: bpsA, Streptomyces lavendulae,
        1282 residues; FUNCTION and RHEA:81499 annotations cite PMID:17237222. This
        is the exact native reference, not the S. chromofuscus Sc-IndC protein.'
