      evidence_type: PRIMARY_EXPERIMENT
      retrieved_on: '2026-10-11'
      notes: Primary abstract reports purified recombinant BPSA from S. lavendulae
        ATCC11924 using L-Gln. Activity required phosphopantetheinylation by a Streptomyces
