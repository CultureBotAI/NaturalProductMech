  notes: Streptomyces chromofuscus ATCC 49982 Sc-IndC is the exact indigoidine synthase
    encoded by the MIBiG BGC0000375 indC CDS; Sc-IndB stimulation of indigoidine yield
    is left unexpanded because that accessory effect is not the Rhea-grounded synthase
    reaction curated here.
  evidence:
  - reference: DOI:10.1007/s10295-012-1207-9
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Sc-IndC was functionally characterized as an indigoidine synthase through
      heterologous expression
    notes: Yu et al. located the silent Streptomyces chromofuscus ATCC 49982 cluster
      and showed that Sc-IndC produces indigoidine in heterologous Streptomyces coelicolor
      CH999 and Escherichia coli BAP1 hosts.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000375.5/BGC0000375.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000375.5 places indC at 1630..5763 in the Streptomyces chromofuscus
      ATCC 49982 JX499187.1 cluster, with protein_id AFV27434.1 and product indigoidine
      synthase.
  - reference: https://www.uniprot.org/uniprotkb/K4MP98
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: UniProtKB:K4MP98 is the unreviewed Streptomyces chromofuscus indC gene
      product and cross-references EMBL JX499187 protein AFV27434.1.
  - reference: https://www.rhea-db.org/rhea/81499
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: RHEA:81499 is the overall indigoidine synthase reaction consuming FMN,
      L-glutamine, ATP and O2 to form indigoidine, FMNH2, AMP, diphosphate and H2O;
      RHEA:81500 is its left-to-right direction.
