  scope: BIOSYNTHESIS
  description: S. lavendulae ATCC11924 BpsA indigoidine biosynthesis, represented
    by its exact native reference. Catalytic activity requires the phosphopantetheinylated
    enzyme. This is an independent organism-specific mechanism, not a downstream step
    of the existing Sc-IndC pathway.
