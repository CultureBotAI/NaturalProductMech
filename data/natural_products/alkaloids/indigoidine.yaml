    exact protein sequence. Native reference and primer agreement cannot decide whether
    the reported length is an error or reflects a different construct. Resolve this
    before assigning an exact accession or transferring sequence-specific properties.
    The deleted C6EF31 accession is a separate current-availability limitation.
