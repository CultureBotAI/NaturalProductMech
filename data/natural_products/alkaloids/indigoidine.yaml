- discussion_id: curator-indigoidine-bpsa-reporter-construct
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#indigoidine-j1074-pptase-reporter
  prompt: What is the complete sequence of the BpsA reporter used in the J1074 PPTase
    experiment?
  rationale: The reported reverse primer has no exact 3-prime template suffix of at
    least 15 nt in AB240063.1, although the forward endpoint matches. This does not
    prove a nonsynonymous change or a wrong reporter. Do not equate the reporter with
    BAE93896.1/UniProtKB:Q1MWN4 without resolving the construct.
  evidence:
  - reference: DOI:10.1093/femsle/fnx155
    supports: SUPPORT
    evidence_source: primary methods
    explanation: Reporter amplified from pCDF-duet::bpsA and cloned into pIJ10257;
      methods give the two primers but not a full insert sequence.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB240063.1
    supports: SUPPORT
    evidence_source: curator sequence comparison
    explanation: Native 3849-nt CDS translates to all 1282 residues of BAE93896.1.
      Exact primer suffix search finds the forward endpoint but not the reverse endpoint;
      actual reporter sequence equivalence is unresolved.
- discussion_id: curator-indigoidine-ccm3239-bpsa-alleles
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#indigoidine-ccm3239-bpsa-interventions
  prompt: Which complete bpsA alleles occur in the parental stocks and engineered
    strains used for the 2010 deletion and 2026 upstream-promoter experiments?
  rationale: Historical ACK77757.1 encodes Ala385, whereas ACK77757.2, ATZ29785.1
    and UniProtKB:A0A2K8PVS5 encode Thr385. A sequence-record replacement does not
    identify the tested genotypes. Keep the two native references distinct and do
    not transfer sequence-specific functional claims until the experimental alleles
    are resolved.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/FJ479754.1
    supports: SUPPORT
    evidence_source: curator sequence comparison
    explanation: Complete historical translation matches ACK77757.1; comparison with
      KJ396772.2 finds three coding nucleotide differences and one amino-acid difference.
  - reference: DOI:10.1007/s12223-010-0018-5
    supports: SUPPORT
    evidence_source: primary abstract
    explanation: Deletion phenotype reported; full experimental methods remain uninspected.
  - reference: DOI:10.1007/s00253-026-13908-9
    supports: SUPPORT
    evidence_source: primary methods and selected supplement
    explanation: Cassette primers and Southern controls locate the intervention; no
      complete BpsA allele sequence was established in this audit.
