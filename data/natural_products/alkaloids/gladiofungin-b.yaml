biosynthetic_pathway:
- step_number: 1
  enzyme_label: LvStA_05069 AfsA-like offloading domain
  proposed: true
  notes: This curates the terminal AfsA-like offloading domain of the Burkholderia
    gladioli Lv-StA LvStA_05069/KAF1058474.1 trans-AT PKS as a required contributor
    to noncanonical chain release and butenolide formation in BGC0002083 gladiofungin
    B biosynthesis. The exact KAF1058474.1 GenPept accession did not resolve in UniProtKB
    accession search on 2026-09-27, so enzyme_id is left unfilled and the public GenPept
    sequence is cited as official NCBI grounding evidence.
  evidence:
  - reference: DOI:10.1002/anie.202005711
    evidence_type: PRIMARY_EXPERIMENT
    snippet: the AfsA domain plays a key role
    notes: Florez et al. used a CRISPR/Cas marker-less deletion to remove part of
      the AfsA-like terminal offloading domain in the Burkholderia gladioli HKI0739/Lv-StA
      gla trans-AT PKS assembly line and showed that the mutant no longer produced
      gladiofungin A or B.
  - reference: mibig:BGC0002083
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0002083 version 3 maps module 10 of the Burkholderia gladioli
      Lv-StA gladiofungin trans-AT PKS assembly line to LvStA_05069 and annotates
      its terminal modification domain as A-factor synthase A.
  - reference: https://www.ncbi.nlm.nih.gov/protein/KAF1058474.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Polyketide synthase PksN
    notes: NCBI GenPept KAF1058474.1 is the 10,181 aa LvStA_05069 CDS on complement(WITE01000004.1:1156002..1186547)
      from Burkholderia gladioli Lv-StA. The exact KAF1058474.1 GenPept accession
      did not resolve in UniProtKB accession search on 2026-09-27.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/WITE01000004.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Burkholderia gladioli strain Lv-StA LvStA_4
    notes: GenBank WITE01000004.1 contains the BGC0002083 region used by MIBiG; within
      that contig, LvStA_05069 encodes protein KAF1058474.1.
