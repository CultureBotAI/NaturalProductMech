biosynthetic_pathway:
- step_number: 1
  enzyme_label: LvStA_05069 AfsA-like offloading domain
  proposed: true
  notes: The C-terminal AfsA-like offloading domain of the Burkholderia gladioli LvStA
    gladiofungin polyketide synthase GladA (locus tag LvStA_05069, GenPept KAF1058474.1)
    catalyzes offloading of the polyketide chain with glyceraldehyde 3-phosphate and
    triggers spontaneous dehydration and rearrangement to the gladiofungin butenolide/maleicanhydride
    pharmacophore in gladiofungin B biosynthesis; enzyme_id is grounded to the native
    GenPept accession NCBIProtein:KAF1058474.1 because UniParc UPI00139C1DD8 maps
    only to retired/obsolete UniProtKB/TrEMBL entry A0A833UU34.1 with no active UniProtKB
    accession.
  evidence:
  - reference: DOI:10.1002/anie.202005711
    evidence_type: PRIMARY_EXPERIMENT
    snippet: the AfsA domain plays a key role
    notes: Florez et al. used a CRISPR/Cas marker-less deletion to remove part of
      the AfsA-like terminal offloading domain in the Burkholderia gladioli HKI0739/Lv-StA
      gla trans-AT PKS assembly line and showed that the mutant no longer produced
      gladiofungin A or B.
  - reference: mibig:BGC0002083
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0002083 version 3 maps module 10 of the Burkholderia gladioli
      Lv-StA gladiofungin trans-AT PKS assembly line to LvStA_05069 and annotates
      its terminal modification domain as A-factor synthase A.
  - reference: https://www.ncbi.nlm.nih.gov/protein/KAF1058474.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Polyketide synthase PksN
    notes: NCBI Protein KAF1058474.1 is the 10,181-aa Burkholderia gladioli LvStA
      amino acid adenylation domain-containing protein encoded by locus tag LvStA_05069
      on GenBank WITE01000004.1 (complement 433101..463646) and grounds the GladA/LvStA_05069
      step and enzyme node as NCBIProtein:KAF1058474.1.
  - reference: https://www.uniprot.org/uniparc/UPI00139C1DD8
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-23'
    snippet: KAF1058474.1
    notes: UniParc UPI00139C1DD8 archives the exact 10,181-aa Burkholderia gladioli
      LvStA_05069 sequence (EMBL WITE01000004.1 protein KAF1058474.1) and records
      that UniProtKB/TrEMBL entry A0A833UU34.1 is inactive/obsolete, confirming no
      active UniProtKB accession resolves for KAF1058474.1.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/WITE01000004.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Burkholderia gladioli strain Lv-StA LvStA_4
    notes: GenBank WITE01000004.1 contains the BGC0002083 region used by MIBiG; within
      that contig, LvStA_05069 encodes protein KAF1058474.1.
  enzyme_id: NCBIProtein:KAF1058474.1
