      7.8, 7.6% glycerol; 30 C for 24 h.'
  - subject: nokabcd_assay
    predicate: produces
    object: cpa
    evidence:
    - reference: DOI:10.1039/b905293c
      evidence_type: PRIMARY_EXPERIMENT
      snippet: the cell-free crude extract of the NokABCD proteins
      notes: 'Figs. 8-9 and product-characterization methods: HPLC time-zero comparison
        and isolated-product NMR support CPA formation. The printed exact-mass values
        disagree with the calculated masses; they are not used as confirming exact-mass
        evidence.'
  - subject: nokd
    predicate: binds
    object: fad
    evidence:
    - reference: DOI:10.1016/j.chembiol.2012.05.016
      evidence_type: PRIMARY_EXPERIMENT
      snippet: purifies without bound FAD
      notes: 'Table 2: reported uncertainty retained without assigning an unstated
        SD/SEM statistic.'
    - reference: https://ars.els-cdn.com/content/image/1-s2.0-S1074552112001809-mmc1.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Fig. S2C and caption: ITC at 25 C. SI pp. 18-19: pET28a InkE recombinant
        construct; canonical identifier excludes its affinity tag.'
    - reference: https://rest.uniprot.org/uniparc/UPI00006CA182
      evidence_type: DATABASE_ASSERTION
      notes: Active cross-references link Q27IF2, InkE ABD59214.1 (DQ399653.1), and
        NokD ACN29721.1 (FJ031030.1). All three 525-aa sequences and SI Fig. S1 InkE
        agree exactly; the published InkE primer target regions also match.
      retrieved_on: '2026-10-03'
    notes: 'Table 2: InkE ITC Kd = 59 +/- 48 uM, four experiments. Separate Ni-affinity-purified
      InkE preparation from Rosetta 2(DE3) pLysS, not the untagged pCY20 extract.
      As-isolated apo protein was titrated with FAD in 150 mM NaCl, 25 mM HEPES pH
      7.5, 10% glycerol. Binding alone does not demonstrate monooxygenation or product
      turnover.'
