  edges:
  - subject: k_252a
    predicate: binds
    object: met
    notes: PubChem BioAssay AID 977611 maps this exact Standard InChIKey to a 0.01
      uM Kd row for PDB 1R0P chain A; PDB 1R0P maps chain A to UniProtKB:P08581 residues
      1049-1360 and records the KSA K-252A ligand bound to an engineered kinase-domain
      construct carrying Y1194F, Y1234F, Y1235D, and V1272L substitutions.
    evidence:
    - reference: DOI:10.1073/pnas.1734128100
      evidence_type: PRIMARY_EXPERIMENT
      snippet: Crystal structure of the tyrosine kinase domain of the hepatocyte growth
        factor receptor c-Met and its complex with the microbial alkaloid K-252a
      notes: PDB 1R0P is the K-252a-bound structure described by Schiering et al.;
        PubChem reports its PDB-derived 10 nM Kd for this exact Standard InChIKey.
    - reference: DOI:10.2210/pdb1r0p/pdb
      evidence_type: DATABASE_ASSERTION
      notes: RCSB PDB identifies 1R0P as a human c-Met tyrosine kinase domain structure
        in complex with KSA K-252A and maps entity 1 chain A to UniProtKB:P08581.
