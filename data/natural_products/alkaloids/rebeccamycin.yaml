biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q8KHE4
  enzyme_label: RebG 4'-demethylrebeccamycin synthase
  reaction_id: RHEA:27397
  substrates:
  - CHEBI:330772
  - CHEBI:15903
  product: CHEBI:595389
  notes: RebG N-glucosylates dichloroarcyriaflavin A to form 4'-demethylrebeccamycin
    in the penultimate rebeccamycin biosynthetic step; Rhea maps the corresponding
    EC 4.3.3.5 reaction to RHEA:27397.
  evidence:
  - reference: DOI:10.1002/cbic.200500504
    evidence_type: PRIMARY_EXPERIMENT
    snippet: rebG encodes for the rebeccamycin N-glucosyltransferase
    notes: Zhang et al. used in vivo RebG biotransformation in Streptomyces lividans
      and Escherichia coli and characterized indolocarbazole glucosylation by L. aerocolonigenes
      RebG.
  - reference: DOI:10.1271/bbb.67.127
    evidence_type: PRIMARY_EXPERIMENT
    notes: Onaka et al. characterized the L. aerocolonigenes ATCC 39243 reb cluster
      and assigned RebG to D-glucose glycosylation of the rebeccamycin aglycon.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000821.5/BGC0000821.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000821.5 maps the L. aerocolonigenes AB090952 rebeccamycin biosynthetic
      gene cluster CDS BAC10673.1 to rebG and annotates the product as an N-glycosyltransferase.
  - reference: https://www.uniprot.org/uniprotkb/Q8KHE4
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:Q8KHE4 is the 421 aa L. aerocolonigenes RebG 4'-demethylrebeccamycin
      synthase, cross-references AB090952 protein BAC10673.1, and annotates RHEA:27397
      from PMID:16575939.
  - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: The Rhea Swiss-Prot mapping links UniProtKB:Q8KHE4 to RHEA:27397, the EC
      4.3.3.5 reaction interconverting dichloroarcyriaflavin A and 4'-demethylrebeccamycin.
- step_number: 2
  enzyme_id: UniProtKB:Q8KZ94
  enzyme_label: RebM demethylrebeccamycin-D-glucose O-methyltransferase
  reaction_id: RHEA:27353
  substrates:
  - CHEBI:595389
  - CHEBI:59789
  product: CHEBI:135511
  notes: RebM transfers the SAM methyl group to 4'-demethylrebeccamycin in the terminal
    O-methylation that forms rebeccamycin; Rhea maps this EC 2.1.1.164 reaction to
    RHEA:27353.
  evidence:
  - reference: DOI:10.1074/jbc.M800503200
    evidence_type: PRIMARY_EXPERIMENT
    snippet: RebM catalyzes glucosyl C-4′ O-methylation as the final step in rebeccamycin
      biosynthesis
    notes: Singh et al. expressed Lechevalieria aerocolonigenes RebM from the pCST28aRebM
      construct, crystallized the enzyme, and analyzed SAM-dependent O-methyltransferase
      catalysis by the wild type enzyme and site-directed mutants.
  - reference: DOI:10.1002/cbic.200500504
    evidence_type: PRIMARY_EXPERIMENT
    snippet: in vitro RebM-catalyzed 4′-O-methylation
    notes: Zhang et al. established that rebM encodes the rebeccamycin 4'-O-methyltransferase
      and showed in vitro RebM methylation of RebG-derived indolocarbazole glucosides.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000821.5/BGC0000821.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG BGC0000821.5 maps the L. aerocolonigenes AB090952 rebeccamycin biosynthetic
      gene cluster CDS BAC10678.1 to rebM.
  - reference: https://www.uniprot.org/uniprotkb/Q8KZ94
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:Q8KZ94 is the 283 aa L. aerocolonigenes RebM demethylrebeccamycin-D-glucose
      O-methyltransferase, cross-references AB090952 protein BAC10678.1, and annotates
      RHEA:27353 from PMID:18502766.
  - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: The Rhea Swiss-Prot mapping links UniProtKB:Q8KZ94 to the RebM O-methyltransferase
      reaction RHEA:27353.
