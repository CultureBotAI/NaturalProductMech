biosynthetic_pathway:
- step_number: 1
  enzyme_label: RhbA (diaminobutyrate aminotransferase) and RhbB (diaminobutyrate
    decarboxylase)
  notes: Condensation of L-aspartate 4-semialdehyde and L-glutamate to L-2,4-diaminobutyrate
    followed by pyridoxal 5'-phosphate-dependent decarboxylation to synthesize the
    symmetrical 1,3-diaminopropane diamine precursor in Sinorhizobium meliloti.
  evidence:
  - reference: PMID:11524112
    evidence_type: PRIMARY_EXPERIMENT
    notes: RhbA and RhbB convert L-aspartate beta-semialdehyde and glutamate into
      1,3-diaminopropane in the Sinorhizobium meliloti rhbABCDEF pathway.
- step_number: 2
  enzyme_label: RhbD (acyltransferase), RhbE (1,3-diaminopropane monooxygenase), RhbC
    and RhbF (NIS siderophore synthetases)
  substrates:
  - CHEBI:30769
  - CHEBI:15351
  products:
  - CHEBI:74252
  notes: N4-hydroxylation of 1,3-diaminopropane, asymmetric N-acylation with acetyl-CoA
    and (E)-dec-2-enoyl-ACP/CoA, and ATP-dependent NIS condensation with citric acid
    to yield rhizobactin 1021.
  evidence:
  - reference: PMID:11524112
    evidence_type: PRIMARY_EXPERIMENT
    notes: The rhbABCDEF operon directs asymmetric assembly of rhizobactin 1021 from
      citric acid, two N-hydroxy-1,3-diaminopropane units, an acetyl group, and an
      (E)-dec-2-enoyl fatty acyl chain.
