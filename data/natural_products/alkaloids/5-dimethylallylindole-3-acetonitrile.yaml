biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9ADJ2
  enzyme_label: SCO7467 5-dimethylallyltryptophan synthase
  substrates:
  - CHEBI:16828
  - CHEBI:16057
  notes: SCO7467 prenylates L-tryptophan at C-5 with dimethylallyl diphosphate to
    form 5-dimethylallyl-L-tryptophan. The 5-DMAT product is left out of the structured
    product field because no exact stable chemical CURIE was selected.
  evidence:
  - reference: DOI:10.1074/jbc.M112.436451
    evidence_type: PRIMARY_EXPERIMENT
    snippet: SCO7467 catalyzes the prenylation of L-tryptophan
    notes: Izumikawa et al. introduced SCO7467 and SCO7468 into Streptomyces lividans,
      overproduced 5-DMAIAN, and biochemically assigned recombinant SCO7467 to C-5
      prenylation of L-tryptophan to 5-DMAT.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002128.3/BGC0002128.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0002128.3 places SCO7467 in the Streptomyces coelicolor A3(2)
      locus, annotates it as the rule-based indole_PTase core biosynthetic CDS, and
      cross-references protein CAC36059.1 and UniProtKB:Q9ADJ2.
  - reference: https://www.uniprot.org/uniprotkb/Q9ADJ2
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: UniProtKB:Q9ADJ2 is the unreviewed Streptomyces coelicolor A3(2) prenyltransferase
      entry cross-referenced to EMBL AL645882 protein CAC36059.1.
- step_number: 2
  enzyme_id: UniProtKB:Q8CJJ9
  enzyme_label: SCO7468 flavin-dependent monooxygenase
  notes: SCO7468 converts 5-DMAT into 5-dimethylallylindole-3-acetaldoxime. Both the
    5-DMAT substrate and 5-DMAIAOx product are left out of the structured substrate
    and product fields because no exact stable chemical CURIEs were selected.
  evidence:
  - reference: DOI:10.1074/jbc.M112.436451
    evidence_type: PRIMARY_EXPERIMENT
    snippet: SCO7468 then catalyzes the conversion of 5-DMAT
    notes: Izumikawa et al. biochemically assigned recombinant SCO7468 as the FMO
      enzyme that converts 5-DMAT into the aldoxime intermediate 5-DMAIAOx.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002128.3/BGC0002128.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0002128.3 places SCO7468 next to SCO7467 in the Streptomyces coelicolor
      A3(2) locus, annotates it as an FMO-like biosynthetic-additional CDS, and cross-references
      protein CAD55403.1 and UniProtKB:Q8CJJ9.
  - reference: https://www.uniprot.org/uniprotkb/Q8CJJ9
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: UniProtKB:Q8CJJ9 is the unreviewed Streptomyces coelicolor A3(2) flavin-binding
      monooxygenase entry cross-referenced to EMBL AL645882 protein CAD55403.1.
