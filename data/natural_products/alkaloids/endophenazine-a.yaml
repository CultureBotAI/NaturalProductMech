biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:C4PWA1
  enzyme_label: PpzP 5,10-dihydrophenazine-1-carboxylate 9-dimethylallyltransferase
  reaction_id: RHEA:41580
  substrate: CHEBI:78312
  product: CHEBI:78313
  notes: This partial endophenazine A pathway captures the assayed Streptomyces anulatus
    PpzP dimethylallylation of 5,10-dihydrophenazine-1-carboxylate. Upstream PCA reduction
    and downstream oxidation to endophenazine A are left unexpanded because they were
    not assigned to exact assayed enzymes in the inspected sources.
  evidence:
  - reference: DOI:10.1074/jbc.M901312200
    evidence_type: PRIMARY_EXPERIMENT
    snippet: identified as a 5,10-dihydrophenazine 1-carboxylate dimethylallyltransferase
    notes: Saleh et al. identified Streptomyces anulatus 9663 ppzP in the endophenazine
      cluster, showed that ppzP inactivation abolished prenylated phenazine formation,
      and biochemically assigned purified PpzP to dimethylallyl transfer from 5,10-dihydrophenazine
      1-carboxylate.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/FN178498.1
    evidence_type: DATABASE_ASSERTION
    snippet: 5,10-dihydrophenazine-1-carboxylate
    retrieved_on: '2026-09-28'
    notes: GenBank FN178498.1 is the Streptomyces anulatus 9663 phenazine cluster
      sequence and assigns ppzP/CAX48655.1 to the first CDS.
  - reference: https://www.uniprot.org/uniprotkb/C4PWA1
    evidence_type: DATABASE_ASSERTION
    snippet: DR   EMBL; FN178498; CAX48655.1; -; Genomic_DNA.
    retrieved_on: '2026-09-28'
    notes: Reviewed UniProtKB:C4PWA1 is Streptomyces anulatus PpzP, length 299 aa,
      names ppzP, assigns EC 2.5.1.121, and cross-references EMBL FN178498 protein
      CAX48655.1.
  - reference: RHEA:41580
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: Rhea grounds EC 2.5.1.121 as transfer of dimethylallyl diphosphate to 5,10-dihydrophenazine
      1-carboxylate, forming 5,10-dihydro-9-dimethylallylphenazine 1-carboxylate and
      diphosphate.
