definition: A member of the class of resorcinols that is resorcinol in which the hydrogen
  at position 2 is replaced by a 4,5-dichloro-1H-pyrrole-2-carbonyl group. It is a
  natural product found in Pseudomonas fluorescens which exhibits antibacterial properties
  and is a strong inducer of caspase-3-dependent apoptosis.
