  edges:
  - subject: tdp_glucose
    predicate: is_substrate_for
    object: s8_oxidation
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 1A/B and AtmS8 experimental section.
  - subject: atms8
    predicate: catalyzes
    object: s8_oxidation
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 1A/B and AtmS8 experimental section.
      snippet: No reaction was observed via NMR or HPLC in controls lacking AtmS8.
    - reference: https://www.uniprot.org/uniprotkb/Q0H2W3
      evidence_type: DATABASE_ASSERTION
      notes: Canonical atS8, 450 aa, NCBITaxon:360723, exactly matches GenBank DQ297453.1
        CDS ABC02801.1 from Actinomadura melliaura SCC 1655, the BGC0000809 locus
        in this record. Translation was checked with the CDS genetic code and initiator
        convention. The identifier denotes the native parent, not its affinity tag.
      retrieved_on: '2026-10-03'
    notes: Genomic PCR; pET28a, E. coli BL21(DE3), N-terminal His6. 10 uM AtmS8, 2
      mM TDP-glucose and 6 mM NAD+ at 30 C; pyruvate/LDH NAD+ regeneration. NMR/HPLC
      reported about 97% conversion after 16 h; enzyme-omission controls showed no
      reaction.
  - subject: s8_oxidation
    predicate: produces
    object: tdp_glucuronate
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 1A/B and AtmS8 experimental section.
  - subject: tdp_glucuronate
    predicate: is_substrate_for
    object: s9_decarboxylation
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 2A and AtmS9 experimental section.
  - subject: atms9
    predicate: catalyzes
    object: s9_decarboxylation
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 2A and AtmS9 experimental section.
      snippet: quantitative conversion
    - reference: https://www.uniprot.org/uniprotkb/Q0H2W2
      evidence_type: DATABASE_ASSERTION
      notes: Canonical atS9, 329 aa, NCBITaxon:360723, exactly matches GenBank DQ297453.1
        CDS ABC02802.1 from Actinomadura melliaura SCC 1655, the BGC0000809 locus
        in this record. Translation was checked with the CDS genetic code and initiator
        convention. The identifier denotes the native parent, not its affinity tag.
      retrieved_on: '2026-10-03'
    notes: Same genomic-PCR expression strategy as AtmS8. Adding 15 uM AtmS9 after
      AtmS8 completion gave quantitative 4-T formation in 15 h at 30 C (NMR/HPLC);
      enzyme-omission controls showed no reaction. The paper also reports reduced
      xylose nucleotide after longer incubations (>24 h, 37 C), so 4-T is not an exclusive
      product under all conditions.
  - subject: s9_decarboxylation
    predicate: produces
    object: tdp_ketoxylose
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 2A and AtmS9 experimental section.
  - subject: tdp_ketoxylose
    predicate: is_substrate_for
    object: s14_degradation
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 3 and AtmS14 experimental section.
  - subject: atms14
    predicate: enables_observed_degradation_in
    object: s14_degradation
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 3 and AtmS14 experimental section.
      snippet: two new products
    - reference: https://www.uniprot.org/uniprotkb/Q0H2W5
      evidence_type: DATABASE_ASSERTION
      notes: Canonical atS14, 483 aa, NCBITaxon:360723, exactly matches GenBank DQ297453.1
        CDS ABC02799.1 from Actinomadura melliaura SCC 1655, the BGC0000809 locus
        in this record. Translation was checked with the CDS genetic code and initiator
        convention. The identifier denotes the native parent, not its affinity tag.
      retrieved_on: '2026-10-03'
    notes: pUC57 codon-optimized synthetic gene subcloned into pET28a; N-terminal
      His6, E. coli BL21(DE3). The main paper identifies the parent; the supplemental
      synthetic sequence was not retrievable and was not independently verified. Adding
      14 uM AtmS14 after AtmS9 completion yielded 6 and TDP within 6 h at 30 C (NMR/HPLC).
      Proposed 2,3-dehydration intermediate TDP-2-deoxy-4-keto-alpha-D-pentos-2-ene
      (5-T) was not isolated; these are degradation products, not a demonstrated finished
      sugar donor or direct two-product enzymatic reaction.
  - subject: s14_degradation
    predicate: yields_observed_product
    object: pyromicomic_acid
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 3 and AtmS14 experimental section.
  - subject: s14_degradation
    predicate: yields_observed_product
    object: tdp
    evidence:
    - reference: DOI:10.1002/cbic.201500365
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 3 and AtmS14 experimental section.
- graph_id: at2433-a1-atms13-structural-assembly
  scope: BIOSYNTHESIS
  description: Structural evidence for the AT2433-cluster putative sugar aminotransferase
    AtmS13. Dimer and PLP-adduct observations do not establish native-substrate turnover,
    substrate stereochemistry, or completed AT2433-A1 biosynthesis.
  nodes:
  - node_id: atms13
    label: AtmS13 SeMet construct (4ZWV; cleaved tag)
    node_type: PROTEIN
    grounding_status: GROUNDED
    identifier: UniProtKB:Q0H2X1
  - node_id: atms13_dimer
    label: AtmS13 homodimer in 4ZWV
    node_type: PROTEIN_COMPLEX
    grounding_status: UNGROUNDED
  - node_id: plp
    label: Pyridoxal 5-phosphate (PLP)
    node_type: COMPOUND
    grounding_status: UNGROUNDED
  edges:
  - subject: atms13
    predicate: is_subunit_of
    object: atms13_dimer
    evidence:
    - reference: DOI:10.1002/prot.24844
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 2A and Overall Structure section.
      snippet: representing the formation of a dimer
    - reference: https://www.uniprot.org/uniprotkb/Q0H2X1
      evidence_type: DATABASE_ASSERTION
      notes: Canonical atS13, 369 aa, NCBITaxon:360723, exactly matches GenBank DQ297453.1
        CDS ABC02793.1 from Actinomadura melliaura SCC 1655, the BGC0000809 locus
        in this record. Translation was checked with the CDS genetic code and initiator
        convention. The identifier denotes the native parent, not its affinity tag.
      retrieved_on: '2026-10-03'
    - reference: https://www.rcsb.org/structure/4ZWV
      evidence_type: DATABASE_ASSERTION
      notes: Deposited canonical entity sequence is SNA plus all 369 residues of Q0H2X1.
        SIFTS maps the complete native parent; assembly 1 is author/PISA-assigned
        dimeric.
      retrieved_on: '2026-10-03'
    notes: 1.50-A X-ray structure of SeMet protein expressed from pMCSG68 in E. coli
      BL21(DE3)-Gold. TEV removal of the StrepII/His6 tag leaves SNA before the native
      parent. The two-subunit crystal assembly is structural evidence, not an in-vivo
      assembly assay. The separate 3.00-A structure 4XAU used non-SeMet, pET28a N-His6
      protein with a different 20-residue N-terminal extension.
  - subject: atms13
    predicate: forms_covalent_internal_aldimine_with
    object: plp
    evidence:
    - reference: DOI:10.1002/prot.24844
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 1, Figure 2B and Cofactor Binding Site section.
      snippet: Both subunits contain a covalent PLP internal aldimine
    - reference: https://files.rcsb.org/download/4ZWV.cif
      evidence_type: DATABASE_ASSERTION
      notes: 'Chains A and B: modified residue LLP has label_seq_id 190 and auth_seq_id
        187, matching native Q0H2X1 Lys187. The three-residue prefix is not part of
        native numbering.'
      retrieved_on: '2026-10-03'
    notes: Crystallized with 1 mM PLP. The 4ZWV Lys187-PLP adduct occurs in both subunits,
      with two alternate PLP orientations refined at 0.50 occupancy each. This is
      cofactor-adduct evidence, not an aminopentose transamination assay.
