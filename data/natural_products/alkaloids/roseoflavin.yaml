biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:K4RFM2
  enzyme_label: RosA 8-amino-8-demethylriboflavin N,N-dimethyltransferase
  reaction_id: RHEA:51944
  notes: RosA is the Streptomyces davaonensis JCM 4913 BN159_8032 S-adenosyl-L-methionine-dependent
    dimethyltransferase that performs the final AF-to-MAF-to-RoF methylations. BN159_8032
    is outside the seeded BGC0000927 locus. RHEA:51944 captures the overall two-methylation
    reaction to CHEBI:136521 roseoflavin(1-), the major pH 7.3 microspecies of exact
    stereochemical CHEBI:72346 roseoflavin; the MIBiG-seeded record remains minted
    because its roseoflavin structure is stereochemically incomplete.
  evidence:
  - reference: DOI:10.1074/jbc.M111.292300
    evidence_type: PRIMARY_EXPERIMENT
    snippet: RosA catalyzes the two terminal steps of roseoflavin biosynthesis
    notes: Jankowitsch et al. purified N,N-8-amino-8-demethyl-D-riboflavin dimethyltransferase
      activity from S. davawensis, matched peptides to sda77220, named the gene rosA,
      expressed RosA in Escherichia coli, and showed that rosA inactivation produced
      AF but not MAF or roseoflavin.
  - reference: https://www.uniprot.org/uniprotkb/K4RFM2
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:K4RFM2 is S. davaonensis JCM 4913 BN159_8032/rosA, maps
      to EMBL HE971709 protein CCK32410.1, and annotates catalytic activity RHEA:51944.
  substrate: CHEBI:136518
  product: CHEBI:136521
