definition: A pyrrolobenzodiazepine that is (11a<i>S</i>)-2,3,5,10,11,11a-hexahydro-1<em>H</em>-pyrrolo[2,1-<em>c</em>][1,4]benzodiazepine
  substituted by an oxo group at position 5, by a hydroxy group at position 9, and
  by a 1<em>H</em>-indol-3-yl group at position 11<i>S</i>. It is a natural product
  discovered in <em>Klebsiella oxytoca</em> which is the causative toxin in antibiotic
  associated hemorrhagic colitis. It exhibits a microtubule-stabilizing activity that
  leads to mitotic arrest in the host cells.
