    Pseudomonas aeruginosa at lower efficiency than Fe(III).'
  evidence:
  - reference: PMID:19329644
    evidence_type: PRIMARY_EXPERIMENT
    notes: Ni(II)-pyochelin complexes bind FptA and mediate nickel uptake in Pseudomonas
      aeruginosa.
