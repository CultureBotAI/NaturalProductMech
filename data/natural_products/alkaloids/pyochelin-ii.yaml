biosynthetic_pathway:
- step_number: 1
  enzyme_label: PchA (isochorismate synthase), PchB (isochorismate pyruvate-lyase),
    and PchD (salicyl-AMP ligase)
  substrates:
  - CHEBI:17333
  products:
  - CHEBI:16914
  notes: Conversion of chorismic acid to salicylic acid by PchA/PchB and ATP-dependent
    adenylation to salicyl-AMP by PchD for loading onto the PchE NRPS.
  evidence:
  - reference: PMID:8982005
    evidence_type: PRIMARY_EXPERIMENT
    notes: The pchDCBA operon in Pseudomonas aeruginosa directs synthesis of salicylic
      acid from chorismate for pyochelin assembly.
  - reference: PMID:10555976
    evidence_type: PRIMARY_EXPERIMENT
    notes: PchD adenylates salicylic acid and transfers the salicyl moiety to the
      aryl carrier domain of PchE.
- step_number: 2
  enzyme_label: PchE (NRPS), PchF (NRPS with methyltransferase and thioesterase domains),
    and PchG (thiazoline reductase)
  substrates:
  - CHEBI:16914
  - CHEBI:17561
  - CHEBI:15414
  products:
  - CHEBI:67185
  notes: NRPS condensation and cyclodehydration of salicylate with two L-cysteine
    residues, NADPH-dependent thiazoline reduction by PchG, SAM-dependent N-methylation
    by PchF, and thioesterase release to yield pyochelin II.
  evidence:
  - reference: PMID:11467965
    evidence_type: PRIMARY_EXPERIMENT
    notes: Purified PchD, PchE, PchF, and PchG reconstitute total biosynthesis of
      pyochelin I and pyochelin II from salicylate, L-cysteine, ATP, NADPH, and SAM.
