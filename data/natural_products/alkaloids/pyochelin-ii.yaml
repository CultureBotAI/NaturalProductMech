molecular_targets:
- target_id: CHEBI:29034
  target_label: iron(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Primary physiological ferric ion chelation via tetradentate phenolate, thiazoline-N,
    thiazolidine-N, and carboxylate coordination (forming 2:1 [Fe(Pch)(HPch)] complexes,
    Kf ~ 2 x 10^28 M^-2) transported via the FptA outer membrane receptor.
  evidence:
  - reference: PMID:11467965
    evidence_type: PRIMARY_EXPERIMENT
    notes: In vitro reconstitution of Pseudomonas aeruginosa pyochelin biosynthesis
      from salicylate and two L-cysteine molecules by PchD, PchE, PchF, and PchG.
  - reference: PMID:19329644
    evidence_type: PRIMARY_EXPERIMENT
    notes: Pyochelin chelates Fe(III) and mediates high-affinity iron uptake via the
      FptA outer-membrane receptor in Pseudomonas aeruginosa.
  - reference: PMID:22261733
    evidence_type: PRIMARY_EXPERIMENT
    notes: Physicochemical and potentiometric characterization of Fe(III), Cu(II),
      and Zn(II) complexes of pyochelin.
- target_id: CHEBI:84043
  target_label: gallium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Chelation of trivalent gallium(3+) in
    solution; Ga(III)-pyochelin binds FptA and mediates gallium uptake into Pseudomonas
    aeruginosa.'
  evidence:
  - reference: PMID:19329644
    evidence_type: PRIMARY_EXPERIMENT
    notes: Ga(III) forms complexes with pyochelin that are recognized by the FptA
      outer-membrane receptor and imported into Pseudomonas aeruginosa.
- target_id: CHEBI:48828
  target_label: cobalt(2+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Chelation of divalent cobalt(2+) in
    solution; Co(II)-pyochelin binds the FptA outer membrane receptor and promotes
    measurable Co(II) accumulation in Pseudomonas aeruginosa, though at lower efficiency
    than Fe(III).'
  evidence:
  - reference: PMID:19329644
    evidence_type: PRIMARY_EXPERIMENT
    notes: Pyochelin chelates Co(II) and Ni(II) in solution and promotes their FptA-mediated
      uptake into Pseudomonas aeruginosa at 23-35-fold lower rates than Fe(III).
- target_id: CHEBI:49786
  target_label: nickel(2+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Chelation of divalent nickel(2+) in
