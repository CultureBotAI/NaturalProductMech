  evidence:
  - reference: DOI:10.1021/jacs.9b02204
    evidence_type: PRIMARY_EXPERIMENT
    snippet: A predicted flavoenzyme IccE was identified to epimerize the IEDDA product
      8-epi-ilicicolin H to ilicicolin H
    notes: Zhang et al. characterized the Penicillium variabile, synonymous with Talaromyces
      variabilis, icc pathway and showed that IccE converts 8-epi-ilicicolin H to
      ilicicolin H in heterologous reconstitution and in vitro epimerization experiments.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/MK539848.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: GenBank MK539848.1 is the Talaromyces variabilis HXQ-H-1 ilicicolin H cluster
      sequence and places iccE at protein_id QBQ83707.1.
  - reference: https://www.uniprot.org/uniprotkb/A0A482N8M8
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:A0A482N8M8 is the Talaromyces variabilis IccE / QBQ83707.1
      gene product and annotates the RHEA:64564 catalytic activity of 8-epi-ilicicolin
      H epimerization.
