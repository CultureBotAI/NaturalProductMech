biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:F2RB83
  enzyme_label: CmlI
  reaction_id: RHEA:58884
  notes: CmlI is the BGC0000893 SVEN_0924 arylamine N-oxygenase. RHEA:58884 captures
    the six-electron oxidation of alpha-N-dichloroacetyl-p-aminophenylserinol to exact
    stereochemical CHEBI:17698 chloramphenicol with AH2 and O2 as cosubstrates; the
    record remains minted because MIBiG BGC0000893 preserves a stereochemically incomplete
    chloramphenicol structure.
  evidence:
  - reference: DOI:10.1016/j.tet.2012.06.036
    evidence_type: PRIMARY_EXPERIMENT
    snippet: CmlI is an N-oxygenase in the biosynthesis of chloramphenicol
    notes: Lu et al. cloned S. venezuelae cmlI and reconstituted N-terminal His6-CmlI
      in vitro with NH2-CAM, phenazine methosulfate, and NADH, observing conversion
      to chloramphenicol.
  - reference: DOI:10.1021/acs.biochem.7b00695
    evidence_type: PRIMARY_EXPERIMENT
    snippet: CmlI N-Oxygenase Catalyzes the Final Three Steps in Chloramphenicol Biosynthesis
    notes: Komor et al. characterized CmlI kinetics with NH2-CAM, NH(OH)-CAM, and
      NO-CAM pathway intermediates and supported an enzyme-retained six-electron oxidation
      to chloramphenicol.
  - reference: https://www.uniprot.org/uniprotkb/F2RB83
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:F2RB83 is Streptomyces venezuelae ATCC 10712 SVEN_0924/cmlI
      and annotates catalytic activity RHEA:58884.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000893.5/BGC0000893.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0000893.5 places SVEN_0924 in the S. venezuelae ATCC 10712 chloramphenicol
      gene cluster and cross-references its CDS to UniProtKB/TrEMBL:F2RB83.
  - reference: https://www.rhea-db.org/rhea/58884
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: RHEA:58884 is the alpha-N-dichloroacetyl-p-aminophenylserinol plus AH2
      plus 2 O2 to chloramphenicol plus A plus 2 H2O reaction.
  substrate: CHEBI:47325
  product: CHEBI:17698
