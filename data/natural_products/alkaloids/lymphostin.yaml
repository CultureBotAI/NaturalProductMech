definition: A member of the class of pyrroloquinolines that is pyrrolo[4,3,2-<em>de</em>]quinoline
  in which the hydrogens at positions 4, 6 and 8 are replaced by (1<i>E</i>)-1-methoxy-3-oxoprop-1-en-3-yl,
  acetylamino and amino groups, respectively. It is an alkaloid isolated from <em>Streptomyces</em>
  and <em>Salinispora</em> species, exhibits potent immunosuppressive activity, and
  inhibits Fyn and Lck protein kinases.
