      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-11'
      notes: Reviewed entry version 27, sequence version 1. FUNCTION assigns SAM-dependent
        side-chain C-methylation of indolepyruvate in indolmycin biosynthesis.
      snippet: to yield 3-methylindolepyruvate
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/KM596502.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-11'
      notes: Native indolmycin cluster maps ind1 to AJT38682.1, KM596502.1:2494..3483,
