  attaches_to:
  - causal_graphs#indolmycin-ind1-ind2-annotated-precursor-branch
  prompt: Which primary construct and chemical data resolve the Ind1/Ind2 assays,
    exact intermediates and downstream oxazolinone assembly?
  rationale: Current UniProt FUNCTION annotations and native sequences support the
    added database roles. They do not independently establish the complete assayed
    constructs or exact intermediate forms.
  evidence:
  - reference: DOI:10.1073/pnas.1419964112
    supports: PARTIAL
    evidence_source: Indexed abstract/excerpts and database-linked citation; full
      article not newly inspected
    explanation: The 2015 study is a primary follow-up lead, not newly adopted experimental
      support for these edges. Its fullTextXML request returned HTTP 500 on 2026-10-11;
      no alternate retrieval was attempted.
  notes: Retain the existing Ind7 pathway, graph and their earlier evidence unchanged.
    Keep new roles at DATABASE_ASSERTION and the downstream link at CURATOR_INFERENCE.
    Do not transfer the 1975 unsequenced preparation kinetics to these native references,
    equate an inferred active site with mutagenesis, or infer Ind3/Ind4/Ind5/Ind6/Ind8
    function from cluster membership alone. Assay constructs, primary figures/supplements
    and exact intermediate chemical forms remain uninspected in this continuation.
