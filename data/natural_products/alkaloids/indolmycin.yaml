biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A0D4BSP3
  enzyme_label: Ind7 N-demethylindolmycin N-methyltransferase
  reaction_id: RHEA:24726
  product: naturalproductmech:mibig-3f4d7c9236
  notes: Ind7 catalyzes the terminal SAM-dependent N-methylation of N-demethylindolmycin
    to indolmycin. The immediate precursor is named in the evidence-backed notes and
    graph because the neutral N-demethylindolmycin structure is not grounded in the
    local corpus.
  evidence:
  - reference: DOI:10.1073/pnas.1419964112
    evidence_type: PRIMARY_EXPERIMENT
    snippet: responsible for the last N-methyltransfer reaction
    notes: Du et al. deleted ind7 in Streptomyces griseus subsp. griseus ATCC 12648
      and observed N-demethylindolmycin accumulation, then verified in vitro that
      Ind7 converts N-demethylindolmycin to indolmycin.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000384
    evidence_type: DATABASE_ASSERTION
    snippet: producing mature indolmycin
    retrieved_on: '2026-10-01'
    notes: MITE0000384 annotates Streptomyces griseus Ind7/A0A0D4BSP3 as a SAM-dependent
      N-methyltransferase, links GenPept AJT38688.1 and MIBiG BGC0001206, and records
      N-methylation of N-demethylindolmycin to indolmycin as its example reaction.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/KM596502.1
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="AJT38688.1"
    retrieved_on: '2026-10-01'
    notes: GenBank KM596502.1 is the Streptomyces griseus subsp. griseus ATCC 12648
      indolmycin cluster sequence and maps ind7 to AJT38688.1.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001206.5/BGC0001206.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="AJT38688.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0001206.5 maps the ind7 CDS to GenPept AJT38688.1 in the indolmycin
      cluster.
  - reference: https://www.uniprot.org/uniprotkb/A0A0D4BSP3
    evidence_type: DATABASE_ASSERTION
    snippet: GN=ind7
    retrieved_on: '2026-10-01'
    notes: Current reviewed UniProtKB:A0A0D4BSP3 resolves as the 237 aa Streptomyces
      griseus Ind7 N-demethylindolmycin N-methyltransferase and cross-references EMBL
      KM596502 protein AJT38688.1.
