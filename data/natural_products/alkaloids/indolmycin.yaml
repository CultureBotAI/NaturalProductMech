        independently fetched GenPept and direct UniProt sequences. The native source
        is Streptomyces griseus subsp. griseus ATCC 12648, taxon 67263.
    - reference: https://www.ncbi.nlm.nih.gov/protein/AJT38682.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-11'
      notes: Versioned native ind1 protein. UniProt uses species taxon 1911, retains
        the ATCC 12648 nucleotide-reference attribution, and cross-references KM596502/AJT38682.1.
        This is native sequence identity, not independent verification of a recombinant
        assay construct.
