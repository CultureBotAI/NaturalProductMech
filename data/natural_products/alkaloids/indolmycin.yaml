- graph_id: indolmycin-ind1-ind2-annotated-precursor-branch
  scope: BIOSYNTHESIS
  description: Native ATCC 12648 Ind1 and Ind2 references support a database-annotated
    precursor branch. C-methylation and NADH-dependent reduction are separate processes;
    the downstream connection to indolmycin is multistep and inferred. The primary
    study was not newly inspected in full, and ring assembly is not represented by
    these edges.
