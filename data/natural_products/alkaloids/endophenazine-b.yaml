biosynthetic_pathway:
- step_number: 1
  enzyme_label: PpzM phenazine N-methyltransferase
  product: naturalproductmech:mibig-4acf6c9688
  proposed: true
  notes: This partial endophenazine B pathway captures the genetically implicated
    Streptomyces anulatus 9663 PpzM N-methyltransferase. ppzM deletion abolished endophenazine
    B production, but purified PpzM did not methylate PCA or dihydro-PCA with S-adenosylmethionine
    in the inspected in vitro assay; the exact methyl acceptor and any partner protein
    are unresolved. PpzM is left without enzyme_id because the exact GenPept CAX48665.1
    sequence no longer resolves in live UniProtKB.
  evidence:
  - reference: DOI:10.3762/BJOC.8.57
    evidence_type: PRIMARY_EXPERIMENT
    snippet: production of endophenazine B had been abolished by the ppzM deletion
    notes: Saleh et al. deleted ppzM from the Streptomyces anulatus 9663 endophenazine
      cluster in the heterologous S. coelicolor M512 ppzOS04 production system and
      used HPLC-ESI-MS to show that the resulting ppzOS26 strain no longer produced
      endophenazine B.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/FN178498.1
    evidence_type: DATABASE_ASSERTION
    snippet: gene="ppzM"
    retrieved_on: '2026-10-01'
    notes: GenBank FN178498.1 maps Streptomyces anulatus 9663 ppzM to the reverse-strand
      10210..11232 CDS, assigns protein_id CAX48665.1, and carries the historical
      UniProtKB/TrEMBL cross-reference C4PWB1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAX48665.1
    evidence_type: DATABASE_ASSERTION
    snippet: putative phenazine N-methyltransferase
    retrieved_on: '2026-10-01'
    notes: NCBI GenPept CAX48665.1 is the 340 aa Streptomyces anulatus 9663 ppzM coding
      sequence from FN178498.1 and is not represented by a live current UniProtKB
      accession.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001080.5/BGC0001080.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="CAX48665.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0001080.5 places ppzM at 10210..11232 on the Streptomyces anulatus
      endophenazine cluster and annotates the CDS as CAX48665.1 phenazine N-methyltransferase.
