biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:I3NN71
  enzyme_label: YtkW SAM-dependent methyltransferase
  notes: YtkW S-methylates the thiocarboxylic acid moiety of a yatakemycin subunit
    A intermediate. This single-step partial pathway leaves YtkG/YtkF sulfur transfer
    and the remaining assembly of the YTM scaffold uncurated.
  evidence:
  - reference: DOI:10.1002/anie.202522109
    evidence_type: PRIMARY_EXPERIMENT
    snippet: catalytic mechanism of YtkW
    notes: Feng et al. functionally characterized ytkG/F/W in yatakemycin biosynthesis;
      MITE curates the YtkW S-methyltransferase reaction as an in vitro assay from
      this primary article.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000458
    evidence_type: DATABASE_ASSERTION
    snippet: S-methylation on thiocarboxylic acid moiety of subunit A of yatakemycin
    retrieved_on: '2026-10-01'
    notes: MITE0000458 is an active YtkW entry for S-methylation of a thiocarboxylic
      acid on yatakemycin subunit A; it links UniProtKB:I3NN71, GenPept ADZ13559.1,
      MIBiG BGC0000466 and the Feng et al. DOI.
