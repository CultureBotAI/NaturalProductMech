    sequencing-platform discrepancy is explicit. No catalytic reaction, physical complex,
    universal essentiality, congener, producer/BGC, origin, bioactivity or solution-microspecies
    claim added. All prior owner fields and history preserved; SEEDED remains, not
    full-record scientific sign-off.
