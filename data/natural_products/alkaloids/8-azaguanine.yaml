  - subject: azgd_deletion
    predicate: deletes_gene_represented_by
    object: azgd_reference
    notes: The identifier denotes the deposited native gene product, not an intact
      protein present in the deletion strain or a sequenced mutant allele. No equivalent
      UniProt reference or other-strain Ptn protein is substituted.
    evidence:
    - reference: DOI:10.3389/fbioe.2020.603514
      evidence_type: PRIMARY_EXPERIMENT
      retrieved_on: '2026-10-10'
      notes: The study names CGMCC4.1633 and deposits its 8-azg cluster as MT543149.
        Its in-frame deletion method reports double crossover and a six-base scar.
        Complete experimental mutant sequences and supplementary PCR data were not
        independently inspected.
    - reference: https://www.ncbi.nlm.nih.gov/protein/QLM04718.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-10'
      notes: Independent GenPept QLM04718.1, complete 167 aa, 8-AzgD; source Streptomyces
        pathocidini CGMCC4.1633, taxon 1650571. coded_by complement(MT543149.1:3192..3695),
        translation table 11. The functional product-name annotations are not adopted
        as enzyme assays.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/MT543149.1
      evidence_type: CURATOR_INFERENCE
      retrieved_on: '2026-10-10'
      notes: Complete 504-nt reverse-strand CDS 3192..3695, codon_start 1, table 11
        and ATG initiation independently translate to all 167 residues of QLM04718.1,
        equal to the deposited CDS translation. Reference correspondence does not
        establish historical stock or mutant sequence identity. The article says Illumina,
        whereas the deposit assembly metadata says PacBio; that provenance discrepancy
        is retained, not adjudicated.
