causal_graphs:
- graph_id: 8-azaguanine-cgmcc41633-def-genetic-evidence
  scope: BIOSYNTHESIS
  description: Bounded genetic evidence for native-reference 8-AzgD/E/F in Streptomyces
    pathocidini CGMCC4.1633 (named S. albus subsp. pathocidicus in Hou et al.). The
    three deletion interventions and their product phenotypes are distinct from the
    encoded proteins. Main article and Figures 1/2 inspected; supplements and exact
    mutant constructs were not. CHEBI:63486 is the neutral free-base compound anchor,
    not an experimentally resolved solution tautomer or protonation state. No catalytic
    reaction, physical complex, universal necessity, other-strain Ptn equivalence,
    or producer/BGC evidence upgrade is asserted.
