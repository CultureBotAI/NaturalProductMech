definition: A bromoindole that is 2,3,5-tribromo-1H-indole which is substituted by
  a 5,7-dibromo-3-cyano-1H-indol-2-yl group at position 1. It is a biindole alkaloid
  isolated from the cyanobacterium Aetokthonos hydrillicola and causes vacuolar myelinopathy
  in bald eagles.
