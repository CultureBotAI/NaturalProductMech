- graph_id: pyrrolnitrin-2007-orf2-surrogate-coupling
  scope: BIOSYNTHESIS
  description: Candidate ORF2 coupling experiment for the pyrrolnitrin-associated
    PrnD system, using a surrogate substrate. Current native reference and unresolved
    study preparations remain distinct. No direct ORF2-PrnD binding, complete physiological
    pathway, endogenous necessity, quantitative flux, antimicrobial mechanism or full-record
    sign-off asserted.
  nodes:
  - node_id: pf5
    label: Pseudomonas protegens Pf-5
