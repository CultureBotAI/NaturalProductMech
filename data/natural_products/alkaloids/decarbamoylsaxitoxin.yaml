definition: A pyrrolopurine that is 2,6-diiminodecahydropyrrolo[1,2-c]purine carrying
  an additional hydroxymethyl substituent at position 4 as well as two hydroxy substituents
  at position 10. A toxin that is isolated from marine dinoflagellates and cyanobacteria
  and is known to cause paralytic shellfish poisoning.
