- graph_id: hexadehydroastechrome-annotated-regulation
  scope: BIOSYNTHESIS
  description: Partial database-annotated view of cluster regulation and transporter
    requirement. Links between gene-expression regulation and transporter-dependent
    production are intentionally omitted because their mediation is not established
    here. CEA10/A1163 reference accessions are not assigned to experimental alleles.
    HasA positive regulation is not direct promoter binding, HasB requirement is not
    an identified transport reaction, and the HasF null regulatory finding applies
    only to tested growth conditions.
