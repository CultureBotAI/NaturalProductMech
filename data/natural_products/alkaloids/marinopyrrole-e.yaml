  enzyme_label: Mpy16
  proposed: true
  notes: This curates Mpy16 as the proposed initiating pyrrolyl-carrier-protein dichlorinase
    in the Streptomyces sp. CNQ-418 mpy pathway to marinopyrroles; the exact carrier-protein-tethered
    substrate and product remain ungrounded.
  evidence:
  - reference: DOI:10.1021/ja305670f
    evidence_type: PRIMARY_EXPERIMENT
    snippet: the mpy16 gene deletion completely abolished production of the marinopyrroles
    notes: Yamanaka et al. deleted mpy16 from the heterologous Streptomyces coelicolor
      mpy expression system and used homology to pyoluteorin PltA to propose that
      Mpy16 performs the initiating pyrrolyl-carrier-protein dichlorination.
  - reference: https://www.uniprot.org/uniprotkb/J7H1A1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: UniProtKB:J7H1A1 is the unreviewed 447 aa Streptomyces sp. CNQ-418 Mpy16
      FADH2-dependent halogenase entry, gene mpy16, cross-references EMBL JX157625,
      and links to PDB 5BUK.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AFP87533.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: NCBI GenPept AFP87533.1 is the JX157625.1 mpy16 FADH2-dependent halogenase
      coding sequence from the Streptomyces sp. CNQ-418 mpy cluster.
