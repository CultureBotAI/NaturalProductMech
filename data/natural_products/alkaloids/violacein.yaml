biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9S3U8
  enzyme_label: VioD protodeoxyviolaceinate monooxygenase
  reaction_id: RHEA:49372
  substrate: CHEBI:90907
  product: CHEBI:90898
  notes: This partial Chromobacterium violaceum VioD/VioC pathway follows the enzymatic
    carboxylate branch from protodeoxyviolaceinate to protoviolaceinate, rather than
    the downstream neutral proviolacein scaffold.
  evidence:
  - reference: DOI:10.1021/bi061998z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: purified five contiguously encoded proteins VioA-E after expression in
      Escherichia coli
    notes: Balibar and Walsh reconstituted Chromobacterium violaceum VioA-E in vitro
      and demonstrated that the VioD then VioC flavin-dependent oxygenase sequence
      completes the late violacein pathway.
  - reference: DOI:10.1039/b705358d
    evidence_type: PRIMARY_EXPERIMENT
    snippet: A biosynthetic intermediate of violacein produced by the mixed enzymes
      of VioABDE
    notes: Shinoda et al. identified protoviolaceinic acid as the VioABDE product
      and showed that VioC oxygenates the right-side indole ring in the final enzymatic
      step.
  - reference: https://www.uniprot.org/uniprotkb/Q9S3U8
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:Q9S3U8 is Chromobacterium violaceum strain ATCC 12472/JCM
      1249 VioD, gene vioD/CV_3271, cross-references EMBL AF172851 protein AAD51811.1,
      EMBL AB032799 protein BAA84785.1, and EMBL AE016825 protein AAQ60935.1, and
      annotates RHEA:49372.
