biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9S3U8
  enzyme_label: VioD protodeoxyviolaceinate monooxygenase
  product: CHEBI:131916
  notes: This partial late-pathway step follows the Chromobacterium violaceum in vitro
    pathway in which VioD hydroxylates the uncommitted prodeoxyviolacein intermediate
    to proviolacein before VioC completes violacein formation. The prodeoxyviolacein
    substrate is left out of the structured substrate field because no prodeoxyviolacein
    CURIE is committed in this corpus.
  evidence:
  - reference: DOI:10.1021/bi061998z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: purified five contiguously encoded proteins VioA-E after expression in
      Escherichia coli
    notes: Balibar and Walsh reconstituted Chromobacterium violaceum VioA-E in vitro
      and demonstrated that the VioD then VioC flavin-dependent oxygenase sequence
      completes violacein formation from a prodeoxyviolacein intermediate.
  - reference: https://www.uniprot.org/uniprotkb/Q9S3U8
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:Q9S3U8 is Chromobacterium violaceum strain ATCC 12472/JCM
      1249 VioD, gene vioD/CV_3271, and cross-references EMBL AF172851 protein AAD51811.1,
      EMBL AB032799 protein BAA84785.1, and EMBL AE016825 protein AAQ60935.1.
- step_number: 2
  enzyme_id: UniProtKB:Q9S3U9
  enzyme_label: VioC violacein synthase
  substrate: CHEBI:131916
  product: CHEBI:131914
  notes: This final Chromobacterium violaceum step connects proviolacein to exact
    CHEBI:131914 violacein. UniProt also annotates Q9S3U9 with RHEA:49120 and RHEA:49652
    for oxidizing the carboxylate protoviolaceinate form, but those Rhea reactions
    do not use the same neutral pyrrolidone substrate and product captured here.
  evidence:
  - reference: DOI:10.1021/bi061998z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: purified five contiguously encoded proteins VioA-E after expression in
      Escherichia coli
    notes: Balibar and Walsh reconstituted Chromobacterium violaceum VioA-E in vitro
      and demonstrated that the VioD then VioC flavin-dependent oxygenase sequence
      completes violacein formation from a prodeoxyviolacein intermediate.
  - reference: https://www.uniprot.org/uniprotkb/Q9S3U9
