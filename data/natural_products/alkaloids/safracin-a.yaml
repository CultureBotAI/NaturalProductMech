  - CHEBI:57856
  notes: MITE records SacF from BGC0000421 as the SAM-dependent C-methyltransferase
    that methylates L-tyrosine to 3-methyl-L-tyrosine, an intermediate toward the
    3-hydroxy-5-methyl-O-methyltyrosine residues of safracin A.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2004.04433.x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Cross-feeding experiments have confirmed that 3-hydroxy-5-methyl-O-methyltyrosine
      is the precursor of two amino acids of the molecule.
    notes: Velasco et al. cloned and sequenced the Pseudomonas fluorescens A2-2 safracin
      cluster; MITE cites this paper for the SacF C-methylation entry with in vitro
      and knockout evidence.
  - reference: https://mite.bioinformatics.nl/repository/MITE0000031
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-02'
    notes: MITE0000031 is active and links SacF to UniProtKB:Q5JCL5, GenPept AAL33761.1,
      MIBiG BGC0000421, the Velasco et al. DOI, and the L-tyrosine to 3-methyl-L-tyrosine
      methylation reaction.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000421.5/BGC0000421.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-02'
    notes: MIBiG BGC0000421.5 places the Pseudomonas fluorescens A2-2 sfcF CDS at
      14780..15847 with GenPept protein_id AAL33761.1 and a MITE0000031 100% identity
      gene-function annotation.
  - reference: https://www.uniprot.org/uniprotkb/Q5JCL5
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-02'
    notes: UniProtKB:Q5JCL5 resolves to the 355 aa Pseudomonas fluorescens sfcF putative
      methyltransferase from EMBL AY061859 / GenPept AAL33761.1 and cites DOI:10.1111/j.1365-2958.2004.04433.x.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAL33761.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-02'
    notes: NCBI Protein AAL33761.1 is the Pseudomonas fluorescens A2-2 sfcF putative
      methyltransferase translated from AY061859.1:14780..15847.
  - reference: https://www.rhea-db.org/rhea/41428
    evidence_type: DATABASE_ASSERTION
