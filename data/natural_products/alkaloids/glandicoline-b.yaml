  enzyme_id: UniProtKB:B6HJU2
  enzyme_label: RoqN glandicoline B O-methyltransferase
  reaction_id: RHEA:51732
  substrate: naturalproductmech:mibig-7a476dbad3
  product: CHEBI:70399
  notes: This curates the Penicillium rubens Wisconsin 54-1255 BGC0000420 terminal
    O-methylation of glandicoline B to meleagrin. RHEA:51732 uses CHEBI:134347 for
    glandicoline B; this corpus keeps the exact BGC0000420 glandicoline B structure
    as naturalproductmech:mibig-7a476dbad3 because its stereochemical representation
    is not an exact ChEBI match.
  evidence:
  - reference: DOI:10.1039/c8ob01565a
    evidence_type: PRIMARY_EXPERIMENT
    snippet: The homologous enzymes OxaG and RoqN were shown to catalyze penultimate
      hydroxylamine O-methylation to generate meleagrin in vitro.
    notes: Murray et al. directly assayed RoqN-catalyzed O-methylation of glandicoline
      B to meleagrin and OxaG, its Penicillium oxalicum homolog, with SAM as methyl
      donor.
  - reference: DOI:10.1371/journal.pone.0065328
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Eventually, meleagrin is produced from glandicoline B involving a methyltransferase
      (RoqN).
    notes: Ali et al. assigned roqN in Penicillium rubens / P. chrysogenum by profiling
      BGC0000420 deletion strains in the branched roquefortine/meleagrin pathway.
  - reference: https://www.uniprot.org/uniprotkb/B6HJU2
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:B6HJU2 is the 288 aa Penicillium rubens Wisconsin 54-1255
      RoqN/gmt/Pc21g15440 glandicoline B O-methyltransferase and cross-references
      EMBL AM920436 protein CAP96441.1.
  - reference: https://www.rhea-db.org/rhea/51732
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: RHEA:51732 is the glandicoline B plus S-adenosyl-L-methionine to meleagrin
      plus S-adenosyl-L-homocysteine plus proton reaction; Rhea maps the master reaction
      to UniProtKB:B6HJU2 in Swiss-Prot.
