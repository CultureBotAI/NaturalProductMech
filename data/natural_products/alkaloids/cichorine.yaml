definition: A member of the class of isoindoles that is 6-hydroxy-4-methoxy-5-methyl-2,3-dihydro-1H-isoindol-1-one
  which is substituted at position 4, 5, and 6 by methoxy, methyl, and hydroxy groups,
  respectively. A secondary metabolite found in Aspergillus silvativus, Aspergillus
  nidulans and Alternaria cichorii, it is poisonous to Russian knapweed (Acroptilon
  repens).
