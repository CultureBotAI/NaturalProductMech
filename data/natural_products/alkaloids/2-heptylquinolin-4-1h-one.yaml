discussions:
- discussion_id: curator-pqsbc-construct-and-reaction-boundaries
  kind: CURATION_TODO
  status: OPEN
  prompt: What remains unresolved beyond the PqsBC net HHQ formation assay?
  rationale: Accession nodes are native PAO1 references, not full expression-plasmid
    sequences. The crystal contains C129A and an altered PqsC N-terminus. The paper
    interprets a heterodimer, whereas current deposition assemblies are tetrameric;
    physiological stoichiometry is not settled here. The elementary ring-closing step
    remains unassigned. No PqsA/PqsD/PqsE/PqsH, mutant kinetic, downstream signalling
    or antimicrobial target claim is imported from background citations.
  notes: Main text, methods, tables and captions were inspected; figure pixels and
    the supplementary movie were not. Source-owned producer grades, origin and ontology
    grounding are unchanged. Owner SMILES/InChI/key agree under RDKit 2026.03.5. The
    pinned CHEBI:62219 SMILES fails parsing and was excluded from identity proof.
    The valid CHEBI:75306 hydroxy tautomer shares the owner StandardInChIKey, which
    does not adjudicate the existing ChEBI ambiguity.
  evidence:
  - reference: DOI:10.1074/jbc.M115.708453
    evidence_source: Primary article, main text read on 2026-10-11
    notes: Discussion leaves the final cyclization mechanism unresolved.
    snippet: ring closure could also occur non-enzymatically
  - reference: https://doi.org/10.2210/pdb5DWZ/pdb
    evidence_source: PDB database, retrieved 2026-10-11
    notes: Construct, chain coverage and assembly metadata inspected independently.
- discussion_id: curator-pqsade-annotation-and-primary-evidence
  kind: CURATION_TODO
  status: OPEN
  prompt: Which PqsA/PqsD/PqsE primary assays and constructs can be independently
    verified?
  rationale: Three native PAO1 references and their catalytic annotations are grounded
    from reviewed UniProt entries and exact genomic/GenPept sequences. The 2008 PqsA
    PDF was inaccessible, the 2013 PqsABCD page returned a browser challenge, and
    the 2008 PqsD full-text endpoint returned HTTP 500. No alternate retrieval was
    attempted. PqsE primary assay papers were not inspected. Database bibliography
    entries are not treated as inspected experiments.
  notes: No essentiality, PA14 regulatory function, DHQ product, kinetic value, experimental
    construct identity or complete-route reconstitution is asserted. The 2016 PqsBC
    paper is primary evidence only for the final net assay connection, not for new
    PqsA/D/E catalytic experiments. Intermediate names remain ungrounded rather than
    assigning an unaudited protonation-specific ChEBI identifier. Issue822, source-owned
    chemistry, the pre-existing PqsBC graph and SEEDED status remain unchanged.
  evidence:
  - reference: https://www.uniprot.org/uniprotkb/Q9I4X3/entry
    evidence_source: UniProtKB reviewed entry version 115, retrieved 2026-10-11
    notes: Catalytic annotation adopted as a database assertion; primary assay and
      construct audit remains separate.
  - reference: https://www.uniprot.org/uniprotkb/P20582/entry
    evidence_source: UniProtKB reviewed entry version 147, retrieved 2026-10-11
    notes: Catalytic annotation adopted as a database assertion; primary assay and
      construct audit remains separate.
  - reference: https://www.uniprot.org/uniprotkb/P20581/entry
    evidence_source: UniProtKB reviewed entry version 129, retrieved 2026-10-11
    notes: Catalytic annotation adopted as a database assertion; primary assay and
      construct audit remains separate.
