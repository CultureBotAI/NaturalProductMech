discussions:
- discussion_id: curator-altemicidin-sbz-evidence-boundaries
  kind: CURATION_TODO
  status: OPEN
  prompt: Which primary experimental constructs and intervening steps can be independently
    verified for the altemicidin Sbz pathway?
  rationale: The 2019 article request returned HTTP429, the 2021 publisher preview
    is subscription-only, and the 2024 SbzI article redirected to an inaccessible
    authentication endpoint. No alternate article retrieval was attempted. Functions
    here are adopted UniProt database assertions, not independently inspected primary
    experiments; genomic and GenPept records support native reference identity only.
  notes: All 13 references map exactly to Streptomyces sp. NCIMB 40513, LC420052.1,
    with no ambiguous residues. This does not equate that strain with the Streptomyces
    sioyaensis occurrence taxon. SbzH/N/O individual chemistry and the connection
    from intermediate 3 to didehydrodemethylaltemicidin remain unassigned. SbzK-to-SbzI
    donor use is only probable in UniProt and is not drawn. SbzA/B/C act in later
    congener decoration and are excluded from altemicidin formation; SbzA also has
    two ambiguous native residues. No role is assigned to genomic SbzD or SbzR from
    neighborhood alone. Stored SMILES, InChI and InChIKey agree with PubChem CID11036174
    and RDKit 2026.03.5 (C13H20N4O7S, four assigned stereocenters). No new ChEBI grounding
    or acid-base identity is inferred from reaction cross-references. Source-owned
    structure, producer/BGC grades, occurrences, classification and SEEDED status
    are unchanged.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/LC420052.1
    evidence_source: GenBank, retrieved 2026-10-11
    notes: Complete native cluster sequence; all 18 CDS translations checked, 13 selected
