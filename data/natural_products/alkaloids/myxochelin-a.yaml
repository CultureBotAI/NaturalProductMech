- graph_id: myxochelin-a-m920-proposed-biosynthesis
  scope: BIOSYNTHESIS
  description: Partial, explicitly proposed protein assignments for environmental
    clone m9-20, experimentally associated with a reported myxochelin A readout in
    an engineered S. albus J1074 reporter. Four exact deposited protein references
    are grounded; their individual catalytic functions are inferred, not assayed.
    The product readout is deliberately not grounded to this stereospecific owner.
    ASV47082.1/ASV47083.1 (MxcF-related), ASV47086.1 (PPTase), and proposed host PhzD
    compensation are not assigned myxochelin-specific functions here. Keep separate
    from the existing Stigmatella MxcE/F/G pathway.
