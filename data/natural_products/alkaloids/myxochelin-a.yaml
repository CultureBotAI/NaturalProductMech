biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9F638
  enzyme_label: MxcE 2,3-DHBA-AMP ligase
  notes: MxcE adenylates 2,3-dihydroxybenzoic acid for transfer to the MxcF aryl carrier
    protein; the carrier-protein thioester is left ungrounded as a pathway intermediate.
  evidence:
  - reference: DOI:10.1073/pnas.201167098
    evidence_type: PRIMARY_EXPERIMENT
    notes: Gaitatzis et al. expressed active MxcE, MxcF, and MxcG and reconstituted
      ATP-, lysine-, DHBA-, and NAD(P)H-dependent myxochelin A formation in vitro.
    snippet: MxcE, MxcF, and MxcG Are Sufficient for the Assembly of the Myxochelins.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001345.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0001345.5 lists myxochelin A as a product of the AF299336.1 Stigmatella
      aurantiaca Sg a15 cluster and annotates mxcE/AAG31128.1 in that cluster.
  - reference: https://www.uniprot.org/uniprotkb/Q9F638
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:Q9F638 is Stigmatella aurantiaca MxcE, length 543
      aa, and cross-references EMBL AF299336 protein AAG31128.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAG31128.1
    evidence_type: DATABASE_ASSERTION
    snippet: 2,3-DHBA-AMP ligase
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AAG31128.1 is the AF299336.1:4457..6088 mxcE coding sequence
      from the Stigmatella aurantiaca Sg a15 myxochelin cluster and is the EMBL cross-reference
      for the selected UniProtKB entry.
- step_number: 2
  enzyme_id: UniProtKB:Q9F637
  enzyme_label: MxcF isochorismatase and aryl carrier protein
  notes: MxcF supplies the aryl carrier protein that receives activated 2,3-DHBA from
    MxcE and presents it to MxcG; its isochorismatase module contributes to DHBA formation
    from chorismate.
  evidence:
  - reference: DOI:10.1073/pnas.201167098
    evidence_type: PRIMARY_EXPERIMENT
    notes: Gaitatzis et al. expressed active MxcE, MxcF, and MxcG and reconstituted
      ATP-, lysine-, DHBA-, and NAD(P)H-dependent myxochelin A formation in vitro.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001345.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0001345.5 lists myxochelin A as a product of the AF299336.1 Stigmatella
      aurantiaca Sg a15 cluster and annotates mxcF/AAG31129.1 in that cluster.
  - reference: https://www.uniprot.org/uniprotkb/Q9F637
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:Q9F637 is Stigmatella aurantiaca MxcF, length 311
      aa, and cross-references EMBL AF299336 protein AAG31129.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAG31129.1
    evidence_type: DATABASE_ASSERTION
    snippet: isochorismatase
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AAG31129.1 is the AF299336.1:6166..7101 mxcF coding sequence
      from the Stigmatella aurantiaca Sg a15 myxochelin cluster and is the EMBL cross-reference
      for the selected UniProtKB entry.
- step_number: 3
  enzyme_id: UniProtKB:Q9F636
  enzyme_label: MxcG peptide synthetase with reductase domain
  notes: MxcG adenylates lysine, condenses two MxcF-delivered DHBA groups with lysine,
    and uses its reductase domain to release the myxochelin A alcohol.
  evidence:
  - reference: DOI:10.1073/pnas.201167098
    evidence_type: PRIMARY_EXPERIMENT
    notes: Gaitatzis et al. expressed active MxcE, MxcF, and MxcG and reconstituted
      ATP-, lysine-, DHBA-, and NAD(P)H-dependent myxochelin A formation in vitro.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001345.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0001345.5 lists myxochelin A as a product of the AF299336.1 Stigmatella
      aurantiaca Sg a15 cluster and annotates mxcG/AAG31130.1 in that cluster.
  - reference: https://www.uniprot.org/uniprotkb/Q9F636
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:Q9F636 is Stigmatella aurantiaca MxcG, length 1456
      aa, and cross-references EMBL AF299336 protein AAG31130.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAG31130.1
    evidence_type: DATABASE_ASSERTION
    snippet: peptide synthetase
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AAG31130.1 is the AF299336.1:7163..11533 mxcG coding sequence
      from the Stigmatella aurantiaca Sg a15 myxochelin cluster and is the EMBL cross-reference
      for the selected UniProtKB entry.
