discussions:
- discussion_id: shared-structure
  kind: CURATION_TODO
  status: RESOLVED
  prompt: 'This structure is reported by more than one MIBiG entry: BGC0001345, BGC0002324,
    BGC0002491, BGC0002492. Confirm they describe the same compound rather than an
    upstream cross-reference error.'
  resolved_date: '2026-09-27'
  resolution_note: MIBiG BGC0001345.5, BGC0002324.3, BGC0002491.3, and BGC0002492.3
    all intentionally store exact myxochelin A rows with Standard InChIKey WNBVGSNESTZACV-LBPRGKRZSA-N.
- discussion_id: curator-m920-protein-and-product-scope
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#myxochelin-a-m920-proposed-biosynthesis
  prompt: Can the m9-20 readout be assigned to this exact stereoisomer, and which
    clone proteins have experimentally demonstrated myxochelin functions?
  rationale: The new graph preserves the paper's reported product identity without
    an exact-structure endpoint. HRMS and C18 standard co-elution do not independently
    establish absolute configuration. Protein identities are deposited reference sequences,
    whereas their roles follow homology. This is an evidence-resolution gap, not evidence
    that the product is a different enantiomer.
  evidence:
  - reference: DOI:10.1093/femsle/fnx155
    supports: PARTIAL
    evidence_source: primary main text and Figure 4
    explanation: Whole-clone expression yielded the reported myxochelin A peak. The
      paper describes an apparently truncated mxcF and proposes host PhzD-like compensation;
      neither isolated clone-protein catalysis nor the compensation mechanism was
      demonstrated in the inspected main text. The supplement remains uninspected.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/KY560365.1
    supports: SUPPORT
    evidence_source: GenBank, retrieved 2026-10-11
    explanation: 'The MxcF-like region contains two separately annotated CDSs: ASV47082.1,
      214 aa, and ASV47083.1, 70 aa. Their sequences match different parts of reference
      MxcF; this does not establish two functional enzymes or justify fusing them.
      ASV47083.1 is labelled isochorismatase in GenPept but its conserved-domain annotation
      is carrier-protein-like. ASV47086.1 is the 253-aa PPTase reference; clone-level
      indigoidine rescue is not an isolated-protein myxochelin activation experiment.'
  notes: Resolve the standard's provenance and stereochemical applicability before
    grounding the product endpoint. Obtain direct functional evidence before promoting
    the four inferred edges or adopting the withheld proteins. No donor species, native-producer
    claim, UniProt homolog substitution, physical complex, pathway completion or REVIEWED
    status is inferred. Bounded UniProt queries for the locus and seven accessions
    returned no exact hits on 2026-10-11; that is not proof that UniProt entries do
    not exist. Existing imported occurrences and producer claims are preserved, not
    revalidated.
biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9F638
  enzyme_label: MxcE 2,3-DHBA-AMP ligase
  notes: MxcE adenylates 2,3-dihydroxybenzoic acid for transfer to the MxcF aryl carrier
    protein; the carrier-protein thioester is left ungrounded as a pathway intermediate.
  evidence:
  - reference: DOI:10.1073/pnas.201167098
    evidence_type: PRIMARY_EXPERIMENT
    notes: Gaitatzis et al. expressed active MxcE, MxcF, and MxcG and reconstituted
      ATP-, lysine-, DHBA-, and NAD(P)H-dependent myxochelin A formation in vitro.
    snippet: MxcE, MxcF, and MxcG Are Sufficient for the Assembly of the Myxochelins.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001345.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0001345.5 lists myxochelin A as a product of the AF299336.1 Stigmatella
      aurantiaca Sg a15 cluster and annotates mxcE/AAG31128.1 in that cluster.
  - reference: https://www.uniprot.org/uniprotkb/Q9F638
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:Q9F638 is Stigmatella aurantiaca MxcE, length 543
      aa, and cross-references EMBL AF299336 protein AAG31128.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAG31128.1
    evidence_type: DATABASE_ASSERTION
    snippet: 2,3-DHBA-AMP ligase
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AAG31128.1 is the AF299336.1:4457..6088 mxcE coding sequence
      from the Stigmatella aurantiaca Sg a15 myxochelin cluster and is the EMBL cross-reference
      for the selected UniProtKB entry.
- step_number: 2
  enzyme_id: UniProtKB:Q9F637
  enzyme_label: MxcF isochorismatase and aryl carrier protein
  notes: MxcF supplies the aryl carrier protein that receives activated 2,3-DHBA from
