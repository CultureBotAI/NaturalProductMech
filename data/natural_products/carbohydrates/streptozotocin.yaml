  substrate: CHEBI:32682
  product: CHEBI:114953
- step_number: 2
  enzyme_id: UniProtKB:A0A411MR89
  enzyme_label: SznF
  reaction_id: RHEA:69052
  notes: This curates SznF's overall oxidative rearrangement from N(omega)-methyl-L-arginine
    to the unstable N-nitrosourea intermediate in the BGC0002313/MK303572.1 route;
    downstream attachment to the sugar scaffold remains uncurated.
  evidence:
  - reference: DOI:10.1038/s41586-019-0894-z
    evidence_type: PRIMARY_EXPERIMENT
    snippet: catalyses an oxidative rearrangement of the guanidine group of Nω-methyl-L-arginine
      to generate an N-nitrosourea product
    notes: Ng et al. biochemically and structurally characterized Streptomyces achromogenes
      subsp. streptozoticus SznF as the N-nitrosating metalloenzyme in streptozotocin
      biosynthesis.
