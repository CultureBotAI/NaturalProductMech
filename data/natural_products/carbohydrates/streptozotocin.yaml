- step_number: 1
  enzyme_id: UniProtKB:A0A411EW25
  enzyme_label: SznE
  reaction_id: RHEA:59756
  notes: This curates only the Streptomyces achromogenes subsp. streptozoticus NRRL
    2697 SznE N-methyltransferase step from the BGC0002313/MK303572.1 route; RHEA:59756
    also uses S-adenosyl-L-methionine and releases S-adenosyl-L-homocysteine and a
    proton.
  evidence:
  - reference: DOI:10.1021/jacs.8b13049
    evidence_type: PRIMARY_EXPERIMENT
    snippet: free l-arginine is N-methylated by StzE to give Nω-monomethyl-l-arginine
    notes: He et al. identified the streptozocin N-nitrosourea precursor pathway and
      biochemically demonstrated the SznE/StzE arginine N-methyltransferase reaction.
  - reference: https://www.uniprot.org/uniprotkb/A0A411EW25
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Reviewed UniProtKB:A0A411EW25 is Streptomyces achromogenes subsp. streptozoticus
      SznE, gene sznE, cross-references EMBL MK303572 protein QBA82201.1 and EMBL
      MK291259 protein QBA82041.1, and annotates RHEA:59756 with ChEBI participants
      CHEBI:15378, CHEBI:32682, CHEBI:57856, CHEBI:59789, and CHEBI:114953.
