    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept QBA82041.1 is the MK291259.1 standalone sznE coding sequence
      deposited with the primary SznF study and is sequence-identical to BGC0002313
