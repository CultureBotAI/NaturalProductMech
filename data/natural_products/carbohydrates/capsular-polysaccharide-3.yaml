- discussion_id: curator-capsule-exact-product-assignment
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  prompt: Which exact chemical product does each deposited capsule locus support?
  rationale: Nine deposited Ia/III/VI loci share one stereospecified seven-ring graph
    whose PubChem record title is group B type V. The cited study abstract concerns
    PCR/sequencing serotyping, not proof that these loci synthesize this exact graph.
    An earlier type II research lead was incorrect and is discarded. Registry names/MeSH
    associations are name-based and are not independent chemical certification. Exact
    PubChem graph agreement is verified; deleting its xref alone would not repair
    the biological assignment. The confirmed defect is unsupported exact-product assignment
    across the recorded contexts, not an experimentally established replacement structure.
    Preserve existing keys, source assertions and SEEDED status pending primary-chemistry
    adjudication; no automatic split, merge, stereochemical completion or registry-serotype
    rename.
  evidence:
  - reference: https://github.com/CultureBotAI/NaturalProductMech/issues/936
    explanation: Open exact-product adjudication; qualification is mitigation, not
      resolution.
  - reference: https://pubchem.ncbi.nlm.nih.gov/compound/3083207
    evidence_source: database
    explanation: Registry title uses type V; exact graph/key agrees, but name-based
      MeSH association is not biological identity certification.
  - reference: PMID:11773119
    evidence_source: abstract
    explanation: Metadata and abstract inspected; full text denied. No exact-product
      equivalence inferred from genotyping or capsule-gene comparisons.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF332893.1
    evidence_source: database
    explanation: Deposited strain context 090, serotype Ia; not exact molecular-product
      proof.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF332896.1
    evidence_source: database
    explanation: Deposited strain context M781, serotype III; not exact molecular-product
      proof.
