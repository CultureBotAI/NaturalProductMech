definition: An amino cyclitol glycoside that is 4,6-diaminocyclohexane-1,2,3-triol
  having a 2,6-diamino-2,6-dideoxy-α-D-glucosyl residue attached at position 1 and
  a β-D-ribosyl residue attached at position 2. It is an antibiotic produced by Streptomyces
  ribosidificus (formerly S. thermoflavus).
