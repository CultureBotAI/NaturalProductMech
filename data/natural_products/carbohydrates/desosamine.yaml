    unchanged. Xue et al. 1998 (PMID:9770448, DOI:10.1073/pnas.95.21.12111) exclusively
    studies the pikromycin/methymycin/desosamine biosynthetic gene cluster of Streptomyces
    venezuelae ATCC 15439 and contains zero mention of Streptomyces narbonensis (NCBITaxon:67333);
    the LOTUS triple is an upstream cross-species propagation artifact from MIBiG
    BGC0000899. Withhold only this unsupported occurrence triple; do not infer absence
    of narbomycin/desosamine in S. narbonensis under other references or alter producer
    claims. See issue #1011. Source row SHA256 c05b5dfc535431dcdf6070557c3cf941cc6faeed67f285376f144e1e44dd895e.
