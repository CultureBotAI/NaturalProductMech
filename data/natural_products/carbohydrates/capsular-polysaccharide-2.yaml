- discussion_id: curator-capsule-exact-product-assignment
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  prompt: Which exact chemical product does each deposited capsule locus support?
  rationale: Five deposited K5/K20/K54 loci share one finite, stereochemically undefined
    six-ring graph. PubChem names that graph as K15. The inspected study abstract
    concerns genotyping and clinical/serum-resistance comparisons, not exact product
    structural assignment. Registry names/MeSH associations are name-based and are
    not independent chemical certification. Exact PubChem graph agreement is verified;
    deleting its xref alone would not repair the biological assignment. The confirmed
    defect is unsupported exact-product assignment across the recorded contexts, not
    an experimentally established replacement structure. Preserve existing keys, source
    assertions and SEEDED status pending primary-chemistry adjudication; no automatic
    split, merge, stereochemical completion or registry-serotype rename.
  evidence:
  - reference: https://github.com/CultureBotAI/NaturalProductMech/issues/935
    explanation: Open exact-product adjudication; qualification is mitigation, not
      resolution.
  - reference: https://pubchem.ncbi.nlm.nih.gov/compound/3083199
    evidence_source: database
    explanation: Registry title uses K15; exact graph/key agrees, but name-based MeSH
      association is not biological identity certification.
  - reference: PMID:17599305
    evidence_source: abstract
    explanation: Metadata and abstract inspected; full text denied. No exact-product
      equivalence inferred from genotyping or capsule-gene comparisons.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB289645.1
    evidence_source: database
    explanation: Deposited strain context Kauffmann E5051, serotype K5; not exact
      molecular-product proof.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB289646.1
    evidence_source: database
    explanation: Deposited strain context NTUH-K9534, serotype K5; not exact molecular-product
      proof.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB289647.1
    evidence_source: database
    explanation: Deposited strain context 889/50, serotype K20; not exact molecular-product
      proof.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB289648.1
    evidence_source: database
    explanation: Deposited strain context NTUH-KP13, serotype K20; not exact molecular-product
      proof.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AB289650.1
    evidence_source: database
    explanation: Deposited strain context NTUH-KP35, serotype K54; not exact molecular-product
      proof.
