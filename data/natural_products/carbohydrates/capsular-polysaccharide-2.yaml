discussions:
- discussion_id: shared-structure
  kind: CURATION_TODO
  status: OPEN
  prompt: 'This structure is reported by more than one MIBiG entry: BGC0000728, BGC0000729,
    BGC0000730, BGC0000731, BGC0000733. Confirm they describe the same compound rather
