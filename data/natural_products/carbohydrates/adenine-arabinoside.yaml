discussions:
- discussion_id: name-disagreement
  kind: CONTROVERSY
  status: OPEN
  prompt: ChEBI calls this structure 'adenine arabinoside' and MIBiG calls it 'vidarabine'.
    They share a Standard InChIKey, so if the names denote different compounds then
    one upstream record has the wrong structure. Check which.
biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A1S5NPU2
  enzyme_label: PenF arabinoside monophosphate 5'-nucleotidase
  substrate: pubchem.compound:34768
  product: CHEBI:45327
  proposed: true
  notes: PenF hydrolyzes vidarabine phosphate, also called vidarabine 5'-monophosphate
    or Ara-AMP, to adenine arabinoside (Ara-A, vidarabine) in vitro. This partial
    Streptomyces antibioticus NRRL 3238 pathway records the biochemically supported
    conversion as a proposed vidarabine biosynthetic step and leaves the upstream
    formation of Ara-AMP unresolved.
  evidence:
  - reference: DOI:10.3390/biom14111368
    evidence_type: PRIMARY_EXPERIMENT
    snippet: PenF catalyzed the hydrolysis of Ara-AMP into Ara-A
    notes: Li et al. recombinantly expressed S. antibioticus NRRL 3238 PenF, identified
      its source sequence as NCBI Protein AKA87335.1, and biochemically characterized
      vidarabine 5'-monophosphate hydrolysis to Ara-A by HPLC and LC-MS.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/KJ856912.1
    evidence_type: DATABASE_ASSERTION
    snippet: gene="penF"
    retrieved_on: '2026-10-01'
    notes: GenBank KJ856912.1 maps Streptomyces antibioticus NRRL 3238 penF to the
      18484..19560 CDS and assigns protein_id AKA87335.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AKA87335.1
    evidence_type: DATABASE_ASSERTION
    snippet: metal dependent phosphohydrolase
    retrieved_on: '2026-10-01'
    notes: NCBI GenPept AKA87335.1 is the 358 aa Streptomyces antibioticus PenF coding
      sequence used by Li et al.; its sequence is identical to the current UniProtKB:A0A1S5NPU2
      FASTA.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001735.5/BGC0001735.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="AKA87335.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0001735.5 places penF at 18484..19560 in the Streptomyces antibioticus
      pentostatin and vidarabine gene cluster and annotates the CDS as AKA87335.1
      metal dependent phosphohydrolase.
  - reference: https://www.uniprot.org/uniprotkb/A0A1S5NPU2
    evidence_type: DATABASE_ASSERTION
    snippet: GN=penF
    retrieved_on: '2026-10-01'
    notes: Current UniProtKB:A0A1S5NPU2 resolves as the unreviewed 358 aa Streptomyces
      antibioticus metal dependent phosphohydrolase PenF; the retrieved UniProt JSON
      had no EMBL KJ856912.1 xref, so this grounding was accepted from the resolved
      accession, organism, gene, product, length and exact sequence identity to GenPept
      AKA87335.1.
