    label: Substituting nickel(II)
    node_type: COMPOUND
    grounding_status: UNGROUNDED
  edges:
  - subject: avio1
    predicate: contains_observed_bound_metal
    object: nickel
    notes: 4XAA is a monomeric 2.30 A structure containing NI and water, not modeled
      AKG or carbohydrate. Its deposited 223-aa polymer equals Q93KW4 and native AAK83181.1
      exactly; this does not verify tag-processing details in the inaccessible supplement.
      The paper used inactive Ni-substituted preparations, not native iron turnover.
      Docking does not establish substrate binding or a particular ring-closure assignment.
    evidence:
    - reference: DOI:10.1073/pnas.1500964112
      evidence_type: PRIMARY_EXPERIMENT
      notes: Oxygenase structures and active-site metal substitution.
      snippet: catalytically inactive
    - reference: https://www.rcsb.org/structure/4XAA
      evidence_type: DATABASE_ASSERTION
      notes: AviO1 sequence, 2.30 A model, monomeric assembly and NI/HOH ligands.
      retrieved_on: '2026-10-03'
    - reference: https://www.uniprot.org/uniprotkb/Q93KW4/entry
      evidence_type: DATABASE_ASSERTION
      notes: aviO1, STVIR_2892, AAK83181.1; 223 aa; taxon 1160705.
