        to UniProtKB:Q93KW1, GenPept AAK83184.1, MIBiG BGC0000026, and C6 O-methylation
        of the D-mannose moiety in avilamycin biosynthesis.
    - reference: https://mibig.secondarymetabolites.org/repository/BGC0000026.5/BGC0000026.gbk
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-02'
      notes: MIBiG BGC0000026.5 places aviG2/AAK83184.1 inside the active Streptomyces
