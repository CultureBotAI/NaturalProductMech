    pathway from dTDP-alpha-D-glucose (CHEBI:15700) to the nucleotide-activated donor
    dTDP-alpha-D-desosamine (CHEBI:27948). Free desosamine (CHEBI:32540) is the deoxysugar
    moiety transferred from dTDP-alpha-D-desosamine onto macrolactone aglycones by
    DesVII/DesVIII.
