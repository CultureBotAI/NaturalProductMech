biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9ZGH3
  enzyme_label: DesIV dTDP-glucose 4,6-dehydratase
  reaction_id: RHEA:17221
  substrate: CHEBI:15700
  product: CHEBI:16128
  notes: DesIV (AAC68681.1, AF079762.1:5661..6674, EC 4.2.1.46) catalyzes NAD+-dependent
    4,6-dehydration of dTDP-alpha-D-glucose (CHEBI:15700) to dTDP-4-dehydro-6-deoxy-alpha-D-glucose
    (CHEBI:16128) in the Streptomyces venezuelae ATCC 15439 dTDP-D-desosamine pathway.
    RHEA:17221 represents the same reaction using the anionic species CHEBI:57477
    and CHEBI:57649.
  evidence:
  - reference: DOI:10.1074/jbc.M310134200
    evidence_type: PRIMARY_EXPERIMENT
    snippet: The desIV gene from Streptomyces venezuelae was cloned, overexpressed
      in Escherichia coli, and purified to homogeneity
    notes: Allard et al. (PMID:14570895) cloned, overexpressed, purified, and determined
      the 1.7-A X-ray crystal structure of Streptomyces venezuelae DesIV (dTDP-glucose
      4,6-dehydratase) in complex with dTDP and dTDP-glucose (PDB 1R66 and 1R6D).
  - reference: DOI:10.1073/pnas.95.21.12111
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Dedicated to the biosynthesis of dTDP-D-desosamine, an essential deoxysugar
      component in the macrolide antibiotics methymycin, neomethymycin, narbomycin,
      and pikromycin
    notes: Xue et al. (PMID:9770448) sequenced the Streptomyces venezuelae ATCC 15439
      pik/des cluster (AF079762.1 / BGC0000898) and identified the desI-desVIII locus
      for dTDP-D-desosamine biosynthesis and transfer.
  - reference: https://www.uniprot.org/uniprotkb/Q9ZGH3
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: Active UniProtKB:Q9ZGH3 (337 aa, gene desIV) in Streptomyces venezuelae
      cross-references EMBL AF079762 protein AAC68681.1, PDB 1R66 and 1R6D, EC 4.2.1.46,
      and RHEA:17221.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF079762.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: GenBank AF079762.1 (MIBiG BGC0000898) annotates desIV at CDS 5661..6674
      with protein_id AAC68681.1 as dTDP-glucose 4,6-dehydratase.
  - reference: RHEA:17221
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: RHEA:17221 grounds EC 4.2.1.46 conversion of dTDP-alpha-D-glucose(2-) (CHEBI:57477)
      to dTDP-4-dehydro-6-deoxy-alpha-D-glucose(2-) (CHEBI:57649) and H2O; this record
      uses the corresponding neutral ChEBI identifiers CHEBI:15700 and CHEBI:16128.
- step_number: 2
  enzyme_id: UniProtKB:Q9ZGH0
  enzyme_label: DesI dTDP-4-keto-6-deoxy-D-glucose 4-aminotransferase
  substrate: CHEBI:16128
  product: CHEBI:68523
  notes: DesI (AAC68684.1, AF079762.1:8651..9898, EC 2.6.1.33) catalyzes the PLP-dependent
    C-4 transamination of dTDP-4-dehydro-6-deoxy-alpha-D-glucose (CHEBI:16128) to
    dTDP-4-amino-4,6-dideoxy-alpha-D-glucose (CHEBI:68523).
  evidence:
  - reference: DOI:10.1021/bi700751d
    evidence_type: PRIMARY_EXPERIMENT
    snippet: DesI, the third enzyme in the pathway, catalyzes the conversion of dTDP-4-keto-6-deoxyglucose
      to dTDP-4-amino-4,6-dideoxyglucose
    notes: Burgie, Thoden, and Holden (PMID:17630700) characterized Streptomyces venezuelae
      DesI and solved its X-ray crystal structures in the internal aldimine form and
      in complex with its product dTDP-4-amino-4,6-dideoxyglucose (PDB 2PO3 and 2PZJ).
  - reference: DOI:10.1073/pnas.95.21.12111
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Dedicated to the biosynthesis of dTDP-D-desosamine, an essential deoxysugar
      component in the macrolide antibiotics methymycin, neomethymycin, narbomycin,
      and pikromycin
    notes: Xue et al. (PMID:9770448) identified desI in the Streptomyces venezuelae
      ATCC 15439 des deoxysugar locus (AF079762.1 / BGC0000898) and showed by gene
      disruption that desI is essential for desosamine biosynthesis.
  - reference: https://www.uniprot.org/uniprotkb/Q9ZGH0
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: Active UniProtKB:Q9ZGH0 (415 aa, gene desI) in Streptomyces venezuelae
      cross-references EMBL AF079762 protein AAC68684.1, PDB 2PO3 and 2PZJ, and EC
      2.6.1.33.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF079762.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: GenBank AF079762.1 (MIBiG BGC0000898) annotates desI at CDS 8651..9898
      with protein_id AAC68684.1.
- step_number: 3
  enzyme_id: UniProtKB:Q9ZGH1
  enzyme_label: DesII dTDP-4-amino-4,6-dideoxy-alpha-D-glucose ammonia-lyase
  reaction_id: RHEA:39647
  substrate: CHEBI:68523
  product: CHEBI:27645
  notes: DesII (AAC68683.1, AF079762.1:7140..8597, EC 4.3.1.30) is a radical SAM [4Fe-4S]
    ammonia-lyase that catalyzes the redox-neutral C-4 deamination of dTDP-4-amino-4,6-dideoxy-alpha-D-glucose
    (CHEBI:68523) to dTDP-3-dehydro-4,6-dideoxy-alpha-D-glucose (CHEBI:27645) and
    NH4+. RHEA:39647 represents the same reaction using the anionic species CHEBI:68501
    and CHEBI:76280.
  evidence:
  - reference: DOI:10.1021/ja903354k
    evidence_type: PRIMARY_EXPERIMENT
    snippet: DesII is a radical SAM enzyme found in the biosynthetic pathway of D-desosamine
      which catalyzes the deamination of TDP-4-amino-4,6-dideoxy-D-glucose to form
      TDP-3-keto-4,6-dideoxy-D-glucose
    notes: Ruszczycky et al. (PMID:19746907) demonstrated purified Streptomyces venezuelae
      DesII radical SAM ammonia-lyase activity converting TDP-4-amino-4,6-dideoxy-D-glucose
      to TDP-3-keto-4,6-dideoxy-D-glucose via a C3 alpha-hydroxyalkyl radical intermediate.
  - reference: DOI:10.1021/ja909451a
    evidence_type: PRIMARY_EXPERIMENT
    snippet: DesII is a radical SAM enzyme responsible for the redox-neutral deamination
      of TDP-4-amino-4,6-dideoxy-D-glucose to yield TDP-3-keto-4,6-dideoxy-D-glucose
      in the biosynthesis of TDP-D-desosamine
    notes: Ruszczycky et al. (PMID:20121093) established the reaction stoichiometry
      and radical deamination mechanism of Streptomyces venezuelae DesII.
  - reference: https://www.uniprot.org/uniprotkb/Q9ZGH1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: Reviewed Swiss-Prot UniProtKB:Q9ZGH1 (485 aa, gene desII) in Streptomyces
      venezuelae cross-references EMBL AF079762 protein AAC68683.1, EC 4.3.1.30, and
      RHEA:39647.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF079762.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: GenBank AF079762.1 (MIBiG BGC0000898) annotates desII at CDS 7140..8597
      with protein_id AAC68683.1.
  - reference: RHEA:39647
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: RHEA:39647 grounds EC 4.3.1.30 deamination of dTDP-4-amino-4,6-dideoxy-alpha-D-glucose(1-)
      (CHEBI:68501) to dTDP-3-dehydro-4,6-dideoxy-alpha-D-glucose(2-) (CHEBI:76280)
      and NH4+; this record uses the corresponding neutral ChEBI identifiers CHEBI:68523
      and CHEBI:27645.
- step_number: 4
  enzyme_id: UniProtKB:Q9ZGH4
  enzyme_label: DesV dTDP-3-amino-3,4,6-trideoxy-alpha-D-glucose transaminase
  reaction_id: RHEA:39907
  substrate: CHEBI:27645
  product: CHEBI:10502
  notes: DesV (AAC68680.1, AF079762.1:4502..5641, EC 2.6.1.106) catalyzes the PLP-dependent
    C-3 transamination of dTDP-3-dehydro-4,6-dideoxy-alpha-D-glucose (CHEBI:27645)
    with L-glutamate to form dTDP-3-amino-3,4,6-trideoxy-alpha-D-glucose (CHEBI:10502).
    RHEA:39907 represents the same reaction using the anionic species CHEBI:76280
    and CHEBI:63262.
  evidence:
  - reference: DOI:10.1110/ps.062711007
    evidence_type: PRIMARY_EXPERIMENT
    snippet: DesV catalyzes the transfer of the amino group from glutamate to the
      C-3 position of the sugar component of dTDP-3-keto-4,6-dideoxy-D-glucose to
      yield dTDP-3-amino-3,4,6-trideoxy-D-glucose
    notes: Burgie and Holden (PMID:17456741) characterized Streptomyces venezuelae
      DesV and determined its X-ray crystal structures in complex with PLP and the
      ketimine intermediate (PDB 2OGA and 2OGE).
  - reference: https://www.uniprot.org/uniprotkb/Q9ZGH4
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: Reviewed Swiss-Prot UniProtKB:Q9ZGH4 (379 aa, gene desV) in Streptomyces
      venezuelae cross-references EMBL AF079762 protein AAC68680.1, PDB 2OGA and 2OGE,
      EC 2.6.1.106, and RHEA:39907.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF079762.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: GenBank AF079762.1 (MIBiG BGC0000898) annotates desV at CDS 4502..5641
      with protein_id AAC68680.1.
  - reference: RHEA:39907
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: RHEA:39907 grounds EC 2.6.1.106 transamination of dTDP-3-dehydro-4,6-dideoxy-alpha-D-glucose(2-)
      (CHEBI:76280) to dTDP-3-azaniumyl-3,4,6-trideoxy-alpha-D-glucose(1-) (CHEBI:63262);
      this record uses the corresponding neutral ChEBI identifiers CHEBI:27645 and
      CHEBI:10502.
- step_number: 5
  enzyme_id: UniProtKB:Q9ZGH6
  enzyme_label: DesVI dTDP-3-amino-3,4,6-trideoxy-alpha-D-glucopyranose N,N-dimethyltransferase
  reaction_id: RHEA:31759
  substrate: CHEBI:10502
  product: CHEBI:27948
  notes: DesVI (AAC68678.1, AF079762.1:2811..3524, EC 2.1.1.234) catalyzes the SAM-dependent
    C-3 N,N-dimethylation of dTDP-3-amino-3,4,6-trideoxy-alpha-D-glucose (CHEBI:10502)
    to form dTDP-alpha-D-desosamine (CHEBI:27948). This enzymatic pathway terminates
    at the nucleotide-activated donor dTDP-alpha-D-desosamine (CHEBI:27948; anionic
    Rhea species CHEBI:63260) rather than asserting an enzymatic release of free desosamine
    (CHEBI:32540).
  evidence:
  - reference: DOI:10.1021/bi020245j
    evidence_type: PRIMARY_EXPERIMENT
    snippet: DesVI was confirmed to be an N,N-dimethyltransferase which converts TDP-3-amino-3,4,6-trideoxy-alpha-D-glucopyranose
      (6) to TDP-D-desosamine (7), the final step in the biosynthesis of TDP-D-desosamine
    notes: Chang et al. (PMID:12119032) heterologously expressed and purified Streptomyces
      venezuelae DesVI and demonstrated SAM-dependent N,N-dimethylation of TDP-3-amino-3,4,6-trideoxy-alpha-D-glucopyranose
      to TDP-D-desosamine in vitro.
  - reference: DOI:10.1021/bi800063j
    evidence_type: PRIMARY_EXPERIMENT
    snippet: DesVI is an S-adenosylmethionine (SAM)-dependent N,N-dimethyltransferase
      involved in the biosynthesis of dTDP-D-desosamine in Streptomyces venezuelae
    notes: Burgie, Holden, and Thoden (PMID:18327916) determined the 1.45-A X-ray
      crystal structure of Streptomyces venezuelae DesVI in complex with SAM (PDB
      3BXO).
  - reference: https://www.uniprot.org/uniprotkb/Q9ZGH6
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: Reviewed Swiss-Prot UniProtKB:Q9ZGH6 (237 aa, gene desVI) in Streptomyces
      venezuelae cross-references EMBL AF079762 protein AAC68678.1, PDB 3BXO, EC 2.1.1.234,
      and RHEA:31759.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF079762.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: GenBank AF079762.1 (MIBiG BGC0000898) annotates desVI at CDS 2811..3524
      with protein_id AAC68678.1.
  - reference: RHEA:31759
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-20'
    notes: RHEA:31759 grounds EC 2.1.1.234 N,N-dimethylation of dTDP-3-azaniumyl-3,4,6-trideoxy-alpha-D-glucose(1-)
      (CHEBI:63262) to dTDP-alpha-D-desosamine(1-) (CHEBI:63260); this record uses
      the corresponding neutral ChEBI identifiers CHEBI:10502 and CHEBI:27948.
