      macrolide glycoside methymycin SMILES (HUKYPYXOBINMND-HYUJHOPRSA-N) and methymycin
      database xrefs (pubchem:5282034|npatlas:NPA01238), colliding with BGC0000094:1
      (methymycin, CHEBI:29630). Split BGC0000898:1 onto the 3-star ChEBI structure
      for desosamine (CHEBI:32540, VTJCSBJRQLZNHE-CSMHCCOUSA-N) and withhold the methymycin
      xrefs. Original database_ids withheld: pubchem:5282034|npatlas:NPA01238. Other
      inventories are joined only on the corrected key, never transferred from the
