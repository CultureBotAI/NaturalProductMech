  edges:
  - subject: evdo1
    predicate: forms_observed_homodimer
    object: evdo1_dimer
    notes: '4XBZ contains four dimers in its asymmetric unit, not an octameric biological
      assembly. UniProt A0A0M3KL03 is a PDB-derived 314-aa sequence: one extra N-terminal
      methionine followed by native QLD23479.1 (313 aa). It matches the crystallized
      core including that cloning residue, not an unqualified native sequence. The
      full deposited 334-aa construct adds the 20-aa MGSSHHHHHHSSGLVPRGSH before the
      UniProt sequence. No internal mismatch was found.'
    evidence:
    - reference: DOI:10.1073/pnas.1500964112
