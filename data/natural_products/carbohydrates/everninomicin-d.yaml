  - subject: evdo2
    predicate: contains_observed_bound_ligand
    object: akg
    notes: 4XAC contains bound alpha-ketoglutarate in the nickel-substituted active
      site. UniProt A0A0M3KL01, the 252-aa QLD23486.1 translation (HXZ27_04030, CP058322.1:895031..895789),
