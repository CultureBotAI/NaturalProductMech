- graph_id: everninomicin-d-evdo1-evdo2-structural-observations
  scope: BIOSYNTHESIS
  description: Recombinant EvdO1/EvdO2 structural observations from catalytically
    inactive nickel-substituted preparations. EvdO1 is dimeric and EvdO2 monomeric;
    these are not measurements of native-cell assemblies. Disaccharide docking in
    the paper is computational, not observed binding or demonstrated biosynthetic
    turnover.
  nodes:
