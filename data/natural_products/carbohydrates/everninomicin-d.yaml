    object: evds6_dimer
    notes: Two copies of the sequence-verified parent form the crystallized dimer.
      Both deposits have the same tagged 348-aa sequence described in the assay graph.
      RCSB assembly 1 is an author/PISA homodimer with gel-filtration support; no
