      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 5A/B, Figures S20/S21 and Table S4.
      snippet: two protein chains in the asymmetric unit
    - reference: https://www.ncbi.nlm.nih.gov/protein/QLD23489.2
      evidence_type: DATABASE_ASSERTION
      notes: Exact native-parent sequence and locus; functional evidence comes from
