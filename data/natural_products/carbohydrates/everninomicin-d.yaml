  edges:
  - subject: evds6
    predicate: forms_observed_homodimer
    object: evds6_dimer
    notes: Two copies of the sequence-verified parent form the crystallized dimer.
      Both deposits have the same tagged 348-aa sequence described in the assay graph.
      RCSB assembly 1 is an author/PISA homodimer with gel-filtration support; no
      native-cell assembly measurement or distinct complex accession is asserted.
    evidence:
    - reference: DOI:10.1016/j.jbc.2023.104893
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 5A/B, Figures S20/S21 and Table S4.
      snippet: two protein chains in the asymmetric unit
    - reference: https://www.ncbi.nlm.nih.gov/protein/QLD23489.2
      evidence_type: DATABASE_ASSERTION
      notes: Exact native-parent sequence and locus; functional evidence comes from
        the paper.
      retrieved_on: '2026-10-03'
    - reference: https://www.rcsb.org/structure/8SK0
      evidence_type: DATABASE_ASSERTION
      notes: 'Biological assembly 1: A2, author/PISA assignment, gel-filtration evidence.'
      retrieved_on: '2026-10-03'
    - reference: https://www.rcsb.org/structure/8SHH
      evidence_type: DATABASE_ASSERTION
      notes: Companion structure without added substrate ligand; NAD+ retained.
      retrieved_on: '2026-10-03'
  - subject: evds6_dimer
    predicate: contains_bound_cofactor
    object: nad
    notes: NAD+ is noncovalently bound in each protomer in both structures. Thus the
      paper's ligand-free state must not be interpreted as wholly apo or NAD-free.
    evidence:
    - reference: DOI:10.1016/j.jbc.2023.104893
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 5D and Figures S20/S26; active-site analysis.
  - subject: evds6_dimer
    predicate: contains_observed_bound_ligand
    object: tdp
    notes: In 8SK0, TDP is resolved in one protomer with no attached glucuronic acid.
      The other active site has partial citrate occupancy and unresolved mixed density.
      The source of TDP is uncertain; a minor substrate-stock contaminant was suggested
      but not detected by HPLC-MS. This structure does not establish TDP-sugar catalysis,
      nucleotide preference, or an unambiguous bound UDP-GlcA catalytic intermediate.
    evidence:
    - reference: DOI:10.1016/j.jbc.2023.104893
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 5E and Figures S27/S28; active-site analysis.
    - reference: https://www.rcsb.org/structure/8SK0
      evidence_type: DATABASE_ASSERTION
      notes: TYD ligand in author chain A; citrate in author chain B.
      retrieved_on: '2026-10-03'
- graph_id: everninomicin-d-evds6-reported-alanine-variant-assays
  scope: BIOSYNTHESIS
  description: Figure 7A reports six EvdS6 alanine variants relative to wild type,
    at 30 min with 1 mM UDP-GlcA, 1 mM NAD+ and 50 mM HEPES pH 8.5. Relative turnover
    is based on HPLC-MS extracted-ion peak areas, not kinetic constants; six measurements
    comprise three biological replicates with two technical replicates each. Residue
    numbering matches native parent QLD23489.2. No mutant-specific accession is assigned
    here; these constructs are not equated to the native sequence. The R278A and R279A
    construct identities need review because of a Table S1 primer-label discrepancy;
    their edges preserve reported results.
