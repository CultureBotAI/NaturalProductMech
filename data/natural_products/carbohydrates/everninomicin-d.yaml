- graph_id: everninomicin-d-evds6-udp-sugar-assay
  scope: BIOSYNTHESIS
  description: 'Partial precursor chemistry for everninomicin D: purified, N-terminal
    His6-tagged EvdS6 expressed from pET28a(+) in E. coli Tuner(DE3) was assayed with
    UDP-GlcA. UDP-4-keto-D-xylose and UDP-D-xylose are candidate precursors of the
    H- and G-rings, respectively. Their downstream incorporation, the native UDP-versus-TDP
    donor preference, and complete everninomicin D biosynthesis were not demonstrated.'
  nodes:
  - node_id: evds6
    label: EvdS6 N-terminal His6 construct
    node_type: ENZYME
    grounding_status: GROUNDED
    identifier: NCBIProtein:QLD23489.2
  - node_id: udp_glca
    label: UDP-D-glucuronic acid (assayed substrate)
    node_type: PRECURSOR
    grounding_status: UNGROUNDED
  - node_id: udp_ketoxylose
    label: UDP-4-keto-D-xylose
    node_type: PRECURSOR
    grounding_status: UNGROUNDED
  - node_id: udp_xylose
    label: UDP-D-xylose
    node_type: PRECURSOR
    grounding_status: UNGROUNDED
  - node_id: nad
    label: NAD+
    node_type: COMPOUND
    grounding_status: UNGROUNDED
  edges:
  - subject: udp_glca
    predicate: is_assayed_substrate_of
    object: evds6
    notes: 'The identifier denotes the native 329-aa parent QLD23489.2, not the affinity
      tag. It is HXZ27_04045 at CP058322.1:898338..899327, called evdS5 in GenBank
      and MIBiG BGC0002085.3 but EvdS6 in this paper. The CDS translation and GenPept
      sequence match both PDB constructs after accounting for the 19-aa MGSSHHHHHHSSGLVPRGS
      tag and the initiating GTG codon: native initiator M is V when internal to the
      fusion. Table S1 cloning-primer termini match this CDS. Do not substitute the
      adjacent evdS6-labelled HXZ27_04050/QLD23490.1. The PDB-linked UniProt A0A1C5ADV9
      was rejected as an exact parent: it is 324 aa and has two internal sequence
      conflicts with the assayed protein, in addition to the N-terminal difference.
      Exact-locus/accession and taxon-lineage length-329 UniProt searches found no
      exact match; this is a bounded search, not a claim of global absence. Current
      GenPept assigns M. carbonacea subsp. aurantiaca, NRRL 2997, NCBITaxon:3454472;
      its parent is NCBITaxon:47853, the species in the pinned MIBiG record.'
    evidence:
    - reference: DOI:10.1016/j.jbc.2023.104893
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results, Figure 3 and cloning methods; Table S1.
      snippet: all studies herein used the UDP-GlcA
    - reference: https://www.ncbi.nlm.nih.gov/protein/QLD23489.2
      evidence_type: DATABASE_ASSERTION
      notes: Exact native-parent sequence and locus; functional evidence comes from
        the paper.
      retrieved_on: '2026-10-03'
    - reference: https://ars.els-cdn.com/content/image/1-s2.0-S002192582301921X-mmc1.docx
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Tables S1/S2: genomic cloning primers and producer/host context.'
  - subject: evds6
    predicate: produces_in_vitro
    object: udp_ketoxylose
    notes: HPLC-MS, 2-bromophenylhydrazine derivatization and reaction-mixture NMR
      establish the keto product and its D-xylose configuration; the keto group is
      predominantly hydrated in aqueous solution. Products were absent in the boiled-enzyme
      control. Standard turnover assays used 1 mM UDP-GlcA, 1 mM NAD+, 0.5 mg/ml enzyme,
      50 mM HEPES pH 8.5 at 30 C for 1 h. NMR used an extended incubation and the
      filtered reaction mixture because purified products were unstable; no isolated-product
      yield is asserted.
    evidence:
    - reference: DOI:10.1016/j.jbc.2023.104893
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figures 3/4; Tables S3 and Figures S5-S19; turnover/NMR methods.
  - subject: evds6
    predicate: produces_in_vitro
    object: udp_xylose
    notes: HPLC-MS and multidimensional NMR identify the reduced D-xylose product.
      The Figure 3 time course used 1 mM UDP-GlcA, 0.1 mM NAD+, 0.42 mg/ml enzyme
      and 50 mM HEPES pH 8.5, distinct from the standard assay. Both products are
      seen early, whereas UDP-D-xylose predominates after overnight incubation. This
      is not direct production of L-lyxose or of the final antibiotic.
    evidence:
    - reference: DOI:10.1016/j.jbc.2023.104893
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figures 3C/4 and S4C; NMR product-configuration analysis.
  - subject: nad
    predicate: supports_assayed_turnover_of
    object: evds6
    notes: Figure S4A compares added NAD+, NADP+ and no exogenous cofactor at 1 mM
      UDP-GlcA, 0.35 mg/ml enzyme and 50 mM HEPES pH 8.5. NAD+ gives substantially
      greater turnover; the other conditions retain low activity. Copurified NAD+
      precludes interpreting the no-added-cofactor condition as a cofactor-free enzyme.
    evidence:
    - reference: DOI:10.1016/j.jbc.2023.104893
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure S4A and the turnover-optimization results.
- graph_id: everninomicin-d-evds6-observed-homodimer
  scope: BIOSYNTHESIS
  description: Structural assembly of the recombinant EvdS6 precursor enzyme, not
    a demonstrated in-vivo complex. PDB 8SHH (1.93 A) contains copurified NAD+ without
    added substrate ligand; PDB 8SK0 (1.51 A) contains NAD+ and TDP after crystallization
    with commercial UDP-GlcA. A PDB deposition is structural evidence, not a protein
    accession.
