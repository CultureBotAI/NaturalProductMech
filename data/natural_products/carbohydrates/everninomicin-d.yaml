- graph_id: everninomicin-d-evdmo1-domain-and-ligand-observations
  scope: BIOSYNTHESIS
  description: Structural evidence for full-length EvdMO1 and its isolated N-terminal
    domain EvdMdeltaO1, not a reconstituted methylation/oxygenation pathway. 6EC3
    has three molecules in the asymmetric unit but is assigned as monomeric; its affinity-tag
    contacts are crystal contacts, not a native multienzyme complex. Separate outward-facing
    active sites suggest independent functions without demonstrating kinetic independence.
  nodes:
  - node_id: evdmo1
    label: Reported full-length EvdMO1 His6 construct
    node_type: ENZYME
    grounding_status: REVIEW_NEEDED
    identifier: NCBIProtein:QLD28329.2
  - node_id: evdm_delta_o1
    label: Isolated EvdMO1 residues 1-233 His6 construct
    node_type: ENZYME
    grounding_status: GROUNDED
    identifier: NCBIProtein:QLD28329.2
  - node_id: nickel
    label: Observed nickel(II)
    node_type: COMPOUND
    grounding_status: UNGROUNDED
  - node_id: bis_tris
    label: Crystallization-buffer Bis-Tris
    node_type: COMPOUND
    grounding_status: UNGROUNDED
  - node_id: sah
    label: S-adenosylhomocysteine (SAH)
    node_type: COMPOUND
    grounding_status: UNGROUNDED
  edges:
  - subject: evdmo1
    predicate: has_experimentally_isolated_n_terminal_domain
    object: evdm_delta_o1
    notes: QLD28329.2 denotes the native 450-aa parent, HXZ27_04060 at CP058322.1:900465..901817.
      Its CDS translation matches the deposited 6EC3 core after the 21-aa MGSSHHHHHHSSGLVPRGSHM
      extension. However, the published reverse primer GCGAAGCTTTCAGGACGGGAGCGTC would
      encode S447T against this CDS, whereas the deposited sequence retains S447.
      The unresolved C-terminal model cannot adjudicate this discrepancy; the full-length
      experimental construct remains REVIEW_NEEDED. The paper names ATCC 27115 genomic
      DNA and pET28a(+)/E. coli BL21(DE3) expression. PDB-linked UniProt A0A1C5AE13
      was not used as an exact parent because it differs at H100N, T219K, A232T and
      S444A (native-to-UniProt). Exact-locus/accession and taxonomy-lineage length-450
      UniProt searches found no exact parent; this is a bounded result. The domain
      is a separately expressed truncation, not a demonstrated proteolytic product.
      Both 5T38 and 5T39 deposit the same 21-aa extension plus native residues 1-233.
      The published truncation primer inserts TGA after R233, consistent with that
      endpoint; the residue-447 discrepancy is outside this domain.
    evidence:
    - reference: DOI:10.1021/acs.biochem.8b00836
      evidence_type: PRIMARY_EXPERIMENT
      notes: Cloning methods and full-length structure, Figures 2/8.
    - reference: https://www.ncbi.nlm.nih.gov/protein/QLD28329.2
      evidence_type: DATABASE_ASSERTION
      notes: Native evdMO1/HXZ27_04060 translation in CP058322.1.
      retrieved_on: '2026-10-03'
    - reference: https://www.rcsb.org/structure/6EC3
      evidence_type: DATABASE_ASSERTION
      notes: Deposited full-length sequence, nickel, Bis-Tris and monomeric assemblies;
        3.35 A.
      retrieved_on: '2026-10-03'
    - reference: https://www.rcsb.org/structure/5T38
      evidence_type: DATABASE_ASSERTION
      notes: Deposited native residues 1-233 plus tag and bound SAH; 1.15 A.
      retrieved_on: '2026-10-03'
  - subject: evdmo1
    predicate: contains_observed_bound_metal
    object: nickel
    notes: 6EC3 models nickel acquired during affinity purification, coordinated by
      H349, D351 and H420; it is not a structure demonstrating native iron catalysis.
      A histidine from the affinity tag of a crystallographically related molecule
      also contacts the metal. This crystal contact does not establish a functional
      protein complex. The full-length construct identity caveat on the domain edge
      also applies here.
    evidence:
    - reference: DOI:10.1021/acs.biochem.8b00836
      evidence_type: PRIMARY_EXPERIMENT
      notes: Cloning methods and full-length structure, Figures 2/8.
    - reference: https://www.rcsb.org/structure/6EC3
      evidence_type: DATABASE_ASSERTION
      notes: Deposited full-length sequence, nickel, Bis-Tris and monomeric assemblies;
        3.35 A.
      retrieved_on: '2026-10-03'
  - subject: evdmo1
    predicate: contains_observed_bound_buffer_ligand
    object: bis_tris
    notes: Electron density at the expected AKG site in 6EC3 was modeled as Bis-Tris
      (BTB), a crystallization-buffer component. AKG and an orthosomycin substrate
      were not modeled there. Do not interpret this observation as an AKG-dependent
      turnover assay.
    evidence:
    - reference: DOI:10.1021/acs.biochem.8b00836
      evidence_type: PRIMARY_EXPERIMENT
      notes: Cloning methods and full-length structure, Figures 2/8.
    - reference: https://www.rcsb.org/structure/6EC3
      evidence_type: DATABASE_ASSERTION
      notes: Deposited full-length sequence, nickel, Bis-Tris and monomeric assemblies;
        3.35 A.
      retrieved_on: '2026-10-03'
  - subject: evdm_delta_o1
    predicate: contains_observed_bound_ligand
    object: sah
    notes: The identifier names the native parent, not the tagged 1-233 fragment.
      5T38 was crystallized with 2 mM SAH and resolves bound SAH; the deposited nonpolymer
      model contains SAH and water, not AKG. The companion 5T39 experiment with 10
      mM D-fucose did not resolve fucose density, so no fucose-binding claim is made.
      Full-length 6EC3 lacks bound SAM/SAH. The proposed E-ring O-methylation assignment
      is based on AviG5 homology, not demonstrated EvdMO1 turnover.
    evidence:
    - reference: DOI:10.1021/acs.biochem.8b00836
      evidence_type: PRIMARY_EXPERIMENT
      notes: Isolated-domain structure and active-site analysis, Figures 3/4.
      snippet: unambiguous electron density for SAH
    - reference: https://www.rcsb.org/structure/5T38
      evidence_type: DATABASE_ASSERTION
      notes: Deposited native residues 1-233 plus tag and bound SAH; 1.15 A.
      retrieved_on: '2026-10-03'
    - reference: https://www.rcsb.org/structure/5T39
      evidence_type: DATABASE_ASSERTION
      notes: Companion SAH-bound domain structure; no modeled D-fucose.
      retrieved_on: '2026-10-03'
