biosynthetic_pathway:
- enzyme_id: UniProtKB:E2PWJ7
  enzyme_label: CAS1
  proposed: true
  notes: This curates the Streptomyces clavuligerus ATCC 27064 BGC0000843/CM000913.1
    cas1 clavaminate synthase 1 contribution to the CAS-derived clavaminic-acid pool
    that feeds proposed 2-formyloxymethylclavam biosynthesis. CAS2 can partially complement
    CAS1, so this entry does not assert that CAS1 is singly required or that cas1
    mutants directly assayed 2-formyloxymethylclavam.
  evidence:
  - reference: DOI:10.1128/AAC.43.5.1215
    evidence_type: PRIMARY_EXPERIMENT
    snippet: CAS1 and CAS2 contribute to a common pool of clavaminic acid
    notes: Mosher et al. connected Streptomyces clavuligerus CAS1 and CAS2 to a shared
      clavaminic-acid precursor pool upstream of the antipodal clavam branch; this
      BGC0000843-centered pathway leaves the exact downstream transformations to 2-formyloxymethylclavam
      tentative.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000843.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0000843.5 names 2-formyloxymethylclavam among products of the
      Streptomyces clavuligerus ATCC 27064 CM000913.1 clavam locus that includes cas1.
  - reference: https://www.uniprot.org/uniprotkb/E2PWJ7
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:E2PWJ7 is the Streptomyces clavuligerus SCLAV_2925/cas1
      324 aa clavaminate synthase 1 and cross-references EMBL CM000913 protein EFG07996.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/EFG07996.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept EFG07996.1 is the CM000913.1 BGC0000843 Streptomyces clavuligerus
      ATCC 27064 cas1 clavaminate synthase 1 CDS and matches UniProtKB:E2PWJ7.
