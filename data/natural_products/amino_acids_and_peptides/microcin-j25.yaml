biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9X2V8
  enzyme_label: McjB
  substrate: UniProtKB:Q9X2V7
  proposed: false
  notes: Leader cleavage in coupled McjB/McjC maturation of microcin J25. McjB removes
    the 37-residue McjA leader in the ATP-dependent reaction system. McjC is also
    required; the core intermediate is not assigned a chemical identifier.
  evidence:
  - reference: DOI:10.1002/cbic.201200016
    evidence_type: PRIMARY_EXPERIMENT
    notes: Yan et al. assigned McjB the proteolytic function using in vitro maturation
      and reaction-intermediate detection; the enzymes were functionally interdependent.
    snippet: a new ATP-dependent cysteine protease
  - reference: https://www.uniprot.org/uniprotkb/Q9X2V7
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: The 58-residue E. coli AY25 McjA precursor matches GenPept AAD28494.1.
      Residues 1-37 form the leader and 38-58 the 21-residue core. The mature Gly1-Glu8
      cross-link corresponds to precursor residues 38 and 45; the full-length UniProt
      accession here denotes the precursor, not the mature compound.
  - reference: https://www.uniprot.org/uniprotkb/Q9X2V8
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: E. coli AY25 mcjB; its 208-residue sequence exactly matches GenPept AAD28495.1
      from AF061787.1, the sequence underlying MIBiG BGC0000581.
  - reference: https://mite.bioinformatics.nl/repository/MITE0000056
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: MITE identifies McjB/Q9X2V8 in BGC0000581 and curates leader cleavage,
      with McjC as an auxiliary enzyme.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000581.6/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: Active E. coli AY25 microcin J25 cluster with mcjA, mcjB and mcjC. The
      McjC feature uses the legacy AAD28496.1 sequence; corrected protein grounding
      is documented separately in the McjC step.
- step_number: 2
  enzyme_id: UniProtKB:Q9X2V9
  enzyme_label: McjC
  product: naturalproductmech:mibig-c68748ca1b
  proposed: false
  notes: ATP-dependent macrolactam formation links the core N-terminal Gly1 amine
    to the Glu8 side-chain carboxyl group during lasso maturation. McjB is also required.
    The two numbered steps describe processing chemistry, not independently reconstituted
    enzymes or a freely released core intermediate. Protein grounding uses corrected
    CAJ40934.1, not the discrepant AAD28496.1 sequence.
  evidence:
  - reference: DOI:10.1002/cbic.201200016
    evidence_type: PRIMARY_EXPERIMENT
    notes: Yan et al. confirmed McjC's lactam-synthetase function in coupled maturation
      assays and detected intermediates.
    snippet: McjC was confirmed to be a lactam synthetase
  - reference: DOI:10.1016/j.chembiol.2007.06.004
    evidence_type: PRIMARY_EXPERIMENT
    notes: Duquesne et al. reconstituted McjA maturation with both recombinant enzymes
      and linked McjC to the Gly1-Glu8 amide bond.
  - reference: https://www.uniprot.org/uniprotkb/Q9X2V9
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: E. coli AY25 McjC is represented by the corrected 513-residue sequence,
      exactly matching CAJ40934.1 from AM116873.1/pTUC202. UniProt links this sequence
      to Duquesne et al. (PMID:17656316). Its sequence caution identifies the legacy
      442-residue AAD28496.1 in AF061787.1/MIBiG BGC0000581 as discrepant; these two
      protein sequences are not treated as identical.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAJ40934.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: Corrected 513-residue mcjC coding sequence from AM116873.1:7..1548 on pTUC202;
      exact sequence match to UniProtKB:Q9X2V9.
  - reference: https://mite.bioinformatics.nl/repository/MITE0000055
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: MITE curates McjC/Q9X2V9 macrolactam formation with McjB as an auxiliary
      enzyme and explicitly flags the UniProt/GenPept sequence mismatch.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000581.6/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: Active E. coli AY25 microcin J25 cluster with mcjA, mcjB and mcjC. The
      McjC feature uses the legacy AAD28496.1 sequence; corrected protein grounding
      is documented separately in the McjC step.
causal_graphs:
- graph_id: microcin-j25-mcjbc-lasso-maturation
  scope: BIOSYNTHESIS
  description: Coupled E. coli AY25 McjA precursor processing by McjB and McjC. Both
    enzymes are required for maturation; a physical complex is suggested, not asserted
    as established. The product is the seeded microcin J25 structure with stereochemistry
    incompletely specified in its source SMILES.
