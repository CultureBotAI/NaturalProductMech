biosynthetic_pathway:
- step_number: 1
  enzyme_label: AcsD (NIS synthetase) and AcsE (decarboxylase)
  substrates:
  - CHEBI:30769
  - CHEBI:17115
  notes: ATP-dependent enantioselective condensation of citric acid with L-serine
    by AcsD followed by PLP-dependent decarboxylation by AcsE to O-citryl-ethanolamine.
  evidence:
  - reference: PMID:19182782
    evidence_type: PRIMARY_EXPERIMENT
    notes: Structural and biochemical characterization of AcsD catalyzing enantioselective
      citrate desymmetrization and esterification with L-serine in achromobactin biosynthesis.
  - reference: PMID:19482931
    evidence_type: PRIMARY_EXPERIMENT
    notes: AcsD and AcsE convert citric acid and L-serine into O-citryl-ethanolamine.
- step_number: 2
  enzyme_label: AcsA and AcsC (NIS siderophore synthetases)
  substrates:
  - CHEBI:30915
  products:
  - CHEBI:65352
  notes: Amide condensation of O-citryl-ethanolamine with L-2,4-diaminobutyrate and
    two equivalents of 2-oxoglutaric acid to install the two 4-carboxy-4-oxobutanoyl
    chelating arms of achromobactin.
  evidence:
  - reference: PMID:19482931
    evidence_type: PRIMARY_EXPERIMENT
    notes: Reconstitution of complete achromobactin assembly by AcsD, AcsE, AcsA,
      and AcsC from citrate, L-serine, L-2,4-diaminobutyrate, and two 2-oxoglutarate
      molecules.
