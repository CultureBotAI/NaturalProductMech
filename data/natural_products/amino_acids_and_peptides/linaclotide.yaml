definition: 'A fourteen-membered heterodetic cyclic peptide consisting of Cys, Cys,
  Glu, Tyr, Cys, Cys, Asn, Pro, Ala, Cys, Thr, Gly, Cys and Tyr residues joined in
  sequence and cyclised by three disulfide bonds: between Cys1 and Cys6, between Cys2
  and Cys10, and between Cys5 and Cys13. Used for treatment of irritable bowel syndrome
  accompanied by constipation.'
