molecular_targets:
- target_id: CHEBI:29034
  target_label: iron(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Physiological ferric ion chelation via bidentate 2,3-catecholate coordination
    (forming 3:1 [Fe(DHBS)3]3- and 2:1 complexes in solution); imported directly via
    the Fiu, CirA, and FepA TonB-dependent outer-membrane receptors in Escherichia
    coli and Salmonella enterica.
  evidence:
  - reference: PMID:2140831
    evidence_type: PRIMARY_EXPERIMENT
    notes: Monomeric N-(2,3-dihydroxybenzoyl)-L-serine functions as an active catecholate
      siderophore transported across the Escherichia coli outer membrane primarily
      by the Fiu and Cir receptors.
  - reference: DOI:10.1021/ic50200a022
    evidence_type: PRIMARY_EXPERIMENT
    notes: Potentiometric and spectrophotometric equilibrium studies of ferric, gallium(III),
      and molybdenum(VI) complexes with N-(2,3-dihydroxybenzoyl)-L-serine.
- target_id: CHEBI:84043
  target_label: gallium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Bidentate catecholate coordination of
    trivalent gallium(3+) in 3:1 [Ga(DHBS)3]3- stoichiometry (measured in vitro in
    aqueous solution as a diamagnetic Fe(III) analog).'
  evidence:
  - reference: DOI:10.1021/ic50200a022
    evidence_type: PRIMARY_EXPERIMENT
    notes: Equilibrium stability constants and coordination stoichiometry of N-(2,3-dihydroxybenzoyl)-L-serine
      with Ga(III) and Fe(III).
- target_id: CHEBI:49446
  target_label: molybdenum(6+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Catecholate cis-dioxo coordination of molybdenum(6+) (molybdate, [MoO2(DHBS)2]2-,
    measured in vitro and in catecholate-mediated molybdate scavenging).
  evidence:
  - reference: DOI:10.1021/ic50200a022
    evidence_type: PRIMARY_EXPERIMENT
    notes: Formation of stable cis-dioxomolybdenum(VI) bis-catecholate complexes with
      N-(2,3-dihydroxybenzoyl)-L-serine in aqueous solution.
- target_id: CHEBI:30046
