biosynthetic_pathway:
- step_number: 1
  enzyme_label: EntB, EntE, EntF (enterobactin NRPS) and Fes / IroE (enterobactin
    esterases)
  substrates:
  - CHEBI:18026
  - CHEBI:17115
  - CHEBI:28855
  products:
  - CHEBI:17455
  notes: NRPS-catalyzed condensation of 2,3-dihydroxybenzoic acid and L-serine to
    form enterobactin, followed by Fes- or IroD/IroE-catalyzed trilactone ester hydrolysis
    (or premature thioesterase release) to yield monomeric N-(2,3-dihydroxybenzoyl)-L-serine.
  evidence:
  - reference: PMID:2140831
    evidence_type: PRIMARY_EXPERIMENT
    notes: Escherichia coli secretes and utilizes monomeric 2,3-dihydroxybenzoyl-L-serine
      derived from the entABCDEF-fes pathway via Fiu and Cir outer membrane receptors.
