- graph_id: fellutamide-b-regulation-and-self-resistance
  scope: BIOSYNTHESIS
  description: 'Partial producer-regulation and self-resistance view. Mediation links
    to the proposed assembly graph are intentionally omitted: ScpR transcriptional
    control does not by itself prove productive cluster activation. InpD resistance
    involvement remains tentative and no export substrate is demonstrated. InpE is
    a producer-resistance subunit, not an adopted inhibited target. The conditional
    InpE requirement is bounded to one inspected primary abstract; other role assignments
    are database assertions. Reference sequences do not establish experimental allele
    identity, quantitative phenotypes, direct promoter contacts or complete proteasome
    assembly.'
