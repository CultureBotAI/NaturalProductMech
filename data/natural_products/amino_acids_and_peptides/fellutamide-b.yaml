- discussion_id: curator-fellutamide-b-assembly-and-assay-scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Which direct assays resolve InpF transfer, InpD transport, terminal release
    chemistry and exact experimental alleles?
  rationale: Seven native FGSC A4 references are sequence-verified. Assembly and auxiliary
    roles remain reviewed UniProt annotations, not independently inspected primary
    biochemical assays. The single primary abstract supports conditional InpE producer
    resistance. RDKit 2026.03.5 confirms the existing fully specified structure and
    leucinal S center, consistent with the database (2S)-fellutamide B label; primary
    figures and spectra remain uninspected. Preserve MINTED identity, source-owned
    provenance and SEEDED status. Mycobacterial proteasome hits are separate bioactivity
    leads, not producer enzymes or automatic alpha-subunit binding targets.
  evidence:
  - reference: DOI:10.1021/acschembio.6b00213
    evidence_source: Inspected author abstract only
    notes: Full text was not obtained; detailed enzymology and experimental chemical
      identity remain unverified.
  - reference: https://www.uniprot.org/uniprotkb/Q5B7I5/entry
    evidence_source: Reviewed UniProt FUNCTION
    notes: Database annotation proposes reductive release of (2S)-fellutamide B; terminal-domain
      catalysis is not independently verified.
