molecular_targets:
- target_label: Mycobacterium tuberculosis 20S proteasome core
  target_type: PROTEIN_COMPLEX
  relation: INHIBITS
  taxon_id: NCBITaxon:1773
  taxon_label: Mycobacterium tuberculosis
  protein_examples:
  - UniProtKB:P9WHT9
  source: CURATOR
  notes: Target identity is the complex, not an isolated beta subunit. The example
    is deliberately selected H37Rv native PrcB; its mature58-291 sequence matches
    the structural beta chain before the6His tag. PrcA is only a complex component
    in the graph, not a direct binding-target example. 3KRD names H37Rv but also gives
    H37Ra accessions A5U4D5/A5U4D6 and MRA_2124/MRA_2125. The H37Ra and H37Rv reference
    sequences are identical. H37Rv accessions here are deliberately selected native
    references, not proof of the experimental donor strain. Species-level target scope
    follows the abstract, not a verified H37Rv kinetic assay. No measurement adopted.
  evidence:
  - reference: DOI:10.1016/j.abb.2010.06.009
    evidence_type: PRIMARY_EXPERIMENT
    retrieved_on: '2026-10-12'
    notes: Only the author abstract indexed at https://europepmc.org/article/MED/20558127
      was inspected. It reports time-dependent M. tuberculosis proteasome inhibition
      and a co-crystal with fellutamide B. Full Methods, kinetic-assay constructs,
      substrate conditions and experimental compound preparation were not inspected.
      No quantitative Ki, strain-specific susceptibility, growth inhibition or downstream
      killing claim is adopted.
  - reference: https://www.uniprot.org/uniprotkb/P9WHT9/entry
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-12'
    notes: Reviewed H37Rv native reference; entry68, sequence1, annotation2026-09-02.
      ACTIVITY REGULATION annotates fellutamide B inhibition of proteasome activity,
      not isolated precursor inhibition.
    snippet: Proteasome activity is potently inhibited by fellutamide B
  - reference: https://www.rcsb.org/structure/3KRD
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-12'
    notes: 'Structural corroboration and construct mapping only: entity2 is the processed
      beta sequence plus6His. Conflicting strain identifiers remain unresolved.'
- target_label: Saccharomyces cerevisiae 20S proteasome core
  target_type: PROTEIN_COMPLEX
  relation: BINDS
  taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  protein_examples:
  - UniProtKB:P38624
  - UniProtKB:P25043
  - UniProtKB:P30656
  source: CURATOR
  notes: 'Structural-model binding only: six covalent ligand contacts across the beta1,beta2,beta5
    copies. The remaining11 subunit types are complex members, not adopted direct-binding
    examples. S288c accessions are deliberately selected reference examples, not proof
    that the baker''s-yeast preparation was S288c. Thirteen UniProt accessions stored
    in the mmCIF are now deleted; they are not adopted as live identifiers. Matching
    deposited polymer spans do not prove physical truncation of the purified proteins
    or complete assay-construct identity. No quantitative inhibition measurement or
    irreversible-binding claim.'
  evidence:
  - reference: https://www.rcsb.org/structure/3D29
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-12'
    notes: 3D29 explicit covalent contacts at author chainsH/V,K/Y,N/2. UniProt examples
      map the canonical precursors to their deposited processed polymer spans.
  - reference: https://files.rcsb.org/download/3D29.cif
    evidence_type: CURATOR_INFERENCE
    retrieved_on: '2026-10-12'
    notes: 'Curator mapping with RDKit2026.03.5: all six NQL/HXD ligands have39 modeled
      heavy atoms and retain S/S/S peptide centers plus R lipid3-OH. Reversing the
      covalent hemiacetal to the free aldehyde reconstructs owner InChIKey MFXAGCQVWGPEJH-LRSLUSHPSA-N.
      This is coordinate-based mapping, not independent experimental structure elucidation
      or density-validation sign-off. The new bound hemiacetal center is not assigned
      to the free owner.'
- target_label: Human20S proteasome beta5 activity
  target_type: PROTEIN_COMPLEX
  relation: INHIBITS
  taxon_id: NCBITaxon:9606
  taxon_label: Homo sapiens
  protein_examples:
  - UniProtKB:P28074
  source: CURATOR
  notes: The human beta5 assay is supported only by the cached 2010 author abstract.
    P28074 is the deliberately selected PSMB5 canonical isoform1 reference, not an
    independently sequenced assay preparation. Isoforms2/3, immunoproteasome beta5i,
    donor, tissue and exact construct are not resolved or substituted. Target scope
