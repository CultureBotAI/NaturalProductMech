    precursor. No quantitative measurement adopted.
  evidence:
  - reference: DOI:10.1016/j.abb.2010.06.009
    evidence_type: PRIMARY_EXPERIMENT
    retrieved_on: '2026-10-12'
    notes: Only the previously inspected author abstract at https://europepmc.org/article/MED/20558127
      is used. It explicitly reports time-dependent inhibition of the human proteasome
      beta5 active site. Full Methods, exact preparation, dose/substrate conditions
      and kinetic construct remain uninspected. No quantitative affinity, all-beta-subunit
      inhibition, NGF induction, microbial killing or irreversible inhibition claim
      is adopted. The human beta5 assay is supported only by the cached 2010 author
      abstract. P28074 is the deliberately selected PSMB5 canonical isoform1 reference,
      not an independently sequenced assay preparation. Isoforms2/3, immunoproteasome
      beta5i, donor, tissue and exact construct are not resolved or substituted.
  - reference: https://www.uniprot.org/uniprotkb/P28074/entry
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-12'
    notes: Reviewed PSMB5 reference, taxon9606; entry256, sequence3, annotation2026-09-02.
