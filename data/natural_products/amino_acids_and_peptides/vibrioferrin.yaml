- discussion_id: curator-vibrioferrin-indirect-origin
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  prompt: Which primary experiment supports the ChEBI Vibrio alginolyticus occurrence?
  rationale: ChEBI pairs V. alginolyticus with PMID:22146715. That paper mentions
    native Vibrio sources as prior literature, but its characterized experimental
    product comes from E. coli expressing marine sediment clone MG93-1. The donor
    taxon is not established by sequence homology. The occurrence remains a faithful
    DATABASE_ASSERTION, not a direct alginolyticus detection experiment in that paper.
    Retain the upstream pair and trace the native isolation or biosynthesis evidence;
    do not delete the occurrence from this indirect citation alone, replace its taxon
    with E. coli, or infer an identified environmental donor.
  evidence:
  - reference: PMID:22146715
    evidence_source: full_text
    explanation: 2011 metagenomic expression study, Figure 1 and Figure 3/Table 1;
      native taxa are prior-literature context, not the experimentally identified
      donor.
  - reference: https://github.com/CultureBotAI/NaturalProductMech/issues/932
    explanation: Open scientific adjudication; a visible qualification is not resolution.
  - reference: https://www.ebi.ac.uk/chebi/84585
    evidence_source: database
    explanation: Upstream origin pairing is preserved, not asserted as independent
      experimental verification.
