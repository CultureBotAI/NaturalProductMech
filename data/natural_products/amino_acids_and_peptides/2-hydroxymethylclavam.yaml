  edges:
  - subject: cas1
    predicate: contributes to
    object: clavaminic_acid_pool
    notes: CAS1 disruption reduced 2-hydroxymethylclavam production, and joint cas1/cas2
      disruption eliminated antipodal clavam production, consistent with CAS1 and
      CAS2 contributing to a common clavaminic-acid pool.
    evidence:
    - reference: DOI:10.1128/AAC.43.5.1215
      evidence_type: PRIMARY_EXPERIMENT
      snippet: CAS1 and CAS2 contribute to a common pool of clavaminic acid
      notes: Mosher et al. concluded from the cas1 single-mutant and cas1/cas2 double-mutant
        phenotypes that both CAS isoenzymes contribute to a shared intracellular clavaminic-acid
        pool.
    - reference: https://www.uniprot.org/uniprotkb/E2PWJ7
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-09-27'
      notes: Unreviewed UniProtKB:E2PWJ7 is the Streptomyces clavuligerus SCLAV_2925/cas1
        324 aa clavaminate synthase 1 and cross-references EMBL CM000913 protein EFG07996.1.
    - reference: https://www.ncbi.nlm.nih.gov/protein/EFG07996.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-09-27'
      notes: NCBI GenPept EFG07996.1 is the CM000913.1 BGC0000843 Streptomyces clavuligerus
        ATCC 27064 cas1 clavaminate synthase 1 CDS and matches UniProtKB:E2PWJ7.
  - subject: clavaminic_acid_pool
    predicate: contributes to
    object: two_hydroxymethylclavam
    notes: Clavaminic acid is supported as a shared branch-point precursor to clavam
      metabolites; the exact clavaminic-acid-to-2-hydroxymethylclavam transformations
      remain tentative.
    evidence:
    - reference: DOI:10.1128/AAC.43.5.1215
      evidence_type: PRIMARY_EXPERIMENT
      snippet: serves as a precursor for the biosynthesis of all clavams produced
        by S. clavuligerus
      notes: Mosher et al. reported that cas1/cas2 double mutants failed to make 2-hydroxymethylclavam
        or the other assayed clavam metabolites, supporting a clavaminic-acid precursor
        pool upstream of the clavam branch.
