biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:E2PWJ7
  enzyme_label: CAS1
  notes: This curates the Streptomyces clavuligerus ATCC 27064 BGC0000843/CM000913.1
    cas1 clavaminate synthase 1 contribution to the CAS-derived clavaminic-acid pool
    that feeds 2-hydroxymethylclavam biosynthesis. CAS2 can partially complement CAS1,
    so this entry does not assert that CAS1 is singly required; the exact downstream
    route from clavaminic acid to 2-hydroxymethylclavam remains tentative.
  evidence:
  - reference: DOI:10.1128/AAC.43.5.1215
    evidence_type: PRIMARY_EXPERIMENT
    snippet: the levels of clavam-2-carboxylate and 2-hydroxymethylclavam production
      were significantly reduced
    notes: Mosher et al. disrupted Streptomyces clavuligerus cas1 and showed reduced
      2-hydroxymethylclavam production in soy medium; cas1/cas2 double mutants produced
      none of the antipodal clavams.
  - reference: https://www.uniprot.org/uniprotkb/E2PWJ7
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:E2PWJ7 is the Streptomyces clavuligerus SCLAV_2925/cas1
      324 aa clavaminate synthase 1 and cross-references EMBL CM000913 protein EFG07996.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/EFG07996.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept EFG07996.1 is the CM000913.1 BGC0000843 Streptomyces clavuligerus
      ATCC 27064 cas1 clavaminate synthase 1 CDS and matches UniProtKB:E2PWJ7.
