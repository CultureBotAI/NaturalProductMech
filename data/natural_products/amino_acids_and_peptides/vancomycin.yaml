  - subject: gtfd_reference
    predicate: is_native_gene_product_example_for
    object: gtfd_target
    notes: 'Current AORI_1486 reference: complete CP003410.1 CDS translation equals
      AGM04074.1 and the 408-residue UniProt sequence. The genome and UniProt retain
      strain HCCB10007 but name Amycolatopsis keratiniphila, taxon129921; GenPept
      documents an October2018 taxonomic update from the historical A. orientalis
      name. This does not silently change source-owned producer fields or prove the
      sequence of the experimental stock or marker construct. The native CDS translation
      also equals AEI58872.1; both published39nt homology arms match its start/stop
      boundaries uniquely in the retained genome. This is an exact sequence-match
      check, not experimental primer specificity or clone resequencing. Reviewed Q9AFC7
      has a different source strain and sequence and is not selected.'
    evidence:
    - reference: https://www.uniprot.org/uniprotkb/R4SKH3
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed entry53/sequence1, 408 residues; source strain HCCB10007,
