definition: A member of the class of desferrialbomycins that is desferrialbomycin
  ε in which the hydrogen attached to the nitrogen at position 4 of the pyrimidone
  moiety is replaced by a carbamoyl group. The iron(III) complex of desferrialbomycin
  δ1 is the antibiotic albomycin δ2.
