- discussion_id: curator-ferrichrome-constitution-conflict
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  prompt: The imported C26 structure has two N-acetyl and one N-formyl hydroxamates,
    whereas named ferrichrome and its metal-free ligand have C27 and three N-acetyl
    groups. Which exact product does BGC0000900 version 5 establish?
  rationale: This is a constitutional conflict, not merely removal of iron. The current
    structure, natural-origin assertion, producer, locus and LOTUS occurrence are
    retained as source assertions pending exact-product adjudication, not independently
    validated claims for this graph. PubChem CID90658043 matches the imported structure
    but does not establish its name or biosynthesis. Do not replace it with CHEBI:5019,
    CHEBI:90132 or the separate iron-55 owner, merge owners, or transfer occurrences,
    assays or graphs without primary evidence and a guarded migration. The cited occurrence
    paper remains unavailable; no production is inferred from detection.
  evidence:
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000900.5/annotations.json
    evidence_source: database
    explanation: Versioned source structure agrees with the imported C26 graph; agreement
      is not independent named-product proof.
  - reference: CHEBI:5019
    evidence_source: database
    explanation: Named ferrichrome is C27H42FeN9O12 with three N-acetyl groups.
  - reference: CHEBI:90132
    evidence_source: database
    explanation: The metal-free ligand is C27H45N9O12, also triacetylated; metal removal
      does not explain the C26 graph.
  - reference: https://github.com/CultureBotAI/NaturalProductMech/issues/918
