molecular_targets:
- target_id: CHEBI:29034
  target_label: iron(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Hexadentate octahedral coordination of ferric iron(3+) via three N5-acetyl-N5-hydroxy-L-ornithine
    hydroxamate groups on the cyclic hexapeptide cyclo[(Gly)3-(N5-acetyl-N5-hydroxy-L-Orn)3]
    scaffold to form ferrichrome (log beta110 = 29.1).
  evidence:
  - reference: PMID:8430103
    evidence_type: PRIMARY_EXPERIMENT
    notes: Biosynthesis of the cyclic hexapeptide trihydroxamate siderophore ferrichrome
      (deferrichrome + Fe(III)) in Ustilago maydis.
  - reference: PMID:9856937
    evidence_type: PRIMARY_EXPERIMENT
    notes: X-ray crystal structure of ferric-bound ferrichrome complexed with the
      Escherichia coli outer membrane transporter FhuA at 2.5 A resolution.
- target_id: CHEBI:84043
  target_label: gallium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] High-affinity octahedral chelation of
    trivalent gallium(3+) by deferrichrome to form [Ga(III)]-deferrichrome (gallichrome),
    characterized by 1H-NMR solution conformation analysis, a 1.9 A co-crystal structure
    with Escherichia coli FhuD, and 68Ga-radiolabeled PET imaging.'
  evidence:
  - reference: PMID:10742172
    evidence_type: PRIMARY_EXPERIMENT
    notes: 1.9 A X-ray crystal structure of Escherichia coli periplasmic binding protein
      FhuD complexed with gallichrome ([Ga(III)]-deferrichrome).
  - reference: PMID:2279065
    evidence_type: PRIMARY_EXPERIMENT
    notes: 1H-NMR spectroscopic determination of the solution conformation of gallichrome
      ([Ga(III)]-deferrichrome).
  - reference: PMID:38436776
    evidence_type: PRIMARY_EXPERIMENT
    notes: Preclinical characterization of 68Ga-labeled ferrichrome siderophore complexes
      for PET imaging.
- target_id: CHEBI:49470
  target_label: aluminium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Octahedral coordination of trivalent
    aluminium(3+) by deferrichrome to form the diamagnetic complex alumichrome ([Al(III)]-deferrichrome),
    characterized by 1H-, 13C-, and 15N-NMR spectroscopy.'
  evidence:
  - reference: PMID:2279065
    evidence_type: PRIMARY_EXPERIMENT
    notes: 1H-NMR solution conformation analysis of alumichrome ([Al(III)]-deferrichrome)
      in d6-DMSO.
  - reference: PMID:486399
    evidence_type: PRIMARY_EXPERIMENT
    notes: Complete 13C-NMR chemical shift assignment and conformational analysis
      of alumichrome.
