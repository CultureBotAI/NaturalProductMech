biosynthetic_pathway:
- step_number: 1
  enzyme_label: L-ornithine N5-monooxygenase (Sid1 / Sib2)
  substrates:
  - CHEBI:15729
  products:
  - CHEBI:79095
  notes: FAD- and NADPH-dependent N5-hydroxylation of L-ornithine to N(5)-hydroxy-L-ornithine
    by Sid1 (Ustilago maydis) or Sib2 (Schizosaccharomyces pombe).
  evidence:
  - reference: PMID:8430103
    evidence_type: PRIMARY_EXPERIMENT
    notes: Cloning and targeted disruption of sid1 encoding L-ornithine N5-oxygenase
      in Ustilago maydis abolish deferrichrome biosynthesis.
  - reference: PMID:20435771
    evidence_type: PRIMARY_EXPERIMENT
    notes: Genetic deletion of sib2+ encoding L-ornithine N5-oxygenase in Schizosaccharomyces
      pombe abolishes ferrichrome biosynthesis.
- step_number: 2
  enzyme_label: N5-hydroxyornithine N5-acetyltransferase (Sib3) and ferrichrome nonribosomal
    peptide synthetase (Sid2 / Sib1)
  substrates:
  - CHEBI:79095
  - CHEBI:15351
  - CHEBI:15428
  - CHEBI:15422
  products:
  - CHEBI:90132
  notes: Acetyl-CoA-dependent N5-acetylation of N(5)-hydroxy-L-ornithine (by Sib3
    in S. pombe) followed by iterative assembly and macrocyclization of three glycine
    units and three N5-acetyl-N5-hydroxy-L-ornithine units by the multimodular NRPS
    Sid2 (Ustilago maydis) or Sib1 (Schizosaccharomyces pombe) to release deferrichrome.
  evidence:
  - reference: PMID:11395469
    evidence_type: PRIMARY_EXPERIMENT
    notes: Targeted disruption of the sid2 NRPS gene in Ustilago maydis abolishes
      ferrichrome biosynthesis.
  - reference: PMID:20435771
    evidence_type: PRIMARY_EXPERIMENT
    notes: Genetic deletion of sib1+ and sib2+ in Schizosaccharomyces pombe abolishes
      ferrichrome synthesis.
  - reference: PMID:35928155
    evidence_type: PRIMARY_EXPERIMENT
    notes: Genetic characterization of Sib2 (ornithine N5-monooxygenase) and Sib3
      (N5-transacetylase) required for ferrichrome biosynthesis in Schizosaccharomyces
      pombe.
