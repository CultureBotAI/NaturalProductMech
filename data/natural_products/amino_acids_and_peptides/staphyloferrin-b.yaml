biosynthetic_pathway:
- step_number: 4
  enzyme_id: UniProtKB:Q2G1N1
  enzyme_label: Staphyloferrin B synthase
  reaction_id: RHEA:59132
  notes: Staphylococcus aureus NCTC 8325 SbnC catalyzes the ATP-dependent terminal
    condensation of the SbnF product with 2-oxoglutarate to form staphyloferrin B.
    RHEA:59132 uses the staphyloferrin B(2-) participant CHEBI:136993; this record
    denotes neutral CHEBI:134612 with the same stereochemistry.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2009.06880.x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: SbnC activates α-KG in a reaction that completes the synthesis of staphyloferrin
      B
    notes: Cheung et al. reconstituted staphyloferrin B biosynthesis in vitro with
      purified recombinant Sbn enzymes and assigned SbnC as the final synthetase that
      condenses 2-oxoglutarate with the SbnF product.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000943.5/
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG entry version 5 links BGC0000943 to staphyloferrin B biosynthesis
      in Staphylococcus aureus subsp. aureus NCTC 8325 and lists the LS483365.1 sbnC
      gene as NCTC8325_00067/SQF72447.1.
  - reference: RHEA:59132
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: RHEA:59132 annotates EC:6.3.2.56 as 2-[(L-alanin-3-ylcarbamoyl)methyl]-3-(2-aminoethylcarbamoyl)-2-hydroxypropanoate,
      2-oxoglutarate, and ATP forming staphyloferrin B, AMP, diphosphate, and a proton.
  - reference: https://www.uniprot.org/uniprotkb/Q2G1N1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:Q2G1N1 is the Staphylococcus aureus NCTC 8325 / PS 47
      SbnC staphyloferrin B synthase, ordered locus SAOUHSC_00077, and annotates RHEA:59132.
