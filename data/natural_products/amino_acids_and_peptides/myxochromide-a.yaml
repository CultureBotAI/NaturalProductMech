- discussion_id: curator-myxochromide-a-core-identity
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  prompt: Does the imported C45 graph represent the experimentally established product
    of each of BGC0001425-1428?
  rationale: 'The imported graph has a 21-membered lactone and alpha-carboxamide connectivity,
    whereas the independent 2006 A3 structure from DK1050, a DK1622 derivative, has
    a 19-membered glutamine-based core. The side-chain length agrees with A3, so chain
    variation alone does not explain the ring difference. Calculated R-proline also
    differs from the source-context L-proline assignment. These comparisons do not
    establish every 2017 strain-specific product: the cited PMID:28128551 full text
    was unavailable (HTTP403). Chemistry and all source claims are retained pending
    exact-strain adjudication, not independently validated for this graph. Do not
    merge the same-label C44 owner, select replacement stereochemistry, or transfer
    production, occurrence or mechanism claims without primary evidence and a guarded
    migration.'
