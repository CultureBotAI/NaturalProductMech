    explanation: 'Independent 2006 supplement, Figures 1-2 and Table 1: A-series structure
      and L-proline from DK1050. Not an HW-1, DK897, A47 or Mx48 experiment.'
  - reference: PMID:28128551
    evidence_source: abstract
    explanation: Cited 2017 genome-mining study; metadata and abstract do not resolve
      exact per-strain configurations. Full text was unavailable.
