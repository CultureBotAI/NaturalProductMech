biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:R9USI6
  enzyme_label: SgvP griseoviridin C-S bond-forming cytochrome P450
  notes: SgvP catalyzes heterocyclization of the thiol-containing linear griseoviridin-pathway
    intermediate to install the griseoviridin C-S bond. The MITE substrate and product
    are left out of the pathway step because no stable CURIEs identify those exact
    intermediate structures.
  evidence:
  - reference: DOI:10.1002/cbic.201400062
    evidence_type: PRIMARY_EXPERIMENT
    snippet: we inactivated the sgvP gene.
    notes: Xie et al. deleted sgvP from the Streptomyces griseoviridis griseoviridin/viridogrisein
      cluster, observed griseoviridin-pathway products lacking the C-S bridge, and
      partially restored griseoviridin production by complementing sgvP in trans.
  - reference: https://mite.bioinformatics.nl/repository/MITE0000043
    evidence_type: DATABASE_ASSERTION
    snippet: Heterocyclization
    retrieved_on: '2026-10-03'
    notes: MITE0000043 is active and links SgvP heterocyclization to UniProtKB:R9USI6,
      GenPept AGN74891.1, MIBiG BGC0000459, heme, Fe, and Xie et al. 2014 as the experimental
      griseoviridin C-S-bond reference.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000459.5/BGC0000459.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: 'MITE0000043: Heterocyclization (100% identity)'
    retrieved_on: '2026-10-03'
    notes: MIBiG BGC0000459.5 places the Streptomyces griseoviridis SgvP CDS at JX508597.1:62773..63963
      on the reverse strand with GenPept protein_id AGN74891.1 and a 100% identity
      MITE0000043 annotation.
  - reference: https://www.uniprot.org/uniprotkb/R9USI6
    evidence_type: DATABASE_ASSERTION
    snippet: AC   R9USI6;
    retrieved_on: '2026-10-03'
    notes: Current UniProtKB:R9USI6 resolves to a 396 aa Streptomyces griseoviridis
      P450-like monooxygenase sequence that cross-references EMBL JX508597 / AGN74891.1
      and is sequence-identical to GenPept AGN74891.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AGN74891.1
    evidence_type: DATABASE_ASSERTION
    snippet: /note="SgvP"
    retrieved_on: '2026-10-03'
    notes: NCBI Protein AGN74891.1 is the 396 aa Streptomyces griseoviridis NRRL 2427
      SgvP P450-like monooxygenase translated from JX508597.1:62773..63963.
