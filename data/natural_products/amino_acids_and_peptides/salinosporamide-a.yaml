biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A4X3Q0
  enzyme_label: SalL
  reaction_id: RHEA:28110
  notes: This deliberately curates the Salinispora tropica CNB-440 SalL chlorination
    of S-adenosyl-L-methionine with chloride to 5'-chloro-5'-deoxyadenosine in the
    salinosporamide A chloroethylmalonyl-CoA precursor branch. Downstream SalT/SalN
    formation of 5-chloro-5-deoxy-D-ribose, later conversion to chloroethylmalonyl-CoA,
    and SalA/B/C assembly remain uncurated.
  evidence:
  - reference: DOI:10.1038/nchembio.2007.56
    evidence_type: PRIMARY_EXPERIMENT
    snippet: SalL, which halogenates S-adenosyl-L-methionine (2) with chloride to
      generate 5'-chloro-5'-deoxyadenosine (3) and L-methionine (4)
    notes: Eustaquio et al. genetically, biochemically, and structurally characterized
      Salinispora tropica CNB-440 SalL as the SAM-dependent chlorinase at the start
      of salinosporamide A chloroethylmalonyl-CoA precursor biosynthesis.
  - reference: DOI:10.1073/pnas.0901237106
    evidence_type: PRIMARY_EXPERIMENT
    snippet: S-adenosyl-L-methionine (SAM) is converted to 5'-chloro-5'-deoxyadenosine
      (5'-ClDA) in a reaction catalyzed by a SAM-dependent chlorinase
    notes: Eustaquio et al. placed SalL upstream of SalM, SalN, SalQ, SalS, SalT,
      and SalU in the characterized salinosporamide A chloroethylmalonyl-CoA pathway
      branch.
  - reference: https://www.uniprot.org/uniprotkb/A4X3Q0
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Reviewed UniProtKB:A4X3Q0 is Salinispora tropica CNB-440 SalL, gene salL
      and locus Strop_1026, cross-references EMBL CP000667 protein ABP53500.1, and
      annotates RHEA:28110 with ChEBI participants CHEBI:17996, CHEBI:47133, CHEBI:57844,
      and CHEBI:59789.
  - reference: https://www.ncbi.nlm.nih.gov/protein/ABP53500.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept ABP53500.1 is the Strop_1026 coding sequence from the Salinispora
      tropica CNB-440 CP000667.1 salinosporamide A cluster and is sequence-identical
      to UniProtKB:A4X3Q0.
  substrate: CHEBI:59789
  product: CHEBI:47133
- step_number: 40
  enzyme_id: UniProtKB:A4X3Q1
  enzyme_label: SalM 5-chloro-5-deoxy-D-ribose 1-dehydrogenase
  notes: SalM oxidizes 5-chloro-5-deoxy-D-ribose to 5-chloro-5-deoxy-D-ribono-gamma-lactone
    in the salinosporamide A chloroethylmalonyl-CoA branch. The intervening SalT/SalN
    conversion of 5'-chloro-5'-deoxyadenosine to 5-chloro-5-deoxy-D-ribose and later
    steps to chloroethylmalonyl-CoA remain uncurated.
  evidence:
  - reference: DOI:10.1073/pnas.0901237106
    evidence_type: PRIMARY_EXPERIMENT
    snippet: 5'-ClDA is converted to chloroethylmalonyl-CoA in a 7-step route
    notes: Eustaquio et al. characterized the Salinispora tropica CNB-440 sal cluster
      and placed SalM downstream of SalL, SalT, and SalN in the chloroethylmalonyl-CoA
      branch for salinosporamide A biosynthesis.
  - reference: DOI:10.1074/jbc.M110.153833
    evidence_type: PRIMARY_EXPERIMENT
    snippet: oxidation of 5-chloro-5-deoxy-D-ribose to 5-chloro-5-deoxy-D-ribono-γ-lactone
    notes: Kale et al. amplified S. tropica CNB-440 salM/Strop_1027, heterologously
      expressed SalM, and used real-time 13C NMR to show NAD+-dependent 5-chloro-5-deoxy-D-ribose
      oxidation to the gamma-lactone followed by spontaneous lactone hydrolysis.
  - reference: https://www.uniprot.org/uniprotkb/A4X3Q1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: UniProtKB:A4X3Q1 is the unreviewed 255 aa Salinispora tropica CNB-440 short-chain
      dehydrogenase/reductase entry for ordered locus Strop_1027 and cross-references
      EMBL CP000667 protein ABP53501.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/ABP53501.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: NCBI GenPept ABP53501.1 is the 255 aa Strop_1027 coding sequence from the
      Salinispora tropica CNB-440 CP000667.1 chromosome.
