biosynthetic_pathway:
- enzyme_id: UniProtKB:G3FIN8
  enzyme_label: UGT85K4 linamarin synthase 1
  reaction_id: RHEA:20009
  substrate: CHEBI:15348
  substrates:
  - CHEBI:15348
  - CHEBI:58885
  product: CHEBI:16441
  products:
  - CHEBI:16441
  - CHEBI:58223
  - CHEBI:15378
  notes: UGT85K4 is one of two Manihot esculenta paralogs biochemically shown to glucosylate
    acetone cyanohydrin with UDP-glucose to form linamarin. The two entries are unnumbered
    to avoid implying an order between the UGT85K4 and UGT85K5 alternatives. Seeded
    BGC0001318 is Manihot esculenta but has only placeholder genome coordinates, so
    the exact grounding used here is the JF727883 cDNA characterized by Kannangara
    et al., not a resolved MIBiG CDS.
  evidence:
  - reference: DOI:10.1111/j.1365-313X.2011.04695.x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Recombinant UGT85K4 and UGT85K5 produced in Escherichia coli were able
      to glucosylate acetone cyanohydrin
    notes: Kannangara et al. isolated full-length Manihot esculenta UGT85K4 and UGT85K5
      cDNAs, expressed both enzymes in E. coli, identified linamarin among the cyanogenic-glucoside
      products of radiolabeled UDP-glucose assays, and showed that their transcripts
      and proteins co-localize with the upstream CYP79D and CYP71E paralogs.
  - reference: https://www.uniprot.org/uniprotkb/G3FIN8
    evidence_type: DATABASE_ASSERTION
    snippet: Able to glucosylate acetone cyanohydrin and 2-hydroxy-2-methylbutyronitrile,
      forming linamarin and lotaustralin
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:G3FIN8 is the 483 aa Manihot esculenta linamarin synthase
      1, gene UGT85K4, cross-references EMBL JF727883 protein AEO45781.1, and annotates
      EC 2.4.1.63 and RHEA:20009 from PMID:21736650.
  - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: The Rhea Swiss-Prot mapping links the linamarin synthase reaction RHEA:20009
      to UniProtKB:G3FIN8 and UniProtKB:G3FIN9.
