discussions:
- discussion_id: curator-vibrioferrin-constitution
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  prompt: Does the imported BGC0000947 constitution identify the experimentally established
    vibrioferrin product?
  rationale: The stored graph has four free carboxylic acids and no ester. The 1994
    structure-elucidation abstract and the inspected 2011 metagenomic product (Figure
    1 and Figure 3/Table 1) instead support a citrate-ethanolamine ester. Agreement
    with PubChem197680 and MIBiG0947 does not resolve the biological assignment. The
    2011 E. coli expression experiment does not establish the exact alginolyticus
    product; the 2007 full text requires subscription and was not inspected. Preserve
    both existing owners and all seven LOTUS assertions pending individual source
    adjudication. Do not merge into CHEBI:84585, assign replacement stereochemistry
    or transfer organism claims automatically.
  evidence:
  - reference: PMID:22146715
    evidence_source: full_text
    explanation: 2011 metagenomic expression study, Figure 1 and Figure 3/Table 1;
      native taxa are prior-literature context, not the experimentally identified
      donor.
  - reference: https://github.com/CultureBotAI/NaturalProductMech/issues/929
    explanation: Open scientific adjudication; a visible qualification is not resolution.
  - reference: PMID:7961600
    evidence_source: abstract
    explanation: 1994 structural elucidation names the citrate ester; full text was
      not inspected.
  - reference: DOI:10.1007/s00203-007-0261-6
    evidence_source: abstract
    explanation: 2007 alginolyticus study; subscription preview only. No corrected
      per-strain structure inferred.
