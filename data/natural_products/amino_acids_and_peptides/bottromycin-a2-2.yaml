biosynthetic_pathway:
- enzyme_id: UniProtKB:K4MJZ1
  enzyme_label: botOMT
  proposed: true
  notes: BC16019 botOMT/AFV25479.1 is curated as an exact aspartate methyl ester formation
    contributor to bottromycin A2 maturation. The exact free substrate/product pair
    for this RiPP tailoring reaction is not represented in the record.
  evidence:
  - reference: DOI:10.1016/j.chembiol.2012.08.013
    evidence_type: PRIMARY_EXPERIMENT
    snippet: gene involved in aspartate methyl-ester formation
    notes: Huo et al. showed that BC16019 radical-SAM C-methyltransferase genes are
      required for bottromycin C-methylations and that a BC16019 methyltransferase
      gene is involved in aspartate methyl-ester formation; GenBank and UniProt map
      this pathway step to botOMT/AFV25479.1/UniProtKB:K4MJZ1.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000469.6/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0000469.6 names bottromycin A2 as a product of the Streptomyces
      sp. BC16019 JX235926.1 locus and records heterologous expression support for
      the cluster.
