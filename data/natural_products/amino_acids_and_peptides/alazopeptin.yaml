biosynthetic_pathway:
- step_number: 1
  enzyme_id: EC:1.14.13.248
  enzyme_label: AzpE
  reaction_id: RHEA:69008
  proposed: true
  notes: AzpE is annotated as the Streptacidiphilus griseoplanus JCM 4300 BGC0002458
    aspartate monooxygenase. The exact BCN13467.1 protein does not currently resolve
    as a UniProtKB entry, so this partial alazopeptin nitrite-supply step grounds
    the reaction class by EC and Rhea and leaves the producer protein ungrounded.
  evidence:
  - reference: DOI:10.1002/anie.202100462
    evidence_type: PRIMARY_EXPERIMENT
    snippet: gene inactivation and in vitro analysis of recombinant enzymes
    notes: Kawai et al. reported the complete Streptacidiphilus griseoplanus alazopeptin
      pathway; this curation uses the BGC0002458 ANS module that supplies nitrite
      for diazotization but leaves downstream AzpL and NRPS steps uncurated.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/LC593326.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: GenBank LC593326.1 is the Streptacidiphilus griseoplanus JCM 4300 alazopeptin
      biosynthetic gene-cluster sequence and places azpE at complement(4613..6574).
  - reference: https://www.ncbi.nlm.nih.gov/protein/BCN13467.1
    evidence_type: DATABASE_ASSERTION
    snippet: aspartate monooxygenase
    retrieved_on: '2026-09-28'
    notes: NCBI GenPept BCN13467.1 is the LC593326.1 azpE coding sequence; exact UniProtKB
      searches for BCN13467 returned no matching entry.
  - reference: RHEA:69008
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: Rhea maps EC:1.14.13.248 to L-aspartate conversion to 2-nitrobutanedioate
      and annotates ChEBI participants CHEBI:29991 and CHEBI:180682.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002458.3/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: MIBiG BGC0002458.3 records the LC593326.1 Streptacidiphilus griseoplanus
      alazopeptin locus and includes azpE in its three-gene ANS-module slice.
  substrate: CHEBI:29991
  product: CHEBI:180682
