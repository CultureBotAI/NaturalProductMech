biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A6N339
  enzyme_label: PcbAB ACV synthetase
  reaction_id: RHEA:23196
  substrates:
  - CHEBI:58672
  - CHEBI:35235
  - CHEBI:57762
  - CHEBI:30616
  - CHEBI:15377
  product: CHEBI:58572
  products:
  - CHEBI:58572
  - CHEBI:456215
  - CHEBI:33019
  - CHEBI:15378
  notes: Penicillium chrysogenum PcbAB condenses L-2-aminoadipate, L-cysteine, and
    L-valine to the ACV tripeptide. RHEA:23196 also consumes three ATP and water and
    releases three AMP, three diphosphates, and three H(+).
  evidence:
  - reference: DOI:10.1042/bj3270185
    evidence_type: PRIMARY_EXPERIMENT
    snippet: ACVS from Penicillium chrysogenum was purified to homogeneity
    notes: Thelen et al. purified Penicillium chrysogenum ACV synthetase and characterized
      ATP/PPi exchange and tripeptide-forming activity for the ACV building-block
      amino acids.
  - reference: DOI:10.1038/nbt0190-39
    evidence_type: PRIMARY_EXPERIMENT
    snippet: possessed delta-(L-alpha-amino-adipyl)-L-cysteinyl-D-valine synthetase
      (ACVS), isopenicillin N synthetase
    notes: Smith et al. heterologously expressed a Penicillium chrysogenum cosmid
      carrying the penicillin biosynthetic cluster and detected ACVS and IPNS enzyme
      activity in transformed fungal hosts.
  - reference: DOI:10.1016/j.fgb.2007.03.008
    evidence_type: PRIMARY_EXPERIMENT
    snippet: genes encoding the three penicillin biosynthetic enzymes alone are sufficient
      to restore full beta-lactam synthesis
    notes: Van den Berg et al. functionally characterized the Penicillium chrysogenum
      Wisconsin 54-1255 EF601124 penicillin cluster that carries pcbAB, pcbC, and
      penDE.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000405.5/
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG entry version 5 links BGC0000405 to the Penicillium chrysogenum EF601124.1
      NRPS cluster for ACV, isopenicillin N, and benzylpenicillin; the EF601124.1
      record contains pcbAB / ABR12615.1 annotated as ACV synthetase.
  - reference: https://www.uniprot.org/uniprotkb/A6N339
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: UniProtKB:A6N339 is the Penicillium chrysogenum pcbAB/ABR12615.1 ACV synthetase
      from EMBL EF601124 and annotates the RHEA:23196 / left-to-right RHEA:23197 ACV
      synthase reaction.
  - reference: https://www.rhea-db.org/rhea/23196
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: RHEA:23196 is the ATP-dependent condensation of L-2-aminoadipate, L-cysteine,
      and L-valine to ACV, AMP, diphosphate, and H(+).
