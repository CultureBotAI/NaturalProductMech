molecular_targets:
- target_id: CHEBI:29034
  target_label: iron(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Primary physiological ferric ion chelation via hexadentate 2-hydroxyphenyloxazoline
    + bis-hydroxamate coordination (ferriexochelin 772SM / carboxymycobactin, 1:1
    complex) secreted by Mycobacterium tuberculosis to scavenge Fe(III) from host
    transferrin and lactoferrin and transfer it to cell-wall mycobactin T.
  evidence:
  - reference: PMID:7761471
    evidence_type: PRIMARY_EXPERIMENT
    notes: Isolation and mass spectrometric characterization of extracellular ferric-binding
      exochelins (including the major serine-containing methyl ester species 772SM)
      from Mycobacterium tuberculosis.
  - reference: PMID:8666910
    evidence_type: PRIMARY_EXPERIMENT
    notes: Extracellular exochelins of Mycobacterium tuberculosis remove Fe(III) from
      human transferrin and lactoferrin and donate it to cell-wall mycobactins.
- target_id: CHEBI:84043
  target_label: gallium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Hexadentate coordination of trivalent
    gallium(3+) via the 2-hydroxyphenyloxazoline and two N6-hydroxylysine hydroxamate
    donor groups (redox-inactive trivalent Fe(III) mimic).'
  evidence:
  - reference: PMID:10992462
    evidence_type: PRIMARY_EXPERIMENT
    notes: Extracellular mycobacterial siderophores chelate trivalent Ga(III) and
      mediate gallium uptake into Mycobacterium tuberculosis.
  - reference: PMID:9831524
    evidence_type: PRIMARY_EXPERIMENT
    notes: Salicylate-derived mycobactin and extracellular carboxymycobactin/exochelin
      siderophores of Mycobacterium tuberculosis share the hexadentate phenolate-oxazoline-bishydroxamate
      trivalent metal-binding core.
