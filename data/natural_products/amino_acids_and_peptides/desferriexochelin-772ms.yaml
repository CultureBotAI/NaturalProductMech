biosynthetic_pathway:
- step_number: 1
  enzyme_label: MbtI (salicylate synthase) and MbtA (salicyl-AMP ligase)
  substrates:
  - CHEBI:17333
  products:
  - CHEBI:16914
  notes: Conversion of chorismic acid to salicylic acid by MbtI and ATP-dependent
    adenylation to salicyl-AMP by MbtA.
  evidence:
  - reference: PMID:9831524
    evidence_type: PRIMARY_EXPERIMENT
    notes: The mbtA-J gene cluster of Mycobacterium tuberculosis encodes the biosynthetic
      enzymes for salicylate-derived siderophores, including both cell-wall mycobactin
      T and extracellular carboxymycobactins/exochelins.
- step_number: 2
  enzyme_label: MbtB-MbtF (NRPS-PKS), MbtG (lysine N6-monooxygenase), and MbtK (acyltransferase)
  substrates:
  - CHEBI:16914
  - CHEBI:17115
  - CHEBI:18019
  products:
  - CHEBI:61152
  notes: Hybrid NRPS-PKS assembly of the 2-hydroxyphenyloxazoline-lysine-3-hydroxybutyrate-cyclolysine
    core from salicylic acid, L-serine, and L-lysine, followed by N6-hydroxylation
    and acylation with a methyl-esterified dicarboxylic acid chain to yield desferriexochelin
    772MS.
  evidence:
  - reference: PMID:7761471
    evidence_type: PRIMARY_EXPERIMENT
    notes: Structural characterization of Mycobacterium tuberculosis exochelin 772SM
      with a 2-hydroxyphenyloxazoline ring, two N-hydroxylysine residues, a 3-hydroxybutyrate
      linker, and a methyl-esterified dicarboxylate side chain.
  - reference: PMID:10655517
    evidence_type: PRIMARY_EXPERIMENT
    notes: Disruption of the mbt gene cluster in Mycobacterium tuberculosis abolishes
      synthesis of both cell-wall mycobactin and secreted carboxymycobactin/exochelin
      siderophores.
