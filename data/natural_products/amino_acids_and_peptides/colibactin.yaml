definition: A member of the class of 1,3-thiazoles that comprises of two units of
  2-[(2-{6-[(2S)-2-methyl-3,4-dihydro-2H-pyrrol-5-yl]-5-oxo-4-azaspiro[2.4]hept-6-en-7-yl}acetamido)methyl]-1,3-thiazole-4-carboxylic
  acid linked together via the formal condensation of the carboxy groups. It is a
  secondary metabolite produced by certain strains of bacteria found in the human
  gut such as Escherichia coli. It has the ability to bind covalently to DNA and is
  strongly associated with colorectal cancer.
