biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A891LYB2
  enzyme_label: BytO cytochrome P450
  notes: BytO installs the Tyr1-His3 biaryl crosslink in the MRYFH precursor peptide.
    Final processing from the crosslinked MRYFH precursor to mature N-acetyl-Tyr-Phe-His
    biarylitide YFH remains unassigned in this partial graph.
  evidence:
  - reference: DOI:10.1016/j.chembiol.2020.11.009
    evidence_type: PRIMARY_EXPERIMENT
    snippet: N-acetyl-Tyr-Tyr-His and N-acetyl-Tyr-Phe-His
    notes: Zdouc et al. discovered the N-acetyl-Tyr-Phe-His biarylitide YFH congener
      and linked Planomonospora five-residue bytA precursor genes with adjacent bytO
      cytochrome P450 genes to Tyr-His biaryl RiPP biosynthesis; MITE curates the
      BGC0002099 Planomonospora sp. ID107089 BytO assignment from this paper.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000174
    evidence_type: DATABASE_ASSERTION
    snippet: Modifies biarylitide YFH precursor MRYFH
    retrieved_on: '2026-10-01'
    notes: MITE0000174 is an active entry for Planomonospora sp. ID107089 BytO/A0A891LYB2,
      links GenPept QRM13816.1 and MIBiG BGC0002099, and records biaryl formation
      in the biarylitide YFH MRYFH precursor.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/MW201789.1
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="QRM13816.1"
    retrieved_on: '2026-10-01'
    notes: GenBank MW201789.1 is the Planomonospora sp. ID107089 biarylitide YFH cluster
      sequence and maps bytO to QRM13816.1.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002099.3/BGC0002099.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="QRM13816.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0002099.3 places bytO/QRM13816.1 inside the active biarylitide
      YFH cluster.
  - reference: https://www.uniprot.org/uniprotkb/A0A891LYB2
    evidence_type: DATABASE_ASSERTION
    snippet: GN=bytO
    retrieved_on: '2026-10-01'
    notes: Current unreviewed UniProtKB:A0A891LYB2 resolves as Planomonospora sp.
      BytO putative cytochrome P450, cross-references EMBL MW201789 protein QRM13816.1,
      and is sequence-identical to GenPept QRM13816.1.
