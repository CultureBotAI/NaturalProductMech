biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q6QUY8
  enzyme_label: ThpC ectoine synthase
  reaction_id: RHEA:17281
  substrate: CHEBI:58929
  product: CHEBI:58515
  proposed: true
  notes: BGC0000853 thpC encodes the exact Streptomyces anulatus/Streptomyces chrysomallus
    protein Q6QUY8; its EctC assignment and RHEA:17281 ring-closure reaction are inferred
    from the ectoine_synt domain and UniProt family annotation rather than a direct
    ThpC enzyme assay.
  evidence:
  - reference: DOI:10.1128/AEM.70.5.3130-3132.2004
    evidence_type: PRIMARY_EXPERIMENT
    snippet: The nucleotide sequence of the thp genes from S. chrysomallus (ATCC 11523)
      has been deposited
    notes: Prabhu et al. mapped the Streptomyces chrysomallus ectoine/hydroxyectoine
      thp locus and deposited GenBank AY524544; the same entry is imported by MIBiG
