grounding_notes: 'This structure matches more than one 3-star ChEBI entry: CHEBI:27592,
  CHEBI:58515. ChEBI keeps such entries separate on purpose — a compound and its zwitterion
  share an InChIKey — so the identity is not picked here. A curator decides which
  term this record is.'
