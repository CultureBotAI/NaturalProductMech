biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q6ZZI3
  enzyme_label: GtfB teicoplanin aglycone glycosyltransferase
  notes: GtfB/tcp23 transfers N-acetylglucosamine from UDP-N-acetyl-alpha-D-glucosamine
    to Hpg4 of the teicoplanin aglycone. That Hpg4 glycosylation precedes downstream
    deacetylation, acylation and tailoring toward teicoplanin A2-4, so the immediate
    pseudoaglycone product is left ungrounded.
  evidence:
  - reference: DOI:10.1099/mic.0.26507-0
    evidence_type: PRIMARY_EXPERIMENT
    snippet: tGtfB can only glycosylate the teicoplanin aglycon
    notes: Sosio et al. isolated the Actinoplanes teichomyceticus ATCC 31131 tcp cluster
      on AJ605139, assigned tcp23 as a GtfB glycosyltransferase, and characterized
      teicoplanin aglycone glycosylation in vitro.
  - reference: DOI:10.1016/s1074-5521(04)00002-x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: 4-hydroxyphenylglycine-4 (4Hpg) of the teicoplanin heptapeptide aglycone
    notes: Li et al. cloned the 89 kbp teicoplanin biosynthetic locus and heterologously
      assayed its glycosyltransferases, including the enzyme that modifies Hpg4 of
      the teicoplanin aglycone.
  - reference: DOI:10.1021/ja0735857
    evidence_type: PRIMARY_EXPERIMENT
    notes: Howard-Jones et al. kinetically analyzed the teicoplanin glycosyltransferases
      and acyltransferase, supporting ordered tailoring of the aglycone scaffold during
      mature teicoplanin reconstitution.
  - reference: https://mite.bioinformatics.nl/repository/MITE0000033
    evidence_type: DATABASE_ASSERTION
    snippet: Adds N-acetylglucosamine or N-acylglucosamine to Hpg4 of the teicoplanin
      aglycone
    retrieved_on: '2026-10-03'
    notes: MITE0000033 is active, records GtfB as a glycosyltransferase that modifies
      Hpg4 of the teicoplanin aglycone, and links GtfB to UniProtKB:Q6ZZI3, GenPept
      CAE53364.1 and MIBiG BGC0000440.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000440.5/BGC0000440.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: 'MITE0000033: Glycosylation (100% identity)'
    retrieved_on: '2026-10-03'
    notes: MIBiG BGC0000440.5 places the Actinoplanes teichomyceticus tcp23 CDS at
      AJ605139.1:60486..61712 with GenPept protein_id CAE53364.1, UniProtKB/TrEMBL
      Q6ZZI3, and a 100% identity MITE0000033 glycosylation annotation.
  - reference: https://www.uniprot.org/uniprotkb/Q6ZZI3
    evidence_type: DATABASE_ASSERTION
    snippet: AC   Q6ZZI3;
    retrieved_on: '2026-10-03'
    notes: Current UniProtKB:Q6ZZI3 resolves to a 408 aa Actinoplanes teichomyceticus
      glycosyltransferase sequence whose sequence is identical to CAE53364.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAE53364.1
    evidence_type: DATABASE_ASSERTION
    snippet: /product="GtfB protein"
    retrieved_on: '2026-10-03'
    notes: NCBI Protein CAE53364.1 is the 408 aa Actinoplanes teichomyceticus ATCC
      31131 tcp23/GtfB protein translated from AJ605139.1:60486..61712 and cross-referenced
      to UniProtKB/TrEMBL Q6ZZI3.
  - reference: CHEBI:16264
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: ChEBI:16264 is the 3-star ChEBI entry for UDP-N-acetyl-alpha-D-glucosamine,
      the UDP-amino-sugar donor used for GtfB-catalyzed N-acetylglucosamine transfer.
- step_number: 2
  enzyme_id: UniProtKB:Q6ZZJ7
  enzyme_label: GtfA teicoplanin Bht6 glycosyltransferase
  notes: GtfA/tcp8 transfers N-acetylglucosamine from UDP-N-acetyl-alpha-D-glucosamine
    to Bht6/3-Cl-6betaHty of a GtfB-primed teicoplanin pseudoaglycone. GtfA can also
    glycosylate the unmodified teicoplanin aglycone less efficiently, but Bht6 glycosylation
    is ordered here after Hpg4 glycosylation toward teicoplanin A2-4, so the immediate
    bis-glycosylated product is left ungrounded.
  evidence:
  - reference: DOI:10.1099/mic.0.26507-0
    evidence_type: PRIMARY_EXPERIMENT
    snippet: tGtfA can add a sugar residue in the presence or absence of N-acetylglucosamine
      at amino acid 4
    notes: Sosio et al. isolated the Actinoplanes teichomyceticus ATCC 31131 tcp cluster
      on AJ605139, assigned tcp8 as a GtfA glycosyltransferase, and characterized
      teicoplanin amino-sugar transfer in vitro.
  - reference: DOI:10.1016/s1074-5521(04)00002-x
    evidence_type: PRIMARY_EXPERIMENT
    snippet: 3-chloro-beta-hydroxytyrosine-6 (3-Cl-6betaHty) and 4-hydroxyphenylglycine-4
      (4Hpg)
    notes: Li et al. cloned the 89 kbp teicoplanin biosynthetic locus and heterologously
      assayed its glycosyltransferases, including the enzyme that modifies 3-Cl-6betaHty/Bht6
      of the teicoplanin aglycone.
  - reference: DOI:10.1021/ja0735857
    evidence_type: PRIMARY_EXPERIMENT
    notes: Howard-Jones et al. kinetically analyzed the teicoplanin glycosyltransferases
      and acyltransferase, supporting ordered tailoring of the aglycone scaffold during
      mature teicoplanin reconstitution.
  - reference: https://mite.bioinformatics.nl/repository/MITE0000034
    evidence_type: DATABASE_ASSERTION
    snippet: Glycosyltransferase adds N-acetylglucosamine to Bht6 of the teicoplanin
      precursor
    retrieved_on: '2026-10-03'
    notes: MITE0000034 is active, records GtfA as a glycosyltransferase that modifies
      Bht6 of the teicoplanin precursor, and links GtfA to UniProtKB:Q6ZZJ7, GenPept
      CAE53349.1 and MIBiG BGC0000440.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000440.5/BGC0000440.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: 'MITE0000034: Glycosylation (100% identity)'
    retrieved_on: '2026-10-03'
    notes: MIBiG BGC0000440.5 places the Actinoplanes teichomyceticus tcp8 CDS at
      AJ605139.1:18949..20130 with GenPept protein_id CAE53349.1, UniProtKB/TrEMBL
      Q6ZZJ7, and a 100% identity MITE0000034 glycosylation annotation.
  - reference: https://www.uniprot.org/uniprotkb/Q6ZZJ7
    evidence_type: DATABASE_ASSERTION
    snippet: AC   Q6ZZJ7;
    retrieved_on: '2026-10-03'
    notes: Current UniProtKB:Q6ZZJ7 resolves to a 393 aa Actinoplanes teichomyceticus
      GtfA sequence whose sequence is identical to CAE53349.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAE53349.1
    evidence_type: DATABASE_ASSERTION
    snippet: /product="GtfA protein"
    retrieved_on: '2026-10-03'
    notes: NCBI Protein CAE53349.1 is the 393 aa Actinoplanes teichomyceticus tcp8/GtfA
      protein translated from AJ605139.1:18949..20130 and cross-referenced to UniProtKB/TrEMBL
      Q6ZZJ7.
  - reference: CHEBI:16264
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-03'
    notes: ChEBI:16264 is the 3-star ChEBI entry for UDP-N-acetyl-alpha-D-glucosamine,
      the UDP-amino-sugar donor used for GtfA-catalyzed N-acetylglucosamine transfer.
- step_number: 3
  enzyme_id: UniProtKB:Q6ZZJ1
  enzyme_label: Orf2* teicoplanin Hpg4 N-acetylglucosaminyl deacetylase
  notes: Orf2*/tcp14 deacetylates the Hpg4 N-acetylglucosaminyl group of the teicoplanin
    pseudoaglycone, exposing the Hpg4 glucosamine for downstream N-acylation toward
    teicoplanin A2-4.
  evidence:
  - reference: DOI:10.1021/ja0644834
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Orf2* catalyze the deacetylation reaction
    notes: Ho et al. biochemically assigned Actinoplanes teichomyceticus Orf2* as
      the N-acetylglucosaminyl-teicoplanin pseudoaglycone deacetylase that prepares
      the Hpg4 sugar for downstream N-acylation.
  - reference: DOI:10.1002/cbic.200600308
    evidence_type: PRIMARY_EXPERIMENT
    notes: Truman et al. independently identified Orf2* as a teicoplanin maturation
      deacetylase and amplified the orf2* gene from the T4B2 cosmid of the cloned
      teicoplanin cluster for in vitro expression.
  - reference: DOI:10.1016/j.chembiol.2008.05.009
    evidence_type: PRIMARY_EXPERIMENT
    snippet: pseudoaglycone deacetylases from the biosynthetic pathways of teicoplanin
      and A40926
    notes: Zou et al. solved crystal structures of the Actinoplanes teichomyceticus
      teicoplanin pseudoaglycone deacetylase, supporting the Orf2*/tcp14 protein-level
      assignment.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000440.5/BGC0000440.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: /db_xref="UniProtKB/TrEMBL:Q6ZZJ1"
    retrieved_on: '2026-10-03'
    notes: MIBiG BGC0000440.5 places the Actinoplanes teichomyceticus tcp14 CDS at
      AJ605139.1:48426..49247 with GenPept protein_id CAE53355.1 and UniProtKB/TrEMBL
      Q6ZZJ1.
  - reference: https://www.uniprot.org/uniprotkb/Q6ZZJ1
    evidence_type: DATABASE_ASSERTION
    snippet: AC   Q6ZZJ1;
    retrieved_on: '2026-10-03'
    notes: Current UniProtKB:Q6ZZJ1 resolves to a 273 aa Actinoplanes teichomyceticus
      tcp14 sequence whose sequence is identical to CAE53355.1 and whose PDB mappings
      cover Orf2* deacetylase structures.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAE53355.1
    evidence_type: DATABASE_ASSERTION
    snippet: /gene="tcp14"
    retrieved_on: '2026-10-03'
    notes: NCBI Protein CAE53355.1 is the 273 aa Actinoplanes teichomyceticus ATCC
      31131 tcp14 protein translated from AJ605139.1:48426..49247 and cross-referenced
      to UniProtKB/TrEMBL Q6ZZJ1.
- step_number: 4
  enzyme_id: UniProtKB:Q70AY4
  enzyme_label: Tcp24 teicoplanin Hpg4 N-acyltransferase
  notes: Tcp24/tAtf transfers a fatty acyl group from an acyl-CoA donor to the Orf2*-exposed
    Hpg4 glucosamine of the teicoplanin pseudoaglycone. The immediate N-acylated bis-glycosylated
    product is left ungrounded because the record-specific A2 lipid donor is not grounded
    here.
  evidence:
  - reference: DOI:10.1016/s1074-5521(04)00002-x
    evidence_type: PRIMARY_EXPERIMENT
    notes: Li et al. cloned the 89 kbp teicoplanin biosynthetic locus and heterologously
      assayed the key tAtf acyltransferase that acylates the Hpg4 glucosaminyl group.
  - reference: DOI:10.1016/j.chembiol.2004.12.005
    evidence_type: PRIMARY_EXPERIMENT
    snippet: responsible for N-acylation of the glucosamine moiety
    notes: Kruger et al. evaluated purified teicoplanin acyltransferase tAtf with
      glycopeptide scaffolds and acyl-CoA donors, supporting direct Tcp24/tAtf N-acyl
      transfer.
  - reference: DOI:10.1021/ja0735857
    evidence_type: PRIMARY_EXPERIMENT
    notes: Howard-Jones et al. kinetically showed that tAtf strongly prefers aglycone-tethered
      4-(2-aminoglucosyl)-teicoplanin over free UDP-2-aminoglucose for N-acylation.
  - reference: https://mite.bioinformatics.nl/repository/MITE0000035
    evidence_type: DATABASE_ASSERTION
    snippet: The highest catalytic efficiency of the enzyme is achieved with the glucosaminyl-teicoplanin
      pseudoaglycone as substrate.
    retrieved_on: '2026-10-03'
    notes: MITE0000035 is active and links Tcp24/tAtf to UniProtKB:Q70AY4, GenPept
      CAE53365.1 and MIBiG BGC0000440. The entry also includes Orf2* deacetylation
      reactions merged from retired MITE0000036, so only its acylation reaction is
      used for Tcp24/tAtf.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000440.5/BGC0000440.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: 'MITE0000035: Acylation, Hydrolysis (100% identity)'
    retrieved_on: '2026-10-03'
    notes: MIBiG BGC0000440.5 places the Actinoplanes teichomyceticus tcp24 CDS at
      AJ605139.1:61858..62829 with GenPept protein_id CAE53365.1, UniProtKB/TrEMBL
      Q70AY4, and a 100% identity MITE0000035 annotation.
  - reference: https://www.uniprot.org/uniprotkb/Q70AY4
    evidence_type: DATABASE_ASSERTION
    snippet: AC   Q70AY4;
    retrieved_on: '2026-10-03'
    notes: Current UniProtKB:Q70AY4 resolves to a 323 aa Actinoplanes teichomyceticus
      tcp24 sequence whose sequence is identical to CAE53365.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAE53365.1
    evidence_type: DATABASE_ASSERTION
    snippet: /gene="tcp24"
    retrieved_on: '2026-10-03'
    notes: NCBI Protein CAE53365.1 is the 323 aa Actinoplanes teichomyceticus ATCC
      31131 tcp24 protein translated from AJ605139.1:61858..62829 and cross-referenced
      to UniProtKB/TrEMBL Q70AY4.
