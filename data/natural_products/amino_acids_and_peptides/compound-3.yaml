  posed_by: codex
  rationale: 'PMID:31081214 Results and Figure 2B propose compound 3 as a di-N-hydroxylated
    cyclodileucine intermediate or shunt product. High-resolution mass spectrometry
    and isotope feeding support C12H22N2O4 and two leucine-derived carbon backbones
    (supplementary Figure S4), not a definitive assignment of all bond positions or
    stereochemistry. The imported molecular graph is retained as that proposal; stereo_complete:
    false alone does not express the constitutional uncertainty.'
