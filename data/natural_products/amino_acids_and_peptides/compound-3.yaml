  - reference: PMID:31081214
    evidence_source: full_text
    notes: Curator interpretation of DOI:10.1111/mmi.14272; compound-analysis Results,
      Figure 2B and supplementary Figure S4. This qualification neither establishes
      a replacement structure nor assigns the whole-cell antifungal observations to
      purified compound 3.
  notes: 'Source qualification added for issue #914. Experimental identity remains
    unresolved.'
