biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A891LWT6
  enzyme_label: BytO cytochrome P450
  notes: BytO installs the Tyr1-His3 biaryl crosslink in the MRYYH precursor peptide.
    Final processing from the crosslinked MRYYH precursor to mature N-acetyl-Tyr-Tyr-His
    biarylitide YYH remains unassigned in this partial graph.
  evidence:
  - reference: DOI:10.1016/j.chembiol.2020.11.009
    evidence_type: PRIMARY_EXPERIMENT
    snippet: the bytAO segment was sufficient to direct production of the crosslinked
      N-acetylated Tyr-Tyr-His tripeptide
    notes: Zdouc et al. linked Planomonospora sp. ID82291 bytA/bytO to biarylitide
      YYH biosynthesis by heterologous production in Streptomyces; the paper describes
      bytO as the cytochrome P450 expected to install the Tyr-His biaryl crosslink.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000175
    evidence_type: DATABASE_ASSERTION
    snippet: Biaryl formation between Y1 and H3
    retrieved_on: '2026-10-01'
    notes: MITE0000175 is an active entry for Planomonospora sp. ID82291 BytO/A0A891LWT6,
      links GenPept QRM13814.1 and MIBiG BGC0002084, and records biaryl formation
      in the biarylitide YYH MRYYH precursor.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/MW201788.1
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="QRM13814.1"
    retrieved_on: '2026-10-01'
    notes: GenBank MW201788.1 is the Planomonospora sp. ID82291 biarylitide YYH cluster
      sequence and maps bytO to QRM13814.1.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002084.4/BGC0002084.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="QRM13814.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0002084.4 places bytO/QRM13814.1 inside the active biarylitide
      YYH cluster.
  - reference: https://www.uniprot.org/uniprotkb/A0A891LWT6
    evidence_type: DATABASE_ASSERTION
    snippet: GN=bytO
    retrieved_on: '2026-10-01'
    notes: Current unreviewed UniProtKB:A0A891LWT6 resolves as Planomonospora sp.
      BytO putative cytochrome P450, cross-references EMBL MW201788 protein QRM13814.1,
      and is sequence-identical to GenPept QRM13814.1.
