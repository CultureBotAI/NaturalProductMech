biosynthetic_pathway:
- enzyme_id: UniProtKB:Q6E7K9
  enzyme_label: JamA starter-acid activating/loading ligase (UniProt annotation)
  proposed: true
  notes: Database-described activation of 5-hexenoic acid and loading onto the distinct
    JamC carrier to form 5-hexenoyl-JamC. JamC is not an enzyme step. This partial
    starter-unit mechanism is a UniProt database assertion; its contribution to the
    exact jamaicamide C owner is a curator inference, not an independently inspected
    compound-specific experiment. Unlike jamaicamide A and B, jamaicamide C retains
    the terminal alkene compatible with elongation from 5-hexenoyl-JamC without JamB
    acetylenation. Carrier-bound intermediates remain ungrounded and distinct from
    free acids and the final owner.
  evidence:
  - reference: https://www.uniprot.org/uniprotkb/Q6E7K9/entry
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    snippet: the loading of the activated 5-hexenoic acid onto the acyl carrier protein
      JamC
    notes: Reviewed UniProtKB Q6E7K9, entry 64/sequence 1, annotation 2026-09-02.
      UniProt assigns JamA activation of the free 5-hexenoic-acid starter followed
      by loading onto JamC. This is a ligase assignment, not a claim that JamA alone
      synthesizes the final natural product. The cited primary papers DOI:10.1016/j.chembiol.2004.03.030
      and DOI:10.1038/nchembio.1718 were not inspected; database experimental evidence
      codes are not promoted to newly verified primary experiments.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AY522504.1
    evidence_type: CURATOR_INFERENCE
    retrieved_on: '2026-10-08'
    notes: 'Native-reference audit for jamA: AY522504.1 is the 69,900-nt JHB cluster
      reference named by BGC0001001. Complete plus-strand CDS 6630..8408 (1-based
      inclusive), codon_start 1/table 11, translates exactly to the 592-aa GenBank
      CDS annotation AAS98774.1 and UniProtKB:Q6E7K9. UniProt explicitly cross-references
      AY522504/AAS98774.1 and the JHB nucleotide report. This is not an independently
      downloaded GenPept comparison or proof of historical assay-stock/construct identity,
      function, chemical incorporation or native production.'
  - reference: https://www.uniprot.org/uniprotkb/Q6E7K7/entry
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    snippet: Accepts as substrate the activated form of 5-hexenoic acid from JamA
    notes: Reviewed UniProtKB Q6E7K7, entry 75/sequence 1, annotation 2026-09-02.
