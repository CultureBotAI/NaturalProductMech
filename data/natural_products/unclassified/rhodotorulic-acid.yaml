molecular_targets:
- target_id: CHEBI:29034
  target_label: iron(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Tetradentate dihydroxamate coordination of ferric iron(3+); because each
    rhodotorulic acid ligand provides only two hydroxamate donor groups (4 oxygen
    atoms), it forms a binuclear 3:2 ligand:metal complex Fe2(RA)3 at neutral pH (log
    beta230 = 62.2) that mediates ferric ion delivery to the cell surface in Rhodotorula.
  evidence:
  - reference: PMID:4971459
    evidence_type: PRIMARY_EXPERIMENT
    notes: Isolation, structural elucidation, and ferric complex stoichiometry (Fe2L3)
      of rhodotorulic acid from iron-deficient Rhodotorula pilimanae.
  - reference: PMID:30750
    evidence_type: PRIMARY_EXPERIMENT
    notes: Coordination chemistry and 55Fe uptake kinetics of ferric rhodotorulate
      in Rhodotorula pilimanae.
  - reference: PMID:11151360
    evidence_type: PRIMARY_EXPERIMENT
    notes: Spectrophotometric and stopped-flow kinetic characterization of proton-driven
      Fe(III) dissociation from the binuclear Fe2(rhodotorulate)3 complex in aqueous
      solution.
- target_id: CHEBI:84043
  target_label: gallium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Coordination of trivalent gallium(3+)
    in aqueous solution; excess Ga(III) quantitatively and rapidly displaces Fe(III)
    from ferric rhodotorulic acid under reducing conditions (with maximal exchange
    rate at pH 6.5).'
  evidence:
  - reference: PMID:2945591
    evidence_type: PRIMARY_EXPERIMENT
    notes: Spectroscopic kinetic demonstration of quantitative reductive displacement
      of Fe(III) by Ga(III) in ferric rhodotorulic acid.
- target_id: CHEBI:49470
  target_label: aluminium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Chelation of trivalent aluminium(3+)
    in vitro; rhodotorulic acid significantly solubilizes aluminium from insoluble
    aluminium borate and mobilizes Al(III) from human plasma transferrin.'
  evidence:
  - reference: PMID:2019981
    evidence_type: PRIMARY_EXPERIMENT
    notes: In vitro evaluation of rhodotorulic acid for aluminium(3+) solubilization,
      mobilization from transferrin, and octanol/aqueous complex partitioning.
- target_id: CHEBI:49544
  target_label: chromium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Kinetically inert octahedral coordination
    of chromium(3+) in the binuclear complex Cr2(rhodotorulate)3 (resolved into delta-cis,
    delta-trans, and lambda-trans isomers) used to probe stereospecific cell-surface
    recognition in Rhodotorula pilimanae.'
  evidence:
  - reference: PMID:30750
    evidence_type: PRIMARY_EXPERIMENT
    notes: Synthesis and transport study of kinetically inert chromic-substituted
      rhodotorulic acid complexes in Rhodotorula pilimanae.
  - reference: PMID:4055766
    evidence_type: PRIMARY_EXPERIMENT
    notes: Separation and visible/circular dichroism spectroscopic characterization
      of geometric and optical isomers of chromic rhodotorulate Cr2(RA)3.
