biosynthetic_pathway:
- step_number: 1
  enzyme_label: L-ornithine N5-monooxygenase
  substrates:
  - CHEBI:15729
  products:
  - CHEBI:79095
  notes: N5-hydroxylation of L-ornithine to generate N(5)-hydroxy-L-ornithine.
  evidence:
  - reference: PMID:4971459
    evidence_type: PRIMARY_EXPERIMENT
    notes: Rhodotorulic acid is biosynthesized from L-ornithine via N(5)-hydroxy-L-ornithine.
- step_number: 2
  enzyme_label: N5-hydroxyornithine N5-acetyltransferase and rhodotorulic acid nonribosomal
    peptide synthetase (diketopiperazine cyclase)
  substrates:
  - CHEBI:79095
  - CHEBI:15351
  - CHEBI:15422
  products:
  - CHEBI:84731
  notes: Acetyl-CoA-dependent N5-acetylation of N(5)-hydroxy-L-ornithine followed
    by ATP-dependent NRPS activation and head-to-tail cyclodimerization of two N5-acetyl-N5-hydroxy-L-ornithine
    units to form the 2,5-diketopiperazine dihydroxamate siderophore rhodotorulic
    acid.
  evidence:
  - reference: PMID:4971459
    evidence_type: PRIMARY_EXPERIMENT
    notes: Structure elucidation of rhodotorulic acid as the diketopiperazine dimer
      of delta-N-acetyl-L-delta-N-hydroxyornithine.
  - reference: PMID:14531617
    evidence_type: PRIMARY_EXPERIMENT
    notes: Characterization of iron-regulated rhodotorulic acid production in Rhodotorula
      mucilaginosa.
