biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A6G7BMN0
  enzyme_label: EpyD
  proposed: true
  notes: This curates Mycetohabitans rhizoxinica HKI454 MN081797.1 epyD/endopyrrole
    NRPS A as a proposed protein contributor to endopyrrole A nonribosomal-peptide
    assembly. The epy cluster is characterized for endopyrrole A production, but individual
    EpyD module substrates and products are left unexpanded.
  evidence:
  - reference: DOI:10.1021/ACSCHEMBIO.9B00406
    evidence_type: PRIMARY_EXPERIMENT
    notes: Niehs et al. characterized the Mycetohabitans rhizoxinica HKI454 epy NRPS
      cluster as an endopyrrole biosynthetic gene cluster; this pathway step uses
      GenBank and UniProt records from that study to ground the EpyD sequence.
  - reference: https://www.uniprot.org/uniprotkb/A0A6G7BMN0
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:A0A6G7BMN0 is Mycetohabitans rhizoxinica epyD/RBRH_RS08105,
      is named endopyrrole NRPS A, and cross-references EMBL MN081797 protein QIH29228.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/QIH29228.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: endopyrrole NRPS A
    notes: NCBI GenPept QIH29228.1 is the 5199 aa epyD CDS on MN081797.1:6321..21920
      from Mycetohabitans rhizoxinica HKI454 and matches UniProtKB:A0A6G7BMN0.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/MN081797.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Mycetohabitans rhizoxinica strain HKI454 endopyrrole gene cluster
    notes: GenBank MN081797.1 is the 40,068 bp HKI454 endopyrrole gene cluster complete
      sequence and carries epyD/RBRH_RS08105 as protein QIH29228.1.
