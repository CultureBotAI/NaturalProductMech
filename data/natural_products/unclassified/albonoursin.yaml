biosynthetic_pathway:
- step_number: 1
  enzyme_label: AlbAB cyclodipeptide oxidase
  reaction_id: RHEA:35531
  substrate: CHEBI:71608
  product: CHEBI:71609
  notes: AlbAB catalyzes two sequential alpha,beta-dehydrogenations of cyclo(L-phenylalanyl-L-leucyl)
    with O2 as the electron acceptor to form albonoursin and H2O2. This partial Streptomyces
    noursei ATCC 11455 pathway records the characterized CDO tailoring step and leaves
    AlbC-dependent cyclodipeptide precursor formation unexpanded.
  evidence:
  - reference: DOI:10.1038/s41467-024-48030-9
    evidence_type: PRIMARY_EXPERIMENT
    snippet: AlbAB showed substrate dependent enzymatic activity
    notes: Andreas and Giessen heterologously expressed Streptomyces noursei AlbAB,
      purified the AlbA/AlbB filament, measured activity toward cyclo(L-Phe-L-Leu),
      and determined the AlbAB cryo-EM structure deposited as PDB:8UC3.
  - reference: DOI:10.1016/S1074-5521(02)00285-5
    evidence_type: PRIMARY_EXPERIMENT
    snippet: albA and albB, necessary for CDO activity
    notes: Lautru et al. used purified cyclic-dipeptide oxidase peptide sequence information
      to clone the Streptomyces noursei albonoursin cluster, showed that the 3.8 kb
      fragment directs albonoursin biosynthesis in Streptomyces lividans, and demonstrated
      that albA and albB are both required for CDO activity.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000193
    evidence_type: DATABASE_ASSERTION
    snippet: Dehydrogenates cyclo(L-Phe-L-Leu)
    retrieved_on: '2026-10-01'
    notes: MITE0000193 annotates Streptomyces noursei AlbA/Q8GED9 as an active cyclic
      dipeptide oxidase entry, links GenPept AAN07907.1 and MIBiG BGC0000851, and
      maps the albonoursin dehydrogenation to RHEA:35531.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AY129235.1
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="AAN07907.1"
    retrieved_on: '2026-10-01'
    notes: GenBank AY129235.1 maps Streptomyces noursei ATCC 11455 albA to the 711..1370
      CDS and assigns protein_id AAN07907.1.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AY129235.1
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="AAN07908.1"
    retrieved_on: '2026-10-01'
    notes: GenBank AY129235.1 maps Streptomyces noursei ATCC 11455 albB to the overlapping
      1330..1647 CDS, annotates it as required for AlbA activity, and assigns protein_id
      AAN07908.1.
  - reference: https://www.uniprot.org/uniprotkb/Q8GED9
    evidence_type: DATABASE_ASSERTION
    snippet: GN=albA
    retrieved_on: '2026-10-01'
    notes: Current Swiss-Prot UniProtKB:Q8GED9 resolves as the 219 aa Streptomyces
      noursei albonoursin synthase AlbA and cross-references EMBL AY129235 protein
      AAN07907.1.
  - reference: https://www.uniprot.org/uniprotkb/Q8GED8
