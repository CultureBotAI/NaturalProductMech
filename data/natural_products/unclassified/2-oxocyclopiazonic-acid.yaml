biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:C9K202
  enzyme_label: CpaH cytochrome P450 monooxygenase
  substrate: CHEBI:22450
  product: naturalproductmech:mibig-5209b855e4
  notes: CpaH mediates the terminal conversion of Aspergillus oryzae cyclopiazonic
    acid into 2-oxocyclopiazonic acid. CHEBI:22450 is the exact local grounding for
    the BGC0000977 cyclopiazonic acid substrate structure; its ChEBI preferred label
    differs from MIBiG's cyclopiazonic acid label.
  evidence:
  - reference: DOI:10.1002/cbic.201000672
    evidence_type: PRIMARY_EXPERIMENT
    snippet: cpaH-mediates the conversion of CPA into the less toxic 2-oxocyclopiazonic
      acid
    notes: Kato et al. used targeted gene inactivation in Aspergillus oryzae, isolated
      the corresponding metabolite, and assigned CpaH to the terminal conversion of
      cyclopiazonic acid into 2-oxocyclopiazonic acid.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000977.4/
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: MIBiG BGC0000977.4 records Aspergillus oryzae AB506492.1 as the cyclopiazonic
      acid / 2-oxocyclopiazonic acid BGC and cites DOI:10.1002/cbic.201000672 as compound
      evidence.
  - reference: https://www.uniprot.org/uniprotkb/C9K202
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: UniProtKB reviewed entry C9K202 resolves to the 509 aa Aspergillus oryzae
      CpaH cytochrome P450 monooxygenase, maps AB506492 to protein BAK26559.1, and
      annotates the CpaH function and disruption phenotype from PMID:21608094.
