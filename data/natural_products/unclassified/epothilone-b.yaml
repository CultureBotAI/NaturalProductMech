  scope: BIOSYNTHESIS
  description: Six source-annotated SMP44 assembly proteins, mapped to complete native
    AF217189.1 CDS sequences. Five PKS references and one NRPS reference contribute
    to an epothilone assembly process, without an inferred protein-to-protein reaction
    chain. The named epothilone B association is supported by the abstract-level whole-cluster
    result and a separately verified MIBiG structure link. Source-annotated assembly
    participation, not independently assayed catalysis. No direct protein-to-final-product
    reaction, exact intermediate, stoichiometry, substrate specificity, physical complex
    or complete reaction order is asserted. GROUNDED denotes identifier identity,
    not experimental validation. SMP44 references are not interchangeable with So0157-2
    proteins, whose epo gene names differ.
