      with So0157-2 proteins, whose epo gene names differ.
    evidence:
    - reference: DOI:10.1126/science.287.5453.640
      evidence_type: PRIMARY_EXPERIMENT
      retrieved_on: '2026-10-10'
      notes: Only the PubMed abstract was inspected. It reports coexpression of the
        epothilone cluster genes in Streptomyces coelicolor and production of both
        A and B. This is a whole-system result, not an independent assay of each EpoA-F
        protein or proof that these six proteins alone make B. Full text returned
        HTTP 403; constructs, figures, methods and supplements were not inspected.
      snippet: Concomitant expression of these genes in the actinomycete Streptomyces
        coelicolor produced epothilones A and B.
