definition: A member of the class of pyrazinones that is pyrazin-2(1H)-one substituted
  by an isopropyl and benzyl groups at position 3 and 6, respectively. It is a natural
  product found in Staphylococcus aureus that inhibits calpain in a casein hydrolysis
  assay (IC50 = 1.3 μM), contributes to S. aureus infection in mice, and alters human
  keratinocyte gene expression.
