  description: Five versioned native protein references are linked by explicitly inferred
    CDS-to-insert mappings to the reported pSET-cbxABCDE construct. Separate primary
    experimental edges describe caboxamycin production in S. albus J1074 and B29.
    The five complete native CDSs do not establish one-to-one cbx aliases, individual
    enzyme reactions or a physical protein complex; 15 nt of the next CDS is not a
    sixth intact protein. The authors report PCR sequence checking, but the exact
    assayed insert sequence was not independently inspected. The product endpoint
    is acid caboxamycin (compound 1), not its methyl ester or other derivatives. Native
    producer/BGC evidence grades and the natural-origin classification are unchanged.
discussions:
- discussion_id: curator-caboxamycin-cassette-and-protein-scope
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  posed_date: '2026-10-11'
  attaches_to:
  - causal_graphs#caboxamycin-cassette-production
  prompt: Can the cbxA-E aliases and assayed construct be tied directly to exact native
    protein versions, and which individual catalytic or genetic effects are established?
  rationale: Primer mapping identifies five complete native CDSs, but is not direct
    evidence of the assayed insert sequence or each protein function. Whole-cassette
    production in J1074 and B29 cannot identify individual necessities or host compensating
    proteins. Legacy product annotations must not be substituted for substrate-specific
    assays.
  evidence:
  - reference: DOI:10.1186/s12934-017-0709-6
    supports: PARTIAL
    evidence_source: Inspected 2017 primary study
    explanation: Methods supply cassette primers and report PCR sequence checking.
      Results and Figure 2 report acid caboxamycin in both hosts. The assayed construct
      sequence and individual native protein aliases are not directly grounded by
      the inspected text.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/JJOB01000001.1
    supports: PARTIAL
    evidence_source: Native NTK937 sequence deposit
    explanation: Exact primer mapping and independent GenPept checks identify five
      complete native CDSs plus a 15-nt overlap into the next CDS. Upstream DT87_23835
      is annotated as disrupted and is not adopted as an intact CbxR protein.
  notes: The original cluster study DOI:10.1111/1751-7915.12716 and official MIBiG
    BGC0001444 gene-level entry remain uninspected under prior access stops; no alternate
    retrieval was used. Earlier knockout/essentiality claims cited in the 2017 Background
    are not adopted as this study's experiments. Exact-strain UniProt probes for cbxA
    and DT87_23840 returned no result; changed-gene/taxon suggestions were rejected.
    No global UniProt absence is claimed, and exact versioned GenPept references are
    used. Unidentified host compensators, an unspecified O-methyltransferase, native
    CbxR and derivatives 2-19 require separate evidence and chemical contexts. Keep
    SEEDED status and all source-owned chemistry, occurrences, producer and cluster
    grades.
