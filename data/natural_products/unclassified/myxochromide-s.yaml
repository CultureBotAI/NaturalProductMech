biosynthetic_pathway:
- step_number: 1
  enzyme_label: MchA polyketide synthase
  proposed: true
  notes: MIBiG assigns AJ698723.2 CAG28678.1/mchA to the iterative type I PKS module
    that contributes the polyketide portion of the myxochromide S1 scaffold. The exact
    isolated substrate and product are not resolved, and no current exact UniProtKB
    entry was found for CAG28678.1 or the deleted historical Q50JA4 cross-reference.
  evidence:
  - reference: DOI:10.1002/cbic.200400282
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Structure and biosynthesis of myxochromides S1-3 in Stigmatella aurantiaca
    notes: Wenzel et al. cloned and sequenced the Stigmatella aurantiaca AJ698723.2
      locus that encodes MchA, MchB, and MchC and linked the locus to myxochromide
      S1-3 biosynthesis by gene inactivation.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001023.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: Scaffold biosynthesis
    notes: MIBiG BGC0001023.5 lists myxochromide S1 as the Stigmatella aurantiaca
      product, reports AJ698723.2 as the locus, and annotates CAG28678.1/mchA, CAG29031.1/mchB,
      and CAG29032.1/mchC as scaffold-biosynthesis genes.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAG28678.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: polyketide synthase
    notes: NCBI Protein CAG28678.1 is the 2166 aa AJ698723.2 mchA coding sequence.
      Its historical UniProtKB/TrEMBL Q50JA4 cross-reference now resolves as a deleted
      UniProtKB entry.
- step_number: 2
  enzyme_label: MchB nonribosomal peptide synthetase
  proposed: true
  notes: MIBiG assigns AJ698723.2 CAG29031.1/mchB to the NRPS modules that incorporate
    the threonine and leucine portions inferred for myxochromide S1 scaffold biosynthesis.
