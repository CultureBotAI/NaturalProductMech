      evidence_type: CURATOR_INFERENCE
      notes: Figures 3-4 and associated Results.
  - subject: plat2
    predicate: is_proposed_to_catalyze
    object: cyclization
    notes: Cassette omission and product structures support epoxide-initiated cyclization
      to the anti/anti/syn core with the observed C-3 hydroxyl orientation. The study
      does not provide isolated-enzyme kinetics or establish the complete absolute
      configuration of products 1/2.
    evidence:
