    notes: The revised model places terminal epoxidation after prenylation. No purified
      PlaT1 turnover or isolated epoxy intermediate is shown. Oxidized 3-10 can also
      appear without plaT1, with strong host-specific differences; their oxidation
      must not all be assigned to PlaT1.
    evidence:
