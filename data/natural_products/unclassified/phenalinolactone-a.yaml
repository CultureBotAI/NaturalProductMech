    predicate: abolishes_detectable
    object: production
    notes: HPLC/ESI-MS screening found no wild-type phenalinolactones in mutant extracts.
      Detection at 235 nm revealed different metabolites that were poorly represented
      by the 280-nm trace; the mutation does not abolish all secondary metabolism.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
