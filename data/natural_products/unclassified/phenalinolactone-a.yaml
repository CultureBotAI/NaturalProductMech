  edges:
  - subject: mutation
    predicate: inactivates_encoding_gene_of
    object: plam1
    notes: 'The double-crossover K1/1 mutant carries a 414-bp internal PstI deletion,
      not whole-gene removal; colony PCR and loss of apramycin resistance support
      allelic replacement. Native PstI sites are 414 bp apart, consistent with the
      reported in-frame deletion. The single-crossover SCplaM1 phenotype has possible
      polar effects and is not attributed to PlaM1 alone. Curator sequence comparison:
      Appendix printed page 126 has C at genomic position 13742 versus T in DQ230532.1;
      the terminal Arg codon is CGG versus CGA. The substitution is synonymous, not
      byte-identical DNA. GenPept, native GenBank, MIBiG and translated thesis target
      proteins agree. No UniProt mapping was verified after service failures; no homolog
      was substituted.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.4.1.1, 5.9.2 and 5.12.3; printed pages 41-42, 110, 113; Figure
        24.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ABB69739.1
      evidence_type: DATABASE_ASSERTION
      notes: 303 aa; DQ230532.1 complement(13739..14650). GenPept identifies the named
        native protein from taxon 355249.
      retrieved_on: '2026-10-03'
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: CURATOR_INFERENCE
      notes: Curator comparison of the thesis sequence appendix with DQ230532.1 and
        matching GenPept/MIBiG translations; protein-level versus nucleotide agreement
        is distinguished in the edge notes.
  - subject: mutation
    predicate: disrupts_normal
    object: production
    notes: HPLC/ESI-MS of mutant culture extracts showed a changed profile dominated
      by PL CD1 instead of parental phenalinolactones A and D. This is not loss of
      all natural-product production or a quantitative detection limit.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.4.1.2 and 3.4.1.5; printed pages 43-44, 46-49; Table 3, Figures
        25-28.
  - subject: mutation
    predicate: causes_accumulation_of
    object: products
    notes: PL CD1 gave m/z 684 [M-H]- and was identified by comparative NMR as 4''-O-demethylphenalinolactone
      D, not phenalinolactone A. Missing sugar methoxy signals and shifted sugar C-4/H-4
      signals locate demethylation. Other congeners include PL CD2 and PL X3/X4; the
      minor proposed demethylated A analog PL X5 was assigned from MS, not complete
      NMR.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.4.1.2 and 3.4.1.5; printed pages 43-44, 46-49; Table 3, Figures
        25-28.
  - subject: rescue
    predicate: supplies_wild_type_encoding_gene_for
    object: plam1
    notes: pSET-plaM1 places a genomic fragment behind ermE* in a pSET152-derived
      vector. The 22c_F/22c_R primer changes map outside the PlaM1 CDS, but the fragment
      includes partial plaA4/plaP6 sequence; it is not an isolated-CDS or purified-protein
      experiment. Methods differ in naming cosmid 1O12 versus 4D08; exact clone provenance
      is not resolved here.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 5.11.2 and 5.12.3.2; printed pages 111, 113.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/DQ230532.1
      evidence_type: DATABASE_ASSERTION
      notes: DQ230532.1 provides the native target CDS and neighboring gene coordinates.
      retrieved_on: '2026-10-03'
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: CURATOR_INFERENCE
      notes: 'Curator alignment of section 5.12 rescue primers to DQ230532.1: introduced
        changes fall outside the target CDS, and the amplicon also contains partial
        neighboring genes. This is a sequence comparison, not a separately sequenced
        rescue-plasmid deposition.'
  - subject: rescue
    predicate: restores_detectable
    object: production
    notes: All six tested complemented-conjugant cultures recovered the wild-type
      metabolite profile by HPLC/ESI-MS. This supports the genetic assignment but
      does not measure PlaM1 turnover or prove an isolated protein is sufficient.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.4.1.3; printed page 45.
      snippet: die Komplementierung war also erfolgreich.
  - subject: plam1
    predicate: is_proposed_to_catalyze
    object: function
    notes: The demethylated glycoside, rescue and whole-cell feeding evidence support
      assignment of PlaM1 to late sugar methylation, including proposed PL CD1-to-phenalinolactone
      D conversion. This thesis does not demonstrate that conversion with purified
      PlaM1, establish a methyl donor experimentally, or show direct PL CD1-to-A turnover
      by PlaM1.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: CURATOR_INFERENCE
      notes: Sections 3.4.1.5, 3.4.1.7, 3.4.3.6 and 4.3(E); printed pages 49-50, 63-64,
        84.
