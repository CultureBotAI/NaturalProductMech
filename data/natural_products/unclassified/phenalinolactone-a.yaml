    predicate: causes_accumulation_of
    object: products
    notes: Negative ions were m/z 373 and 371 [M-H]-. HR-ESI-MS and NMR identified
      the C23 terpene PL CD6 with a beta,gamma-unsaturated alpha-ketoacid side chain
      at C-14, without the gamma-butyrolactone; CD7 has a C-3 ketone instead of the
      CD6 alcohol. Table 7 formulas denote deprotonated ions, not neutral molecular
      formulas. These products are not phenalinolactone A.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
