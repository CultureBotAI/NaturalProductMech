    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.4.3.3; printed page 60.
      snippet: die Produktion der Wildtypderivate
  - subject: plao1
    predicate: is_proposed_to_catalyze
    object: function
    notes: The blocked mutant and precursor structures support participation in lactone
      biosynthesis. This thesis proposes C-16 hydroxylation and subsequent rearrangement
      from genetic and isotope evidence, not purified PlaO1 turnover. The graph does
      not assert the proposed cyclopropanone intermediate, enzyme-specific ring closure,
      a measured cofactor requirement, or a proven reaction sequence.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: CURATOR_INFERENCE
      notes: Sections 3.4.3.4-3.4.3.5 and 4.3(B,D); printed pages 61-63, 77-78, 81-83.
  - subject: feeding
    predicate: restores_detectable
    object: production
    notes: Adding 1 mg PL CD1 to 20 ml mutant culture after 28 h of growth yielded
      A, D and their methylated A-2/D-2 derivatives after 63 h of feeding, along with
      CD1-2. This whole-cell bypass supports biosynthetic competence of PL CD1; it
      is neither PlaO1 turnover nor isolated PlaM1 activity. Methods specify a medium-only
      feeding control, without reporting its outcome here as a separate negative result.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.4.3.6 and Figure 39, printed pages 63-64; feeding methods section
        5.6.3, printed page 99.
