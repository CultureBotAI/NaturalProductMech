    predicate: produces_detectable
    object: cyclic
    notes: 'S. albus produced 1 and 2; S. venezuelae produced only 1. Isolated S.
      albus products were characterized by HRMS and NMR: 1 has a C-3 ketone, 2 a C-3
      hydroxyl. Both have an amino-acid tail and lack the CD6/CD7 C-15/C-16 olefin.
      They are neither CD6/CD7 nor mature phenalinolactone A. C-17 absolute configuration
      remains unresolved; host amination and 2-to-1 oxidation were not directly established.'
    evidence:
    - reference: DOI:10.1039/D4CB00138A
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 2; SI pages 4-6, Tables S4-S5 and Figures S3-S15.
      snippet: only 1 was produced
