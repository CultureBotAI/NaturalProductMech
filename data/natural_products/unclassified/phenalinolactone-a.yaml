  edges:
  - subject: mutation
    predicate: inactivates_encoding_gene_of
    object: plao4
    notes: 'Double-crossover 42.A.35 was selected by loss of apramycin resistance
      and confirmed by colony PCR. The thesis reports an 880-bp RsrII frameshifting
      deletion, not whole-gene removal. The two native DQ230532.1 RsrII sites are
      884 bp apart; exact mutant-junction sequence is not verified. A short-only PCR
      product in the preceding single crossover does not prove absence of its wild-type
      allele. Curator sequence comparison: Appendix printed pages 138-139 match the
      complete PlaO4 CDS. The nearby thesis G versus deposited A at position 38851
      is outside PlaO4, in plaA5; it is not a PlaO4 amino-acid substitution. GenPept,
      native GenBank, MIBiG and translated thesis target proteins agree. No UniProt
      mapping was verified after service failures; no homolog was substituted.'
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.4.2.1, 5.9.4 and 5.12.5; printed pages 53-54, 110, 114-115;
        Figure 31.
    - reference: https://www.ncbi.nlm.nih.gov/protein/ABB69759.1
      evidence_type: DATABASE_ASSERTION
      notes: 391 aa; DQ230532.1 complement(37551..38726). GenPept identifies the named
        native protein from taxon 355249.
      retrieved_on: '2026-10-03'
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: CURATOR_INFERENCE
      notes: Curator comparison of the thesis sequence appendix with DQ230532.1 and
        matching GenPept/MIBiG translations; protein-level versus nucleotide agreement
        is distinguished in the edge notes.
  - subject: mutation
    predicate: disrupts_normal
    object: production
    notes: Mutant extracts showed the PL CD8-CD11 profile, which reverted after complementation.
      The observation concerns culture-level production, not direct enzyme activity
      or absence of all metabolites.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.4.2.2 and 3.4.2.4; printed pages 54-57; Table 5, Figures 32-33.
  - subject: mutation
    predicate: causes_accumulation_of
    object: products
    notes: PL CD8 was isolated from preparative cultures; PL CD9, not CD8, was the
      largest analytical-culture peak in Table 5. NMR of CD8 showed loss of sugar
      and O-3 acetyl signals and replacement of the C-21 methylene by a methyl group
      connected to C-4 through HMBC. Its gamma-butyrolactone is retained. The other
      congeners were analyzed by HPLC/ESI-MS and UV, not all fully elucidated by NMR.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 3.4.2.2 and 3.4.2.4; printed pages 54-57; Table 5, Figures 32-33.
  - subject: rescue
    predicate: supplies_wild_type_encoding_gene_for
    object: plao4
    notes: pSET-plaO4 is a genomic-fragment complementation construct behind ermE*.
      The 42c_F/42c_R changes lie outside the native PlaO4 CDS; partial plaV/plaA5
      sequence is also included. This is not an isolated-CDS construct or a reconstituted
      monooxygenase system.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Sections 5.11.2 and 5.12.5.2; printed pages 111, 114-115.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/DQ230532.1
      evidence_type: DATABASE_ASSERTION
      notes: DQ230532.1 provides the native target CDS and neighboring gene coordinates.
      retrieved_on: '2026-10-03'
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: CURATOR_INFERENCE
      notes: 'Curator alignment of section 5.12 rescue primers to DQ230532.1: introduced
        changes fall outside the target CDS, and the amplicon also contains partial
        neighboring genes. This is a sequence comparison, not a separately sequenced
        rescue-plasmid deposition.'
  - subject: rescue
    predicate: restores_detectable
    object: production
    notes: All three tested complemented-conjugant cultures recovered the wild-type
      production profile by HPLC/ESI-MS. This is genetic rescue, not purified PlaO4-catalyzed
      substrate conversion.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: PRIMARY_EXPERIMENT
      notes: Section 3.4.2.3; printed pages 55-56.
  - subject: plao4
    predicate: is_proposed_to_catalyze
    object: function
    notes: Deletion, rescue and CD8 structure support the C-21 hydroxylase assignment,
      replacing the initial homology-based C-19 hypothesis. CD8 also lacks C-1 hydroxylation;
      the thesis argues against assigning both positions to PlaO4, but that argument
      is not a direct exclusion assay. Exact substrate, redox partners and reaction
      order are not established by these experiments.
    evidence:
    - reference: https://freidok.uni-freiburg.de/data/2280
      evidence_type: CURATOR_INFERENCE
      notes: Sections 3.4.2.4, 4.2 and 4.3(B); printed pages 56-57, 74, 77-78.
