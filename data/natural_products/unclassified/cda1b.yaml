biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9Z4X7
  enzyme_label: HmaS 4-hydroxymandelate synthase
  substrate: CHEBI:15999
  product: CHEBI:17210
  proposed: true
  notes: SCO3229/HmaS is curated as the 4-hydroxymandelate synthase that supplies
    the L-4-hydroxyphenylglycine branch of CDA1b biosynthesis. HmaS sits at the first
    step of the pathway from 4-hydroxyphenylpyruvate to 4-hydroxyphenylglycine; the
    exact SCO3229 4-hydroxyphenylpyruvate to (S)-4-hydroxymandelate reaction is inferred
    from the HmaS assignment and therefore kept proposed.
  evidence:
  - reference: DOI:10.1016/S1074-5521(02)00252-1
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Deletion of SCO3229 (hmaS)
    notes: Hojati et al. identified the Streptomyces coelicolor CDA cluster, deleted
      hmaS/SCO3229, and restored CDA production in the mutant by feeding 4-hydroxymandelate,
      4-hydroxyphenylglyoxylate, or 4-hydroxyphenylglycine.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000315.5/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: MIBiG BGC0000315.5 lists CDA1b as a product of the AL645882.2 Streptomyces
      coelicolor A3(2) cluster characterized by knockout studies.
  - reference: https://www.uniprot.org/uniprotkb/Q9Z4X7
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: Unreviewed UniProtKB:Q9Z4X7 is Streptomyces coelicolor SCO3229, a 371 aa
      4-hydroxyphenylpyruvic acid dioxygenase entry cross-referenced to EMBL AL645882
      protein CAB38519.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAB38519.1
    evidence_type: DATABASE_ASSERTION
    snippet: putative 4-hydroxyphenylpyruvic acid dioxygenase
    retrieved_on: '2026-09-29'
    notes: NCBI GenPept CAB38519.1 is the SCO3229 coding sequence from Streptomyces
      coelicolor A3(2) and cross-references UniProtKB/TrEMBL Q9Z4X7.
