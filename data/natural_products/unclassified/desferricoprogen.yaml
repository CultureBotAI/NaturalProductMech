biosynthetic_pathway:
- step_number: 1
  enzyme_label: L-ornithine N5-monooxygenase (SidA) and trans-anhydromevalonyl-CoA
    transferase (SidF)
  substrates:
  - CHEBI:15729
  - CHEBI:17710
  products:
  - CHEBI:79095
  notes: N5-hydroxylation of L-ornithine to N5-hydroxy-L-ornithine followed by N5-acylation
    with mevalonate-derived trans-anhydromevalonyl-CoA to yield N5-trans-anhydromevalonyl-N5-hydroxy-L-ornithine.
  evidence:
  - reference: PMID:25062661
    evidence_type: PRIMARY_EXPERIMENT
    notes: Biosynthesis of coprogen-family siderophores in filamentous fungi requires
      N5-hydroxyornithine acylation with trans-anhydromevalonyl-CoA.
  - reference: PMID:19700391
    evidence_type: PRIMARY_EXPERIMENT
    notes: Iron-repressed transcription of sid1 (NCU07117, L-ornithine N5-monooxygenase)
      governs coprogen biosynthesis in Neurospora crassa.
- step_number: 2
  enzyme_label: Coprogen nonribosomal peptide synthetase (SidD) and N-acetyltransferase
  substrates:
  - CHEBI:79095
  - CHEBI:15351
  - CHEBI:15422
  products:
  - CHEBI:133861
  - CHEBI:83125
  notes: NRPS-catalyzed condensation of three N5-trans-anhydromevalonyl-N5-hydroxy-L-ornithine
    units (forming a diketopiperazine ring linked via an ester bond to a third monomer)
    producing desferricoprogen B, followed by Nalpha-acetylation to yield desferricoprogen.
  evidence:
  - reference: PMID:25062661
    evidence_type: PRIMARY_EXPERIMENT
    notes: Targeted deletion of the sidD NRPS gene in Aspergillus niger abolishes
      coprogen B and coprogen biosynthesis.
  - reference: PMID:19700391
    evidence_type: PRIMARY_EXPERIMENT
    notes: Production of coprogen by iron-starved Neurospora crassa.
