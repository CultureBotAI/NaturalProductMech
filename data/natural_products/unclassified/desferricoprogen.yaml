- target_id: CHEBI:29034
  target_label: iron(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Hexadentate octahedral coordination of ferric iron(3+) via three trans-anhydromevalonyl-N5-hydroxy-L-ornithine
    hydroxamate groups (composed of a diketopiperazine dimer ester-linked to a third
    N-acetylated monomer) to form coprogen; also oxidizes Fe(II) to Fe(III) under
    anaerobic conditions.
  evidence:
  - reference: PMID:2951253
    evidence_type: PRIMARY_EXPERIMENT
    notes: Mossbauer spectroscopy and in vivo transport characterization of ferric
      coprogen (Fe(III)-desferricoprogen) in Neurospora crassa.
  - reference: PMID:15522421
    evidence_type: PRIMARY_EXPERIMENT
    notes: pH-potentiometric, UV-Vis spectrophotometric, and cyclic voltammetric characterization
      of Fe(III)-desferricoprogen stability in aqueous solution.
