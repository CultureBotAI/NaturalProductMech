biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A455R4X0
  enzyme_label: AscG cytochrome P450 monooxygenase
  reaction_id: RHEA:63100
  product: CHEBI:156219
  notes: AscG oxidizes AscF-derived ilicicolin C to ascochlorin in the terminal step
    of the Acremonium egyptiacum ascochlorin branch. This single-step partial pathway
    leaves the upstream AscA-AscF steps uncurated.
  evidence:
  - reference: DOI:10.1073/pnas.1819254116
    evidence_type: PRIMARY_EXPERIMENT
    snippet: was oxidized into 2 by the P450 monooxygenase AscG
    notes: Araki et al. reconstituted the Acremonium egyptiacum AscE, AscF and AscG
      reactions in vitro from ilicicolin A and identified the three-enzyme product
      as ascochlorin by MS/MS comparison and authentic-standard coinjection.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000379
    evidence_type: DATABASE_ASSERTION
    snippet: Conversion of alicicolin C to ascochlorin.
    retrieved_on: '2026-10-01'
    notes: MITE0000379 is an active, non-intermediate AscG entry for the oxidative
      terminal ascochlorin step. It links UniProtKB:A0A455R4X0, GenPept BBF25319.1,
      MIBiG BGC0001923, RHEA:63100 and the Araki et al. DOI.
  - reference: https://www.uniprot.org/uniprotkb/A0A455R4X0
    evidence_type: DATABASE_ASSERTION
    snippet: Cytochrome P450 monooxygenase ascG
    retrieved_on: '2026-10-01'
    notes: Current Swiss-Prot UniProtKB:A0A455R4X0 resolves as Acremonium egyptiacum
      AscG, length 534 aa, gene ascG, EC 1.14.14.-. It cross-references EMBL LC406756
      protein BBF25319.1 and annotates RHEA:63100 for AscG-catalyzed ilicicolin C
      oxidation to ascochlorin.
  - reference: https://www.ncbi.nlm.nih.gov/protein/BBF25319.1
    evidence_type: DATABASE_ASSERTION
    snippet: cytochrome P450 [Acremonium egyptiacum]
    retrieved_on: '2026-10-01'
    notes: GenPept BBF25319.1 is the 534 aa Acremonium egyptiacum F-1392 ascG product
      encoded by LC406756.1.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001923.3/BGC0001923.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: protein_id="BBF25319.1"
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0001923.3 is the Acremonium egyptiacum F-1392 ascochlorin cluster
