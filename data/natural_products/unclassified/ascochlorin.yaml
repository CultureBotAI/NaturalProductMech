definition: A dihydroxybenzaldehyde that is 2,4-dihydroxybenzaldehyde which is substituted
  by a (1E,3E)-3-methyl-1-[(1R,2R,6R)-1,2,6-trimethyl-3-oxocyclohexyl]penta-1,3-dien-5-yl
  group at position 3, chlorine at position 5, and a methyl group at position 6. A
  meroterpenoid produced by several fungi including Ascochyta viciae . It exhibits
  anticancer, antifungal and antiprotozoal activities.
