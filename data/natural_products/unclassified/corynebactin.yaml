definition: A crown compound that is enterobactin in which the pro-R hydrogens at
  positions 2, 6 and 10 of the trilactone backbone are replaced by methyl groups,
  and in which a glycine spacer separates the trilactone backbone from each of the
  catecholamide arms. It is the endogenous siderophore of Bacillus subtilis, used
  for the acquisition of iron.
