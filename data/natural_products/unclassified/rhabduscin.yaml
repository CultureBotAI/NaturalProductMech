definition: An isocyanide that is the 4-acetamido-4,6-dideoxy-β-L-galactopyranoside
  of p-[(E)-2-isocyanovinyl]phenol. Produced by the gram-negative insect pathogens,
  Xenorhabdus nematophila and Photorhabdus luminescens, it is a potent nanomolar-level
  inhibitor of phenoloxidase, a key component of the insect's innate immune system.
