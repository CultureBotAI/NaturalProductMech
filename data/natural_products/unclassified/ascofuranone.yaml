definition: A dihydroxybenzaldehyde that is 2,4-dihydroxybenzaldehyde which is substituted
  by a (2E,6E)-7-[(2S)-5,5-dimethyl-4-oxotetrahydrofuran-2-yl]-3-methylocta-2,6-dien-1-yl
  group at position 3, chlorine at position 5, and a methyl group at position 6. A
  meroterpenoid produced by the soil fungus, Acremonium sclerotigenum. It is a promising
  drug candidate against the tropical disease, African trypanosomiasis.
