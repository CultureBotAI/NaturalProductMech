definition: A nine-membered bis-lactone having methyl substituents at the 2- and 6-positions,
  an n-hexyl substituent at the 8-position, an acyloxy substituent at the 7-position
  and an aroylamido substituent at the 3-position. It is produced by Streptomyces
  bacteria and has found commercial use as a fish poison.
