  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Chelation of ferric iron(3+) in a 3:1 ligand:metal stoichiometry to form
    the octahedral tris(N-methyl-N-hydroxythioformamide)iron(III) complex fluopsin
