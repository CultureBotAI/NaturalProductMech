molecular_targets:
- target_id: CHEBI:29036
  target_label: copper(2+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Primary physiological copper(2+) chelation via two N-methyl-N-hydroxylthioamide
    (thiohydroxamate) ligands to form the square-planar bis(N-methyl-N-hydroxythioformamide)copper(II)
    complex fluopsin C (YC 73); induced under excess copper for detoxification and
    antimicrobial defense.
  evidence:
  - reference: PMID:34793213
    evidence_type: PRIMARY_EXPERIMENT
    notes: Pseudomonas aeruginosa synthesizes the thiohydroxamate ligand N-methyl-N-hydroxythioformamide
      (fluopsin) via the flcA-flcE gene cluster (PA3515-PA3519) in response to elevated
      copper, forming the copper complex fluopsin C.
  - reference: PMID:5549384
    evidence_type: PRIMARY_EXPERIMENT
    notes: Structure elucidation and total synthesis of thioformin (N-methyl-N-hydroxythioformamide)
      and its cupric complex YC 73 (fluopsin C) from Pseudomonas.
