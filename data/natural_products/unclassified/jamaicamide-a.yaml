biosynthetic_pathway:
- enzyme_id: UniProtKB:Q6E7K6
  enzyme_label: JamD flavin-dependent halogenase (MITE annotation)
  proposed: true
  notes: MITE assigns JamD to jamaicamide B-to-A bromination. Its literal B and A
    models have the respective owners' connectivity, formula and charge but omit all
    three alkene configurations retained by those owners. Both models and owners leave
    two tetrahedral centers unspecified. This is missing stereochemistry, not a demonstrated
    stereochemical conflict or an exact full-InChIKey join. The models remain separate
    from the grounded record. Primary assays and constructs were not inspected, so
    the pathway entry remains proposed; no exact chemical conversion of the owner,
    balanced reaction, physiological order or native production experiment is asserted.
  evidence:
  - reference: https://github.com/mite-standard/mite_data/blob/6eacd913b2036376031072f69cbb33908f132998/mite_data/data/MITE0000076.json
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    snippet: Bromination of jamaicamide B to jamaicamide A.
    notes: 'MITE0000076 version 2, active, assigns this literal reaction to JamD/Q6E7K6/AAS98776.1/BGC0001001.
      Its heterologous-expression and in-vitro-assay codes cite DOI:10.1021/jacs.3c05750,
      which was inaccessible in this pass. These codes are database annotations, not
      newly verified primary experiments. The example is flagged isIntermediate: true;
      neither terminal pathway order nor a balanced reaction is inferred. The separate
      iodination-to-jamaicamide-F example is not adopted here.'
  - reference: https://www.uniprot.org/uniprotkb/Q6E7K6/entry
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    notes: UniProtKB Q6E7K6, unreviewed TrEMBL entry 33/sequence 1, annotation 2025-02-05,
      identifies a 683-aa JamD reference from Lyngbya majuscula, NCBITaxon:158786,
      with the JHB nucleotide sequence reference and AY522504/AAS98776.1 cross-reference.
      Protein existence is Predicted, and this response has no catalytic-function
      comment. It supplies identity, not independent evidence for MITE's functional
      claim.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAS98776.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-08'
    snippet: JamD [Lyngbya majuscula]
    notes: GenPept AAS98776.1 names strain JHB, taxon 158786, and coded_by AY522504.1:10463..12514,
      table 11. Its full 683-aa sequence equals UniProtKB:Q6E7K6. The source calls
      the protein a putative halogenase possibly involved in alkynyl bromide formation;
      that native-reference annotation does not verify a historical assay construct
      or the later enzymatic experiment.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AY522504.1
    evidence_type: CURATOR_INFERENCE
    retrieved_on: '2026-10-08'
    notes: 'Independent native-reference audit: AY522504.1 is the 69,900-nt JHB jamaicamide
      cluster reference named by this owner''s BGC0001001. Its complete plus-strand
      JamD CDS, 10463..12514 (1-based inclusive), contains 2,052 nt, codon_start 1/table
      11. Complete-CDS translation equals the 683-aa native CDS annotation, GenPept
      and UniProt. Native sequence identity does not establish assay-stock identity,
      catalysis, native production or stereochemistry.'
  - reference: https://github.com/mite-standard/mite_data/blob/6eacd913b2036376031072f69cbb33908f132998/mite_data/data/MITE0000076.json
    evidence_type: CURATOR_INFERENCE
    retrieved_on: '2026-10-08'
    notes: 'RDKit 2026.03.5 literal-SMILES audit, without SMARTS execution: the B
      model is KZVHAGNFWJIOMX-UHFFFAOYSA-N (C27H37ClN2O4); the A model is NAIKIJSSBJHCBL-UHFFFAOYSA-N
      (C27H36BrClN2O4). Both are neutral. The corresponding record keys are KZVHAGNFWJIOMX-GDKFLGFMSA-N
      and NAIKIJSSBJHCBL-IPUGVWFUSA-N. Their connectivity, formula and charge agree,
      but three specified double-bond configurations in each owner are unspecified
      in the source model. Both sides also have two unspecified tetrahedral centers.
      No stereochemistry is completed or inverted and no exact-owner product assignment
      is made.'
