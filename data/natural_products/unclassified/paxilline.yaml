biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9C451
  enzyme_label: PaxD
  substrate: CHEBI:34907
  product: naturalproductmech:mibig-8e09316737
  notes: PaxD is represented as the terminal P. paxilli prenyltransferase that accepts
    paxilline and dimethylallyl diphosphate and catalyzes successive prenylations
    to the exact 21,22-diprenylated paxilline product.
  evidence:
  - reference: DOI:10.1007/s00253-013-4834-9
    evidence_type: PRIMARY_EXPERIMENT
    snippet: PaxD catalyzed the successive di-prenylation
    notes: Liu et al. overexpressed Penicillium paxilli PaxD in Escherichia coli,
      purified the enzyme, and showed that paxilline plus dimethylallyl diphosphate
      produced mono- and di-prenyl paxilline, with the major di-prenyl product assigned
      as 21,22-diprenylated paxilline.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001082.4/index.html
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: MIBiG BGC0001082.4 names 21,22-diprenylated paxilline among the products
      of the Penicillium paxilli HM171111.1 paxilline locus and cites DOI:10.1007/s00253-013-4834-9
      as compound evidence.
  - reference: https://www.uniprot.org/uniprotkb/Q9C451
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Reviewed UniProtKB:Q9C451 resolves Penicillium paxilli PaxD, cites PMID:23525886
      for catalytic activity and pathway placement, and cross-references EMBL HM171111
      / GenPept AAK11526.2.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/HM171111.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: GenBank HM171111.1 is the Penicillium paxilli paxilline biosynthetic locus;
      its paxD coding sequence maps to protein AAK11526.2.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AAK11526.2
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AAK11526.2 is the HM171111.1 paxD coding sequence cross-referenced
      by UniProtKB:Q9C451.
