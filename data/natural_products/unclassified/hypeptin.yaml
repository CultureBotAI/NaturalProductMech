    label: HynC, native K5869 reference
    node_type: ENZYME
    identifier: NCBIProtein:QWP75303.1
    grounding_status: GROUNDED
  - node_id: hyne
    label: HynE, native K5869 reference
    node_type: ENZYME
    identifier: NCBIProtein:QWP75301.1
    grounding_status: GROUNDED
