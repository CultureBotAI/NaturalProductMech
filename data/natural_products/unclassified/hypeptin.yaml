- graph_id: hypeptin-hynabce-database-carrier-bound-tailoring-contexts
  scope: BIOSYNTHESIS
  description: Separate database-reported HynC and HynE carrier-bound amino-acid tailoring
    contexts in the hypeptin BGC. HynA is listed as auxiliary to both; HynB only to
    HynC. All four nodes denote verified native K5869 protein references, not reconstructed
    assay constructs. Functional claims remain database assertions. The HynC leucine-description/model
    carbon-count conflict is unresolved (issue664); no exact chemical reaction, carrier/domain
    assignment, reaction stereochemistry, pathway order, physical complex, native
    genetic necessity or direct mature-hypeptin-forming step is asserted.
  nodes:
  - node_id: hyna
    label: HynA, native K5869 reference
    node_type: ENZYME
    identifier: NCBIProtein:QWP75305.1
    grounding_status: GROUNDED
  - node_id: hynb
    label: HynB, native K5869 reference
    node_type: ENZYME
    identifier: NCBIProtein:QWP75304.1
    grounding_status: GROUNDED
