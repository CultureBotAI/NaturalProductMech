  edges:
  - subject: hync
    predicate: is_database_assigned_hydroxylase_in
    object: hync_tailoring
    notes: MITE describes non-heme diiron monooxygenase HynC and PCP-bound tyrosine
      and leucine hydroxylations. These are source descriptions, not adopted exact
      chemical transformations. The leucine-labeled example contains a seven-carbon
      amino-acid moiety rather than six-carbon leucine in both substrate and product;
      diagnostic thioester cleavage with a leucine control localizes the mismatch
      to the amino-acid side. This does not establish the actual assay substrate or
      a correction. Exact HynC chemistry remains unresolved under https://github.com/CultureBotAI/NaturalProductMech/issues/664.
      No encoded carrier fragment, syn stereochemical outcome, Fe occupancy or corrected
      model is adopted. The process denotes an intermediate tailoring context, not
      direct formation of mature hypeptin. The cited 2021 paper was inaccessible;
      no primary assay, exact construct, substrate order or native deletion/complementation
      phenotype was independently inspected.
    evidence:
    - reference: https://github.com/mite-standard/mite_data/blob/6eacd913b2036376031072f69cbb33908f132998/mite_data/data/MITE0000197.json
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-06'
      snippet: beta-hydroxylation of PCP-bound tyrosine (syn)
      notes: MITE0000197 version 3, inspected 2026-10-07, archive member/Git blob
        verified at the cited commit. The row links HynC to its GenPept reference
        and BGC0002126. Its in-vitro assay code and DOI:10.1002/anie.202102224 citation
        remain database metadata, not primary evidence inspected here. All listed
        reaction examples are flagged as intermediates.
    - reference: https://www.ncbi.nlm.nih.gov/protein/QWP75303.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-07'
      notes: Native Lysobacter sp. K5869 reference, taxon 2820808, 531 aa, locus J5226_16935.
        Complete GenPept sequence equals the native CDS translation. The Hyn name
        comes from MITE; GenPept and native chromosome have no gene-name qualifier.
        PGAP/CDD product and domain annotations are computational, not independently
        inspected function or module assays. Exact-strain/gene and GenPept-xref UniProtKB
        queries returned no entries on 2026-10-07; bounded absence only, with no homolog
        selected. This identifier is not a reconstructed historical assay construct.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/CP072597.1
      evidence_type: DATABASE_ASSERTION
      retrieved_on: '2026-10-07'
      notes: CP072597.1 is the complete circular 5,968,034-bp K5869 chromosome. Reverse-strand
        CDS 3903191..3904786, table 11/codon 1, translates exactly to QWP75303.1;
        independent GenPept coded_by coordinates, strand and DNA agree. Native reference
        identity and neighborhood do not independently prove biochemical function,
        physical interaction or native genetic necessity.
