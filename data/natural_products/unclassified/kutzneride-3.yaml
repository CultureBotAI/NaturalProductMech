biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A8CF75
  enzyme_label: KtzQ tryptophan 7-halogenase
  reaction_id: RHEA:26494
  substrate: CHEBI:57912
  substrates:
  - CHEBI:57912
  - CHEBI:58307
  - CHEBI:17996
  - CHEBI:15379
  product: CHEBI:58713
  products:
  - CHEBI:58713
  - CHEBI:57692
  - CHEBI:15377
  notes: KtzQ catalyzes the first tandem halogenase step in the kutzneride pathway,
    forming 7-chloro-L-tryptophan from free L-tryptophan before KtzR installs the
    6-chlorine in a separate downstream step.
  evidence:
  - reference: DOI:10.1021/ja806467a
    evidence_type: PRIMARY_EXPERIMENT
    snippet: KtzQ (along with the flavin reductase KtzS) acts first to chlorinate
      at the 7-position of L-tryptophan
    notes: Heemstra and Walsh identified KtzQ as the first tryptophan halogenase in
      kutzneride biosynthesis, assayed the purified enzyme with KtzS, and showed that
      it forms 7-chloro-L-tryptophan from free L-tryptophan.
  - reference: https://mite.bioinformatics.nl/repository/MITE0000029
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-02'
    notes: MITE0000029 is active, assigns KtzQ to the in vitro-supported C7 chlorination
      of L-tryptophan to 7-chlorotryptophan, records RHEA:26494 and EC:1.14.19.9 for
      the reaction, and links KtzQ to UniProtKB:A8CF75, GenPept ABV56597.1 and MIBiG
      BGC0000378.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000378.5/BGC0000378.gbk
    evidence_type: DATABASE_ASSERTION
    snippet: 'MITE0000029: Halogenation (100% identity)'
    retrieved_on: '2026-10-02'
    notes: MIBiG BGC0000378.5 places ktzQ/ABV56597.1 inside the active Kutzneria sp.
      744 kutzneride biosynthetic gene cluster as a Trp_halogenase locus with a MITE0000029
      halogenation annotation.
  - reference: https://www.uniprot.org/uniprotkb/A8CF75
    evidence_type: DATABASE_ASSERTION
    snippet: GN   Name=ktzQ
    retrieved_on: '2026-10-02'
    notes: Current reviewed UniProtKB:A8CF75 resolves as the Kutzneria sp. strain
      744 Tryptophan 7-halogenase KtzQ entry, cross-references EMBL EU074211 protein
      ABV56597.1, and annotates the RHEA:26494 / EC:1.14.19.9 L-tryptophan 7-halogenase
      catalytic activity.
  - reference: https://www.ncbi.nlm.nih.gov/protein/ABV56597.1
