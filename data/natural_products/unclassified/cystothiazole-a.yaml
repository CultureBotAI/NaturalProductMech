np_pathway: UNCLASSIFIED
definition: An organonitrogen heterocyclic antibiotic that is 2,4'-bi-1,3-thiazole
  substituted by an isopropyl group at position 2' and a 3,5,7-trimethoxy-4-methyl-7-oxohepta-1,5-dien-1-yl
  group at position 4 (the 2E,4R,5S,6E stereoisomer). It is isolated from the culture
  broth of myxobacterium, Cystobacter fuscus, and exhibits antifungal and cytotoxic
  activity.
