biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A7G7XYE0
  enzyme_label: BolR
  notes: This curates the Burkholderia gladioli HKI0521 BGC0002327/MT844061.1 BolR
    citrate synthase required for the citrate-derived tricarboxylic fatty-acid tail
    in bolagladin A/B. Native oxaloacetyl- or citryl-CoA activation timing remains
    unresolved, so no exact substrate or product is asserted.
  evidence:
  - reference: DOI:10.1002/anie.202009107
    evidence_type: PRIMARY_EXPERIMENT
    snippet: the production of 1 and 2 was fully abrogated
    notes: Dose et al. constructed a Burkholderia gladioli HKI0521 bolR null mutant
      and showed that normal bolagladin A and B production was abolished, with tail-shortened
      shunt metabolites detected instead.
  - reference: https://www.uniprot.org/uniprotkb/A0A7G7XYE0
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Unreviewed UniProtKB:A0A7G7XYE0 is the Burkholderia gladioli bolR 459 aa
      citrate synthase and cross-references EMBL MT844061 protein QNH85850.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/QNH85850.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept QNH85850.1 is the MT844061.1 BGC0002327 Burkholderia gladioli
      HKI0521 bolR citrate synthase CDS and is sequence-identical to UniProtKB:A0A7G7XYE0.
