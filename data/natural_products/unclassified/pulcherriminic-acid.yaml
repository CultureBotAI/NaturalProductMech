biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:O34351
  enzyme_label: YvmC cyclodileucine synthase
  reaction_id: RHEA:46452
  product: CHEBI:67269
  notes: Bacillus subtilis 168 yvmC, annotated pchC in MIBiG's NC_000964.3 GenBank
    record, catalyzes cyclodileucine formation from two L-leucyl-tRNA(Leu) substrates.
    The full Rhea tRNA participant RHEA-COMP:9622 is not used as a substrate CURIE
    because RHEA-COMP is not yet a NaturalProductMech grounding prefix.
  evidence:
  - reference: DOI:10.1038/nchembio.175
    evidence_type: PRIMARY_EXPERIMENT
    snippet: also use aminoacyl-tRNAs to synthesize various cyclodipeptides
    notes: Gondry et al. characterized several AlbC homologs, including the CAB15512
      Bacillus subtilis 168 protein represented by UniProtKB:O34351, as tRNA-dependent
      cyclodipeptide synthases.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002103.2/BGC0002103.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0002103.2 maps the Bacillus subtilis subsp. subtilis str. 168
      pulcherriminic acid cluster pchC/yvmC CDS to NP_391387.1 and UniProtKB:O34351,
      and its cypX CDS to NP_391386.1 and UniProtKB:O34926.
  - reference: https://www.uniprot.org/uniprotkb/O34351
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:O34351 is the 248 aa Bacillus subtilis 168 yvmC/BSU35070
      cyclo(L-leucyl-L-leucyl) synthase and annotates EC:2.3.2.22 plus RHEA:46452
      from PMID:19430487.
  - reference: https://www.rhea-db.org/rhea/46452
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: RHEA:46452 is the cyclo(L-leucyl-L-leucyl) synthase reaction that converts
      two L-leucyl-tRNA(Leu) participants into cyclo(L-leucyl-L-leucyl), two tRNA(Leu),
      and two protons.
- step_number: 2
  enzyme_id: UniProtKB:O34926
  enzyme_label: CypX pulcherriminic acid synthase
  reaction_id: RHEA:35555
  substrate: CHEBI:67269
  product: CHEBI:71599
  notes: Bacillus subtilis 168 CypX/CYP134A1 oxidizes cyclo(L-leucyl-L-leucyl) toward
    pulcherriminic acid. RHEA:35555 uses pulcherriminate(2-) CHEBI:77663 as the product
    participant; CHEBI:71599 is the neutral acid recorded for the same BGC0002103
