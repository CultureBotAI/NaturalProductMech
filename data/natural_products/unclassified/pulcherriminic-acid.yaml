- graph_id: pulcherriminic-acid-klactis-database-regulation-secretion
  scope: BIOSYNTHESIS
  description: Database-qualified K. lactis PUL gene regulation and pulcherriminic-acid
    secretion. PUL4 regulates genes encoding the PUL1/PUL2/PUL3 reference proteins;
    PUL3 is annotated as required for acid secretion. Gene-expression predicates do
    not assert protein-protein interactions. All four nodes denote reference proteins,
    not verified historical assay stocks. No ordered yeast reaction, bacterial leucyl-tRNA/Rhea
    transfer, direct promoter binding, iron-complex uptake, antimicrobial effect or
    producer/BGC upgrade is asserted. The existing bacterial pathway is separate and
    unchanged.
