  - reference: https://www.uniprot.org/uniprotkb/O34926
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: Reviewed UniProtKB:O34926 is the 405 aa Bacillus subtilis 168 cypX/BSU35060
