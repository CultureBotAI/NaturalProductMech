  description: Partial experimental reconstitution, not a complete ordered pathway.
    Supplement sections2-5 specify Af293-derived cloning, N-FLAG/C-His6 PsoA, N-His6
    PsoB/PsoF for bacterial protein purification, and a separate yeast PsoB/PsoG vector.
    Canonical entries are native reference examples, not verified full insert sequences.
    PsoG remains ungrounded. No transfer to pseurotin A/D, no direct PsoB catalytic
    assignment, and no inference of native essentiality. Primary starter preference
    takes precedence over the acetyl-starter statement in UniProt; that discrepant
    database statement is not adopted.
