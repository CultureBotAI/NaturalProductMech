- discussion_id: curator-capsule-exact-product-assignment
  kind: CURATION_TODO
  status: OPEN
  posed_by: codex
  prompt: Which exact chemical product does each deposited capsule locus support?
  rationale: Three serotype 12/6/7 loci share one finite type-7-labelled graph. Its
    n-propoxy substituent, geminal ring diol and phosphate monoester require adjudication
    against capsule chemistry. The accessible 2024 study describes a glycosylglycerol-phosphate
    polymer backbone, not this finite graph, and its AP76 enzyme context is not the
    imported isolate 72-14676. A. lignieresii occurrence support remains unknown because
    the cited full paper is inaccessible; absence from its abstract is not refutation.
    Registry names/MeSH associations are name-based and are not independent chemical
    certification. Exact PubChem graph agreement is verified; deleting its xref alone
    would not repair the biological assignment. The confirmed defect is unsupported
    exact-product assignment across the recorded contexts, not an experimentally established
    replacement structure. Preserve existing keys, source assertions and SEEDED status
    pending primary-chemistry adjudication; no automatic split, merge, stereochemical
    completion or registry-serotype rename.
  evidence:
  - reference: https://github.com/CultureBotAI/NaturalProductMech/issues/937
    explanation: Open exact-product adjudication; qualification is mitigation, not
      resolution.
  - reference: https://pubchem.ncbi.nlm.nih.gov/compound/195740
    evidence_source: database
    explanation: Registry title uses type 7; exact graph/key agrees, but name-based
      MeSH association is not biological identity certification.
  - reference: PMID:18215476
    evidence_source: abstract
    explanation: Metadata and abstract inspected; full text denied. No exact-product
      equivalence inferred from genotyping or capsule-gene comparisons.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AY496881.1
    evidence_source: database
    explanation: Deposited strain context 8329, serotype 12; not exact molecular-product
      proof.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AY534316.1
    evidence_source: database
    explanation: Deposited strain context Femo, serotype 6; not exact molecular-product
      proof.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/AY534317.1
    evidence_source: database
    explanation: Deposited isolate context isolate 72-14676, serotype 7; not exact
      molecular-product proof.
  - reference: DOI:10.1038/s41589-024-01664-8
    evidence_source: full_text
    explanation: Cps7D backbone polymerization and cloning methods inspected; AP76
      experimental context is not imported isolate 72-14676, and backbone synthesis
      does not specify all native capsule modifications.
