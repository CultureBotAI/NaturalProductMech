biosynthetic_pathway:
- step_number: 4
  enzyme_id: UniProtKB:Q3M6C6
  enzyme_label: Ava_3855 NRPS-like shinorine synthase
  notes: Trichormus variabilis ATCC 29413 Ava_3855 catalyzes the ATP-dependent terminal
    serine incorporation step that converts mycosporine glycine to shinorine. No exact
    Rhea reaction was available for this serine addition.
  evidence:
  - reference: DOI:10.1126/science.1193637
    evidence_type: PRIMARY_EXPERIMENT
    snippet: HPLC assays confirmed its role in converting mycosporine glycine and
      serine to shinorine
    notes: Balskus and Walsh showed that the complete 6.5 kb Ava_3858-Ava_3855 cluster
      produced shinorine in Escherichia coli, that a construct truncated before Ava_3855
      accumulated mycosporine glycine, and that purified Ava_3855 converted mycosporine
      glycine plus serine to shinorine in an ATP-dependent HPLC assay.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000427.5/
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG entry version 5 links BGC0000427 to shinorine biosynthesis in Trichormus
      variabilis ATCC 29413 and lists Ava_3855 / ABA23460.1 at CP000117.1:4798900-4801566
      on the minus strand.
  - reference: https://www.uniprot.org/uniprotkb/Q3M6C6
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: Unreviewed UniProtKB:Q3M6C6 is the Trichormus variabilis ATCC 29413 / PCC
      7937 Ava_3855 amino acid adenylation entry cross-referenced to EMBL CP000117
      and GenPept ABA23460.1.
