- step_number: 3
  enzyme_id: UniProtKB:Q2FW72
  enzyme_label: Staphyloferrin A synthase
  reaction_id: RHEA:59140
  notes: Staphylococcus aureus NCTC 8325 SfnaB catalyzes the ATP-dependent terminal
    condensation of the SfnaD product with citrate to form staphyloferrin A. RHEA:59140
    uses the stereospecified anionic staphyloferrin A participant CHEBI:142973; this
    record denotes neutral CHEBI:84711, whose seeded MIBiG structure leaves the citryl
    stereocentres unspecified.
  evidence:
  - reference: DOI:10.1021/bi801844c
    evidence_type: PRIMARY_EXPERIMENT
    snippet: SfnaB utilizing the alpha-amine to complete staphyloferrin A synthesis
    notes: Cotton et al. reconstituted staphyloferrin A biosynthesis in vitro with
      purified recombinant SfnaD and SfnaB and assigned SfnaB as the final NIS synthetase
      that condenses citrate with the SfnaD product.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000944.5/
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: MIBiG entry version 5 links BGC0000944 to staphyloferrin A biosynthesis
      in Staphylococcus aureus subsp. aureus NCTC 8325.
  - reference: RHEA:59140
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: RHEA:59140 annotates EC:6.3.2.57 as N(5)-[(S)-citryl]-D-ornithine, citrate,
      and ATP forming staphyloferrin A, AMP, diphosphate, and a proton.
  - reference: https://www.uniprot.org/uniprotkb/Q2FW72
