  product: CHEBI:142972
  notes: ATP-dependent condensation of D-ornithine and citrate forms the N(5)-citryl-D-ornithine
    intermediate, AMP, diphosphate and a proton. Database-qualified assignment to
    the NCTC 8325 reference; the UniProt publication block names RN4220, not an experimentally
    established identical stock. No step number is invented. This intermediate feeds
    the separately preserved terminal SfnaB step 3; existing numbering and primary
    evidence are unchanged. No L-ornithine racemase assignment to Q2FW73 is made.
  evidence:
  - reference: https://www.uniprot.org/uniprotkb/Q2FW70
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-09'
    notes: Reviewed UniProt entry version 93, sequence version 1; 658 aa; sfnaD, SAOUHSC_02436;
      S. aureus NCTC 8325 / PS 47, taxon 93061. ATP-dependent condensation of D-ornithine
      and citrate forms the N(5)-citryl-D-ornithine intermediate, AMP, diphosphate
      and a proton. FUNCTION and CATALYTIC ACTIVITY cite ECO:0000269/PMID:19138128.
      Its UniProt reference block names strain RN4220, not the NCTC 8325 reference
      stock. DOI:10.1021/bi801844c was tool-inaccessible in this audit; no new PRIMARY_EXPERIMENT
      claim or assayed-construct identity. RHEA:59136 and forward RHEA:59137 are read
      from UniProt, not independently rechecked against Rhea. Ionic participants follow
      UniProt cross-references and cached ChEBI release 255 labels; edges summarize
      principal substrates/products, not a complete stoichiometric model.
