    retrieved_on: '2026-10-09'
    notes: The complete 658-aa ABD31458.1 equals canonical UniProt Q2FW70. CDS CP000253.1:2262005..2263981,
      locus SAOUHSC_02436, independently translates to that sequence using table 11
      and codon_start 1, with the recorded strand. CP000253.1 and GenPept name NCTC
      8325, taxon 93061, BioSample SAMN02604235. This is reference identity only,
      not RN4220 equivalence, a historical stock, an assayed construct, native expression
      or functional proof. Genomic hypothetical-protein annotations are not functional
      experiments.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0000944.5/annotations.json
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-09'
