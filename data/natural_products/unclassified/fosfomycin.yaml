biosynthetic_pathway:
- step_number: 10
  enzyme_label: Psf1/Psf2 phosphonomethylmalate-forming module
  proposed: false
  notes: Psf1 and Psf2 together convert phosphoenolpyruvate plus acetyl-CoA into phosphonomethylmalate
    in the assayed Pseudomonas syringae PB-5123 route. The individual phosphonopyruvate
    intermediate is not represented as a separate PathwayStep because the source directly
    detected the two-enzyme Pmm product rather than isolating phosphonopyruvate.
  evidence:
  - reference: DOI:10.1128/AAC.06478-11
    evidence_type: PRIMARY_EXPERIMENT
    snippet: When either Psf1 or Psf2 was omitted
    notes: Kim et al. cloned psf1 and psf2 from the Pseudomonas syringae PB-5123 fosfomycin
      cluster, purified His-tagged Psf1 and Psf2, and found that the combined PEP,
      acetyl-CoA, Psf1, and Psf2 assay formed phosphonomethylmalate; omission of either
      enzyme prevented new phosphonate product formation.
  - reference: https://www.uniprot.org/uniprotkb/I6QN26
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: UniProtKB:I6QN26 is the unreviewed 291 aa Pseudomonas syringae phosphoenolpyruvate
      mutase entry and cross-references EMBL JX102649 protein AFM38986.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AFM38986.1
    evidence_type: DATABASE_ASSERTION
    snippet: product="phosphoenolpyruvate phosphomutase"
    retrieved_on: '2026-09-28'
    notes: NCBI GenPept AFM38986.1 is the JX102649.1 Psf1 coding sequence from the
      Pseudomonas syringae PB-5123 fosfomycin cluster.
  - reference: https://www.uniprot.org/uniprotkb/I6QY75
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: UniProtKB:I6QY75 is the unreviewed 380 aa Pseudomonas syringae entry that
      cross-references EMBL JX102649 protein AFM38993.1; GenBank annotates that exact
      CDS as Psf2.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AFM38993.1
    evidence_type: DATABASE_ASSERTION
    snippet: note="Psf2"
    retrieved_on: '2026-09-28'
    notes: NCBI GenPept AFM38993.1 is the JX102649.1 Psf2 coding sequence from the
      Pseudomonas syringae PB-5123 fosfomycin cluster.
- step_number: 80
  enzyme_id: UniProtKB:I6R485
  enzyme_label: Psf3
  product: CHEBI:62246
  notes: This demonstrated Psf3 reaction is the penultimate fosfomycin biosynthetic
    step in the assayed Pseudomonas syringae PB-5123 route. The exact 2-oxopropylphosphonate
    substrate is not grounded to a CURIE in this record, so only the ChEBI-grounded
    (S)-2-HPP product is populated.
  evidence:
  - reference: DOI:10.1021/acschembio.6b00939
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Psf3 carried out the reduction of 2-OPP
    notes: Olivares et al. expressed and purified Pseudomonas syringae PB-5123 Psf3
      and showed that it catalyzes the NADPH-dependent reduction of 2-oxopropylphosphonate
      to (S)-2-hydroxypropylphosphonate.
  - reference: https://www.uniprot.org/uniprotkb/I6R485
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: UniProtKB:I6R485 is the unreviewed 295 aa Pseudomonas syringae entry that
      cross-references EMBL JX102649 protein AFM38992.1 and PDB 5U5G from the Psf3
      structure.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AFM38992.1
    evidence_type: DATABASE_ASSERTION
    snippet: name="Psf3"
    retrieved_on: '2026-09-29'
    notes: NCBI GenPept AFM38992.1 is the JX102649.1 Psf3 coding sequence from the
      Pseudomonas syringae PB-5123 fosfomycin cluster.
- step_number: 90
  enzyme_id: UniProtKB:Q9JN69
  enzyme_label: Ps-HppE
  reaction_id: RHEA:10808
  notes: This deliberately curates only the Pseudomonas syringae PB-5123 Ps-HppE final
    epoxidation of (S)-2-hydroxypropylphosphonate to the Rhea fosfomycin microspecies;
    the upstream Pseudomonas and Streptomyces branches remain uncurated.
  evidence:
  - reference: DOI:10.1021/bi800877v
    evidence_type: PRIMARY_EXPERIMENT
    snippet: This purified P. syringae protein was determined to catalyze the epoxidation
      of ( S)-HPP to fosfomycin
    notes: Munos et al. purified Pseudomonas syringae Ps-HppE and showed that it catalyzes
      the final HPP-to-fosfomycin epoxidation.
  - reference: DOI:10.1128/AAC.06478-11
    evidence_type: PRIMARY_EXPERIMENT
    snippet: We sequenced the biosynthetic gene cluster responsible for fosfomycin
      production in Pseudomonas syringae PB-5123
    notes: Kim et al. sequenced the Pseudomonas syringae PB-5123 fosfomycin cluster
      now represented by GenBank JX102649.1.
  - reference: https://www.uniprot.org/uniprotkb/Q9JN69
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Reviewed UniProtKB:Q9JN69 is Pseudomonas syringae Ps-HppE, cross-references
      EMBL JX102649 protein AFM38989.1, and annotates RHEA:10808 with ChEBI participants
      CHEBI:62246 and CHEBI:62247.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AFM38989.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept AFM38989.1 is the JX102649.1 Psf4 epoxidase coding sequence
      from the Pseudomonas syringae PB-5123 fosfomycin cluster.
  substrate: CHEBI:62246
  product: CHEBI:62247
