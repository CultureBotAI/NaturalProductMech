biosynthetic_pathway:
- step_number: 1
  enzyme_label: DesA (lysine decarboxylase)
  substrates:
  - CHEBI:18019
  products:
  - CHEBI:18127
  notes: Pyridoxal 5'-phosphate-dependent decarboxylation of L-lysine to cadaverine;
    first committed step of the desABCD desferrioxamine biosynthetic pathway in Streptomyces
    coelicolor.
  evidence:
  - reference: PMID:15600304
    evidence_type: PRIMARY_EXPERIMENT
    notes: The desABCD operon of Streptomyces coelicolor M145 directs the biosynthesis
      of desferrioxamines G1 and E starting from L-lysine decarboxylation by DesA.
- step_number: 2
  enzyme_label: DesB (cadaverine monooxygenase) and DesC (N-hydroxycadaverine acyltransferase)
  substrates:
  - CHEBI:18127
  - CHEBI:15380
  notes: FAD-dependent N-hydroxylation of cadaverine to N-hydroxycadaverine followed
    by DesC-catalyzed N-succinylation with succinyl-CoA to form N-hydroxy-N-succinylcadaverine
    (HSC) monomers.
  evidence:
  - reference: PMID:15600304
    evidence_type: PRIMARY_EXPERIMENT
    notes: DesB N-hydroxylates cadaverine and DesC acylates N-hydroxycadaverine with
      succinyl-CoA to generate N-hydroxy-N-succinylcadaverine.
  - reference: PMID:29685972
    evidence_type: PRIMARY_EXPERIMENT
    notes: Structural and biochemical characterization of DesC catalyzing acylation
      of N-hydroxycadaverine with succinyl-CoA and acetyl-CoA.
- step_number: 3
  enzyme_label: DesD (NRPS-independent siderophore synthetase)
  products:
  - CHEBI:50439
  notes: ATP-dependent iterative condensation of three N-hydroxy-N-succinylcadaverine
    units without macrocyclization to yield linear desferrioxamine G.
  evidence:
  - reference: PMID:17704771
    evidence_type: PRIMARY_EXPERIMENT
    notes: Recombinant DesD catalyzes ATP-dependent trimerization of N-hydroxy-N-succinylcadaverine
      to form linear desferrioxamine G1 and cyclic desferrioxamine E.
