molecular_targets:
- target_id: CHEBI:29034
  target_label: iron(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: Primary physiological ferric ion chelation via hexadentate tris-hydroxamate
    coordination (ferrioxamine G1, 1:1 complex, log beta110 ~ 30.6) mediating high-affinity
    bacterial iron acquisition.
  evidence:
  - reference: PMID:15600304
    evidence_type: PRIMARY_EXPERIMENT
    notes: Identification and genetic characterization of the desABCD desferrioxamine
      biosynthetic gene cluster in Streptomyces coelicolor A3(2).
  - reference: PMID:17704773
    evidence_type: PRIMARY_EXPERIMENT
    notes: NIS synthetase DesD catalyzes the ATP-dependent condensation of N-hydroxy-N-succinylcadaverine
      to form both linear desferrioxamine G1 and macrocyclic desferrioxamine E for
      ferric iron acquisition.
  - reference: DOI:10.1021/ic00136a014
    evidence_type: PRIMARY_EXPERIMENT
    notes: Potentiometric and spectrophotometric determination of stability constants
      of linear tris-hydroxamate ferrioxamine complexes with Fe(III), Ga(III), Al(III),
      and divalent transition metals.
- target_id: CHEBI:84043
  target_label: gallium(3+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Hexadentate tris-hydroxamate coordination
    of trivalent gallium(3+) (log beta110 ~ 27.6, measured in vitro as a redox-inactive
    Fe(III) surrogate; lower affinity than Fe(III) and not a physiological metabolic
    cofactor).'
  evidence:
  - reference: DOI:10.1021/ic00136a014
    evidence_type: PRIMARY_EXPERIMENT
    notes: Linear tris-hydroxamate desferrioxamine ligands form stable 1:1 hexadentate
      complexes with Ga(III) in aqueous solution.
- target_id: CHEBI:48828
  target_label: cobalt(2+)
  target_type: OTHER
  relation: BINDS
  source: CURATOR
  notes: '[Critical Mineral & Material (CMM)] Coordination of divalent cobalt(2+)
    in aqueous solution (measured in vitro; ~15-20 orders of magnitude weaker than
    Fe(III), oxidation-prone to Co(III)-tris-hydroxamate in aerobic solution).'
  evidence:
  - reference: DOI:10.1021/ic00136a014
    evidence_type: PRIMARY_EXPERIMENT
    notes: Thermodynamic stability constants for linear tris-hydroxamate desferrioxamine
      complexes with divalent Co(II), Ni(II), Cu(II), and Zn(II) in aqueous solution.
- target_id: CHEBI:49786
