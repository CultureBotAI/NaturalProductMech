definition: A tricarboxylic acid that is docosa-2,4,8,10,14,18,20-heptaenedioic acid
  substituted at positions 2 ,5 and 17 by methyl groups, at positions 6 by a methoxy
  group and at position 20 by a carboxymethyl group. It is produced by the bacterium
  <em>Burkholderia gladioli</em> and implicated in outbreaks of food-borne illness
  involving coconut and corn-based products in Indonesia and China.
