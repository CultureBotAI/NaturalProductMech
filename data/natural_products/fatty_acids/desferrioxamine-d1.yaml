biosynthetic_pathway:
- step_number: 1
  enzyme_label: DesA (lysine decarboxylase) and DesB (cadaverine monooxygenase)
  substrates:
  - CHEBI:18019
  products:
  - CHEBI:18127
  notes: Decarboxylation of L-lysine to cadaverine and FAD-dependent N-hydroxylation
    to N-hydroxycadaverine in the Streptomyces desABCD pathway.
  evidence:
  - reference: PMID:15600304
    evidence_type: PRIMARY_EXPERIMENT
    notes: The desABCD gene cluster encodes L-lysine decarboxylase DesA and cadaverine
      monooxygenase DesB for hydroxamate monomer synthesis.
- step_number: 2
  enzyme_label: DesC (acyltransferase) and DesD (NIS siderophore synthetase)
  substrates:
  - CHEBI:18127
  - CHEBI:15351
  - CHEBI:15380
  products:
  - CHEBI:31460
  - CHEBI:50456
  notes: Acylation of N-hydroxycadaverine with acetyl-CoA and succinyl-CoA followed
    by ATP-dependent trimerization and terminal N-acetylation to yield desferrioxamine
    D1 (N-acetyl-desferrioxamine B).
  evidence:
  - reference: DOI:10.1002/hlca.19600430651
    evidence_type: PRIMARY_EXPERIMENT
    notes: Structural characterization of ferrioxamine D1 as N-acetyl-ferrioxamine
      B co-produced with ferrioxamine B in Streptomyces pilosus.
  - reference: PMID:15600304
    evidence_type: PRIMARY_EXPERIMENT
    notes: DesC accepts both acetyl-CoA and succinyl-CoA to generate the acyl-N-hydroxycadaverine
      building blocks assembled by DesD.
