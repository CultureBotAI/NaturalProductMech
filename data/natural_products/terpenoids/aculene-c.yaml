definition: A sesquiterpenoid that is 8,8a-dihydroazulen-1(7H)-one substituted by
  an ethyl, methyl, hydroxy and methyl groups at positions 3, 6, 8S, and 8aR, respectively.
  It is a fungal metabolite isolated from Penicillium sp. SCS-KFD08 and Aspergillus
  aculeatus.
