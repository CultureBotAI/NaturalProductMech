definition: A trichothecene mycotoxin that is deoxynivalenol acetylated on the oxygen
  at C-15. A skin and eye irritant, along with its 3-acetyl regioisomer and its parent
  deoxynivalenol it is considered among the most commonly and widely distributed cereal
  contaminants.
