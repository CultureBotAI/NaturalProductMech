discussions:
- discussion_id: name-disagreement
  kind: CONTROVERSY
  status: OPEN
  prompt: ChEBI calls this structure 'β-carotene' and MIBiG calls it 'β-carotein'.
    They share a Standard InChIKey, so if the names denote different compounds then
    one upstream record has the wrong structure. Check which.
- discussion_id: unnamed-producer
  kind: CURATION_TODO
  status: OPEN
  prompt: 'No producer claim is written from BGC0000646, which gives NCBITaxon:77133
    (uncultured bacterium — shared by every unplaced bacterium), because the taxon
    names no single organism. The cluster is kept: a characterized locus is an origin
    assertion whether or not its host has a name, and for a compound from an uncultured
    symbiont that is the honest state. Name the producer if the primary literature
    does.'
