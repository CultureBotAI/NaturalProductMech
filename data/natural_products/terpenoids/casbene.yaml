- step_number: 1
  enzyme_id: UniProtKB:P59287
  enzyme_label: Ricinus communis casbene synthase
  reaction_id: RHEA:14901
  substrate: CHEBI:58756
  product: CHEBI:17695
  products:
  - CHEBI:17695
  - CHEBI:33019
  notes: Ricinus communis casbene synthase cyclizes (2E,6E,10E)-geranylgeranyl diphosphate
    to casbene. The seeded BGC0002723 locus is from Jatropha curcas and carries NP_001292945.1
    and XP_012066853.1, so it is not used here as exact UniProtKB:P59287 locus evidence.
  evidence:
  - reference: DOI:10.1006/abbi.1996.0559
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Casbene synthase catalyzes the cyclization of geranylgeranyl diphosphate
      (2) to casbene (1)
    notes: Hill et al. expressed Ricinus communis casbene synthase in E. coli and
      characterized the recombinant enzyme by kinetic and product analysis.
  - reference: DOI:10.1073/pnas.91.18.8497
    evidence_type: PRIMARY_EXPERIMENT
    snippet: A near-full-length casbene synthase cDNA clone, pCS7, was isolated
    notes: Mau and West cloned the Ricinus communis casbene synthase cDNA as GenBank
      L32134, and its open reading frame encodes the same 601 aa length as reviewed
      UniProtKB:P59287.
  - reference: https://www.uniprot.org/uniprotkb/P59287
    evidence_type: DATABASE_ASSERTION
    snippet: Catalyzes the cyclization of geranylgeranyl diphosphate to casbene
    retrieved_on: '2026-09-30'
    notes: Reviewed UniProtKB:P59287 is the 601 aa Ricinus communis chloroplastic
      casbene synthase, cross-references the L32134 mRNA and the EQ973781 genomic
      protein EEF48743.1, and annotates RHEA:14901.
  - reference: https://ftp.expasy.org/databases/rhea/tsv/rhea2uniprot_sprot.tsv
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-30'
    notes: The Rhea Swiss-Prot mapping links RHEA:14901 to UniProtKB:P59287.
