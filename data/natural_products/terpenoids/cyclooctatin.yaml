biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:C9K1X5
  enzyme_label: CotB2
  reaction_id: RHEA:41628
  notes: CotB2 cyclizes geranylgeranyl diphosphate to cyclooctat-9-en-7-ol, the first
    committed diterpene cyclization in cyclooctatin biosynthesis.
  evidence:
  - reference: DOI:10.1016/j.chembiol.2009.06.007
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Incubation of the recombinant CotB2 with GGDP resulted in the formation
      of cyclooctat-9-en-7-ol
    notes: Kim et al. cloned the Streptomyces melanosporofaciens MI614-43F2 cyclooctatin
      locus and assigned CotB2 to the GGDP to cyclooctat-9-en-7-ol cyclization in
      vitro.
  - reference: https://www.uniprot.org/uniprotkb/C9K1X5
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: UniProtKB:C9K1X5 is the reviewed Streptomyces melanosporofaciens CotB2
      entry, maps to EMBL AB448947 protein BAI44338.1, and annotates RHEA:41628.
  - reference: https://www.ncbi.nlm.nih.gov/protein/BAI44338.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept BAI44338.1 is the AB448947.1 geranylgeranyl diphosphate cyclase
      coding sequence from the Streptomyces melanosporofaciens MI614-43F2 cyclooctatin
      locus.
  substrate: CHEBI:57533
  product: CHEBI:78352
- step_number: 2
  enzyme_id: UniProtKB:C9K1X6
  enzyme_label: CotB3 cyclooctat-9-en-7-ol 5-monooxygenase
  reaction_id: RHEA:56820
  substrate: CHEBI:78352
  product: CHEBI:141020
  notes: CotB3 performs the first P450 hydroxylation downstream of CotB2, converting
    cyclooctat-9-en-7-ol to cyclooctat-9-ene-5,7-diol.
  evidence:
  - reference: DOI:10.1016/j.chembiol.2009.06.007
    evidence_type: PRIMARY_EXPERIMENT
    snippet: complete cyclooctatin biosynthetic gene cluster consists of four genes,
      cotB1 to cotB4
    notes: Kim et al. cloned the Streptomyces melanosporofaciens MI614-43F2 cyclooctatin
      locus, heterologously produced cyclooctatin in Streptomyces albus, and assigned
      the minimal cotB1-cotB4 cluster to GGDP synthesis, CotB2 cyclization, and two
      cytochrome P450 hydroxylations.
  - reference: DOI:10.1186/s12934-016-0487-6
    evidence_type: PRIMARY_EXPERIMENT
    snippet: 100 μM of cyclooctat-9-en-7-ol (CotB3) or cyclooct-9-en-5,7-diol (CotB4)
    notes: Gorner et al. reconstituted CotB3 and CotB4 activity with heterologous
      redox partners in Escherichia coli and measured conversion of cyclooctat-9-en-7-ol
      by CotB3 and cyclooctat-9-en-5,7-diol by CotB4.
  - reference: https://www.uniprot.org/uniprotkb/C9K1X6
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: UniProtKB:C9K1X6 is the reviewed Streptomyces melanosporofaciens CotB3
      entry, maps to EMBL AB448947 protein BAI44339.1, and annotates RHEA:56820 for
      cyclooctat-9-en-7-ol 5-monooxygenase activity.
  - reference: https://www.ncbi.nlm.nih.gov/protein/BAI44339.1
    evidence_type: DATABASE_ASSERTION
    snippet: product="P450"
    retrieved_on: '2026-09-28'
    notes: NCBI GenPept BAI44339.1 is the AB448947.1 CotB3 P450 coding sequence from
      the Streptomyces melanosporofaciens MI614-43F2 cyclooctatin locus.
- step_number: 3
  enzyme_id: UniProtKB:C9K1X7
  enzyme_label: CotB4 cyclooctatin synthase
  reaction_id: RHEA:56824
  substrate: CHEBI:141020
  product: CHEBI:78370
  notes: CotB4 performs the terminal C-18 P450 hydroxylation from cyclooctat-9-ene-5,7-diol
    to cyclooctatin. CHEBI:78370 is the stereocomplete Rhea product; the NaturalProductRecord
    remains grounded to the partial-stereo MIBiG structure pending a record-level
    stereochemistry review.
  evidence:
