  - reference: DOI:10.1186/s12934-016-0487-6
    evidence_type: PRIMARY_EXPERIMENT
    snippet: 100 μM of cyclooctat-9-en-7-ol (CotB3) or cyclooct-9-en-5,7-diol (CotB4)
