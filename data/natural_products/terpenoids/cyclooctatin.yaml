  - reference: https://www.uniprot.org/uniprotkb/C9K1X7
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-28'
    notes: UniProtKB:C9K1X7 is the reviewed Streptomyces melanosporofaciens CotB4
      entry, maps to EMBL AB448947 protein BAI44340.1, and annotates RHEA:56824 for
      cyclooctatin synthase activity.
  - reference: https://www.ncbi.nlm.nih.gov/protein/BAI44340.1
