biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q9K499
  enzyme_label: Cyc1 epi-isozizaene synthase
  reaction_id: RHEA:25992
  notes: Cyc1/SCO5222 cyclizes (2E,6E)-farnesyl diphosphate to the (+)-epi-isozizaene
    committed intermediate in albaflavenone biosynthesis.
  evidence:
  - reference: DOI:10.1021/ja061292s
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Molecular cloning and characterization of a new sesquiterpene synthase
    notes: UniProtKB:Q9K499 resolves to the Streptomyces coelicolor A3(2) cyc1/SCO5222
      gene product, maps to EMBL AL939123 protein CAB94607.1, and annotates RHEA:25992
      for (+)-epi-isozizaene formation.
  substrate: CHEBI:175763
  product: CHEBI:51458
- step_number: 2
  enzyme_id: UniProtKB:Q9K498
  enzyme_label: CYP170A1 albaflavenone monooxygenase
  reaction_id: RHEA:32440
  notes: CYP170A1/SCO5223 oxidizes (+)-epi-isozizaene through albaflavenol intermediates
    to albaflavenone.
  evidence:
  - reference: DOI:10.1074/JBC.M710421200
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Biosynthesis of the sesquiterpene antibiotic albaflavenone in Streptomyces
      coelicolor A3(2)
    notes: UniProtKB:Q9K498 resolves to the adjacent Streptomyces coelicolor A3(2)
      SCO5223 gene product, maps to EMBL AL939123 protein CAB94608.1, and annotates
      the composite left-to-right RHEA:32440 reaction for CYP170A1 oxidation of (+)-epi-isozizaene
      to albaflavenone.
  substrate: CHEBI:51458
  product: CHEBI:51460
