biosynthetic_pathway:
- step_number: 1
  enzyme_label: SodC SAM-dependent C-methyltransferase and cyclase
  substrates:
  - CHEBI:175763
  - CHEBI:59789
  notes: SodC methylates and cyclizes (2E,6E)-farnesyl diphosphate to pre-sodorifen
    diphosphate. The exact intermediate is left out of the structured product field
    because no exact stable chemical CURIE was selected. SodC is left without enzyme_id
    because no UniProtKB accession resolved for exact GenPept accession AGO55050.1.
  evidence:
  - reference: DOI:10.1021/jacs.8b08510
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Methylation and Cyclization of MEP-Derived Farnesyl Pyrophosphate
    notes: von Reuss et al. reconstituted Serratia plymuthica 4Rx13 SodC in vitro
      and placed the SAM-dependent C-methyltransferase upstream of SodD in the conversion
      of (2E,6E)-farnesyl diphosphate toward pre-sodorifen diphosphate.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001361.3/BGC0001361.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0001361.3 places the Serratia plymuthica 4Rx13 SOD_c20760 CDS
      at complement(11196..12173) in the BGC GenBank row with protein_id AGO55050.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AGO55050.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: NCBI GenPept AGO55050.1 is the Serratia plymuthica 4Rx13 SOD_c20760 sequence
      assigned here to SodC; no UniProtKB entry resolved for this accession or locus.
- step_number: 2
  enzyme_label: SodD terpene cyclase
  product: naturalproductmech:mibig-0ea28266f1
  notes: SodD consumes pre-sodorifen diphosphate to form sodorifen. The intermediate
    is left out of the structured substrate field because no exact stable chemical
    CURIE was selected. SodD is left without enzyme_id because no UniProtKB accession
    resolved for exact GenPept accession AGO55049.1.
  evidence:
  - reference: DOI:10.1021/jacs.8b08510
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Methylation and Cyclization of MEP-Derived Farnesyl Pyrophosphate
    notes: von Reuss et al. reconstituted Serratia plymuthica 4Rx13 SodD in vitro
      and placed the terpene cyclase downstream of SodC in the conversion of pre-sodorifen
      diphosphate to sodorifen.
  - reference: DOI:10.1093/femsle/fnw139
    evidence_type: PRIMARY_EXPERIMENT
    notes: Domik et al. assigned SOD_c20750 to the four-gene sodorifen biosynthetic
      cluster and used knockouts in Serratia plymuthica 4Rx13 to support its role
      in sodorifen production.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0001361.3/BGC0001361.gbk
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-10-01'
    notes: MIBiG BGC0001361.3 places the Serratia plymuthica 4Rx13 SOD_c20750 CDS
