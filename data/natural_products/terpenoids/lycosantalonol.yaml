    predicate: was_profiled_in
    object: comparison
    notes: Hexane extracts of whole petiolules from all three selected plants had
      source-assigned lycosantalonol peaks. Figure4 displays selected-ion traces and
      a standard comparison. In S2, peak4 from chromatogramD has a dominant m/z69
      signal rather than the dominant m/z109 in B, C and standardE; the cause of that
      relative-pattern difference is unresolved. The source's three-plant assignment
      is retained, not independently confirmed for each plant or used as exact stereochemical
      proof. The tissue-ratio experiment in Table1 measured lycosantalene, not lycosantalonol.
    evidence:
    - reference: DOI:10.1371/journal.pone.0119302
