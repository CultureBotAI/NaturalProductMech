definition: A pentacyclic triterpenoid that is lupane in which the hydrogen at the
  3β position is substituted by a hydroxy group. It occurs in the skin of lupin seeds,
  as well as in the latex of fig trees and of rubber plants. It is also found in many
  edible fruits and vegetables.
