definition: A tetracyclic diterpenoid that has an tetradecahydro-8,11a-methanocyclohepta[a]naphthalene
  skeleton with two hydroxymethyl substituents at positions 4 and 9, two methyl substituents
  at positions 4 and 11b and two hydroxy substituents at positions 3 and 9. An antibiotic
  with antiviral and antimitotical properties. Aphidicolin is a reversible inhibitor
  of eukaryotic nuclear DNA replication.
