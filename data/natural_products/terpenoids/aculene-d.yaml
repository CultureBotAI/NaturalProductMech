definition: A sesquiterpenoid that is (3aR)-4,7,8,8a-tetrahydroazulen-1(3aH)-one substituted
  by an ethyl, methyl, hydroxy and methyl groups at positions 3, 6, 8S, and 8aR, respectively.
  It is a fungal metabolite isolated from Penicillium sp. SCS-KFD08 and Aspergillus
  aculeatus.
