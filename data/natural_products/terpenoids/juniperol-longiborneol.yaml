biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:I1S104
  enzyme_label: CLM1 longiborneol synthase
  substrate: CHEBI:175763
  product: naturalproductmech:mibig-390b0e4f55
  notes: CLM1/FGSG_10397 cyclizes (2E,6E)-farnesyl diphosphate to the longiborneol
    represented by this MIBiG record. RHEA:83907 is not used here because it fixes
    (-)-longiborneol, while this record leaves several longiborneol stereocenters
    unspecified.
  evidence:
  - reference: DOI:10.1128/AEM.02017-09
    evidence_type: PRIMARY_EXPERIMENT
    snippet: resulted in the production of a sesquiterpene alcohol, longiborneol
    notes: McCormick et al. expressed fg10397/CLM1 in Saccharomyces cerevisiae and
      identified longiborneol by GC-MS/NMR; disruption and add-back experiments tied
      the gene to culmorin biosynthesis.
  - reference: https://mibig.secondarymetabolites.org/repository/BGC0002176.3/
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: MIBiG BGC0002176.3 places FGSG_10397 / ESU17105.1 in the Fusarium graminearum
      PH-1 culmorin/(+)-juniperol(longiborneol) BGC at CM000574.1:10717529-10718727.
  - reference: https://www.uniprot.org/uniprotkb/I1S104
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-29'
    notes: UniProtKB reviewed entry I1S104 resolves to the 339 aa Fusarium graminearum
      PH-1 longiborneol synthase CLM1 and annotates the farnesyl-diphosphate cyclization
      from PMID:19880637.
  - reference: https://www.ncbi.nlm.nih.gov/gene/23557306
