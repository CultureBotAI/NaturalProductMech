biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:A0A7U3MPB9
  enzyme_label: 6-protoilludene synthase
  reaction_id: RHEA:34695
  notes: Armillaria gallica Pro1 cyclizes (2E,6E)-farnesyl diphosphate to Delta(6)-protoilludene.
    UniProtKB:A0A7U3MPB9 resolves to the BGC0002445 MT277003.1 Pro1 sequence, while
    the earlier functional assay established A. gallica Pro1 sesquiterpene synthase
    activity.
  evidence:
  - reference: DOI:10.1074/jbc.M110.165845
    evidence_type: PRIMARY_EXPERIMENT
    snippet: farnesyl diphosphate to produce protoilludene
    notes: The earlier A. gallica Pro1 cDNA study experimentally established that
      Pro1 catalyzes farnesyl diphosphate cyclization to Delta(6)-protoilludene.
  - reference: DOI:10.1007/s00253-020-11006-y
    evidence_type: PRIMARY_EXPERIMENT
    notes: The Armillaria BGC study identified the MT277003.1 gene cluster and annotated
      GenPept QJQ03973.1 as the BGC0002445 Pro1 protein.
  - reference: mibig:BGC0002445
    evidence_type: DATABASE_ASSERTION
    notes: MIBiG BGC0002445 links the Armillaria gallica MT277003.1 terpene biosynthesis
      cluster to 8α-hydroxy-6-protoilludene by heterologous expression.
  - reference: https://www.ncbi.nlm.nih.gov/protein/QJQ03973.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI resolves GenPept QJQ03973.1 to the MT277003.1 coding sequence for
      the Armillaria gallica 6-protoilludene synthase Pro1.
  substrate: CHEBI:175763
  product: CHEBI:68655
