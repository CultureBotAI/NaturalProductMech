  enzyme_id: UniProtKB:A0A7S5T363
  enzyme_label: CYP-Arm3
  notes: Armillaria gallica CYP-Arm3 hydroxylates Delta(6)-protoilludene to 8α-hydroxy-6-protoilludene.
