    retrieved_on: '2026-09-27'
    notes: UniProtKB:B6HFX8 resolves PchDS to the reviewed Penicillium rubens Pc20g10860
      protein and maps it to EMBL AM920435 protein CAP86415.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAP86415.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept CAP86415.1 is the AM920435.1 Pc20g10860 coding sequence cross-referenced
