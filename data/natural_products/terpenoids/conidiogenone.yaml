biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:B6HFX8
  enzyme_label: PchDS
  reaction_id: RHEA:17653
  notes: The C-terminal prenyltransferase domain of PchDS condenses isopentenyl diphosphate
    with (2E,6E)-farnesyl diphosphate to form (2E,6E,10E)-geranylgeranyl diphosphate
    in the conidiogenone pathway.
  evidence:
  - reference: DOI:10.1080/09168451.2018.1536518
    evidence_type: PRIMARY_EXPERIMENT
    notes: Shiina et al. experimentally characterized the Penicillium rubens Wisconsin
      54-1255 bifunctional diterpene synthase PchDS/Pc20g10860 that produces the conidiogenone
      precursor deoxyconidiogenol.
  - reference: https://www.uniprot.org/uniprotkb/B6HFX8
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: UniProtKB:B6HFX8 resolves PchDS to the reviewed Penicillium rubens Pc20g10860
      protein and maps it to EMBL AM920435 protein CAP86415.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAP86415.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept CAP86415.1 is the AM920435.1 Pc20g10860 coding sequence cross-referenced
      from UniProtKB:B6HFX8.
  substrate: CHEBI:175763
  product: CHEBI:58756
- step_number: 2
  enzyme_id: UniProtKB:B6HFX8
  enzyme_label: PchDS
  notes: The N-terminal terpene cyclase domain of PchDS cyclizes (2E,6E,10E)-geranylgeranyl
    diphosphate to deoxyconidiogenol.
  evidence:
  - reference: DOI:10.1080/09168451.2018.1536518
    evidence_type: PRIMARY_EXPERIMENT
    notes: Shiina et al. experimentally characterized the Penicillium rubens Wisconsin
      54-1255 bifunctional diterpene synthase PchDS/Pc20g10860 that produces the conidiogenone
      precursor deoxyconidiogenol.
  - reference: https://www.uniprot.org/uniprotkb/B6HFX8
