- step_number: 3
  enzyme_id: UniProtKB:B6HFX9
  enzyme_label: PchP450
  proposed: true
  notes: PchP450 is the Pc20g10870 P450 homolog proposed to catalyze the deoxyconidiogenol-to-conidiogenone
    oxidation in the Penicillium rubens AM920435.1 locus; the exact two-round oxidation
    was assayed with the Penicillium roqueforti PrP450 homolog, not directly with
    PchP450.
  evidence:
  - reference: DOI:10.1080/09168451.2018.1536518
    evidence_type: PRIMARY_EXPERIMENT
    notes: Shiina et al. identified PchP450/Pc20g10870 in the Penicillium rubens Wisconsin
      54-1255 locus as the P450 homolog corresponding to the experimentally assayed
      PrP450 conidiogenone synthase.
  - reference: https://www.uniprot.org/uniprotkb/B6HFX9
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: UniProtKB:B6HFX9 resolves PchP450 to the reviewed Penicillium rubens Pc20g10870
      protein, maps it to EMBL AM920435 protein CAP86416.1, and infers the conidiogenone
      oxidation function from the assayed Penicillium roqueforti PrP450 homolog.
  - reference: https://www.ncbi.nlm.nih.gov/protein/CAP86416.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept CAP86416.1 is the AM920435.1 Pc20g10870 coding sequence cross-referenced
      from UniProtKB:B6HFX9.
