      and reported 2-oxoglutarate- and Fe(2+)-dependent oxidation of pentalenolactone
      D to pentalenolactones E and F; native pntD mutants accumulated pentalenolactone
      D and lost pentalenolactone, pentalenolactone E and pentalenolactone F.
