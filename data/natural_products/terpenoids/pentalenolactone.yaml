- step_number: 10
  enzyme_id: UniProtKB:E3VWI7
  enzyme_label: Pentalenolactone D synthase
  reaction_id: RHEA:34635
  notes: Streptomyces arenae PntE catalyzes the flavin-dependent Baeyer-Villiger oxidation
    of 1-deoxy-11-oxopentalenate to pentalenolactone D; PntD-catalyzed formation of
    pentalenolactone F is represented separately.
  evidence:
  - reference: DOI:10.1021/bi1019786
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Recombinant enzymes PenE and PntE, from S. exfoliatus and S. arenae,
      respectively, catalyze the flavin-dependent Baeyer-Villiger oxidation of 1-deoxy-11-oxopentalenic
      acid (7) to pentalenolactone D (8)
    notes: Seo et al. biochemically tested the Streptomyces arenae Tu469 PntE enzyme
      and placed the Baeyer-Villiger oxidation upstream of the PntD and PntM steps
      toward pentalenolactone.
  - reference: https://mite.lisc.univie.ac.at/repository/MITE0000057
