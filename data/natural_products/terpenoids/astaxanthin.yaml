np_pathway: TERPENOIDS
definition: A carotenone that consists of β,β-carotene-4,4'-dione bearing two hydroxy
  substituents at positions 3 and 3' (the 3S,3'S diastereomer). A carotenoid pigment
  found mainly in animals (crustaceans, echinoderms) but also occurring in plants.
  It can occur free (as a red pigment), as an ester, or as a blue, brown or green
  chromoprotein.
definition_source: CHEBI:40968
synonyms:
- value: (2R,3S,3'S)-2-hydroxyastaxanthin
