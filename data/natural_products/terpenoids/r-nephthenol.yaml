  enzyme_label: SteTC1
  reaction_id: RHEA:42992
  notes: SteTC1 cyclizes (2E,6E,10E)-geranylgeranyl diphosphate to (R)-nephthenol.
    The assayed Stereum hirsutum FP-91666 SS1 protein is tracked by GenPept EIM84824.1,
    provisional RefSeq XP_007305993.1, locus tag STEHIDRAFT_122776, and JGI model
    Stehi1_122776; no exact UniProtKB entry was available for these accessions or
    the SteTC1 alias at curation time.
  evidence:
  - reference: DOI:10.1016/j.fgb.2019.03.007
    evidence_type: PRIMARY_EXPERIMENT
    snippet: first fungal cembrane diterpene synthase
    notes: Li et al. functionally characterized Stereum hirsutum SteTC1 as a cembrane
      diterpene synthase.
  - reference: mibig:BGC0002219
    evidence_type: DATABASE_ASSERTION
    notes: MIBiG BGC0002219 links the Stereum hirsutum FP-91666 SS1 locus on GenBank
      JH687388.1 to (-)-(R)-nephthenol by heterologous expression.
  - reference: https://www.ncbi.nlm.nih.gov/protein/XP_007305993.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI resolves Stereum hirsutum XP_007305993.1 to locus tag STEHIDRAFT_122776
      and JGI model Stehi1_122776, and describes it as a provisional RefSeq identical
      to GenPept EIM84824.1.
