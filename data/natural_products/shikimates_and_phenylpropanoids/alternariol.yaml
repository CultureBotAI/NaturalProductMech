definition: A benzochromenone that is 6H-benzo[c]chromen-6-one which is substituted
  by a methyl group at position 1 and by hydroxy groups at positions 3, 7, and 9.
  It is the most important mycotoxin produced by the black mould Alternaria species,
  which are the most common mycoflora infecting small grain cereals worldwide.
