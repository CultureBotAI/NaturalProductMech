biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:V4HJ73
  enzyme_label: Bmp7
  product: naturalproductmech:mibig-005498ea51
  notes: Bmp7 is the Pseudoalteromonas luteoviolacea 2ta16 cytochrome P450 that catalyzes
    oxidative heterocoupling of a bromophenol and bromopyrrole to pentabromopseudilin.
    The exact local record product is captured here; the substrates 2,4-dibromophenol
    and 2,3,4-tribromopyrrole are left in the graph because the PathwayStep slot accepts
    one substrate CURIE and 2,3,4-tribromopyrrole has no local curated CURIE.
  evidence:
  - reference: DOI:10.1038/nchembio.1564
    evidence_type: PRIMARY_EXPERIMENT
    snippet: We confirmed the enzymatic synthesis of 3
    notes: Agarwal et al. assayed purified Pseudoalteromonas luteoviolacea 2ta16 Bmp7
      with 2,4-dibromophenol, 2,3,4-tribromopyrrole, Bmp9, Bmp10 and NADH, then confirmed
      enzymatic synthesis of pentabromopseudilin by comparison to an authentic standard.
  - reference: UniProtKB:V4HJ73
    evidence_type: DATABASE_ASSERTION
    snippet: DR   EMBL; AUSV01000133; ESP90850.1; -; Genomic_DNA.
    notes: UniProtKB:V4HJ73 is reviewed Pseudoalteromonas luteoviolacea 2ta16 Bmp7/PL2TA16_01241
      and cites DOI:10.1038/nchembio.1564.
  - reference: NCBI_Nuccore:AUSV01000133.1
    evidence_type: DATABASE_ASSERTION
    snippet: /locus_tag="PL2TA16_01241"
    notes: GenBank places cytochrome P450 GenPept ESP90850.1 at AUSV01000133.1:42270..43745
      inside the BGC0000891 interval.
  - reference: NCBI_Protein:ESP90850.1
    evidence_type: DATABASE_ASSERTION
    snippet: /product="cytochrome P450"
    notes: ESP90850.1 is encoded by PL2TA16_01241, the GenBank CDS that maps to UniProtKB:V4HJ73.
  - reference: mibig:BGC0000891
    evidence_type: DATABASE_ASSERTION
    notes: MIBiG BGC0000891 records pentabromopseudilin for the AUSV01000133.1:32483..43745
      locus.
