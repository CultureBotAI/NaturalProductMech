np_pathway: SHIKIMATES_AND_PHENYLPROPANOIDS
definition: A phenylalanine derivative resulting from the formal condensation of the
  amino group of L-phenylalanine with the carboxy group of (3R)-5-chloro-8-hydroxy-3-methyl-1-oxo-3,4-dihydro-1H-2-benzopyran-7-carboxylic
  acid (ochratoxin α). It is among the most widely occurring food-contaminating mycotoxins,
  produced by Aspergillus ochraceus, Aspergillus carbonarius and Penicillium verrucosum.
