  edges:
  - subject: gene
    predicate: has_current_deposited_translation
    object: current
    notes: AF235050.4 couL/AAG29784.2 at 10634..12223(+) is a 1590-nt CDS including
      stop. CDS-aware table-11 translation exactly matches deposited protein and 529-aa
      Q9F8U8. The strain is DSM 40489, S. rishiriensis taxon 68264. Other gene-name
      search hits from Rhodococcus are not selected.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: DATABASE_ASSERTION
      notes: Current native CDS and strain.
    - reference: https://www.uniprot.org/uniprotkb/Q9F8U8
      evidence_type: DATABASE_ASSERTION
      notes: Unreviewed entry 59, sequence 2; sequence date 2011-11-16, annotation
        2026-09-02, retrieved 2026-10-04.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: CURATOR_INFERENCE
      notes: Exact CDS-aware/deposited/UniProt sequence agreement.
  - subject: gene
    predicate: has_historical_deposited_translation
    object: historical
    notes: AF235050.3 couL/AAG29784.1 at 10632..12221(+) is also 1590 nt including
      stop. Its CDS-aware translation, historical GenPept record and complete 529-aa
      CouL alignment in Figure III-16 agree. A printed alignment is reported sequence
      evidence, not sequencing of the experimental pMS90 sample.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.3
      evidence_type: DATABASE_ASSERTION
      notes: Historical native CDS.
    - reference: https://www.ncbi.nlm.nih.gov/protein/AAG29784.1
      evidence_type: DATABASE_ASSERTION
      notes: Historical protein record, replaced by version 2 on 2011-09-21.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48521/pdf/Dissertation_ESchmutz.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Complete printed alignment, Figure III-16, PDF p.103.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.3
      evidence_type: CURATOR_INFERENCE
      notes: Exact historical CDS/protein/printed alignment comparison.
  - subject: historical
    predicate: differs_in_deposit_version_from
    object: current
    notes: Historical residues Arg384/Ala385 are Glu384/Gly385 in the current deposit;
      the remaining 527 residues agree. These are deposit-version differences, not
      proof of two biological alleles or identification of the internal sequence of
      the measured recombinant protein.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.3
      evidence_type: DATABASE_ASSERTION
      notes: Historical sequence in version comparison.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: CURATOR_INFERENCE
      notes: Exact 529-aa comparison gives R384E and A385G only.
  - subject: prep
    predicate: was_constructed_from
    object: gene
    notes: The pZW11 subclone of cosmid 4-2H supplied couL for SphI/BglII cloning
      into pQE70 to make pMS90 (5010 bp in the thesis map), with a reported C-terminal
      His6 tag. Literal primers are couL-1 TAGTCACTGCATGCCGAACAGGGAC and couL-2 TGACTCAGATCTCCTGTCCACCAG.
      Their unique 3-prime matches extrapolate to 10622..10646(+) and 12230..12207(-)
      on AF235050.3, shifted +2 nt on AF235050.4. Both 1609-nt literal-primer models
      predict GTG-to-ATG start recoding, Ala2Pro in the native-length core, and TGA-to-AGA
      stop replacement. These models do not sequence the full fusion or select which
      internal 384/385 version was present in the experimental sample.
    evidence:
    - reference: DOI:10.1046/j.1432-1033.2003.03830.x
      evidence_type: PRIMARY_EXPERIMENT
      notes: Cloning and expression of CouL.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48521/pdf/Dissertation_ESchmutz.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primers and Figure III-17, PDF p.104.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.3
      evidence_type: CURATOR_INFERENCE
      notes: Historical literal-primer reconstruction.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF235050.4
      evidence_type: CURATOR_INFERENCE
      notes: Current literal-primer reconstruction.
  - subject: host
    predicate: expressed
    object: prep
    notes: The thesis describes 100 mL LB, 50 ug/mL carbenicillin, 30 C and 170 rpm,
      induction at OD600 0.7-0.8 with 0.5 mM IPTG and three hours expression. This
      host prepares a biosynthetic protein; it is not reported as producing mature
      coumermycin A1 in this experiment.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/handle/10900/48521/pdf/Dissertation_ESchmutz.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Expression method, PDF p.61.
    - reference: DOI:10.1046/j.1432-1033.2003.03830.x
      evidence_type: PRIMARY_EXPERIMENT
      notes: Cloning, overexpression and purification.
  - subject: prep
    predicate: has_purification_readouts
    object: purification
    notes: Ni-NTA yielded a near-homogeneous band near 60 kDa (calculated tagged mass
      58.9 kDa). The paper reports 8-9% of total soluble protein, whereas the thesis
      reports 10-11% and 21 mg/L culture. These remain source-specific yield statements,
      not harmonized purity percentages, assay concentrations or native abundance.
    evidence:
    - reference: DOI:10.1046/j.1432-1033.2003.03830.x
