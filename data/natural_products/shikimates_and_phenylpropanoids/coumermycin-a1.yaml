causal_graphs:
- graph_id: coumermycin-a1-coul-recombinant-amide-formation
  scope: BIOSYNTHESIS
  description: 'CouL native sequence versions and recombinant amide formation (review
    #549), from Schmutz 2003 and the corresponding primary paper. Current Q9F8U8 is
    not assigned as the uniquely identified 2003 assay sequence. Native deposits,
    the printed historical alignment and the His6 preparation remain distinct. Measured
    monoamide/diamide formation is not mature glycosylated coumermycin A1 synthesis.
    Conditional kinetics, conflicting assay units, unresolved monoamide regiochemistry
    and inferred adenylate/amide order are explicit. Schmutz PDF pages exceed printed
    pages by ten.'
