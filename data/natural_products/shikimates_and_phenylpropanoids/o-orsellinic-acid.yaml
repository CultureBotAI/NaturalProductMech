discussions:
- discussion_id: name-disagreement
  kind: CONTROVERSY
  status: OPEN
  prompt: ChEBI calls this structure 'o-orsellinic acid' and MIBiG calls it 'Orsellinic
    acid', 'orsellinic acid'. They share a Standard InChIKey, so if the names denote
    different compounds then one upstream record has the wrong structure. Check which.
- discussion_id: shared-structure
  kind: CURATION_TODO
  status: OPEN
  prompt: 'This structure is reported by more than one MIBiG entry: BGC0000057, BGC0002212,
    BGC0002594, BGC0002596, BGC0002812. Confirm they describe the same compound rather
    than an upstream cross-reference error.'
biosynthetic_pathway:
- step_number: 1
  enzyme_id: UniProtKB:Q5AUX1
  enzyme_label: OrsA
  reaction_id: RHEA:62973
  product: CHEBI:16162
  notes: This curates the Aspergillus nidulans FGSC A4 non-reducing polyketide synthase
    OrsA from the BGC0000057/AACD01000135.1 route; OrsA condenses acetyl-CoA with
    three malonyl-CoA units to form o-orsellinate, the physiological conjugate base
    of the record compound o-orsellinic acid.
  evidence:
  - reference: DOI:10.1039/b904541d
    evidence_type: PRIMARY_EXPERIMENT
    snippet: the polyketide synthase alone is required for orsellinic acid biosynthesis
    notes: Sanchez et al. used targeted deletions in Aspergillus nidulans and found
      that OrsA, the polyketide synthase encoded in the Ors/F9775 cluster, is sufficient
      for o-orsellinic acid biosynthesis.
  - reference: DOI:10.1073/pnas.0901870106
    evidence_type: PRIMARY_EXPERIMENT
    snippet: one induced gene cluster codes for the long-sought after polyketide synthase
    notes: Schroeckh et al. identified the bacterium-induced Aspergillus nidulans
      orsellinic acid/F9775 cluster and genetically connected its polyketide synthase
      to production of orsellinic acid and related products.
  - reference: https://www.uniprot.org/uniprotkb/Q5AUX1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: Reviewed UniProtKB:Q5AUX1 is the Aspergillus nidulans FGSC A4 OrsA orsellinic
      acid synthase, length 2103 aa, annotates the left-to-right physiological RHEA:62973
      reaction, and cross-references EMBL AACD01000135 protein EAA59563.1.
  - reference: https://www.ncbi.nlm.nih.gov/protein/EAA59563.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    notes: NCBI GenPept EAA59563.1 is locus_tag AN7909.2 from the BGC0000057 AACD01000135.1
      Aspergillus nidulans FGSC A4 locus and is sequence-identical to reviewed UniProtKB:Q5AUX1.
