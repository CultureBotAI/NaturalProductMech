- graph_id: clorobiocin-clol-recombinant-ligation
  scope: BIOSYNTHESIS
  description: 'Native CloL identity and recombinant ligation experiments from Galm
    2003 (review #548). The assayed C-terminal His6 preparation is distinct from native
    Q8GHC3; literal primers predict a substitution and conflict with a printed coordinate
    and construct-map stop label. Experiments use novobiocin ring B, not the chlorinated
    clorobiocin acceptor. Formation of novobiocic acid and selected analogues is not
    synthesis of mature clorobiocin. Existing CloQ evidence is unchanged. Galm PDF
    page numbers exceed printed pages by four; Schmutz PDF numbers exceed them by
    ten.'
