  edges:
  - subject: native
    predicate: is_native_sequence_reference_for
    object: construct
    notes: The source amplified novL from nov-BG1 into pGEM-T (pUM03), then pHis8
      (pUM07); it reports sequence verification. The full printed 527-aa NovL sequence
      matches deposited AAF67505.1 and Q9L9F6 exactly. The current deposit identifies
      NCIMB 9219, following the historical strain correction. No complete experimental
      vector sequence was independently inspected.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Construct tables and results, PDF pp.28-29,85,91.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: DATABASE_ASSERTION
      notes: Exact native CDS reference.
    - reference: https://www.uniprot.org/uniprotkb/Q9L9F6
      evidence_type: DATABASE_ASSERTION
      notes: Q9L9F6 entry 67, sequence 1, retrieved 2026-10-04.
    - reference: DOI:10.1128/genomeA.01146-13
      evidence_type: PRIMARY_EXPERIMENT
      notes: Indexed primary strain-correction text.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: CURATOR_INFERENCE
      notes: Exact printed/native sequence comparison.
  - subject: construct
    predicate: encodes_engineered_fusion
    object: tagged
    notes: Literal novLHis8_f TGGGATCCAACAAGGATCACGCACC and novLHis8_r TCGAATTCCCCACCTCACCTGTCCA
      reconstruct a 1600-nt PCR product and 1590-nt BamHI/EcoRI restriction fragment,
      as reported. Their unique 17-nt 3-prime matches extrapolate to 12507..12531(+)
      and 14106..14082(-). The model retains native residues 3-527 and the stop, replacing
      the native N terminus with vector-derived sequence. No native accession is assigned
      to this engineered protein.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Plasmid/primer tables and cloning methods, PDF pp.29,31,39,85.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: CURATOR_INFERENCE
      notes: Literal-primer model and CDS comparison; not a sequenced experimental
        fusion.
  - subject: host
    predicate: expressed
    object: tagged
    notes: The described preparation used 1 L TB medium, induction at OD600 0.6 with
      0.5 mM IPTG after cooling to 20 C, and six hours at 250 rpm. IMAC preceded further
      purification. A separate retained-His-tag preparation is reported at 40 mg/L
      culture and final 18 mg/mL, with a 59-kDa SDS-PAGE assignment; those values
      are not the cleaved-protein concentration.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 2.6 and Figure 3.25, PDF pp.43-45,88.
  - subject: tagged
    predicate: was_thrombin_processed_to
    object: cleaved
    notes: Thrombin treatment (0.1 U/mg, 15 h at 4 C), removal of tag and thrombin,
      and Superdex 200 purification yielded the crystallization preparation. The reported
      post-cleavage N terminus is GSHGGSNK..., with GSHGGS replacing native MA; cleavage
      therefore does not restore native Q9L9F6. Figure 3.22 shows induction, soluble
      fraction, affinity eluate, cleavage and final material. Table 3.5 gives 40 mg/L
      culture and final 19.5 mg/mL, not assay loading or antibiotic titer.
    evidence:
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
