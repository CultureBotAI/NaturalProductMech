- graph_id: cathomycin-novl-identity-and-precursor-ligation
  scope: BIOSYNTHESIS
  description: 'Deposited NovL identity and bounded novobiocic-acid precursor ligation
    (review #550). The MIBiG BGC0000834 cathomycin owner has one unspecified sugar
    stereocentre: its InChI /t23-,25+,26-,29? differs from the fully specified novobiocin
    CID 54675769 /t23-,25+,26-,29-. Their exact InChIKeys differ. Unglycosylated precursor
    assays neither resolve this centre nor establish synthesis of mature cathomycin/novobiocin.
    Q9L9F6 denotes the deposited native sequence, not a tagged preparation or a retrospectively
    identified historical sample. Galm 2003 direct experiments are distinct from the
    abstract-only 2000 paper. Galm PDF pages exceed printed pages by four; Metzger
    2010 PDF pages by twelve.'
