    predicate: contains
    object: gene
    notes: The owner is the MIBiG v5 cathomycin structure concept, not an exact-key
      merge with fully specified novobiocin. Its deposited cluster contains novL at
      12509..14092(+).
    evidence:
    - reference: https://mibig.secondarymetabolites.org/go/BGC0000834.5
      evidence_type: DATABASE_ASSERTION
      notes: MIBiG v5 compound/locus association, cited as a database assertion.
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: DATABASE_ASSERTION
      notes: Deposited novL CDS.
    - reference: https://pubchem.ncbi.nlm.nih.gov/compound/54675769
      evidence_type: DATABASE_ASSERTION
      notes: CID 54675769 InChI and InChIKey retrieved 2026-10-04; literal InChI comparison
        only, not independent stereochemical determination.
  - subject: gene
    predicate: encodes_native_protein
    object: native
    notes: AF170880.4/AAF67505.1 has a 1584-nt CDS including stop. CDS-aware table-11
      translation gives 527 aa exactly matching Q9L9F6 and the complete printed NovL
      alignment in Metzger Figure 3.27. Current GenBank source is S. niveus NCIMB
      9219. Flinspach et al. retested DSM 40088 (=9219) and DSM 40292 (=11891), then
      corrected the historical AF170880 strain attribution to 9219. The strains are
      not synonyms. The 2000 abstract names S. spheroides NCIMB 11891; this historical
      label does not uniquely establish the internal sequence or provenance of each
      recombinant sample.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: DATABASE_ASSERTION
      notes: Native deposited CDS and corrected source strain.
    - reference: https://www.uniprot.org/uniprotkb/Q9L9F6
      evidence_type: DATABASE_ASSERTION
      notes: Reviewed Q9L9F6, entry 67, sequence 1, taxon 193462; annotation 2026-09-02;
        retrieved 2026-10-04.
    - reference: https://publikationen.uni-tuebingen.de/xmlui/bitstream/10900/49469/1/pdf/Diss_Metzger_gesamt.pdf
      evidence_type: PRIMARY_EXPERIMENT
      notes: Figure 3.27, PDF p.91, all 527 NovL residues.
    - reference: DOI:10.1128/genomeA.01146-13
      evidence_type: PRIMARY_EXPERIMENT
      notes: 'Genome announcement: indexed primary main text inspected; direct PMC/publisher
        retrieval was restricted.'
    - reference: https://www.ncbi.nlm.nih.gov/nuccore/AF170880.4
      evidence_type: CURATOR_INFERENCE
      notes: Exact CDS/deposited/UniProt/printed-sequence comparison.
  - subject: prep
    predicate: was_constructed_from_novl
    object: gene
    notes: Galm reused pMS80, a reported 5.0-kb pQE70 construct. Table 13 describes
      a 1.6-kb SphI/BamHI insert, whereas the results say the existing pMS80/pMS90
      constructs were cloned in the same manner as the described SphI/BglII CloL construct.
      Preserve this source difference; no pMS80 junction sequence or primer-derived
      A2P substitution is asserted from the CloL/CouL constructs.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 13 and results section 2.3.1, PDF pp.39,90.
  - subject: host
    predicate: expressed
    object: prep
    notes: The source used 100 mL LB with 50 ug/mL carbenicillin, 30 C, 180 rpm, OD600
      0.7-0.8 at induction and 0.5 mM IPTG for three hours. These are heterologous
      protein-preparation conditions, not native antibiotic production measurements.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 8.1.1, PDF pp.60-61.
  - subject: prep
    predicate: has_purification_readout
    object: sds
    notes: Ni-NTA purification followed by Sephadex G-25 buffer exchange yielded the
      preparation. Figure 12 NovL lanes 1-5 show marker, pre-induction, post-induction,
      soluble protein and eluate. Near homogeneity is the source description, not
      a measured purity percentage or a native assembly determination.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 8.1.2 and Figure 12, PDF pp.61,91.
  - subject: prep
    predicate: catalyzes
    object: assay
    notes: Galm assays used 100 uL, 1 mM acid, 1 mM C-8-methylated ring B, 5 mM ATP,
      5 mM MnCl2, 50 mM Tris-HCl pH 8.0 and 0.5-2.0 ug enzyme for 30 min at 30 C,
      stopped with 5 uL 1.5 M trichloroacetic acid. UniProt RHEA:36699 describes unmethylated
      ring B and 8-desmethylnovobiocic acid; that reaction identifier is deliberately
      not assigned to this assay.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 8.4.1, PDF p.63.
    - reference: https://www.uniprot.org/uniprotkb/Q9L9F6
      evidence_type: DATABASE_ASSERTION
      notes: Catalytic-activity annotation inspected separately from the experimental
        substrate identity.
  - subject: acid
    predicate: is_acyl_substrate_for
    object: assay
    notes: DMAHB is the genuine acid substrate used for the NovL specific-activity
      measurement and its 100% panel reference.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results 2.3.2-2.4 and Figure 13, PDF pp.90-93.
  - subject: amine
    predicate: is_amino_substrate_for
    object: assay
    notes: The supplied aminocoumarin bears the C-8 methyl group. This in-vitro acceptance
      does not by itself establish the order of methylation and ligation in the native
      producer.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 8.4.1, PDF p.63.
  - subject: assay
    predicate: forms
    object: product
    notes: Products were extracted twice with ethyl acetate and analyzed by HPLC at
      305 nm. Quantitation used a novobiocic-acid standard calibration. The product
      is an unglycosylated precursor, not mature cathomycin/novobiocin.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 9.1.3 and results 2.3.2, PDF pp.67,90.
  - subject: assay
    predicate: has_reported_specific_activity
    object: activity
    notes: The preparation gave 14.5 nkat/mg protein with DMAHB and methylated ring
      B. Protein was quantified by Bradford with BSA calibration. The source does
      not provide a replicate count or uncertainty for this value; it is not kcat
      or native flux.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 8.2 and results 2.3.2, PDF pp.62,90.
      snippet: von 14,5 nkat/mg Protein
  - subject: heat
    predicate: is_reported_control_for
    object: assay
    notes: Methods specify protein heated for 30 min at 100 C with all other components
      present. This records the control design, not an independently quantified zero-product
      measurement.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Methods 8.4.1, PDF p.63.
  - subject: prep
    predicate: was_tested_in
    object: panel
    notes: The HPLC panel compares the genuine acids and 22 synthetic ring-A analogues.
      NovL and CloL normalize to DMAHB, but CouL normalizes to its pyrrole dicarboxylic
      acid. Relative activities therefore do not share an absolute cross-enzyme denominator.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Table 19 and Figure 13, PDF pp.91-93.
  - subject: panel
    predicate: supports_bounded_substrate_scope
    object: scope
    notes: NovL weakly accepts 4-hydroxybenzoic acid and accepts the 3-chloro/3-bromo
      analogues; the displayed assay does not accept the pyrrole dicarboxylic acid,
      the cyclohexyl analogue or 3,5-dibromo-4-hydroxybenzoic acid. These negatives
      apply to this preparation and assay, not every enzyme loading. Figure 13 shows
      no NovL bar for RAA380, whereas the 2000 abstract reports low acceptance of
      3-methyl-4-aminobenzoate. Preserve that difference without inventing a reconciled
      detection limit. LC-MS/MS supports the panel products collectively; it is not
      a separate enzyme-specific structural proof for every signal.
    evidence:
    - reference: https://bibliographie.uni-tuebingen.de/xmlui/bitstream/handle/10900/48524/pdf/Dissertation_UG1.pdf?isAllowed=y&sequence=1
      evidence_type: PRIMARY_EXPERIMENT
      notes: Results 2.4, Table 19, Figure 13 and Table 20, PDF pp.91-94.
    - reference: DOI:10.1074/jbc.M003066200
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only; reported analogue acceptance.
  - subject: paper_prep
    predicate: was_reported_as_novl_product
    object: gene
    notes: The 2000 abstract reports His6 NovL expressed in E. coli and purified by
      affinity and gel chromatography. Full primary methods were not obtained; do
      not transfer Galm host, buffer or construct-junction details to this preparation.
    evidence:
    - reference: DOI:10.1074/jbc.M003066200
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract inspected; publisher full-text route returned 403.
  - subject: paper_prep
    predicate: catalyzes_reported_ligation
    object: product
    notes: The primary abstract reports ATP-dependent amide formation from DMAHB and
      3-amino-4,7-dihydroxy-8-methylcoumarin.
    evidence:
    - reference: DOI:10.1074/jbc.M003066200
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
  - subject: paper_prep
    predicate: shows_reported_activation
    object: activation
    notes: ATP-PPi exchange supports the reported acyl-adenylate activation step.
      This is not a directly visualized catalytic intermediate or an independently
      measured native-cell flux.
    evidence:
    - reference: DOI:10.1074/jbc.M003066200
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
  - subject: paper_prep
    predicate: has_reported_biochemical_properties
    object: paper_properties
    notes: The abstract reports a gel-filtration-active monomer, ATP specificity,
      Mg2+ or Mn2+ dependence and apparent Km values of 19 uM for DMAHB and 131 uM
      for methylated ring B. These are source-reported values; their detailed assay
      and uncertainty were not independently recovered.
    evidence:
    - reference: DOI:10.1074/jbc.M003066200
      evidence_type: PRIMARY_EXPERIMENT
      notes: Primary abstract only.
- graph_id: cathomycin-novl-recombinant-preparations-and-crystal-limits
  scope: BIOSYNTHESIS
  description: 'Metzger 2010 NovL preparations, precursor activity and unsuccessful
    structure determination (review #550). Native Q9L9F6 is a sequence reference,
    not the identity of the His8 fusion, thrombin-cleaved scar protein, SeMet derivative
    or chemically methylated sample. Specific activities refer to methylated-ring-B
    precursor assays, not mature product synthesis. A diffraction dataset without
    solved phases does not establish residue contacts or biological oligomer stoichiometry.
    All page numbers below are PDF pages, twelve higher than printed pages. The later
    NovL/CouL chimera study is a separate lead.'
