biosynthetic_pathway:
- step_number: 1
  enzyme_label: Lom62 acyltransferase/decarboxylase with Lom63 acyl carrier protein
  proposed: true
  notes: This curates S. pacifica DPJ-0019 Lom62/AHF72798.1 and Lom63/AHF72799.1 as
    an assayed acyltransferase/decarboxylase plus ACP pair that can generate the proposed
    propionyl-ACP starter unit for lomaiviticin biosynthesis. The exact DPJ-0019 GenPept
    accessions did not resolve in UniProtKB exact-accession or KF515737/lom62/lom63
    searches on 2026-09-27, so enzyme_id is left unfilled and NCBI Protein records
    are cited as official sequence evidence.
  evidence:
  - reference: DOI:10.1021/ol403714g
    evidence_type: PRIMARY_EXPERIMENT
    snippet: Robust, Lom62-dependent formation
    notes: Waldman and Balskus cloned Salinispora pacifica DPJ-0019 lom62, lom60,
      and lom63, then showed in vitro by HPLC/LC-MS that Lom62 generated the expected
      propionyl-ACP thioester robustly only with methylmalonyl-CoA and Lom63.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AHF72798.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: acyl transferase/decarboxylase
    notes: NCBI GenPept AHF72798.1 is the 324 aa S. pacifica DPJ-0019 lom62 product
      on KF515737.1:59562..60536; exact AHF72798.1, AHF72798, lom62, and KF515737
      UniProtKB searches did not resolve a S. pacifica accession on 2026-09-27.
  - reference: https://www.ncbi.nlm.nih.gov/protein/AHF72799.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: phosphopantheine-binding protein
    notes: NCBI GenPept AHF72799.1 is the 107 aa S. pacifica DPJ-0019 lom63 acyl carrier
      protein on complement(KF515737.1:60555..60878); exact AHF72799.1, AHF72799,
      lom63, and KF515737 UniProtKB searches did not resolve a S. pacifica accession
      on 2026-09-27.
  - reference: https://www.ncbi.nlm.nih.gov/nuccore/KF515737.1
    evidence_type: DATABASE_ASSERTION
    retrieved_on: '2026-09-27'
    snippet: lomaiviticin biosynthetic gene cluster
    notes: GenBank KF515737.1 is the 72,505 bp S. pacifica DPJ-0019 lomaiviticin biosynthetic
      gene cluster and carries lom62/AHF72798.1 and lom63/AHF72799.1.
