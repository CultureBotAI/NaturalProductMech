findings:
  - finding_id: F-PEN-001
    status: resolved
    summary: >-
      Missing AS-P-78 (BGC0000404:1, DQ192518.1) and Wisconsin 54-1255 (BGC0000405:1..3, EF601124.1) producer strain
      qualifications on three Penicillium chrysogenum (NCBITaxon:5076) records
      (n-5s-5-ammonio-5-carboxylatopentanoyl-l-cysteinyl-d-valinate.yaml, isopenicillin-n.yaml, benzylpenicillin-sodium.yaml),
      directly supported by Fierro et al. 2006 (PMID:16713314, DOI:10.1016/j.fgb.2006.03.001) and van den Berg et al. 2007
      (PMID:17548217, DOI:10.1016/j.fgb.2007.03.008).
    carried_from: F-PEN-001
    group_id: G-PEN-001
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1022
    disposition: >-
      Resolved in Stage 5 (#1022) by adding 4 source-pinned rows for BGC0000404:1 (AS-P-78, DOI:10.1016/j.fgb.2006.03.001)
      and BGC0000405:1..3 (Wisconsin 54-1255, DOI:10.1016/j.fgb.2007.03.008) to curation/mibig_producer_strains.tsv and
      re-seeding CHEBI:58572, CHEBI:18165, and CHEBI:51765.
  - finding_id: F-PEN-002
    status: resolved
    summary: >-
      Anachronistic entry-level citations attached to Penicillium chrysogenum BGC claims: DOI:10.1016/s0140-6736(00)87452-8
      (Chain et al., Lancet 1940) on BGC0000404:1 (genbank:DQ192518.1, MIBiG coordinates 17440..28759, entry_version 4,
      sequenced in 2005/2006 by Fierro et al., DOI:10.1016/j.fgb.2006.03.001) and PMID:1368505 (Smith et al.,
      Bio/Technology 1990;8(1):39-41, DOI:10.1038/nbt0190-39) on BGC0000405:1..3 (genbank:EF601124.1, MIBiG coordinates
      22186..33473, entry_version 5, sequenced in 2007 by van den Berg et al., DOI:10.1016/j.fgb.2007.03.008).
    carried_from: F-PEN-002
    group_id: G-PEN-002
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1023
    disposition: >-
      Resolved in Stage 5 (#1023) by adding 4 source-pinned rows for BGC0000404:1 (routing producer_reference and
      locus_reference from DOI:10.1016/s0140-6736(00)87452-8 to DOI:10.1016/j.fgb.2006.03.001) and BGC0000405:1..3
      (routing producer_reference and locus_reference from PMID:1368505 to DOI:10.1016/j.fgb.2007.03.008) to
      curation/mibig_claim_references.tsv and re-seeding CHEBI:58572, CHEBI:18165, and CHEBI:51765.
  - finding_id: F-PEN-003
    status: deferred
    summary: >-
      Upstream MIBiG salt and protonation-state encoding on CHEBI:51765 (benzylpenicillin sodium on BGC0000404:1 and
      BGC0000405:3 vs biological benzylpenicillin(1-) CHEBI:51354, blocking PenDE / RHEA:19809 biosynthetic_pathway curation
      under #1015) and CHEBI:58572 (monoanion zwitterion on BGC0000405:1 vs neutral ACV CHEBI:28496).
    carried_from: F-PEN-003
    group_id: G-PEN-003
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1015
    disposition: >-
      Deferred in Stage 5 (#1015) because MIBiG BGC0000404:1 and BGC0000405:3 supply the sodium salt SMILES (CHEBI:51765)
      and BGC0000405:1 supplies monoanionic ACV (CHEBI:58572), and atomic multi-row REPLACE_SHARED_WITH_CHEBI or
      counterion-stripped terminal-product matching is tracked in open issue #1015.
  - finding_id: F-PIK-DES-003
    status: deferred
    summary: >-
      Upstream tautomeric/stereochemical separation between desosamine.yaml (ZOYWWAGVGBSJDL-UHFFFAOYSA-N, stereo-incomplete
      cyclic hexopyranose on BGC0000899:1) and desosamine-2.yaml (CHEBI:32540, VTJCSBJRQLZNHE-CSMHCCOUSA-N, 3-star ChEBI
      open-chain D-desosamine aldehyde on BGC0000898:1), plus MIBiG 4.0 deposit split of the S. venezuelae ATCC 15439
      pik/des cluster across BGC0000094 (AF079138.1) and BGC0000898 (AF079762.1, CLUSTER_UNSTATED).
    carried_from: F-PIK-DES-003
    group_id: G-PIK-DES-003
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1012
    disposition: >-
      Deferred in Stage 5 (#1012) until a 3-star stereochemically complete cyclic D-desosamine ChEBI entry and
      deposit-level AF079762.1/AF079138.1 sequence alignment are available.
