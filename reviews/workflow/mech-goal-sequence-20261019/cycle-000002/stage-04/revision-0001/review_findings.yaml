        row_sha256: 50cbd967cf8076f7cbfa5a77bbb9b2910e1e37593d10edea50ad6c3a83316de1
      - source: mibig_4.0
        row_id: 'BGC0000405:2'
        row_sha256: ae975df0e01f81b73c2e119b776207ca3e0f061375585a06ceef3f099dbbe860
      - source: mibig_4.0
        row_id: 'BGC0000405:3'
        row_sha256: 847cf368dc26e162604ac12681781efc5814bcc31c4e19e94b09578562a1dd42
    evidence_refs:
      - PMID:16713314
      - DOI:10.1016/j.fgb.2006.03.001
      - PMID:17548217
      - DOI:10.1016/j.fgb.2007.03.008
      - https://www.ncbi.nlm.nih.gov/nuccore/DQ192518.1
      - https://www.ncbi.nlm.nih.gov/nuccore/EF601124.1
    description: >-
      All three Penicillium chrysogenum (NCBITaxon:5076) records seeded from BGC0000404:1 (DQ192518.1) and BGC0000405:1..3
      (EF601124.1) omit producer_organisms[*].strain (producer_organisms[0] on n-5s-5-ammonio-5-carboxylatopentanoyl-l-cysteinyl-d-valinate.yaml
      and isopenicillin-n.yaml, and both producer_organisms[0] and producer_organisms[1] on benzylpenicillin-sodium.yaml)
      because MIBiG 4.0 reports species-level organism_name='Penicillium chrysogenum'. GenBank DQ192518.1 and Fierro et al.
      (Fungal Genet. Biol. 2006;43(9):618-629, PMID:16713314, DOI:10.1016/j.fgb.2006.03.001) identify the BGC0000404 sequenced
      producer strain as Penicillium chrysogenum AS-P-78, while GenBank EF601124.1 and van den Berg et al.
      (Fungal Genet. Biol. 2007;44(9):830-844, PMID:17548217, DOI:10.1016/j.fgb.2007.03.008) identify the BGC0000405 sequenced
      producer strain as Penicillium chrysogenum Wisconsin 54-1255.
    proposed_remediation: >-
      Add four compound-row entries to curation/mibig_producer_strains.tsv with source_id keys BGC0000404:1
      (expected_source_row_sha256 9460d29fcad2b7ecb913298bc80838656966e219ec0654094d28b71942eaeb19, strain='AS-P-78',
      reference=DOI:10.1016/j.fgb.2006.03.001), BGC0000405:1
      (50cbd967cf8076f7cbfa5a77bbb9b2910e1e37593d10edea50ad6c3a83316de1, strain='Wisconsin 54-1255',
      reference=DOI:10.1016/j.fgb.2007.03.008), BGC0000405:2
      (ae975df0e01f81b73c2e119b776207ca3e0f061375585a06ceef3f099dbbe860, strain='Wisconsin 54-1255',
      reference=DOI:10.1016/j.fgb.2007.03.008), and BGC0000405:3
      (847cf368dc26e162604ac12681781efc5814bcc31c4e19e94b09578562a1dd42, strain='Wisconsin 54-1255',
      reference=DOI:10.1016/j.fgb.2007.03.008), then re-seed in Stage 5 (resolve_review_findings).
