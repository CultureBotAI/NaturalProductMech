    description: >-
      MIBiG 4.0 attaches entry-level historical citations that predate the sequenced genomic loci on both Penicillium
      chrysogenum BGC entries: (1) BGC0000404:1 (genbank:DQ192518.1:26249..43059, sequenced from P. chrysogenum AS-P-78 in
      2005/2006 by Fierro et al., DOI:10.1016/j.fgb.2006.03.001) carries DOI:10.1016/s0140-6736(00)87452-8 (Chain et al.,
      Lancet 1940), which predates DNA sequencing by 65 years; and (2) BGC0000405:1..3 (genbank:EF601124.1:17440..33920,
      sequenced from P. chrysogenum Wisconsin 54-1255 in 2007 by van den Berg et al., DOI:10.1016/j.fgb.2007.03.008)
      carries PMID:1368505 (Smith et al., EMBO J. 1990), which predates EF601124.1 by 17 years.
    proposed_remediation: >-
      Add source_id=BGC0000404:1 (expected_source_row_sha256
      9460d29fcad2b7ecb913298bc80838656966e219ec0654094d28b71942eaeb19, producer_reference=DOI:10.1016/j.fgb.2006.03.001,
      locus_reference=DOI:10.1016/j.fgb.2006.03.001, source_reference=DOI:10.1016/j.fgb.2006.03.001) and
      source_id=BGC0000405:1..3 (expected_source_row_sha256
      50cbd967cf8076f7cbfa5a77bbb9b2910e1e37593d10edea50ad6c3a83316de1,
      ae975df0e01f81b73c2e119b776207ca3e0f061375585a06ceef3f099dbbe860,
      847cf368dc26e162604ac12681781efc5814bcc31c4e19e94b09578562a1dd42, producer_reference=DOI:10.1016/j.fgb.2007.03.008,
      locus_reference=DOI:10.1016/j.fgb.2007.03.008, source_reference=DOI:10.1016/j.fgb.2007.03.008) to
      curation/mibig_claim_references.tsv, then re-seed in Stage 5 (resolve_review_findings).
  - id: F-PEN-003
    title: Upstream MIBiG salt and protonation-state encoding on CHEBI:51765 (benzylpenicillin sodium vs biological CHEBI:51354) and CHEBI:58572 (monoanion vs neutral ACV CHEBI:28496)
    severity: low
    native_severity: minor
    category: representation
    status: open
    records:
      - data/natural_products/amino_acids_and_peptides/benzylpenicillin-sodium.yaml
      - data/natural_products/amino_acids_and_peptides/n-5s-5-ammonio-5-carboxylatopentanoyl-l-cysteinyl-d-valinate.yaml
    field_paths:
      - id
      - name
      - 'chemical_structure.standard_inchi_key'
      - 'chemical_structure.smiles'
      - biosynthetic_pathway
    source_rows:
      - source: mibig_4.0
        row_id: 'BGC0000404:1'
        row_sha256: 9460d29fcad2b7ecb913298bc80838656966e219ec0654094d28b71942eaeb19
      - source: mibig_4.0
        row_id: 'BGC0000405:1'
        row_sha256: 50cbd967cf8076f7cbfa5a77bbb9b2910e1e37593d10edea50ad6c3a83316de1
      - source: mibig_4.0
        row_id: 'BGC0000405:3'
        row_sha256: 847cf368dc26e162604ac12681781efc5814bcc31c4e19e94b09578562a1dd42
    evidence_refs:
      - PMID:2102893
      - PMID:15548609
      - https://github.com/CultureBotAI/NaturalProductMech/issues/1015
    description: >-
      1) BGC0000404:1 and BGC0000405:3 encode penicillin G as the pharmaceutical sodium salt (CHEBI:51765,
      LVRFTAZAXQPQHI-MBNYWOFBSA-M, [H][C@]12SC(C)(C)[C@@H](N1C(=O)[C@H]2NC(=O)Cc1ccccc1)C([O-])=O.[Na+]) rather than biological benzylpenicillin(1-)
      (CHEBI:51354) or neutral benzylpenicillin (CHEBI:17334). Because strict validation requires exact product identity match
      on biosynthetic_pathway steps and RHEA:19809 produces CHEBI:51354 + CHEBI:57287, biosynthetic_pathway cannot be populated
      on benzylpenicillin-sodium.yaml without inventing a sodium-salt Rhea reaction (tracked in #1015). 2) BGC0000405:1 encodes
      ACV as the monoanion zwitterion (CHEBI:58572, [O-]C(=O)[C@@H](NC(=O)[C@@H](CS)NC(=O)CCC[C@H]([NH3+])C([O-])=O)C(C)C)
      rather than neutral L-delta-(alpha-aminoadipoyl)-L-cysteinyl-D-valine (CHEBI:28496), whereas RHEA:19809 uses the dianion
      CHEBI:58573.
    proposed_remediation: >-
      Preserve as an explicit source-limited representation boundary in Stage 5 (linked to #1015) unless a corpus-wide
      counterion-stripping policy is adopted in curation/structure_corrections.tsv.
