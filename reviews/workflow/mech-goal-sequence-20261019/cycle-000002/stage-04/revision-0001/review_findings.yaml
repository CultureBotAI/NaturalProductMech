  - id: F-PEN-001
    title: Missing AS-P-78 (BGC0000404:1) and Wisconsin 54-1255 (BGC0000405:1..3) producer strain qualifications on Penicillium chrysogenum (NCBITaxon:5076) records
    severity: high
    native_severity: major
    category: completeness
    status: open
    records:
