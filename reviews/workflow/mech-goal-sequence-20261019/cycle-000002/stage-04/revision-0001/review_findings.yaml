        row_sha256: 847cf368dc26e162604ac12681781efc5814bcc31c4e19e94b09578562a1dd42
    evidence_refs:
      - DOI:10.1016/j.fgb.2006.03.001
      - PMID:16713314
      - DOI:10.1016/j.fgb.2007.03.008
      - PMID:17499530
      - DOI:10.1016/s0140-6736(00)87452-8
