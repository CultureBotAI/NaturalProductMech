findings:
  - finding_id: F-PIK-DES-001
    status: open
    summary: >-
      Missing ATCC 15439 producer strain qualification on five Streptomyces venezuelae (NCBITaxon:54571) records
      (desosamine-2.yaml, methymycin.yaml, pikromycin.yaml, neomethymycin.yaml, narbomycin.yaml) seeded from BGC0000094:1
      (AF079138.1) and BGC0000898:1..4 (AF079762.1), directly supported by Xue et al., PNAS 1998 (PMID:9770448,
      DOI:10.1073/pnas.95.21.12111).
    disposition: >-
      Preserve as open for Stage 5 (resolve_review_findings) remediation via curation/mibig_producer_strains.tsv and
      scripts/seed_from_sources.py.
  - finding_id: F-PIK-DES-002
    status: open
    summary: >-
      Cross-species PMID:9770448 citation attached to Streptomyces narbonensis (NCBITaxon:67333) and GenBank AF521878.1
      (BGC0000899:1) in data/natural_products/carbohydrates/desosamine.yaml; PMID:9770448 characterizes only Streptomyces
      venezuelae ATCC 15439 (AF079138.1 / AF079762.1).
    disposition: >-
      Preserve as open for Stage 5 (resolve_review_findings) remediation via curation/mibig_claim_references.tsv routing
      producer_reference to https://mibig.secondarymetabolites.org/repository/BGC0000899.4/ and locus_reference to
      https://www.ncbi.nlm.nih.gov/nuccore/AF521878.1.
  - finding_id: F-PIK-DES-003
    status: open
    summary: >-
      Upstream tautomeric/stereochemical separation between desosamine.yaml (ZOYWWAGVGBSJDL-UHFFFAOYSA-N, stereo-incomplete
      cyclic hexopyranose on BGC0000899:1) and desosamine-2.yaml (CHEBI:32540, VTJCSBJRQLZNHE-CSMHCCOUSA-N, 3-star ChEBI
      open-chain D-desosamine aldehyde on BGC0000898:1), plus MIBiG 4.0 deposit split of the S. venezuelae ATCC 15439
      pik/des cluster across BGC0000094 (AF079138.1) and BGC0000898 (AF079762.1, CLUSTER_UNSTATED).
    disposition: >-
      Preserve as open for Stage 5 (resolve_review_findings) boundary disposition; retain separate identity groups until
      ChEBI or MIBiG provides a 3-star stereochemically defined cyclic D-desosaminopyranose entry or unifies tautomer
      identity and cluster deposits.
