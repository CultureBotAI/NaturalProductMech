findings:
  - finding_id: F-PIK-DES-001
    status: resolved
    summary: >-
      Missing ATCC 15439 producer strain qualification on five Streptomyces venezuelae (NCBITaxon:54571) records
      (desosamine-2.yaml, methymycin.yaml, pikromycin.yaml, neomethymycin.yaml, narbomycin.yaml) seeded from compound rows
      BGC0000094:1 (AF079138.1) and BGC0000898:1..4 (AF079762.1), directly supported by Xue et al., PNAS 1998
      (PMID:9770448, DOI:10.1073/pnas.95.21.12111).
    carried_from: F-PIK-DES-001
    group_id: G-PIK-DES-001
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1010
    disposition: >-
      Resolved in Stage 5 (#1010) by adding source-pinned ATCC 15439 strain qualifications for BGC0000094:1 and
      BGC0000898:1..4 to curation/mibig_producer_strains.tsv, updating scripts/seed_from_sources.py to allow reviewed
      structure-corrected rows naming structure_source_id in rationale, and re-seeding all five S. venezuelae cohort records.
  - finding_id: F-PIK-DES-002
    status: resolved
    summary: >-
      Cross-species Xue et al. 1998 citation (PMID:9770448 / DOI:10.1073/PNAS.95.21.12111) attached to Streptomyces
      narbonensis (NCBITaxon:67333) and GenBank AF521878.1 (BGC0000899:1) on producer_organisms[0].evidence[0].reference
      and biosynthetic_gene_clusters[0].evidence[0].reference, and to the LOTUS occurrence on
      occurrences[0].evidence[0].reference in data/natural_products/carbohydrates/desosamine.yaml; Xue et al. (1998)
      characterize only Streptomyces venezuelae ATCC 15439 (AF079138.1 / AF079762.1).
    carried_from: F-PIK-DES-002
    group_id: G-PIK-DES-002
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1011
    disposition: >-
      Resolved in Stage 5 (#1011) by routing BGC0000899:1 producer and locus claims in curation/mibig_claim_references.tsv
      to BGC0000899.4 and GenBank AF521878.1, excluding the mis-referenced LOTUS occurrence in
      curation/lotus_occurrence_exclusions.tsv, and re-seeding desosamine.yaml.
  - finding_id: F-PIK-DES-003
    status: deferred
    summary: >-
      Upstream tautomeric/stereochemical separation between desosamine.yaml (ZOYWWAGVGBSJDL-UHFFFAOYSA-N, stereo-incomplete
      cyclic hexopyranose on BGC0000899:1) and desosamine-2.yaml (CHEBI:32540, VTJCSBJRQLZNHE-CSMHCCOUSA-N, 3-star ChEBI
      open-chain D-desosamine aldehyde on BGC0000898:1), plus MIBiG 4.0 deposit split of the S. venezuelae ATCC 15439
      pik/des cluster across BGC0000094 (AF079138.1) and BGC0000898 (AF079762.1, CLUSTER_UNSTATED).
    carried_from: F-PIK-DES-003
    group_id: G-PIK-DES-003
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1012
    disposition: >-
      Deferred in Stage 5 (#1012) because 3-star ChEBI lacks a stereochemically complete cyclic D-desosamine entry and
      MIBiG BGC0000898 (AF079762.1) exports blank locus coordinates; merging distinct InChIKeys or transferring AF079138.1
      locus grades without sequence-coordinate equivalence would violate corpus curation rules.
