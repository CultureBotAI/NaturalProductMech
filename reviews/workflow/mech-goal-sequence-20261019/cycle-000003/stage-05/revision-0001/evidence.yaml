findings:
  - finding_id: F-YSF-001
    status: resolved
    summary: >-
      Missing OUC6819 (BGC0002547:1..5, MN844187.1) producer strain qualifications on five Streptomyces youssoufiensis
      (NCBITaxon:654447) records (youssoufene-a1.yaml, youssoufene-b1.yaml, youssoufene-b2.yaml, youssoufene-b3.yaml,
      youssoufene-b4.yaml), directly supported by Li et al. 2020 (PMID:31891272, DOI:10.1021/acs.orglett.9b04559) and
      Liu et al. 2021 (PMID:33155752, DOI:10.1002/anie.202007777).
    carried_from: F-YSF-001
    group_id: G-YSF-001
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1044
    disposition: >-
      Resolved in Stage 5 (#1044) by adding 5 source-pinned rows for BGC0002547:1..5 (strain OUC6819, PMID:31891272)
      to curation/mibig_producer_strains.tsv and re-seeding all 5 youssoufene records.
  - finding_id: F-YSF-002
    status: resolved
    summary: >-
      Misattributed author citation ('Deng et al.' instead of 'Liu et al.') across 80 curator-owned evidence notes (16
      per record in biosynthetic_pathway[0..3].evidence[0].notes and causal_graphs[0].edges[0..11].evidence[0].notes)
      citing DOI:10.1002/anie.202007777 (Angew. Chem. Int. Ed. 2021;60(1):153-158, PMID:33155752, authored by Zengzhi
      Liu et al., not Zhaoxian Deng et al.) across all five youssoufene records.
    carried_from: F-YSF-002
    group_id: G-YSF-002
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1045
    disposition: >-
      Resolved in Stage 5 (#1045) by updating all 80 curator-owned DOI:10.1002/anie.202007777 PRIMARY_EXPERIMENT evidence
      notes across youssoufene-a1.yaml and youssoufene-b1.yaml..youssoufene-b4.yaml from 'Deng et al.' to 'Liu et al.'
      via write_validated_natural_product and record_curation_event.
  - finding_id: F-YSF-003
    status: deferred
    summary: >-
      Upstream NPClassifier category split (POLYKETIDES on dimeric youssoufene-a1.yaml vs UNCLASSIFIED on monomeric
      youssoufene-b1.yaml..youssoufene-b4.yaml), heterodimeric KS/CLF PROTEIN_COMPLEX / RHEA grounding boundaries
      (ysfbc_ks_clf, ysfde_ks_clf, ysfjk_ks_clf), and unindexed BGC0002510 deposit metadata (MT459140.1, PMID:32860295)
      leaving producer_organisms[1] at genus rank (NCBITaxon:1931) without strain.
    carried_from: F-YSF-003
    group_id: G-YSF-003
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1046
    disposition: >-
      Deferred in Stage 5 (#1046) as an upstream NPClassifier v1.5 filing pin, ComplexPortal/RHEA heterodimer coverage
      boundary, and unindexed BGC0002510 (MT459140.1 / PMID:32860295) strain metadata limitation.
  - finding_id: F-PEN-003
    status: deferred
    summary: >-
      Upstream MIBiG salt and protonation-state encoding on CHEBI:51765 (benzylpenicillin sodium on BGC0000404:1 and
      BGC0000405:3 vs biological benzylpenicillin(1-) CHEBI:51354) and CHEBI:58572 (monoanion zwitterion on BGC0000405:1
      vs neutral ACV CHEBI:28496), blocked from structure-correction migration by the mutual exclusion check in
      src/naturalproductmech/curate/claim_references.py:130.
    carried_from: F-PEN-003
    group_id: G-PEN-003
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1047
    disposition: >-
      Deferred in Stage 5 (#1047) and recorded as infrastructure task naturalproductmech-infra-0003 in INFRA_TASKS.md
      (per infrastructure_note_policy: record_only) because load_claim_references() rejects rows shared with
      curation/mibig_structure_corrections.tsv and seed_from_sources.py does not fall back to structure_source_id for
      claim-reference lookup.
  - finding_id: F-PIK-DES-003
    status: deferred
    summary: >-
      Upstream tautomeric/stereochemical separation between desosamine.yaml (ZOYWWAGVGBSJDL-UHFFFAOYSA-N, stereo-incomplete
      cyclic hexopyranose on BGC0000899:1) and desosamine-2.yaml (CHEBI:32540, VTJCSBJRQLZNHE-CSMHCCOUSA-N, 3-star ChEBI
      open-chain D-desosamine aldehyde on BGC0000898:1), plus MIBiG 4.0 deposit split of the S. venezuelae ATCC 15439
      pik/des cluster across BGC0000094 (AF079138.1) and BGC0000898 (AF079762.1, CLUSTER_UNSTATED).
    carried_from: F-PIK-DES-003
    group_id: G-PIK-DES-003
    issue_url: https://github.com/CultureBotAI/NaturalProductMech/issues/1012
    disposition: >-
      Deferred in Stage 5 (#1012) until a 3-star stereochemically complete cyclic D-desosamine ChEBI entry and
      deposit-level AF079762.1/AF079138.1 sequence alignment are available.
