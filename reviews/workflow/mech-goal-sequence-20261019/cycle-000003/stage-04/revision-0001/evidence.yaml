findings:
- finding_id: F-YSF-001
  status: open
  summary: Missing OUC6819 (BGC0002547:1..5, MN844187.1) producer strain qualifications on five Streptomyces youssoufiensis
    (NCBITaxon:654447) records (youssoufene-a1.yaml, youssoufene-b1.yaml, youssoufene-b2.yaml, youssoufene-b3.yaml, youssoufene-b4.yaml),
    directly supported by Li et al. 2020 (PMID:31891272, DOI:10.1021/acs.orglett.9b04559) and Liu et al. 2021 (PMID:33155752,
    DOI:10.1002/anie.202007777).
  disposition: Preserve as open for Stage 5 (resolve_review_findings) remediation via curation/mibig_producer_strains.tsv
    (source_id keys BGC0002547:1..5) and scripts/seed_from_sources.py.
- finding_id: F-YSF-002
  status: open
  summary: Misattributed author citation ('Deng et al.' instead of 'Liu et al.') across 80 curator-owned evidence notes (16
    per record in biosynthetic_pathway[0..3].evidence[0].notes and causal_graphs[0].edges[0..11].evidence[0].notes) citing
    DOI:10.1002/anie.202007777 (Angew. Chem. Int. Ed. 2021;60(1):153-158, PMID:33155752, authored by Zengzhi Liu et al., not
    Zhaoxian Deng et al.) across all five youssoufene records.
  disposition: Preserve as open for Stage 5 (resolve_review_findings) remediation across all 80 curator-owned evidence notes
    on youssoufene-a1.yaml and youssoufene-b1.yaml..youssoufene-b4.yaml.
- finding_id: F-YSF-003
  status: open
  summary: Upstream NPClassifier category split (POLYKETIDES on dimeric youssoufene-a1.yaml vs UNCLASSIFIED on monomeric youssoufene-b1.yaml..youssoufene-b4.yaml),
    heterodimeric KS/CLF PROTEIN_COMPLEX / RHEA grounding boundaries (ysfbc_ks_clf, ysfde_ks_clf, ysfjk_ks_clf), and unindexed
    BGC0002510 deposit metadata (MT459140.1, PMID:32860295) leaving producer_organisms[1] at genus rank (NCBITaxon:1931) without
    strain.
  disposition: Preserve as open for Stage 5 (resolve_review_findings) upstream boundary disposition.
