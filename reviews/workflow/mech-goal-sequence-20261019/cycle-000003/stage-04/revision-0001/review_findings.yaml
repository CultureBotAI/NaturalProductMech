  description: 1) NPClassifier (npclassifier.gnps2.org@2026-04-06) classifies dimeric youssoufene-a1.yaml under POLYKETIDES
    ('Linear polyketides') while returning empty pathway_results=[] (UNCLASSIFIED) for monomeric youssoufene-b1.yaml..youssoufene-b4.yaml.
    2) Heterodimeric KS/CLF PROTEIN_COMPLEX nodes (ysfbc_ks_clf [nodes[7]], ysfde_ks_clf [nodes[8]], ysfjk_ks_clf [nodes[9]])
    remain UNGROUNDED at the complex level (while subunit ENZYME nodes nodes[0..3, 5..6] carry grounding.id and protein_examples
    and connect via 'is subunit of' edges edges[0..5]), omit scalar complex enzyme_id on biosynthetic_pathway steps 1, 2,
    and 4, and omit RHEA reaction_id on steps 1-4 due to ComplexPortal/RHEA scope boundaries. 3) producer_organisms[1] (NCBITaxon:1931,
    Streptomyces sp., BGC0002510:1..5, MT459140.1:71..11851, PMID:32860295) remains genus-level without strain because MT459140.1
    and PMID:32860295 are not indexed in ENA/PubMed.
  proposed_remediation: Preserve as an explicit source-limited representation boundary in Stage 5 (resolve_review_findings).
