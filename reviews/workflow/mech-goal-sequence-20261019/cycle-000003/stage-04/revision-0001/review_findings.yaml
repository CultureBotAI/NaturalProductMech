  description: All five youssoufene records (youssoufene-a1.yaml, youssoufene-b1.yaml, youssoufene-b2.yaml, youssoufene-b3.yaml,
    youssoufene-b4.yaml) omit producer_organisms[0].strain on Streptomyces youssoufiensis (NCBITaxon:654447, seeded from mibig:BGC0002547,
    genbank:MN844187.1, 1..20186) because MIBiG 4.0 reports species-level organism_name='Streptomyces youssoufiensis'. Both
    primary publications (Li et al., Org. Lett. 2020;22(2):704-708, PMID:31891272, DOI:10.1021/acs.orglett.9b04559; Liu et
    al., Angew. Chem. Int. Ed. 2021;60(1):153-158, PMID:33155752, DOI:10.1002/anie.202007777), GenBank MN844187.1 (/strain="OUC6819"),
    and each record's own causal_graphs[0].nodes[0..6].protein_examples[0].strain ('OUC6819') identify the sequenced producer
    strain as Streptomyces youssoufiensis OUC6819.
  proposed_remediation: Add five source-pinned rows (BGC0002547:1..5) to curation/mibig_producer_strains.tsv with strain='OUC6819'
    and reference=PMID:31891272, then re-seed in Stage 5 (resolve_review_findings).
