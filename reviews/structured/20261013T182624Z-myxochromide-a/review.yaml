findings:
- finding_id: F1
  issue_key: mibig-BGC0001425-1428-myxochromide-a-core-identity
  category: identity
  severity: blocker
  status: open
  certainty: provisional
  title: The imported A-type structure conflicts with the experimentally characterized
    peptide core
  description: 'The four source rows encode a 21-membered lactone with the terminal
    amino-acid carboxamide attached at the alpha carbon. The independently inspected
    2006 A-series structure has a 19-membered glutamine-based core. Its A3 side-chain
    length matches this C45 graph, so the ring difference is not explained merely
    by A2/A3/A4 chain variation. Virtual hydrolysis also exposes an R-proline fragment,
    opposite the same MIBiG entries'' S-proline substrate depiction. These differences
    are confirmed observations, but the exact assignment across all four 2017 strain
    entries remains provisional: the cited 2017 full paper is unavailable, and the
    older structure elucidation used DK1050, not every listed strain. The existing
    shared-structure discussion does not state this chemical conflict. Do not select
    a replacement or transfer claims merely from the common label.'
  target_ids:
