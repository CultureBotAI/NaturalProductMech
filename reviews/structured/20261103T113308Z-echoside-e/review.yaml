  area: consistency
  topic: Classification
  outcome: unknown
  summary: NPClassifier p-Terphenyls/Terphenyls and is_glycoside=true are computed
    labels. The full SMILES table shows methyl C0 on N1 and the aromaticized N1–C2(=O3)–S4
    ring, fused through C5/C6 to the central aromatic ring. O15 links aromatic C14
    to the oxygenated C5O ring at C16; C25(=O27)–O26 is the carboxylic acid. The generic
    amide scan is empty because the N1–C2 bond is aromatic in this saved representation;
    the explicit carbonyl–nitrogen adjacency remains present. The oxygenated cyclic
    acetal and aryl–O connection support glycoside-like topology, without assigning
    a biochemical residue from the C5O motif alone. MIBiG NRPS/Type I is a separate
    source classification; it is not evidence that this structure is a peptide or
    that a complete pathway was inspected.
