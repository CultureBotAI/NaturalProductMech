    and NCBITaxon:97398, using these literal DOI/full-row SHA256 pairs: 10.5012/BKCS.2010.31.11.3457
    = b105edf2cd59bef91e4f84b6cdd9f71fd1d22659d739ccf3b243ea8ae9caf906; 10.7164/ANTIBIOTICS.36.552
