findings:
- finding_id: bgc-2193-binding-class-scope
  issue_key: clorobiocin-pdb-binding-observations-enzyme-class-overstatement
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: PDB binding observations do not establish enzyme-inhibition typing
  description: Written bioactivities[0–1], AIDs977611/1811, are the retained PDB-derived
    binding rows1516/1515 with shared PMID12044152 and ungrounded target1KZN_A. The
    first measures KD0.0012uM; the other has no endpoint/value. The generic binding
    regex adds ENZYME_INHIBITOR to both, although affinity/binding alone does not
    establish catalytic inhibition. Those two classes solely feed the written ENZYME_INHIBITOR
    summary. The same-key sibling ANTIBACTERIAL assertion remains separately backed,
    and biosynthetic graphs provide no therapeutic inhibition measurement. This is
    a support-scope defect, not a denial of known or possible inhibitory pharmacology.
  target_ids:
  - naturalproductmech:mibig-619480541f
  field_paths:
  - bioactivities[0].activity_class
  - bioactivities[1].activity_class
  - bioactivity_summary
  evidence_ids:
  - bgc-2193-assay-owner
  - bgc-2193-source-pubchem_bioassay
  - bgc-2193-query-pubchem_bioassay
  - bgc-2193-activity-classifier
  - bgc-2193-activity-schema
  - bgc-2193-review-skill
  - bgc-2193-review-profile
  - bgc-2193-source-antibioticmech_inchikeys
  - bgc-2193-reader-DATA
  owner_paths:
  - repository: CultureBotAI/NaturalProductMech
    path: scripts/seed_from_sources.py
    role: Maintained classify_activity, ACTIVE observation typing and summary derivation
  - repository: CultureBotAI/NaturalProductMech
    path: data/natural_products/shikimates_and_phenylpropanoids/clorobiocin.yaml
    role: Generated affected claims; regenerate after maintained correction
  ownership_note: Correct the maintained classifier support scope, not generated YAML
    or source assay values; reserved/nonconsumed decisions.tsv is not a correction
    route.
  normalization_reason: Major scientific claim-scope overstatement despite native
    reproduction passing. The enum is coarse and has no dedicated ENZYME_INHIBITOR
    definition; retained evidence and the classifier unambiguity contract establish
    this finding.
  disposition_reason: Confirmed local source-to-generated support gap, rather than
    an unsupported inference from unavailable external verification.
actions:
- action_id: bgc-2193-repair-activity-classification
  description: 'Narrow maintained classification of the exact PDB-derived binding
    titles/AIDs977611 and1811 so binding alone does not produce ENZYME_INHIBITOR.
    Omit those optional classes unless suitable inspected catalytic-inhibition evidence
    is deliberately added. Preserve both ACTIVE calls, KD0.0012uM versus the second
    blank endpoint/value, PMID12044152, title/AIDs and ungrounded1KZN_A. Recompute
    the summary from supported written evidence and the sibling route: ANTIBACTERIAL
    remains, while ENZYME_INHIBITOR needs separate adequate backing. Preserve all
    curated biosynthetic graphs, histories and component records.'
  finding_ids:
