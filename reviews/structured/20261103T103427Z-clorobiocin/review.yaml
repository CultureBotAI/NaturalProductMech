  - Exact affected AIDs retain their calls, endpoint spelling/values/units, citations
    and target-accession scope without unsupported class assignments.
  - Regression coverage distinguishes transcription/binding observations from separately
    supported enzyme-activity observations and preserves counterscreen context.
  - Recomputed summaries use only adequately backed written observations and explicit
    sibling routes; no congener or biosynthetic-mechanism activity transfer.
