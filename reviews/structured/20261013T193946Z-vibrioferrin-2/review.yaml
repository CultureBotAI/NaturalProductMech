findings:
- finding_id: F1
  issue_key: mibig-BGC0000947-vibrioferrin-constitution
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: The imported constitution is not the vibrioferrin described by the cited
    structure evidence
  description: The stored FPHRKFJYHKRDFJ graph has four free carboxylic acids and
    no ester. The inspected 1994 structure-elucidation abstract names an ethanolamine
    citrate ester; the full 2011 paper depicts that ester in Figure1 and supports
    it with NMR in Figure3/Table1. That chemistry matches the IGQXNKDXMPSELX constitution,
    not this owner. The difference is connectivity, not protonation or merely incomplete
    stereochemistry. PubChem197680 and MIBiG0947 do reproduce the stored graph, but
    registry agreement does not validate its assignment to the named product or the
    seven LOTUS citations. The exact alginolyticus product in the paywalled2007 experiment
    still needs adjudication; do not claim a corrected per-strain assignment from
    the metagenomic2011 experiment.
  target_ids:
  - naturalproductmech:mibig-c1b0b2a6f8
