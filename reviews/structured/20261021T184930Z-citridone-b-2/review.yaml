summary: Citridone B prime is supported as a distinct relative hemiacetal epimer in
  the reported B/B-prime equilibrium mixture, with its side-chain centre unresolved.
  The imported graph and literal NPAtlas match, but the cited evidence does not establish
  the encoded absolute hand, a major precision finding. Proposed repair must preserve
  relative epimer identity, mixture scope and undefined centres. A minor donor-host
  context action remains conditional on the unresolved PKI-1938/FKI-1938 bridge and
  tested chemistry composition. Missing required primary evidence keeps the review
  partial.
