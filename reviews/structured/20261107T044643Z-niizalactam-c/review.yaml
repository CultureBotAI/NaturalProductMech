  and two six-membered carbocycles. Both saved forms normalize to the same full key;
  the InChI-derived form represents the amide as an imidic group, so canonical strings
  and the limited atom matcher differ. Eight tetrahedral centres and five E double
  bonds are specified. The knockout-based producer and locus grades remain attributed
  to the retained MIBiG entry; the two LOTUS occurrences do not establish those organisms
  as producers. No supported record defect was identified in this retained scope,
  but fresh primary verification and full QC/OAK remain unavailable, so completion
  is partial.
