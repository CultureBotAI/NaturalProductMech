- assessment_id: bgc-2821-representation
  area: representation
  topic: Stored molecular forms and stereochemical scope
  outcome: supported
  summary: The source-SMILES graph is one neutral C28H35NO6 fragment with 35 atoms
    and 37 bonds. Its three saved ring rows describe an 18-membered lactam and two
    six-membered carbocycles. The three carbonyls comprise one amide at C4–N3 and
    two ketones; O24, O25 and O26 are terminal alcohol oxygens. In the InChI-derived
    table the corresponding mobile-hydrogen region is C22(OH30)=N28, leaving two carbonyl
    motifs. These are encoded topology observations, not an experimentally established
    reaction or preferred natural tautomer. The source form has eight specified tetrahedral
    centres and five E double bonds; the InChI-derived form retains these assignments
    and adds one unspecified potential C=N geometry at its imidic site. The cyclic
    C15=C16 bond has no E/Z annotation in the saved bond table and is not listed as
    a potential stereo site. Literal stereo_complete:true reflects the maintained
    extractor's atom-centre test, not universal double-bond or natural-identity certification.
    The extra imidic potential site does not by itself contradict that source flag.
    Both original stored strings parsed and agree in formula, charge, normalized Standard
    InChI and the declared complete key. Both canonical SMILES comparisons are false
    and the saved chirality-aware atom map is empty. The saved amide-to-imidic topology
    accounts for a representation difference compatible with mobile-hydrogen normalization;
    no alternate parse, tautomer cleanup or natural-identity conclusion was made.
    Full graph identity was not established.
