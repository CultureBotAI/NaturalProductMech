limitations:
- Fresh source-authority, primary publication, sequence and strain verification remain
  unavailable. Full QC/OAK were not run; retained experimental grades stay source-attributed.
- Both original stored strings parsed and agree in formula, charge, normalized Standard
  InChI and the declared complete key. Both canonical SMILES comparisons are false
  and the saved chirality-aware atom map is empty. The saved amide-to-imidic topology
  accounts for a representation difference compatible with mobile-hydrogen normalization;
  no alternate parse, tautomer cleanup or natural-identity conclusion was made. Full
  graph identity was not established. Two undefined-stereo warnings remain globally
  unassigned; no message is attributed to this owner.
- The source form has eight specified tetrahedral centres and five E double bonds;
  the InChI-derived form retains these assignments and adds one unspecified potential
  C=N geometry at its imidic site. The cyclic C15=C16 bond has no E/Z annotation in
  the saved bond table and is not listed as a potential stereo site. Literal stereo_complete:true
  reflects the maintained extractor's atom-centre test, not universal double-bond
  or natural-identity certification. The extra imidic potential site does not by itself
  contradict that source flag.
- Saved topology supports the encoded molecule without independently establishing
  every natural residue, biosynthetic reaction or pharmacological mechanism.
- The whole selected owner was read, but scientific completion is partial because
  full QC, complete ontology authority coverage and external source verification were
  unavailable. No native status or history was changed.
- The branch uses cached base ce6a5498df5be51116bd5e0c119023ee62bb5464. Fresh origin/main
  verification and publication are deferred because the user prohibits all external
  requests.
notes:
- No record, source table, native scientific status or curation history is modified.
  Corrections, if later justified, belong in maintained source/curation/extractor
