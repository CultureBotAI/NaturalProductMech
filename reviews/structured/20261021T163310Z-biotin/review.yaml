  accessed_at: '2026-10-21T15:55:09.687998Z'
  support: supports
  summary: Recombinant wild-type IDE fluorescence-polarization apparent activation
    assay. Fluorescein–Abeta(1–40)–Lys–biotin substrate is incubated with IDE for
    3.5 h; avidin is added afterward. Changes in polarization are interpreted as substrate
    cleavage. Ten nominal concentrations to 54.7 µM, triplicate. SID 49674668 is Active,
    EC50 = 2.526 µM, with an explicit equality qualifier. The result is an assay readout.
    The same SID is positive in the end-addition artifact counterscreen 588442, so
    this record alone does not establish selective catalytic activation of IDE. The
    shared avidin/biotin readout makes competition plausible, but its precise mechanism
    is not demonstrated by these results.
