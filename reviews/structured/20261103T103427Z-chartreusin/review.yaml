- action_id: bgc-2191-repair-activity-classification
  description: Narrow the maintained assay classification for exact AID2551/title
    so generic transcriptional-screen inhibition does not become ENZYME_INHIBITOR
    without suitable support. Omit that optional observation class unless an appropriately
    inspected source supports it. Preserve ACTIVE, OTHER/Potency11.2202uM, original
    title/AID/reference and ungrounded accession, all eleven other observations and
    their quantities/calls. Recompute the summary; the three retained enzyme-named
    ACTIVE observations independently retain its present coarse support. Keep AID2472
    explicitly a coupling counterscreen without asserting Giardia-aldolase inhibition.
  finding_ids:
  - bgc-2191-transcription-class-scope
  target_ids:
  - naturalproductmech:mibig-178140d34c
  owner_paths:
