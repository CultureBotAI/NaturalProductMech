findings:
- finding_id: bgc-2191-transcription-class-scope
  issue_key: chartreusin-ror-gamma-transcription-screen-enzyme-class-overstatement
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: ROR-gamma transcriptional screen lacks retained enzyme-inhibition support
  description: AID2551 at written bioactivities[10] and retained PubChem physical
    row5398 reports an ACTIVE ROR-gamma transcriptional-screen response, generic Potency11.2202uM
    and ungrounded accessionNP_035411. The broad inhibitors-of fallback adds ENZYME_INHIBITOR
    without an enzyme-specific measured target or catalytic-inhibition endpoint in
    the retained row. The defect is this unsupported class assignment, not the screen
    result or a claim that Chartreusin lacks enzyme pharmacology. AID2472 remains
    a coupling counterscreen; the separately retained FEN1/Pol-Iota/Pol-Kappa ACTIVE
    rows continue to support the existing coarse summary.
  target_ids:
  - naturalproductmech:mibig-178140d34c
  field_paths:
  - bioactivities[10].activity_class
  evidence_ids:
  - bgc-2191-assay-owner
  - bgc-2191-source-pubchem_bioassay
  - bgc-2191-query-pubchem_bioassay
  - bgc-2191-activity-classifier
  - bgc-2191-activity-schema
  - bgc-2191-review-skill
  - bgc-2191-review-profile
  owner_paths:
  - repository: CultureBotAI/NaturalProductMech
    path: scripts/seed_from_sources.py
    role: Maintained classify_activity, ACTIVE observation typing and summary derivation
  - repository: CultureBotAI/NaturalProductMech
    path: data/natural_products/shikimates_and_phenylpropanoids/chartreusin.yaml
    role: Generated affected claims; regenerate after maintained correction
  ownership_note: Correct the maintained classifier support scope, not generated YAML
    or source assay values; reserved/nonconsumed decisions.tsv is not a correction
    route.
  normalization_reason: Major scientific claim-scope overstatement despite native
    reproduction passing. The enum is coarse and has no dedicated ENZYME_INHIBITOR
    definition; retained evidence and the classifier unambiguity contract establish
    this finding.
  disposition_reason: Confirmed local source-to-generated support gap, rather than
    an unsupported inference from unavailable external verification.
