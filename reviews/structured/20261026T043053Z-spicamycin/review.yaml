summary: Spicamycin retains positive original source provenance, but the 1983 material
  is a fatty-acyl mixture with unresolved exact acyl-component and natural-hand correspondence.
  The cited 2018 S. fimbriatus/MF372757 source demonstrates septacidin and treats
  spicamycin as a distinct epimer with proposed alternatives. One major applicability
  finding guards the exact spicamycin producer/locus row; the existing empty-method
  withdrawal route cannot implement it, so a separately reviewed maintained consumer
  is required. No septacidin replacement, new producer or universal absence is inferred.
  The review remains partial.
