  - Exact structure/taxon/DOI and full parsed-row SHA reject drift and duplicate matches.
  - The primary bridge is adjudicated before selecting withholding versus a newly
    tested qualification; no source-wide absence is inferred.
  - Genus 1883 and native F001 positive claims survive unchanged, and no A/E activity
    or B006 knockout transfers.
  - Regeneration tests prove only the selected species triple changes and its raw
    assertion remains auditable.
limitations:
- The root section inventories present claims and source routing; chemical identities,
  source-specific experiments, definition claims and optional-content assertions require
  their separately scoped scientific assessments.
- Original retrieval times and immutable source snapshots are reused; authoring time
  is not represented as new source access.
