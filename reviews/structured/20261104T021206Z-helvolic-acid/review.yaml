  issue_key: helvolic-acid-sercamp-aid1347393-unsupported-enzyme-inhibitor-class
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: SERCaMP phenotype title is overinterpreted as enzyme inhibition
  description: The retained AID1347393 Active observation names inhibition of ER calcium
    dysfunction, with blank target and measurement fields. It does not unambiguously
    support enzyme inhibition, but the generic title fallback assigns ENZYME_INHIBITOR
    at bioactivities[6].activity_class and this is the sole backing for bioactivity_summary[0].
    The confirmed defect is unsupported specificity in the generated activity classification,
    not proof that Helvolic acid lacks enzyme activity. Preserve the Active call,
    citation and all seven observations, including repeated AID1963823 and its P43405
    target placement.
