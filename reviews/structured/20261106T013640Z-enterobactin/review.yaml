    and its sole derived summary against retained backing. Preserve Active, KD 0.04
    uM, pubchem.aid:977611, the original source row and ungrounded 2XUZ_A text. Do
    not exclude the observation or infer a protein function. No source/generated-record
    edit is performed by this review.
