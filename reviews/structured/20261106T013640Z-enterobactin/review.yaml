findings:
- finding_id: support-2638-unsupported-binding-enzyme-class
  issue_key: enterobactin-aid977611-unsupported-enzyme-class-and-summary
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Binding affinity is promoted to enzyme inhibition in the activity and sole
    summary
  description: The retained CID34231/AID977611 row describes protein-ligand binding
    affinity and supplies Active/Kd 0.04 uM plus an ungrounded 2XUZ_A token. It supplies
    no enzyme-specific inhibition endpoint or backed enzyme function. The generic
    binding-title rule nevertheless writes ENZYME_INHIBITOR to bioactivities[0].activity_class,
    and the sole bioactivity_summary inherits that class. No other written enzyme-specific
    observation, target root or related-corpus match supports the summary in the retained
    scope. Both narrower assertions are unsupported. The measurement, call, assay
    reference and ungrounded text are faithfully copied and must remain. This is a
    bounded retained-evidence scope defect, not a claim of wrong identity, measurement
    or protein function.
  field_paths:
  - bioactivities[0].activity_class
  - bioactivity_summary
  rule_id: review-yaml-record:major-unsupported-evidence-scope
  native_severity: major
  normalization_reason: Unsupported enzyme specificity inflates both an activity claim
    and the sole summary. The rubric grades unsupported evidence/scope inflation major;
    parsing, measurement and identity are not challenged.
