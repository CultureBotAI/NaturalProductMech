summary: 'pacidamycin 5: exact local provenance and saved encoding consistency are
  supported within a partial review. Retain C36H44N8O11 and the phenyl side chain
  of pacidamycin5, distinct from the indole-containing compound4. The saved SMILES
  has eight specified potential stereo sites and no unspecified sites; the InChI representation
  has three additional unspecified C/N double-bond sites. Exact natural-congener correspondence
  remains unresolved by the inspected abstract and bibliographic evidence. The own
  family abstract reports an Ala4–Phe5 ureido-linkage assay, but those residue positions
  do not identify the compound named pacidamycin5. DOI42.512 is verified bibliographic
  context only. The later JST42.512 request returned HTTP301 redirect-only HTML with
  no article identity or content. Its HTTPS Location is now response-verified but
  has not been requested; the retained congener assignments therefore remain unresolved.'
