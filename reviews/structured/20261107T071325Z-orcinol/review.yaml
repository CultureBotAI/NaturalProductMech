    one methyl group and two phenolic hydroxyls. The nine heavy atoms and nine bonds
    support the retained ChEBI definition of 5-methylresorcinol; no carbonyl, amide,
    sugar-ring or metal is encoded. Neither form has a saved potential stereochemical
    site. Literal stereo_complete:true is compatible with this achiral encoded topology,
    within the maintained atom-centre test; it is not independent natural-identity
    certification. Both canonical isomeric and nonisomeric strings agree, as do formula,
    formal charge, normalized Standard InChI and declared complete key. The saved
    chirality-aware substructure correspondence covers all nine atoms; full_graph_identity_established
