- assessment_id: support-2747-representation-assessment
  area: representation
  topic: Stored molecular representations and stereochemistry
  summary: Both saved forms have 115 atoms, 120 bonds and neutral formula C78H113N19O18,
    with every atom formally neutral. The six reported rings comprise a 16-membered
    macrocycle, two indole five/six ring pairs and one phenyl ring. The stored SMILES
    has 15 carbonyl sites, 14 strict amides and one macrocyclic ester. Its InChI-derived
    form retains the ester carbonyl and replaces the 14 amides with terminal C(OH)=N
    motifs, whose O atoms have degree1 and H1; one site is C=NH. Three primary non-amide
    amino groups remain neutral. Both canonical comparisons are false, the map is
    empty and full graph identity remains false. The matching normalized identifiers
    are compatible with representation changes but are not a complete tautomer-identity
    proof. Both forms retain 12 specified tetrahedral centres. The reconstructed form
    additionally reports 14 unspecified C=N potential-stereo entries. These generated
    bond entries do not negate the source's atom-centred stereo_complete:true policy
    or establish missing experimental stereochemistry by themselves. Six stderr warnings
    belong to the shared original run and are not assigned to this record.
