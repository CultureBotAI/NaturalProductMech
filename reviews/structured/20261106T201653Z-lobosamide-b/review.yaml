    to Unknown/STEREOANY in the reconstruction, and one new imidic C=N potential is
    unspecified. The true atom-stereo flag does not certify all double-bond geometry.
    The lactam becomes reconstructed C26(OH32)=N29, changing carbonyl/amide counts
    1 to 0 while preserving the normalized formula, charge, standard InChI and full
    key. This amide/imidic representation difference is distinct from the A/B E/Z
    congener distinction. Both canonical comparisons are false, the limited atom map
