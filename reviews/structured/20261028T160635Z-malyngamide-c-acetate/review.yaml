findings:
- finding_id: F837-NAMED-ENCODED-C8-IDENTITY-CONFLICT
  issue_key: malyngamide-c-acetate-bgc0001970-1-c8-epimer-identity-conflict
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Named ordinary malyngamide C acetate carries the 8R epimer structure
  description: The current owner and complete MIBiG BGC0001970:1 version 3 row are
    named malyngamide C acetate, but both retained encodings have R configuration
    at the unique acetoxy-bearing ring methine mapped to paper C8. The 2010 own primary
    explicitly distinguishes this 8R epimer, named 8-O-acetyl-8-epi-malyngamide C,
    from ordinary 8S malyngamide C acetate. This confirms a chemical identity conflict
    rather than incomplete stereo specification. The 2010 Lyngbya occurrence is compatible
    with the encoded epimer; the 2018 Okeania producer/occurrence and mgc-locus assertions
    concern a compound reported under the ordinary name and remain conditionally applicable
    pending identity reconciliation. The cause of the source conflation and whether
    to preserve the epimer owner or replace its identity are unresolved. No alternative
    graph, key, taxon, synonym or maintained correction is selected.
