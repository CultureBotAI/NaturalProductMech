- area: consistency
  topic: Versioned classification applicability
  outcome: supported
  summary: 'The saved SMILES topology supports broad cyclic depsipeptide/lipopeptide
    compatibility: a 17-membered ring contains three amide linkages and one ester,
    with an external hydrocarbon substituent and an exocyclic methylene. The ring
    ester-bearing carbon carries a 14-carbon substituent with a distal branch. SMILES
    atom 32 has methyl, ethyl, longer-chain and hydrogen substituents, so it is a
    potential stereocenter whose configuration is unspecified. NPClassifier version
    npclassifier.gnps2.org@2026-09-07 reports Cyclic peptides, Depsipeptides and Lipopeptides
    under Oligopeptides, with Amino acids and Peptides/Polyketides pathways and is_glycoside=false.
    No candidate saturated six-membered C5O ring is detected, which is a bounded motif
    observation rather than a universal glycoside proof. These model categories, source
    BGC NRPS/PKS classes and UNCLASSIFIED filing are distinct axes. Amide counts are
    representation-specific and are not residue counts or direct enzyme/pathway evidence.'
