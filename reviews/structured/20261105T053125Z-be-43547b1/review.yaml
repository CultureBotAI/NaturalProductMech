- area: representation
  topic: Stored molecular forms and stereochemistry
  outcome: supported
  summary: Both original forms parsed into 41 atoms and 41 bonds. Eight comparison
    fields are true, but both canonical isomeric and nonisomeric SMILES comparisons
    are false; the direct atom map is empty and full-graph identity was not established.
    The SMILES form has five carbonyl sites, including three C(=O)N amides, one ester
    and one ketone. The InChI-derived form retains three carbonyls, including one
    amide, together with two C(O)=N sites. This supports an amide/imidic representation
    explanation without proving an identical fixed tautomer. Both forms retain a 17-membered
    ring. Both forms retain three specified ring tetrahedral centers and one specified
    E alkene, plus one unspecified side-chain tetrahedral center. The literal InChI
    /t22? marker and stereo_complete=false preserve this limitation; no observed stereoisomer
    mixture is inferred. The reconstructed form additionally exposes two unspecified
    C=N double-bond stereo elements. The OH-bearing hydrogen-free center has different
    CIP labels as priorities change between representations; this is not independent
    evidence of inversion. Six original diagnostic warnings remain global and unassigned.
