  OAK, live authorities and primary-paper verification are unavailable.
- Both canonical comparisons are false and the attempted atom map is empty. The observed
  neutral tautomer representations share formula, Standard InChI and full key, without
  establishing exact graph identity.
- The eight original undefined-stereo warnings are a shared unassigned stream; none
  is allocated to this owner.
- The whole selected owner was read, but scientific completion is partial because
  full QC, complete ontology authority coverage and external source verification were
  unavailable. No native status or history was changed.
- The branch uses cached base ce6a5498df5be51116bd5e0c119023ee62bb5464. Fresh origin/main
  verification and publication are deferred because the user prohibits all external
  requests.
