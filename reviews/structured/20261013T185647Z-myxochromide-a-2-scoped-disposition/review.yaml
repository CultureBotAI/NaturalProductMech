findings:
- finding_id: F1
  issue_key: mibig-BGC0001422-myxochromide-a-proline-stereo
  category: identity
  severity: major
  status: open
  certainty: provisional
  title: Assigned proline stereochemistry requires source-level adjudication
  description: The source-matching graph gives an R-proline fragment on virtual hydrolysis;
    BGC0001422's own module-5 substrate depicts S-proline. The independent 2006 A-series
    table names L-proline, but concerns M. xanthus DK1050 rather than M. fulvus HW-1.
    Sequence-based substrate predictions cannot prove the final product configuration,
    and the cited 2017 HW-1 evidence is unavailable. Thus the discrepancy warrants
    an explicit qualification and exact-strain check, not an automatic stereo flip.
    The two undefined alanine centers and stereo_complete:false are internally correct
    and must not be filled from another strain.
