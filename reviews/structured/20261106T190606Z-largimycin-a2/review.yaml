- assessment_id: bgc-2745-representation
  area: representation
  topic: Stored molecular forms and stereochemical scope
  outcome: supported
  summary: 'Each form has44 atoms/48 bonds with an18-membered macrocycle, two three-membered
    epoxides and two five-membered rings. Macrocyclic C20=N24-O25-C26(=O) is an O-acyl
    oxime, outside the strict C(=O)-O-C ester predicate. Two COOH groups, two thioethers
    and one SMILES N-acetyl amide are retained. The two C-O-C bridges are epoxide
    oxygens, not glycosidic links. Both forms retain six specified tetrahedral centres
    and three specified double bonds: one E and one Z C=C plus a Z oxime C=N. The
    InChI form adds one unspecified imidic C=N potential. The true source atom-stereo
    flag does not independently certify natural configuration or every reconstructed
    double bond. The single N-acetyl amide becomes reconstructed terminal C14(OH31)=N28;
    carbonyl counts5 to4 and amides1 to0. The separate macrocyclic oxime C=N-O-C(=O)
    is retained. Normalized identifiers/formula/charge agree, while both canonical
    comparisons are false, the one-way map is empty and full_graph_identity_established
