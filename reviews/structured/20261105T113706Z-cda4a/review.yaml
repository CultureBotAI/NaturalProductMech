  summary: Both saved forms have C67H78N14O26 at net charge 0, 107 atoms and 113 bonds.
    Eight normalized comparisons are true, while both canonical SMILES comparisons
    are false and the direct atom map is empty. The SMILES retains twelve amides,
    one ester, four terminal carboxyl groups, no phosphorus and a 31-membered macrocycle.
