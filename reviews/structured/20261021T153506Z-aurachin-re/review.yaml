    and a 17,525 bp rau region. Native rauA mutant M02 loses RE and accumulates the
    isolated N-deoxy precursor 2; pK4-rauA complementation restores a small RE signal.
    Full rauA–I expression in R. erythropolis JCM 3201 yields RE versus vector control,
    whereas expression induction impairs growth. Purified C-terminal His6 RauA made
    in E. coli directly converts precursor 2 to RE in an NADPH/ferredoxin system.
    These are three separate experimental contexts, with an exact final RE endpoint.
