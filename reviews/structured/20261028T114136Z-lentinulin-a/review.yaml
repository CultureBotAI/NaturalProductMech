summary: The retained lentinulin A encodings agree internally, but the saved neutral
  mass implies a protonated ion near 1290.85 Da while the own paper assigns 1304.87
  Da to named macrocyclic lentinulin A. This material identity/source discrepancy
  is about 14.02 Da; its molecular cause and any replacement remain unresolved. Separately,
  native oxidized-family detection does not establish the exact unmodified native
  product. Revised figure content, complete configuration and molecular target remain
  unverified.
