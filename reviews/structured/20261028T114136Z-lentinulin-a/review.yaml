- 'The paper uses broad natural-family language, while its specific native-production
  results distinguish forms: non-oxidized native macrocycles are reported for omphalotin
  and dendrothelin, and oxidized forms for all three peptide families. The Lentinula
  edodes caption identifies oxidized cyclic peptides; another native observation is
  a methylated linear core. Recombinant unmodified lentinulin A is demonstrated separately.
  These observations limit direct native-production support for the exact unmodified
  owner without proving its natural absence.'
