summary: A native Xenorhabdus eapokensis DL20 feature supports the named dehydro product
  at HRMS/MS resolution, but the source leaves the ring double-bond position unresolved.
  The inspected Klebsiella oxytoca genetic experiments identify parent tilivalline
  and do not establish the exact dehydro endpoint. The imported correlation requires
  curation, provisionally pending the original supplement. Exact regiochemistry and
  the retained absolute hand remain unverified.
