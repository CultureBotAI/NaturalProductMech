    "old_stereo_complete": "false", "selector": "BGC0001205:5"}]. Adjudicate whether
    to correct the named congener graph or split/reassign the source assertion, with
    no silent rename and no automatic transfer of source-specific occurrence/locus
    claims. For C, the retained C/D graphs are an encoded enantiomer pair of one constitution;
    this does not mean natural C and D are enantiomers. For E, the F constitutional
    relationship does not establish a complete F stereograph. Preserve the final 2004
    Note and 2015 table as explicit provenance.  The current ChEBI-only actions do
    not supply an executable arbitrary-graph or label repair here. Before adoption,
    verify every atom/bond, supported geometry and undefined centre, derive valid
    SMILES/InChI/key/formula, and pin the complete candidate. Do not copy invalid
    default authority SMILES, silently choose an absolute hand, or erase all chirality.
    Enforce ignored-inclusive target/corpus/raw collision checks and fail on any changed
    source field or ambiguous target. Preserve original source rows/mints; re-evaluate
    exact-key LOTUS, PubChem samples/activities, literal identifiers, sibling links,
    ChEBI and filing/classification joins individually instead of carrying old-key
    claims. Current citation and strain overlays reject a structure-corrected row,
    so implement and test any necessary composition against the same original full-row
    guards. Preserve the established biological context at its demonstrated congener/resolution;
    exact identity uncertainty alone is not a finding that biosynthesis never occurred.'
