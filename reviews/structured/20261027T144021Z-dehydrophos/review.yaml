summary: The complete own PMID 20416511 abstract names dehydrophos as a vinyl-phosphonate
  tripeptide produced by Streptomyces luridus. It separately reports heterologous
  production after integrating an S. luridus fosmid into S. lividans. This supports
  the named material and native-versus-host distinction at abstract tier. Local encoding
  agreement is supported, while natural configuration, exact GU199252.1 mapping and
  later pathway steps remain unresolved.
