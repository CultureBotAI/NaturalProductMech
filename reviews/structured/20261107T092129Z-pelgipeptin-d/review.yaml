  summary: Both stored forms parsed with declared key/formula agreement. Both canonical
    SMILES comparisons are false; the saved chirality-aware map is empty and complete_atom_count_match
    is false. In every case full_graph_identity_established remains false.
  scope_note: Both saved forms are neutral C53H90N12O12 with 77 atoms and 78 bonds
