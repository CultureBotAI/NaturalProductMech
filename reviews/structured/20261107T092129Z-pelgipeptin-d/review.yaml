    ring remain. The SMILES has ten carbonyls, nine secondary amides and one ester;
    the InChI-derived form has one carbonyl, no strict amide and nine C(OH)=N motifs.
    This explains the canonical difference at the functional-pattern level. Both forms
    retain eleven unspecified tetrahedral candidates, including the branched side-chain
    centre. The source stereo_complete:false preserves this limitation. The InChI-derived
    form adds nine unspecified imidic C=N candidates; these are not nine missing source
    alkene geometries. No natural configuration or residue stereosequence is assigned.
    Eight undefined-stereochemistry warning lines occur in the original 368-byte stderr.
    They are globally unattributed and are not assigned to any owner or form.
