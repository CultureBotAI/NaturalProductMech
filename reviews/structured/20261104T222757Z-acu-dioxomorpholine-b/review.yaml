- area: consistency
  topic: Versioned classification applicability
  outcome: concern
  summary: NPClassifier reports Alkaloids/Amino acids and Peptides, Peptide alkaloids
    and Other indole diketopiperazine alkaloids. The actual six-membered ring has
    one ester and one amide, rather than the two amide nitrogens of a diketopiperazine
    ring. This is a bounded applicability concern for the model’s named family; the
    retained dioxomorpholine/depsipeptide topology does not support endorsing that
    exact family. The model output remains faithfully reported, and this mismatch
    alone is not a source-ingestion defect or a supported record-edit finding.
