- area: representation
  topic: Stored molecular forms and stereochemistry
  outcome: supported
  summary: Both stored forms parse as neutral C28H40N2O9 with 39 atoms and 40 bonds.
    Eight comparisons agree; both canonical SMILES comparisons are false and the direct
    atom map is empty. The SMILES-derived form has a nine-membered dilactone ring,
    three ester motifs overall and two amides. The InChI-derived form replaces both
    C(=O)N sites by C(O)=N, retains the three esters and has two additional unspecified
    C=N bonds. Five unspecified tetrahedral centres remain in both forms. This supports
    a bounded amide/imidic representation interpretation; equal Standard InChI/full
    key does not establish fixed-form or natural identity. The disclosed stereo_complete=false
    is retained without inventing stereospecific assay support.
  assessment_id: support-2486-representation
