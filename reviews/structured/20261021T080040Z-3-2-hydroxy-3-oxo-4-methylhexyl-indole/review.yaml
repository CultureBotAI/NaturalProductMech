limitations:
- The original 1995 journal DOI is correctly identified, but its individual ID3 structure/citation
  content remains unverified because only the primary abstract was accessible. NPAtlas
  provides database mapping; independent patent occurrence is kept separate from journal-citation
  verification.
- The 2014 main body and named supplement were unavailable through the previously
  documented free routes. The same real access receipts are reused, without claiming
  a new retrieval or inspection. Exact hydroxyhexyl experiments, native chromatograms,
  constructs, controls and stereochemical measurements remain unverified.
- Two unassigned stereocentres accurately describe the current owner. XclA S-selectivity
  in a family-level abstract cannot establish both configurations of this specific
  congener. No raw spectrum was reinterpreted.
- The primary patent was visually checked in its original PDF. Printed ID3 formula
  C15H19NO2 corrects an HTML transcription error, and its mass data agree with the
  owner. Patent ID1, ID2 and ID4 are different congeners; their data are not substituted.
- CHEBI:220715 is a two-star exact match. Its SMILES export fails RDKit, while its
  valid default MOL matches the owner. The full-key search is bounded and does not
  claim universal ontology absence.
- No mechanism, molecular target, activity or clinical assertion is present to audit.
  Optional absence is not a defect; iModulonDB is not applicable to any actual named
  gene/protein/regulator assertion in this owner.
- No confirmed contradictory owner assertion was established. Scientific review remains
  partial for the original 1995 citation and 2014 target-specific experiments; no
  corrective finding or unsupported maintained-input change is proposed. Native checks
  and final bundle save are supplied by the root reviewer.
- The configured full identifier-label gate accepts 499 warning-level taxon-label
  mismatches, 35 explicit exceptions and 4,722 no-adapter pairs across the corpus;
  its exit 0 is not independent verification of every identifier or of this record's
  scientific claims.
- The quality suite skips the optional sibling AntibioticMech checkout comparison
  because the isolated clone has no sibling checkout, and skips three command-frontmatter
  cases because their parameter sets are empty. Pinned-hash and network governance
  checks still ran.
- Shared native gates assess deterministic corpus consistency and configured invariants.
  They do not establish biological production, stereochemical specificity, evidence
  adequacy or literature-level claim support.
notes:
- No scientific owner, source inventory or native curation status/history was changed.
  Partial scientific review does not promote SEEDED to REVIEWED.
- Native corpus checks reuse actual successful commands from the identical tracked
  base with original receipts. Exact target strict validation was run afresh.
- If further primary access resolves the remaining citation or stereochemical questions,
  record a new immutable review observation before proposing a maintained-source correction.
  No corrective input change is supported solely by unavailable text.
