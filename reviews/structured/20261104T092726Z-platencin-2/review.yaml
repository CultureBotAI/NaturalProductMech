  assessment_id: support-2378-representation
  summary: Both saved forms are neutral C24H27NO6 with 31 heavy atoms and 34 bonds,
    equal normalized Standard InChI and declared full key. Both canonical-SMILES equality
    flags are false, the chirality-aware atom map is empty and complete_atom_count_match
    is false. The source SMILES contains C17(=O18)–N19(H); the InChI-derived form
    contains C18(–O27H)=N24. The canonical branches likewise differ at C(=O)N versus
    C(O)=N, consistent with mobile-H amide/imidic tautomer normalization. Both retain
    three specified tetrahedral centers and one unresolved center; the reconstructed
    C=N adds an unspecified double-bond possibility. This local witness does not establish
    whole-graph identity or a new natural stereochemical defect. Both complete tables
    retain an aromatic ring with two phenolic hydroxyls and a carboxylic acid, attached
    through the amide/imidic linkage to the polycyclic carbon framework and its ketone.
