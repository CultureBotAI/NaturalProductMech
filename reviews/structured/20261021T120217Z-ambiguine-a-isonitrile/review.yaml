  primary drawing. AmbP3 directly forms A from hapalindole G and DMAPP, supporting
  the inherited enzyme method within the locus vocabulary; independent native isolation
  and species occurrence are supported. A minor CyanoMetDB emitter defect turns an
  NMR-use flag into an unqualified structure-confirmation phrase. Original 1992, 1998,
  2007 and complete 2013 main-text access gaps keep the review partial.
