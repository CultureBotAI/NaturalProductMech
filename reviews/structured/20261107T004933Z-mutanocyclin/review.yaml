- assessment_id: bgc-2795-representation
  area: representation
  topic: Stored molecular forms and stereochemical scope
  outcome: supported
  summary: The saved Mutanocyclin forms each contain 14 atoms and 14 bonds, with one
    nitrogen-containing five-ring. The SMILES graph has lactam C12(=O13)-N11, an enol
    C4-O5H, an isobutyl side chain, and a separate C-acetyl ketone C1(=O2)-C0 attached
    through ring carbon C3. The acetyl substituent is carbon-linked, not an N-acetyl
    group. No strict ester or candidate sugar ring is present. These features support
    the encoded acyl tetramic-acid-like structure without importing Leuvalin or Tyrvalin
    activity or identity evidence. The sole potential tetrahedral centre is specified
    R at SMILES atom C6 and at the corresponding InChI atom C6. CW/CCW tags differ
    with neighbour order while the R assignment agrees. The small-ring imidic double
    bond adds no independent potential-stereo row. The source stereo_complete:true
    flag is an atom-centred statement, not independent proof of the natural stereoisomer.
    The secondary lactam becomes a C(OH)=N site in the InChI-derived graph, while
    the C-acetyl ketone remains. Strict amide counts change from one to zero. Formula,
    aggregate charge, atom/bond counts, normalized Standard InChI and full key agree,
    but both canonical SMILES comparisons are false and the limited atom map is empty.
    This mobile-hydrogen representation difference is not by itself a record defect
    or proof of exact natural tautomeric identity.
