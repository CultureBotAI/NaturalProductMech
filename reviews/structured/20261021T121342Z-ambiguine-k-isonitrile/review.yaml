findings:
- finding_id: S059-F-LOCUS
  issue_key: mibig-bgc0001126-compound7-link-evidence
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Entry-wide assays overstate exact ambiguine K locus demonstration
  description: BGC0001126:7 carries Enzymatic assays and CLUSTER_DEMONSTRATED. The
    inspected official SI characterizes A formation and common precursors, while explicitly
    proposing late K chemistry. The defect is congener-specific applicability of an
    entry-wide method; neither native isolation nor a drawn proposal demonstrates
    the exact K endpoint. This finding is distinct from any structural identity conflict.
    Complete main text remains unavailable, so no whole-literature assay-absence claim
    is made.
