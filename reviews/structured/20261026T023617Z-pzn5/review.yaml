summary: 'PZN5, also identified as Lumizinone A, has completed bounded chemical and
  biological source scopes. Its positive historical TT01 occurrence is misgrounded
  to current P. luminescens 29488: exact type aliases and current authorities instead
  place TT01 in the P. laumondii lineage. One major finding proposes withholding only
  that guarded occurrence triple while preserving positive TT01 provenance and the
  separate Ruminococcus evidence. The existing exclusion route does not emit a corrected
  taxon, and the literal 29488/QID name route remains valid.'
