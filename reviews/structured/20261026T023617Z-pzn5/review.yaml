    DOI10.1038/JA.2016.79 positively identifies Lumizinone A(1), with exact nomenclature
    and formula matching PZN5, from historical P. luminescens subsp. laumondii strain
    TT01. It is not Lumizinone B(2). That positive historical occurrence is distinct
    from the retained current species grounding. Current NCBI141679/2218628 explicitly
    include TT01/CIP105565/DSM15139 type aliases, and LPSN identifies the historical
    subspecies as a homotypic synonym of current P. laumondii. The current TT01 lineage
    excludes 29488, whose present P. luminescens species record has Hb-type aliases.
    Thus the imported29488 occurrence is a confirmed source-specific current taxon
    attribution conflict, not a negative result for the original stock.
