summary: Microginin 735 retains a MIBiG-derived, stereochemically incomplete structure.
  The retained microginin 735 scaffold (Ada-mPro-Htyr-Pro-Tyr, 0 chlorine atoms) is
  consistent with the proposed correspondence to paper compound 9. This correspondence
  is inferred from the retained structure and the paper group descriptions; the numeric
  label was not independently read from figure pixels or SI. It must not be promoted
  to a directly verified complete atom mapping. The saved graph fixes conventional
  proline C4 methylation, whereas the source leaves the proline carbon unassigned
  for compounds 7–9. This source-specific excess precision is a major curation finding;
  the stored positional isomer is not experimentally disproved and no replacement
  is established. The primary supports the LEGE 91341 native series and the mic family
  locus, with congener-specific experimental limits and no transferable assay result.
