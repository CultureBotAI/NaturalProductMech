limitations:
- Original source preparations were retrieved before this record intake and reused
  with their actual access timestamps. The entire 2010 SI and original Figure 2 were
  inspected; the complete main body was unavailable.
- The source contains an H39N/H222N versus glutamine wording inconsistency and a product-number
  mismatch between Figure S1 and Table S3. These do not obscure the chemically named
  exact product but should not be copied as resolved sequence or numbering facts.
- No raw spectrum reanalysis, historical expression-construct sequencing, native knockout,
  purified NspE turnover or complete catalytic-intermediate mechanism is established
  here.
- The original 1995 paper was not available beyond publisher/Crossref metadata; no
  unsupported claim finding follows from this access limit.
- The 2010 main-body HTTP response is a client challenge. Primary SI and original
  Figure 2 are available and independently spot-checked for this QA; the complete
  main body remains unread.
- GenBank metadata/features and deposited protein accession mappings were inspected,
  but nucleotide-to-protein translation, experimental constructs and specific producer
  strain were not independently sequenced or inferred.
- The iModulon result reuses the actual 07:21:15Z catalogue execution and is limited
  to those 28 datasets; it is not a new catalogue fetch or a universal claim of no
  expression data.
- The configured full identifier-label gate accepts 499 warning-level taxon-label
  mismatches, 35 explicit exceptions and 4,722 no-adapter pairs across the corpus;
  its exit 0 is not independent verification of every identifier or of this record's
  scientific claims.
- The quality suite skips the optional sibling AntibioticMech checkout comparison
  because the isolated clone has no sibling checkout, and skips three command-frontmatter
  cases because their parameter sets are empty. Pinned-hash and network governance
  checks still ran.
- Shared native gates assess deterministic corpus consistency and configured invariants.
  They do not establish biological production, stereochemical specificity, evidence
  adequacy or literature-level claim support.
- Baseline reuse concerns the identical committed inputs and original executed checks;
  it does not claim a fresh network/governance or ontology-cache refresh.
notes:
- No scientific owner, inventory, curation table, native status or history was edited.
  Actions are proposed work.
- Baseline gates retain their actual original receipts after byte-for-byte input verification;
  target strict validation ran afresh. Scientific failed or unavailable checks are
  distinct from bundle validation.
- Primary source preparations were retrieved earlier in this campaign and reused with
  their original access times. Independent specialist QA checked the original figure,
  native detection note and correction guards.
