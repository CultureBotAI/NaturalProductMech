- assessment_id: C336-A-PRIMARY-SCOPE
  area: scope
  topic: Primary identity and experimental precision
  outcome: concern
  summary: 'The retained naphthyridinomycin graph and exact current BGC0000394:1 are
    neutral C21H27N3O6 with eight unspecified centres. Original 2013 SI Figure S1A
    has the same whole constitution and an explicit eight-centre drawing; the corrected
    002 source model gives SXDWNOFDSOXRRM-NBRGEEMQSA-N and becomes exactly the retained
    graph after stereo removal. Literal short NPA05217 returns NPA005217 and instead
    specifies only two centres; two-star CHEBI202424 matches that partial model. Literal
    CID3085238 is C21H27N3O7 with a different constitution: its aryl methyl attachment
