- assessment_id: support-2770-representation-assessment
  area: representation
  topic: Stored molecular forms, atom stereo and motif boundaries
  summary: Both forms have 63 atoms, 65 bonds, charge zero and formula C44H70N8O11.
    The three rings are a 19-membered ester macrocycle, a fused six-membered C4N2
    ring with an N-N bond and a separate aromatic six-ring. The N-N ring bears an
    external hydroxyl. Carbonyl counts change from eight to three and amide counts
    from seven to two; five terminal C(OH)=N sites occur in the InChI-derived graph.
    One ester and a separate aryl methoxy group remain, with no saturated C5O sugar-cycle
    hit. The source ring is atoms 0, 1, 2, 4, 5 and 6, with N5-N6 and C2-O3(H). Its
    ester is C41(=O42)-O40-C38, and O19 is the methoxy oxygen. The InChI-derived ester
    is locally C43-O62-C26, with ring hydroxyl C28-O53(H) and imidic carbon indices
    21, 37, 38, 39 and 40. The source graph has sec-butyl attachments at both the
    external and macrocycle sites. This remains a congener-specific observation, not
    a transferred configuration or an atom-map claim. The saved standard InChI, complete
    key, formula, formal charge, atom count and bond count agree between forms, but
    both canonical isomeric and nonisomeric SMILES comparisons are false. The correspondence
    list is empty, complete_atom_count_match is false and full_graph_identity_established
    is false. Normalization is not proof of explicit bond-order, proton-placement,
    stereo or natural-sample identity.
