summary: 'nostocyclopeptide A2: exact local provenance and saved encoding consistency
  are supported within a partial review. The retained nostocyclopeptide A2 entry has
  key OYHPNVXZUBWKJE-ZYAMHZMNSA-N, eight specified tetrahedral centres and one specified
  imine double-bond site in the saved SMILES diagnostic. Crossref metadata for DOI10.1021/np000316k
  names isolation and structure determination of A1 and A2 from Nostoc sp. ATCC53789,
  but provides no abstract or primary structure data. The title alone does not resolve
  the exact A2 configuration or imine assignment. PMID12515465 describes nosE/nosF
  cloning and biochemical work on 4-methylproline biosynthesis; its own accession
  metadata is AF204805. The owner retains AY167420.1. This is a limited unresolved
  accession/scope join, not evidence that the enzyme article is irrelevant to the
  biosynthetic family or that the retained locus is wrong. The separate isolation-paper
  DOI10.1021/np000316k has only own bibliographic metadata here. Its 2000 online and
  2001 print dates describe the same retrieved record.'
