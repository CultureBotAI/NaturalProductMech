  ownership_note: Repair maintained classifier support scope; do not edit generated
    YAML or the unchanged source observations, and do not use reserved/nonconsumed
    decisions.tsv.
  normalization_reason: Major unsupported observation-level activity typing changes
    scientific claim scope despite passing native schema/reproduction checks. The
    enum has no dedicated CYTOTOXIC definition; the finding follows retained evidence
    and the classifier unambiguity contract.
  disposition_reason: Confirmed source-to-generated-class support gap in five exact
    observations; not merely a consequence of unavailable external sources.
