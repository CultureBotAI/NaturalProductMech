findings:
- finding_id: bgc-2183-invivo-class-scope
  issue_key: bactobolin-in-vivo-tumor-assays-cytotoxic-class-overstatement
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Five in-vivo tumor-screen observations lack retained support for CYTOTOXIC
    typing
  description: bioactivities[0–4] (AIDs296,256,258,330,292) explicitly describe in-vivo
    NCI tumor screens in mice. Their retained rows report Active outcomes but no cellular
    cytotoxicity endpoint, quantitative activity field or target. The seeder broad
    tumor/cancer pattern adds CYTOTOXIC despite its own requirement that the assay
    name unambiguously support the class. The unsupported step is that observation-level
    classification; this does not deny antitumor activity, establish the primary experimental
    method, or deny cytotoxic pharmacology. The other20 written cell-growth observations
    independently support the existing summary.
  target_ids:
  - naturalproductmech:mibig-3089dc7277
