  area: other
  topic: Computed classification and full-table topology limits
  outcome: concern
  summary: 'The complete graph is a prenyl-substituted hydroquinone: one benzene ring,
    two phenolic hydroxyls and a gem-dimethyl alkene side chain. It contains no carbonyl,
    carboxyl or ether bridge. NPClassifier''s Phenolic acids (C6-C1)/Simple phenolic
    acids labels therefore require an applicability caveat; they remain explicitly
    named/versioned predictions rather than asserted carboxylic-acid topology or evidence
    of wrong structure. The false-glycoside result is consistent with the inspected
