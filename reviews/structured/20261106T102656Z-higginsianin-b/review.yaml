  topic: Stored molecular forms and stereochemical specification
  outcome: supported
  summary: 'Higginsianin B retains neutral C27H40O4, 31 atoms, 33 bonds and three
    six-membered rings: two carbocyclic and one aromatic oxygen-containing pyrone.
    Five tetrahedral centres (four R, one S) are specified, with no unspecified potential
    atom or double-bond entry. Compared with the separately captured A context, B
    lacks the extra five-membered ether bridge and has two hydroxyl oxygens. The strict
    ester-query zero reflects its aromatic pyrone bond predicate. Both canonical strings
    and the limited 31-atom map agree, but full graph and natural identity remain
    unproved.'
