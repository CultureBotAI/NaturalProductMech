    to GenPept QNH85850.1 from MT844061.1 in HKI0521. Those accession, sequence and
    strain associations are attributed database/curation claims; no current sequence,
    CDS, construct or alignment was obtained. The homolog enzymatic assay is not silently
    reassigned as a direct assay of the HKI0521 protein. Protein identity remains
    unverified at that external-evidence level despite exact preservation of the local
    grounding.
