    the second says that process contributes to Bolagladin B. This is a partial process-level
    graph. The record distinguishes the HKI0521 bolR deletion phenotype and tail-shortened
    shunt metabolites from an in-vitro assay of a BolR homolog. It explicitly leaves
    native oxaloacetyl/citryl-CoA activation timing unresolved and does not assign
    exact substrate or product. That bounded wording is internally consistent; the
    reader establishes preservation and maintained structure, not fresh experimental
    causality. The enzyme node and pathway item use UniProtKB:A0A7G7XYE0. Historical
