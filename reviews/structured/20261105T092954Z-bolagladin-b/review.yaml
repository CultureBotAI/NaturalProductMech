    key BPAWMVDVEWZKAP-GQZVVMBSSA-N, neutral formula C40H63N5O14 and NPAtlas cross-reference
    NPA033056 identify this encoded record. Two MIBiG source entries, BGC0002327 version
    3 and BGC0002336 version 2, are consolidated here; they are not two independently
    verified corpus molecules. Their exact retained rows share the encoding, but the
