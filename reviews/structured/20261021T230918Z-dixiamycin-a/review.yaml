- evidence_id: S194-E-P194-2017
  kind: primary_source
  reference: DOI:10.1039/C7SC01182B; PMCID:PMC5613243
  locator: Complete scientific main and all 53 SI pages of text/captions read; original
    main Figures 1, 2, 3 and 7 viewed. No exhaustive all-spectrum reassignment.
  accessed_at: '2026-10-21T21:29:18.969555Z'
  support: partial
  summary: 'Donor Streptomyces pactum SCSIO 02999 is distinct from the retained HKI0576
    source. The authors call XiaK equivalent to XiaH, but this is not an independently
    verified complete sequence/construct crosswalk. Figure 1 explicitly distinguishes
    dixiamycin A (8, aR) from B (9, aS). The shared Standard InChIKey/ordinary tetrahedral
    graph does not encode this N–N axial distinction. The full approximately 30-kb
    cluster in YF11 produces 8–11. E. coli BL21(DE3) with pCSG2607 XiaK and fed xiamycin
    produces 12 as the major endpoint and minor 8/10; a separate YF11 XiaK system
    gives minor 8–11. Purified N-terminal His6-XiaK is a 65.4-kDa FAD-associated protein.
    Main in-vitro conditions include 300 µM xiamycin A, 1 mM NADPH/FAD, 5 µM enzyme
    and 50 mM phosphate pH 8 at 30 °C for 2 h. The product is unstable N-oxy-xiamycin
    12, not purified-enzyme formation of dixiamycins 8–10. SI Figure S2 uses a 6-h
    assay description; those condition statements are kept source-specific. Intermediate
    12 co-elutes with oxiamycin 7 in some analyses and is supported by derivatization.
    Longer incubations yield xiamycin F/G/H (17–19), not dixiamycin A/B. Radical/EPR
    and oxygen-dependence results do not identify every proposed intermediate. Whole-cell
    transformations and proposed additional cellular components remain distinct from
    the purified reaction. The native XM47i ΔxiaP experiment is a separate isotope-work
    context. Limits: This later source does not establish HKI0576 XiaH protein identity
    or invalidate an uninspected exact 2013 XiaH experiment. Original 2012/2013 HKI0576
    bodies and detailed pure-enzyme endpoint remain required source gaps for a stronger
    claim.'
  snapshot_sha256: 213f2d34a4639a27d3bd4b14507a280925d08b2d45947fac328b77f71ea471cd
