- assessment_id: bgc-2292-classification
  area: consistency
  topic: Classification
  outcome: concern
  summary: The source cluster is TERPENE plus PKS; the named/versioned NPClassifier
    output is Terpenoids / Sesquiterpenoids / Drimane sesquiterpenoids with is_glycoside:true.
    The complete graph contains a fused cyclic ester and hydroxylated oxygen-linked
    carbon within the polycyclic framework, plus a separate conjugated acyl ester.
    That arrangement does not itself establish a detachable carbohydrate residue or
    a sugar–aglycone glycosidic linkage. This is an applicability concern for interpreting
    the prediction as chemistry, not a claim that an empty saturated-C5O helper excludes
    every smaller or modified sugar. The schema explicitly defines this field as a
    computed prediction and the seeder preserves it faithfully; no source-identity
    defect, schema violation or automatic replacement of the model value is established.
