- assessment_id: bgc-2611-representation
  area: representation
  topic: representation
  outcome: supported
  summary: The two saved forms regenerate C31H37NO7, net charge 0 and the declared
    full key. The original form has a 20-membered ester-containing macrocycle, two
    six-membered rings, one amide and a ketone. Reconstruction replaces the amide
    C(=O)-NH with C(OH)=N bearing a terminal hydroxyl oxygen while retaining the ester
    and three specified tetrahedral centers. Both canonical comparisons differ and
    the attempted atom match is empty, so normalized identifier agreement is not complete
    graph proof. Two original double bonds have specified geometry and one original
    alkene remains unspecified; reconstruction retains that uncertainty and adds an
    imine descriptor. The true stereo_complete flag is consistent with the implemented
    atom-centre test and does not certify every double bond.
