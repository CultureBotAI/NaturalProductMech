limitations:
- The exact-key authority search is bounded to current ChEBI results and the complete
  committed eligible table; it is not an assertion about every chemical database.
- Database graph agreement validates copied identity and identifiers, not purity,
  assay concentration or independent re-elucidation of the original experimental isolate.
- The full accepted-manuscript main prose and Methods were read, together with all
  main figure captions and original Figures 1, 3, 4 and 5 pixels. References were
  not exhaustively audited and Figure 2 phylogenetic pixels were not required for
  the target claim.
- Compound 4 is reported by HRMS/NMR, but detailed spectra were not independently
  available; the main Methods explicitly exclude it from HMBC. The internal Results
  formula error is resolved using the depicted structure and consistent mass, not
  by copying the erroneous formula.
- Supplementary original mutant gels, detailed LC methods and structural records remain
  unread after the preserved bounded access attempts. Their absence from the current
  accessible evidence does not invalidate the directly inspected main-paper phenotype,
  but the review remains partial.
- The deposited interval bridges FPSE_06372 to the paper FCK1 gene, but complete mutant
  alleles and recombinant sequences were not reconstructed or independently translated.
  The original deposited annotation lacks FCK2 and FCK4 as explained by the paper.
- No direct enzyme producing exact compound 4, complete final oxidation mechanism,
  exact compound 4 heterologous product, receptor assay or wheat occurrence was inferred
  from neighbouring compounds. Current chemical authority and taxonomy resolution
  are handled in the separate identifier packet.
- The configured identifier-label gate accepts 499 warning-level mismatches and 35
