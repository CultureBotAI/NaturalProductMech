- evidence_id: S151-E-COLI-2021
  kind: primary_source
  reference: DOI:10.1128/AEM.01839-21; PMID:34669429
  locator: 'Complete scientific body, Materials and Methods, embedded tables and captions
    in colibrimycin2021-body-tables.txt were read. Original Figures 1 and 2 were retained;
    Figure 1 pixels were viewed. External supplementary material was not recovered.
    Retained source: /private/tmp/npm-review-work/shared-next-batch016/review-support/attempt-004/colibrimycin2021.html'
  accessed_at: '2026-10-21T19:09:58.769471Z'
  support: supports
  summary: 'Streptomyces sp. CS147 is the native culture studied. Disrupting the third
    module of cbm23 removes peaks 1/B1 and 3/A1, while several C-family products persist
    or increase. Regulatory, halogenase and other native-background mutants have distinct
    product profiles; these are not blanket final-product enzyme assays. A1 is unstable
    during acidic purification and becomes cyclized A2/A3. A/B/C are distinct structures,
    not interchangeable names. Formation of the C-family alpha-ketoamide and the proposed
    iterative NRPS route remain mechanistic proposals. The retained unsuffixed graph
    is not identified merely by its formula. Its open-chain alanine/alpha-ketoamide/asparagine
    features differ from displayed cyclic A2. The completed independent comparison
    in S151-E-FIGURE-MAP finds no match among the 13 displayed constitutions. Purification-artifact
    conclusions cannot be assigned to the unmatched retained graph. Tested purified
    compounds lacked activity in the reported antimicrobial, antifungal and cytotoxic
    assays. No antiviral endpoint is reported in the inspected body. External per-compound
    assay tables and structure spectra remain unavailable. Limits: The initial NCBI
    efetch article was metadata/abstract only; the later official PMC HTML supplied
    the full scientific body. The external supplementary spectra remain uninspected;
    the separate S151-E-FIGURE-MAP documents the completed drawing transcriptions.'
