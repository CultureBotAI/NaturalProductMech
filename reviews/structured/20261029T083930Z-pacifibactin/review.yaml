summary: 'pacifibactin: exact local provenance and saved encoding consistency are
  supported within a partial review. Retain C35H60N12O18 and two unspecified potential
  tetrahedral centers. The mixed NRPS/PKS database classification and a siderophore
  title do not prove this exact molecular structure. Exact natural-congener correspondence
  remains unresolved by the inspected bibliographic metadata and saved local structure
  evidence. Own ACS metadata identifies a pacifibactin paper about ambiguity in NRPS
  predictions and four bidentate chelating groups, but contains no abstract. PMID23209202
  yielded a DNS failure and no own metadata. Its possible relationship to DOIjb.01845-12
  remains unresolved; the ACS foreign reference does not prove that alias. The actual
  ACS request returned HTTP403 Cloudflare challenge, with no article identity or primary
  text. This access failure does not refute the retained structure or biological origin.'
