    titles do not acquire CYTOTOXIC solely from tumor/cancer words. Omit the optional
    class unless inspected evidence supports it. Preserve the exact titles, AIDs 192/220/328,
    all nine Active calls and blank endpoint/value/target/reference fields. Preserve
    the six separate yeast-screen observations and recompute the summary only from
    appropriately classified written evidence; those yeast observations continue to
    support its coarse CYTOTOXIC scope. Do not invent a replacement mechanism or transfer
    Nivalenol's assay.
