  summary: 'Nine exact PubChem observations are Active and all nine are written with
    CYTOTOXIC. Six are NCI yeast anticancer screens (AIDs 155,157,161,165,167,175);
    three are explicitly in-vivo tumor-model screens (AIDs 192,220,328), written at
    bioactivities[0–2]. Every retained endpoint, numeric value, target and reference
    field is blank. The title-based tumor/cancer rule supplies the three in-vivo CYTOTOXIC
    labels without retained endpoint support: this observation-level scope overstatement
    is the finding. It does not reject the Active calls, infer a molecular target,
    deny antitumor or cytotoxic pharmacology, or remove the six separate yeast observations
    that continue to back the coarse summary. Nivalenol''s CCRIS mutagenicity row
    remains unselected context.'
