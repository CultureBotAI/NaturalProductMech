  - repository: CultureBotAI/NaturalProductMech
    path: data/natural_products/terpenoids/4-acetylnivalenol.yaml
    role: Generated affected observations; regenerate after a maintained correction
  ownership_note: Repair the maintained title-classification support boundary, preserving
    retained source observations. Generated-YAML-only changes or reserved decisions.tsv
    do not address the maintained cause.
  normalization_reason: Major because the three generated observation classes overstate
    the scientific scope of retained evidence while native mechanical gates can pass;
    the finding is bounded to those classes, not the structure or general pharmacology.
  disposition_reason: Confirmed from exact saved source observations and current generation
    logic; unavailable external retrieval is not the reason for this support gap.
