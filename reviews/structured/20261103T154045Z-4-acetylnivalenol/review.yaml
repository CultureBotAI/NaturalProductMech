findings:
- finding_id: support-2249-invivo-class-scope
  issue_key: 4-acetylnivalenol-in-vivo-tumor-assays-cytotoxic-class-overstatement
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Three in-vivo tumor-screen observations lack retained support for CYTOTOXIC
    typing
  description: 'bioactivities[0–2] cite AIDs 192,220 and 328 and explicitly describe
    in-vivo NCI tumor-model screens. Their retained rows report Active calls with
    blank endpoint, numeric value, target and reference fields. The broad tumor/cancer
    title pattern supplies CYTOTOXIC despite the classifier''s unambiguous-support
    requirement. The confirmed gap is the observation-level class inference: an in-vivo
    antitumor outcome does not by itself establish a direct cytotoxicity endpoint.
    The enum has no separate CYTOTOXIC definition, and no new schema meaning is inferred.
    This finding neither rejects the Active calls nor denies antitumor or cytotoxic
    pharmacology. Six separate written yeast-screen observations remain and continue
    to support the coarse summary within their own limits.'
  target_ids:
  - naturalproductmech:mibig-9d360a983b
  field_paths:
