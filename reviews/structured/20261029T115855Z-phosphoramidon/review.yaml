findings:
- finding_id: F946-PRODUCER-CONTEXT
  issue_key: phosphoramidon-BGC0002573-native-producer-context
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Phosphoramidon producer attribution conflates the native cluster source with
    the engineered product context
  description: The stored phosphoramidon owner and pinned MIBiG BGC0002573 version2
    row grade Streptomyces mozunensis as BGC_CHARACTERIZED. The cited primary text
    instead identifies native S. mozunensis MK-23 as the talopeptin producer and demonstrates
    phosphoramidon in engineered Streptomyces sp. MK730-62F2 carrying tal genes, using
    host-provided L-rhamnose. The generic note separating locus evidence from taxon
    evidence does not preserve this organism-product distinction. Cluster origin and
    the demonstrated tal locus can remain supported; the cited experiment does not
    establish native S. mozunensis production of this exact phosphoramidon identity.
    This is a source-specific attribution problem, not proof that the organism can
    never produce phosphoramidon.
