- assessment_id: P050-A-EARLY
  area: graph
  topic: SbzP/Q early scaffold annotations and cofactors
  outcome: supported
  summary: SbzP uses NAD as a chemical substrate with SAM, not merely a redox cofactor.
    Current UniProt annotates PLP as its cofactor and methylthioadenosine/protons
    as byproducts. SbzQ hydroxylation uses oxygen and 2-oxoglutarate and yields succinate/CO2.
    The graph explicitly omits cofactors/byproducts and is not a balanced reaction;
    its intermediate numbering follows UniProt. No new exact intermediate structure
    or molecular formula is asserted.
  target_ids:
  - naturalproductmech:mibig-a58ee03ee4
  evidence_ids:
  - P050-OWNER
  - P050-P0DY52
  - P050-P0DY53
- assessment_id: P050-A-SULFAMOYL
  area: graph
  topic: SbzM/J/L sulfamoyl precursor and carrier loading
  outcome: supported
  summary: SbzM annotation describes net L-cysteine oxidation/decarboxylation/rearrangement
    to sulfamoyl aldehyde; the owner does not newly establish every transient step
    or select one metal from the current Fe/Ni annotation. SbzJ oxidizes the aldehyde
    with NAD and water. SbzL performs ATP-dependent acyl loading of holo carriers,
    with AMP/diphosphate byproducts. The owner appropriately distinguishes the unmodified
    native G/K sequences from their Ppant-bearing and acylated states.
  target_ids:
  - naturalproductmech:mibig-a58ee03ee4
  evidence_ids:
  - P050-OWNER
  - P050-P0DY49
  - P050-P0DY46
  - P050-P0DY48
  - P050-P0DY36
  - P050-P0DY47
- assessment_id: P050-A-HANDOFF
  area: graph
  topic: SbzG/K donor use, SbzI and complex scope
  outcome: supported
  summary: Current annotations support SbzL loading onto both G and K in vitro. SbzI
    accepts G, while its K donor use is worded as probable. The graph includes the
    G-to-I handoff and explicitly omits the probable K-to-I edge. SbzI is linked to
    the annotation-defined intermediate 2-to-3 transfer, not directly to final altemicidin
    in that early scheme. Weak carrier–enzyme interaction and a fusion crystal construct
    are not promoted to a naturally stable complex or native carrier interchangeability.
  target_ids:
  - naturalproductmech:mibig-a58ee03ee4
  evidence_ids:
  - P050-OWNER
  - P050-P0DY36
  - P050-P0DY45
  - P050-P0DY47
  - P050-P0DY48
  - P050-2024-CONSTRUCT-SCOPE
- assessment_id: P050-A-LATE
  area: graph
  topic: Late F420 reduction and methylation
  outcome: supported
  summary: SbzF annotates reduction of didehydrodemethylaltemicidin with reduced coenzyme
    F420 carrying a variable gamma-glutamate chain. SbzE methylates demethylaltemicidin
    with SAM to the altemicidin scaffold. The owner deliberately avoids a fixed F420
    chain length, balanced protonation-specific reaction, or unsupported connection
    from intermediate 3 to the late substrate. It does not substitute later SB-203207/208
    congener decoration for altemicidin formation.
  target_ids:
  - naturalproductmech:mibig-a58ee03ee4
  evidence_ids:
  - P050-OWNER
  - P050-P0DY35
  - P050-P0DY34
- assessment_id: P050-A-HNO
  area: graph
  topic: SbzH/N/O participation and omitted genomic neighbors
  outcome: supported
  summary: Current H/N/O entries annotate participation in altemicidin biosynthesis
    but do not independently specify their individual reactions here. The graph uses
    protein/process nodes and asserts neither fixed order nor a complex. The audit
    also confirms two ambiguous residues in excluded SbzA (positions 882 and 927);
    genomic SbzD/R and downstream-congener A/B/C are not assigned new altemicidin
    roles merely from neighborhood.
  target_ids:
