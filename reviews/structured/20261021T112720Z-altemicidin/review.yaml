summary: Primary studies support the exact parent, both historical occurrences and
  the endpoints of four deliberately qualified annotation graphs. Thirteen native
  protein references and all quoted annotations match. The generated locus omits demonstrated
  heterologous-expression and enzyme-assay methods, and the producer omits NCIMB40513.
  One major and one minor finding have guarded maintained repair routes; native, heterologous
  and engineered-construct scopes remain distinct.
