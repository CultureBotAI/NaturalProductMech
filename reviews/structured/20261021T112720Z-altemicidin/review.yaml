    CLUSTER_DEMONSTRATED. Leave the native producer SOURCE_ASSERTION: the 2019 production,
    genetic deletions and isotope feeding occurred in TK21 constructs, while the direct
    final recoupling used purified enzymes. The paper describes the donor lineage
    but does not turn these into native knockout evidence.'
  target_ids:
