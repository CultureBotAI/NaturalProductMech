limitations:
- The full 2021 main article and Extended Data were not obtained. Its official SI
  directly supports the existing bounded endpoint assertions; this packet does not
  reconstruct complete experimental protocols or tag sequences. The unavailable protocol-expansion
  check is non-required because no such claim is asserted by the owner.
- The 2024 Methods names SA-1758 for SbzG/I cloning while its Introduction discusses
  NCIMB40513. This unresolved source provenance discrepancy is preserved and prevents
  equating those assay constructs to the native owner references solely from this
  article.
- The original 1989 −7.6 versus 2019 +7.5 optical-rotation reports differ in conditions
  and sign. Neither a new enantiomer nor a silent typographic correction is inferred.
  The original parent absolute assignment uses a chemically derived crystal.
- The 2019 Methods reverses substrate labels 5/6 in the final-coupling paragraph.
  The 2021 SI also has a Figure14 mutant/metabolite label discrepancy, and its unstable11
  lacks NMR. Compound numbers are scoped to each publication, not globally joined.
- Original source text, selected chromatograms, structures and derivative/X-ray account
  were inspected; raw spectra, crystallographic intensities, molecular-dynamics trajectories
  and complete fusion sequences were not independently reprocessed. Native 13-protein
  identity/current annotations and current chemical/taxonomic authorities are assessed
  separately.
- No historical laboratory-stock sequence or complete tagged/fused/mutant experimental-construct
  reconstruction was established. Current native protein identity is intentionally
  narrower.
- 'Independent new GenPept downloads were unnecessary: the current complete nucleotide
  record provides each stable protein ID and deposited translation, and the full UniProt
  sequence supplies the second sequence comparison. Historical statements that GenPept
  was separately fetched are not relabeled as new downloads.'
- Reaction equations and cofactor/chemical cross-references were inspected as current
  UniProt annotations. No independent direct Rhea endpoint or new exact chemical-structure
  grounding was performed in this protein packet.
- Only the stated 2024 source paragraphs were read independently here; the separate
  scientific packet owns the complete 2019/2021/2024 primary-paper assessment. Historical
  access-failure discussion can retain its original date and be supplemented by the
  newly accessed science without recasting annotation evidence as primary experiments.
- Neutral-parent representation and conjugate-base relationships do not determine
  solution protonation or binding species.
- Current taxonomy provides concept resolution, not a genetic or stock equivalence
  between NCIMB40513 and SA1758.
- Current authority agreement is distinct from original absolute-configuration proof;
  no conclusion is drawn here from the difference in historical optical rotations.
- The configured identifier-label gate accepts 499 warning-level mismatches and 35
  explicit exceptions and skips 4,744 no-adapter pairs; exit 0 does not independently
  verify every identifier or scientific claim.
- The quality suite reports 999 passed, 4 skipped, 2 warnings in 441.24s (0:07:21).
  Skipped tests are not counted as passing tests. Existing ontology caches were used;
  no multi-gigabyte cache download was required.
- Native gates assess deterministic consistency and configured invariants. They do
  not establish biological production, stereochemical specificity, evidence adequacy,
  or literature-level claim support.
- The five reused gates retain their batch004 execution times and cached ontology
  results. Reuse establishes unchanged repository inputs; it is not a new remote authority
  query or new assertion of ontology freshness.
- The ignored-inclusive check enumerates record and saved-review YAML paths, and all
  tracked files are hashed. Generated Python bytecode and external tool caches are
  not claimed to have been independently byte-pinned at the prior execution.
notes:
- No scientific owner, inventory, curation table, native status or history was edited.
  Actions are proposed work.
- Baseline gates retain their actual original receipts after byte-for-byte input verification;
  target strict validation ran afresh. Scientific failed or unavailable checks are
  distinct from bundle validation.
