- The diagnostic attempts one limited chirality-aware substructure match; its empty
  result does not establish full graph or natural identity. Two global undefined-stereo
  warnings are retained without owner attribution.
- Primary references and taxonomy authorities were not newly accessed. Retained source
  citations, cached names/synonyms and exact query negatives have snapshot-limited
  scope.
- Full QC and OAK remain unavailable. No reaction pathway, enzyme or activity is inferred
  from shared BGC membership or classifier labels.
- The whole selected owner was read, but scientific completion is partial because
  full QC, complete ontology authority coverage and external source verification were
  unavailable. No native status or history was changed.
- The branch uses cached base ce6a5498df5be51116bd5e0c119023ee62bb5464. Fresh origin/main
  verification and publication are deferred because the user prohibits all external
  requests.
notes:
- No source correction or record edit is proposed by this qualified local assessment.
- All outbound requests, retries and schedules remain prohibited.
- Saved review coverage is distinct from the native SEEDED/REVIEWED curation state.
