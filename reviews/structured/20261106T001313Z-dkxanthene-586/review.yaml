    chain, two original amides and a carboxylic acid; no carbonyl ester or saturated
    C5O sugar-ring motif is reported. This provides limited structural compatibility
    with the retained alkaloid/peptide/polyketide classifier output and nonglycoside
    prediction. NPClassifier's three pathways, two superclasses and DKXanthenes and
    derivatives/Simple amide alkaloids classes remain computed model claims; their
