    different host backgrounds and acid compound 1 endpoint. Whole-host production
    does not establish individual protein functions, host compensators, cell-free
    sufficiency or a physical complex. The OPEN construct/alias/function discussion
    remains appropriate; maintained-reader fidelity adds no primary-source or sequence
    verification.
