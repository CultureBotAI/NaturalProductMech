    reported rings of 5, 5, 16, 5 and 6 members. The original has four carbonyls,
    two amides and no ester. Reconstruction retains two carbonyls and presents two
    C(OH)=N sites with terminal hydroxyl oxygens. Eight specified and two unspecified
    tetrahedral centers persist, alongside one Z and one E alkene. Original enolic
    C=C bond 22 is potential Unspecified/STEREONONE; reconstructed C=C bond 25 is
    Unknown/STEREOANY. New macrocyclic C=N bond 31 is potential Unspecified; the other
    imine is in the five-membered ring and is not listed as potential double stereo.
    The original stereo_complete:false is therefore retained without assigning new
    natural configurations. Formula, charge, StandardInChI and full key agree, but
    both canonical comparisons are false and the one-way map is empty. This is local
    tautomer-consistent correspondence, not an independent fixed-form identity proof.
    Frontalamide A has one more oxygen and its separate OPEN source discussion is
    not transferred here. Four original undefined-stereo warnings remain globally
    unassigned; they are not attached to an individual record.
