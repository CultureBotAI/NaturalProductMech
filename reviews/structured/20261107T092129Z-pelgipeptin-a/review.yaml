- assessment_id: bgc-2863-representation
  area: representation
  topic: Stored molecular forms and stereochemical scope
  outcome: supported
  summary: 'The saved neutral C52H88N12O12 structure has 76 heavy atoms and 77 bonds.
    Both forms retain a 31-membered ester-containing macrocycle and a separate benzene
    ring. The source form has ten carbonyls, nine secondary amide motifs, one ester,
    a hydroxymethyl OH and three free primary amines. The ester-bearing macrocycle
    carbon has an isopropyl side branch. No metal or sugar-ring motif is encoded;
    peptide residue labels and natural configuration are not inferred from these motifs.
    Both forms retain ten unspecified tetrahedral centres, consistent with stereo_complete:false.
    The InChI-derived form adds nine unspecified potential C=N geometries at its imidic
    sites; these are representation-specific, not nine unresolved C=C bonds in the
    stored source structure. No absolute configuration is invented. All nine source
    secondary amides become C(OH)=N sites in the InChI-derived representation: carbonyl/strict-amide
    counts change from ten/nine to one/zero, retaining the ester carbonyl. For example
    source C1/N2 is an amide, and the derived form contains imidic C40/N55/O65 among
