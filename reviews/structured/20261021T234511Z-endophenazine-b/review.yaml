summary: Native endophenazine B isolation and its neutral constitution are supported.
  The knockout experiments used an introduced locus in Streptomyces coelicolor, a
  cited occurrence concerns a different dihydro compound, and the literal PubChem
  identifier represents a monoanion. These require separate source-specific corrections
  while preserving the positive native and heterologous evidence.
