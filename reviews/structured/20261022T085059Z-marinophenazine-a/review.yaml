summary: The later original marinophenazine A drawing reproduces the retained phenazine
  N-oxide, neutral total charge and geranyl E geometry, with exact current chemical
  authorities agreeing. Positive native CNQ-509 occurrence is retained. Core-locus
  CnqP1 and separately deposited membrane CnqPT1 are distinct, and precursor O-geranylation
  does not prove complete A formation. The documented 60-bp construct extension is
  not an annotation error. Exact locus/product applicability and original isolation/assignment
  evidence remain unresolved without the original full sources.
