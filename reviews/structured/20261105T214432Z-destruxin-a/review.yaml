  area: representation
  topic: representation
  outcome: supported
  summary: Both forms preserve C29H47N5O7, net charge 0, 41 atoms, 42 bonds, six specified
    tetrahedral centers, a 19-member macrocycle and a nitrogen-containing five-member
    ring. The original has five amides and one macrocyclic ester. Its terminal alkene
    ends in CH2 and does not create an unassigned E/Z center. Reconstruction has three
    amides plus two C(OH)=N sites and two additional unspecified imine descriptors.
    No aromatic atoms, C5O sugar-ring candidates or phosphorus occur in the saved
    tables. Both canonical comparisons are false and the attempted atom match is empty.
    These representation differences do not establish a source error or missing natural
    stereochemistry.
