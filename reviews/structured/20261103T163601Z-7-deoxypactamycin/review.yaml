  summary: The versioned NPClassifier row returns Terpenoids, empty superclass/class
    lists and is_glycoside:false, while MIBiG separately records PKS and SACCHARIDE
    classes. The saved SMILES graph is an amino-substituted five-carbon ring with
    five specified centers, two substituted phenyl rings, a urea group, an aryl ketone
    and a benzoate ester C26(=O27)-O25-C24; it has no oxygen in any ring. The InChI-derived
    form changes the urea carbonyl to the imidic N=C(OH) motif, while preserving the
    other ketone and ester. The broad Terpenoids filing is a computed-label applicability
    concern, not direct experimental evidence of an isoprenoid pathway. Preserve the
    raw prediction and distinguish it from these retained structural and source class
    assertions; the present review does not invent a replacement biosynthetic class.
