limitations:
- This local review does not independently establish natural identity, biological
  activity, producing-strain experiments or primary mechanism.
- Producer, locus and citation grades remain at their exact source grain; full QC,
  OAK, live authorities and primary-paper verification are unavailable.
- Both canonical comparisons and the complete 42-index one-way match support local
  stored-form consistency; the diagnostic explicitly leaves independent full graph
  identity false.
- The eight original undefined-stereo warnings are a shared unassigned stream; none
  is allocated to this owner.
- The whole selected owner was read, but scientific completion is partial because
  full QC, complete ontology authority coverage and external source verification were
  unavailable. No native status or history was changed.
- The branch uses cached base ce6a5498df5be51116bd5e0c119023ee62bb5464. Fresh origin/main
  verification and publication are deferred because the user prohibits all external
  requests.
notes:
- No direct companion or identity-comparison owner is assigned. Neither its shared
  taxon nor occurrence in a second organism imports another compound’s mechanism or
  structure.
- All whole-field positive and negative retained query payloads were read. File hashes
  and ownership declarations are verified separately from scientific reading of those
  selected payloads.
- The original gate controller failed before child execution on a missing historical
  ledger; the separately admitted replacement ran the five local gates. This process
  event is not a molecular or source finding.
- Saved review coverage is distinct from the native SEEDED/REVIEWED curation state.
  Proposed actions are not performed edits.
