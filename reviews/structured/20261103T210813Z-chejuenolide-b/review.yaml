  area: representation
  topic: Representation
  outcome: supported
  summary: Both forms are neutral C23H33NO4 with 28 atoms, 28 bonds and a 17-carbon
    macrocycle. The stored form has four specified tetrahedral centres and five E
    alkenes. Both canonical SMILES comparisons are false and the original diagnostic
    atom correspondence is empty. Support's separately attributed complete saved-table
    witness maps N3→N23 with loss of one H and O6→O24 with gain of one H, C4–N3 single→C18=N23
    double, and C4=O6 double→C18–O24 single; other mapped adjacency, rings and retained
    stereo agree. This supports a bounded amide-to-imidic representation explanation,
    with one additional unspecified C=N potential element in the derived form. It
    does not change full_graph_identity_established:false or prove an exact natural
    form. The true source flag has the maintained tetrahedral-centre scope.
