  support: partial
  summary: Axenic PCC 6506 is cultured in BG11. Native DNA supplies anaC/anaD cloned
    into tagged pET28 constructs expressed in E. coli BL21-CodonPlus(DE3) RIPL. AnaC
    activation and AnaD prolyl loading establish early precursor chemistry; they do
