- assessment_id: support-2790-representation-assessment
  area: representation
  topic: Saved molecular forms, stereochemistry and motif scope
  summary: Both forms have C9H11NO7, 17 atoms, 18 bonds, one component and formal
    charge zero. The source aromatic six-ring contains two carbonyls and an NH; the
    InChI-derived form has one carbonyl and a hydroxy site with changed ring-N hydrogen
    placement. Formula, standard InChI and full key agree, but both canonical SMILES
    comparisons are false and no atom correspondence was returned. This is a representation
    limit, not an independently demonstrated chemical defect. The source five-ring
    [9,8,12,11,10] contains four carbons and one oxygen and joins the six-membered
    heterocycle by the C1–C8 bond. Three hydroxyls and an exocyclic hydroxymethyl
    group are retained. Source carbonyls C2=O3 and C5=O6 with N4H become one carbonyl
    at InChI C8=O14 and hydroxy C7–O13H without ring NH. Zero strict amide/ester/imidic
    motifs reflect aromatic-bond predicate limits; zero C5O six-rings does not negate
    the actual C4O five-ring. The C-linked, furanose-like topology does not by itself
    establish a natural sugar assignment. Eight saved comparison flags agree, including
    standard InChI, complete key, formula, charge and atom/bond counts. Both canonical
    isomeric and nonisomeric SMILES comparisons are false. The saved chirality-aware
    correspondence list is empty, complete_atom_count_match is false and full_graph_identity_established
    is false. Equal normalized identifiers do not establish a returned graph map,
    complete tautomer equivalence, natural-sample identity or experimental stereochemistry.
