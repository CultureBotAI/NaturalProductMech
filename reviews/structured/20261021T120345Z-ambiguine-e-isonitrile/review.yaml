  title: Entry-wide enzyme assays overstate exact ambiguine E locus demonstration
  description: BGC0001126:6 inherits Enzymatic assays and therefore CLUSTER_DEMONSTRATED
    for exact ambiguine E. The original official SI instead characterizes common precursors
    and AmbP3 formation of ambiguine A, while explicitly proposing the later oxidative
    route to E. Its native A–F chromatogram supports occurrence but not exact enzyme
    formation or gene necessity. The common upstream cause is entry-wide method propagation
    across congeners; this finding and proposed change are specific to E. The complete
    main body remains unavailable, so no universal absence of later experiments is
    asserted.
