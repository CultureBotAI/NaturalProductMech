    a four-ring polycyclic framework, an aromatic ring bearing two phenolic hydroxyls,
    and two ketones. Four tetrahedral centers are specified. Each of the two nonaromatic
    alkenes has one carbon bearing two methyl groups, so neither constitutes an E/Z
    stereoelement even though the source SMILES contains directional slashes. All
    ten comparisons are true and the original correspondence is complete, while full_graph_identity_established
    remains false. The retained true flag is consistent with the saved stereoelements
    but does not freshly establish the natural stereoisomer.
