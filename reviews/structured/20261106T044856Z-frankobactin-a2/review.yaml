- assessment_id: bgc-2653-representation
  area: representation
  topic: representation
  outcome: supported
  summary: The C34H51N9O12 neutral form contains a 13-member depsipeptide ring, a
    five-member O-C=N-containing ring and a phenyl ring with an adjacent phenolic
    hydroxyl. Six tetrahedral centers are specified. One macrocyclic ester, six amide
    placements, a free primary amine, an N-hydroxyformamide and a separate N-hydroxylated
    amine are present. The side-chain linker contains C(=O)-CH2-CH2-NH-C(=O), distinguishing
    the encoded A2 form from the shorter B2 source encoding. Reconstruction changes
    four amides to imidic hydroxyl motifs while preserving the cyclic C(OR)=N site,
    whose oxygen has degree 2 and no hydrogen; these five motif matches must not be
    counted as five new hydroxyl tautomers. Both saved forms regenerate IBPQKXCUPSWGFW-HNSCFVPZSA-N,
    C34H51N9O12 and net charge 0. Both canonical strings differ and the attempted
    correspondence is empty. The saved mobile-hydrogen/amide-to-imidic changes are
    compatible with this normalized agreement; there is no net protonation change
    or complete graph proof. 6 specified tetrahedral centers persist, while 4 reconstructed
    C=N geometries are unspecified.
  target_ids:
