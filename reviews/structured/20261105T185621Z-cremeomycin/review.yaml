findings:
- finding_id: bgc-2581-inchi-roundtrip-key-instability
  issue_key: cremeomycin-inchi-roundtrip-key-instability
  category: representation
  severity: major
  status: open
  certainty: confirmed
  title: Cremeomycin diagnostic InChI round-trip changes the standard key
  description: 'The accepted saved diagnostic confirms that SMILES regeneration yields
    declared HTCPEWKHGGGJBI-UHFFFAOYSA-N and the declared InChI, while reconstruction
    from that InChI yields aromatic phenoxide/diazonium form IGWQRYHQYGPQLO-UHFFFAOYSA-N
    and a changed mobile-H layer. The atom correspondence is empty. Retained MIBiG/ChEBI
    rows support the stored association and do not identify a wrong field. The confirmed
    issue is diagnostic representation instability; an erroneous record, different
    natural identity and a replacement encoding remain unproven. Severity is major
    because supported stored-form equivalence remains unresolved. It is not a blocker
    or a wrong-identity claim: the retained SMILES regenerates the declared key, and
    no incorrect source field or replacement is established.'
  target_ids:
  - CHEBI:184373
  field_paths:
  - chemical_structure.smiles
  - chemical_structure.standard_inchi
  - chemical_structure.standard_inchi_key
  evidence_ids:
  - bgc-2581-identity
  - bgc-2581-chemistry
  - bgc-2581-diagnostic-acceptance
  - bgc-2581-molecular-reading
  - bgc-2581-query-mibig_compounds
  - bgc-2581-query-chebi_structures
  - bgc-2581-diagnostic-stderr
  disposition_reason: Keep equivalence unresolved pending bounded curator investigation;
    do not automatically rewrite the source or record.
  ownership_note: Potential source or tooling remediation must be determined from
    retained evidence. No record or source edit is proposed or performed by this review.
actions:
- action_id: bgc-2581-investigate-inchi-roundtrip
  description: Investigate the saved cremeomycin round-trip discrepancy locally, distinguishing
    source-field inconsistency from InChI/RDKit reconstruction or normalization behavior.
    Preserve both actual results and the retained source rows; do not prescribe or
    apply a replacement key without evidence. External requests remain prohibited.
  finding_ids:
  - bgc-2581-inchi-roundtrip-key-instability
  target_ids:
  - CHEBI:184373
  ownership_note: The investigation owns interpretation of saved diagnostic and source
    evidence; any eventual maintained-source or tooling change requires separately
    justified scope.
  acceptance_checks:
  - Document the explicit bond-order, formal-charge and mobile-H differences using
    the retained saved forms and exact MIBiG1524/ChEBI44047 rows.
  - Resolve or explicitly retain uncertainty about whether the instability is an input/source
    defect or reconstruction/normalization behavior; normalized formula/charge or
    source-name agreement alone is insufficient.
  - If a change is later justified, identify the maintained owner and exact supporting
    authority, preserve the original evidence, and verify the chosen stored-form/key
    contract with separately authorized local validation.
  - Do not mark natural identity or full graph equivalence established, or close the
    finding as fixed, solely from the present diagnostic.
