- assessment_id: support-2337-pathway
  area: graph
  topic: Pathway
  outcome: supported
  summary: The complete captured owner declares one BIOSYNTHESIS graph with three
    grounded nodes and two directed edges, and one ordered pathway step. Indosespene
    is consumed by XiaI to form xiamycin A; this is a downstream tailoring step rather
    than a complete account of indosespene formation. Every edge and the pathway step
    retain the primary DOI plus two database references. The pathway has singular
    substrate/product fields and no proposed field; absence is preserved rather than
    turned into an invented value. Upstream formation and the alternative oxiamycin
    branch remain explicitly uncurated. The accepted original maintained reader preserves
    the complete owner, this graph and pathway, their ordered evidence and all three
    history events; it does not independently verify the historical scientific claims.
