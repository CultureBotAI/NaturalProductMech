- evidence_id: S154-E-COMM-2004-BBB
  kind: primary_source
  reference: DOI:10.1271/BBB.68.753; Bioscience Biotechnology Biochemistry 68 (2004)
    753–756
  locator: 'All four pages, Tables 1–2 and final Note Added in Proof were read as
    text; original page 1 structures and page 4 nomenclature note were viewed. Retained
    source: /private/tmp/npm-review-work/shared-next-batch016/review-support/attempt-003/communesins2004-bbb.pdf'
  accessed_at: '2026-10-21T19:07:54.504466Z'
  support: supports
  summary: Native P. expansum Link MK-57, isolated from Sakai soil, yielded A/B plus
    three additional compounds from fermented okara. The final Note Added in Proof
    renames manuscript C(3), D(4), E(5) as final D, E, F. Final D(3) is N-formyl B;
    final E(4) is N-desmethyl A; final F(5) is de-epoxy A. Relative configurations
    were correlated with A/B using spectral similarities, not newly established by
    an absolute-hand experiment. Oral silkworm third-instar LD50 values are A 150,
    B 5, final D 300, final E 80 and final F 80 micrograms per gram of diet. These
    are not cell-based IC50 values. The authors explicitly favor original B over oxygen-containing
    nomofungin. The extracted formula for compound 5 in the prose differs from its
    HRFAB annotation; that source inconsistency is retained rather than silently corrected.
  snapshot_sha256: 8badc3ff33881efb6423d3993092de09a2243166548115b61c95d5504700de03
