  summary: Native P. expansum NRRL 976 produces A/B. Native-background cnsA/B/F/C
    disruptions abolish them, with selected precursor-feeding rescue; the experiments
    are not in strain d1. C is isolated from the cnsE mutant; F and new J/K arise
    from cnsJ deletion. The drawing distinguishes C as N-desmethyl B, D as N-formyl
    B, E as N-desmethyl A, and F as de-epoxy A. Purified recombinant CnsF acts on
    tryptophan to form a prenylated precursor. It is not an in-vitro assay forming
    final A/B/C. CnsC-dependent coupling is genetically implicated, with exact biochemical
    roles still under investigation in this paper. Figure 4 explicitly separates the
    main A/B pathway from isolated mutant shunt products. Neither family membership
    nor a shared locus establishes native production of every named congener in the
    assayed stock.
