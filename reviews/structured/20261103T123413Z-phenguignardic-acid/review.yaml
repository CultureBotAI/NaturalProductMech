- assessment_id: support-2218-A6
  area: other
  topic: Computed classification and full-table topology limits
  outcome: supported
  summary: The full paired tables show two phenyl rings and a five-member C3O2 ring
    containing an ester carbonyl and an acetal carbon, plus a terminal carboxylic
    acid and an exocyclic benzylidene double bond. In the SMILES table the cyclic
    ester is C17(=O18)–O19–C7; C7 also binds O8 and has no hydrogen. This is not a
    saturated sugar ring, and the two C–O–C bridges alone do not establish glycosylation.
    NPClassifier retains the shikimate pathway, empty class/superclass arrays and
    false glycoside as versioned predictions rather than missing asserted experimental
    classes.
