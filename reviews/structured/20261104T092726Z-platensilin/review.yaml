- area: representation
  topic: Stored representation and stereochemical scope
  outcome: supported
  assessment_id: support-2380-representation
  summary: Both forms are neutral C24H27NO6, with 31 heavy atoms and 34 bonds. Normalized
    Standard InChI and full key agree, while both canonical-SMILES comparisons are
    false and the chirality-aware atom map is empty. The source linkage C13(=O26)–N14(H)
    corresponds locally to InChI-derived C17(–O27H)=N24, consistent with the canonical
    C(=O)N versus C(O)=N difference. Each form retains four specified tetrahedral
    centers; only the regenerated imidic C=N adds an unspecified double-bond possibility.
    This does not itself prove a source stereo_complete defect or whole-graph identity.
    The complete tables show a five-membered carbocyclic ring within the polycyclic
    scaffold, two further six-membered carbocyclic rings, and a separate aromatic
    ring bearing two hydroxyls and a carboxylic acid. Its structure remains distinct
    from Platencin despite equal formula and shared BGC.
