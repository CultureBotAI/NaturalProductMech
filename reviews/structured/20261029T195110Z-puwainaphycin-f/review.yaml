  structure. Whole saved-graph and primary-text comparison supports a planar correspondence
  with Minutissamide B, while the named puwainaphycin F standard in the other paper
  is unchlorinated C53H87N13O15 and a separate chlorinated congener matches only composition.
  This is a provisional major naming/structure-correspondence concern. Source-specific
  producers, proposed stereochemistry and Minutissamide B HT-29 activity remain separate;
  no rename or structure replacement is proposed.
