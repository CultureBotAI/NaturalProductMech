  area: representation
  topic: Representation
  outcome: supported
  summary: Both saved forms are neutral C25H41NO6S with 33 atoms and 34 bonds, two
    six-membered carbocycles, three scaffold hydroxyls, a thioether-linked amino-acid
    side chain, carboxylic acid and conjugated diene. The stored SMILES has N26–C27(=O29);
    the InChI-derived form has N25=C15–O26H. The explicit manual table witness preserves
    the remaining adjacency, bond properties, rings and seven tetrahedral neighbor-parity/CIP
    assignments, with only these two bond orders and N/O hydrogen counts changed.
    Both retain the E alkene; the decoded imidic C=N adds one unspecified potential
    double-bond stereoelement. The original isomeric and nonisomeric canonical-SMILES
    comparisons remain false, and its original substructure map is empty. Equal standard
    InChI/key and formula do not prove fixed-graph or natural-tautomer identity. The
    source true stereo flag describes the stored representation under the extractor’s
    tetrahedral-center predicate, not fresh natural stereochemical proof.
