limitations:
- Full scientific main text through the experimental proteomics section and the relevant
  official SI were inspected. The bibliography, all unrelated Table S4 rows and a
  separate raw quantitative Supplementary Dataset 1 were not independently audited;
  published table values were not recomputed from raw spectra.
- The paper’s MIC protocol references an earlier method; this review confirms the
  reported approximate value, microtiter method, triplicates and controls but does
  not invent unreported dilution/exposure details.
- The primary study supplies correlation, not a demonstrated reaction series. Original
  contig and current neighborhood support locus-level mapping, while exact historical
  IsaA start/protein identity remains unresolved (341 aa in the paper, 392 aa in current
  annotation). The official SI file listing/embedded-file check and focused searches
  did not supply a peptide-level bridge; no exact native protein example is asserted.
- The current prenyltransferase annotation has 392 residues while primary IsaA is
  reported as 341. The original submission contains no NODE_180 CDS features or proteomics
  peptides, so exact experimental protein/start-site equivalence is not established.
  Locus association is a separate, explicitly bounded inference from the original
  contig and unique adjacent pair. Matching the 502-residue IsaB length likewise does
  not establish experimental peptide identity.
- No raw proteomics reanalysis, NMR reprocessing or biochemical reconstitution was
  performed. Database origin metadata does not add a second primary isolation.
- The configured full identifier-label gate accepts 499 warning-level taxon-label
  mismatches, 35 explicit exceptions and 4,722 no-adapter pairs across the corpus;
  its exit 0 is not independent verification of every identifier or of this record's
  scientific claims.
- The quality suite skips the optional sibling AntibioticMech checkout comparison
  because the isolated clone has no sibling checkout, and skips three command-frontmatter
  cases because their parameter sets are empty. Pinned-hash and network governance
  checks still ran.
- Shared native gates assess deterministic corpus consistency and configured invariants.
  They do not establish biological production, stereochemical specificity, evidence
  adequacy or literature-level claim support.
- Baseline reuse concerns the identical committed inputs and original executed checks;
  it does not claim a fresh network/governance or ontology-cache refresh.
notes:
- No scientific owner, inventory, curation table, native status or history was edited.
  Actions are proposed work.
- Baseline gates retain their actual original receipts after byte-for-byte input verification;
  target strict validation ran afresh. Scientific failed or unavailable checks are
  distinct from bundle validation.
