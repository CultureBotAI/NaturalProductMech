limitations:
- The Choi 2009 main article was available only as an official subscription preview.
  Its abstract, published structure image and supplementary captions/text were inspected,
  but full isolation/assay methods and independent reinterpretation of the supplied
  spectra were not performed.
- The grounding absence check is restricted to the full committed eligible ChEBI inventory,
  searched with ignored-file exclusions disabled. The current directly inspected exact
  ChEBI match has two stars; no exhaustive search across every current ChEBI structure
  is claimed.
- The temporary RDKit result is retained as a content-hashed calculation output and
  its substantive values are recorded above; it establishes internal chemical consistency,
  not experimental identity on its own.
- 'Free-source access failures were worked around through official alternatives: the
  PubChem interactive page failed while its API succeeded; Wikidata entity-JSON access
  failed while the source page succeeded. No paid content or provider credits were
  used.'
- The exact primer-to-genome boundary alignment was not performed; the 9.7 kb versus
  14.4 kb interval difference and gene-inventory discrepancy are directly documented,
  while a final replacement class and coordinates remain curation work.
- Negative native extracts apply only to the conditions used by Greunke et al.; they
  do not establish incapacity under all conditions.
- The GenBank response uses a current 2026 annotation and thus is used for accession/strain/coordinate
  resolution and annotation context, not to silently replace the pinned MIBiG v3 gene
  inventory.
- The configured full identifier-label gate accepts 499 warning-level taxon-label
  mismatches, 35 explicit exceptions and 4,722 no-adapter pairs across the corpus;
  its exit 0 is not independent verification of every identifier or of this record's
  scientific claims.
- The quality suite skips the optional sibling AntibioticMech checkout comparison
  because the isolated clone has no sibling checkout, and skips three command-frontmatter
  cases because their parameter sets are empty. Pinned-hash and network governance
  checks still ran.
- Shared native gates assess deterministic corpus consistency and configured invariants.
  They do not establish biological production, stereochemical specificity, evidence
  adequacy or literature-level claim support.
- The configured ontology gate skips unsupported adapters and permits 499 corpus-wide
  taxon-label warnings; its exit zero is not universal identifier verification.
- The bounded review does not independently reinterpret raw NMR spectra or certify
  native production beyond inspected experimental conditions.
notes:
- No owner, inventory, component, curation status or history was edited. Follow-up
  actions are proposals only.
- The initial review listing lacked eleven historical commits; those were fetched
  and the 91 existing bundles then validated successfully. Initial local chemistry
  tooling lacked RDKit; exact lockfile dependencies were installed only in the isolated
  environment before the successful chemistry check.
- Native SEEDED status remains unchanged; a saved scientific review does not satisfy
  every native REVIEWED gate.
