  title: NRPS-labelled source interval does not describe the experimentally demonstrated
    phenazine operon
  description: 'The source assigns NRPS/Type I to a 14.4 kb region containing an annotated
    NRPS. The cited experiment instead demonstrates an eleven-gene 9.7 kb ehp phenazine
    operon. A faithful source copy therefore leaves a material scope mismatch: the
    record does not explain which portion was tested or that the experimental pathway
    lacks an NRPS in its reported gene inventory. Missing heterologous evidence and
    strain context are grouped here as the same claim-level reconciliation. This does
    not prove native production, invalidate the accession, or justify automatically
    deleting every source NRPS assertion.'
