- area: consistency
  topic: Versioned classification applicability
  outcome: concern
  summary: The versioned model retains Terpenoids/Triterpenoids/Lanostane, Tirucallane
    and Euphane triterpenoids, whereas MIBiG separately asserts Higher terpenoid.
    The accepted C34 encoding includes two acetate esters, so total carbon count alone
    does not establish a higher-terpenoid core. Its saved carbon-ring set contains
    one five-membered and two six-membered rings; this makes the specific named-family
    output an applicability concern requiring stronger structural grounding, not an
    established source-ingestion defect. Ester bridges are distinct from glycosidic
    links, and no separate sugar residue or saturated C5O candidate cycle is identified;
    is_glycoside false remains compatible with the examined encoding.
