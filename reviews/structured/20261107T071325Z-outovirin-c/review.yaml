- assessment_id: support-2849-representation-assessment
  area: representation
  topic: Saved molecular forms and stereochemical scope
  summary: Both saved forms are neutral C21H24N2O9S3 with 35 atoms and 39 bonds in
    one component. Both canonical SMILES agree. Two amide carbonyls, an N-methyl group,
    an N–O bridge, a methoxylated phenyl ring and the sulfur-containing ring network
    are retained. Six reported symmetric ring rows overlap; their independent cycle
    rank is five, calculated as bonds minus atoms plus one. Four reported rows have
    six atoms and two have eight atoms, reflecting the longer sulfur bridge. SMILES
    C3–S4–S5–S6–C7 is the three-sulfur bridge. Carbonyls C8=O9/N1 and C19=O20/N18
    remain; N1 carries methyl C0 and N18–O17–C16 is the N–O connection. Methoxy oxygens
    O30/O32 and phenolic O34 retain the aromatic substitutions. The strict motifs
    contain two amides, no ester, no free primary amine, no N-acetyl group, no saturated
    C5O candidate sugar and no phosphorus. Those predicates do not define every biochemical
    class. The two current Outovirin forms preserve the same counted seven assigned
    tetrahedral sites and non-sulfur element totals, but A has C–S–C and C has C–S–S–S–C
    connectivity. Their full keys and sulfur formulas are distinct. This direct companion
    comparison does not merge natural identities, transfer assays or establish an
    interconversion reaction. Both canonical SMILES comparisons agree and the limited
    35-atom map is complete; full_graph_identity_established nevertheless remains
    false. Normalized identifiers, formula agreement and local parsing do not establish
    independent full graph identity, natural-sample identity, experimental absolute
    stereochemistry or primary biological validation.
