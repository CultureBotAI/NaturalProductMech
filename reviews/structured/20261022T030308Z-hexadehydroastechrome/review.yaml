  reference proteins support the hexadehydroastechrome biological claims. Its encoded
  three E side chains are not reconciled with the original native-cis inference, which
  differs from the extracted trans ligand. This is a provisional structure-support
  concern; incomplete direct complex spectroscopy does not justify automatically selecting
  a replacement metal graph.
