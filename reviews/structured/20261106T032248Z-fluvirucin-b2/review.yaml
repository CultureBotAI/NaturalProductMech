  summary: 'Both neutral C25H48N2O5 forms contain 32 atoms and 33 bonds, one 14-membered
    ring and one saturated six-membered C5O ring. The original lactam C9(=O10)–N11
    becomes reconstructed C23(OH29)=N26, with hydroxyl O29 of degree one and one hydrogen;
    the reconstruction adds one unspecified C=N potential-stereo entry. Both forms
    contain zero ester motifs. Five specified C5O-ring centers persist, while four
    macrocyclic centers remain unspecified: original C2/C6/C15/C18 and reconstructed
    C16/C18/C17/C19. Original exocyclic O21 connects macrocycle C18 to C5O-ring C22;
    the corresponding reconstructed bridge is O31 between C19 and C24. The ring carries
    an amino substituent, two hydroxyls and a methyl group. These explicit attachments
    support a bounded glycoside-like topology, without assigning a sugar name or beta
    configuration. Formula, charge, StandardInChI and key agree; both canonical strings
    differ and the saved map is empty. Four original undefined-stereo warnings remain
    globally unassigned; they are not attached to an individual record.'
