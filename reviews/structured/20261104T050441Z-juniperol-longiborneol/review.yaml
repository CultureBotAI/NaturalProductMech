- assessment_id: bgc-2342-mechanism
  area: graph
  topic: Partial retained mechanism
  outcome: supported
  summary: 'The one retained BIOSYNTHESIS graph has three nodes and two edges: FPP
    CHEBI:175763 is cyclized by CLM1 UniProtKB:I1S104, which forms this owner identifier.
    Pathway step 1 uses the same substrate, enzyme and product. Its four evidence
    objects retain the CLM1 yeast expression/longiborneol characterization experiment
    plus three database mapping sources. This is a partial retained conversion and
    does not expand downstream culmorin oxidation or import the companion product’s
    chemistry. The explicit decision to withhold RHEA:83907 is scientifically material
    because that reaction fixes a stereoisomer more specifically than this record.
    The accepted original maintained reader preserves the complete returned owner,
