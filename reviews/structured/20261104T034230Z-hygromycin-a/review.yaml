- assessment_id: support-2336-classification
  area: consistency
  topic: Classification
  outcome: concern
  summary: NPClassifier npclassifier.gnps2.org@2026-09-07 faithfully supplies Terpenoids,
    empty superclass/class lists and is_glycoside:true, while both MIBiG entries assert
    SACCHARIDE as the BGC class. This oxygen-rich glycosidic/aminocyclitol topology
    and saccharide provenance make the broad model filing an applicability concern,
    without proving a source-identity error or authorizing a directory change. The
    five-membered C4O ring at SMILES atoms 3/4/5/32/34 and its O6 connection from
    C5 to aromatic C7 are explicitly present. An empty six-membered C5O detector therefore
    cannot refute glycoside applicability. The model output remains versioned and
    separate from asserted classification.
