- assessment_id: support-2336-representation
  area: representation
  topic: Representation
  outcome: supported
  summary: 'Both saved forms are neutral C23H29NO12 with 36 heavy atoms, 39 bonds
    and one connected component. The complete topology includes a hydroxylated five-membered
    oxygen heterocycle attached through an O bridge to a phenolic aromatic ring, a
    conjugated side-chain linkage, an acetyl ketone, and a hydroxylated aminocyclitol
    bearing a cyclic methylene acetal. The explicit saved-table witness maps SMILES
    amide C15(=O16)-N17H to reconstructed InChI C21(-O31H)=N23: only two hydrogen
    cells and two bond orders differ under the manually transcribed 36-atom map. All
    remaining mapped atom attributes, adjacency, ring vertex sets, ten tetrahedral
    neighbor-parity/CIP assignments and the E alkene are retained. The reconstructed
    imidic C=N adds one unspecified double-bond slot. Both canonical-SMILES equality
    flags remain false and the original chirality-aware atom map remains empty; the
    manual witness does not replace those results or establish natural identity. The
    source stereo_complete:true is not treated as proof of every geometry in every
    normalized tautomer.'
