- assessment_id: bgc-2773-representation
  area: representation
  topic: Stored molecular forms and stereochemical scope
  outcome: supported
  summary: 'Both saved forms contain 97 atoms and 101 bonds. The ring basis has 23-
    and 14-membered peptide/ester cycles, a five-membered pyrrolidine and two aromatic
    six-rings. The two ester links are C28(=O29)-O27-C26 and C41(=O42)-O43-C1. Eleven
    amide sites, free acids C55(=O56)-O57H and C58(=O59)-O60H, a thioether C77-S78-C79,
    a phenol and a hydroxymethyl substituent are explicit. SMILES N96 is a free primary
    amine; motif-listed N74/N75 are guanidine nitrogens, not two additional ordinary
    alkylamines. This supports the encoded bicyclic depsipeptide topology; it does
    not independently demonstrate the retained ribosomal biosynthesis claim or an
    enzyme-inhibitory function. Thirteen specified tetrahedral centres occur in each
    form; SMILES C1 is R and the other twelve listed centres are S. The InChI form
    has eleven additional unspecified double-bond potentials: ten at imidic C=N sites
    and one at the relocated guanidine C=N. None is a newly observed carbon-carbon
    alkene. The true source flag follows atom-centred chirality only; full natural
    stereochemical confirmation remains unavailable. Ten amides become terminal C(OH)=N
    sites, reducing carbonyl/amide counts from 15/11 to 5/1; the tertiary pyrrolidine
    amide, two esters and two acids remain. Separately, the SMILES guanidine C73=N72
    bond to the chain-bound nitrogen is represented as InChI C59=N61 to a terminal
    nitrogen, with hydrogen redistribution. Thus eleven added potential double-bond
    rows do not mean eleven imidic sites. Formula, charge, normalized Standard InChI
    and full key agree, but canonical strings differ and the limited map is empty;
    exact graph/natural identity is unestablished.'
  target_ids:
  - naturalproductmech:mibig-1971f7cb72
  evidence_ids:
  - bgc-2773-identity
  - bgc-2773-chemistry
  - bgc-2773-molecular-reading
  - bgc-2773-diagnostic-acceptance
  - bgc-2773-diagnostic-stderr
  - bgc-2773-stereo-policy
  dimensions:
  - name: stereochemistry_scope
    definition: Specified and unspecified saved stereochemical features, including
