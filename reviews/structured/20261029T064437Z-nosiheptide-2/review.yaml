summary: 'Nosiheptide entry911: exact local provenance and saved encoding consistency
  are supported within a partial review. The retained full key MQWDKYHFGBWGQZ-MQVPCCJGSA-N
  and /b23-5-,49-38+ geometry remain distinct from record912. The article reports
  an NOS formula C51H43N13O12S6 and HPLC/MS identification, consistent with the retained
  formula. Its introduction cites earlier crystallographic and NMR work for structure/configuration;
  those separate sources and figure pixels were not reanalysed. This reading therefore
  does not resolve the two retained geometries or the five unspecified tetrahedral
  centres and does not justify a merge. PMC2763056 reports NOS production in Streptomyces
  actuosus ATCC25421 and experimental involvement of the nos locus: nosG disruption
  and nosM deletion abolished production, with nosM complementation partially restoring
  it; nosH, nosL, nosN and nosP perturbations provide further gene-level support.
  The own reported sequence is FJ438820. The NosL carbon rearrangement mechanism,
  alternative NosN substrate/timing models and several attachment/tailoring reactions
  remain proposed. Complete article text, table text and captions were read; figure
  pixels, spectra and the separate supplement were not independently analysed.'
