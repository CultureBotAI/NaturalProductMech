summary: Stieleriacine A1 is exact original compound 1 from native Stieleria maiorica
  Mal15. Its amino-acid alkene is Z and the acyl-chain alkene is E, distinct from
  A2; the source model matches retained identity. The locus remains explicitly putative,
  with genetic testing left for future work. The nomenclatural correction preserves
  the stock identities and is not a new biosynthetic experiment. Both bounded chemical
  and biological scopes are completed at the existing conservative grades, without
  quantitative assay or detailed mechanism claims.
