summary: The complete baumannoferrin A owner and source lineage are internally consistent,
  and the primary abstract positively reports the named compound from native A. baumannii
  AYE. Its literal NPAtlas NPA032594 cross-reference encodes C27H42N4O12, whereas
  the owner encodes C28H44N4O13; the connectivity difference is a confirmed major
  exact-equivalence defect. The existing guarded xref-exclusion consumer can withhold
  that assertion while preserving the raw source and current owner. Original structure
  drawings, formula and detailed methods remain unavailable, so the authentic constitution
  is unresolved and this review is partial. Empty-method producer and locus grades
  remain source-faithful.
