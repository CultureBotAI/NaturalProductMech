- assessment_id: support-2868-representation-assessment
  area: representation
  topic: Saved forms and stereochemical scope
  summary: Both saved forms are neutral C21H22N2O8S with 32 atoms and 37 bonds. A
    monosulfide bridge, epoxide, two tertiary amide carbonyls and N-O-C ring remain.
    Seven symmetric ring rows overlap; the independent cycle rank is six. The sulfur
    bridge is SMILES C9-S10-C11 and InChI C15-S31-C20. The epoxide is SMILES C13-O14-C15
    and InChI C19-O29-C11. Carbonyls C23=O24 and C28=O29 remain at InChI C17=O25 and
    C18=O26. The N-methyl group, N-O-C ring and dimethoxyphenol/secondary hydroxyl
    persist. No chlorine, ester, imidic motif, free primary amine, phosphorus or metal
    is present. Literal topology is not an inferred biosynthetic conversion. Both
    canonical SMILES comparisons are true and the saved chirality-aware map covers
    all atoms, but it is one limited substructure comparison. In every case full_graph_identity_established
    remains false. Normalized identifiers, formula agreement and local parsing do
    not establish independent full graph identity, natural-sample identity, experimental
    absolute stereochemistry or primary biological validation.
