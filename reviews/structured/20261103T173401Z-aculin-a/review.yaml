- assessment_id: bgc-2265-classification
  area: consistency
  topic: Classification
  outcome: concern
  summary: 'MIBiG retains PKS, while NPClassifier npclassifier.gnps2.org@2026-09-07
    returns Terpenoids / Sesquiterpenoids / Daucane sesquiterpenoids and is_glycoside:true.
    The schema defines the latter as a named/versioned computed prediction, and the
    seeder copies it faithfully. Full topology shows a C5O cyclic hemiacetal: SMILES
    O26 lies between C25 and C27, C27 bears free OH31, and the ring attaches through
    C24–C23–C21(=O22)–N20 rather than through that hemiacetal oxygen. This candidate
    ring does not by itself establish a sugar residue or glycosidic linkage. The model''s
    applicability is therefore limited; the prediction is preserved and no raw-identity
    or source-filing defect is inferred solely from this comparison.'
