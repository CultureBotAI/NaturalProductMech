limitations:
- The full original article body and all figures/table were inspected in source preparation
  and target-specific passages/pixels re-inspected here; original access times are
  retained. The inaccessible JBC PDF route does not prevent full-body inspection.
- Native coelicolor production is an author/source assertion inferred from donor genes
  and heterologous/enzyme results; no coelicolor native knockout or direct native
  culture isolation is asserted. This is not evidence of universal absence.
- The exact terminal aldoxime-to-nitrile catalyst remains unknown. The paper supplies
  a proposed host-dependent dehydration, not purified terminal conversion or a minimal
  two-protein system.
- The native protein references are checked separately from the N-terminal His8 assay
  constructs; no exact full vector/linker reconstruction is implied.
- iModulon searches concern one source dataset and selected keywords, not complete
  component memberships or experimental metabolite/chemistry validation.
- The current exact-key ChEBI candidate is two-star and not substituted; the bounded
  authority search does not claim no unpublished or differently indexed submission
  exists.
- This packet independently verifies the two requested native protein sequences and
  precursor groundings. Enzyme specificity, actual culture observations and proposed
  terminal conversion require the separate primary-paper assessment.
- Native UniProt proteins are not the complete recombinant N-terminal His8 constructs.
  Vector-derived residues and cloning junctions were not reconstructed in this packet.
- The downloaded MIBiG GenBank artifact is wider than the stored BGC bounds. CDS mapping
  uses its explicit original offset; artifact length is not treated as a corrected
  experimental cluster boundary.
- Current species and Wikidata mappings do not equate A3(2), TK23, TK24 and 1326 or
  prove an S. albidoflavus occurrence. Historical naming alone does not replace an
  exact strain bridge.
- No exact stable identifiers were selected for the two ungrounded intermediates during
  this bounded task. Their explicit ungrounded state is preserved; this is not a universal
  claim that no such identifier exists.
- The configured full identifier-label gate accepts 499 warning-level taxon-label
  mismatches, 35 explicit exceptions and 4,722 no-adapter pairs across the corpus;
  its exit 0 is not independent verification of every identifier or of this record's
  scientific claims.
- The quality suite skips the optional sibling AntibioticMech checkout comparison
  because the isolated clone has no sibling checkout, and skips three command-frontmatter
  cases because their parameter sets are empty. Pinned-hash and network governance
  checks still ran.
- Shared native gates assess deterministic corpus consistency and configured invariants.
  They do not establish biological production, stereochemical specificity, evidence
  adequacy or literature-level claim support.
- Baseline reuse concerns the identical committed inputs and original executed checks;
  it does not claim a fresh network/governance or ontology-cache refresh.
notes:
- No scientific owner, inventory, curation table, native status or history was edited.
  Actions are proposed work.
- Baseline gates retain their actual original receipts after byte-for-byte input verification;
  target strict validation ran afresh. Scientific failed or unavailable checks are
