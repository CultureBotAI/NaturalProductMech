  accessed_at: '2026-10-21T08:30:44.189257Z'
  support: supports
  summary: SCO7467/7468 were PCR-cloned from coelicolor A3(2) genomic DNA and introduced
    into S. lividans TK23 as pSCO103. Preparative isolation of exact 2 used the transformed
    TK23 broth. Empty-vector and SCO7467-only cultures yielded negligible 2, so this
    was a gene-dosage experiment in a metabolically capable host. The authors state
    biosynthetic ability for both organisms, but the described product-isolation experiment
    is not a native coelicolor culture isolation. No universal absence claim follows.
  snapshot_sha256: f195eed5ef9127b33fa1ed814cd49b455cb56f63a50a3f43009db03d6febef01
- evidence_id: E025-IDENTITY
  kind: primary_source
  reference: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=3617294&retmode=xml
  locator: Isolation and Structural Determination of 5-DMAIAN; spectral-data section;
    Figure 2D
  accessed_at: '2026-10-21T08:30:44.189257Z'
  support: supports
  summary: Two liters of transformed TK23 broth yielded 8.9 mg compound 2. NMR and
    high-resolution MS establish the exact C5-prenyl indole-3-acetonitrile, formula
    C15H16N2; observed [M+H]+ 225.1385 versus calculated 225.1386. The C2/C6 prenyl
    nitriles 5/6 are different products of separate enzyme assays, not the isolated
    culture compound 2.
  snapshot_sha256: f195eed5ef9127b33fa1ed814cd49b455cb56f63a50a3f43009db03d6febef01
- evidence_id: E025-ASSAY67
  kind: primary_source
  reference: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=3617294&retmode=xml
