  accessed_at: '2026-10-21T08:30:44.189257Z'
  support: supports
  summary: Purified N-terminal His8-SCO7467 from E. coli BL21(DE3) transfers dimethylallyl
    from DMAPP onto C5 of L-tryptophan 3 to give structurally assigned 5-DMAT 4. The
    standard assay used 1 mM each substrate, 1 mg/mL enzyme, 100 mM Tris pH 8, 30
    °C, 10 min. Activity persists with EDTA. IAN 1 instead yields minor C2/C6 nitriles
    5/6; direct IAN→exact 5-DMAIAN is not the assigned route.
  snapshot_sha256: f195eed5ef9127b33fa1ed814cd49b455cb56f63a50a3f43009db03d6febef01
- evidence_id: E025-ASSAY68
  kind: primary_source
  reference: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=3617294&retmode=xml
