  kind: primary_source
  reference: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=3617294&retmode=xml
  locator: 'Experimental Procedures: culture conditions and construction; Table 1;
