limitations:
- ChEBI's current and pinned SMILES export fails RDKit kekulization; its full default
  InChI parses to the exact valid owner structure. No invalid owner SMILES was found.
- The NPAtlas official response was inspected through the web tool after direct download
  returned HTTP 403; no local full-response checksum is claimed.
- Current UniProt annotations verify the PhnAB graph's stated annotation basis. This
  assessment does not reinterpret the historical primary subunit experiments or prove
  a native oligomeric stoichiometry.
- Reference sequence equivalence is not proof of historical assay-construct, experimental-stock
  or mutant sequence identity.
- PA14 PqsH differs from PAO1 at residue 91; any PA14 MBP-fusion assay must retain
  its strain and construct scope when used alongside the PAO1 reference graph.
- The 1999 occurrence source was available as a complete abstract but not full primary
  body through the official XML endpoint; the exact species-level association is explicit
  there. No detailed structure-elucidation method is inferred.
- The 2008 occurrence citation is a secondary review, treated as bibliographic synthesis
  rather than an independent primary experiment.
- The 2006 reporter full HTML, caption and methods were inspected after the direct
  PDF returned HTTP 403. No quantitative figure extraction or independent visual image
  inspection is claimed.
- Native-reference mapping does not establish historical construct sequences; the
  existing PhnAB graph remains explicitly annotation-based and includes by-similarity
  evidence.
- Official 2002 PMC efetch returned metadata only and direct PMC rendering alternated
  between content and a browser challenge. Detailed primary Methods, Tables 1/4 and
  Figure 1 caption were inspected through the indexed primary page; no new visual
  inspection of that TLC image is claimed.
- The 2010 enzymology paper was retrieved in complete primary XML and its methods
  inspected. Identity review confirms one native PA14/PAO1 amino-acid difference;
  neither reference sequence alone verifies the historical MBP assay construct.
- PqsH RXN-file download was forbidden, but the official Rhea page and current UniProt
  reaction annotations were accessible and matched.
- precise411 was unavailable through the installed runner because its regulator field
  failed typed parsing; this does not establish absence of relevant components or
  genes.
- Component 15 was assessed only at its returned search annotation, which concerns
  pyochelin/secretion; its detailed membership was not inspected because it did not
  materially support the exact PQS claim.
- The dataset strain description was verified in the primary publication. Individual
  sample identities, current raw expression matrices, ICA recomputation and direct
  regulator binding were not audited.
- Coexpression/component membership does not independently establish exact product
  chemistry, biosynthetic necessity, purified-enzyme activity or native protein-complex
  assembly.
- The configured full identifier-label gate accepts 499 warning-level taxon-label
  mismatches, 35 explicit exceptions and 4,722 no-adapter pairs across the corpus;
  its exit 0 is not independent verification of every identifier or of this record's
  scientific claims.
- The quality suite skips the optional sibling AntibioticMech checkout comparison
  because the isolated clone has no sibling checkout, and skips three command-frontmatter
  cases because their parameter sets are empty. Pinned-hash and network governance
  checks still ran.
- Shared native gates assess deterministic corpus consistency and configured invariants.
  They do not establish biological production, stereochemical specificity, evidence
  adequacy or literature-level claim support.
notes:
- No scientific owner, source inventory, component, native status or seed history
  was edited. A qualified passing review does not promote native status to REVIEWED.
- The minor finding concerns a resolvable source-method omission; the actual producer,
  reaction and cellular reporter claims have positive evidence. The optional precise411
  parser failure does not invalidate those independent sources.
