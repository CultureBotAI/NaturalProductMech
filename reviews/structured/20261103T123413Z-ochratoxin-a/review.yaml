- finding_id: bgc-2215-vp16-enzyme-class
  issue_key: ochratoxin-a-vp16-transcription-counterscreen-enzyme-class-overstatement
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: VP16 transcription counterscreen lacks enzyme-inhibition support
  description: 'Written bioactivities[12], AID2546, joins retained PubChem row6803:
    ACTIVE VP16 counterscreen of RORγ transcription, generic Potency22.3872µM and
    ungrounded NP_035411. The generic inhibitors-of regex assigns ENZYME_INHIBITOR
    without a catalytic-inhibition endpoint. This finding concerns that optional class
    alone. The SYK viability observations are already unclassified; four separately
    written NSD2-labelled active observations retain coarse summary backing without
    proving isolated enzyme kinetics. No claim of absent inhibitory pharmacology is
    made.'
