- assessment_id: bgc-2771-representation
  area: representation
  topic: Stored molecular forms and stereochemical scope
  outcome: supported
  summary: Both saved forms contain 61 atoms and 63 bonds in one component. The SMILES
    ring basis contains a 19-membered ester-containing peptide ring, an N–N six-membered
    ring and a methoxy-substituted aromatic six-ring. The ester is C40(=O41)-O39-C37;
    seven amide sites include the side-chain N-formyl C32(=O33)H, so seven amides
    are not seven assigned residues. E additionally has ring C2-O3H. Two carbon-O-carbon
    bridges are the aryl methoxy oxygen and ring ester, with no C5O sugar-ring candidate.
    This supports the encoded cyclic depsipeptide scaffold without assigning every
    natural residue or biosynthetic step. Nine specified tetrahedral centres occur
    in each form. The SMILES centres C0/C2/C9/C13/C26/C30/C37/C42/C50 have S/S/R/R/S/S/R/S/S
    assignments. Five unspecified C=N potentials appear only in the InChI-derived
    imidic form. The source stereo_complete:true is consistent with the atom-centred
    extractor policy, not certification of these representation-dependent bond geometries
    or natural absolute configuration. Five N-H amides, including the formamide, are
    represented as terminal C(OH)=N sites in the InChI reconstruction. Carbonyl/amide
    counts change from 8/7 to 3/2; the two tertiary amides and ester remain. Formula,
    charge, normalized Standard InChI and full key agree, while both canonical SMILES
    comparisons are false and the one-way map is empty. Exact graph identity remains
    unestablished; this mobile-H representation difference alone is not a source defect.
