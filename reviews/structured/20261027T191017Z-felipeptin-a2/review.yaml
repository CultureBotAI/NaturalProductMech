  support: context_only
  summary: The main text repeats filA1 for both precursors, gives PDB 6XTH/6XTI where
    the Figure 2 caption and resource section give 6TXH/6TXI, and applies generic
    Trp5/Arg12 NOE wording that does not literally match the listed A2 sequence. These
    are source ambiguities, not resolved coordinates or proof of a false owner structure.
    All detailed methods are delegated to unread Document S1. The main text reports
    partial A2 thermal unthreading after 20 hours at 95°C, supported by a new peak
    with the same mass and altered fragmentation intensities. Both peptides are reported
    resistant to carboxypeptidases B and Y. Supporting supplemental chromatograms
    and methods were not inspected; those study conditions do not establish physiological
    or formulation stability.
