  snapshot_sha256: e53f70f8ab26e9fc0620804c81262ff34aca071d9bfb9da82ad6c62d88e5626f
  support: supports
  summary: The main article distinguishes marginal, statistically insignificant individual-peptide
    effects from synergistic increases in viable MCF7, HCT116 and A375 cancer-cell
    numbers for some combinations. It reports weak, nonsynergistic effects in tested
    BJ fibroblasts and mesenchymal stem cells. FACS and immunoblot results link combination
    treatment to cell-cycle progression and lower total/phosphorylated Rb. These observations
    do not establish direct Rb binding or inhibition by either isolated peptide. Felipeptin
    pretreatment increased doxorubicin responses in the tested cell and colony systems,
    including selected resistant MCF7 cells. This is a sequential combination-treatment
    result, not evidence that isolated A1 or A2 is directly cytotoxic, generally reverses
    resistance, or has established clinical efficacy.
