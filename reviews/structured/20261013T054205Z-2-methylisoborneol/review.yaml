findings:
- finding_id: F1
  issue_key: 2mib-occurrence-phormidium-426436-strain-scope
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Species-labelled Phormidium occurrence points to a specific strain taxon
  description: The occurrence names Phormidium tenue without a strain, but NCBITaxon:426436
    is Phormidium tenue BDU 40061 in the pinned authority. The inherited LOTUS triple
