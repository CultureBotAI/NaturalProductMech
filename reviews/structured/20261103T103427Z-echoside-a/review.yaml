  area: other
  topic: Computed classification and full-table topology limits
  outcome: supported
  summary: The pinned NPClassifier model reports Terphenyls/p-Terphenyls and is_glycoside
    true. Saved topology shows three phenyl rings joined through two C–C bonds to
    opposite positions of the central ring, a pendant saturated C5O candidate and
    a methyl ester. The SMILES linkage C6–O7–C8 connects the candidate ring to an
    aryl carbon; C2(=O3)–O1–C0 is the methyl ester, distinct from the ring oxygen
    O5. This supports a bounded glycoside-like topology and p-terphenyl scaffold description,
    while exact biochemical residue naming and natural stereochemistry require their
    own evidence. NRPS annotation is not a structure-derived peptide assertion.
