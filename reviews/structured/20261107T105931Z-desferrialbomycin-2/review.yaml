- assessment_id: S288-2876-mechanism
  area: graph
  topic: Pathway ownership, actors and target-evidence scope
  summary: The returned BIOACTIVITY view retains nine nodes/eight edges, one owner-producing
    AbmA–AbmR summary step, one target and two histories. The proposed field is absent,
    not false. Ornithine, serine and uridine precursor edges and the grounded abm
    cluster are curated assertions; the single step is not a complete enzyme reconstruction.
    FhuA/FhuD remain ungrounded. Fe(III) binding and transport cite PMID:22704654/10850805/387415,
    with PMID:10742172 on FhuA→FhuD. The FhuA note explicitly concerns ferric-complexed
    albomycin; intracellular cleavage releases a different warhead. Apo ligand, ferric
    complex and inhibitor are distinct actors. Reader equality preserves those qualifications
    without validating receptor specificity, coordination geometry or cleavage experimentally.
  outcome: supported
