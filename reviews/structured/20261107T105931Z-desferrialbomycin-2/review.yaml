- assessment_id: S288-2876-representation
  area: representation
  topic: Complete saved-form chemical interpretation
  summary: 'Both neutral C37H60N12O18S forms contain 68 atoms and 69 bonds in one
    component, with no metal, a saturated five-member C4S ring and a six-member N
    heterocycle. SMILES ten carbonyl sites/nine strict amide placements become five
    carbonyl sites/three strict amide placements plus five C(OH)=N sites: four secondary
    peptide amides and the terminal carbamoyl group change representation. The carbamoyl
    carbon originally contributes two N-linked amide placements. Three N-acetyl groups
    and one free acid remain. All ten tetrahedral centres are specified; one original
    unspecified exocyclic C=N remains and the derived form has six unspecified double
    candidates after those five shifts. The true stereo_complete flag has atomic-centre
    scope. A zero C5O motif count does not deny the sulfur-containing sugar-like ring.
    Both canonical isomeric and nonisomeric SMILES comparisons are false while normalized
    Standard InChI/key, declared key, formula, charge and atom/bond counts agree.
    The saved chirality-aware atom map is empty and full_graph_identity_established
    is false. Motif-level interpretation does not establish full graph or natural-sample
    identity.'
