  area: representation
  topic: Saved molecular forms and stereochemical scope
  summary: Both neutral single-component saved forms have 100 atoms and 105 bonds,
    formula C64H82ClN13O22. A 19-membered ester macrocycle, a saturated five-membered
    nitrogen ring, phenyl and hydroxyphenyl rings, and a chlorinated indole are retained.
    The SMILES form has 14 carbonyls and 11 amide motifs; the InChI-derived form has
    four carbonyls, one amide and ten C(OH)=N motifs. One ester, two neutral carboxylic
    acids and one nonamide primary amine persist. These explicit tautomer differences
    explain false canonical comparisons without determining natural identity. SMILES
    ester carbon 95 connects through O94 to C93; the five-membered N ring is 1–2–3–97–98.
    Neutral acids are C59/O60/O61 and C78/O79/O80; primary amine N77 is attached to
    C76. Chlorine 34 attaches to indole carbon 33. InChI retains acid carbons 44 and
    62, ester C63/O99/C25, primary amine N65 and chlorine 64. Ten imidic sites include
    C52=N66 in the former primary-amide side chain; the sole retained amide is C61–N77.
    No residue sequence, biological target or pathway is assigned from these motifs.  Both
    canonical SMILES comparisons are false; the chirality-aware map is empty and complete_atom_count_match/full_graph_identity_established
