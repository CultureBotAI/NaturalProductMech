limitations:
- Only retained owner/source rows and accepted original local outputs were used. Current
  publications, database records, sequences, taxon authorities and complete ontology
  grounding were not independently verified.
- Kutzneride7 and5 share formula and same-form nonisomeric strings but differ in full
  keys and isomeric strings. In each same-form comparison, atom48 of the SMILES and
  atom20 of the reconstructed form are S for7 versus R for5; the literal t21 signs
  are − versus +. No cross-form atom correspondence or natural-sample identity is
  established. Both canonical comparisons and full identity remain false; empty maps
  do not resolve the three amide/imidic differences. Nine specified tetrahedral centres
  in each form; three reconstructed C=N entries are unspecified. The encoded centre
  distinguishing Kutzneride7 from5 is retained.
- KtzQ/R annotations concern two precursor steps, with distinct graph/pathway chemical
  identifiers. Historical evidence labels and reader success do not establish all
  congener-specific synthesis. Two diagnostic warnings are globally unassigned; full
  QC/OAK/live primary checks remain unavailable.
- The whole selected owner was read, but scientific completion is partial because
  full QC, complete ontology authority coverage and external source verification were
  unavailable. No native status or history was changed.
- The branch uses cached base ce6a5498df5be51116bd5e0c119023ee62bb5464. Fresh origin/main
  verification and publication are deferred because the user prohibits all external
