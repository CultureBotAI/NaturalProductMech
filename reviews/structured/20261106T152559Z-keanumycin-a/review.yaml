- assessment_id: bgc-2723-representation
  area: representation
  topic: Stored molecular forms and stereochemical scope
  outcome: supported
  summary: A single 28-membered macrocycle contains the ester C32(=O33)-O31-C30. The
    terminal acid is C50(=O52)-O51H, primary amines N7/N25, and a chloromethyl branch
    C55-Cl56 is retained. The acyl tail has adjacent OH-bearing carbons C61 and C63;
    the additional tail OH distinguishes the stored A structure from B, whose formula
    has one fewer oxygen. No candidate C5O ring or N-acetyl motif is present. Both
    forms retain twelve specified tetrahedral centers and one Z alkene; nine extra
    unspecified C=N entries occur only after reconstruction. The A-tail local CIP
    labels cannot be compared as if the different B graph had identical atom priorities.
    Both neutral C49H84ClN11O19 forms agree in normalized InChI/key and counts. Eleven
    carbonyls/nine amides in stored SMILES become two carbonyls/no strict amides plus
    nine terminal C(OH)=N sites in the InChI form. The ester and terminal carboxylic
    acid remain carbonyl-bearing. Canonical comparisons are false and the limited
    map is empty.
