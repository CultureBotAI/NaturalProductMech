summary: Linamarin has concordant retained encodings and a matching retained ChEBI
  row. Saved own PubMed abstracts support cyanogenic-glucoside pathway context in
  Lotus and compound-specific terminal glucosylation in cassava. The current graph
  represents two parallel cassava enzyme alternatives. Exact natural configuration,
  current authority identifiers and the placeholder MIBiG locus links remain incompletely
  verified. The separate cassava-leaf/Raji-cell paper is presently title-only evidence.
  A major provisional finding identifies unresolved claim-specific citation placement
  on the Lotus producer and BGC0001316 locus assertions.
