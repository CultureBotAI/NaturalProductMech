  summary: 'Retained MIBiG version 4 rows assert Lotus japonicus (NCBITaxon:34305;
    BGC0001316) and Manihot esculenta (NCBITaxon:3983; BGC0001318) as producers, each
    with SOURCE_ASSERTION. PMID21707799 supports Lotus cyanogenic-pathway genetics
    at family level and mentions cassava gene co-localization; its abstract does not
    name linamarin. PMID21736650 names cassava linamarin and supports the two terminal
    UGT activities. The bioactivity DOI remains COMPOUND_BIOACTIVITY evidence and
    does not establish the Lotus locus. Both seeded citation placements need claim-specific
    qualification: the Lotus producer and cluster use a cassava bioactivity title
    that does not support a Lotus origin or locus; the Manihot producer and cluster
    use a Lotus-focused abstract whose cassava co-localization statement is contextual
    support, not exact linamarin isolation, configuration or retained-locus proof.
    The curated Manihot terminal graph separately uses the compound-specific PMID21736650/DOI04695.x
    source. These evidence-placement limits do not negate either producer assertion.'
