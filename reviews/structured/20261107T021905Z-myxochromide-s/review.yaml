- assessment_id: bgc-2803-graph
  area: graph
  topic: Partial Mch scaffold biosynthesis and historical sequence evidence boundaries
  outcome: supported
  summary: The complete accepted Myxochromide S owner contains one explicitly partial
    BIOSYNTHESIS graph with seven nodes, six edges and 17 edge-evidence placements,
    plus three numbered pathway steps, all proposed:true, with 14 evidence placements.
    MchA, MchB and MchC contribute to an ungrounded scaffold-biosynthesis process
    that assembles the owner compound; this does not encode isolated enzyme substrate/product
    assays or a complete assembly sequence. The three NCBI protein groundings are
    CAG28678.1, CAG29031.1 and CAG29032.1. Retained steps describe 2,166-, 3,057-
    and 4,468-aa proteins and preserve historical exact-sequence assertions for the
    latter two DW4/3-1 examples E3FG12/E3FG13. MchA E3FG11 is explicitly a 2,157-aa
    alternative-start-site example, not the exact CAG28678.1 sequence. Deleted UniProt
    identifiers and dated NCBI/UniProt/MIBiG checks remain history, not new verification.
    PRIMARY_EXPERIMENT labels and gene-inactivation descriptions attached to DOI:10.1002/cbic.200400282
    are retained source annotations; the primary paper and sequence resources were
    not independently reopened. The OPEN four-entry shared-structure discussion remains
    unresolved. All six histories and every graph/pathway evidence placement were
    read. The one successful maintained call proves complete owner preservation and
    structural consistency only; it does not establish catalysis, historical accession
    validity or the natural identity of every source concept.
