limitations:
- Fresh source-authority, primary publication, sequence and strain verification remain
  unavailable. Full QC/OAK were not run; retained experimental grades stay source-attributed.
- Both original stored forms agree in normalized Standard InChI, full key, formula,
  charge and counts, but both canonical comparisons are false and the limited map
  is empty. Five strict amides in the SMILES become imidic C(OH)=N sites in the saved
  InChI form, leaving one tertiary amide and the ester. This supports an explicit
  representation limitation, not exact graph identity, an alternative corrected structure
  or independent confirmation of the natural compound. Four undefined-stereo warnings
  remain globally unassigned; no message is attributed to this owner.
- The saved SMILES specifies six tetrahedral centres (S at 19, 25, 34, 39 and 44;
  R at 20) and seven E chain double bonds. Five new unspecified C=N potential-stereo
  rows arise in the InChI imidic representation. The source true stereo flag covers
  its atom-centred predicate only; historical biosynthetic labels do not fill unspecified
  geometric layers.
- Saved topology supports the encoded molecule without independently establishing
  every natural residue, biosynthetic reaction or pharmacological mechanism.
- The accepted reader proves complete preservation and maintained structural consistency,
  not scientific validity of every grounding or primary claim. The Mch scaffold is
  partial, all three steps remain proposed, the process is ungrounded and the OPEN
  four-entry identity discussion remains unresolved.
- The whole selected owner was read, but scientific completion is partial because
  full QC, complete ontology authority coverage and external source verification were
  unavailable. No native status or history was changed.
- The branch uses cached base ce6a5498df5be51116bd5e0c119023ee62bb5464. Fresh origin/main
  verification and publication are deferred because the user prohibits all external
  requests.
notes:
- No record, source table, native scientific status or curation history is modified.
  Corrections, if later justified, belong in maintained source/curation/extractor
  ownership; curated mechanism changes require validated writing and attributed history.
- This author interpreted retained original outputs only, with zero molecular parses,
  source-query replays, target runs or outbound requests.
- Saved review coverage is distinct from the native SEEDED/REVIEWED curation state.
