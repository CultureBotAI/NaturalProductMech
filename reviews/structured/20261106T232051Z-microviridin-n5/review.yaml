  area: representation
  topic: Saved molecular forms, stereochemistry and motif scope
  summary: Both saved forms have C92H126N20O26, 138 atoms, 146 bonds, one component
    and charge zero. Source counts are 20 carbonyls, 15 amides, two esters, two acids
    and one ketone; the InChI-derived form retains six carbonyls and one tertiary
    amide with 14 C(OH)=N sites. The ketone and both esters persist. Normalized identifiers
    agree while both canonical SMILES comparisons are false and the saved atom map
    is empty. Nine ring rows include network cycles of 15, 23 and 26 atoms, an indole,
    two aromatic six-membered rings, a pyrrolidine and a five-membered carbocycle.
    The source carbocycle contains atoms 114–118 and is adjacent to ketone C119=O120.
    Ester motifs occur at C10/O12/C13 and C106/O108/C109; acid motifs at C47/O49 and
    C97/O99. Source N54 is a free primary amine, whereas N96 is part of the guanidine.
    There is no N-acetyl motif, phosphorus or saturated C5O six-ring in the saved
    tables. These are local saved-form indices, not an inferred cross-form map. Eight
    saved comparison flags agree, including standard InChI, complete key, formula,
    charge and atom/bond counts. Both canonical isomeric and nonisomeric SMILES comparisons
    are false. The saved chirality-aware correspondence list is empty, complete_atom_count_match
    is false and full_graph_identity_established is false. Equal normalized identifiers
