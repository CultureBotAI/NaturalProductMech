summary: The complete owner and captured inventories reproduce the exact chlorizidine
  A structure, including the native parent crystal-supported absolute configuration.
  Native Streptomyces sp. CNH287 isolation is supported, but the imported native-producer
  knockout method overstates experiments performed in heterologous S. coelicolor M512.
  Purified Clz9 catalysis and heterologous genetic evidence support the cluster at
  their documented experimental scope; one major finding proposes guarded source-level
  correction without changing any scientific record.
