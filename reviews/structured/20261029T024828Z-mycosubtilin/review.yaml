    annotated alpha-amino-acid units and a separate beta-amino-fatty-acid unit. Its
    alpha side-chain motifs comprise four Asn-like, one Gln-like, one Tyr-like, one
    Pro-like and one Ser-like unit. The cited own PMID 10557314 and matching PMC23941
    abstract explicitly describe mycosubtilin as the seven-residue Asn-Tyr-Asn-Gln-Pro-Ser-Asn
    cycle linked to beta-amino fatty acid. The extra alpha unit is a material constitutional
    identity conflict under the named mycosubtilin/source assertion. This is not a
    mere stereochemical omission or counting of the lipid as an alpha residue. The
    abstracts directly support the conflict despite the held full-body route. No atom
    deletion, corrected stereostructure, lipid congener, replacement key or migration
    is adopted.'
