  20542 and the separate introduced A. nidulans host. The reported 2:1 S:R structural
  material came from the introduced host; neither that ratio nor FAC-context deletion
  evidence is transferred universally to native material. Figure 2C is a bounded product
  depiction, not an absolute-hand assignment. Exact variety/stock and MT376588.1 coordinate
  applicability remain open, as do the limited chemical packet and held authorities.
