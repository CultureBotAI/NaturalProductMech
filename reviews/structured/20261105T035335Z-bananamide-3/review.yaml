- Retained local evidence only; no fresh literature, taxonomy, protein/strain, assay-protocol
  or natural-identity validation.
- Eight true normalized comparisons coexist with two false canonical SMILES comparisons
  and an empty direct atom map. Full-graph identity was not established.
- Tetrahedral stereochemistry remains unspecified; any stored Z alkene assignment
  is narrower than complete configuration.
- Fourteen undefined-stereo warnings are global and unattributed. Motif counts depend
  on the saved tautomer representation.
- Full QC and complete OAK authority coverage remain unavailable; source producer,
  occurrence, locus and model assertions retain distinct scopes.
- The whole selected owner was read, but scientific completion is partial because
  full QC, complete ontology authority coverage and external source verification were
  unavailable. No native status or history was changed.
- The branch uses cached base ce6a5498df5be51116bd5e0c119023ee62bb5464. Fresh origin/main
  verification and publication are deferred because the user prohibits all external
  requests.
