- area: consistency
  topic: Versioned classification applicability
  outcome: supported
  summary: 'The stored graph is compatible with broad cyclic depsipeptide and lipopeptide
    descriptions: a 19-membered ring contains amide linkages and an ester, and an
    external amide links a hydroxylated hydrocarbon acyl tail. The SMILES form has
    9 amide motifs and no candidate saturated six-membered C5O sugar ring. One of
    the nine amides is the side-chain C(=O)N group, so motif count is not a peptide-residue
    count. NPClassifier version npclassifier.gnps2.org@2026-09-07 reports Cyclic peptides,
    Depsipeptides and Lipopeptides, with is_glycoside=false. These computed categories
    remain distinct from source BGC class NRPS and the UNCLASSIFIED filing. The model
    pathway label Polyketides is not evidence of a PKS locus. Representation-dependent
    motif counts and incomplete stereochemistry limit more specific structural or
    biosynthetic assignments.'
