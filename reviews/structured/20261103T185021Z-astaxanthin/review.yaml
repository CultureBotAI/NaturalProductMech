findings:
- finding_id: bgc-2272-hydroxy-source-name-structure
  issue_key: astaxanthin-hydroxy-source-name-structure-provenance-conflict
  category: nomenclature
  severity: major
  status: open
  certainty: confirmed
  title: The retained 2-hydroxyastaxanthin source name conflicts with the represented
    O4 structure
  description: MIBiG physical row 726/BGC0000630 version 3 calls the compound (2R,3S,3'S)-2-hydroxyastaxanthin
    while carrying the same complete key as CHEBI:40968 astaxanthin. The owner preserves
    that name as a RELATED_SYNONYM and source_concepts[0].source_label and already
    has an OPEN name-disagreement discussion. Complete saved paired tables and the
    ChEBI definition agree on C40H52O4 with two ketones and two 3/3′ alcohols; the
    position-2 ring carbons are methylenes with no oxygen neighbor and no extra 2R
    centre. The extra hydroxyl/centre implied by the source name is therefore absent.
    This is a confirmed local provenance conflict, not proof that the current structure
    or ChEBI definition is wrong. It leaves compound-specific Paracoccus producer
    and BGC attribution unresolved until the upstream name/structure association is
    checked; no choice of corrected field or biological contradiction is asserted.
  target_ids:
  - CHEBI:40968
  field_paths:
