    with two S alcohol centres. The exact MIBiG row 726/BGC0000630 version 3 shares
    that full key but calls the compound (2R,3S,3′S)-2-hydroxyastaxanthin; the owner
    preserves this as a RELATED_SYNONYM and source concept and already has an OPEN
    name-disagreement discussion. The extra 2-hydroxyl and 2R centre implied by the
    name are absent from the complete saved topology. The conflict is confirmed locally,
    while which upstream name or structure needs correction remains unproved.
