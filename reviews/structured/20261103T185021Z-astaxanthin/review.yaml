  area: representation
  topic: Representation
  outcome: supported
  summary: Both forms are neutral C40H52O4 with 44 atoms, 45 bonds, one fragment and
    two six-membered terminal rings joined by the polyene chain. SMILES C14 and C38,
    corresponding to InChI atoms 34 and 35, are S. Nine acyclic double bonds are specified
    E in the saved bond tables; local Bond_Cis/Bond_Trans potential descriptors use
    atom ordering and are not competing E/Z assignments. Ten comparison flags and
    the complete stored correspondence agree. This establishes stored-form consistency,
    not natural identity or resolution of the hydroxyastaxanthin source dispute.
