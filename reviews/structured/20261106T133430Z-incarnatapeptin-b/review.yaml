    acetal region; they do not establish two independent sugar residues. Of three
    broad O-bridge hits, O4 is the ester oxygen and O57/O60 are internal acetal connections.
    Both saved forms retain eleven specified and two unspecified tetrahedral centres.
    Stored atoms 51 and 54 (reconstructed atoms 23 and 38) remain unassigned, consistent
    with stereo_complete=false. Two reconstructed imidic C=N bonds add unspecified
    double-bond entries. A changed form-specific CIP label is not treated as inversion
    without atom correspondence. C39H63N9O13, neutral charge, Standard InChI and full
    key agree, but both canonical comparisons are false and the attempted map is empty.
    Seven carbonyls/six amides become five carbonyls/four amides plus two terminal
    C(OH)=N sites (reconstructed C30/N42/O49 and C36/N43/O55), each degree-one OH/H1
    with imidic N/H0. The ester persists. These are explicit mobile-H representation
    differences; no net protonation or full graph equivalence is asserted.
